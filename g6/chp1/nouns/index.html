<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouns Sorting Game - FIXED ENGINE</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#dff6ff,#fff7c2);
}

/* WORD BANK */
#words{
display:flex;
flex-wrap:wrap;
gap:6px;
padding:10px;
background:#fff3d6;
border-bottom:2px solid #ccc;
position:sticky;
top:0;
z-index:999;
min-height:70px;
}

/* WORD */
.word{
padding:6px 10px;
background:#ffd966;
border-radius:10px;
font-weight:bold;
font-size:13px;
cursor:grab;
user-select:none;
touch-action:none;
}

/* GRID */
.container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:8px;
}

/* BASKETS */
.box{
background:linear-gradient(145deg,#ffffff,#eaf6ff);
min-height:90px;
border-radius:14px;
border:2px dashed #4aa3df;
position:relative;
padding:6px;
overflow:hidden;
}

.box::before{
content:attr(data-label);
position:absolute;
top:-10px;
left:6px;
background:#2196F3;
color:white;
padding:2px 6px;
border-radius:10px;
font-size:10px;
}

/* INSIDE WORD */
.inside-word{
display:inline-block;
margin:3px;
padding:4px 6px;
background:#c8f7c5;
border-radius:6px;
font-size:12px;
font-weight:bold;
}

/* END SCREEN */
#endScreen{
display:none;
text-align:center;
padding:30px;
}

button{
padding:10px 14px;
border:none;
border-radius:10px;
background:#4CAF50;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}
</style>
</head>

<body>

<div id="words"></div>

<div class="container">

<div class="box" id="proper" data-label="Proper"></div>
<div class="box" id="common" data-label="Common"></div>
<div class="box" id="collective" data-label="Collective"></div>
<div class="box" id="material" data-label="Material"></div>
<div class="box" id="abstract" data-label="Abstract"></div>
<div class="box" id="countable" data-label="Countable"></div>
<div class="box" id="uncountable" data-label="Uncountable"></div>

</div>

<div id="endScreen">
<h1>🎉 Game Completed</h1>
<h2 id="result"></h2>
<button onclick="location.reload()">Play Again</button>
</div>

<script>

const nouns=[
{w:"Mumbai",t:"proper"},
{w:"Riya",t:"proper"},
{w:"Peacock",t:"common"},
{w:"Doctor",t:"common"},
{w:"Forest",t:"common"},
{w:"Bunch",t:"collective"},
{w:"Cricket Team",t:"collective"},
{w:"Class",t:"collective"},
{w:"Army",t:"collective"},
{w:"Silver",t:"material"},
{w:"Iron",t:"material"},
{w:"Courage",t:"abstract"},
{w:"Honesty",t:"abstract"},
{w:"Happiness",t:"abstract"},
{w:"Pencil",t:"countable"},
{w:"Oxygen",t:"uncountable"},
{w:"Sugar",t:"uncountable"},
{w:"Bread",t:"uncountable"},
{w:"Tea",t:"uncountable"},
{w:"Salt",t:"uncountable"}
];

let totalWords = nouns.length;
let correctPlaced = 0;
let score = 0;

function shuffle(a){
return a.sort(()=>Math.random()-0.5);
}

/* LOAD WORDS */
function loadWords(){
const box=document.getElementById("words");
box.innerHTML="";

shuffle(nouns).forEach(n=>{
const d=document.createElement("div");
d.className="word";
d.textContent=n.w;
d.dataset.type=n.t;
d.draggable=true;

/* DRAG START */
d.ondragstart=e=>{
e.dataTransfer.setData("type",n.t);
e.dataTransfer.setData("text",n.w);

/* remove from bank safely */
setTimeout(()=>d.remove(),50);
};

box.appendChild(d);
});

/* DROP ZONES */
document.querySelectorAll(".box").forEach(b=>{
b.ondragover=e=>e.preventDefault();

b.ondrop=e=>{
let type=e.dataTransfer.getData("type");
let text=e.dataTransfer.getData("text");

if(!text) return;

if(type===b.id){

const el=document.createElement("div");
el.className="inside-word";
el.textContent=text;
b.appendChild(el);

score++;
correctPlaced++;

/* 🔥 FINAL FIX: END GAME CHECK */
if(correctPlaced === totalWords){
endGame();
}

}
};
});
}

/* END GAME */
function endGame(){

document.getElementById("endScreen").style.display="block";

document.getElementById("result").innerHTML=
"Score: " + score + " / " + totalWords +
"<br>Accuracy: " + Math.round((score/totalWords)*100) + "%";
}

loadWords();

</script>

</body>
</html>
