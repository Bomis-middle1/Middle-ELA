<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouns Sorting Game</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#c2f0ff,#fff3b0);
}

/* WORD BANK */
#words{
display:flex;
flex-wrap:wrap;
gap:6px;
padding:10px;
background:#fff7d6;
border-bottom:2px solid #ccc;
position:sticky;
top:0;
z-index:1000;
min-height:60px;
}

/* WORDS */
.word{
padding:6px 8px;
background:#ffd966;
border-radius:8px;
font-weight:bold;
cursor:grab;
user-select:none;
font-size:13px;
}

/* BASKET GRID */
.container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:8px;
}

/* SMALL BASKETS (FIXED) */
.box{
background:linear-gradient(145deg,#ffffff,#eaf6ff);
min-height:85px;   /* SMALL SIZE */
border-radius:14px;
border:2px dashed #4aa3df;
box-shadow:0 6px 12px rgba(0,0,0,0.12);
position:relative;
padding:6px;
font-size:12px;
overflow:hidden;
}

/* LABEL */
.box::before{
content:attr(data-label);
position:absolute;
top:-10px;
left:6px;
background:#2196F3;
color:white;
padding:2px 6px;
border-radius:12px;
font-size:9px;
}

/* WORD INSIDE BASKET */
.inside-word{
display:inline-block;
margin:3px;
padding:4px 6px;
background:#c8f7c5;
border-radius:6px;
font-size:12px;
font-weight:bold;
}

/* MOBILE */
@media(max-width:600px){
.container{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<!-- WORD BANK -->
<div id="words"></div>

<!-- BASKETS -->
<div class="container">

<div class="box" id="proper" data-label="Proper"></div>
<div class="box" id="common" data-label="Common"></div>
<div class="box" id="collective" data-label="Collective"></div>
<div class="box" id="material" data-label="Material"></div>
<div class="box" id="abstract" data-label="Abstract"></div>
<div class="box" id="countable" data-label="Countable"></div>
<div class="box" id="uncountable" data-label="Uncountable"></div>

</div>

<script>

const nouns=[
{w:"Mumbai",t:"proper"},
{w:"Riya",t:"proper"},
{w:"Peacock",t:"common"},
{w:"Doctor",t:"common"},
{w:"Forest",t:"common"},
{w:"Bunch",t:"collective"},
{w:"Cricket Team",t:"collective"},
{w:"Class",t:"collective"},
{w:"Army",t:"collective"},
{w:"Silver",t:"material"},
{w:"Iron",t:"material"},
{w:"Courage",t:"abstract"},
{w:"Honesty",t:"abstract"},
{w:"Happiness",t:"abstract"},
{w:"Pencil",t:"countable"},
{w:"Oxygen",t:"uncountable"},
{w:"Sugar",t:"uncountable"},
{w:"Bread",t:"uncountable"},
{w:"Tea",t:"uncountable"},
{w:"Salt",t:"uncountable"}
];

function shuffle(a){
return a.sort(()=>Math.random()-0.5);
}

/* LOAD WORDS */
function loadWords(){
let box=document.getElementById("words");
box.innerHTML="";

shuffle(nouns).forEach(n=>{
let d=document.createElement("div");
d.className="word";
d.textContent=n.w;
d.dataset.type=n.t;
d.draggable=true;

/* DRAG START */
d.ondragstart=e=>{
e.dataTransfer.setData("type",n.t);
e.dataTransfer.setData("text",n.w);

/* REMOVE FROM TOP BANK */
setTimeout(()=>d.remove(),50);
};

box.appendChild(d);
});

/* DROP ZONES */
document.querySelectorAll(".box").forEach(b=>{
b.ondragover=e=>e.preventDefault();

b.ondrop=e=>{
let type=e.dataTransfer.getData("type");
let text=e.dataTransfer.getData("text");

if(type===b.id){
let el=document.createElement("div");
el.className="inside-word";
el.textContent=text;
b.appendChild(el);
}
};
});
}

loadWords();

</script>

</body>
</html>
