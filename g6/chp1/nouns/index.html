<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Noun Explorer Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg,#fff3cd,#d0f0ff,#ffd6e7);
}

.screen {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: white;
    z-index: 999;
    text-align: center;
    padding: 20px;
}

#logoScreen img {
    width: 250px;
}

#topicScreen {
    font-size: 30px;
    font-weight: bold;
    color: #ff4d6d;
    display: none;
}

#instructionScreen {
    display: none;
    font-size: 18px;
    line-height: 1.6;
}

#gameContainer {
    display: none;
    padding: 10px;
}

.header {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    font-weight: bold;
}

#questionBox {
    background: white;
    padding: 20px;
    margin: 10px;
    border-radius: 15px;
    font-size: 20px;
    min-height: 100px;
}

.option {
    background: white;
    margin: 10px;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid #ccc;
    cursor: pointer;
}

.option:hover {
    background: #f0f8ff;
}

#finalScreen {
    display: none;
    text-align: center;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
}

button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 10px;
}

.startBtn { background: #28a745; color: white; }
.restartBtn { background: #007bff; color: white; }
.endBtn { background: #dc3545; color: white; }

.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: red;
    top: 0;
    animation: fall 2s linear forwards;
}

@keyframes fall {
    to { transform: translateY(100vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen">
    <img src="assets/innovine-logo.png">
</div>

<!-- TOPIC -->
<div id="topicScreen" class="screen">
    🌟 Noun Explorer Challenge 🌟
</div>

<!-- INSTRUCTION -->
<div id="instructionScreen" class="screen">
    <h2>🎯 How to Play</h2>
    <p>
        Read each sentence carefully.<br><br>
        The <b>highlighted word</b> is the noun to focus on.<br><br>
        Tap the correct type of noun.<br>
        Earn points and reach the winning level 🏆
    </p>
    <button class="startBtn" onclick="startGame()">Start Game</button>
</div>

<!-- GAME -->
<div id="gameContainer">

    <div class="header">
        <div id="qCount">1/10</div>
        <div id="timer">80</div>
    </div>

    <div id="questionBox"></div>
    <div id="options"></div>
</div>

<!-- FINAL -->
<div id="finalScreen">
    <div class="card">
        <h2 id="scoreText"></h2>
        <p id="remark"></p>
        <p id="timeTaken"></p>
        <p id="attempts"></p>

        <button class="restartBtn" onclick="restartGame()">Restart</button>
        <button class="endBtn" onclick="location.reload()">End</button>
    </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

/* ---------------- QUESTIONS WITH BOLD WORDS ---------------- */
let questions = [
{
q:"The <b>committee</b> decided to organize a science fair.",
options:["Common Noun","Proper Noun","Collective Noun","Abstract Noun"],
answer:2
},
{
q:"<b>Copper</b> is used to make electrical wires.",
options:["Common Noun","Material Noun","Countable Noun","Collective Noun"],
answer:1
},
{
q:"<b>Friendship</b> becomes stronger when people trust each other.",
options:["Common Noun","Proper Noun","Material Noun","Abstract Noun"],
answer:3
},
{
q:"The <b>children</b> visited the museum.",
options:["Uncountable Noun","Collective Noun","Countable Noun","Material Noun"],
answer:2
},
{
q:"We need more <b>sand</b> to complete the model.",
options:["Material Noun","Countable Noun","Uncountable Noun","Collective Noun"],
answer:2
},
{
q:"<b>Ms. Sharma</b> encouraged students.",
options:["Common Noun","Collective Noun","Proper Noun","Abstract Noun"],
answer:2
},
{
q:"The <b>garden</b> is filled with flowers.",
options:["Common Noun","Proper Noun","Material Noun","Collective Noun"],
answer:0
},
{
q:"A <b>fleet</b> of ships arrived.",
options:["Common Noun","Countable Noun","Material Noun","Collective Noun"],
answer:3
},
{
q:"<b>Knowledge</b> helps people make wise decisions.",
options:["Common Noun","Material Noun","Abstract Noun","Proper Noun"],
answer:2
},
{
q:"The temple floor was built using <b>marble</b>.",
options:["Countable Noun","Common Noun","Material Noun","Collective Noun"],
answer:2
}
];

let current=0, score=0, time=80, timer;
let totalTime=0, attempts=0;

/* ---------------- SPLASH FLOW ---------------- */
setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("topicScreen").style.display="flex";

    setTimeout(()=>{
        document.getElementById("topicScreen").style.display="none";
        document.getElementById("instructionScreen").style.display="flex";
    },3000);

},5000);

/* ---------------- START GAME ---------------- */
function startGame(){
    document.getElementById("instructionScreen").style.display="none";
    document.getElementById("gameContainer").style.display="block";
    loadQuestion();
}

/* ---------------- LOAD ---------------- */
function loadQuestion(){
    clearInterval(timer);
    time=80;

    if(current>=questions.length){
        endGame();
        return;
    }

    document.getElementById("qCount") .innerText=(current+1)+"/10";
    document.getElementById("questionBox").innerHTML=questions[current].q;

    let box=document.getElementById("options");
    box.innerHTML="";

    questions[current].options.forEach((opt,i)=>{
        let d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>check(i);
        box.appendChild(d);
    });

    startTimer();
}

/* ---------------- TIMER ---------------- */
function startTimer(){
    document.getElementById("timer").innerText=time;

    timer=setInterval(()=>{
        time--; totalTime++;
        document.getElementById("timer").innerText=time;

        if(time<=0){
            current++;
            loadQuestion();
        }
    },1000);
}

/* ---------------- CHECK ---------------- */
function check(i){
    if(i===questions[current].answer){
        score++;
        correct();
    } else {
        attempts++;
        wrong();
    }

    setTimeout(()=>{
        current++;
        loadQuestion();
    },600);
}

function correct(){
    document.getElementById("correctSound").play();
    for(let i=0;i<20;i++){
        let c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=["#ff4d6d","#ffd166","#06d6a0","#4d96ff"][Math.random()*4|0];
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),2000);
    }
}

function wrong(){
    document.getElementById("wrongSound").play();
}

/* ---------------- END ---------------- */
function endGame(){

    document.getElementById("gameContainer").style.display="none";
    document.getElementById("finalScreen").style.display="block";

    let percent=(score/questions.length)*100;

    let remark=
        percent>=80?"Excellent 🌟":
        percent>=60?"Good Job 👍":
        percent>=45?"Well Tried 🙂":
        "Let's revise 📘";

    document.getElementById("scoreText").innerText=
        `Score: ${score}/10`;

    document.getElementById("remark").innerText=remark;
    document.getElementById("timeTaken").innerText="Time: "+totalTime+" sec";
    document.getElementById("attempts").innerText="Wrong Attempts: "+attempts;
}

/* ---------------- RESTART ---------------- */
function restartGame(){
    current=0; score=0; time=80;
    totalTime=0; attempts=0;
    document.getElementById("finalScreen").style.display="none";
    document.getElementById("gameContainer").style.display="block";
    loadQuestion();
}

</script>
</body>
</html>
