<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noun Snake Adventure - Grade 6 ELA</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#74ebd5,#ACB6E5);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

.game-container{
    width:100%;
    max-width:700px;
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.logo{
    width:120px;
    margin-bottom:10px;
}

h1{
    color:#ff5722;
    margin-bottom:10px;
}

.instructions{
    margin-bottom:15px;
    color:#444;
    font-weight:bold;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    flex-wrap:wrap;
    gap:10px;
}

.score-board{
    font-size:20px;
    font-weight:bold;
    color:#333;
}

canvas{
    background:#d4f7d4;
    border:5px solid #4caf50;
    border-radius:12px;
    width:100%;
    max-width:600px;
    touch-action:none;
}

.controls{
    margin-top:15px;
    display:grid;
    grid-template-columns:repeat(3,80px);
    justify-content:center;
    gap:10px;
}

.controls button{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ff9800;
    color:white;
    font-size:20px;
    cursor:pointer;
    font-weight:bold;
}

.controls button:active{
    transform:scale(0.95);
}

.quiz-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:100;
}

.quiz-box{
    background:white;
    width:100%;
    max-width:500px;
    padding:25px;
    border-radius:20px;
    animation:pop 0.4s ease;
}

@keyframes pop{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.quiz-question{
    font-size:22px;
    margin-bottom:20px;
    color:#333;
}

.option-btn{
    width:100%;
    margin:8px 0;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#42a5f5;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.option-btn:hover{
    background:#1e88e5;
}

.feedback{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
    min-height:30px;
}

.correct{
    color:green;
    animation:bounce 0.5s infinite alternate;
}

.wrong{
    color:red;
}

@keyframes bounce{
    from{transform:scale(1);}
    to{transform:scale(1.1);}
}

.game-over{
    display:none;
    margin-top:20px;
}

.restart-btn{
    margin-top:20px;
    padding:15px 25px;
    border:none;
    border-radius:15px;
    background:#ff5722;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.volume-control{
    margin-top:10px;
}

@media(max-width:600px){

    .quiz-question{
        font-size:18px;
    }

    .option-btn{
        font-size:16px;
    }

    .controls{
        grid-template-columns:repeat(3,70px);
    }
}
</style>
</head>

<body>

<div class="game-container">

    <!-- YOUR LOGO -->
    <img src="assets/innovine-logo.png" class="logo">

    <h1>🐍 Noun Snake Adventure</h1>

    <div class="instructions">
        Eat apples 🍎 to unlock noun questions!
    </div>

    <div class="top-bar">

        <div class="score-board">
            Score: <span id="score">0</span>
        </div>

        <div class="score-board">
            Questions: <span id="questionCount">0</span>/10
        </div>

    </div>

    <canvas id="gameCanvas" width="600" height="600"></canvas>

    <div class="volume-control">
        🔊 Volume:
        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
    </div>

    <div class="controls">

        <div></div>
        <button onclick="changeDirection('UP')">⬆️</button>
        <div></div>

        <button onclick="changeDirection('LEFT')">⬅️</button>
        <button onclick="changeDirection('DOWN')">⬇️</button>
        <button onclick="changeDirection('RIGHT')">➡️</button>

    </div>

    <div class="game-over" id="gameOver">

        <h2>🎉 Great Job!</h2>

        <p>Your Final Score: <span id="finalScore"></span></p>

        <button class="restart-btn" onclick="restartGame()">
            Restart Game
        </button>

    </div>

</div>

<!-- QUIZ MODAL -->

<div class="quiz-modal" id="quizModal">

    <div class="quiz-box">

        <div class="quiz-question" id="quizQuestion">
            Question Here
        </div>

        <div id="optionsContainer"></div>

        <div class="feedback" id="feedback"></div>

    </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

/* SLOWER + EASIER */
const box = 30;

let snake = [
    {x: 300, y: 300}
];

let food = randomFood();

let direction = "RIGHT";

let score = 0;

let game;

let foodsEaten = 0;

let currentQuestionIndex = 0;

const scoreDisplay = document.getElementById("score");
const questionDisplay = document.getElementById("questionCount");

const quizModal = document.getElementById("quizModal");
const quizQuestion = document.getElementById("quizQuestion");

const optionsContainer = document.getElementById("optionsContainer");

const feedback = document.getElementById("feedback");

const finalScore = document.getElementById("finalScore");

const gameOverDiv = document.getElementById("gameOver");

const volumeSlider = document.getElementById("volumeSlider");

/* QUESTIONS */

let questions = [

{
question:"Which word is a proper noun?",
options:["city","river","India","school"],
answer:"India"
},

{
question:"Which sentence contains a proper noun?",
options:[
"I love books.",
"We visited Delhi.",
"She has a pencil.",
"The cat is sleeping."
],
answer:"We visited Delhi."
},

{
question:"Which is a common noun?",
options:["Monday","Ravi","teacher","Asia"],
answer:"teacher"
},

{
question:"Which word is a collective noun?",
options:["flock","bird","feather","fly"],
answer:"flock"
},

{
question:"Which is a material noun?",
options:["gold","honesty","team","mango"],
answer:"gold"
},

{
question:"Which is an abstract noun?",
options:["chair","bravery","dog","spoon"],
answer:"bravery"
},

{
question:"Which word names a feeling?",
options:["happiness","pencil","water","class"],
answer:"happiness"
},

{
question:"Which is a countable noun?",
options:["rice","milk","apples","sugar"],
answer:"apples"
},

{
question:"Which is an uncountable noun?",
options:["books","pencils","furniture","chairs"],
answer:"furniture"
},

{
question:"Which noun cannot be counted individually?",
options:["coins","marbles","water","toys"],
answer:"water"
}

];

/* RANDOMIZE QUESTIONS */

questions = questions.sort(() => Math.random() - 0.5);

/* YOUR LOCAL SOUND FILES */

const correctSound = new Audio("assets/correct.mp3");

const wrongSound = new Audio("assets/wrong.mp3");

const clapSound = new Audio("assets/clapping.mp3");

/* VOLUME CONTROL */

function updateVolume(){

    correctSound.volume = volumeSlider.value;
    wrongSound.volume = volumeSlider.value;
    clapSound.volume = volumeSlider.value;

}

volumeSlider.addEventListener("input", updateVolume);

updateVolume();

/* DRAW GAME */

function draw(){

    ctx.fillStyle = "#d4f7d4";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    /* DRAW SNAKE */

    for(let i=0;i<snake.length;i++){

        ctx.fillStyle = i === 0 ? "#2e7d32" : "#66bb6a";

        ctx.fillRect(snake[i].x,snake[i].y,box,box);

    }

    /* DRAW FOOD */

    ctx.fillStyle = "#ff1744";

    ctx.beginPath();

    ctx.arc(food.x + box/2, food.y + box/2, box/2, 0, Math.PI*2);

    ctx.fill();

    let snakeX = snake[0].x;
    let snakeY = snake[0].y;

    if(direction === "LEFT") snakeX -= box;
    if(direction === "UP") snakeY -= box;
    if(direction === "RIGHT") snakeX += box;
    if(direction === "DOWN") snakeY += box;

    /* FOOD EATEN */

    if(snakeX === food.x && snakeY === food.y){

        score += 10;

        foodsEaten++;

        scoreDisplay.textContent = score;

        food = randomFood();

        /* QUESTION AFTER EVERY 3 APPLES */

        if(foodsEaten % 3 === 0 && currentQuestionIndex < questions.length){

            clearInterval(game);

            showQuestion();

        }

    } else {

        snake.pop();

    }

    let newHead = {
        x: snakeX,
        y: snakeY
    };

    /* WALL COLLISION */

    if(
        snakeX < 0 ||
        snakeY < 0 ||
        snakeX >= canvas.width ||
        snakeY >= canvas.height ||
        collision(newHead,snake)
    ){

        endGame();
        return;

    }

    snake.unshift(newHead);

}

/* RANDOM FOOD */

function randomFood(){

    return{
        x: Math.floor(Math.random()*20)*box,
        y: Math.floor(Math.random()*20)*box
    };

}

/* COLLISION */

function collision(head,array){

    for(let i=0;i<array.length;i++){

        if(head.x === array[i].x && head.y === array[i].y){

            return true;

        }

    }

    return false;

}

/* KEYBOARD CONTROLS */

document.addEventListener("keydown",event=>{

    if(event.key === "ArrowLeft" && direction !== "RIGHT")
        direction = "LEFT";

    else if(event.key === "ArrowUp" && direction !== "DOWN")
        direction = "UP";

    else if(event.key === "ArrowRight" && direction !== "LEFT")
        direction = "RIGHT";

    else if(event.key === "ArrowDown" && direction !== "UP")
        direction = "DOWN";

});

/* MOBILE CONTROLS */

function changeDirection(dir){

    if(dir === "LEFT" && direction !== "RIGHT")
        direction = "LEFT";

    if(dir === "UP" && direction !== "DOWN")
        direction = "UP";

    if(dir === "RIGHT" && direction !== "LEFT")
        direction = "RIGHT";

    if(dir === "DOWN" && direction !== "UP")
        direction = "DOWN";

}

/* SHOW QUESTION */

function showQuestion(){

    quizModal.style.display = "flex";

    const q = questions[currentQuestionIndex];

    quizQuestion.textContent = q.question;

    optionsContainer.innerHTML = "";

    feedback.innerHTML = "";

    q.options.forEach(option=>{

        const btn = document.createElement("button");

        btn.classList.add("option-btn");

        btn.textContent = option;

        btn.onclick = ()=>checkAnswer(option);

        optionsContainer.appendChild(btn);

    });

}

/* CHECK ANSWER */

function checkAnswer(selected){

    const q = questions[currentQuestionIndex];

    if(selected === q.answer){

        feedback.innerHTML = "✅ Correct! Great Job!";

        feedback.className = "feedback correct";

        score += 20;

        correctSound.play();

    } else {

        feedback.innerHTML = "❌ Oops! Try the next one!";

        feedback.className = "feedback wrong";

        wrongSound.play();

    }

    scoreDisplay.textContent = score;

    currentQuestionIndex++;

    questionDisplay.textContent = currentQuestionIndex;

    setTimeout(()=>{

        quizModal.style.display = "none";

        if(currentQuestionIndex >= questions.length){

            endGame();

        } else {

            /* VERY SLOW SPEED */
            game = setInterval(draw,350);

        }

    },1500);

}

/* END GAME */

function endGame(){

    clearInterval(game);

    clapSound.play();

    gameOverDiv.style.display = "block";

    finalScore.textContent = score;

}

/* RESTART */

function restartGame(){

    location.reload();

}

/* START GAME */

/* VERY SLOW FOR GRADE 6 */
game = setInterval(draw,350);

</script>

</body>
</html>
