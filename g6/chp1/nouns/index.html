<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nouns Adventure Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg,#fff3cd,#d0f0ff,#ffd6e7);
    overflow-x: hidden;
}

.screen {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
    background: white;
}

#logoScreen img {
    width: 250px;
}

#topicScreen {
    font-size: 32px;
    font-weight: bold;
    color: #ff4d6d;
    display: none;
    text-align: center;
    padding: 20px;
}

#gameContainer {
    display: none;
    padding: 10px;
}

.header {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    font-weight: bold;
}

#questionBox {
    background: white;
    padding: 20px;
    margin: 10px;
    border-radius: 15px;
    font-size: 20px;
}

.option {
    background: #fff;
    margin: 10px;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid #ccc;
}

.option:hover {
    background: #f0f8ff;
}

#finalScreen {
    display: none;
    text-align: center;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin: 10px;
    border-radius: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.restartBtn { background: #007bff; color: white; }
.endBtn { background: #dc3545; color: white; }

.flash { animation: flash 0.3s infinite alternate; }

@keyframes flash {
    from { opacity: 1; }
    to { opacity: 0.4; }
}

.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background: red;
    top: 0;
    animation: fall 2s linear forwards;
}

@keyframes fall {
    to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

@media(max-width:768px){
    #questionBox { font-size: 18px; }
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen">
    <img src="assets/innovine-logo.png">
</div>

<!-- TOPIC -->
<div id="topicScreen" class="screen">
    🌟 Nouns Master Challenge 🌟
</div>

<!-- GAME -->
<div id="gameContainer">

    <div class="header">
        <div id="qCount">1/10</div>
        <div id="timer">80</div>
    </div>

    <div style="padding:10px;">
        Volume:
        <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
    </div>

    <div id="questionBox"></div>
    <div id="options"></div>
</div>

<!-- FINAL -->
<div id="finalScreen">
    <div class="card">
        <h2 id="scoreText"></h2>
        <p id="remark"></p>
        <p id="timeTaken"></p>
        <p id="attempts"></p>

        <button class="restartBtn" onclick="restartGame()">Restart</button>
        <button class="endBtn" onclick="location.reload()">End</button>
    </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

/* ---------------- YOUR QUESTIONS ---------------- */
let questions = [
{
q:"The committee decided to organize a science fair. Identify the noun type.",
options:["Common Noun","Proper Noun","Collective Noun","Abstract Noun"],
answer:2
},
{
q:"Copper is used to make electrical wires. Identify noun type of Copper.",
options:["Common Noun","Material Noun","Countable Noun","Collective Noun"],
answer:1
},
{
q:"Friendship becomes stronger when people trust each other.",
options:["Common Noun","Proper Noun","Material Noun","Abstract Noun"],
answer:3
},
{
q:"The children counted the ancient coins in the museum.",
options:["Uncountable Noun","Collective Noun","Countable Noun","Material Noun"],
answer:2
},
{
q:"We need more sand to complete the desert model.",
options:["Material Noun","Countable Noun","Uncountable Noun","Collective Noun"],
answer:2
},
{
q:"Ms. Sharma encouraged students to debate.",
options:["Common Noun","Collective Noun","Proper Noun","Abstract Noun"],
answer:2
},
{
q:"The garden behind our school is beautiful.",
options:["Common Noun","Proper Noun","Material Noun","Collective Noun"],
answer:0
},
{
q:"A fleet of ships arrived at the harbour.",
options:["Common Noun","Countable Noun","Material Noun","Collective Noun"],
answer:3
},
{
q:"Knowledge helps people make wise decisions.",
options:["Common Noun","Material Noun","Abstract Noun","Proper Noun"],
answer:2
},
{
q:"The temple floor was built using marble.",
options:["Countable Noun","Common Noun","Material Noun","Collective Noun"],
answer:2
}
];

let current = 0;
let score = 0;
let time = 80;
let timer;
let totalTime = 0;
let attempts = 0;

/* ---------------- SPLASH FLOW ---------------- */
setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("topicScreen").style.display="flex";

    setTimeout(()=>{
        document.getElementById("topicScreen").style.display="none";
        document.getElementById("gameContainer").style.display="block";
        loadQuestion();
        startTimer();
    },3000);

},5000);

/* ---------------- LOAD QUESTION ---------------- */
function loadQuestion(){

    clearInterval(timer);
    time = 80;

    if(current >= questions.length){
        endGame();
        return;
    }

    document.getElementById("qCount").innerText = (current+1)+"/10";
    document.getElementById("questionBox").innerText = questions[current].q;

    let box = document.getElementById("options");
    box.innerHTML = "";

    questions[current].options.forEach((opt,i)=>{
        let div = document.createElement("div");
        div.className="option";
        div.innerText = opt;
        div.onclick = ()=>check(i);
        box.appendChild(div);
    });

    startTimer();
}

/* ---------------- TIMER ---------------- */
function startTimer(){
    document.getElementById("timer").innerText = time;

    timer = setInterval(()=>{
        time--;
        totalTime++;

        document.getElementById("timer").innerText = time;

        if(time<=10){
            document.getElementById("timer").classList.add("flash");
        }

        if(time<=0){
            current++;
            loadQuestion();
        }
    },1000);
}

/* ---------------- CHECK ANSWER ---------------- */
function check(i){
    let vol = document.getElementById("volume").value;

    correctSound.volume = vol;
    wrongSound.volume = vol;
    clapSound.volume = vol;

    if(i === questions[current].answer){
        score++;
        correctSound.play();
        confetti();
    } else {
        attempts++;
        wrongSound.play();
    }

    setTimeout(()=>{
        current++;
        loadQuestion();
    },700);
}

/* ---------------- CONFETTI ---------------- */
function confetti(){
    for(let i=0;i<25;i++){
        let c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=["#ff4d6d","#ffd166","#06d6a0","#4d96ff"][Math.floor(Math.random()*4)];
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),2000);
    }
}

/* ---------------- END ---------------- */
function endGame(){

    document.getElementById("gameContainer").style.display="none";
    document.getElementById("finalScreen").style.display="block";

    let percent = (score/questions.length)*100;

    let remark =
        percent>=80?"Excellent 🌟":
        percent>=60?"Good Job 👍":
        percent>=45?"Well Tried 🙂":
        "Let's revise and come back 📘";

    document.getElementById("scoreText").innerText =
        `Score: ${score}/${questions.length}`;

    document.getElementById("remark").innerText = remark;
    document.getElementById("timeTaken").innerText = "Time Taken: " + totalTime + " sec";
    document.getElementById("attempts").innerText = "Wrong Attempts: " + attempts;
}

/* ---------------- RESTART ---------------- */
function restartGame(){
    current=0;
    score=0;
    time=80;
    totalTime=0;
    attempts=0;
    document.getElementById("finalScreen").style.display="none";
    document.getElementById("gameContainer").style.display="block";
    loadQuestion();
}
</script>

</body>
</html>
