<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noun Snake Adventure - Grade 6 ELA</title>

<!-- PRELOAD AUDIO -->
<link rel="preload" href="assets/correct.mp3" as="audio">
<link rel="preload" href="assets/wrong.mp3" as="audio">
<link rel="preload" href="assets/clapping.mp3" as="audio">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#74ebd5,#ACB6E5);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
    overflow-x:hidden;
}

/* START SCREEN */

.start-screen{
    position:fixed;
    inset:0;
    background:linear-gradient(135deg,#74ebd5,#ACB6E5);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:99999;
    text-align:center;
    padding:20px;
}

.start-logo{
    width:220px;
    margin-bottom:20px;
    animation:floatLogo 2s infinite alternate;
}

@keyframes floatLogo{
    from{
        transform:translateY(0px);
    }
    to{
        transform:translateY(-10px);
    }
}

.start-text{
    font-size:20px;
    margin-bottom:25px;
    color:#333;
    font-weight:bold;
    max-width:500px;
}

.start-btn{
    background:#ff5722;
    color:white;
    border:none;
    padding:18px 35px;
    border-radius:18px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

.start-btn:active{
    transform:scale(0.95);
}

/* MAIN GAME */

.game-container{
    width:100%;
    max-width:700px;
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    display:none;
}

h1{
    color:#ff5722;
    margin-bottom:10px;
}

.instructions{
    margin-bottom:15px;
    color:#444;
    font-weight:bold;
}

/* TOP BAR */

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    flex-wrap:wrap;
    gap:10px;
}

.score-board{
    font-size:20px;
    font-weight:bold;
    color:#333;
}

/* PROGRESS STARS */

.stars-container{
    width:100%;
    margin-top:10px;
    font-size:28px;
    letter-spacing:5px;
    color:#ccc;
}

.star-filled{
    color:gold;
}

/* GAME CANVAS */

canvas{
    background:#d4f7d4;
    border:5px solid #4caf50;
    border-radius:12px;
    width:100%;
    max-width:400px;
    touch-action:none;
}

/* MOBILE CONTROLS */

.controls{
    margin-top:15px;
    display:grid;
    grid-template-columns:repeat(3,80px);
    justify-content:center;
    gap:10px;
}

.controls button{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ff9800;
    color:white;
    font-size:20px;
    cursor:pointer;
    font-weight:bold;
}

.controls button:active{
    transform:scale(0.95);
}

/* QUIZ */

.quiz-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:100;
}

.quiz-box{
    background:white;
    width:100%;
    max-width:500px;
    padding:25px;
    border-radius:20px;
    animation:pop 0.4s ease;
}

@keyframes pop{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.quiz-question{
    font-size:22px;
    margin-bottom:20px;
    color:#333;
}

.option-btn{
    width:100%;
    margin:8px 0;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#42a5f5;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.option-btn:hover{
    background:#1e88e5;
}

/* FEEDBACK */

.feedback{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
    min-height:30px;
}

.correct{
    color:green;
    animation:bounce 0.5s infinite alternate;
}

.wrong{
    color:red;
}

@keyframes bounce{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.1);
    }
}

/* END SCREEN */

.game-over{
    display:none;
    margin-top:20px;
}

.game-over h2{
    color:#4caf50;
    margin-bottom:10px;
}

.game-over p{
    font-size:22px;
    margin-top:10px;
}

.restart-btn{
    margin-top:20px;
    padding:15px 25px;
    border:none;
    border-radius:15px;
    background:#ff5722;
    color:white;
    font-size:20px;
    cursor:pointer;
}

/* VOLUME */

.volume-control{
    margin-top:10px;
}

/* MOBILE */

@media(max-width:600px){

    .quiz-question{
        font-size:18px;
    }

    .option-btn{
        font-size:16px;
    }

    .controls{
        grid-template-columns:repeat(3,70px);
    }

    .start-logo{
        width:180px;
    }

    .stars-container{
        font-size:22px;
    }

}

</style>
</head>

<body>

<!-- START SCREEN -->

<div id="startScreen" class="start-screen">

    <img src="assets/innovine-logo.png" class="start-logo">

    <h1>🐍 Noun Snake Adventure</h1>

    <p class="start-text">
        Help the snake collect apples 🍎 and answer noun questions correctly!
    </p>

    <button id="startBtn" class="start-btn">
        ▶ TAP TO START
    </button>

</div>

<!-- GAME -->

<div class="game-container" id="gameContainer">

    <h1>🐍 Noun Snake Adventure</h1>

    <div class="instructions">
        Eat apples 🍎 to unlock noun questions!
    </div>

    <div class="top-bar">

        <div class="score-board">
            Score: <span id="score">0</span>
        </div>

        <div class="score-board">
            Questions: <span id="questionCount">0</span>/10
        </div>

    </div>

    <!-- STARS -->

    <div class="stars-container" id="starsContainer">
        ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐
    </div>

    <br>

    <!-- GAME CANVAS -->

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- VOLUME -->

    <div class="volume-control">
        🔊 Volume:
        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
    </div>

    <!-- MOBILE CONTROLS -->

    <div class="controls">

        <div></div>
        <button onclick="changeDirection('UP')">⬆️</button>
        <div></div>

        <button onclick="changeDirection('LEFT')">⬅️</button>
        <button onclick="changeDirection('DOWN')">⬇️</button>
        <button onclick="changeDirection('RIGHT')">➡️</button>

    </div>

    <!-- GAME OVER -->

    <div class="game-over" id="gameOver">

        <h2>🏆 Noun Master!</h2>

        <p>
            You completed the challenge!
        </p>

        <p>
            Final Score:
            <span id="finalScore"></span>
        </p>

        <button class="restart-btn" onclick="restartGame()">
            Restart Game
        </button>

    </div>

</div>

<!-- QUIZ -->

<div class="quiz-modal" id="quizModal">

    <div class="quiz-box">

        <div class="quiz-question" id="quizQuestion">
            Question Here
        </div>

        <div id="optionsContainer"></div>

        <div class="feedback" id="feedback"></div>

    </div>

</div>

<script>

/* START BUTTON */

const startBtn = document.getElementById("startBtn");

startBtn.addEventListener("click", ()=>{

    document.getElementById("startScreen").style.display = "none";

    document.getElementById("gameContainer").style.display = "block";

    startGame();

});

/* CANVAS */

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

/* GAME SETTINGS */

const box = 30;

let snake = [
    {x: 180, y: 180}
];

let food = randomFood();

let direction = "RIGHT";

let score = 0;

let game;

let foodsEaten = 0;

let currentQuestionIndex = 0;

/* ELEMENTS */

const scoreDisplay = document.getElementById("score");

const questionDisplay = document.getElementById("questionCount");

const quizModal = document.getElementById("quizModal");

const quizQuestion = document.getElementById("quizQuestion");

const optionsContainer = document.getElementById("optionsContainer");

const feedback = document.getElementById("feedback");

const finalScore = document.getElementById("finalScore");

const gameOverDiv = document.getElementById("gameOver");

const volumeSlider = document.getElementById("volumeSlider");

const starsContainer = document.getElementById("starsContainer");

/* QUESTIONS */

let questions = [

{
question:"Which word is a proper noun?",
options:["city","river","India","school"],
answer:"India"
},

{
question:"Which sentence contains a proper noun?",
options:[
"I love books.",
"We visited Delhi.",
"She has a pencil.",
"The cat is sleeping."
],
answer:"We visited Delhi."
},

{
question:"Which is a common noun?",
options:["Monday","Ravi","teacher","Asia"],
answer:"teacher"
},

{
question:"Which word is a collective noun?",
options:["flock","bird","feather","fly"],
answer:"flock"
},

{
question:"Which is a material noun?",
options:["gold","honesty","team","mango"],
answer:"gold"
},

{
question:"Which is an abstract noun?",
options:["chair","bravery","dog","spoon"],
answer:"bravery"
},

{
question:"Which word names a feeling?",
options:["happiness","pencil","water","class"],
answer:"happiness"
},

{
question:"Which is a countable noun?",
options:["rice","milk","apples","sugar"],
answer:"apples"
},

{
question:"Which is an uncountable noun?",
options:["books","pencils","furniture","chairs"],
answer:"furniture"
},

{
question:"Which noun cannot be counted individually?",
options:["coins","marbles","water","toys"],
answer:"water"
}

];

/* RANDOMIZE */

questions = questions.sort(() => Math.random() - 0.5);

/* AUDIO */

const correctSound = new Audio("assets/correct.mp3");

const wrongSound = new Audio("assets/wrong.mp3");

const clapSound = new Audio("assets/clapping.mp3");

/* VOLUME */

function updateVolume(){

    correctSound.volume = volumeSlider.value;
    wrongSound.volume = volumeSlider.value;
    clapSound.volume = volumeSlider.value;

}

volumeSlider.addEventListener("input", updateVolume);

updateVolume();

/* STARS */

function updateStars(){

    let starsHTML = "";

    for(let i=0; i<10; i++){

        if(i < currentQuestionIndex){

            starsHTML += `<span class="star-filled">⭐</span>`;

        } else {

            starsHTML += `⭐`;

        }

    }

    starsContainer.innerHTML = starsHTML;

}

/* DRAW GAME */

function draw(){

    ctx.fillStyle = "#d4f7d4";

    ctx.fillRect(0,0,canvas.width,canvas.height);

    /* SNAKE */

    for(let i=0;i<snake.length;i++){

        ctx.fillStyle = i === 0 ? "#2e7d32" : "#66bb6a";

        ctx.fillRect(snake[i].x,snake[i].y,box,box);

    }

    /* FOOD */

    ctx.fillStyle = "#ff1744";

    ctx.beginPath();

    ctx.arc(food.x + box/2, food.y + box/2, box/2, 0, Math.PI*2);

    ctx.fill();

    let snakeX = snake[0].x;
    let snakeY = snake[0].y;

    if(direction === "LEFT") snakeX -= box;

    if(direction === "UP") snakeY -= box;

    if(direction === "RIGHT") snakeX += box;

    if(direction === "DOWN") snakeY += box;

    /* EAT FOOD */

    if(snakeX === food.x && snakeY === food.y){

        score += 10;

        foodsEaten++;

        scoreDisplay.textContent = score;

        food = randomFood();

        if(foodsEaten % 3 === 0 && currentQuestionIndex < questions.length){

            clearInterval(game);

            showQuestion();

        }

    } else {

        snake.pop();

    }

    let newHead = {
        x: snakeX,
        y: snakeY
    };

    /* COLLISION */

    if(
        snakeX < 0 ||
        snakeY < 0 ||
        snakeX >= canvas.width ||
        snakeY >= canvas.height ||
        collision(newHead,snake)
    ){

        endGame();
        return;

    }

    snake.unshift(newHead);

}

/* RANDOM FOOD */

function randomFood(){

    return{
        x: Math.floor(Math.random()*13)*box,
        y: Math.floor(Math.random()*13)*box
    };

}

/* COLLISION */

function collision(head,array){

    for(let i=0;i<array.length;i++){

        if(head.x === array[i].x &&
           head.y === array[i].y){

            return true;

        }

    }

    return false;

}

/* KEYBOARD */

document.addEventListener("keydown",event=>{

    if(event.key === "ArrowLeft" &&
       direction !== "RIGHT")
        direction = "LEFT";

    else if(event.key === "ArrowUp" &&
            direction !== "DOWN")
        direction = "UP";

    else if(event.key === "ArrowRight" &&
            direction !== "LEFT")
        direction = "RIGHT";

    else if(event.key === "ArrowDown" &&
            direction !== "UP")
        direction = "DOWN";

});

/* MOBILE BUTTONS */

function changeDirection(dir){

    if(dir === "LEFT" &&
       direction !== "RIGHT")
        direction = "LEFT";

    if(dir === "UP" &&
       direction !== "DOWN")
        direction = "UP";

    if(dir === "RIGHT" &&
       direction !== "LEFT")
        direction = "RIGHT";

    if(dir === "DOWN" &&
       direction !== "UP")
        direction = "DOWN";

}

/* SHOW QUESTION */

function showQuestion(){

    quizModal.style.display = "flex";

    const q = questions[currentQuestionIndex];

    quizQuestion.textContent = q.question;

    optionsContainer.innerHTML = "";

    feedback.innerHTML = "";

    q.options.forEach(option=>{

        const btn = document.createElement("button");

        btn.classList.add("option-btn");

        btn.textContent = option;

        btn.onclick = ()=>checkAnswer(option);

        optionsContainer.appendChild(btn);

    });

}

/* CHECK ANSWER */

function checkAnswer(selected){

    const q = questions[currentQuestionIndex];

    if(selected === q.answer){

        feedback.innerHTML =
        "✅ Correct! Great Job!";

        feedback.className =
        "feedback correct";

        score += 20;

        /* PLAY CORRECT + CLAP */

        correctSound.currentTime = 0;
        clapSound.currentTime = 0;

        correctSound.play();
        clapSound.play();

        /* CONFETTI */

        launchConfetti();

    } else {

        feedback.innerHTML =
        "❌ Oops! Try the next one!";

        feedback.className =
        "feedback wrong";

        /* WRONG SOUND */

        wrongSound.currentTime = 0;

        wrongSound.play();

    }

    scoreDisplay.textContent = score;

    currentQuestionIndex++;

    questionDisplay.textContent =
    currentQuestionIndex;

    updateStars();

    setTimeout(()=>{

        quizModal.style.display = "none";

        if(currentQuestionIndex >= questions.length){

            endGame();

        } else {

            game = setInterval(draw,350);

        }

    },1500);

}

/* CONFETTI */

function launchConfetti(){

    for(let i=0; i<80; i++){

        const confetti =
        document.createElement("div");

        confetti.style.position = "fixed";

        confetti.style.width = "10px";
        confetti.style.height = "10px";

        confetti.style.backgroundColor =
        `hsl(${Math.random()*360},100%,50%)`;

        confetti.style.left =
        Math.random()*window.innerWidth + "px";

        confetti.style.top = "-20px";

        confetti.style.zIndex = "9999";

        confetti.style.borderRadius = "50%";

        confetti.style.pointerEvents = "none";

        document.body.appendChild(confetti);

        let fall = Math.random()*5 + 5;

        let drift = (Math.random()-0.5)*4;

        let position = -20;

        const interval = setInterval(()=>{

            position += fall;

            confetti.style.top =
            position + "px";

            confetti.style.left =
            parseFloat(confetti.style.left)
            + drift + "px";

            if(position >
               window.innerHeight){

                clearInterval(interval);

                confetti.remove();

            }

        },20);

    }

}

/* END GAME */

function endGame(){

    clearInterval(game);

    clapSound.currentTime = 0;

    clapSound.play();

    launchConfetti();

    gameOverDiv.style.display = "block";

    finalScore.textContent = score;

}

/* RESTART */

function restartGame(){

    location.reload();

}

/* START GAME */

function startGame(){

    game = setInterval(draw,350);

}

</script>

</body>
</html>
