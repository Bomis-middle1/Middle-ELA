<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎢 Theme Park Rebuilder</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:#90caf9;
}

#gameArea{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(to bottom,#64b5f6,#e1f5fe);
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    padding:10px;
}

/* CLOUDS */
.cloud{
    position:absolute;
    background:white;
    border-radius:50px;
    opacity:0.9;
    animation:moveCloud linear infinite;
    pointer-events:none;
}

@keyframes moveCloud{
    from{transform:translateX(-300px);}
    to{transform:translateX(120vw);}
}

/* LOGO */
#logoScreen{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
}

#logoScreen img{
    width:260px;
    max-width:80%;
}

/* START + END */
#startScreen,
#endScreen{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:20px;
    color:white;
    z-index:5000;
}

.mainBtn{
    padding:14px 28px;
    font-size:20px;
    border:none;
    border-radius:18px;
    background:#ff9800;
    color:white;
    cursor:pointer;
    margin-top:20px;
    transition:0.3s;
}

.mainBtn:hover{
    transform:scale(1.05);
}

/* HEADER CONTAINER */
#headerContainer{
    width:100%;
    max-width:800px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    z-index:100;
}

#titleBox{
    width:100%;
    background:white;
    padding:8px 12px;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    text-align:center;
    color:#6a1b9a;
    border:4px solid #ffca28;
}

#infoBar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

#scoreBoard{
    background:white;
    padding:6px 12px;
    border-radius:12px;
    font-size:13px;
    font-weight:bold;
    line-height:1.3;
    box-shadow:0 2px 5px rgba(0,0,0,0.15);
}

#volumeBox{
    background:white;
    padding:6px 12px;
    border-radius:12px;
    font-size:13px;
    font-weight:bold;
    box-shadow:0 2px 5px rgba(0,0,0,0.15);
    display:flex;
    align-items:center;
    gap:6px;
}

#volumeSlider{
    width:70px;
}

/* RIDE AREA */
#rideArea{
    width:100%;
    max-width:800px;
    flex:1;
    margin:8px 0;
    background:#fffde7;
    border-radius:20px;
    border:6px solid #42a5f5;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:space-around;
    align-items:center;
    overflow:hidden;
    padding:10px;
}

#rideEmoji{
    font-size:80px;
    transition:0.5s;
    line-height:1;
}

.spin{ animation:spinRide 2s infinite linear; }
.swing{ animation:swingRide 1s infinite alternate ease-in-out; }
.bounce{ animation:bounceRide 1s infinite alternate; }
.flash{ animation:flashRide 0.5s infinite alternate; }

@keyframes spinRide{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}
@keyframes swingRide{
    from{transform:rotate(-15deg);}
    to{transform:rotate(15deg);}
}
@keyframes bounceRide{
    from{transform:translateY(0);}
    to{transform:translateY(-20px);}
}
@keyframes flashRide{
    from{opacity:1;}
    to{opacity:0.2;}
}

/* PROBLEM */
#problemBox{
    background:white;
    padding:12px;
    border-radius:16px;
    border:4px dashed red;
    text-align:center;
    width:92%;
    max-width:600px;
    transition:0.3s;
}

#problemText{
    font-size:16px;
    font-weight:bold;
    color:#d32f2f;
}

/* TOOLBOX */
#toolBox{
    width:100%;
    max-width:800px;
    display:flex;
    justify-content:center;
    gap:10px;
    z-index:200;
    padding-bottom:5px;
}

.tool{
    width:65px;
    height:65px;
    background:white;
    border-radius:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:36px;
    cursor:pointer;
    border:4px solid #29b6f6;
    transition:0.2s;
    user-select:none;
    box-shadow:0 3px 6px rgba(0,0,0,0.15);
}

.tool:active, .tool:hover{
    transform:scale(1.08);
    background:#fff9c4;
}

/* QUESTION BOX */
#questionBox{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:92%;
    max-width:600px;
    max-height:85vh;
    overflow-y:auto;
    background:#fff8e1;
    padding:20px;
    border-radius:20px;
    display:none;
    z-index:8000;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
    animation:popup 0.4s;
}

#questionTitle{
    font-size:22px;
    font-weight:bold;
    color:#e65100;
    margin-bottom:10px;
    text-align:center;
}

#questionText{
    font-size:16px;
    line-height:1.4;
    margin-bottom:15px;
    color:#333;
}

.optionBtn{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:none;
    border-radius:12px;
    background:#4caf50;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.2s;
    text-align:left;
}

.optionBtn:active, .optionBtn:hover{
    background:#388e3c;
}

/* FEEDBACK POPUP */
#feedbackPopup{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:88%;
    max-width:550px;
    max-height:80vh;
    overflow-y:auto;
    background:white;
    padding:20px;
    border-radius:20px;
    display:none;
    z-index:9000;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
    animation:popup 0.3s;
}

#feedbackTitle{
    font-size:26px;
    margin-bottom:10px;
    font-weight:bold;
}

#feedbackText{
    font-size:16px;
    line-height:1.5;
    color:#333;
}

/* CONFETTI */
.confetti{
    position:absolute;
    width:10px;
    height:10px;
    animation:fall 3s linear forwards;
    pointer-events:none;
}

@keyframes fall{
    from{ transform:translateY(-50px) rotate(0deg); }
    to{ transform:translateY(100vh) rotate(720deg); opacity:0; }
}

@keyframes popup{
    from{ transform:translate(-50%,-50%) scale(0.6); opacity:0; }
    to{ transform:translate(-50%,-50%) scale(1); opacity:1; }
}

/* DESKTOP ADJUSTMENTS */
@media(min-width:769px){
    #titleBox{ font-size:22px; padding:12px; }
    #scoreBoard, #volumeBox{ font-size:15px; padding:8px 15px; }
    #rideEmoji{ font-size:110px; }
    #problemText{ font-size:20px; }
    .tool{ width:80px; height:80px; font-size:44px; }
    #questionTitle{ font-size:26px; }
    #questionText{ font-size:18px; }
    .optionBtn{ font-size:16px; padding:14px; }
}
</style>
</head>

<body>

<div id="gameArea">

<script>
for(let i=0;i<6;i++){
    document.write(`
    <div class="cloud"
    style="
    width:${80+Math.random()*80}px;
    height:${35+Math.random()*25}px;
    top:${Math.random()*30}%;
    left:${Math.random()*100}%;
    animation-duration:${20+Math.random()*15}s;
    "></div>
    `);
}
</script>

<!-- LOGO -->
<div id="logoScreen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.style.display='none'">
</div>

<!-- START -->
<div id="startScreen" style="display:none;">
    <h1 style="font-size:36px;">🎢 Theme Park Rebuilder</h1>
    <p style="margin-top:15px;font-size:18px;max-width:500px;line-height:1.4;">
    Repair broken rides using the correct tools and solve exciting verb challenges!
    </p>
    <button class="mainBtn" onclick="startGame()">Start Rebuilding</button>
</div>

<!-- END -->
<div id="endScreen" style="display:none;">
    <h1 style="font-size:30px;">🏆 Theme Park Fully Reopened! 🏆</h1>
    <h2 id="finalText" style="margin-top:15px; line-height:1.6; font-size:18px;"></h2>
    <button class="mainBtn" onclick="restartGame()">Play Again</button>
</div>

<!-- HEADER CONTAINER -->
<div id="headerContainer">
    <div id="titleBox">
        🔧 Choose the Correct Repair Tool!
    </div>
    
    <div id="infoBar">
        <div id="scoreBoard">
            ✅ Correct: <span id="correctScore">0</span> | ❌ Wrong: <span id="wrongScore">0</span> | 📘 Q: <span id="questionNumber">0</span>/10
        </div>

        <div id="volumeBox">
            🔊 <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
        </div>
    </div>
</div>

<!-- RIDE DISPLAY -->
<div id="rideArea">
    <div id="rideEmoji">🎡</div>

    <div id="problemBox">
        <div id="problemText">The Ferris wheel is wobbling dangerously!</div>
    </div>
</div>

<!-- TOOLBOX -->
<div id="toolBox">
    <div class="tool" data-tool="wrench">🔧</div>
    <div class="tool" data-tool="screwdriver">🪛</div>
    <div class="tool" data-tool="battery">🔋</div>
    <div class="tool" data-tool="gear">⚙️</div>
</div>

<!-- QUESTION POPUP -->
<div id="questionBox">
    <div id="questionTitle">⚡ Verb Challenge</div>
    <div id="questionText"></div>
    <div id="options"></div>
</div>

<!-- FEEDBACK POPUP -->
<div id="feedbackPopup">
    <div id="feedbackTitle"></div>
    <div id="feedbackText"></div>
</div>

</div>

<script>
/* LOGO */
setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("startScreen").style.display="flex";
},2000);

/* AUDIO */
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/clapping.mp3");

const volumeSlider = document.getElementById("volumeSlider");

function updateVolume(){
    correctSound.volume = volumeSlider.value;
    wrongSound.volume = volumeSlider.value;
    clapSound.volume = volumeSlider.value;
}

volumeSlider.addEventListener("input",updateVolume);
updateVolume();

/* GAME DATA */
let level = 0;
let correctCount = 0;
let wrongCount = 0;

const rides = [
    { ride:"🎡", animation:"spin", problem:"The Ferris wheel is wobbling dangerously!", tool:"wrench" },
    { ride:"🎢", animation:"bounce", problem:"The rollercoaster engine is making grinding noises!", tool:"gear" },
    { ride:"🏴‍☠️", animation:"swing", problem:"The pirate ship suddenly lost all power!", tool:"battery" },
    { ride:"👻", animation:"flash", problem:"The haunted house lights keep flickering!", tool:"screwdriver" },
    { ride:"🚗", animation:"bounce", problem:"The bumper cars are shaking wildly!", tool:"wrench" },
    { ride:"🎠", animation:"spin", problem:"The carousel suddenly stopped spinning!", tool:"gear" },
    { ride:"💦", animation:"flash", problem:"The water ride won't turn on anymore!", tool:"battery" },
    { ride:"🚀", animation:"bounce", problem:"The rocket ride control panel is hanging loose!", tool:"screwdriver" },
    { ride:"🎯", animation:"spin", problem:"The target machine suddenly jammed!", tool:"gear" },
    { ride:"🎆", animation:"flash", problem:"The fireworks system refuses to start!", tool:"battery" }
];

const questions = [
    {
        q:"🎢 Which sentence sounds BEST?",
        o:[
            "The workers fixing the track arrived quickly.",
            "The workers fixeding the track arrived quickly.",
            "The workers fix the track arriving quickly.",
            "The workers to fixing the track arrived."
        ],
        a:0,
        e:"'Fixing' is correctly used as a non-finite verb."
    },
    {
        q:"👻 The visitors screamed loudly after seeing the ghost jumping from the ceiling.<br><br>What was the ghost doing?",
        o:["screamed","seeing","jumping","loudly"],
        a:2,
        e:"'Jumping' tells us the ghost's action."
    },
    {
        q:"💦 Which sentence sounds WRONG?",
        o:[
            "Running near the ride is dangerous.",
            "The children waiting in line were excited.",
            "The operator checking the ride smiled.",
            "The visitors slippinged near the pool laughed."
        ],
        a:3,
        e:"'Slippinged' is not a real verb form."
    },
    {
        q:"🎡 Mia stood near the Ferris wheel, eating popcorn while watching fireworks.<br><br>Which action happened at the same time?",
        o:["stood","Ferris wheel","eating","fireworks"],
        a:2,
        e:"'Eating' happened while Mia stood there."
    },
    {
        q:"🏴‍☠️ The pirate ride stopped moving after making a strange sound.<br><br>What happened FIRST?",
        o:[
            "stopped moving",
            "making a strange sound",
            "pirate ride",
            "strange"
        ],
        a:1,
        e:"The strange sound happened before the ride stopped."
    },
    {
        q:"🎠 Which announcement sounds BEST?",
        o:[
            "The clown dancing near the carousel waved happily.",
            "The clown danceding near the carousel waved happily.",
            "The clown dance near the carousel waving happily.",
            "The clown to dancing near the carousel waved."
        ],
        a:0,
        e:"'Dancing' is correctly used here."
    },
    {
        q:"🍿 The popcorn machine exploded while cooking snacks.<br><br>What was the machine doing before exploding?",
        o:["exploded","visitors","cooking","snacks"],
        a:2,
        e:"The machine was cooking snacks first."
    },
    {
        q:"🚗 The children raced around the arena, trying to avoid crashing.<br><br>What were the children trying to do?",
        o:["raced","avoid crashing","arena","children"],
        a:1,
        e:"They were trying to avoid crashing."
    },
    {
        q:"🎩 The magician opened the giant box, hoping to surprise the audience.<br><br>What was the magician hoping to do?",
        o:["opened","hoping","surprise the audience","audience"],
        a:2,
        e:"The magician wanted to surprise the audience."
    },
    {
        q:"⚡ Which sentence sounds most natural?",
        o:[
            "Checking the rollercoaster carefully, the engineer found the problem.",
            "The engineer checkinged the rollercoaster found the problem.",
            "Checking the rollercoaster, the engineer finding the problem.",
            "To checking the rollercoaster, the engineer found the problem."
        ],
        a:0,
        e:"'Checking' is correctly used as a non-finite verb."
    }
];

function startGame(){
    document.getElementById("startScreen").style.display="none";
    loadLevel();
}

function loadLevel(){
    const r = rides[level];
    const rideEmoji = document.getElementById("rideEmoji");

    rideEmoji.className = "";
    rideEmoji.innerHTML = r.ride;

    setTimeout(()=>{
        rideEmoji.classList.add(r.animation);
    },100);

    document.getElementById("problemText").innerHTML = r.problem;
    shuffleTools();
}

function shuffleTools(){
    const toolbox = document.getElementById("toolBox");
    for(let i = toolbox.children.length; i >= 0; i--){
        toolbox.appendChild(toolbox.children[Math.random() * i | 0]);
    }
}

document.querySelectorAll(".tool").forEach(tool=>{
    tool.addEventListener("click",()=>{
        checkTool(tool.dataset.tool);
    });
});

function checkTool(tool){
    const correctTool = rides[level].tool;

    if(tool === correctTool){
        correctSound.currentTime = 0;
        correctSound.play().catch(()=>{});
        clapSound.currentTime = 0;
        clapSound.play().catch(()=>{});

        createConfetti();
        showQuestion();
    }else{
        wrongCount++;
        document.getElementById("wrongScore").innerHTML = wrongCount;

        wrongSound.currentTime = 0;
        wrongSound.play().catch(()=>{});

        const popup = document.getElementById("feedbackPopup");
        popup.style.display = "block";

        document.getElementById("feedbackTitle").innerHTML = "❌ Wrong Tool!";
        document.getElementById("feedbackTitle").style.color = "red";
        document.getElementById("feedbackText").innerHTML = "This ride needs a different repair tool. Look carefully and try again!";

        const box = document.getElementById("problemBox");
        box.style.borderColor = "red";

        setTimeout(()=>{
            popup.style.display = "none";
            box.style.borderColor = "red";
        },1500);
    }
}

function showQuestion(){
    document.getElementById("questionBox").style.display = "block";
    const q = questions[level];

    document.getElementById("questionText").innerHTML = q.q;

    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    q.o.forEach((option,index)=>{
        const btn = document.createElement("button");
        btn.classList.add("optionBtn");
        btn.innerHTML = option;
        btn.onclick = ()=>checkAnswer(index,q);
        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(selected,q){
    document.getElementById("questionBox").style.display = "none";

    const popup = document.getElementById("feedbackPopup");
    popup.style.display = "block";

    if(selected === q.a){
        correctCount++;
        document.getElementById("correctScore").innerHTML = correctCount;

        correctSound.currentTime = 0;
        correctSound.play().catch(()=>{});
        createConfetti();

        document.getElementById("feedbackTitle").innerHTML = "✅ Correct!";
        document.getElementById("feedbackTitle").style.color = "green";
        document.getElementById("feedbackText").innerHTML = q.e;
    }else{
        wrongCount++;
        document.getElementById("wrongScore").innerHTML = wrongCount;

        wrongSound.currentTime = 0;
        wrongSound.play().catch(()=>{});

        document.getElementById("feedbackTitle").innerHTML = "❌ Incorrect!";
        document.getElementById("feedbackTitle").style.color = "red";
        document.getElementById("feedbackText").innerHTML = `
            Correct Answer:<br><br>
            <b>${q.o[q.a]}</b><br><br>
            ${q.e}
        `;
    }

    document.getElementById("questionNumber").innerHTML = level + 1;

    setTimeout(()=>{
        popup.style.display = "none";
        level++;

        if(level >= 10){
            endGame();
        }else{
            loadLevel();
        }
    },2500);
}

function createConfetti(){
    for(let i=0;i<30;i++){
        const conf = document.createElement("div");
        conf.classList.add("confetti");
        conf.style.left = Math.random()*100 + "%";
        conf.style.background = `hsl(${Math.random()*360},100%,50%)`;
        conf.style.animationDuration = (2 + Math.random()*2)+"s";
        document.body.appendChild(conf);

        setTimeout(()=>{ conf.remove(); },3000);
    }
}

function endGame(){
    document.getElementById("endScreen").style.display = "flex";
    let percentage = Math.round((correctCount / 10) * 100);
    let message = "";

    if(correctCount === 10){
        message = "🌟 PERFECT! You are a Theme Park Grammar Master!";
    }else if(correctCount >= 8){
        message = "🚀 Amazing Work! You repaired the park brilliantly!";
    }else if(correctCount >= 6){
        message = "🎡 Great Job! The visitors are enjoying the rides again!";
    }else{
        message = "🎉 Nice Effort! You helped reopen the theme park!";
    }

    document.getElementById("finalText").innerHTML = `
        🏆 Correct Answers: ${correctCount}/10<br>
        ❌ Wrong Answers: ${wrongCount}<br>
        ⭐ Score Percentage: ${percentage}%<br><br>
        ${message}
    `;
}

function restartGame(){
    location.reload();
}
</script>

</body>
</html>
