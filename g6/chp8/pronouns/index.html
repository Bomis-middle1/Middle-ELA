<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Space Rescue Mission</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:black;
}

/* GAME AREA */

#gameArea{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:
linear-gradient(to bottom,#020024,#090979,#00d4ff);
}

/* STARS */

.star{
position:absolute;
background:white;
border-radius:50%;
opacity:0.8;
animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
from{opacity:0.2;}
to{opacity:1;}
}

/* LOGO */

#logoScreen{
position:absolute;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

#logoScreen img{
width:260px;
max-width:80%;
}

#logoText{
margin-top:20px;
font-size:32px;
font-weight:bold;
color:#333;
}

/* START SCREEN */

#startScreen,
#endScreen{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
color:white;
z-index:5000;
}

.mainBtn{
padding:16px 34px;
font-size:22px;
border:none;
border-radius:18px;
background:#ff9800;
color:white;
cursor:pointer;
margin-top:25px;
transition:0.3s;
}

.mainBtn:hover{
transform:scale(1.05);
background:#f57c00;
}

/* TITLE */

#titleBox{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
width:90%;
background:white;
border-radius:20px;
padding:15px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#0d47a1;
border:6px solid #00e5ff;
z-index:100;
}

/* SCORE */

#scoreBoard{
position:absolute;
top:100px;
left:20px;
background:white;
padding:12px 18px;
border-radius:15px;
font-size:20px;
font-weight:bold;
z-index:200;
}

/* VOLUME */

#volumeBox{
position:absolute;
top:100px;
right:20px;
background:white;
padding:12px;
border-radius:15px;
z-index:200;
}

/* SHIP */

#ship{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
font-size:70px;
transition:left 0.1s;
z-index:50;
}

/* CRYSTALS */

.crystal{
position:absolute;
font-size:45px;
animation:floatDown linear forwards;
}

@keyframes floatDown{
from{
transform:translateY(-100px);
}
to{
transform:translateY(110vh);
}
}

/* QUESTION BOX */

#questionBox{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:92%;
max-width:700px;
background:#fff8e1;
padding:25px;
border-radius:25px;
display:none;
z-index:8000;
box-shadow:0 0 30px rgba(0,0,0,0.5);
animation:popup 0.5s;
}

#questionTitle{
font-size:30px;
color:#e65100;
margin-bottom:15px;
text-align:center;
}

#questionText{
font-size:22px;
line-height:1.6;
margin-bottom:20px;
color:#333;
}

.optionBtn{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:15px;
background:#4caf50;
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

.optionBtn:hover{
background:#388e3c;
transform:scale(1.03);
}

/* FEEDBACK */

#feedback{
text-align:center;
font-size:30px;
font-weight:bold;
margin-top:15px;
}

.correct{
color:green;
}

.wrong{
color:red;
}

/* CONFETTI */

.confetti{
position:absolute;
width:12px;
height:12px;
animation:fall 3s linear forwards;
}

@keyframes fall{
from{
transform:translateY(-100px) rotate(0deg);
}
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

@keyframes popup{
from{
transform:translate(-50%,-50%) scale(0.5);
opacity:0;
}
to{
transform:translate(-50%,-50%) scale(1);
opacity:1;
}
}

/* MOBILE */

@media(max-width:768px){

#titleBox{
font-size:20px;
}

#ship{
font-size:50px;
}

.crystal{
font-size:35px;
}

#questionText{
font-size:18px;
}

.optionBtn{
font-size:16px;
}

#scoreBoard{
font-size:16px;
top:90px;
}

#volumeBox{
top:90px;
}

}

</style>
</head>

<body>

<div id="gameArea">

<!-- STARS -->

<script>
for(let i=0;i<80;i++){

document.write(`
<div class="star"
style="
width:${Math.random()*4+1}px;
height:${Math.random()*4+1}px;
left:${Math.random()*100}%;
top:${Math.random()*100}%;
animation-duration:${Math.random()*3+1}s;
"></div>
`);

}
</script>

<!-- LOGO -->

<div id="logoScreen">
<img src="assets/innovine-logo.png">
<div id="logoText">Innovine Learning Adventures</div>
</div>

<!-- START -->

<div id="startScreen" style="display:none;">

<h1 style="font-size:52px;">🚀 Space Rescue Mission</h1>

<p style="margin-top:20px;font-size:24px;max-width:700px;">
Collect energy crystals and save the galaxy while solving space communication challenges!
</p>

<button class="mainBtn" onclick="startGame()">
Start Mission
</button>

</div>

<!-- END -->

<div id="endScreen" style="display:none;">

<h1>🌌 Mission Complete! 🌌</h1>

<h2 id="finalText" style="margin-top:20px;"></h2>

<button class="mainBtn" onclick="restartGame()">
Play Again
</button>

</div>

<!-- TITLE -->

<div id="titleBox">
🛸 Collect Energy Crystals to Unlock Rescue Missions!
</div>

<!-- SCORE -->

<div id="scoreBoard">
Crystals: <span id="crystalCount">0</span> |
Questions: <span id="questionCount">0</span>/10
</div>

<!-- VOLUME -->

<div id="volumeBox">
Volume
<input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
</div>

<!-- SHIP -->

<div id="ship">🚀</div>

<!-- QUESTIONS -->

<div id="questionBox">

<div id="questionTitle">
📡 Space Communication Challenge
</div>

<div id="questionText"></div>

<div id="options"></div>

<div id="feedback"></div>

</div>

</div>

<script>

/* LOGO */

setTimeout(()=>{

document.getElementById("logoScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";

},5000);

/* AUDIO */

const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/clapping.mp3");

const volumeSlider = document.getElementById("volumeSlider");

function updateVolume(){

correctSound.volume = volumeSlider.value;
wrongSound.volume = volumeSlider.value;
clapSound.volume = volumeSlider.value;

}

volumeSlider.addEventListener("input",updateVolume);

updateVolume();

/* VARIABLES */

const ship = document.getElementById("ship");

let shipX = window.innerWidth/2;

let crystalsCollected = 0;
let currentQuestion = 0;

let gameRunning = false;

/* QUESTIONS */

const questions = [

{
q:`🚨 Mission Control received a broken message:<br><br>
“Captain Nova repaired the engine hisself.”<br><br>
Choose the BEST correction.`,
o:["himself","herself","itself","yourself"],
a:1
},

{
q:`👽 Which message sounds correct?`,
o:[
"The astronaut which saved us is brave.",
"The astronaut who saved us is brave.",
"The astronaut himself saved us who.",
"The astronaut hisself saved us."
],
a:1
},

{
q:`☄️ Leo accidentally sprayed foam all over ____ while testing the jetpack.`,
o:["himself","herself","ourselves","who"],
a:0
},

{
q:`🤖 The cleaning robot said:<br><br>
“I repaired ____ after the meteor crash.”`,
o:["itself","himself","yourself","themselves"],
a:0
},

{
q:`🪐 The astronaut ____ discovered Planet Orion became famous overnight.`,
o:["himself","who","ourselves","itself"],
a:1
},

{
q:`🚀 After escaping the asteroid storm, the astronauts proudly said:<br><br>
“We saved the spaceship ____!”`,
o:["itself","ourselves","himself","herself"],
a:1
},

{
q:`📡 One spaceship message is WRONG. Which one?`,
o:[
"The robot repaired itself.",
"Captain Vega repaired himself.",
"The astronaut who called us is safe.",
"Mia repaired theirself."
],
a:3
},

{
q:`👾 The alien creature ____ escaped from the space zoo is hiding in the cafeteria.`,
o:["herself","who","that","ourselves"],
a:2
},

{
q:`🌌 Commander Tia completed the dangerous rescue mission ____ while the crew stayed inside.`,
o:["myself","herself","itself","themselves"],
a:1
},

{
q:`🚨 Which emergency message sounds BEST?`,
o:[
"The pilot fixed the controls himself.",
"The pilot fixed the controls hisself.",
"The pilot fixed the controls theirselves.",
"The pilot fixed the controls who."
],
a:0
}

];

questions.sort(()=>Math.random()-0.5);

/* START */

function startGame(){

document.getElementById("startScreen").style.display="none";

gameRunning = true;

spawnCrystal();

}

/* MOVE SHIP */

document.addEventListener("mousemove",(e)=>{

shipX = e.clientX;

ship.style.left = shipX + "px";

});

/* MOBILE TOUCH */

document.addEventListener("touchmove",(e)=>{

shipX = e.touches[0].clientX;

ship.style.left = shipX + "px";

});

/* SPAWN CRYSTALS */

function spawnCrystal(){

if(!gameRunning) return;

const crystal = document.createElement("div");

crystal.classList.add("crystal");

crystal.innerHTML = "💎";

crystal.style.left =
Math.random()*(window.innerWidth-50)+"px";

crystal.style.animationDuration =
(5 + Math.random()*2)+"s";

document.getElementById("gameArea").appendChild(crystal);

let checkCollision = setInterval(()=>{

const crystalRect = crystal.getBoundingClientRect();
const shipRect = ship.getBoundingClientRect();

if(
crystalRect.left < shipRect.right &&
crystalRect.right > shipRect.left &&
crystalRect.top < shipRect.bottom &&
crystalRect.bottom > shipRect.top
){

clearInterval(checkCollision);

crystal.remove();

collectCrystal();

}

if(crystalRect.top > window.innerHeight){

clearInterval(checkCollision);

crystal.remove();

}

},30);

setTimeout(spawnCrystal,2500);

}

/* COLLECT */

function collectCrystal(){

crystalsCollected++;

document.getElementById("crystalCount").innerText =
crystalsCollected;

clapSound.play();

createConfetti();

showQuestion();

}

/* SHOW QUESTION */

function showQuestion(){

gameRunning = false;

document.getElementById("questionBox").style.display =
"block";

const q = questions[currentQuestion];

document.getElementById("questionText").innerHTML =
q.q;

const optionsDiv =
document.getElementById("options");

optionsDiv.innerHTML = "";

document.getElementById("feedback").innerHTML = "";

q.o.forEach((option,index)=>{

const btn = document.createElement("button");

btn.classList.add("optionBtn");

btn.innerHTML = option;

btn.onclick = ()=>checkAnswer(index,q.a);

optionsDiv.appendChild(btn);

});

}

/* CHECK */

function checkAnswer(selected,correct){

const feedback = document.getElementById("feedback");

if(selected === correct){

feedback.innerHTML = "🎉 Correct!";
feedback.className = "correct";

correctSound.play();

createConfetti();

}else{

feedback.innerHTML = "❌ Wrong!";
feedback.className = "wrong";

wrongSound.play();

}

currentQuestion++;

document.getElementById("questionCount").innerText =
currentQuestion;

setTimeout(()=>{

document.getElementById("questionBox").style.display =
"none";

if(currentQuestion >= 10){

endGame();

}else{

gameRunning = true;

spawnCrystal();

}

},1800);

}

/* CONFETTI */

function createConfetti(){

for(let i=0;i<40;i++){

const conf = document.createElement("div");

conf.classList.add("confetti");

conf.style.left = Math.random()*100 + "%";

conf.style.background =
`hsl(${Math.random()*360},100%,50%)`;

conf.style.animationDuration =
(2 + Math.random()*2)+"s";

document.body.appendChild(conf);

setTimeout(()=>{

conf.remove();

},4000);

}

}

/* END */

function endGame(){

document.getElementById("endScreen").style.display =
"flex";

document.getElementById("finalText").innerHTML =
"You collected <b>"+crystalsCollected+
"</b> energy crystals and saved the galaxy!";

}

/* RESTART */

function restartGame(){

location.reload();

}

</script>

</body>
</html>
