<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👗 Adjectives Fashion Kingdom Adventure</title>

<style>
/* ==========================================================================
   RESET & GLASSMORPHISM CORE VARIABLES
   ========================================================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
}

body {
    overflow: hidden;
    background: #4a0e2e;
    height: 100vh;
    color: #ffffff;
}

/* ==========================================================================
   PREMIUM RUNWAY ENVIRONMENT (BACKDROP ANIMATIONS)
   ========================================================================== */
#gameArea {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #1f0318 0%, #4c052e 40%, #760c47 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 15px;
}

/* Ambient Runway Spotlights */
.light-beam {
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(244, 63, 94, 0.15) 0%, rgba(0,0,0,0) 70%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    animation: driftBeam 12s infinite alternate ease-in-out;
}
.beam-2 {
    background: radial-gradient(circle, rgba(192, 38, 211, 0.15) 0%, rgba(0,0,0,0) 70%);
    animation-duration: 18s;
    animation-delay: -4s;
}

@keyframes driftBeam {
    0% { transform: translate(-150px, -100px) scale(1); }
    100% { transform: translate(150px, 150px) scale(1.3); }
}

/* Floating Magic Sparkles */
.glimmer {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fdf2e9;
    border-radius: 50%;
    opacity: 0.6;
    pointer-events: none;
    z-index: 2;
    animation: sparkleUp linear infinite;
}

@keyframes sparkleUp {
    0% { transform: translateY(105vh) scale(0.5); opacity: 0; }
    20% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-5vh) scale(1.2); opacity: 0; }
}

/* ==========================================================================
   DYNAMIC INTERFACE STRUCTURAL FRAMEWORK (ANTI-OVERLAP)
   ========================================================================== */
.screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 20px;
    text-align: center;
    z-index: 2000;
}
.screen.active {
    display: flex;
}

/* Premium Glassmorphic Layout Base */
.glass-container {
    background: rgba(30, 10, 24, 0.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(244, 63, 94, 0.25);
    border-radius: 28px;
    padding: 30px;
    width: 100%;
    max-width: 640px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    max-height: 90vh;
    overflow-y: auto;
    scrollbar-width: none; /* Hide scrollbars for crisp presentation */
}
.glass-container::-webkit-scrollbar { display: none; }

/* Interactive Screens Layout */
#logoScreen { background: #ffffff; z-index: 9999; }
#logoScreen img { width: 240px; max-width: 80%; animation: pulseLogo 2s infinite alternate ease-in-out; }

@keyframes pulseLogo {
    from { transform: scale(0.96); filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1)); }
    to { transform: scale(1.04); filter: drop-shadow(0 12px 25px rgba(0,0,0,0.15)); }
}

/* Global Audio Controls Widget */
.audio-bar-widget {
    position: fixed;
    top: 15px;
    right: 15px;
    background: rgba(20, 5, 15, 0.85);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 8px 14px;
    border-radius: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 5000;
}
.audio-bar-widget button { background: none; border: none; cursor: pointer; font-size: 18px; }
.audio-slider { width: 60px; accent-color: #f43f5e; cursor: pointer; }

/* ==========================================================================
   FLEXIBLE RUNWAY INTERFACE (MAIN GAME VIEWPORT)
   ========================================================================== */
#hudHeader {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 100;
}

#stageTitle {
    background: linear-gradient(135deg, #f43f5e, #be123c);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 16px;
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
    padding: 12px;
    text-align: center;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 20px rgba(244, 63, 94, 0.3);
}

.metrics-panel {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 15px;
    font-weight: 700;
}
.stat-tag {
    background: rgba(15, 2, 10, 0.6);
    padding: 6px 14px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.08);
}

/* Responsive Progress Flow Tracker */
#progressTrackOuter {
    width: 100%;
    height: 10px;
    background: #310820;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.05);
}
#progressBarFill {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ec4899, #f43f5e, #e11d48);
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Main Character Runway Arena Layout Frame */
#runwayCanvasStage {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 180px;
    z-index: 10;
}

#character {
    font-size: 100px;
    line-height: 1;
    filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5));
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.walk-step { transform: translateX(-50%) translateY(-15px) scale(1.1); }
.success-glow { animation: rewardPulse 0.8s ease-out; }

@keyframes rewardPulse {
    0% { filter: drop-shadow(0 0 0px #f43f5e); transform: scale(1); }
    50% { filter: drop-shadow(0 0 30px #f43f5e); transform: scale(1.2); }
    100% { filter: drop-shadow(0 15px 20px rgba(0,0,0,0.5)); transform: scale(1); }
}

#challengeBox {
    background: rgba(253, 224, 71, 0.15);
    border: 1px dashed #fde047;
    color: #fde047;
    padding: 8px 18px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    margin-top: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Wardrobe Items Section Grid */
#itemsArea {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 10px 0;
    z-index: 100;
}
.item {
    width: 65px;
    height: 65px;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    cursor: pointer;
    transition: all 0.2s ease;
}
.item:hover {
    background: rgba(244, 63, 94, 0.2);
    border-color: #f43f5e;
    transform: translateY(-4px);
}
.item.selected-closet {
    background: #10b981 !important;
    border-color: #34d399 !important;
    transform: scale(0.9) rotate(-5deg);
    pointer-events: none;
}

/* ==========================================================================
   ADJECTIVES MODAL OVERLAY (THE INTEGRATED CHALLENGE BOX)
   ========================================================================== */
#questionBox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 2, 10, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 4000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

#questionText {
    font-size: 20px;
    line-height: 1.6;
    color: #f1f5f9;
    margin-bottom: 20px;
    text-align: left;
    background: rgba(0,0,0,0.2);
    padding: 15px;
    border-radius: 14px;
    border-left: 4px solid #f43f5e;
}

/* Highlighted specific elements matching the adjective bank patterns */
#questionText br { display: block; content: ""; margin-top: 5px; }

#options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    width: 100%;
}
.optionBtn {
    width: 100%;
    padding: 14px 18px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.06);
    color: #f8fafc;
    font-size: 17px;
    font-weight: 700;
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
}
.optionBtn:hover:not(:disabled) {
    background: rgba(244, 63, 94, 0.25);
    border-color: #f43f5e;
    transform: translateX(4px);
}

.optionBtn.correct-choice {
    background: #065f46 !important;
    border-color: #10b981 !important;
    color: #ffffff !important;
}
.optionBtn.wrong-choice {
    background: #991b1b !important;
    border-color: #ef4444 !important;
    color: #ffffff !important;
}

#feedback {
    margin-top: 15px;
    font-size: 20px;
    font-weight: 800;
    min-height: 28px;
}
.correct { color: #34d399; }
.wrong { color: #f87171; }

/* Shake effect layout on error matrices */
.screen-shake {
    animation: layoutShake 0.4s ease-in-out;
}
@keyframes layoutShake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-8px, 0); }
    75% { transform: translate(8px, 0); }
}

/* ==========================================================================
   ACTION PLATFORM CONTROL ITEMS
   ========================================================================== */
.mainBtn {
    padding: 14px 32px;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 50px;
    background: linear-gradient(135deg, #f43f5e, #be123c);
    color: white;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(244, 63, 94, 0.4);
    transition: all 0.25s ease;
}
.mainBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(244, 63, 94, 0.6);
}

/* Canvas layer configuration */
#confettiCanvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6000;
}

/* ==========================================================================
   MOBILE SCALING MEDIA ADAPTABILITY (ANTI-OVERLAP RULES)
   ========================================================================== */
@media (max-width: 768px) {
    #stageTitle { font-size: 17px; padding: 10px; }
    #character { font-size: 75px; }
    .item { width: 56px; height: 56px; font-size: 26px; border-radius: 12px; }
    #itemsArea { gap: 8px; }
    #questionText { font-size: 17px; padding: 12px; }
    .optionBtn { padding: 12px 15px; font-size: 15px; }
    .glass-container { padding: 20px 15px; }
}

@media (max-height: 560px) {
    #character { font-size: 55px; }
    #stageTitle { font-size: 15px; padding: 6px; }
    .item { width: 45px; height: 45px; font-size: 20px; }
    #challengeBox { font-size: 11px; margin-top: 4px; }
}
</style>
</head>

<body>

<canvas id="confettiCanvas"></canvas>

<audio id="soundCorrect" src="assets/correct.mp3" preload="auto"></audio>
<audio id="soundWrong" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="soundClapping" src="assets/clapping.mp3" preload="auto"></preload>

<div id="gameArea">
    <div class="light-beam"></div>
    <div class="light-beam beam-2"></div>

    <div class="audio-bar-widget">
        <button id="audioMuteBtn">🔊</button>
        <input type="range" class="audio-slider" id="audioVolumeSlider" min="0" max="1" step="0.1" value="0.7">
    </div>

    <div id="logoScreen">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
    </div>

    <div id="startScreen" class="screen">
        <div class="glass-container">
            <span style="font-size: 60px; display: block; margin-bottom: 10px;">👑</span>
            <h1 style="font-size: 32px; margin-bottom: 15px; color: #f43f5e;">Fashion Show Makeover Studio</h1>
            <p style="font-size: 16px; line-height: 1.6; color: #cbd5e1; margin-bottom: 20px;">
                Welcome to the Adjectives Fashion Kingdom! Each fashion theme requires your stylistic genius. 
                Collect wardrobe assets to trigger custom grammar challenges, unlock elite modifiers, and complete all 10 runway events successfully!
            </p>
            <button class="mainBtn" onclick="startGame()">ENTER THE STUDIO</button>
        </div>
    </div>

    <div id="endScreen" class="screen">
        <div class="glass-container">
            <span style="font-size: 65px; display: block; margin-bottom: 10px;">🏆</span>
            <h1 style="font-size: 30px; margin-bottom: 10px; color: #34d399;">Showcase Complete</h1>
            <h2 id="finalText" style="font-size: 18px; font-weight: 500; color: #e2e8f0; margin-bottom: 25px;"></h2>
            <button class="mainBtn" onclick="restartGame()">🔄 Dress Another Runway</button>
        </div>
    </div>

    <div id="hudHeader">
        <div id="stageTitle">👗 Fashion Challenge</div>
        <div class="metrics-panel">
            <div class="stat-tag">👑 Styles: <span id="styleCount">0</span></div>
            <div class="stat-tag">✨ Runways: <span id="questionCount">0</span>/10</div>
        </div>
        <div id="progressTrackOuter">
            <div id="progressBarFill"></div>
        </div>
    </div>

    <div id="runwayCanvasStage">
        <div id="challengeBox">Choose 3 items!</div>
        <div id="character">👩‍🎤</div>
    </div>

    <div id="itemsArea"></div>

    <div id="questionBox">
        <div class="glass-container" id="modalGlassTarget">
            <div id="questionText"></div>
            <div id="options"></div>
            <div id="feedback"></div>
        </div>
    </div>
</div>

<script>
/****************************************************************************
 * BACKDROP SPARKLING ENGINE GENERATOR
 ****************************************************************************/
const gameArea = document.getElementById("gameArea");
for (let i = 0; i < 20; i++) {
    let sparkle = document.createElement("div");
    sparkle.className = "glimmer";
    sparkle.style.left = Math.random() * 100 + "vw";
    sparkle.style.animationDuration = (5 + Math.random() * 7) + "s";
    sparkle.style.animationDelay = Math.random() * 5 + "s";
    gameArea.appendChild(sparkle);
}

/****************************************************************************
 * PLATFORM AUDIO CONFIGURATIONS MANAGER
 ****************************************************************************/
const soundCorrect = document.getElementById("soundCorrect");
const soundWrong = document.getElementById("soundWrong");
const soundClapping = document.getElementById("soundClapping");
const audioMuteBtn = document.getElementById("audioMuteBtn");
const audioVolumeSlider = document.getElementById("audioVolumeSlider");

let isMutedState = false;
let currentVolumeLevel = 0.7;

function synchronizeAudioDeviceLevels() {
    const activeVolumeTarget = isMutedState ? 0 : currentVolumeLevel;
    soundCorrect.volume = activeVolumeTarget;
    soundWrong.volume = activeVolumeTarget;
    soundClapping.volume = activeVolumeTarget;
    audioMuteBtn.innerText = isMutedState ? "❌" : "🔊";
}

audioVolumeSlider.oninput = function() {
    currentVolumeLevel = parseFloat(this.value);
    if (currentVolumeLevel > 0) isMutedState = false;
    synchronizeAudioDeviceLevels();
};

audioMuteBtn.onclick = function() {
    isMutedState = !isMutedState;
    synchronizeAudioDeviceLevels();
};

function triggerAudioPlay(audioElement) {
    try {
        audioElement.currentTime = 0;
        audioElement.play();
    } catch(err) { console.log("Audio pipeline interaction pending user click."); }
}

/****************************************************************************
 * IMMUTABLE WORD DATA & CONFIGURATIONS BANK
 ****************************************************************************/
const fashionThemes = [
    {emoji:"👑 Royal", items:["👑","💍","👜","👗","🕶️","👒"]},
    {emoji:"👕 Casual", items:["👕","👟","🧢","🧥","🎒","🧦"]},
    {emoji:"🎉 Party", items:["👗","👠","💄","🎩","✨","👜"]},
    {emoji:"❄️ Winter", items:["🧥","🧣","🧤","👢","☕","👒"]},
    {emoji:"🏃 Sport", items:["👟","🏀","🎽","🧢","🏅","🏈"]}
];

let themeIndex = 0;
let stylesCompleted = 0;
let currentQuestion = 0;
let selectedCount = 0;
let attempt = 0;

/* QUESTIONS (SORT ORDER IS RANDOMIZED AS PROVIDED WHILE PRESERVING INNER WORD CORES 100%) */
const questions = [
    {
        q: `👗 Mia bought a beautiful dress for the school concert.<br><br>Which word is the adjective of quality?`,
        o: ["Mia","beautiful","dress","concert"],
        a: 1
    },
    {
        q: `🍎 The grocery cart had many apples inside it.<br><br>Which word is the adjective of quantity?`,
        o: ["grocery","many","inside","apples"],
        a: 1
    },
    {
        q: `🎈 Three balloons floated to the ceiling.<br><br>Which word is the adjective of number?`,
        o: ["Three","balloons","floated","ceiling"],
        a: 0
    },
    {
        q: `👟 Those shoes near the window are expensive.<br><br>Which word is the demonstrative adjective?`,
        o: ["window","Those","expensive","shoes"],
        a: 1
    },
    {
        q: `🍛 We ate delicious Indian food at the festival.<br><br>Which word is the proper adjective?`,
        o: ["festival","delicious","Indian","food"],
        a: 2
    },
    {
        q: `🎒 Her backpack is filled with art supplies.<br><br>Which word is the possessive adjective?`,
        o: ["Her","filled","backpack","supplies"],
        a: 0
    },
    {
        q: `🧥 Which jacket should we buy for winter?<br><br>Which word is the interrogative adjective?`,
        o: ["buy","winter","Which","jacket"],
        a: 2
    },
    {
        q: `🐶 The playful puppy chased the ball around the park.<br><br>Which word is the adjective of quality?`,
        o: ["park","playful","ball","around"],
        a: 1
    },
    {
        q: `🍪 Few cookies remained after the party ended.<br><br>Which word is the adjective of quantity?`,
        o: ["Few","cookies","party","ended"],
        a: 0
    },
    {
        q: `📚 These books belong to our classroom library.<br><br>Which word is the demonstrative adjective?`,
        o: ["library","books","These","classroom"],
        a: 2
    }
];

questions.sort(() => Math.random() - 0.5);

/****************************************************************************
 * INITIAL TRANSITION AND STEPPER LOOPS
 ****************************************************************************/
setTimeout(() => {
    document.getElementById("logoScreen").style.display = "none";
    document.getElementById("startScreen").classList.add("active");
    synchronizeAudioDeviceLevels();
}, 5000);

function startGame() {
    document.getElementById("startScreen").classList.remove("active");
    loadItems();
}

function setTheme() {
    let t = fashionThemes[themeIndex];
    themeIndex = (themeIndex + 1) % fashionThemes.length;
    document.getElementById("stageTitle").innerText = "👗 " + t.emoji + " Fashion Challenge";
    return t;
}

function loadItems() {
    const itemsArea = document.getElementById("itemsArea");
    itemsArea.innerHTML = "";
    selectedCount = 0;
    attempt = 0;

    let theme = setTheme();
    let shuffled = [...theme.items].sort(() => Math.random() - 0.5).slice(0, 5);

    shuffled.forEach(i => {
        let div = document.createElement("div");
        div.className = "item";
        div.innerText = i;
        div.onclick = () => selectItem(div);
        itemsArea.appendChild(div);
    });

    document.getElementById("character").className = "";
}

function selectItem(div) {
    if(div.classList.contains("selected-closet")) return;
    
    div.classList.add("selected-closet");
    selectedCount++;
    
    // Tiny bounce on choosing a dress component item
    const char = document.getElementById("character");
    char.style.transform = "scale(1.15)";
    setTimeout(() => { char.style.transform = "scale(1)"; }, 200);

    if (selectedCount >= 3) {
        setTimeout(showQuestion, 400);
    }
}

/****************************************************************************
 * SCREEN TRANSITIONS AND CORE QUESTION PROCESSING ENGINE
 ****************************************************************************/
function showQuestion() {
    document.getElementById("questionBox").style.display = "flex";

    let q = questions[currentQuestion];
    document.getElementById("questionText").innerHTML = q.q;

    let optionsContainer = document.getElementById("options");
    optionsContainer.innerHTML = "";
    document.getElementById("feedback").innerHTML = "";

    q.o.forEach((op, i) => {
        let btn = document.createElement("button");
        btn.className = "optionBtn";
        btn.innerText = op;
        btn.onclick = () => checkAnswer(btn, i, q.a);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(chosenBtn, sel, correct) {
    let fb = document.getElementById("feedback");
    let modalGlass = document.getElementById("modalGlassTarget");
    let allBtns = document.querySelectorAll(".optionBtn");

    if (sel === correct) {
        allBtns.forEach(b => b.disabled = true);
        chosenBtn.classList.add("correct-choice");
        
        fb.innerHTML = "✨ Elegant choice! Correct!";
        fb.className = "correct";
        triggerAudioPlay(soundCorrect);
        triggerConfettiExplosionRain();

        stylesCompleted++;
        currentQuestion++;

        document.getElementById("styleCount").innerText = stylesCompleted;
        document.getElementById("questionCount").innerText = currentQuestion;
        document.getElementById("progressBarFill").style.width = ((currentQuestion / 10) * 100) + "%";
        
        document.getElementById("character").classList.add("success-glow");

        setTimeout(() => {
            document.getElementById("questionBox").style.display = "none";
            if (currentQuestion >= 10) {
                endGame();
            } else {
                loadItems();
            }
        }, 1800);

    } else {
        attempt++;
        chosenBtn.classList.add("wrong-choice");
        chosenBtn.disabled = true;
        
        modalGlass.classList.add("screen-shake");
        triggerAudioPlay(soundWrong);
        setTimeout(() => { modalGlass.classList.remove("screen-shake"); }, 400);

        if (attempt < 2) {
            fb.innerHTML = "❌ Style Clash! Try Another Option.";
            fb.className = "wrong";
        } else {
            allBtns.forEach(b => b.disabled = true);
            fb.innerHTML = "⚡ Runway Revealed the Outfit!";
            fb.className = "wrong";
            
            // Highlight right option array row indices matchers
            allBtns[correct].classList.add("correct-choice");

            setTimeout(() => {
                document.getElementById("questionBox").style.display = "none";
                currentQuestion++;
                document.getElementById("questionCount").innerText = currentQuestion;
                document.getElementById("progressBarFill").style.width = ((currentQuestion / 10) * 100) + "%";
                if (currentQuestion >= 10) {
                    endGame();
                } else {
                    loadItems();
                }
            }, 1800);
        }
    }
}

function endGame() {
    document.getElementById("questionBox").style.display = "none";
    document.getElementById("endScreen").classList.add("active");
    document.getElementById("finalText").innerText = 
        "Splendid! You completed " + stylesCompleted + " out of 10 royal fashion missions correctly!";
    triggerAudioPlay(soundClapping);
    triggerConfettiExplosionRain();
}

function restartGame() {
    location.reload();
}

/****************************************************************************
 * CUSTOM HIGH-PERFORMANCE CANVAS CONFETTI MATRIX
 ****************************************************************************/
const canvas = document.getElementById("confettiCanvas");
const ctx = canvas.getContext("2d");
let confettiArray = [];
let animId = null;

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

function triggerConfettiExplosionRain() {
    confettiArray = [];
    for (let i = 0; i < 100; i++) {
        confettiArray.push({
            x: Math.random() * canvas.width,
            y: -10,
            r: Math.random() * 6 + 4,
            d: Math.random() * canvas.height,
            color: "hsl(" + Math.random() * 360 + ", 90%, 65%)",
            tilt: Math.random() * 10 - 5,
            speed: Math.random() * 4 + 3
        });
    }
    if(!animId) loopConfetti(0);
}

function loopConfetti(ticks) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiArray.forEach(p => {
        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
        ctx.stroke();
        
        p.y += p.speed;
        p.x += Math.sin(p.tilt) * 0.5;
    });
    
    if(ticks < 120) {
        animId = requestAnimationFrame(() => loopConfetti(ticks + 1));
    } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        animId = null;
    }
}
</script>
