<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 Fashion Show Makeover Studio</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:#ffd1dc;
}

#gameArea{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:linear-gradient(to bottom,#ffdde1,#ee9ca7,#ffd3b6);
}

/* LIGHT EFFECTS */
.light{
position:absolute;
width:300px;
height:300px;
background:rgba(255,255,255,0.08);
border-radius:50%;
filter:blur(50px);
animation:moveLight 10s infinite alternate;
}
.light2{animation-duration:16s;}

@keyframes moveLight{
from{transform:translate(-100px,-50px);}
to{transform:translate(220px,120px);}
}

/* LOGO */
#logoScreen{
position:absolute;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#logoScreen img{
width:260px;
max-width:80%;
}

/* START & END */
#startScreen,#endScreen{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.82);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
text-align:center;
z-index:5000;
padding:20px;
}

.mainBtn{
padding:16px 34px;
font-size:22px;
border:none;
border-radius:18px;
background:#ff4081;
color:white;
margin-top:20px;
cursor:pointer;
}

/* TITLE */
#stageTitle{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
width:82%;
background:white;
border:6px solid #ff4081;
border-radius:18px;
font-size:24px;
font-weight:bold;
color:#c2185b;
padding:10px;
text-align:center;
z-index:50;
}

/* CHARACTER */
#character{
position:absolute;
bottom:110px;
left:50%;
transform:translateX(-50%);
font-size:120px;
}

/* GIRL CHARACTER ADDED */
#character{
content:"👩‍🎤";
}

/* ITEMS */
#itemsArea{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
width:95%;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:15px;
}

.item{
width:85px;
height:85px;
background:white;
border-radius:18px;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
cursor:pointer;
box-shadow:0 0 10px rgba(0,0,0,0.2);
transition:0.2s;
}

/* SCORE */
#scoreBoard{
position:absolute;
top:10px;
left:10px;
background:white;
padding:10px 14px;
border-radius:12px;
font-weight:bold;
z-index:200;
}

/* CHALLENGE */
#challengeBox{
position:absolute;
top:120px;
left:50%;
transform:translateX(-50%);
background:#fff9c4;
padding:14px 20px;
border-radius:15px;
font-weight:bold;
color:#e65100;
z-index:150;
}

/* QUESTION */
#questionBox{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:90%;
max-width:600px;
background:#fff8e1;
padding:20px;
border-radius:20px;
display:none;
z-index:4000;
}

.optionBtn{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:12px;
background:#4caf50;
color:white;
font-size:16px;
cursor:pointer;
}

/* FEEDBACK */
.correct{color:green;font-size:24px;text-align:center;}
.wrong{color:red;font-size:24px;text-align:center;}

</style>
</head>

<body>

<div id="gameArea">

<div id="logoScreen">
<img src="assets/innovine-logo.png">
</div>

<div id="startScreen" style="display:none;">
<h1>Fashion Show Makeover Studio</h1>
<button class="mainBtn" onclick="startGame()">Start</button>
</div>

<div id="endScreen" style="display:none;">
<h1>Game Complete</h1>
<h2 id="finalText"></h2>
<button class="mainBtn" onclick="restartGame()">Play Again</button>
</div>

<div id="stageTitle">👗 Fashion Challenge</div>

<div id="scoreBoard">
Styles: <span id="styleCount">0</span> |
Q: <span id="questionCount">0</span>/10
</div>

<div id="challengeBox">Choose 3 items!</div>

<div id="character">👩‍🎤</div>

<div id="itemsArea"></div>

<div id="questionBox">
<div id="questionText"></div>
<div id="options"></div>
<div id="feedback"></div>
</div>

</div>

<script>

/* LOGO */
setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";
},5000);

/* THEMES */
const fashionThemes=[
{emoji:"👑 Royal",items:["👑","💍","👜","👗","🕶️","👒"]},
{emoji:"👕 Casual",items:["👕","👟","🧢","🧥","🎒","🧦"]},
{emoji:"🎉 Party",items:["👗","👠","💄","🎩","✨","👜"]},
{emoji:"❄️ Winter",items:["🧥","🧣","🧤","👢","☕","👒"]},
{emoji:"🏃 Sport",items:["👟","🏀","🎽","🧢","🏅","🏈"]}
];

let themeIndex=0;

/* GAME STATE */
let stylesCompleted=0;
let currentQuestion=0;
let selectedCount=0;
let attempt=0;

/* QUESTIONS (UNCHANGED) */
const questions=[
{
q:`👗 Mia bought a beautiful dress for the school concert.<br><br>Which word is the adjective of quality?`,
o:["Mia","beautiful","dress","concert"],
a:1
},
{
q:`🍎 The grocery cart had many apples inside it.<br><br>Which word is the adjective of quantity?`,
o:["grocery","many","inside","apples"],
a:1
},
{
q:`🎈 Three balloons floated to the ceiling.<br><br>Which word is the adjective of number?`,
o:["Three","balloons","floated","ceiling"],
a:0
},
{
q:`👟 Those shoes near the window are expensive.<br><br>Which word is the demonstrative adjective?`,
o:["window","Those","expensive","shoes"],
a:1
},
{
q:`🍛 We ate delicious Indian food at the festival.<br><br>Which word is the proper adjective?`,
o:["festival","delicious","Indian","food"],
a:2
},
{
q:`🎒 Her backpack is filled with art supplies.<br><br>Which word is the possessive adjective?`,
o:["Her","filled","backpack","supplies"],
a:0
},
{
q:`🧥 Which jacket should we buy for winter?<br><br>Which word is the interrogative adjective?`,
o:["buy","winter","Which","jacket"],
a:2
},
{
q:`🐶 The playful puppy chased the ball around the park.<br><br>Which word is the adjective of quality?`,
o:["park","playful","ball","around"],
a:1
},
{
q:`🍪 Few cookies remained after the party ended.<br><br>Which word is the adjective of quantity?`,
o:["Few","cookies","party","ended"],
a:0
},
{
q:`📚 These books belong to our classroom library.<br><br>Which word is the demonstrative adjective?`,
o:["library","books","These","classroom"],
a:2
}
];

questions.sort(()=>Math.random()-0.5);

/* START */
function startGame(){
document.getElementById("startScreen").style.display="none";
loadItems();
}

/* THEME */
function setTheme(){
let t=fashionThemes[themeIndex];
themeIndex=(themeIndex+1)%fashionThemes.length;
document.getElementById("stageTitle").innerText=t.emoji+" Fashion Challenge";
return t;
}

/* LOAD ITEMS */
function loadItems(){
itemsArea.innerHTML="";
selectedCount=0;
attempt=0;

let theme=setTheme();

let shuffled=[...theme.items].sort(()=>Math.random()-0.5).slice(0,5);

shuffled.forEach(i=>{
let div=document.createElement("div");
div.className="item";
div.innerText=i;
div.onclick=()=>selectItem(div);
itemsArea.appendChild(div);
});
}

/* SELECT */
function selectItem(div){
div.style.background="#81c784";
selectedCount++;
if(selectedCount>=3){
showQuestion();
}
}

/* QUESTION */
function showQuestion(){
document.getElementById("questionBox").style.display="block";

let q=questions[currentQuestion];
document.getElementById("questionText").innerHTML=q.q;

let options=document.getElementById("options");
options.innerHTML="";
document.getElementById("feedback").innerHTML="";

q.o.forEach((op,i)=>{
let btn=document.createElement("button");
btn.className="optionBtn";
btn.innerText=op;
btn.onclick=()=>checkAnswer(i,q.a);
options.appendChild(btn);
});
}

/* ANSWER */
function checkAnswer(sel,correct){
let fb=document.getElementById("feedback");

if(sel===correct){
fb.innerHTML="Correct!";
fb.className="correct";

stylesCompleted++;
currentQuestion++;

document.getElementById("styleCount").innerText=stylesCompleted;
document.getElementById("questionCount").innerText=currentQuestion;

setTimeout(()=>{
document.getElementById("questionBox").style.display="none";
if(currentQuestion>=10){
endGame();
}else{
loadItems();
}
},1000);

}else{
attempt++;
fb.innerHTML = attempt<2 ? "Try Again!" : "Answer Revealed!";
fb.className="wrong";

if(attempt>=2){
setTimeout(()=>{
document.getElementById("questionBox").style.display="none";
currentQuestion++;
loadItems();
},1200);
}
}
}

/* END */
function endGame(){
document.getElementById("endScreen").style.display="flex";
document.getElementById("finalText").innerText=
"You completed "+stylesCompleted+" fashion missions!";
}

/* RESTART */
function restartGame(){
location.reload();
}

</script>

</body>
</html>
