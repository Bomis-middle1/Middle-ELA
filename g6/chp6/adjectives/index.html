<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
<title>🎨 Fashion Show Makeover Studio</title>

<style>
/* ==========================================================================
   RESET & SYSTEM BASICS
   ========================================================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    overflow: hidden;
    background: #ffd1dc;
    height: 100vh;
    height: -webkit-fill-available;
}

/* ==========================================================================
   ANTI-OVERLAP RUNWAY FLEXBOX LAYOUT
   ========================================================================== */
#gameArea {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: -webkit-fill-available;
    overflow: hidden;
    background: linear-gradient(to bottom, #ffdde1, #ee9ca7, #ffd3b6);
    
    /* Layout alignment to explicitly prevent collisions */
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
}

/* LIGHT EFFECTS */
.light {
    position: absolute;
    width: 250px;
    height: 250px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 50%;
    filter: blur(40px);
    pointer-events: none;
    z-index: 1;
    animation: moveLight 8s infinite alternate ease-in-out;
}
.light2 {
    animation-duration: 14s;
    animation-delay: -2s;
}

@keyframes moveLight {
    from { transform: translate(-100px, -50px); }
    to { transform: translate(150px, 100px); }
}

/* ==========================================================================
   SCREENS OVERLAYS (START, END, LOGO)
   ========================================================================== */
#logoScreen, #startScreen, #endScreen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 5000;
    padding: 20px;
    text-align: center;
}

#logoScreen {
    background: #ffffff;
    z-index: 9999;
}
#logoScreen img {
    width: 240px;
    max-width: 80%;
}

#startScreen, #endScreen {
    background: rgba(15, 2, 8, 0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: white;
}

#startScreen h1, #endScreen h1 {
    font-size: 28px;
    margin-bottom: 10px;
    color: #ff4081;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}

.mainBtn {
    padding: 14px 36px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 25px;
    background: linear-gradient(135deg, #ff4081, #c2185b);
    color: white;
    margin-top: 24px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
    transition: transform 0.2s;
}
.mainBtn:active {
    transform: scale(0.95);
}

/* ==========================================================================
   HEADER STRUCTURAL HUB
   ========================================================================== */
#headerGroup {
    width: 100%;
    max-width: 500px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 100;
}

#stageTitle {
    width: 100%;
    background: white;
    border: 3px solid #ff4081;
    border-radius: 14px;
    font-size: 18px;
    font-weight: bold;
    color: #c2185b;
    padding: 8px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

#scoreBoard {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(4px);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    color: #333;
    border: 1px solid rgba(255, 64, 129, 0.2);
}

#challengeBox {
    background: #fff9c4;
    border: 1px solid #ffe082;
    padding: 6px 16px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
    color: #e65100;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

/* ==========================================================================
   DYNAMIC RUNWAY STAGE ARENA
   ========================================================================== */
#runwayStage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 120px;
    z-index: 10;
}

#character {
    font-size: 90px;
    line-height: 1;
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
    transition: transform 0.3s ease;
}

/* ==========================================================================
   ITEMS STORAGE PANEL
   ========================================================================== */
#itemsArea {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 0;
    z-index: 100;
}

.item {
    width: 65px;
    height: 65px;
    background: white;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 16px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.08);
    transition: transform 0.2s, background 0.2s;
}
.item:active {
    transform: scale(0.9);
}

/* ==========================================================================
   ISOLATED INTERACTIVE WORKSHOP MODAL BOX
   ========================================================================== */
#questionBox {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 2, 8, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 16px;
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 6000;
}

.modal-content {
    background: #fff8e1;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
}

#questionText {
    font-size: 16px;
    line-height: 1.5;
    color: #334155;
    margin-bottom: 16px;
    background: rgba(255,255,255,0.5);
    padding: 12px;
    border-radius: 14px;
}

.optionBtn {
    width: 100%;
    padding: 12px 16px;
    margin: 6px 0;
    border: none;
    border-radius: 12px;
    background: #4caf50;
    color: white;
    font-size: 15px;
    font-weight: bold;
    text-align: left;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    box-shadow: 0 2px 4px rgba(76,175,80,0.2);
}
.optionBtn:active {
    transform: scale(0.99);
}

#feedback {
    margin-top: 10px;
    min-height: 24px;
}
.correct { color: #2e7d32; font-size: 18px; font-weight: bold; text-align: center; }
.wrong { color: #d32f2f; font-size: 18px; font-weight: bold; text-align: center; }

/* ==========================================================================
   RESPONSIVE SCALING ADAPTABILITY
   ========================================================================== */
@media (max-width: 360px) {
    #character { font-size: 70px; }
    .item { width: 55px; height: 55px; font-size: 26px; }
    #stageTitle { font-size: 16px; }
}
@media (min-width: 600px) {
    #character { font-size: 120px; }
    .item { width: 80px; height: 80px; font-size: 38px; }
    #stageTitle { font-size: 24px; padding: 12px; }
    #questionText { font-size: 18px; }
    .optionBtn { font-size: 16px; }
}
</style>
</head>

<body>

<div id="gameArea">
    <div class="light"></div>
    <div class="light light2"></div>

    <div id="logoScreen">
        <img src="assets/innovine-logo.png" alt="Logo">
    </div>

    <div id="startScreen" style="display:none;">
        <h1>Fashion Show<br>Makeover Studio</h1>
        <button class="mainBtn" onclick="startGame()">Start Game</button>
    </div>

    <div id="endScreen" style="display:none;">
        <h1>Game Complete</h1>
        <h2 id="finalText"></h2>
        <button class="mainBtn" onclick="restartGame()">Play Again</button>
    </div>

    <div id="headerGroup">
        <div id="stageTitle">👗 Fashion Challenge</div>
        <div id="scoreBoard">
            Styles: <span id="styleCount">0</span> | Q: <span id="questionCount">0</span>/10
        </div>
        <div id="challengeBox">Choose 3 items!</div>
    </div>

    <div id="runwayStage">
        <div id="character">👩‍🎤</div>
    </div>

    <div id="itemsArea"></div>

    <div id="questionBox">
        <div class="modal-content">
            <div id="questionText"></div>
            <div id="options"></div>
            <div id="feedback"></div>
        </div>
    </div>
</div>

<script>
/* LOGO SEQUENCING TIMERS */
setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("startScreen").style.display="flex";
},5000);

/* THEMES DATA CONFIGURATIONS */
const fashionThemes=[
    {emoji:"👑 Royal",items:["👑","💍","👜","👗","🕶️","👒"]},
    {emoji:"👕 Casual",items:["👕","👟","🧢","🧥","🎒","🧦"]},
    {emoji:"🎉 Party",items:["👗","👠","💄","🎩","✨","👜"]},
    {emoji:"❄️ Winter",items:["🧥","🧣","🧤","👢","☕","👒"]},
    {emoji:"🏃 Sport",items:["👟","🏀","🎽","🧢","🏅","🏈"]}
];

let themeIndex=0;

/* RUNTIME ENGINE STATES */
let stylesCompleted=0;
let currentQuestion=0;
let selectedCount=0;
let attempt=0;

/* IMMUTABLE QUESTION ARRAY DATA BANK */
const questions=[
    {
        q: `👗 Mia bought a beautiful dress for the school concert.<br><br>Which word is the adjective of quality?`,
        o: ["Mia","beautiful","dress","concert"],
        a: 1
    },
    {
        q: `🍎 The grocery cart had many apples inside it.<br><br>Which word is the adjective of quantity?`,
        o: ["grocery","many","inside","apples"],
        a: 1
    },
    {
        q: `🎈 Three balloons floated to the ceiling.<br><br>Which word is the adjective of number?`,
        o: ["Three","balloons","floated","ceiling"],
        a: 0
    },
    {
        q: `👟 Those shoes near the window are expensive.<br><br>Which word is the demonstrative adjective?`,
        o: ["window","Those","expensive","shoes"],
        a: 1
    },
    {
        q: `🍛 We ate delicious Indian food at the festival.<br><br>Which word is the proper adjective?`,
        o: ["festival","delicious","Indian","food"],
        a: 2
    },
    {
        q: `🎒 Her backpack is filled with art supplies.<br><br>Which word is the possessive adjective?`,
        o: ["Her","filled","backpack","supplies"],
        a: 0
    },
    {
        q: `🧥 Which jacket should we buy for winter?<br><br>Which word is the interrogative adjective?`,
        o: ["buy","winter","Which","jacket"],
        a: 2
    },
    {
        q: `🐶 The playful puppy chased the ball around the park.<br><br>Which word is the adjective of quality?`,
        o: ["park","playful","ball","around"],
        a: 1
    },
    {
        q: `🍪 Few cookies remained after the party ended.<br><br>Which word is the adjective of quantity?`,
        o: ["Few","cookies","party","ended"],
        a: 0
    },
    {
        q: `📚 These books belong to our classroom library.<br><br>Which word is the demonstrative adjective?`,
        o: ["library","books","These","classroom"],
        a: 2
    }
];

questions.sort(()=>Math.random()-0.5);

/* ENGINE CONTROLLERS */
function startGame(){
    document.getElementById("startScreen").style.display="none";
    loadItems();
}

function setTheme(){
    let t=fashionThemes[themeIndex];
    themeIndex=(themeIndex+1)%fashionThemes.length;
    document.getElementById("stageTitle").innerText=t.emoji+" Fashion Challenge";
    return t;
}

function loadItems(){
    const itemsArea = document.getElementById("itemsArea");
    itemsArea.innerHTML="";
    selectedCount=0;
    attempt=0;

    let theme=setTheme();
    let shuffled=[...theme.items].sort(()=>Math.random()-0.5).slice(0,5);

    shuffled.forEach(i=>{
        let div=document.createElement("div");
        div.className="item";
        div.innerText=i;
        div.onclick=()=>selectItem(div);
        itemsArea.appendChild(div);
    });
}

function selectItem(div){
    if(div.style.background === "rgb(129, 199, 132)") return; // Prevent clicking already selected
    div.style.background="#81c784";
    div.style.transform="scale(0.95)";
    selectedCount++;
    
    // Animate item placement feedback
    document.getElementById("character").style.transform = "scale(1.1)";
    setTimeout(() => { document.getElementById("character").style.transform = "scale(1)"; }, 150);

    if(selectedCount>=3){
        setTimeout(showQuestion, 300);
    }
}

function showQuestion(){
    document.getElementById("questionBox").style.display="flex";

    let q=questions[currentQuestion];
    document.getElementById("questionText").innerHTML=q.q;

    let optionsContainer=document.getElementById("options");
    optionsContainer.innerHTML="";
    document.getElementById("feedback").innerHTML="";

    q.o.forEach((op,i)=>{
        let btn=document.createElement("button");
        btn.className="optionBtn";
        btn.innerText=op;
        btn.onclick=()=>checkAnswer(i,q.a);
        optionsContainer.appendChild(btn);
    });
}

function checkAnswer(sel,correct){
    let fb=document.getElementById("feedback");
    let optionBtns=document.querySelectorAll(".optionBtn");

    if(sel===correct){
        optionBtns.forEach(b => b.disabled = true);
        fb.innerHTML="Correct!";
        fb.className="correct";

        stylesCompleted++;
        currentQuestion++;

        document.getElementById("styleCount").innerText=stylesCompleted;
        document.getElementById("questionCount").innerText=currentQuestion;

        setTimeout(()=>{
            document.getElementById("questionBox").style.display="none";
            if(currentQuestion>=10){
                endGame();
            }else{
                loadItems();
            }
        },1000);

    }else{
        attempt++;
        if(attempt<2) {
            fb.innerHTML="Try Again!";
            fb.className="wrong";
            optionBtns[sel].style.opacity="0.4";
            optionBtns[sel].disabled = true;
        } else {
            optionBtns.forEach(b => b.disabled = true);
            fb.innerHTML="Answer Revealed!";
            fb.className="wrong";
            
            // Tint right option choice row
            optionBtns[correct].style.background = "#2e7d32";
            
            setTimeout(()=>{
                document.getElementById("questionBox").style.display="none";
                currentQuestion++;
                document.getElementById("questionCount").innerText=currentQuestion;
                if(currentQuestion>=10){
                    endGame();
                }else{
                    loadItems();
                }
            },1400);
        }
    }
}

function endGame(){
    document.getElementById("endScreen").style.display="flex";
    document.getElementById("finalText").innerText=
    "You completed "+stylesCompleted+" out of 10 fashion missions correctly!";
}

function restartGame(){
    location.reload();
}
</script>
</body>
</html>
