<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🕵️ Museum Heist Escape</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0d1117;
  color: #fff;
}

#gameArea {
  position: relative;
  width: 100vw;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: clamp(8px, 2vh, 16px);
  background: radial-gradient(circle at center, #1f2937 0%, #0b0f17 100%);
  overflow: hidden;
}

/* LOGO SCREEN */
#logoScreen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.5s ease;
}

#logoScreen img {
  width: min(280px, 70vw);
  height: auto;
  object-fit: contain;
}

/* START + END OVERLAYS */
#startScreen,
#endScreen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(10, 14, 23, 0.95);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  padding: 24px;
  z-index: 5000;
}

#startScreen h1,
#endScreen h1 {
  font-size: clamp(28px, 6vw, 48px);
  color: #ffb74d;
  text-shadow: 0 0 12px rgba(255, 183, 77, 0.4);
}

#startScreen p {
  margin-top: 16px;
  font-size: clamp(16px, 3.5vw, 22px);
  max-width: 600px;
  color: #e0e0e0;
  line-height: 1.5;
}

.mainBtn {
  padding: 14px 36px;
  font-size: clamp(18px, 4vw, 22px);
  font-weight: bold;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #ff9800, #f57c00);
  color: #ffffff;
  cursor: pointer;
  margin-top: 28px;
  box-shadow: 0 6px 20px rgba(255, 152, 0, 0.4);
  transition: transform 0.2s, box-shadow 0.2s;
  touch-action: manipulation;
}

.mainBtn:active {
  transform: scale(0.96);
}

/* TOP HEADER & DASHBOARD */
.headerContainer {
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
}

#titleBox {
  width: 100%;
  background: #1e293b;
  padding: 8px 16px;
  border-radius: 12px;
  font-size: clamp(14px, 3vw, 20px);
  font-weight: bold;
  text-align: center;
  color: #ffeb3b;
  border: 2px solid #ff9800;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.dashboard {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

#scoreBoard {
  flex: 1;
  background: #1e293b;
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: clamp(12px, 2.5vw, 15px);
  font-weight: bold;
  border: 2px solid #ff9800;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

#volumeBox {
  background: #1e293b;
  color: white;
  padding: 8px 14px;
  border-radius: 10px;
  border: 2px solid #ff9800;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: clamp(12px, 2.5vw, 14px);
  font-weight: bold;
}

#volumeSlider {
  width: 70px;
  accent-color: #ff9800;
  cursor: pointer;
}

/* MUSEUM DISPLAY AREA */
#museumArea {
  position: relative;
  width: 100%;
  max-width: 900px;
  flex: 1;
  min-height: 180px;
  margin: 8px 0;
  background: #263238;
  border-radius: 18px;
  border: 4px solid #455a64;
  overflow: hidden;
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
}

.room {
  position: absolute;
  background: #37474f;
  border: 2px dashed #607d8b;
  border-radius: 12px;
}

#room1 { width: 28%; height: 40%; top: 6%; left: 4%; }
#room2 { width: 28%; height: 40%; top: 6%; left: 36%; }
#room3 { width: 28%; height: 40%; top: 6%; left: 68%; }
#room4 { width: 40%; height: 40%; bottom: 6%; left: 8%; }
#room5 { width: 40%; height: 40%; bottom: 6%; left: 52%; }

/* ARTIFACTS */
.artifact {
  position: absolute;
  font-size: clamp(24px, 5vw, 42px);
  transform-origin: center;
  animation: glow 2.5s infinite ease-in-out;
}

@keyframes glow {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px #ffeb3b); }
  50% { transform: scale(1.1); filter: drop-shadow(0 0 12px #00e676); }
}

/* DETECTIVE */
#detective {
  position: absolute;
  font-size: clamp(32px, 7vw, 56px);
  transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
  z-index: 50;
  transform: translate(-50%, -50%);
  will-change: top, left;
}

/* FOOTPRINTS */
.footprint {
  position: absolute;
  font-size: clamp(14px, 3vw, 22px);
  opacity: 0.6;
  animation: fade 2s infinite ease-in-out;
}

@keyframes fade {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.8; }
}

/* LASERS */
.laser {
  position: absolute;
  background: #ff1744;
  box-shadow: 0 0 10px #ff1744, 0 0 20px #ff1744;
  animation: blink 1.2s infinite;
  z-index: 10;
  display: none;
}

#laser1 { top: 50%; left: 0; width: 100%; height: 3px; }
#laser2 { left: 50%; top: 0; width: 3px; height: 100%; }

@keyframes blink {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 1; }
}

/* QUESTION BOX */
#questionBox {
  width: 100%;
  max-width: 900px;
  background: #ffffff;
  padding: clamp(12px, 2.5vh, 20px);
  border-radius: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 100;
}

#questionText {
  font-size: clamp(15px, 3.2vw, 20px);
  line-height: 1.4;
  margin-bottom: 12px;
  color: #1a202c;
  text-align: center;
  font-weight: 600;
}

.optionContainer {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.optionBtn {
  padding: clamp(10px, 2vh, 16px);
  border: none;
  border-radius: 12px;
  background: #0288d1;
  color: white;
  font-size: clamp(13px, 2.8vw, 17px);
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  touch-action: manipulation;
  word-break: break-word;
}

.optionBtn:active {
  background: #01579b;
  transform: scale(0.98);
}

/* FEEDBACK POPUP */
#feedbackPopup {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #ffffff;
  padding: clamp(20px, 4vw, 32px);
  border-radius: 20px;
  width: min(90%, 550px);
  display: none;
  z-index: 9999;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

#feedbackTitle {
  font-size: clamp(22px, 5vw, 32px);
  margin-bottom: 12px;
  font-weight: bold;
}

#feedbackText {
  font-size: clamp(15px, 3.5vw, 20px);
  line-height: 1.5;
  color: #2d3748;
}

/* CONFETTI */
.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  pointer-events: none;
  animation: fall linear forwards;
  z-index: 9000;
}

@keyframes fall {
  from { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

@media (max-width: 480px) {
  .optionContainer {
    grid-template-columns: 1fr;
  }
  #scoreBoard {
    font-size: 11px;
    padding: 6px 8px;
  }
}
</style>
</head>

<body>

<div id="gameArea">

  <!-- LOGO SCREEN -->
  <div id="logoScreen">
    <img src="assets/innovine-logo.png" alt="Logo" id="logoImg">
  </div>

  <!-- START SCREEN -->
  <div id="startScreen" style="display:none;">
    <h1>🕵️ Museum Heist Escape</h1>
    <p>Solve preposition clues to track the thief and escape the museum!</p>
    <button class="mainBtn" onclick="startGame()">Start Mission</button>
  </div>

  <!-- END SCREEN -->
  <div id="endScreen" style="display:none;">
    <h1>🏆 Mission Complete! 🏆</h1>
    <h2 id="finalText" style="margin-top:16px; line-height:1.6; font-size: clamp(16px, 3.5vw, 22px); color:#e0e0e0;"></h2>
    <button class="mainBtn" onclick="restartGame()">Play Again</button>
  </div>

  <!-- HEADER & DASHBOARD -->
  <div class="headerContainer">
    <div id="titleBox">🔦 Catch The Thief With Prepositions!</div>
    
    <div class="dashboard">
      <div id="scoreBoard">
        <span>✅ <span id="correctScore">0</span></span>
        <span>❌ <span id="wrongScore">0</span></span>
        <span>📘 <span id="questionNumber">1</span>/10</span>
      </div>

      <div id="volumeBox">
        <span>🔊</span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
      </div>
    </div>
  </div>

  <!-- MUSEUM VISUAL MAP -->
  <div id="museumArea">
    <div class="room" id="room1"></div>
    <div class="room" id="room2"></div>
    <div class="room" id="room3"></div>
    <div class="room" id="room4"></div>
    <div class="room" id="room5"></div>

    <div class="artifact" style="top:12%; left:12%;">🗿</div>
    <div class="artifact" style="top:12%; left:46%;">💎</div>
    <div class="artifact" style="top:12%; left:78%;">🖼️</div>
    <div class="artifact" style="bottom:12%; left:22%;">🏺</div>
    <div class="artifact" style="bottom:12%; left:66%;">👑</div>

    <div class="footprint" style="top:48%; left:18%;">👣</div>
    <div class="footprint" style="top:48%; left:38%;">👣</div>
    <div class="footprint" style="top:48%; left:58%;">👣</div>
    <div class="footprint" style="top:48%; left:78%;">👣</div>

    <div id="laser1" class="laser"></div>
    <div id="laser2" class="laser"></div>

    <div id="detective">🕵️</div>
  </div>

  <!-- QUESTION & OPTIONS -->
  <div id="questionBox">
    <div id="questionText">Loading mission...</div>
    <div class="optionContainer" id="options"></div>
  </div>

  <!-- FEEDBACK POPUP -->
  <div id="feedbackPopup">
    <div id="feedbackTitle"></div>
    <div id="feedbackText"></div>
  </div>

</div>

<script>
/* ---------------------------------------------------------
   WEB AUDIO API SYNTHESIZER (ZERO-DEPENDENCY AUDIO)
--------------------------------------------------------- */
let audioCtx = null;
let masterVolume = 1;

function initAudio() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (AudioContext) {
      audioCtx = new AudioContext();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

const volumeSlider = document.getElementById("volumeSlider");
volumeSlider.addEventListener("input", (e) => {
  masterVolume = parseFloat(e.target.value);
});

function playSound(type) {
  initAudio();
  if (!audioCtx || masterVolume <= 0) return;

  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === "correct") {
    osc.type = "sine";
    osc.frequency.setValueAtTime(523.25, now); // C5
    osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.1); // E5
    osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.2); // G5
    
    gain.gain.setValueAtTime(0.3 * masterVolume, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
    
    osc.start(now);
    osc.stop(now + 0.4);
  } else if (type === "wrong") {
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.linearRampToValueAtTime(110, now + 0.3);
    
    gain.gain.setValueAtTime(0.3 * masterVolume, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
    
    osc.start(now);
    osc.stop(now + 0.35);
  }
}

/* ---------------------------------------------------------
   LOGO INTRO SETUP
--------------------------------------------------------- */
window.addEventListener("load", () => {
  const logo = document.getElementById("logoScreen");
  const img = document.getElementById("logoImg");
  
  const proceed = () => {
    logo.style.opacity = "0";
    setTimeout(() => {
      logo.style.display = "none";
      document.getElementById("startScreen").style.display = "flex";
    }, 500);
  };

  if (img.complete) {
    setTimeout(proceed, 2000);
  } else {
    img.onload = () => setTimeout(proceed, 2000);
    img.onerror = () => proceed(); // Fallback if logo file is missing
  }
});

/* ---------------------------------------------------------
   QUESTIONS DATASET
--------------------------------------------------------- */
const questions = [
  {
    q: "🗿 The thief hid ___ the giant dinosaur skeleton.",
    o: ["under", "through", "during", "across"],
    a: 0,
    e: "'Under' indicates a position directly below an object."
  },
  {
    q: "🚪 The detective ran ___ the secret tunnel.",
    o: ["through", "between", "at", "before"],
    a: 0,
    e: "'Through' refers to movement inside a three-dimensional space."
  },
  {
    q: "🕰️ The security alarm rings ___ midnight.",
    o: ["at", "beside", "across", "under"],
    a: 0,
    e: "'At' is used for specific times on the clock."
  },
  {
    q: "🖼️ The painting hangs ___ two large windows.",
    o: ["between", "into", "during", "through"],
    a: 0,
    e: "'Between' designates a central position between two points."
  },
  {
    q: "🏃 Select the logical sequence:<br>1. Jumped across table<br>2. Entered room<br>3. Escaped through window",
    o: ["2 → 1 → 3", "1 → 3 → 2", "3 → 2 → 1", "2 → 3 → 1"],
    a: 0,
    e: "Sequence: Enter room first, jump table second, escape window third."
  },
  {
    q: "👑 The crown is secured ___ the glass display case.",
    o: ["inside", "before", "during", "across"],
    a: 0,
    e: "'Inside' indicates enclosed positioning."
  },
  {
    q: "🚨 The detective arrived ___ the museum opened.",
    o: ["before", "under", "through", "between"],
    a: 0,
    e: "'Before' specifies an earlier time point."
  },
  {
    q: "🕵️ The suspect climbed ___ the spiral staircase.",
    o: ["up", "during", "at", "beside"],
    a: 0,
    e: "'Up' shows upward directional movement."
  },
  {
    q: "🏺 The ancient vase stands ___ the statue and the painting.",
    o: ["between", "through", "after", "into"],
    a: 0,
    e: "'Between' is used when surrounded by two distinct items."
  },
  {
    q: "💎 The suspect moved ___ the crowded hallway unnoticed.",
    o: ["through", "under", "at", "before"],
    a: 0,
    e: "'Through' describes movement within a crowded space."
  }
];

/* ---------------------------------------------------------
   GAME STATE & LOGIC
--------------------------------------------------------- */
let currentQuestion = 0;
let correct = 0;
let wrong = 0;
let isProcessing = false;

function startGame() {
  initAudio();
  document.getElementById("startScreen").style.display = "none";
  currentQuestion = 0;
  correct = 0;
  wrong = 0;
  updateScoreboard();
  loadQuestion();
}

function updateScoreboard() {
  document.getElementById("correctScore").innerText = correct;
  document.getElementById("wrongScore").innerText = wrong;
  document.getElementById("questionNumber").innerText = Math.min(currentQuestion + 1, 10);
}

function loadQuestion() {
  isProcessing = false;
  moveDetective();
  
  const q = questions[currentQuestion];
  document.getElementById("questionText").innerHTML = q.q;

  const optionsContainer = document.getElementById("options");
  optionsContainer.innerHTML = "";

  q.o.forEach((option, index) => {
    const btn = document.createElement("button");
    btn.className = "optionBtn";
    btn.innerHTML = option;
    btn.onclick = () => checkAnswer(index);
    optionsContainer.appendChild(btn);
  });
}

function moveDetective() {
  const detective = document.getElementById("detective");
  const randomX = Math.floor(Math.random() * 70) + 15;
  const randomY = Math.floor(Math.random() * 60) + 20;
  detective.style.left = randomX + "%";
  detective.style.top = randomY + "%";
}

function checkAnswer(selected) {
  if (isProcessing) return;
  isProcessing = true;
  initAudio();

  const q = questions[currentQuestion];
  const popup = document.getElementById("feedbackPopup");
  const laser1 = document.getElementById("laser1");
  const laser2 = document.getElementById("laser2");

  popup.style.display = "block";

  if (selected === q.a) {
    correct++;
    playSound("correct");
    createConfetti();

    document.getElementById("feedbackTitle").innerText = "✅ Clue Solved!";
    document.getElementById("feedbackTitle").style.color = "#2e7d32";
    document.getElementById("feedbackText").innerHTML = q.e;

    laser1.style.display = "none";
    laser2.style.display = "none";
  } else {
    wrong++;
    playSound("wrong");

    document.getElementById("feedbackTitle").innerText = "❌ Alarm Triggered!";
    document.getElementById("feedbackTitle").style.color = "#c62828";
    document.getElementById("feedbackText").innerHTML = 
      `Correct Answer: <b>${q.o[q.a]}</b><br><br>${q.e}`;

    laser1.style.display = "block";
    laser2.style.display = "block";
  }

  updateScoreboard();

  setTimeout(() => {
    popup.style.display = "none";
    laser1.style.display = "none";
    laser2.style.display = "none";

    currentQuestion++;
    if (currentQuestion >= questions.length) {
      endGame();
    } else {
      loadQuestion();
    }
  }, 2200);
}

function createConfetti() {
  const count = window.innerWidth < 480 ? 20 : 35;
  for (let i = 0; i < count; i++) {
    const conf = document.createElement("div");
    conf.className = "confetti";
    conf.style.left = Math.random() * 100 + "%";
    conf.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
    conf.style.animationDuration = (1.8 + Math.random() * 1.5) + "s";
    document.body.appendChild(conf);

    setTimeout(() => conf.remove(), 3200);
  }
}

function endGame() {
  document.getElementById("endScreen").style.display = "flex";
  const percentage = Math.round((correct / questions.length) * 100);

  let message = "";
  if (correct === 10) {
    message = "🌟 PERFECT DETECTIVE WORK!<br>The thief was apprehended and all artifacts are secure!";
  } else if (correct >= 7) {
    message = "🕵️ Great Job!<br>You cracked key clues and escaped safely!";
  } else {
    message = "🎉 Mission Complete!<br>Review prepositions and try again to improve your score!";
  }

  document.getElementById("finalText").innerHTML = `
    ✅ Correct Answers: ${correct}/${questions.length}<br>
    ❌ Wrong Answers: ${wrong}<br>
    ⭐ Score: ${percentage}%<br><br>
    ${message}
  `;
}

function restartGame() {
  document.getElementById("endScreen").style.display = "none";
  startGame();
}
</script>

</body>
</html>
