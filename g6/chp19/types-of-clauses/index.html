
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clause Treasure Hunt</title>
<style>
body { margin:0; font-family: Arial; background:#e0f7fa; overflow:hidden; }
#logoScreen { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:white; z-index:100;}
#gameContainer { display:none; width:100%; height:100vh; position:relative; overflow:hidden;}
#player { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); width:60px; height:80px; transition:left 0.5s;}
.chest { position:absolute; width:100px; height:80px; background:#ffeb3b; border-radius:10px; cursor:pointer; text-align:center; line-height:80px; font-weight:bold; }
#questionBox { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:300px; background:white; padding:20px; border-radius:10px; text-align:center; box-shadow:0 0 15px #0003; z-index:50; }
#questionBox button { margin:5px; padding:10px 15px; cursor:pointer;}
#feedback { margin-top:10px; font-weight:bold;}
#treasure { position:absolute; bottom:50px; left:50%; transform:translateX(-50%); width:120px; height:120px; display:none; z-index:20;}
#restartBtn { position:absolute; display:none; left:50%; top:70%; transform:translateX(-50%); padding:10px 20px; font-size:18px; cursor:pointer;}
#volumeSlider { position:absolute; bottom:10px; left:50%; transform:translateX(-50%);}
.particle { position:absolute; width:8px; height:8px; background:linear-gradient(to right, #ff0,#f0f); border-radius:50%; pointer-events:none; animation: floatParticle 1s linear forwards;}
@keyframes floatParticle { 0%{opacity:1; transform:translate(0,0);} 100%{opacity:0; transform:translate(calc(-50px + 100px*var(--randX)), -80px);}}
</style>
</head>
<body>

<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo" width="200">
</div>

<div id="gameContainer">
<img id="player" src="assets/player.png" alt="Player">
<div id="treasure" src="assets/treasure.png"></div>
<div id="questionBox">
<div id="questionText"></div>
<div id="optionsContainer"></div>
<div id="feedback"></div>
</div>

<button id="restartBtn">Restart Adventure</button>
<input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>
</div>

<script>
// --- 10 Questions ---
const questions = [
  {sentence:"I know who won the race.", type:"noun clause"},
  {sentence:"This is the book that I borrowed.", type:"adjective clause"},
  {sentence:"He ran fast because he wanted to catch the bus.", type:"adverb clause"},
  {sentence:"The man who called yesterday is my uncle.", type:"adjective clause"},
  {sentence:"I will wait until he returns.", type:"adverb clause"},
  {sentence:"I heard the rumor that he had won the prize.", type:"noun clause"},
  {sentence:"She stayed home because she was feeling sick.", type:"adverb clause"},
  {sentence:"The student who answered all questions correctly got a medal.", type:"adjective clause"},
  {sentence:"Do you know who is coming?", type:"noun clause"},
  {sentence:"This is the house where I grew up.", type:"adjective clause"}
];

let player = document.getElementById('player');
let questionBox = document.getElementById('questionBox');
let questionText = document.getElementById('questionText');
let optionsContainer = document.getElementById('optionsContainer');
let feedback = document.getElementById('feedback');
let treasure = document.getElementById('treasure');
let restartBtn = document.getElementById('restartBtn');
let gameContainer = document.getElementById('gameContainer');
let scrollIndex = 0;
let chests = [];
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');
const volumeSlider = document.getElementById('volumeSlider');

volumeSlider.oninput = ()=>{
  correctSound.volume = volumeSlider.value;
  wrongSound.volume = volumeSlider.value;
  clapSound.volume = volumeSlider.value;
};
correctSound.volume = volumeSlider.value;
wrongSound.volume = volumeSlider.value;
clapSound.volume = volumeSlider.value;

// Logo splash
setTimeout(()=>{
  document.getElementById('logoScreen').style.display='none';
  gameContainer.style.display='block';
  createChests();
},5000);

// --- Create Treasure Chests ---
function createChests(){
  const spacing = window.innerWidth/(questions.length+1);
  questions.forEach((q,i)=>{
    const chest = document.createElement('div');
    chest.className='chest';
    chest.textContent="Chest";
    chest.style.left=(spacing*(i+1)-50)+'px';
    chest.style.bottom="100px";
    chest.onclick = ()=>openChest(i,chest);
    gameContainer.appendChild(chest);
    chests.push(chest);
  });
}

// --- Open Chest ---
function openChest(index,chest){
  questionBox.style.display='block';
  questionText.textContent=questions[index].sentence;
  optionsContainer.innerHTML='';
  feedback.innerHTML='';
  const types = ["noun clause","adjective clause","adverb clause"];
  types.sort(()=>Math.random()-0.5);
  types.forEach(opt=>{
    const btn = document.createElement('button');
    btn.textContent=opt;
    btn.onclick = ()=>checkAnswer(opt,questions[index].type,chest,index);
    optionsContainer.appendChild(btn);
  });
}

// --- Particle Effect ---
function createParticles(x,y){
  for(let i=0;i<15;i++){
    const p = document.createElement('div');
    p.className='particle';
    p.style.left = x+'px';
    p.style.top = y+'px';
    p.style.setProperty('--randX', Math.random());
    document.body.appendChild(p);
    setTimeout(()=>document.body.removeChild(p),1000);
  }
}

// --- Check Answer ---
function checkAnswer(selected,correct,chest,index){
  if(selected===correct){
    feedback.textContent="Correct! 🎉";
    feedback.style.color="green";
    correctSound.currentTime=0; correctSound.play();
    createParticles(chest.offsetLeft+50,chest.offsetTop);
    questionBox.style.display='none';
    chest.style.background="#8bc34a";
    chest.style.pointerEvents="none";
    movePlayer(index);
  } else {
    feedback.textContent="Try again!";
    feedback.style.color="red";
    wrongSound.currentTime=0; wrongSound.play();
  }
}

// --- Move Player ---
function movePlayer(index){
  player.style.left = chests[index].style.left;
  scrollIndex++;
  if(scrollIndex===questions.length){
    treasure.style.display='block';
    clapSound.currentTime=0; clapSound.play();
    restartBtn.style.display='block';
  }
}

// --- Restart ---
restartBtn.onclick = ()=>{
  scrollIndex=0;
  player.style.left="50%";
  treasure.style.display='none';
  restartBtn.style.display='none';
  chests.forEach(c=>{
    c.style.background="#ffeb3b";
    c.style.pointerEvents="auto";
  });
}
</script>
</body>
</html>
