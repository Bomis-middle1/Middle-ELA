<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Master Academy AAA+</title>

<style>
*{box-sizing:border-box;font-family:Arial, sans-serif;}

body{
margin:0;
overflow:hidden;
background:radial-gradient(circle at top,#ffd180,#ff8a65,#d84315);
}

/* ================= SCREENS ================= */
.screen{
position:absolute;
width:100vw;
height:100vh;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}
.active{display:flex;}

/* ================= LOGO ================= */
#logoScreen{
background:#fff3e0;
}
#logoScreen img{
width:280px;
animation:pulse 1.5s infinite alternate;
}
@keyframes pulse{
from{transform:scale(1)}
to{transform:scale(1.05)}
}

/* ================= HUD ================= */
.hud{
height:70px;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 15px;
background:#fff8e1;
border-bottom:4px solid #6d3b1a;
font-weight:bold;
position:relative;
}

.centerTitle{
position:absolute;
left:50%;
transform:translateX(-50%);
color:#b71c1c;
}

/* ================= GAME ================= */
.game{
display:flex;
height:calc(100vh - 70px);
}

/* PANELS */
.left,.right{
width:25%;
background:#fff8e1;
padding:10px;
}

.center{
flex:1;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle,#fff3e0,#ffcc80,#6d3b1a);
position:relative;
overflow:hidden;
}

/* ================= QUESTION ================= */
.card{
background:white;
padding:12px;
border-radius:12px;
border:2px solid #6d3b1a;
margin-bottom:10px;
min-height:120px;
line-height:1.5;
}

/* ================= OPTIONS ================= */
.option{
background:linear-gradient(#fff,#ffe0b2);
border:2px solid #ff6f00;
padding:12px;
margin:8px 0;
border-radius:10px;
cursor:pointer;
transition:0.2s;
}
.option:hover{transform:scale(1.05);}

/* ================= PIZZA ================= */
.pizza{
width:240px;
height:240px;
border-radius:50%;
background:#f5c16c;
position:relative;
box-shadow:inset 0 0 20px rgba(0,0,0,0.4);
animation:float 2s infinite ease-in-out;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-8px)}
}

/* LAYERS */
.layer{
position:absolute;
width:100%;
height:100%;
border-radius:50%;
animation:pop 0.3s ease;
}

@keyframes pop{
from{transform:scale(0.4);opacity:0}
to{transform:scale(1);opacity:1}
}

.sauce{background:rgba(200,30,30,0.35);}
.cheese{background:rgba(255,220,100,0.5);}
.topping{background:rgba(0,200,100,0.3);}

/* ================= OVEN GLOW ================= */
.ovenGlow{
position:absolute;
width:300px;
height:300px;
border-radius:50%;
background:rgba(255,140,0,0.25);
filter:blur(20px);
animation:glow 1.2s infinite alternate;
}

@keyframes glow{
from{opacity:0.3}
to{opacity:0.8}
}

/* ================= CUSTOMER MOOD ================= */
.mood{
margin-top:10px;
padding:8px;
border-radius:10px;
background:#fff3e0;
border:2px solid #6d3b1a;
}

/* ================= PARTICLES ================= */
.particle{
position:absolute;
width:8px;
height:8px;
background:gold;
border-radius:50%;
animation:fly 1s linear forwards;
}

@keyframes fly{
from{transform:translate(0,0);opacity:1}
to{transform:translateY(-200px) scale(0);opacity:0}
}

/* ================= END ================= */
#endScreen{
background:#fff3e0;
}

button{
padding:14px 20px;
border:none;
border-radius:10px;
background:#ff6f00;
color:white;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- ================= LOGO ================= -->
<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- ================= INSTRUCTIONS ================= -->
<div id="instructionScreen" class="screen">
<div class="card" style="max-width:700px">
<h2>🍕 Pizza Master Academy AAA+</h2>
<p>
Build pizzas + solve grammar challenges.<br>
Drag, think, and learn Homophones, Homonyms & Homographs.<br><br>
2 attempts per order. Become Master Chef 🏆
</p>
<button onclick="start()">Start Cooking</button>
</div>
</div>

<!-- ================= GAME ================= -->
<div id="gameScreen" class="screen">

<div class="hud">
<div>⭐ Score: <span id="score">0</span></div>
<div class="centerTitle">Pizza Master Academy AAA+</div>
<div>Order <span id="order">1</span>/10</div>
</div>

<div class="game">

<!-- LEFT -->
<div class="left">
<div class="card" id="question"></div>
<div id="options"></div>
<input type="range" id="vol" min="0" max="1" step="0.1">
<div class="mood" id="mood">🙂 Customer Happy</div>
</div>

<!-- CENTER -->
<div class="center">
<div class="ovenGlow"></div>
<div id="pizza" class="pizza"></div>
</div>

<!-- RIGHT -->
<div class="right">
<div class="card">
<h3>Chef Feedback</h3>
<div id="feedback"></div>
</div>

<button onclick="next()">Bake & Deliver</button>
</div>

</div>
</div>

<!-- ================= END ================= -->
<div id="endScreen" class="screen">
<h1>🏆 MASTER CHEF 🏆</h1>
<h2 id="final"></h2>
<button onclick="location.reload()">Play Again</button>
</div>

<!-- ================= AUDIO ================= -->
<audio id="c" src="assets/correct.mp3"></audio>
<audio id="w" src="assets/wrong.mp3"></audio>
<audio id="cl" src="assets/clapping.mp3"></audio>

<script>

/* ================= QUESTION ENGINE ================= */
let Q=[
{
q:`We need flour to bake bread. What completes the sentence?`,
o:["Flour","Flower","Floor","Flourr"],
a:"Flour"
},
{
q:`The bat flew out of the kitchen window at night.`,
o:["Flying animal","Cricket bat","Tool","Object"],
a:"Flying animal"
},
{
q:`Wind the toy carefully. Meaning of wind?`,
o:["Twist","Air","Storm","Push"],
a:"Twist"
},
{
q:`Knight sounds like which word?`,
o:["Night","Light","Fight","Bright"],
a:"Night"
},
{
q:`We sat on river bank and watched water.`,
o:["Land beside river","Money bank","Road","House"],
a:"Land beside river"
},
{
q:`Seal performed tricks at zoo.`,
o:["Sea animal","Close","Stamp","Machine"],
a:"Sea animal"
},
{
q:`Final classification challenge`,
o:["Homophones/Homonym/Homograph","Mixed","Wrong","None"],
a:"Homophones/Homonym/Homograph"
}
];

let i=0,s=0,t=0,shuffled=[];

/* ================= FLOW ================= */
setTimeout(()=>show(1),5000);

function show(n){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".screen")[n].classList.add("active");
}

function start(){
shuffled=[...Q].sort(()=>Math.random()-0.5);
show(2);
load();
}

/* ================= LOAD ================= */
function load(){
t=0;
document.getElementById("question").innerText=shuffled[i].q;
document.getElementById("order").innerText=i+1;

let box=document.getElementById("options");
box.innerHTML="";

shuffled[i].o.sort(()=>Math.random()-0.5).forEach(x=>{
let d=document.createElement("div");
d.className="option";
d.innerText=x;
d.onclick=()=>check(x);
box.appendChild(d);
});
}

/* ================= PARTICLES ================= */
function burst(){
for(let i=0;i<12;i++){
let p=document.createElement("div");
p.className="particle";
p.style.left=Math.random()*200+"px";
p.style.top=Math.random()*200+"px";
document.querySelector(".center").appendChild(p);
setTimeout(()=>p.remove(),1000);
}
}

/* ================= AUDIO ================= */
function play(id){
let a=document.getElementById(id);
a.volume=document.getElementById("vol").value;
a.play();
}

/* ================= CHECK ================= */
function check(x){
let q=shuffled[i];

if(x===q.a){
s+=10;
document.getElementById("score").innerText=s;

play("c");
setTimeout(()=>play("cl"),300);

burst();
addPizza();
nextQ();
}
else{
t++;
play("w");

if(t==1) feedback("Try again!");
else if(t==2) feedback("Hint: Think meaning!");
else{
feedback("Answer: "+q.a);
setTimeout(nextQ,1000);
}
}
}

function feedback(t){
document.getElementById("feedback").innerText=t;
}

/* ================= PIZZA ================= */
function addPizza(){
let p=document.getElementById("pizza");
let l=document.createElement("div");
l.className="layer cheese";
p.appendChild(l);
}

/* ================= NEXT ================= */
function nextQ(){
i++;
if(i>=shuffled.length){
end();
return;
}
load();
}

/* ================= END ================= */
function end(){
show(3);
document.getElementById("final").innerText="Score: "+s+"/100";
}

</script>

</body>
</html>
