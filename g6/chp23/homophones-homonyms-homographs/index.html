<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pizza Master Academy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  background:linear-gradient(#ffb84d,#ff8c42);
}

/* =========================
   GRID MASTER LAYOUT
========================= */
.game{
  height:100vh;
  display:grid;
  grid-template-rows: 12vh 58vh 30vh;
}

/* =========================
   TOP BAR
========================= */
.top{
  background:#fff3d6;
  border-bottom:4px solid #d35400;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  font-weight:bold;
  font-size:16px;
}

/* =========================
   MIDDLE WORLD
========================= */
.world{
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* QUESTION FIXED (NEVER CUT AGAIN) */
.question{
  position:absolute;
  top:10px;
  left:10px;
  right:10px;
  background:white;
  padding:12px;
  border-radius:12px;
  border:3px solid #d35400;
  z-index:20;
  max-height:45%;
  overflow:auto;
  font-size:16px;
}

/* OVEN */
.oven{
  position:absolute;
  bottom:5%;
  left:5%;
  width:22%;
  z-index:1;
}

/* CHEF */
.chef{
  position:absolute;
  bottom:5%;
  right:5%;
  width:20%;
  z-index:2;
}

/* PIZZA BASE */
.pizza{
  width:200px;
  height:200px;
  border-radius:50%;
  background:#f2c572;
  border:6px solid #d35400;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:3;
}

/* =========================
   OPTIONS (ALWAYS VISIBLE)
========================= */
.options{
  background:#fff7e6;
  border-top:4px solid #d35400;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:10px;
  overflow-y:auto;
}

.option{
  background:#ffcc66;
  border:3px solid #d35400;
  padding:12px;
  border-radius:10px;
  min-width:45%;
  font-weight:bold;
  font-size:15px;
  text-align:center;
  cursor:pointer;
}

/* =========================
   IMAGE SAFETY FIX
========================= */
img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  display:block;
}

/* fallback hidden */
.fallback{
  display:none;
  font-size:14px;
  color:#333;
}
</style>
</head>

<body>

<div class="game">

  <!-- TOP -->
  <div class="top">
    <div>⭐ Score: 10/100</div>
    <div>🍕 Pizza Master Academy</div>
    <div>Order: 2/10 | Attempts: 0/2</div>
  </div>

  <!-- WORLD -->
  <div class="world">

    <!-- QUESTION (FIXED NEVER CUT) -->
    <div class="question">
      <h3>Which sentence uses “bank” correctly?</h3>
      <p>Choose the sentence that makes sense.</p>
    </div>

    <!-- OVEN -->
    <img class="oven" src="assets/oven.png">

    <!-- PIZZA -->
    <div class="pizza">
      <img src="assets/pizza-base.png">
    </div>

    <!-- CHEF -->
    <img class="chef" src="assets/chef.png">

  </div>

  <!-- OPTIONS -->
  <div class="options">
    <div class="option">We sat on the river bank.</div>
    <div class="option">The river deposited money.</div>
    <div class="option">The bank flew away.</div>
    <div class="option">Bank barked loudly.</div>
  </div>

</div>

</body>
</html>
