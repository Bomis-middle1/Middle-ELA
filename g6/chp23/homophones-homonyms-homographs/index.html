<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pizza Master Academy</title>

<style>
*{box-sizing:border-box;font-family:Arial, sans-serif;}
body{
    margin:0;
    overflow:hidden;
    background:linear-gradient(135deg,#ffe0b2,#ffb74d,#ef6c00);
}

/* ===================== SCREENS ===================== */
.screen{
    width:100vw;
    height:100vh;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}
.active{display:flex;}

/* ===================== LOGO ===================== */
#logoScreen{
    background:#fff3e0;
}
#logoScreen img{
    width:280px;
    max-width:80%;
}

/* ===================== INSTRUCTIONS ===================== */
#instructionScreen{
    background:#fff8e1;
    padding:20px;
}
.instructionBox{
    max-width:850px;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    line-height:1.5;
}
button{
    padding:14px 20px;
    border:none;
    border-radius:12px;
    background:#ff6f00;
    color:white;
    font-size:18px;
    margin-top:15px;
    cursor:pointer;
}

/* ===================== GAME LAYOUT ===================== */
#gameScreen{
    flex-direction:column;
}

.topBar{
    width:100%;
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 15px;
    background:#fff3e0;
    border-bottom:4px solid #6d3b1a;
    font-weight:bold;
}

.centerTitle{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:20px;
    color:#b71c1c;
}

.panel{
    display:flex;
    height:calc(100vh - 70px);
}

/* LEFT */
.left{
    width:25%;
    background:#fff8e1;
    padding:10px;
}

/* CENTER */
.center{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle,#fff3e0,#ffcc80,#a0522d);
    position:relative;
}

/* RIGHT */
.right{
    width:25%;
    background:#fff8e1;
    padding:10px;
}

/* ===================== CARD ===================== */
.card{
    background:white;
    border-radius:15px;
    padding:10px;
    border:2px solid #6d3b1a;
    margin-bottom:10px;
}

/* ===================== PIZZA ===================== */
.pizza{
    width:220px;
    height:220px;
    border-radius:50%;
    background:#f5c16c;
    position:relative;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
    transition:0.3s;
}

.layer{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    top:0;
    left:0;
    animation:pop 0.3s ease;
}

.sauce{background:rgba(200,30,30,0.4);}
.cheese{background:rgba(255,220,100,0.5);}
.topping{background:rgba(0,200,100,0.3);}

@keyframes pop{
    from{transform:scale(0.5);opacity:0}
    to{transform:scale(1);opacity:1}
}

/* ===================== OPTIONS ===================== */
.option{
    background:linear-gradient(#fff,#ffe0b2);
    border:2px solid #ff6f00;
    padding:12px;
    margin:8px 0;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
}
.option:hover{transform:scale(1.05);}

/* ===================== PROGRESS ===================== */
.progress{
    display:flex;
    gap:5px;
}
.slice{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#d7ccc8;
}
.slice.done{background:#ff6f00;}

/* ===================== END ===================== */
#endScreen{
    background:#fff3e0;
}
</style>
</head>

<body>

<!-- ================= LOGO ================= -->
<div id="logoScreen" class="screen active">
    <img src="assets/innovine-logo.png" />
</div>

<!-- ================= INSTRUCTIONS ================= -->
<div id="instructionScreen" class="screen">
    <div class="instructionBox">
        <h2>🍕 Pizza Master Academy</h2>
        <p>
            Welcome Chef!<br><br>
            Complete 10 pizza orders by solving word confusion challenges.<br>
            Learn Homophones, Homonyms & Homographs.<br><br>
            You get 2 attempts per order.<br>
            Build pizzas step-by-step and become Master Chef!
        </p>
        <button onclick="startGame()">Start Cooking</button>
    </div>
</div>

<!-- ================= GAME ================= -->
<div id="gameScreen" class="screen">
    
    <div class="topBar">
        <div>⭐ Score: <span id="score">0</span></div>

        <div class="progress" id="progress"></div>

        <div>Order <span id="order">1</span>/10</div>
    </div>

    <div class="panel">

        <!-- LEFT -->
        <div class="left">
            <div class="card">
                <h3>Customer Order</h3>
                <p id="question"></p>
            </div>

            <div id="options"></div>

            <div class="card">
                <label>Volume</label>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="0.6">
            </div>
        </div>

        <!-- CENTER -->
        <div class="center">
            <div id="pizza" class="pizza"></div>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <div class="card">
                <h3>Chef Station</h3>
                <p id="feedback"></p>
            </div>

            <button onclick="nextOrder()">Bake & Deliver</button>
        </div>

    </div>
</div>

<!-- ================= END ================= -->
<div id="endScreen" class="screen">
    <h1>🏆 MASTER PIZZA CHEF 🏆</h1>
    <h2 id="final"></h2>
    <button onclick="restart()">Play Again</button>
</div>

<!-- ================= AUDIO ================= -->
<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>
<audio id="clap" src="assets/clapping.mp3"></audio>

<script>

/* ================= DATA ================= */
let questions = [
{
q:"We need ____ to bake bread",
options:["Flour","Flower","Floor","Flourr"],
answer:"Flour"
},
{
q:"Bat flew out of kitchen. Meaning?",
options:["Animal","Bat (cricket)","Spoon","Chef"],
answer:"Animal"
},
{
q:"Please ____ the toy",
options:["Wind","Air","Blow","Storm"],
answer:"Wind"
},
{
q:"We need a ripe ____",
options:["Pear","Pair","Peer","Bear"],
answer:"Pear"
},
{
q:"Correct sentence for bank",
options:[
"We sat on river bank",
"Bank barked",
"River bank flew",
"Money river"
],
answer:"We sat on river bank"
},
{
q:"Wind meaning in sentence",
options:["Twist","Moving air","Fold","Wrap"],
answer:"Moving air"
},
{
q:"Knight sounds like",
options:["Night","Light","Fight","Bright"],
answer:"Night"
},
{
q:"Seal meaning",
options:["Sea animal","Close tightly","Stamp","Chef"],
answer:"Sea animal"
},
{
q:"Ate vs Eight correct sentence",
options:[
"I ate eight slices",
"I ate ate slices",
"I eight pizza",
"Eight ate pizza"
],
answer:"I ate eight slices"
},
{
q:"Final classification set",
options:["Correct","Wrong","Mixed","None"],
answer:"Correct"
}
];

/* ================= STATE ================= */
let index=0;
let score=0;
let attempts=0;
let shuffled=[];

/* ================= INIT ================= */
function shuffle(){
    shuffled = [...questions].sort(()=>Math.random()-0.5);
}
shuffle();

/* ================= SCREENS ================= */
function show(i){
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    document.querySelectorAll(".screen")[i].classList.add("active");
}

/* LOGO TIMER */
setTimeout(()=>show(1),5000);

/* ================= START ================= */
function startGame(){
    show(2);
    load();
    buildProgress();
}

/* ================= PROGRESS ================= */
function buildProgress(){
    let p=document.getElementById("progress");
    p.innerHTML="";
    for(let i=0;i<10;i++){
        let d=document.createElement("div");
        d.className="slice";
        p.appendChild(d);
    }
}

function updateProgress(){
    document.querySelectorAll(".slice")[index].classList.add("done");
}

/* ================= LOAD QUESTION ================= */
function load(){
    attempts=0;
    document.getElementById("feedback").innerText="";
    
    let q=shuffled[index];

    document.getElementById("question").innerText=q.q;

    let box=document.getElementById("options");
    box.innerHTML="";

    let opts=[...q.options].sort(()=>Math.random()-0.5);

    opts.forEach(o=>{
        let div=document.createElement("div");
        div.className="option";
        div.innerText=o;
        div.onclick=()=>check(o);
        box.appendChild(div);
    });

    document.getElementById("order").innerText=index+1;
}

/* ================= PIZZA ================= */
function addLayer(type){
    let layer=document.createElement("div");
    layer.className="layer "+type;
    document.getElementById("pizza").appendChild(layer);
}

/* ================= AUDIO ================= */
function play(id){
    let a=document.getElementById(id);
    let v=document.getElementById("volume").value;
    a.volume=v;
    a.play();
}

/* ================= CHECK ================= */
function check(ans){
    let q=shuffled[index];

    if(ans===q.answer){
        score+=10;
        document.getElementById("score").innerText=score;

        play("correct");
        setTimeout(()=>play("clap"),400);

        addLayer("cheese");

        next();
    }
    else{
        attempts++;
        play("wrong");

        if(attempts==1){
            document.getElementById("feedback").innerText="Try again!";
        }
        else if(attempts==2){
            document.getElementById("feedback").innerText="Hint: Think meaning carefully!";
        }
        else{
            document.getElementById("feedback").innerText="Answer: "+q.answer;
            setTimeout(next,1200);
        }
    }
}

/* ================= NEXT ================= */
function next(){
    updateProgress();
    index++;

    if(index>=shuffled.length){
        end();
        return;
    }
    load();
}

/* ================= END ================= */
function end(){
    show(3);
    document.getElementById("final").innerText=
        "Score: "+score+"/100";
}

/* ================= RESTART ================= */
function restart(){
    location.reload();
}

</script>

</body>
</html>
