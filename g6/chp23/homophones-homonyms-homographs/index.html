<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Pizza Panic - Homophones Game</title>

<style>
    *{box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
    body{
        margin:0;
        background:#fff3e0;
        overflow-x:hidden;
    }

    /* SCREENS */
    .screen{
        display:none;
        width:100%;
        min-height:100vh;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        padding:20px;
        text-align:center;
    }
    .active{display:flex;}

    /* LOGO */
    #logoScreen{
        background:#ffffff;
    }
    #logoScreen img{
        width:220px;
        animation:pop 1s ease-in-out infinite alternate;
    }

    @keyframes pop{
        from{transform:scale(1);}
        to{transform:scale(1.05);}
    }

    /* INSTRUCTIONS */
    #instructionBox{
        background:#fff;
        padding:20px;
        border-radius:12px;
        max-width:700px;
        box-shadow:0 4px 15px rgba(0,0,0,0.2);
    }

    button{
        padding:12px 20px;
        font-size:16px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        background:#ff7043;
        color:white;
        margin-top:10px;
    }

    button:hover{background:#ff5722;}

    /* GAME UI */
    #gameScreen{
        background:linear-gradient(180deg,#ffe0b2,#fff3e0);
    }

    .topBar{
        width:100%;
        display:flex;
        justify-content:space-between;
        padding:10px;
        background:#ffcc80;
        border-radius:10px;
        font-weight:bold;
    }

    .restaurant{
        margin-top:10px;
        width:100%;
        max-width:900px;
        background:#fff;
        border-radius:15px;
        padding:15px;
        box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    .customer{
        font-size:18px;
        margin-bottom:10px;
        background:#fff8e1;
        padding:10px;
        border-radius:10px;
    }

    .pizza-area{
        margin:10px 0;
        padding:20px;
        border:2px dashed #aaa;
        border-radius:12px;
        min-height:120px;
    }

    .ingredients{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:10px;
        margin-top:10px;
    }

    .ingredient{
        background:#fff;
        padding:10px;
        border-radius:10px;
        border:2px solid #ffb74d;
        cursor:grab;
        min-width:90px;
    }

    .ingredient:active{
        transform:scale(1.1);
    }

    /* OPTIONS */
    .options{
        display:flex;
        flex-wrap:wrap;
        gap:10px;
        justify-content:center;
        margin-top:10px;
    }

    .optionBtn{
        background:#fff;
        border:2px solid #ff9800;
        padding:10px;
        border-radius:10px;
        cursor:pointer;
        min-width:120px;
    }

    .optionBtn:hover{
        background:#ffe0b2;
    }

    /* SCOREBOARD */
    .scoreBoard{
        display:flex;
        justify-content:space-around;
        width:100%;
        background:#fff3e0;
        padding:10px;
        border-radius:10px;
        margin-top:10px;
        font-weight:bold;
    }

    /* ANIMATION */
    .celebrate{
        animation:pop 0.5s ease-in-out 3;
    }

    /* FINAL SCREEN */
    #finalScreen{
        background:#fff;
    }

    .trophy{
        font-size:80px;
    }

</style>
</head>

<body>

<!-- LOGO SCREEN -->
<div id="logoScreen" class="screen active">
    <img src="assets/innovine-logo.png" />
</div>

<!-- INSTRUCTIONS -->
<div id="instructionScreen" class="screen">
    <div id="instructionBox">
        <h1>🍕 Pizza Panic!</h1>
        <p>Welcome Master Pizza Chef!</p>
        <p>You will serve 10 pizzas by fixing confusing English words.</p>
        <p>Drag ingredients, answer chef challenges, and serve customers!</p>
        <button onclick="startGame()">Start Cooking</button>
    </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="screen">

    <div class="scoreBoard">
        <div>⭐ Served: <span id="served">0</span>/10</div>
        <div>⭐ Score: <span id="score">0</span></div>
        <div>🍕 Remaining: <span id="remaining">10</span></div>
    </div>

    <div class="restaurant">

        <div class="customer" id="customerText"></div>

        <div class="pizza-area" id="pizzaArea">
            🍕 Drag ingredient here
        </div>

        <div class="ingredients" id="ingredients"></div>

        <div id="questionBox" style="margin-top:10px;"></div>

    </div>

</div>

<!-- FINAL SCREEN -->
<div id="finalScreen" class="screen">
    <div class="trophy">🏆</div>
    <h1>Golden Pizza Trophy!</h1>
    <p id="finalScore"></p>
    <button onclick="restartGame()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

const orders = [
{
customer:"We need ______ to bake fresh bread.",
options:["Flour","Flower","Floor","Flourr"],
answer:"Flour",
challenge:{
q:"Flour and flower sound same but different meaning. What type?",
opts:["Homophones","Homonyms","Homographs","None"],
ans:"Homophones"
}
},
{
customer:"The bat flew out of the kitchen window.",
options:["A flying animal","A cricket bat","A spoon","A chef"],
answer:"A flying animal",
challenge:{
q:"Bat has multiple meanings. What type?",
opts:["Homophone","Homonym","Homograph","None"],
ans:"Homonym"
}
},
{
customer:"Please ______ the toy before giving it to your little brother.",
options:["Wind","Air","Blow","Storm"],
answer:"Wind",
challenge:{
q:"Same spelling, different pronunciation?",
opts:["Homophone","Homonym","Homograph","None"],
ans:"Homograph"
}
},
{
customer:"The fruit pizza needs a ripe ______.",
options:["Pear","Pair","Peer","Bear"],
answer:"Pear",
challenge:{
q:"Pear and pair are?",
opts:["Homophones","Homonyms","Homographs","None"],
ans:"Homophones"
}
},
{
customer:"Which sentence uses bank correctly?",
options:[
"We sat on the river bank.",
"The river deposited money.",
"The bank barked loudly.",
"The bank flew away."
],
answer:"We sat on the river bank.",
challenge:{
q:"Bank meaning?",
opts:["Homophone","Homonym","Homograph","None"],
ans:"Homonym"
}
},
{
customer:"The wind was strong and blew the chef's hat.",
options:["Moving air","Twist","Wrap","Turn"],
answer:"Moving air",
challenge:{
q:"Wind type?",
opts:["Homophone","Homonym","Homograph","None"],
ans:"Homograph"
}
},
{
customer:"The knight protected the castle.",
options:["Night","Light","Bright","Fight"],
answer:"Night",
challenge:{
q:"Knight and night are?",
opts:["Homophones","Homonyms","Homographs","None"],
ans:"Homophones"
}
},
{
customer:"The seal balanced a ball.",
options:["Sea animal","Close tightly","Pizza cutter","Chef"],
answer:"Sea animal",
challenge:{
q:"Seal type?",
opts:["Homophone","Homonym","Homograph","None"],
ans:"Homonym"
}
},
{
customer:"I ate eight slices of pizza.",
options:["Correct sentence","I ate ate","I eight pizza","Eight pizza"],
answer:"Correct sentence",
challenge:{
q:"Ate and eight are?",
opts:["Homophones","Homonyms","Homographs","None"],
ans:"Homophones"
}
},
{
customer:"Please tear the basil leaves.",
options:["Rip","Eye drop","Smile","Wash"],
answer:"Rip",
challenge:{
q:"Tear type?",
opts:["Homophone","Homonym","Homograph","None"],
ans:"Homograph"
}
}
];

let gameOrder = [];
let current = 0;
let score = 0;
let served = 0;
let attempts = 0;

function shuffle(arr){
return arr.sort(()=>Math.random()-0.5);
}

function show(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

setTimeout(()=>{
show('instructionScreen');
},5000);

function startGame(){
gameOrder = shuffle([...orders]);
show('gameScreen');
loadOrder();
}

function updateBoard(){
document.getElementById("score").innerText = score;
document.getElementById("served").innerText = served;
document.getElementById("remaining").innerText = 10-served;
}

function loadOrder(){
if(current>=gameOrder.length){
endGame();
return;
}

attempts=0;
let o = gameOrder[current];

document.getElementById("customerText").innerText = "🍕 Customer: " + o.customer;

let ing = document.getElementById("ingredients");
ing.innerHTML="";

o.options.forEach(opt=>{
let div=document.createElement("div");
div.className="ingredient";
div.innerText=opt;
div.onclick=()=>selectIngredient(opt);
ing.appendChild(div);
});

document.getElementById("questionBox").innerHTML="";
updateBoard();
}

function selectIngredient(opt){
let o = gameOrder[current];

if(opt===o.answer){
document.getElementById("correctSound").play();
document.getElementById("clapSound").play();
score+=10;
served++;
updateBoard();
nextChallenge();
}else{
document.getElementById("wrongSound").play();
attempts++;
if(attempts>=2){
alert("Hint: Think carefully about meaning in context!");
attempts=0;
}
}
}

function nextChallenge(){
let o = gameOrder[current];

let box=document.getElementById("questionBox");

box.innerHTML=`
<h3>👨‍🍳 Chef Challenge</h3>
<p>${o.challenge.q}</p>
`;

let optsDiv=document.createElement("div");
optsDiv.className="options";

o.challenge.opts.forEach(opt=>{
let b=document.createElement("div");
b.className="optionBtn";
b.innerText=opt;
b.onclick=()=>checkChallenge(opt);
optsDiv.appendChild(b);
});

box.appendChild(optsDiv);
}

function checkChallenge(opt){
let o = gameOrder[current];

if(opt===o.challenge.ans){
document.getElementById("correctSound").play();
document.getElementById("clapSound").play();
current++;
loadOrder();
}else{
document.getElementById("wrongSound").play();
attempts++;
if(attempts>=2){
alert("Hint unlocked: revise concept carefully!");
attempts=0;
}
}
}

function endGame(){
show('finalScreen');
document.getElementById("finalScore").innerText =
"You served " + served + "/10 pizzas. Score: " + score;
}

function restartGame(){
current=0;
score=0;
served=0;
startGame();
}

</script>

</body>
</html>
