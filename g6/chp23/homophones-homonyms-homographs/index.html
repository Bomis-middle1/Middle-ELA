<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizza Master Academy - FINAL</title>

<style>
*{box-sizing:border-box;font-family:Arial, sans-serif;}

body{
margin:0;
overflow:hidden;
background:linear-gradient(135deg,#ffe0b2,#ffb74d,#e65100);
}

/* SCREEN SYSTEM */
.screen{
position:absolute;
width:100vw;
height:100vh;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}
.active{display:flex;}

/* LOGO */
#logoScreen{
background:#fff3e0;
}
#logoScreen img{
width:280px;
}

/* INSTRUCTIONS */
#instructionScreen{
background:#fff8e1;
}
.box{
max-width:800px;
background:white;
padding:20px;
border-radius:15px;
border:2px solid #6d3b1a;
line-height:1.5;
}

/* BUTTON */
button{
padding:14px 20px;
border:none;
border-radius:10px;
background:#ff6f00;
color:white;
font-size:18px;
margin-top:15px;
cursor:pointer;
}

/* GAME LAYOUT */
#gameScreen{
flex-direction:column;
}

.top{
width:100%;
height:70px;
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 15px;
background:#fff3e0;
border-bottom:4px solid #6d3b1a;
font-weight:bold;
}

.centerTitle{
position:absolute;
left:50%;
transform:translateX(-50%);
color:#b71c1c;
font-size:18px;
}

.game{
display:flex;
height:calc(100vh - 70px);
}

/* PANELS */
.left,.right{
width:25%;
background:#fff8e1;
padding:10px;
}

.center{
flex:1;
display:flex;
align-items:center;
justify-content:center;
background:radial-gradient(circle,#fff3e0,#ffcc80,#8d4b1a);
}

/* QUESTION */
.card{
background:white;
padding:12px;
border-radius:12px;
border:2px solid #6d3b1a;
margin-bottom:10px;
line-height:1.5;
min-height:120px;
font-size:16px;
}

/* OPTIONS */
.option{
background:linear-gradient(#fff,#ffe0b2);
border:2px solid #ff6f00;
padding:12px;
margin:8px 0;
border-radius:10px;
cursor:pointer;
}

/* PIZZA */
.pizza{
width:240px;
height:240px;
border-radius:50%;
background:#f5c16c;
position:relative;
box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
animation:float 2s infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-8px)}
}

.layer{
position:absolute;
width:100%;
height:100%;
border-radius:50%;
animation:pop 0.3s ease;
}

@keyframes pop{
from{transform:scale(0.5);opacity:0}
to{transform:scale(1);opacity:1}
}

.cheese{background:rgba(255,220,100,0.5);}
.sauce{background:rgba(200,30,30,0.4);}
.topping{background:rgba(0,200,100,0.3);}

/* END */
#endScreen{
background:#fff3e0;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- INSTRUCTIONS -->
<div id="instructionScreen" class="screen">
<div class="box">
<h2>🍕 Pizza Master Academy</h2>
<p>
Complete 10 grammar pizza orders.<br>
Learn Homophones, Homonyms & Homographs.<br><br>
You get 2 attempts per question.<br>
Build pizza step by step and become Master Chef!
</p>
<button onclick="start()">Start Cooking</button>
</div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div class="top">
<div>⭐ Score: <span id="score">0</span></div>
<div class="centerTitle">Pizza Master Academy</div>
<div>Order <span id="order">1</span>/10</div>
</div>

<div class="game">

<div class="left">
<div class="card" id="question"></div>
<div id="options"></div>

<label>Volume</label>
<input type="range" id="vol" min="0" max="1" step="0.1">
</div>

<div class="center">
<div id="pizza" class="pizza"></div>
</div>

<div class="right">
<div class="card">
<h3>Chef Feedback</h3>
<div id="feedback"></div>
</div>

<button onclick="next()">Bake & Deliver</button>
</div>

</div>
</div>

<!-- END -->
<div id="endScreen" class="screen">
<h1>🏆 MASTER CHEF 🏆</h1>
<h2 id="final"></h2>
<button onclick="location.reload()">Play Again</button>
</div>

<!-- AUDIO -->
<audio id="c" src="assets/correct.mp3"></audio>
<audio id="w" src="assets/wrong.mp3"></audio>
<audio id="cl" src="assets/clapping.mp3"></audio>

<script>

/* QUESTIONS (CLEAN CBSE FINAL) */
let Q=[
{
q:`We need flour to bake fresh bread in the kitchen. What completes the sentence correctly?`,
o:["Flour","Flower","Floor","Flourr"],
a:"Flour"
},
{
q:`The bat flew out of the kitchen window at night. What does "bat" mean?`,
o:["Flying animal","Cricket bat","Wood tool","Chef tool"],
a:"Flying animal"
},
{
q:`Please wind the toy carefully. What does wind mean?`,
o:["Twist","Air","Storm","Windmill"],
a:"Twist"
},
{
q:`Knight sounds like which word?`,
o:["Night","Light","Fight","Bright"],
a:"Night"
},
{
q:`We sat on the river bank and watched water flow. Meaning of bank?`,
o:["Land beside river","Money place","Road","House"],
a:"Land beside river"
},
{
q:`The seal performed tricks at the zoo. Meaning of seal?`,
o:["Sea animal","Close tightly","Stamp","Machine"],
a:"Sea animal"
},
{
q:`I ate eight slices of pizza. Choose correct sentence.`,
o:["I ate eight slices","I eight pizza","Ate I eight","Eight ate pizza"],
a:"I ate eight slices"
},
{
q:`The wind was very strong today. Meaning of wind?`,
o:["Moving air","Twist","Fold","Push"],
a:"Moving air"
},
{
q:`Which word sounds like pear?`,
o:["Pair","Bear","Peer","Bare"],
a:"Pair"
},
{
q:`Final Challenge: classify correctly.`,
o:["Homophones/Homonym/Homograph","Mixed","Wrong","None"],
a:"Homophones/Homonym/Homograph"
}
];

let i=0,score=0,t=0,shuffled=[];

setTimeout(()=>show(1),5000);

function show(n){
document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
document.querySelectorAll(".screen")[n].classList.add("active");
}

function start(){
shuffled=[...Q].sort(()=>Math.random()-0.5);
show(2);
load();
}

function load(){
t=0;
document.getElementById("feedback").innerText="";
document.getElementById("order").innerText=i+1;

let q=shuffled[i];
document.getElementById("question").innerText=q.q;

let box=document.getElementById("options");
box.innerHTML="";

q.o.sort(()=>Math.random()-0.5).forEach(x=>{
let d=document.createElement("div");
d.className="option";
d.innerText=x;
d.onclick=()=>check(x);
box.appendChild(d);
});
}

function play(id){
let a=document.getElementById(id);
a.volume=document.getElementById("vol").value;
a.play();
}

function check(x){
let q=shuffled[i];

if(x===q.a){
score+=10;
document.getElementById("score").innerText=score;

play("c");
setTimeout(()=>play("cl"),300);

addPizza();
nextQ();
}else{
t++;
play("w");

if(t==1) feedback("Try again!");
else if(t==2) feedback("Hint: Think meaning!");
else{
feedback("Answer: "+q.a);
setTimeout(nextQ,1000);
}
}
}

function feedback(t){
document.getElementById("feedback").innerText=t;
}

function addPizza(){
let p=document.getElementById("pizza");
let l=document.createElement("div");
l.className="layer cheese";
p.appendChild(l);
}

function nextQ(){
i++;
if(i>=shuffled.length){
end();
return;
}
load();
}

function next(){
}

function end(){
show(3);
document.getElementById("final").innerText="Score: "+score+"/100";
}

</script>

</body>
</html>
