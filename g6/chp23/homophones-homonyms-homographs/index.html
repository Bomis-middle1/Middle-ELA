<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pizza Master Academy AAA</title>

<style>
*{box-sizing:border-box;font-family:Arial Rounded MT Bold, Arial;}

body{
    margin:0;
    overflow:hidden;
    background: radial-gradient(circle at top,#ffd180,#ff8a65,#d84315);
}

/* ================= LOADER ================= */
.screen{
    position:absolute;
    width:100vw;
    height:100vh;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}
.active{display:flex;}

#logoScreen{
    background:#fff3e0;
}
#logoScreen img{
    width:300px;
    animation: zoom 1.5s ease-in-out infinite alternate;
}
@keyframes zoom{
    from{transform:scale(1)}
    to{transform:scale(1.05)}
}

/* ================= HUD ================= */
.hud{
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 15px;
    background:#fff8e1;
    border-bottom:4px solid #6d3b1a;
    font-weight:bold;
}

.centerTitle{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:20px;
    color:#b71c1c;
}

/* ================= GAME AREA ================= */
.game{
    display:flex;
    height:calc(100vh - 70px);
}

/* PANELS */
.left,.right{
    width:25%;
    background:#fff8e1;
    padding:10px;
}

.center{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle,#fff3e0,#ffcc80,#8d4b2d);
}

/* ================= QUESTION CARD ================= */
.card{
    background:white;
    border-radius:15px;
    padding:12px;
    border:2px solid #6d3b1a;
    margin-bottom:10px;
    min-height:120px;
    line-height:1.6;
    font-size:18px;
}

/* ================= OPTIONS ================= */
.option{
    background:linear-gradient(#fff,#ffe0b2);
    border:2px solid #ff6f00;
    padding:14px;
    margin:8px 0;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
    font-size:16px;
}
.option:hover{transform:scale(1.04);}

/* ================= PIZZA ENGINE ================= */
.pizza{
    width:240px;
    height:240px;
    border-radius:50%;
    background:#f5c16c;
    position:relative;
    box-shadow: inset 0 0 25px rgba(0,0,0,0.4);
    transition:0.4s;
    animation: float 2s infinite ease-in-out;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

.layer{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    animation: pop 0.3s ease;
}

@keyframes pop{
    from{transform:scale(0.4);opacity:0}
    to{transform:scale(1);opacity:1}
}

.sauce{background:rgba(200,30,30,0.35);}
.cheese{background:rgba(255,220,100,0.5);}
.topping{background:rgba(0,200,100,0.25);}

/* ================= CUSTOMER MOOD ================= */
.mood{
    font-size:14px;
    padding:8px;
    border-radius:10px;
    background:#fff3e0;
    border:2px solid #6d3b1a;
    margin-top:10px;
}

/* ================= END SCREEN ================= */
#endScreen{
    background:#fff3e0;
}
button{
    padding:14px 20px;
    border:none;
    border-radius:12px;
    background:#ff6f00;
    color:white;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- ================= LOGO ================= -->
<div id="logoScreen" class="screen active">
    <img src="assets/innovine-logo.png">
</div>

<!-- ================= INSTRUCTIONS ================= -->
<div id="instructionScreen" class="screen">
    <div class="card" style="max-width:700px">
        <h2>🍕 Pizza Master Academy</h2>
        <p>
            Solve grammar confusion!<br>
            Build pizzas step-by-step.<br>
            10 orders → Become Master Chef 🏆
        </p>
        <button onclick="startGame()">Start Cooking</button>
    </div>
</div>

<!-- ================= GAME ================= -->
<div id="gameScreen" class="screen">

<div class="hud">
    <div>⭐ Score: <span id="score">0</span></div>
    <div class="centerTitle">Pizza Master Academy</div>
    <div>Order <span id="order">1</span>/10</div>
</div>

<div class="game">

    <!-- LEFT -->
    <div class="left">
        <div class="card" id="question"></div>
        <div id="options"></div>
        <input type="range" id="vol" min="0" max="1" step="0.1">
    </div>

    <!-- CENTER -->
    <div class="center">
        <div id="pizza" class="pizza"></div>
    </div>

    <!-- RIGHT -->
    <div class="right">
        <div class="card">
            <h3>Chef Feedback</h3>
            <div id="feedback"></div>
        </div>

        <div class="mood" id="mood">🙂 Customer Happy</div>

        <button onclick="next()">Bake & Deliver</button>
    </div>

</div>
</div>

<!-- ================= END ================= -->
<div id="endScreen" class="screen">
    <h1>🏆 MASTER CHEF 🏆</h1>
    <h2 id="final"></h2>
    <button onclick="restart()">Play Again</button>
</div>

<!-- ================= AUDIO ================= -->
<audio id="c" src="assets/correct.mp3"></audio>
<audio id="w" src="assets/wrong.mp3"></audio>
<audio id="cl" src="assets/clapping.mp3"></audio>

<script>

/* ================= DATA ================= */
let Q=[
`We need flour to bake bread.`,
`A bat flew out of the kitchen window at night. Meaning?`,
`Wind the toy carefully.`,
`Knight sounds like?`,
`We sat on river bank.`;

let O=[
["Flour","Flower","Floor","Flourr"],
["Animal","Bat tool","Spoon","Chef"],
["Twist","Air","Storm","Fan"],
["Night","Light","Fight","Bright"],
["River land","Bank money","Sky","Road"];

let A=[
"Flour","Animal","Twist","Night","River land","Correct"
];

let i=0,s=0,t=0;

/* ================= START ================= */
setTimeout(()=>show(1),5000);

function show(n){
document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".screen")[n].classList.add("active");
}

function startGame(){
show(2);
load();
}

/* ================= LOAD ================= */
function load(){
t=0;
document.getElementById("question").innerText=Q[i];
document.getElementById("order").innerText=i+1;

let box=document.getElementById("options");
box.innerHTML="";

O[i].forEach(x=>{
let d=document.createElement("div");
d.className="option";
d.innerText=x;
d.onclick=()=>check(x);
box.appendChild(d);
});
}

/* ================= CHECK ================= */
function play(id){
let a=document.getElementById(id);
a.volume=document.getElementById("vol").value;
a.play();
}

function check(x){
if(x===A[i]){
s+=10;
play("c");
setTimeout(()=>play("cl"),300);

pizzaEffect();
nextQ();
}
else{
t++;
play("w");
if(t==1) feedback("Try again!");
else if(t==2) feedback("Hint: think meaning!");
else{
feedback("Answer: "+A[i]);
setTimeout(nextQ,1000);
}
}
document.getElementById("score").innerText=s;
}

function feedback(t){
document.getElementById("feedback").innerText=t;
}

/* ================= PIZZA FX ================= */
function pizzaEffect(){
let p=document.getElementById("pizza");
let l=document.createElement("div");
l.className="layer cheese";
p.appendChild(l);
}

/* ================= NEXT ================= */
function nextQ(){
i++;
if(i>=Q.length){end();return;}
load();
}

function end(){
show(3);
document.getElementById("final").innerText="Score "+s+"/100";
}

function next(){
pizzaEffect();
}

/* ================= RESTART ================= */
function restart(){
location.reload();
}

</script>

</body>
</html>
