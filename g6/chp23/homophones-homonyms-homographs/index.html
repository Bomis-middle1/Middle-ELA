<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Pizza Master Academy</title>

<style>
:root{
  --red:#c93b2b;
  --orange:#f28c28;
  --yellow:#ffd166;
  --cream:#fff1cc;
  --brown:#6f3f22;
  --dark:#2d1a12;
}

*{box-sizing:border-box;margin:0;padding:0;font-family:Trebuchet MS;}
body{background:#f9d98c;overflow:hidden;}

.screen{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
}

.screen.active{display:flex}

/* LOGO */
#logoScreen{background:#fff;}
#logoScreen img{
  width:60%;
  max-width:400px;
}

/* INSTRUCTION */
#instructionScreen{
  background:linear-gradient(#ffb347,#ffcc33);
  flex-direction:column;
  text-align:center;
  padding:20px;
}

.panel{
  background:#fff8e6;
  padding:20px;
  border-radius:20px;
  width:90%;
  max-width:700px;
}

/* GAME */
#gameScreen{
  flex-direction:column;
  background:#fff3d1;
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#fff;
  font-weight:bold;
}

/* STAGE */
.stage{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
}

img.asset{
  max-width:120px;
}

/* BUTTONS */
button{
  padding:12px 20px;
  border:none;
  background:#c93b2b;
  color:white;
  border-radius:10px;
  font-weight:bold;
}

/* ERROR SAFE IMAGE */
.asset{
  object-fit:contain;
}
</style>
</head>

<body>

<!-- LOGO -->
<section id="logoScreen" class="screen active">
  <img src="assets/innovine-logo.png"
       onerror="this.style.display='none'"
       alt="logo">
</section>

<!-- INSTRUCTIONS -->
<section id="instructionScreen" class="screen">
  <div class="panel">
    <h2>🍕 Pizza Master Academy</h2>
    <p>Complete 10 pizza word challenges!</p>
    <button onclick="startGame()">Start</button>
  </div>
</section>

<!-- GAME -->
<section id="gameScreen" class="screen">
  <div class="topbar">
    <div>Score: <span id="score">0</span></div>
    <div>Order <span id="order">1</span>/10</div>
  </div>

  <div class="stage">
    <img class="asset" src="assets/customer.png" onerror="this.style.display='none'">
    <div id="question">Loading...</div>

    <div>
      <button onclick="answer(true)">Correct</button>
      <button onclick="answer(false)">Wrong</button>
    </div>

    <img class="asset" src="assets/chef.png" onerror="this.style.display='none'">
  </div>
</section>

<script>
let score=0;
let order=1;

/* SAFE SCREEN SWITCH */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById(id);
  if(el) el.classList.add('active');
}

/* START FLOW FIXED */
setTimeout(()=>{
  show('instructionScreen');
},5000);

/* GAME START */
function startGame(){
  show('gameScreen');
  loadQuestion();
}

/* SIMPLE QUESTION FLOW (SAFE) */
function loadQuestion(){
  document.getElementById("question").innerText =
    "What does 'wind' mean in: The wind is strong today?";
}

/* ANSWER */
function answer(correct){
  if(correct) score+=10;
  document.getElementById("score").innerText=score;

  order++;
  document.getElementById("order").innerText=order;

  if(order>10){
    alert("Game Over! Score: "+score);
    location.reload();
    return;
  }

  loadQuestion();
}
</script>

</body>
</html>
