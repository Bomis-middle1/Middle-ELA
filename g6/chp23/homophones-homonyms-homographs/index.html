<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pizza Master Academy</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  background:linear-gradient(#ffb84d,#ff8c42);
}

/* TOP BAR */
.top-bar{
  height:10vh;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  background:#fff3d6;
  border-bottom:4px solid #d35400;
  font-weight:bold;
}

/* GAME AREA */
.game-container{
  height:90vh;
  display:flex;
  flex-direction:column;
}

/* QUESTION AREA */
.question-box{
  height:18%;
  background:#fff;
  margin:10px;
  padding:10px;
  border-radius:12px;
  border:3px solid #d35400;
  overflow:auto;
}

/* MIDDLE GAME WORLD */
.world{
  flex:1;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* OVEN */
.oven{
  position:absolute;
  bottom:5%;
  left:5%;
  width:25%;
  z-index:1;
}

/* CHEF */
.chef{
  position:absolute;
  bottom:5%;
  right:5%;
  width:20%;
  z-index:2;
}

/* PIZZA STAGE */
.pizza-area{
  width:220px;
  height:220px;
  border-radius:50%;
  background:#f2c572;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:3;
  border:6px solid #d35400;
}

/* BOTTOM OPTIONS */
.options{
  height:22%;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:10px;
  background:#fff7e6;
}

.option-btn{
  padding:12px 18px;
  background:#ffcc66;
  border:3px solid #d35400;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* IMAGE FIX */
img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  display:block;
}

/* FALLBACK BOX */
.fallback{
  display:none;
  font-size:14px;
  color:#333;
}
</style>
</head>

<body>

<div class="top-bar">
  <div>⭐ Score: 0/100</div>
  <div>🍕 Pizza Master Academy</div>
  <div>Order: 1/10</div>
</div>

<div class="game-container">

  <div class="question-box">
    <h3>Which sentence uses “bank” correctly?</h3>
    <p>Choose the sentence that makes sense.</p>
  </div>

  <div class="world">

    <!-- OVEN -->
    <img class="oven" src="assets/oven.png"
    onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
    <div class="fallback oven">OVEN MISSING</div>

    <!-- PIZZA STAGE -->
    <div class="pizza-area">
      <img src="assets/pizza-base.png"
      onerror="this.style.display='none';">
    </div>

    <!-- CHEF -->
    <img class="chef" src="assets/chef.png"
    onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
    <div class="fallback chef">CHEF MISSING</div>

  </div>

  <div class="options">
    <button class="option-btn">We sat on the river bank.</button>
    <button class="option-btn">The river deposited money.</button>
    <button class="option-btn">The bank flew away.</button>
    <button class="option-btn">Bank barked loudly.</button>
  </div>

</div>

</body>
</html>
