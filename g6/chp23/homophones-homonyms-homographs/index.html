<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pizza Master Academy - FIXED ENGINE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
  height:100vh;
  overflow:hidden;
  background:linear-gradient(#ffb84d,#ff8c42);
}

/* TOP HUD */
#hud{
  height:10vh;
  background:#fff3d6;
  border-bottom:4px solid #d35400;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  font-weight:bold;
}

/* QUESTION AREA (PRIORITY 1) */
#question{
  height:20vh;
  background:white;
  margin:8px;
  border-radius:12px;
  border:3px solid #d35400;
  padding:10px;
  font-size:18px;
  overflow:auto;
}

/* MIDDLE (DECOR ONLY) */
#world{
  height:35vh;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

.chef,.oven{
  position:absolute;
  width:15%;
  opacity:0.7;
}

.oven{left:5%;bottom:5%;}
.chef{right:5%;bottom:5%;}

/* OPTIONS AREA (PRIORITY 2) */
#options{
  height:35vh;
  background:#fff7e6;
  border-top:4px solid #d35400;
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:10px;
}

/* OPTION BUTTON */
.opt{
  width:45%;
  background:#ffcc66;
  border:3px solid #d35400;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  font-size:16px;
  text-align:center;
  cursor:pointer;
}

/* SAFE IMAGE */
img{max-width:100%;object-fit:contain;}
</style>
</head>

<body>

<div id="hud">
  <div>⭐ Score: 0/100</div>
  <div>🍕 Pizza Master Academy</div>
  <div>Order 1/10</div>
</div>

<div id="question">
  <b>Here, the word “wind” means:</b><br><br>
  The wind was very strong today.
</div>

<div id="world">
  <img class="oven" src="assets/oven.png">
  <img class="chef" src="assets/chef.png">
</div>

<div id="options">
  <div class="opt">Moving air</div>
  <div class="opt">Twist something</div>
  <div class="opt">Fold carefully</div>
  <div class="opt">Turn slowly</div>
</div>

</body>
</html>
