<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idiom Detective Agency: The Missing Meaning</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#203040;color:#222;overflow-x:hidden}
#logo{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999}
#logo img{max-width:70%;max-height:70%}
.hidden{display:none}
.office{min-height:100vh;background:linear-gradient(#29415f,#6b4b2a);padding:10px;color:#fff}
.hud{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;position:sticky;top:0;z-index:10}
.panel{background:rgba(255,255,255,.15);backdrop-filter:blur(4px);padding:8px;border-radius:10px}
.notice,.case{background:#f5ebcf;color:#222;border-radius:16px;padding:18px;max-width:1000px;margin:12px auto;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.opt{padding:14px;border-radius:12px;border:3px solid #8b6b3f;background:#fff;cursor:pointer;min-height:56px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.correct{animation:glow .6s alternate 3;background:#d4ffd4}
.wrong{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
@keyframes glow{from{box-shadow:0 0 5px green}to{box-shadow:0 0 25px green}}
.progress{height:16px;background:#ccc;border-radius:10px;overflow:hidden}
.bar{height:100%;background:gold;width:0%}
.center{text-align:center}
button{padding:12px 22px;font-size:18px;border:none;border-radius:10px;cursor:pointer}
#fx{position:fixed;inset:0;pointer-events:none}
.conf{position:absolute;font-size:24px;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div id="logo"><img src="assets/innovine-logo.png" onerror="this.outerHTML='<h1>Innovine</h1>'"></div>

<div id="app" class="office hidden">
<div id="instructions" class="notice center">
<h1>🕵️ Welcome to the Idiom Detective Agency!</h1>
<p>The city is full of mysterious misunderstandings. Solve all 10 cases and collect badges.</p>
<button onclick="startGame()">Start Investigation</button>
</div>

<div id="game" class="hidden">
<div class="hud">
<div class="panel">⭐ Score: <span id="score">0</span></div>
<div class="panel">📁 Case: <span id="caseNo">1</span>/10</div>
<div class="panel">🎯 Accuracy: <span id="acc">100</span>%</div>
<div class="panel">🏅 Badges<div id="badges" class="badges"></div></div>
<div class="panel">🔊 <input id="vol" type="range" min="0" max="1" step="0.1" value="1"></div>
<div class="panel"><div class="progress"><div id="bar" class="bar"></div></div></div>
</div>
<div id="caseArea"></div>
</div>

<div id="final" class="notice center hidden"></div>
</div>
<div id="fx"></div>

<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>
<audio id="clap" src="assets/clapping.mp3"></audio>

<script>
const hints={
"Hit the nail on the head":"This idiom is used when someone is exactly correct.",
"Bite the bullet":"Someone does something difficult even when nervous.",
"Cry over spilt milk":"Complaining about something that already happened.",
"Cost an arm and a leg":"Something is very expensive.",
"Break the ice":"Used to start conversation.",
"Barking up the wrong tree":"Blaming or accusing the wrong person.",
"Pull someone's leg":"A playful joke.",
"In hot water":"Someone is in trouble.",
"Burn the midnight oil":"Studying or working very late.",
"Kick the bucket":"Means to die."
};

let cases=[
{t:"Case 1",s:"Emma guessed the answer exactly before anyone else.",q:"Which idiom fits best?",a:"Hit the nail on the head",o:["Bite the bullet","Pull someone's leg","Hit the nail on the head","Burn the midnight oil"]},
{t:"Case 2",s:"Aarav was nervous about getting a vaccination, but he stayed calm and got it anyway.",q:"Which idiom fits best?",a:"Bite the bullet",o:["Cry over spilt milk","Bite the bullet","Break the ice","Cost an arm and a leg"]},
{t:"Case 3",s:"Mia accidentally dropped her ice cream. She kept complaining about it all afternoon.",q:"What advice should her friend give?",a:"Cry over spilt milk",o:["Burn the midnight oil","Break the ice","Cry over spilt milk","Pull someone's leg"]},
{t:"Case 4",s:"Sam bought a new gaming computer. It was extremely expensive.",q:"Which idiom fits best?",a:"Cost an arm and a leg",o:["Cost an arm and a leg","Kick the bucket","In hot water","Hit the nail on the head"]},
{t:"Case 5",s:"Two new classmates were too shy to speak to each other.",q:"What should one of them do first?",a:"Break the ice",o:["Bite the bullet","Break the ice","Burn the midnight oil","Barking up the wrong tree"]},
{t:"Case 6",s:"The teacher blamed Rahul for drawing on the desk, but his friend had actually done it.",q:"Which idiom fits best?",a:"Barking up the wrong tree",o:["Pull someone's leg","Barking up the wrong tree","Cost an arm and a leg","Bite the bullet"]},
{t:"Case 7",s:"Ava told her brother that aliens had landed in the school playground. She was only joking.",q:"Which idiom fits best?",a:"Pull someone's leg",o:["Pull someone's leg","In hot water","Burn the midnight oil","Break the ice"]},
{t:"Case 8",s:"Liam forgot to complete his homework for the third time this week. Now he has to explain it to his teacher.",q:"Which idiom fits best?",a:"In hot water",o:["Kick the bucket","In hot water","Cost an arm and a leg","Hit the nail on the head"]},
{t:"Case 9",s:"Sofia stayed awake until 1:00 a.m. studying for her science test.",q:"Which idiom fits best?",a:"Burn the midnight oil",o:["Burn the midnight oil","Bite the bullet","Break the ice","Pull someone's leg"]},
{t:"Case 10",s:"During a history lesson, the teacher explained that the old king had died many years ago.",q:'Which idiom means "to die"?',a:"Kick the bucket",o:["Kick the bucket","Break the ice","Cry over spilt milk","Barking up the wrong tree"]}
];

let order=[],idx=0,score=0,attempt=0,totalAttempts=0;

setTimeout(()=>{logo.classList.add('hidden');app.classList.remove('hidden')},5000);

function shuffle(a){return a.sort(()=>Math.random()-0.5)}
function startGame(){
instructions.classList.add('hidden');game.classList.remove('hidden');
order=shuffle([...cases]);idx=0;score=0;totalAttempts=0;badges.innerHTML='';render();
}
function render(){
attempt=0;
let c=order[idx];caseNo.textContent=idx+1;
let opts=shuffle([...c.o]);
caseArea.innerHTML=`<div class="case"><h2>📁 ${c.t}</h2><p><b>🕵 Witness Statement:</b> ${c.s}</p><p><b>📌 Evidence Card</b></p><p>${c.q}</p><div class="options">${opts.map(x=>`<button class="opt" onclick="pick(this,\`${x.replace(/`/g,'')}\`)">🧾 ${x}</button>`).join('')}</div><div id="hint"></div></div>`;
updateHud();
}
function setVol(){[correct,wrong,clap].forEach(a=>a.volume=vol.value)}
vol.oninput=setVol; setVol();

function play(a){a.currentTime=0;a.play().catch(()=>{})}

function pick(el,ans){
let c=order[idx]; totalAttempts++;
if(ans===c.a){
score++; el.classList.add('correct'); play(correct); setTimeout(()=>play(clap),300);
burst(); badges.innerHTML+="🏅";
setTimeout(nextCase,1200);
}else{
attempt++; el.classList.add('wrong'); play(wrong);
if(attempt===2) hint.innerHTML=`<p><b>💡 Detective Note:</b> ${hints[c.a]}</p>`;
if(attempt>=3){hint.innerHTML+=`<p>✔ Answer: <b>${c.a}</b></p>`; setTimeout(nextCase,1500);}
}
updateHud();
}
function updateHud(){
scoreEl=document.getElementById('score');scoreEl.textContent=score;
let solved=idx;
bar.style.width=(solved/10*100)+'%';
acc.textContent=totalAttempts?Math.round(score/totalAttempts*100):100;
}
function nextCase(){
idx++;
bar.style.width=(idx/10*100)+'%';
if(idx>=10) finish(); else render();
}
function finish(){
game.classList.add('hidden');final.classList.remove('hidden');
let rank=score==10?'Master Detective':score==9?'Chief Inspector':score==8?'Senior Detective':score>=6?'Junior Detective':'Detective Trainee';
final.innerHTML=`<h1>🏆 Congratulations, Detective!</h1><h2>Score ${score}/10</h2><h2>Accuracy ${Math.round(score/Math.max(totalAttempts,1)*100)}%</h2><h2>${rank}</h2><p>The city mystery is solved!</p><button onclick="location.reload()">Play Again</button>`;
burst(80); play(clap);
}
function burst(n=30){
for(let i=0;i<n;i++){
let d=document.createElement('div');d.className='conf';d.textContent=['✨','⭐','🎉','🏅'][Math.floor(Math.random()*4)];
d.style.left=Math.random()*100+'vw';d.style.top='-20px';fx.appendChild(d);
setTimeout(()=>d.remove(),2200);
}
}
</script>
</body></html>
