
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temple Scroll Sentence Builder</title>
<style>
body { margin:0; font-family: Arial; background:#f0f8ff; overflow:hidden; }
#logoScreen { position:fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; justify-content:center; align-items:center; z-index:100; }
#gameContainer { display:none; width:100%; height:100vh; position:relative; overflow:hidden; }
h2 { text-align:center; margin:10px; }
#ladder { position:absolute; bottom:50px; left:50%; transform:translateX(-50%); width:80px; height:500px; background:#a0522d; border-radius:10px; }
.step { width:80px; height:20px; background:#deb887; margin:10px 0; border-radius:5px; text-align:center; line-height:20px; color:#fff; font-weight:bold; }
#player { position:absolute; width:60px; height:80px; z-index:10; left:50%; transform:translateX(-50%); bottom:50px; transition: bottom 0.3s; }
#scroll { position:absolute; width:150px; height:50px; background:#ffe4b5; border-radius:10px; text-align:center; line-height:50px; font-weight:bold; cursor:pointer; left:50%; transform:translateX(-50%); top:20px; z-index:5; }
.word { display:inline-block; padding:5px 10px; margin:5px; background:#ffcc00; border-radius:5px; cursor:pointer; user-select:none; }
#dropZone { min-height:40px; background:#ddd; border:2px dashed #aaa; margin:10px auto; padding:5px; width:90%; text-align:left; border-radius:5px; }
#questionBox { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:10px; width:90%; max-width:400px; text-align:center; box-shadow:0 0 15px #0003; z-index:50; }
#feedback { margin-top:10px; font-weight:bold; }
#treasure { position:absolute; bottom:20px; left:50%; width:120px; height:120px; transform:translateX(-50%); display:none; z-index:20; }
#restartBtn { display:none; position:absolute; left:50%; transform:translateX(-50%); top:70%; padding:10px 30px; font-size:18px; cursor:pointer; }
#volumeSlider { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); }
</style>
</head>
<body>

<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo" width="200">
</div>

<div id="gameContainer">
<h2>🪄 Temple Scroll Sentence Builder 🪄</h2>
<div id="ladder"></div>
<img id="player" src="assets/player.png" alt="Player">
<div id="scroll">Click Scroll</div>

<div id="questionBox">
<div id="dropZone">Drag words here in order...</div>
<div id="wordPool"></div>
<button id="submitBtn">Submit</button>
<div id="feedback"></div>
</div>

<img id="treasure" src="assets/treasure.png" alt="Treasure">
<button id="restartBtn">Restart Adventure</button>
<input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>
</div>

<script>
// Questions simplified
const questions = [
  {words:["Ravi","said","that","he","was","happy"], answer:"Ravi said that he was happy"},
  {words:["Mother","told","us","not","to","touch","the","vase"], answer:"Mother told us not to touch the vase"},
  {words:["Anna","said","that","they","would","meet","the","next","day"], answer:"Anna said that they would meet the next day"},
  {words:["Ali","said","that","he","could","run","fast"], answer:"Ali said that he could run fast"},
  {words:["The","teacher","asked","us","to","open","the","book","now"], answer:"The teacher asked us to open the book now"}
];

let currentQ = 0;
const player = document.getElementById('player');
const scroll = document.getElementById('scroll');
const questionBox = document.getElementById('questionBox');
const dropZone = document.getElementById('dropZone');
const wordPool = document.getElementById('wordPool');
const submitBtn = document.getElementById('submitBtn');
const feedback = document.getElementById('feedback');
const treasure = document.getElementById('treasure');
const restartBtn = document.getElementById('restartBtn');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');
const volumeSlider = document.getElementById('volumeSlider');

volumeSlider.oninput = ()=>{
  correctSound.volume = volumeSlider.value;
  wrongSound.volume = volumeSlider.value;
  clapSound.volume = volumeSlider.value;
};
correctSound.volume = volumeSlider.value;
wrongSound.volume = volumeSlider.value;
clapSound.volume = volumeSlider.value;

// Logo splash
setTimeout(()=>{
  document.getElementById('logoScreen').style.display='none';
  document.getElementById('gameContainer').style.display='block';
},5000);

// Scroll click
scroll.addEventListener('click', ()=>{
  showQuestion(currentQ);
});

// Show question
function showQuestion(index){
  questionBox.style.display='block';
  dropZone.innerHTML="";
  wordPool.innerHTML="";
  feedback.innerHTML="";
  let words = [...questions[index].words];
  words.sort(()=>Math.random()-0.5); // shuffle
  words.forEach(w=>{
    let span = document.createElement('span');
    span.className="word";
    span.textContent=w;
    span.draggable=true;
    span.addEventListener('dragstart', dragStart);
    wordPool.appendChild(span);
  });
}

// Drag & Drop
let dragged;
function dragStart(e){ dragged=e.target; }
dropZone.addEventListener('dragover', e=>e.preventDefault());
dropZone.addEventListener('drop', e=>{
  e.preventDefault();
  dropZone.appendChild(dragged);
});

// Submit
submitBtn.addEventListener('click', ()=>{
  let formed = Array.from(dropZone.children).map(c=>c.textContent).join(" ");
  if(formed===questions[currentQ].answer){
    feedback.textContent="Correct! 🎉";
    feedback.style.color="green";
    correctSound.currentTime=0; correctSound.play();
    questionBox.style.display='none';
    currentQ++;
    player.style.bottom=50+currentQ*60+"px";
    if(currentQ<questions.length){
      scroll.style.display='block';
    }else{
      endGame();
    }
  }else{
    feedback.textContent="Try again!";
    feedback.style.color="red";
    wrongSound.currentTime=0; wrongSound.play();
  }
});

// End Game
function endGame(){
  treasure.style.display='block';
  clapSound.currentTime=0; clapSound.play();
  restartBtn.style.display='block';
}

// Restart
restartBtn.addEventListener('click', ()=>{
  currentQ=0;
  treasure.style.display='none';
  restartBtn.style.display='none';
  player.style.bottom="50px";
  scroll.style.display='block';
});
</script>
</body>
</html>
