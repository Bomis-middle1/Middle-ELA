<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magic Speech Bubbles - Direct & Indirect Speech</title>
<style>
body { margin:0; font-family: Arial; background:#f0f8ff; overflow:hidden; }
#logoScreen { position:fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; justify-content:center; align-items:center; z-index:100; }
#gameContainer { display:none; width:100%; height:100vh; position:relative; overflow:hidden; }
h2 { text-align:center; margin:10px; }
.bubble { position:absolute; width:200px; padding:10px; background:#ffcc00; border-radius:50px; text-align:center; color:#000; font-weight:bold; cursor:pointer; animation-name:rise; animation-timing-function:linear; animation-iteration-count:1; }
@keyframes rise { 0%{ bottom:-50px } 100%{ bottom:100vh } }
#questionBox { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:10px; width:80%; max-width:400px; text-align:center; box-shadow:0 0 15px #0003; z-index:50; }
#questionBox button { margin:5px; padding:10px 20px; font-size:16px; cursor:pointer; }
#feedback { margin-top:10px; font-weight:bold; }
#treasure { position:absolute; bottom:20px; left:50%; width:120px; height:120px; transform:translateX(-50%); display:none; }
#restartBtn { display:none; position:absolute; left:50%; transform:translateX(-50%); top:70%; padding:10px 30px; font-size:18px; cursor:pointer; }
#volumeSlider { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); }
</style>
</head>
<body>

<!-- Logo -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo" width="200">
</div>

<!-- Game -->
<div id="gameContainer">
  <h2>🎇 Magic Speech Bubbles Adventure 🎇</h2>
  <div id="bubblesArea"></div>

  <div id="questionBox">
    <div id="questionText"></div>
    <div id="optionsContainer"></div>
    <div id="feedback"></div>
  </div>

  <img id="treasure" src="assets/treasure.png" alt="Treasure">
  <button id="restartBtn">Restart Adventure</button>
  <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>
const questions = [
  {q:"“I can juggle five mangoes!” he shouts. How to report?", options:["He proudly said that he could juggle five mangoes.","He shouted that he could not juggle.","He ignored it.","He quickly ran away."], answer:"He proudly said that he could juggle five mangoes."},
  {q:"“Catch the balloon before it flies away!” says the clown.", options:["The clown instructed us to catch the balloon before it flew away.","The clown told us to ignore it.","The clown ran away.","The clown shouted nothing."], answer:"The clown instructed us to catch the balloon before it flew away."},
  {q:"“Don’t come too close to the tiger!” squawks a parrot.", options:["The parrot warned us not to come too close to the tiger.","The parrot said nothing.","The parrot moved away.","The parrot ran."], answer:"The parrot warned us not to come too close to the tiger."},
  {q:"“We found the hidden treasure!” yells a pirate.", options:["The pirate shouted that they had found the hidden treasure.","The pirate asked a question.","The pirate ignored it.","The pirate hid."], answer:"The pirate shouted that they had found the hidden treasure."},
  {q:"“Taste this, it’s really sweet!” says your sister.", options:["She said that it was really sweet and asked me to taste it.","She ignored it.","She shouted.","She quickly ran away."], answer:"She said that it was really sweet and asked me to taste it."},
  {q:"“Why did your volcano erupt?” asks the teacher.", options:["The teacher asked why our volcano had erupted.","The teacher ignored.","The teacher shouted.","The teacher left."], answer:"The teacher asked why our volcano had erupted."},
  {q:"“Watch carefully, or you’ll miss the trick!” announces the magician.", options:["The magician told us to watch carefully or we would miss the trick.","The magician said nothing.","The magician ran away.","The magician shouted loudly."], answer:"The magician told us to watch carefully or we would miss the trick."},
  {q:"“I am late because of the traffic!” complains your friend.", options:["He said that he was late because of the traffic.","He ignored it.","He ran away.","He shouted loudly."], answer:"He said that he was late because of the traffic."},
  {q:"“Pass the ball quickly!” shouts the coach.", options:["The coach instructed the players to pass the ball quickly.","The coach ignored them.","The coach shouted nonsense.","The coach laughed."], answer:"The coach instructed the players to pass the ball quickly."},
  {q:"“Don’t open the gifts until I count to ten!” says someone.", options:["They asked us not to open the gifts until they counted to ten.","They ignored us.","They opened them.","They shouted loudly."], answer:"They asked us not to open the gifts until they counted to ten."}
];

let currentQ = 0;
const gameContainer = document.getElementById('gameContainer');
const bubblesArea = document.getElementById('bubblesArea');
const questionBox = document.getElementById('questionBox');
const questionText = document.getElementById('questionText');
const optionsContainer = document.getElementById('optionsContainer');
const feedback = document.getElementById('feedback');
const restartBtn = document.getElementById('restartBtn');
const treasure = document.getElementById('treasure');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');
const volumeSlider = document.getElementById('volumeSlider');

volumeSlider.oninput = ()=>{
  correctSound.volume = volumeSlider.value;
  wrongSound.volume = volumeSlider.value;
  clapSound.volume = volumeSlider.value;
};
correctSound.volume = volumeSlider.value;
wrongSound.volume = volumeSlider.value;
clapSound.volume = volumeSlider.value;

// --- Logo Splash ---
setTimeout(()=>{
  document.getElementById('logoScreen').style.display='none';
  gameContainer.style.display='block';
  spawnBubble();
},5000);

// --- Spawn Bubble ---
function spawnBubble(){
  if(currentQ>=questions.length){
    endGame();
    return;
  }
  const bubble = document.createElement('div');
  bubble.className='bubble';
  bubble.style.left = Math.random()*70 + "%";
  bubble.textContent = "💬";
  bubble.style.animationDuration = (6+Math.random()*3)+"s";
  bubblesArea.appendChild(bubble);

  bubble.addEventListener('click', ()=>{
    showQuestion(currentQ, bubble);
  });

  setTimeout(()=>{ 
    if(bubblesArea.contains(bubble)) bubblesArea.removeChild(bubble);
    if(currentQ<questions.length) spawnBubble();
  }, parseFloat(bubble.style.animationDuration)*1000);
}

// --- Show Question ---
function showQuestion(index, bubble){
  questionBox.style.display='block';
  const q = questions[index];
  questionText.textContent = q.q;
  optionsContainer.innerHTML='';
  q.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.onclick = ()=>checkAnswer(opt,bubble);
    optionsContainer.appendChild(btn);
  });
  feedback.textContent='';
}

// --- Check Answer ---
function checkAnswer(ans,bubble){
  const q = questions[currentQ];
  if(ans===q.answer){
    feedback.textContent = "Correct! 🎉";
    feedback.style.color = "green";
    correctSound.currentTime=0; correctSound.play();
    questionBox.style.display='none';
    if(bubble && bubblesArea.contains(bubble)) bubblesArea.removeChild(bubble);
    currentQ++;
    spawnBubble();
  } else {
    feedback.textContent = "Oops! Try again.";
    feedback.style.color = "red";
    wrongSound.currentTime=0; wrongSound.play();
  }
}

// --- End Game ---
function endGame(){
  questionBox.style.display='none';
  treasure.style.display='block';
  clapSound.currentTime=0; clapSound.play();
  restartBtn.style.display='block';
}

// --- Restart ---
restartBtn.onclick = ()=>{
  currentQ=0;
  treasure.style.display='none';
  restartBtn.style.display='none';
  spawnBubble();
}
</script>
</body>
</html>
