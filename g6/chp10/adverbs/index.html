<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adverbs Balloon Adventure Level 3</title>

<style>
body{
margin:0;
font-family:Arial;
overflow:hidden;
background:linear-gradient(#cfefff,#e9f7ff);
}

/* LOGO */
#logoScreen{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

/* GAME */
#gameContainer{
display:none;
width:100%;
height:100vh;
position:relative;
overflow:hidden;
}

/* TITLE */
h2{
text-align:center;
margin:8px;
color:#1d3557;
}

/* SCORE */
#scoreBoard{
position:absolute;
top:10px;
right:10px;
background:white;
padding:8px 14px;
border-radius:10px;
z-index:50;
}

/* PROGRESS */
#progress{
position:absolute;
top:10px;
left:10px;
background:#fff;
padding:8px 12px;
border-radius:10px;
z-index:50;
}

/* MONKEY */
#player{
position:absolute;
bottom:20px;
left:30px;
width:90px;
z-index:20;
}

/* BALLOON LAYER (IMPORTANT FIX) */
#balloonArea{
position:absolute;
inset:0;
z-index:5;
overflow:hidden;
}

/* BALLOONS */
.balloon{
position:absolute;
width:70px;
height:90px;
cursor:pointer;
transition:transform 0.2s;
filter: drop-shadow(0 8px 10px rgba(0,0,0,0.25));
}

/* fallback if image fails */
.balloon.fallback{
background:radial-gradient(circle at 30% 30%, #ff4d6d, #c9184a);
border-radius:50% 50% 45% 45%;
}

/* POP */
.balloon.pop{
transform:scale(0);
opacity:0;
}

/* QUESTION BOX */
#questionBox{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:22px;
border-radius:15px;
width:90%;
max-width:450px;
text-align:center;
z-index:100;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

#questionText{
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

#optionsContainer{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button{
padding:12px;
border:none;
border-radius:10px;
background:#f1f1f1;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#dbeafe;
}

/* FEEDBACK */
#feedback{
margin-top:8px;
font-weight:bold;
}

/* TREASURE */
#treasure{
position:absolute;
bottom:20px;
left:50%;
width:120px;
transform:translateX(-50%);
display:none;
}

/* RESTART */
#restartBtn{
display:none;
position:absolute;
left:50%;
transform:translateX(-50%);
top:70%;
padding:12px 25px;
border:none;
border-radius:10px;
background:#1d3557;
color:white;
z-index:100;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
<img src="assets/innovine-logo.png" width="220">
</div>

<!-- GAME -->
<div id="gameContainer">

<h2>🎈 Level 3 Balloon Adverbs Adventure 🎈</h2>

<div id="scoreBoard">Score: 0</div>
<div id="progress">Progress: 0/5</div>

<img id="player" src="assets/player.png">

<div id="balloonArea"></div>

<div id="questionBox">
<div id="questionText"></div>
<div id="optionsContainer"></div>
<div id="feedback"></div>
</div>

<img id="treasure" src="assets/treasure.png">
<button id="restartBtn">Restart</button>

</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

const questions=[
{q:"You run from monkeys. How?",options:["quickly","slowly","yesterday","there"],answer:"quickly"},
{q:"You shout in mountain. How?",options:["loudly","softly","very","there"],answer:"loudly"},
{q:"You sneak past dragon. How?",options:["quietly","yesterday","now","there"],answer:"quietly"},
{q:"You solve puzzle. How?",options:["cleverly","slowly","there","very"],answer:"cleverly"},
{q:"You celebrate victory. How?",options:["joyfully","sadly","there","yesterday"],answer:"joyfully"}
];

let currentQ=0;
let score=0;
let balloons=[];

const balloonArea=document.getElementById("balloonArea");
const questionBox=document.getElementById("questionBox");
const questionText=document.getElementById("questionText");
const optionsContainer=document.getElementById("optionsContainer");
const feedback=document.getElementById("feedback");
const scoreBoard=document.getElementById("scoreBoard");
const progress=document.getElementById("progress");

const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("gameContainer").style.display="block";
spawnMultipleBalloons();
},5000);

function createBalloon(){

const b=document.createElement("img");
b.src="assets/balloon.png";
b.className="balloon";

b.style.left=Math.random()*85+"%";
b.style.bottom="-100px";

b.onerror=()=>{
b.classList.add("fallback");
};

balloonArea.appendChild(b);

let pos=-100;

const move=setInterval(()=>{
pos+=2;
b.style.bottom=pos+"px";

if(pos>window.innerHeight){
clearInterval(move);
b.remove();
spawnMultipleBalloons();
}
},20);

b.onclick=()=>showQ(b,move);

balloons.push(b);
}

function spawnMultipleBalloons(){
balloonArea.innerHTML="";
balloons=[];
for(let i=0;i<4;i++){
setTimeout(createBalloon,i*400);
}
}

function showQ(balloon,move){
clearInterval(move);

const q=questions[currentQ];

questionText.innerText=q.q;
optionsContainer.innerHTML="";
feedback.innerText="";

q.options.forEach(o=>{
const btn=document.createElement("button");
btn.innerText=o;
btn.onclick=()=>check(o,balloon);
optionsContainer.appendChild(btn);
});

questionBox.style.display="block";
}

function check(ans,balloon){

const q=questions[currentQ];

if(ans===q.answer){

score++;
scoreBoard.innerText="Score: "+score;
progress.innerText="Progress: "+(currentQ+1)+"/"+questions.length;

feedback.innerText="Correct 🎉";
feedback.style.color="green";

correctSound.play();

balloon.classList.add("pop");

setTimeout(()=>{
balloon.remove();
questionBox.style.display="none";
currentQ++;

if(currentQ>=questions.length){
endGame();
}else{
spawnMultipleBalloons();
}
},300);

}else{
feedback.innerText="Try again!";
feedback.style.color="red";
wrongSound.play();
}
}

function endGame(){
questionBox.style.display="none";
document.getElementById("treasure").style.display="block";
document.getElementById("restartBtn").style.display="block";
clapSound.play();
}

document.getElementById("restartBtn").onclick=()=>{
location.reload();
};

</script>

</body>
</html>
