<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quest for Adverb Crystals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(to bottom,#1b2a49,#2c5364);
color:white;
overflow:hidden;
}

#splash{
position:fixed;
inset:0;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:999;
}

#splash img{width:220px;}

#titleScreen{
display:none;
height:100vh;
align-items:center;
justify-content:center;
text-align:center;
font-size:28px;
font-weight:bold;
padding:20px;
}

#instructionScreen{
display:none;
padding:20px;
font-size:15px;
line-height:1.6;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#ffd54f;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

#game{display:none;padding:10px;}

.topBar{
display:flex;
justify-content:space-between;
font-size:16px;
margin-bottom:10px;
}

.box{
background:white;
color:black;
padding:15px;
border-radius:10px;
min-height:140px;
}

.option{
background:#eee;
margin:8px 0;
padding:10px;
border-radius:8px;
cursor:pointer;
}

.option:hover{background:#ddd}

#endScreen{
display:none;
text-align:center;
padding:20px;
}

.flash{
font-size:26px;
font-weight:bold;
animation:flash 0.8s infinite;
}

@keyframes flash{
0%{opacity:1}
50%{opacity:0.3}
100%{opacity:1}
}

.confetti{
position:fixed;
width:8px;height:8px;
top:0;
animation:fall 3s linear;
}

@keyframes fall{
to{transform:translateY(100vh) rotate(360deg);}
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="/mnt/data/ae80f07f-381f-4db7-bebe-7a48b91cdd96.png">
</div>

<!-- TITLE -->
<div id="titleScreen">
🏰 Quest for the Seven Adverb Crystals 🏰
</div>

<!-- INSTRUCTIONS -->
<div id="instructionScreen">
<h2>🏰 Welcome to the Quest for the Seven Adverb Crystals!</h2>

<p>The magical kingdom is in danger! Answer correctly to collect crystals.</p>

<button onclick="startGame()">Start Game</button>
</div>

<!-- GAME -->
<div id="game">
<div class="topBar">
<div id="qCount">1/15</div>
<div>⏳ <span id="timer">80</span>s</div>
</div>

<div class="box">
<h3 id="question"></h3>
<div id="options"></div>
</div>

</div>

<!-- END -->
<div id="endScreen">
<div class="flash">🏆 TREASURE UNLOCKED!</div>
<h3 id="scoreText"></h3>
<p id="remark"></p>
<p id="timeTaken"></p>
<p id="wrongCount"></p>
<button onclick="restart()">Restart</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

/* QUESTIONS (UNCHANGED) */
let questions = [
{q:`1.A sleeping lion blocks your path. How do you walk past it?`, options:[`quietly`,`tomorrow`,`here`,`always`], answer:`quietly`},
{q:`2. The castle gate is closing fast! When should you run through it?`, options:[`immediately`,`softly`,`everywhere`,`never`], answer:`immediately`},
{q:`3. The castle guard checks the gates every single day. Which adverb matches this?`, options:[`always`,`tomorrow`,`carefully`,`there`], answer:`always`},
{q:`4. The wizard suddenly vanished. Which question asks about the place?`, options:[`Where did the wizard vanish?`,`Why did the wizard vanish?`,`When did the wizard vanish?`,`How did the wizard vanish?`], answer:`Where did the wizard vanish?`},
{q:`5.The cave is ______ dark that everyone lights a torch.`, options:[`very`,`yesterday`,`there`,`often`], answer:`very`},
{q:`6. Heavy rain begins.Why do the explorers rush into a cave?`, options:[`because they want to stay dry`,`carefully`,`tomorrow`,`here`], answer:`because they want to stay dry`},
{q:`7. Your treasure map says the key is hidden beside you.Which word tells the place?`, options:[`here`,`loudly`,`yesterday`,`always`], answer:`here`},
{q:`8.You must hit the glowing target with one shot.How do you shoot the arrow?`, options:[`accurately`,`tomorrow`,`there`,`often`], answer:`accurately`},
{q:`9. The dragon visits the village only a few times each year.Which adverb fits best?`, options:[`rarely`,`quickly`,`here`,`yesterday`], answer:`rarely`},
{q:`10. The puzzle became ______ easy after the fairy gave you a clue.`, options:[`quite`,`tomorrow`,`everywhere`,`carefully`], answer:`quite`},
{q:`11. The bridge catches fire.Why do the villagers take another road?`, options:[`because the bridge is unsafe`,`loudly`,`yesterday`,`there`], answer:`because the bridge is unsafe`},
{q:`12.The magical bird flew in every direction.Which adverb tells where?`, options:[`everywhere`,`quietly`,`tomorrow`,`always`], answer:`everywhere`},
{q:`13. The wizard says the secret door will open the next day.Which adverb tells when?`, options:[`tomorrow`,`carefully`,`here`,`very`], answer:`tomorrow`},
{q:`14. The dragon escaped.Which question asks why it escaped?`, options:[`Why did the dragon escape?`,`Where did the dragon escape?`,`When did the dragon escape?`,`How did the dragon escape?`], answer:`Why did the dragon escape?`},
{q:`15.You have reached the final treasure.Choose the sentence with the adverb used correctly.`, options:[`The knight carefully crossed the shaky bridge.`,`The knight crossed tomorrow.`,`The knight crossed sword.`,`The knight crossed castle.`], answer:`The knight carefully crossed the shaky bridge.`}
];

let index=0,score=0,timer=80,interval,time=0,wrong=0;

/* SHUFFLE */
function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*i);
[a[i],a[j]]=[a[j],a[i]];
}
return a;
}

/* SPLASH FLOW */
setTimeout(()=>{
document.getElementById("splash").style.display="none";
document.getElementById("titleScreen").style.display="flex";

setTimeout(()=>{
document.getElementById("titleScreen").style.display="none";
document.getElementById("instructionScreen").style.display="block";
},3000);

},5000);

/* START */
function startGame(){
document.getElementById("instructionScreen").style.display="none";
document.getElementById("game").style.display="block";
questions = shuffle(questions);
loadQ();
startTimer();
}

/* LOAD */
function loadQ(){
if(index>=questions.length){
end();
return;
}

document.getElementById("qCount")=(index+1)+"/15";
document.getElementById("qCount").innerText=(index+1)+"/15";

let q=questions[index];
document.getElementById("question").innerText=q.q;

/* SHUFFLE OPTIONS HERE */
let opts = shuffle([...q.options]);

let box=document.getElementById("options");
box.innerHTML="";

opts.forEach(o=>{
let d=document.createElement("div");
d.className="option";
d.innerText=o;
d.onclick=()=>check(o);
box.appendChild(d);
});
}

/* CHECK */
function check(ans){
let correct=ans===questions[index].answer;

let s=document.getElementById(correct?"correctSound":"wrongSound");
s.play();

if(correct){
score++;
document.getElementById("clapSound").play();
confetti();
next();
}else{
wrong++;
next();
}
}

function next(){
index++;
timer=80;
loadQ();
}

/* TIMER */
function startTimer(){
interval=setInterval(()=>{
timer--;
time++;
document.getElementById("timer").innerText=timer;
if(timer<=0){
next();
}
},1000);
}

/* CONFETTI */
function confetti(){
for(let i=0;i<25;i++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=["red","blue","yellow","green"][i%4];
document.body.appendChild(c);
setTimeout(()=>c.remove(),3000);
}
}

/* END */
function end(){
clearInterval(interval);
document.getElementById("game").style.display="none";
document.getElementById("endScreen").style.display="block";

let percent=(score/15)*100;

document.getElementById("scoreText").innerText=`Score: ${score}/15`;

let remark="";
if(percent>=80) remark="Excellent ⭐";
else if(percent>=60) remark="Good Job 👍";
else if(percent>=45) remark="Well Tried 🙂";
else remark="Let's Revise 📘";

document.getElementById("remark").innerText=remark;
document.getElementById("timeTaken").innerText="Time: "+time+" sec";
document.getElementById("wrongCount").innerText="Wrong Attempts: "+wrong;
}

/* RESTART */
function restart(){
location.reload();
}

</script>

</body>
</html>
