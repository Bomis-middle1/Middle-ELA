<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adverbs Balloon Pop Quiz</title>
<style>
  body { margin:0; font-family: Arial; background:#cceeff; overflow:hidden; }
  #logoScreen { position:fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; justify-content:center; align-items:center; z-index:100; }
  #gameContainer { display:none; width:100%; height:100vh; position:relative; overflow:hidden; }
  h2 { text-align:center; margin:10px; }
  .balloon { position:absolute; width:60px; height:80px; background:red; border-radius:50% 50% 50% 50%; cursor:pointer; display:flex; justify-content:center; align-items:center; color:white; font-weight:bold; font-size:18px; animation-name:rise; animation-timing-function: linear; animation-iteration-count: 1; }
  @keyframes rise { 0%{ bottom:-100px } 100%{ bottom:100vh } }
  #questionBox { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:10px; text-align:center; width:80%; max-width:400px; box-shadow:0 0 15px #0003; z-index:50; }
  #questionBox button { margin:5px; padding:10px 20px; font-size:16px; cursor:pointer; }
  #feedback { margin-top:10px; font-weight:bold; }
  #restartBtn { display:none; margin:20px auto; padding:10px 30px; font-size:18px; cursor:pointer; position:absolute; left:50%; transform:translateX(-50%); top:70%; }
  #volumeSlider { position:absolute; bottom:10px; left:50%; transform:translateX(-50%); }
</style>
</head>
<body>

<!-- Logo -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo" width="200">
</div>

<!-- Game -->
<div id="gameContainer">
  <h2>🎈 Adverbs Balloon Pop Quiz 🎈</h2>

  <!-- Question -->
  <div id="questionBox">
    <div id="questionText"></div>
    <div id="optionsContainer"></div>
    <div id="feedback"></div>
  </div>

  <button id="restartBtn">Restart Adventure</button>
  <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.8">
</div>

<!-- Sounds -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const questions = [
  {q:"You’re running from mischievous monkeys. How do you run?", options:["quickly","slowly","yesterday","there"], answer:"quickly"},
  {q:"You shout across the mountain. How?", options:["loudly","carefully","softly","very"], answer:"loudly"},
  {q:"Tiptoe past a sleeping dragon. How?", options:["quietly","yesterday","everywhere","often"], answer:"quietly"},
  {q:"Flashlight flickers in cave. When do you turn it on?", options:["immediately","cleverly","very","tomorrow"], answer:"immediately"},
  {q:"Squirrel hides backpack. Where?", options:["behind the tree","quickly","loudly","yesterday"], answer:"behind the tree"},
  {q:"Dance at festival. How?", options:["gracefully","there","sometimes","very"], answer:"gracefully"},
  {q:"Solve riddle from statue. How?", options:["cleverly","carefully","often","when"], answer:"cleverly"},
  {q:"Throw magic rope across river. How?", options:["accurately","there","yesterday","always"], answer:"accurately"},
  {q:"Sneak past pirates. How?", options:["silently","cleverly","very","now"], answer:"silently"},
  {q:"Open treasure chest. How do you celebrate?", options:["joyfully","yesterday","often","carefully"], answer:"joyfully"}
];

let currentQ = 0;
const gameContainer = document.getElementById('gameContainer');
const questionBox = document.getElementById('questionBox');
const questionText = document.getElementById('questionText');
const optionsContainer = document.getElementById('optionsContainer');
const feedback = document.getElementById('feedback');
const restartBtn = document.getElementById('restartBtn');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const volumeSlider = document.getElementById('volumeSlider');

volumeSlider.oninput = ()=>{
  correctSound.volume = volumeSlider.value;
  wrongSound.volume = volumeSlider.value;
};
correctSound.volume = volumeSlider.value;
wrongSound.volume = volumeSlider.value;

// --- Show Logo ---
setTimeout(()=>{
  document.getElementById('logoScreen').style.display='none';
  gameContainer.style.display='block';
  spawnBalloon();
},5000);

// --- Spawn Balloon ---
function spawnBalloon(){
  if(currentQ >= questions.length){
    endGame();
    return;
  }
  const balloon = document.createElement('div');
  balloon.className='balloon';
  balloon.style.left = Math.random()*80 + "%";
  balloon.textContent = currentQ+1;
  balloon.style.background = randomColor();
  balloon.style.animationDuration = (6 + Math.random()*4) + "s"; // slower
  gameContainer.appendChild(balloon);

  balloon.addEventListener('click', ()=>{
    showQuestion(currentQ, balloon);
  });

  // Remove balloon if it goes off screen
  setTimeout(()=>{ 
    if(gameContainer.contains(balloon)) gameContainer.removeChild(balloon); 
    if(currentQ<questions.length) spawnBalloon();
  }, parseFloat(balloon.style.animationDuration)*1000);
}

// --- Random Color ---
function randomColor(){
  const colors = ['red','orange','yellow','green','blue','purple','pink'];
  return colors[Math.floor(Math.random()*colors.length)];
}

// --- Show Question ---
function showQuestion(index, balloon){
  const q = questions[index];
  questionText.textContent = q.q;
  optionsContainer.innerHTML = '';
  q.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.onclick = ()=>checkAnswer(opt, balloon);
    optionsContainer.appendChild(btn);
  });
  questionBox.style.display='block';
  feedback.textContent='';
}

// --- Check Answer ---
function checkAnswer(ans, balloon){
  const q = questions[currentQ];
  if(ans === q.answer){
    feedback.textContent = "Correct! 🎉";
    feedback.style.color = "green";
    correctSound.currentTime = 0; correctSound.play();
    questionBox.style.display='none';
    if(balloon && gameContainer.contains(balloon)) gameContainer.removeChild(balloon);
    currentQ++;
    spawnBalloon();
  } else {
    feedback.textContent = "Oops! Try again.";
    feedback.style.color = "red";
    wrongSound.currentTime = 0; wrongSound.play();
  }
}

// --- End Game ---
function endGame(){
  questionBox.style.display='none';
  restartBtn.style.display='block';
  alert("🎊 Congratulations! You popped all the balloons and finished the adventure! 🎊");
}

// --- Restart ---
restartBtn.onclick = ()=>{
  currentQ=0;
  restartBtn.style.display='none';
  spawnBalloon();
}
</script>
</body>
</html>
