<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adverbs Balloon Adventure</title>

<style>
body{
margin:0;
font-family:Arial;
overflow:hidden;
background:linear-gradient(#cfefff,#e9f7ff);
}

/* LOGO */
#logoScreen{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
}

/* GAME */
#gameContainer{
display:none;
width:100%;
height:100vh;
position:relative;
overflow:hidden;
}

/* TITLE */
h2{
text-align:center;
margin:10px;
color:#1d3557;
}

/* PLAYER */
#player{
position:absolute;
bottom:20px;
left:40px;
width:90px;
z-index:10;
}

/* BALLOON */
.balloon{
position:absolute;
width:70px;
height:90px;
cursor:pointer;
z-index:5;
transition:transform 0.2s;
filter: drop-shadow(0 8px 10px rgba(0,0,0,0.25));
}

.balloon.pop{
transform:scale(0);
opacity:0;
}

/* QUESTION */
#questionBox{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:25px;
border-radius:15px;
width:90%;
max-width:450px;
text-align:center;
z-index:50;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

#questionText{
font-size:20px;
font-weight:bold;
margin-bottom:15px;
}

#optionsContainer{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button{
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
background:#f1f1f1;
cursor:pointer;
}

button:hover{
background:#dbeafe;
}

/* FEEDBACK */
#feedback{
margin-top:10px;
font-weight:bold;
}

/* SCORE */
#scoreBoard{
position:absolute;
top:10px;
right:10px;
background:white;
padding:8px 15px;
border-radius:10px;
z-index:20;
}

/* TREASURE */
#treasure{
position:absolute;
bottom:20px;
left:50%;
width:120px;
transform:translateX(-50%);
display:none;
}

/* RESTART */
#restartBtn{
display:none;
position:absolute;
left:50%;
transform:translateX(-50%);
top:70%;
padding:12px 25px;
border:none;
border-radius:10px;
background:#1d3557;
color:white;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
<img src="assets/innovine-logo.png" width="220">
</div>

<!-- GAME -->
<div id="gameContainer">

<h2>🎈 Adverbs Balloon Treasure Adventure 🎈</h2>

<div id="scoreBoard">Score: 0</div>

<img id="player" src="assets/player.png">

<div id="balloonArea"></div>

<div id="questionBox">
<div id="questionText"></div>
<div id="optionsContainer"></div>
<div id="feedback"></div>
</div>

<img id="treasure" src="assets/treasure.png">
<button id="restartBtn">Restart</button>

</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

const questions=[
{q:"You run from monkeys. How do you run?",options:["quickly","slowly","yesterday","there"],answer:"quickly"},
{q:"You shout in mountain. How?",options:["loudly","softly","often","very"],answer:"loudly"},
{q:"You sneak past dragon. How?",options:["quietly","yesterday","there","now"],answer:"quietly"},
{q:"You celebrate victory. How?",options:["joyfully","slowly","there","very"],answer:"joyfully"},
{q:"You solve puzzle. How?",options:["cleverly","loudly","yesterday","there"],answer:"cleverly"}
];

let currentQ=0;
let score=0;

const gameContainer=document.getElementById("gameContainer");
const balloonArea=document.getElementById("balloonArea");
const questionBox=document.getElementById("questionBox");
const questionText=document.getElementById("questionText");
const optionsContainer=document.getElementById("optionsContainer");
const feedback=document.getElementById("feedback");
const scoreBoard=document.getElementById("scoreBoard");

const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
gameContainer.style.display="block";
spawnBalloon();
},5000);

function spawnBalloon(){
if(currentQ>=questions.length){
endGame();
return;
}

balloonArea.innerHTML="";

const b=document.createElement("img");
b.src="assets/balloon.png";
b.className="balloon";

b.style.left=Math.random()*80+"%";
b.style.bottom="0px";

balloonArea.appendChild(b);

let pos=0;

const move=setInterval(()=>{
pos+=2;
b.style.bottom=pos+"px";

if(pos>window.innerHeight){
clearInterval(move);
spawnBalloon();
}
},20);

b.onclick=()=>{
showQ(b,move);
};
}

function showQ(balloon,move){
clearInterval(move);

const q=questions[currentQ];

questionText.innerText=q.q;
optionsContainer.innerHTML="";
feedback.innerText="";

q.options.forEach(o=>{
const btn=document.createElement("button");
btn.innerText=o;
btn.onclick=()=>check(o,balloon);
optionsContainer.appendChild(btn);
});

questionBox.style.display="block";
}

function check(ans,balloon){
const q=questions[currentQ];

if(ans===q.answer){

score++;
scoreBoard.innerText="Score: "+score;

feedback.innerText="Correct 🎉";
feedback.style.color="green";

correctSound.play();

balloon.classList.add("pop");

setTimeout(()=>{
balloon.remove();
questionBox.style.display="none";
currentQ++;
spawnBalloon();
},300);

}else{
feedback.innerText="Try again!";
feedback.style.color="red";
wrongSound.play();
}
}

function endGame(){
questionBox.style.display="none";
document.getElementById("treasure").style.display="block";
document.getElementById("restartBtn").style.display="block";
clapSound.play();
}

document.getElementById("restartBtn").onclick=()=>{
location.reload();
};

</script>

</body>
</html>
