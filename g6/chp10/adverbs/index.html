<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adverbs Treasure Hunt Game</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  overflow: hidden;
  background: linear-gradient(#cfefff, #e9f7ff);
}

/* LOGO SCREEN */
#logoScreen {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

/* GAME AREA */
#gameContainer {
  display: none;
  width: 100%;
  height: 100vh;
  position: relative;
  overflow: hidden;
}

/* TITLE */
h2 {
  text-align: center;
  margin: 12px;
  font-size: 26px;
  color: #1d3557;
  text-shadow: 1px 1px 0 #fff;
}

/* PLAYER */
#player {
  position: absolute;
  bottom: 20px;
  left: 40px;
  width: 90px;
  height: auto;
  z-index: 10;
}

/* COIN */
.coin {
  position: absolute;
  width: 70px;
  height: 70px;
  z-index: 5;
  cursor: pointer;
  filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
}

/* QUESTION BOX */
#questionBox {
  display: none;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: #ffffff;
  padding: 25px;
  border-radius: 16px;
  text-align: center;
  width: 90%;
  max-width: 450px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  z-index: 50;
}

/* QUESTION TEXT */
#questionText {
  font-size: 20px;
  margin-bottom: 15px;
  font-weight: bold;
  color: #222;
}

/* OPTIONS GRID */
#optionsContainer {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

#questionBox button {
  padding: 12px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #f1f1f1;
  transition: 0.2s;
}

#questionBox button:hover {
  background: #dbeafe;
}

/* FEEDBACK */
#feedback {
  margin-top: 10px;
  font-weight: bold;
}

/* RESTART */
#restartBtn {
  display: none;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 70%;
  padding: 12px 25px;
  font-size: 18px;
  cursor: pointer;
  border-radius: 10px;
  border: none;
  background: #1d3557;
  color: white;
}

/* TREASURE */
#treasure {
  position: absolute;
  bottom: 20px;
  left: 50%;
  width: 120px;
  transform: translateX(-50%);
  display: none;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" width="220">
</div>

<!-- GAME -->
<div id="gameContainer">

  <h2>🎯 Adverbs Treasure Hunt Adventure 🎯</h2>

  <img id="player" src="assets/player.png">

  <div id="coinsArea"></div>

  <div id="questionBox">
    <div id="questionText"></div>
    <div id="optionsContainer"></div>
    <div id="feedback"></div>
  </div>

  <img id="treasure" src="assets/treasure.png">
  <button id="restartBtn">Restart Adventure</button>

</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

// QUESTIONS
const questions = [
  {q:"You’re running from mischievous monkeys. How do you run?", options:["quickly","slowly","yesterday","there"], answer:"quickly"},
  {q:"You shout across the mountain. How?", options:["loudly","carefully","softly","very"], answer:"loudly"},
  {q:"Tiptoe past a sleeping dragon. How?", options:["quietly","yesterday","everywhere","often"], answer:"quietly"},
  {q:"Flashlight flickers in cave. When do you turn it on?", options:["immediately","cleverly","very","tomorrow"], answer:"immediately"},
  {q:"Dance at festival. How?", options:["gracefully","there","sometimes","very"], answer:"gracefully"},
];

let currentQ = 0;

// ELEMENTS
const gameContainer = document.getElementById('gameContainer');
const coinsArea = document.getElementById('coinsArea');
const questionBox = document.getElementById('questionBox');
const questionText = document.getElementById('questionText');
const optionsContainer = document.getElementById('optionsContainer');
const feedback = document.getElementById('feedback');
const restartBtn = document.getElementById('restartBtn');
const treasure = document.getElementById('treasure');

const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');

// START AFTER LOGO
setTimeout(()=>{
  document.getElementById('logoScreen').style.display='none';
  gameContainer.style.display='block';
  spawnCoin();
},5000);

// SPAWN COIN
function spawnCoin(){
  if(currentQ >= questions.length){
    endGame();
    return;
  }

  coinsArea.innerHTML = '';

  const coin = document.createElement('img');
  coin.src = 'assets/coin.png';
  coin.className = 'coin';

  coin.style.left = Math.random()*70 + "%";
  coin.style.bottom = "80px";

  coinsArea.appendChild(coin);

  let pos = 80;

  const id = setInterval(()=>{
    pos += 2;
    coin.style.bottom = pos + "px";

    if(pos > 450){
      clearInterval(id);
      spawnCoin();
    }
  }, 20);

  coin.onclick = ()=>{
    showQuestion(currentQ, coin, id);
  };
}

// QUESTION
function showQuestion(index, coin, intervalId){
  clearInterval(intervalId);

  const q = questions[index];
  questionText.textContent = q.q;
  optionsContainer.innerHTML = '';
  feedback.textContent = '';

  q.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.onclick = ()=>checkAnswer(opt, coin);
    optionsContainer.appendChild(btn);
  });

  questionBox.style.display='block';
}

// CHECK
function checkAnswer(ans, coin){
  const q = questions[currentQ];

  if(ans === q.answer){
    feedback.textContent = "Correct! 🎉";
    feedback.style.color = "green";

    correctSound.play();

    questionBox.style.display='none';
    coin.remove();

    currentQ++;
    spawnCoin();
  } else {
    feedback.textContent = "Try again!";
    feedback.style.color = "red";
    wrongSound.play();
  }
}

// END
function endGame(){
  questionBox.style.display='none';
  treasure.style.display='block';
  clapSound.play();
  restartBtn.style.display='block';
}

// RESTART
restartBtn.onclick = ()=>{
  currentQ = 0;
  restartBtn.style.display='none';
  treasure.style.display='none';
  spawnCoin();
};

</script>

</body>
</html>
