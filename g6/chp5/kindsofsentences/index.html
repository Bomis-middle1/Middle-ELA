

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍿 Popcorn Catch Cinema</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:black;
}

/* GAME AREA */

#gameArea{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:
linear-gradient(to bottom,#0d1b2a,#1b263b,#415a77);
}

/* LOGO */

#logoScreen{
position:absolute;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

#logoScreen img{
width:260px;
max-width:80%;
}

#logoText{
margin-top:20px;
font-size:32px;
font-weight:bold;
color:#333;
}

/* START & END */

#startScreen,
#endScreen{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
color:white;
padding:20px;
z-index:5000;
}

.mainBtn{
padding:16px 34px;
font-size:22px;
border:none;
border-radius:18px;
background:#ff9800;
color:white;
cursor:pointer;
margin-top:25px;
}

.mainBtn:hover{
background:#f57c00;
}

/* CINEMA */

#screen{
position:absolute;
top:40px;
left:50%;
transform:translateX(-50%);
width:80%;
height:120px;
background:#eeeeee;
border:10px solid #444;
border-radius:20px;
box-shadow:0 0 20px rgba(255,255,255,0.4);
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
font-weight:bold;
color:#222;
}

/* PLAYER */

#bucket{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
font-size:75px;
transition:left 0.08s linear;
}

/* FALLING ITEMS */

.item{
position:absolute;
font-size:45px;
animation:spin 3s linear infinite;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

/* SCORE */

#scoreBoard{
position:absolute;
top:15px;
left:15px;
background:white;
padding:12px 18px;
border-radius:15px;
font-size:20px;
font-weight:bold;
z-index:100;
}

/* VOLUME */

#volumeBox{
position:absolute;
top:15px;
right:15px;
background:white;
padding:12px;
border-radius:15px;
z-index:100;
}

/* QUESTION BOX */

#questionBox{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:92%;
max-width:650px;
background:#fff8e1;
padding:28px;
border-radius:25px;
display:none;
z-index:4000;
box-shadow:0 0 25px rgba(0,0,0,0.5);
animation:popIn 0.5s;
}

#questionTitle{
font-size:30px;
color:#e65100;
margin-bottom:18px;
text-align:center;
}

#questionText{
font-size:24px;
line-height:1.5;
margin-bottom:20px;
color:#333;
}

.optionBtn{
width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:15px;
background:#4caf50;
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

.optionBtn:hover{
background:#388e3c;
transform:scale(1.02);
}

/* FEEDBACK */

#feedback{
text-align:center;
font-size:30px;
font-weight:bold;
margin-top:18px;
}

.correct{
color:green;
animation:zoom 0.5s;
}

.wrong{
color:red;
animation:shake 0.5s;
}

/* CONFETTI */

.confetti{
position:absolute;
width:12px;
height:12px;
animation:fall 3s linear forwards;
}

@keyframes fall{
from{
transform:translateY(-100px) rotate(0deg);
}
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

@keyframes zoom{
0%{transform:scale(0.5);}
100%{transform:scale(1.2);}
}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-10px);}
50%{transform:translateX(10px);}
75%{transform:translateX(-10px);}
100%{transform:translateX(0);}
}

@keyframes popIn{
from{
transform:translate(-50%,-50%) scale(0.5);
opacity:0;
}
to{
transform:translate(-50%,-50%) scale(1);
opacity:1;
}
}

/* MOBILE */

@media(max-width:768px){

#bucket{
font-size:60px;
}

.item{
font-size:38px;
}

#questionText{
font-size:19px;
}

.optionBtn{
font-size:16px;
}

#screen{
font-size:24px;
height:100px;
}

}

</style>
</head>

<body>

<div id="gameArea">

<!-- LOGO -->

<div id="logoScreen">
<img src="assets/innovine-logo.png">
<div id="logoText">Innovine Learning Adventures</div>
</div>

<!-- START -->

<div id="startScreen" style="display:none;">

<h1 style="font-size:52px;">🍿 Popcorn Catch Cinema</h1>

<p style="margin-top:20px;font-size:24px;max-width:700px;">
Catch movie snacks and unlock hilarious movie sentence scenes!
</p>

<button class="mainBtn" onclick="startGame()">
Start Movie Night
</button>

</div>

<!-- END -->

<div id="endScreen" style="display:none;">

<h1>🏆 Movie Night Complete! 🏆</h1>

<h2 id="finalText" style="margin-top:20px;"></h2>

<button class="mainBtn" onclick="restartGame()">
Play Again
</button>

</div>

<!-- CINEMA SCREEN -->

<div id="screen">
🎬 Catch the Snacks!
</div>

<!-- SCORE -->

<div id="scoreBoard">
Snacks: <span id="snackCount">0</span> |
Questions: <span id="questionCount">0</span>/10
</div>

<!-- VOLUME -->

<div id="volumeBox">
Volume
<input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
</div>

<!-- PLAYER -->

<div id="bucket">🍿</div>

<!-- QUESTIONS -->

<div id="questionBox">

<div id="questionTitle">
🎬 Movie Scene Challenge
</div>

<div id="questionText"></div>

<div id="options"></div>

<div id="feedback"></div>

</div>

</div>

<script>

/* LOGO */

setTimeout(()=>{

document.getElementById("logoScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";

},5000);

/* AUDIO */

const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/clapping.mp3");

const volumeSlider = document.getElementById("volumeSlider");

function updateVolume(){

correctSound.volume = volumeSlider.value;
wrongSound.volume = volumeSlider.value;
clapSound.volume = volumeSlider.value;

}

volumeSlider.addEventListener("input",updateVolume);

updateVolume();

/* GAME VARIABLES */

const bucket = document.getElementById("bucket");

let bucketX = window.innerWidth / 2;

let gameRunning = false;

let snacks = 0;
let currentQuestion = 0;

/* QUESTIONS */

const questions = [

{
q:`🦸 A superhero shouts:<br><br>
"Watch out for the falling helicopter!"<br><br>
What type of sentence is this?`,
o:["Declarative","Imperative","Interrogative","Exclamatory"],
a:1
},

{
q:`🍕 A chef screams:<br><br>
"My biggest pizza is ruined!"<br><br>
What type of sentence is this?`,
o:["Declarative","Imperative","Interrogative","Exclamatory"],
a:3
},

{
q:`👽 An alien asks:<br><br>
"Why is Earth food so spicy?"<br><br>
What type of sentence is this?`,
o:["Declarative","Imperative","Interrogative","Exclamatory"],
a:2
},

{
q:`🕵️ A detective says:<br><br>
"The missing diamond was hidden in the library."<br><br>
What type of sentence is this?`,
o:["Declarative","Imperative","Interrogative","Exclamatory"],
a:0
},

{
q:`⚽ A coach yells:<br><br>
"Pass the ball right now!"<br><br>
What type of sentence is this?`,
o:["Declarative","Imperative","Interrogative","Exclamatory"],
a:1
},

{
q:`🎢 A kid shouts:<br><br>
"This is the best ride ever!"<br><br>
What type of sentence is this?`,
o:["Declarative","Imperative","Interrogative","Exclamatory"],
a:3
},

{
q:`🚀 An astronaut asks:<br><br>
"Can you see the meteor shower from there?"<br><br>
What type of sentence is this?`,
o:["Declarative","Imperative","Interrogative","Exclamatory"],
a:2
},

{
q:`🧪 A scientist says:<br><br>
"The experiment begins after lunch."<br><br>
What type of sentence is this?`,
o:["Declarative","Imperative","Interrogative","Exclamatory"],
a:0
},

{
q:`🏴‍☠️ A pirate captain orders:<br><br>
"Lower the sails immediately!"<br><br>
What type of sentence is this?`,
o:["Declarative","Imperative","Interrogative","Exclamatory"],
a:1
},

{
q:`🎭 A student says:<br><br>
"Wow, everyone is clapping for us!"<br><br>
What type of sentence is this?`,
o:["Declarative","Imperative","Interrogative","Exclamatory"],
a:3
}

];

questions.sort(()=>Math.random()-0.5);

/* START */

function startGame(){

document.getElementById("startScreen").style.display="none";

gameRunning = true;

spawnItems();

}

/* MOVEMENT */

document.addEventListener("keydown",(e)=>{

if(e.key==="ArrowLeft"){

bucketX -= 40;

}

if(e.key==="ArrowRight"){

bucketX += 40;

}

limitBucket();

});

document.addEventListener("touchstart",(e)=>{

if(e.touches[0].clientX < window.innerWidth/2){

bucketX -= 45;

}else{

bucketX += 45;

}

limitBucket();

});

function limitBucket(){

if(bucketX < 40) bucketX = 40;

if(bucketX > window.innerWidth-40)
bucketX = window.innerWidth-40;

bucket.style.left = bucketX + "px";

}

/* ITEMS */

const snacksList = ["🍿","🥤","🍫","🍬"];

function spawnItems(){

if(!gameRunning) return;

const item = document.createElement("div");

item.classList.add("item");

item.innerHTML =
snacksList[Math.floor(Math.random()*snacksList.length)];

item.style.left =
Math.random()*(window.innerWidth-60)+"px";

item.style.top = "-60px";

document.getElementById("gameArea").appendChild(item);

let fall = setInterval(()=>{

let top = parseInt(item.style.top);

top += 4;

item.style.top = top + "px";

const i = item.getBoundingClientRect();
const b = bucket.getBoundingClientRect();

if(
i.left < b.right &&
i.right > b.left &&
i.top < b.bottom &&
i.bottom > b.top
){

snacks++;

document.getElementById("snackCount").innerText = snacks;

item.remove();

clearInterval(fall);

if(snacks % 4 === 0 && currentQuestion < 10){

showQuestion();

}

}

if(top > window.innerHeight){

item.remove();

clearInterval(fall);

}

},20);

setTimeout(spawnItems,1200);

}

/* QUESTIONS */

function showQuestion(){

gameRunning = false;

document.getElementById("questionBox").style.display="block";

const q = questions[currentQuestion];

document.getElementById("questionText").innerHTML = q.q;

const optionsDiv = document.getElementById("options");

optionsDiv.innerHTML = "";

document.getElementById("feedback").innerHTML = "";

q.o.forEach((option,index)=>{

const btn = document.createElement("button");

btn.classList.add("optionBtn");

btn.innerHTML = option;

btn.onclick = ()=>checkAnswer(index,q.a);

optionsDiv.appendChild(btn);

});

}

/* ANSWERS */

function checkAnswer(selected,correct){

const feedback = document.getElementById("feedback");

if(selected === correct){

feedback.innerHTML = "🎉 Correct!";
feedback.className = "correct";

correctSound.play();
clapSound.play();

createConfetti();

}else{

feedback.innerHTML = "❌ Wrong!";
feedback.className = "wrong";

wrongSound.play();

}

currentQuestion++;

document.getElementById("questionCount").innerText =
currentQuestion;

setTimeout(()=>{

document.getElementById("questionBox").style.display="none";

if(currentQuestion >= 10){

endGame();

}else{

gameRunning = true;

spawnItems();

}

},1800);

}

/* CONFETTI */

function createConfetti(){

for(let i=0;i<40;i++){

const conf = document.createElement("div");

conf.classList.add("confetti");

conf.style.left = Math.random()*100 + "%";

conf.style.background =
`hsl(${Math.random()*360},100%,50%)`;

conf.style.animationDuration =
(2 + Math.random()*2) + "s";

document.body.appendChild(conf);

setTimeout(()=>{

conf.remove();

},4000);

}

}

/* END */

function endGame(){

gameRunning = false;

document.getElementById("endScreen").style.display="flex";

document.getElementById("finalText").innerHTML =
"You collected <b>" + snacks +
"</b> movie snacks and completed all 10 sentence challenges!";

}

/* RESTART */

function restartGame(){

location.reload();

}

</script>

</body>
</html>
