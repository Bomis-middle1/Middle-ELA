
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Movie Scene Madness</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:#222;
}

/* GAME AREA */

#game{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
}

/* LOGO */

#logoScreen{
position:absolute;
width:100%;
height:100%;
background:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

#logoScreen img{
width:260px;
max-width:80%;
}

#logoText{
margin-top:20px;
font-size:32px;
font-weight:bold;
color:#333;
}

/* START SCREEN */

#startScreen,
#endScreen{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
z-index:5000;
}

.mainBtn{
padding:16px 34px;
font-size:22px;
border:none;
border-radius:18px;
background:#ff9800;
color:white;
cursor:pointer;
margin-top:25px;
}

.mainBtn:hover{
background:#f57c00;
}

/* SCENE */

#scene{
position:absolute;
width:100%;
height:100%;
transition:background 1s;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
}

/* CHARACTER */

#character{
font-size:110px;
animation:bounce 2s infinite;
}

/* SPEECH BUBBLE */

#speechBubble{
margin-top:20px;
background:white;
padding:25px;
border-radius:25px;
max-width:750px;
font-size:28px;
text-align:center;
position:relative;
box-shadow:0 0 20px rgba(0,0,0,0.3);
animation:popIn 0.5s;
}

#speechBubble::after{
content:"";
position:absolute;
bottom:-20px;
left:50%;
transform:translateX(-50%);
border-width:20px;
border-style:solid;
border-color:white transparent transparent transparent;
}

/* OPTIONS */

#options{
position:absolute;
bottom:30px;
width:95%;
max-width:900px;
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.optionBtn{
padding:18px;
border:none;
border-radius:18px;
font-size:20px;
cursor:pointer;
background:#4caf50;
color:white;
transition:0.3s;
}

.optionBtn:hover{
transform:scale(1.05);
background:#388e3c;
}

/* SCORE */

#scoreBoard{
position:absolute;
top:15px;
left:15px;
background:white;
padding:12px 18px;
border-radius:15px;
font-size:20px;
font-weight:bold;
z-index:100;
}

/* VOLUME */

#volumeBox{
position:absolute;
top:15px;
right:15px;
background:white;
padding:10px 15px;
border-radius:15px;
z-index:100;
}

/* FEEDBACK */

#feedback{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:70px;
font-weight:bold;
display:none;
z-index:2000;
}

.correct{
color:#00e676;
animation:zoom 0.6s;
}

.wrong{
color:#ff1744;
animation:shake 0.5s;
}

/* CONFETTI */

.confetti{
position:absolute;
width:12px;
height:12px;
animation:fall 3s linear forwards;
}

/* ANIMATIONS */

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-15px);}
}

@keyframes popIn{
from{
transform:scale(0.5);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

@keyframes zoom{
0%{transform:translate(-50%,-50%) scale(0.5);}
100%{transform:translate(-50%,-50%) scale(1.2);}
}

@keyframes shake{
0%{transform:translate(-50%,-50%) translateX(0);}
25%{transform:translate(-50%,-50%) translateX(-10px);}
50%{transform:translate(-50%,-50%) translateX(10px);}
75%{transform:translate(-50%,-50%) translateX(-10px);}
100%{transform:translate(-50%,-50%) translateX(0);}
}

@keyframes fall{
from{
transform:translateY(-100px) rotate(0deg);
}
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

/* MOBILE */

@media(max-width:768px){

#character{
font-size:75px;
}

#speechBubble{
font-size:20px;
padding:18px;
}

.optionBtn{
font-size:16px;
padding:14px;
}

#options{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div id="game">

<!-- LOGO -->

<div id="logoScreen">
<img src="assets/innovine-logo.png">
<div id="logoText">Innovine Learning Adventures</div>
</div>

<!-- START -->

<div id="startScreen" style="display:none;">

<h1 style="font-size:50px;">🎬 Movie Scene Madness</h1>

<p style="margin-top:20px;font-size:24px;max-width:700px;">
Watch hilarious movie scenes and identify the type of sentence each character says!
</p>

<button class="mainBtn" onclick="startGame()">
Start Movie
</button>

</div>

<!-- END -->

<div id="endScreen" style="display:none;">

<h1>🏆 Movie Complete! 🏆</h1>

<h2 id="finalScore" style="margin-top:20px;"></h2>

<button class="mainBtn" onclick="restartGame()">
Play Again
</button>

</div>

<!-- SCENE -->

<div id="scene">

<div id="scoreBoard">
Scene: <span id="sceneNumber">1</span>/10 |
Score: <span id="score">0</span>
</div>

<div id="volumeBox">
Volume
<input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
</div>

<div id="character"></div>

<div id="speechBubble"></div>

<div id="options"></div>

<div id="feedback"></div>

</div>

</div>

<script>

/* LOGO */

setTimeout(()=>{

document.getElementById("logoScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";

},5000);

/* AUDIO */

const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/clapping.mp3");

const volumeSlider = document.getElementById("volumeSlider");

function updateVolume(){

correctSound.volume = volumeSlider.value;
wrongSound.volume = volumeSlider.value;
clapSound.volume = volumeSlider.value;

}

volumeSlider.addEventListener("input",updateVolume);

updateVolume();

/* QUESTIONS */

const questions = [

{
bg:"#42a5f5",
char:"🦸",
text:`"Watch out for the falling helicopter!"`,
answer:"Imperative"
},

{
bg:"#ff7043",
char:"🍕",
text:`"My biggest pizza is ruined!"`,
answer:"Exclamatory"
},

{
bg:"#7e57c2",
char:"👽",
text:`"Why is Earth food so spicy?"`,
answer:"Interrogative"
},

{
bg:"#26a69a",
char:"🕵️",
text:`"The missing diamond was hidden in the library."`,
answer:"Declarative"
},

{
bg:"#66bb6a",
char:"⚽",
text:`"Pass the ball right now!"`,
answer:"Imperative"
},

{
bg:"#ec407a",
char:"🎢",
text:`"This is the best ride ever!"`,
answer:"Exclamatory"
},

{
bg:"#5c6bc0",
char:"🚀",
text:`"Can you see the meteor shower from there?"`,
answer:"Interrogative"
},

{
bg:"#8d6e63",
char:"🧪",
text:`"The experiment begins after lunch."`,
answer:"Declarative"
},

{
bg:"#ffa726",
char:"🏴‍☠️",
text:`"Lower the sails immediately!"`,
answer:"Imperative"
},

{
bg:"#ab47bc",
char:"🎭",
text:`"Wow, everyone is clapping for us!"`,
answer:"Exclamatory"
}

];

/* RANDOMIZE */

questions.sort(()=>Math.random()-0.5);

/* VARIABLES */

let current = 0;
let score = 0;

/* ELEMENTS */

const scene = document.getElementById("scene");
const character = document.getElementById("character");
const speechBubble = document.getElementById("speechBubble");
const optionsDiv = document.getElementById("options");
const feedback = document.getElementById("feedback");

const sceneNumber = document.getElementById("sceneNumber");
const scoreText = document.getElementById("score");

/* START */

function startGame(){

document.getElementById("startScreen").style.display="none";

loadQuestion();

}

/* LOAD QUESTION */

function loadQuestion(){

const q = questions[current];

scene.style.background = q.bg;

character.innerHTML = q.char;

speechBubble.innerHTML = q.text;

sceneNumber.innerText = current + 1;

optionsDiv.innerHTML = "";

const options = [
"Declarative",
"Imperative",
"Interrogative",
"Exclamatory"
];

options.sort(()=>Math.random()-0.5);

options.forEach(option=>{

const btn = document.createElement("button");

btn.classList.add("optionBtn");

btn.innerHTML = option;

btn.onclick = ()=>checkAnswer(option,q.answer);

optionsDiv.appendChild(btn);

});

}

/* CHECK */

function checkAnswer(selected,correct){

feedback.style.display = "block";

if(selected === correct){

score++;

scoreText.innerText = score;

feedback.innerHTML = "🎉 Correct!";
feedback.className = "correct";

correctSound.play();
clapSound.play();

createConfetti();

}else{

feedback.innerHTML = "❌ Wrong!";
feedback.className = "wrong";

wrongSound.play();

}

setTimeout(()=>{

feedback.style.display = "none";

current++;

if(current >= questions.length){

endGame();

}else{

loadQuestion();

}

},1800);

}

/* CONFETTI */

function createConfetti(){

for(let i=0;i<40;i++){

const conf = document.createElement("div");

conf.classList.add("confetti");

conf.style.left = Math.random()*100 + "%";

conf.style.top = "-20px";

conf.style.background =
`hsl(${Math.random()*360},100%,50%)`;

conf.style.animationDuration =
(2 + Math.random()*2) + "s";

document.body.appendChild(conf);

setTimeout(()=>{

conf.remove();

},4000);

}

}

/* END */

function endGame(){

document.getElementById("endScreen").style.display="flex";

document.getElementById("finalScore").innerHTML =
"You got <b>" + score + "/10</b> scenes correct!";

}

/* RESTART */

function restartGame(){

location.reload();

}

</script>

</body>
</html>
