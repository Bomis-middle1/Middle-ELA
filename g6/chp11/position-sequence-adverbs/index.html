
<!-- 
=========================================================
🚦 TRAFFIC COMMAND CENTER - GRADE 6 ELA GAME
TOPIC: POSITION & SEQUENCE OF ADVERBS
=========================================================

📁 REQUIRED FILE STRUCTURE:

project-folder/
│
├── index.html
│
└── assets/
    ├── innovine-logo.png
    ├── correct.mp3
    └── wrong.mp3

=========================================================
🌐 HOW TO RUN ON GITHUB PAGES
=========================================================

STEP 1:
Create a new folder on your computer.

STEP 2:
Save this file as:
index.html

STEP 3:
Create a folder named:
assets

STEP 4:
Place these files inside assets:
- innovine-logo.png
- correct.mp3
- wrong.mp3

STEP 5:
Go to:
https://github.com

STEP 6:
Create a NEW repository.

STEP 7:
Upload:
- index.html
- assets folder

STEP 8:
Go to:
Settings → Pages

STEP 9:
Under "Branch":
Select:
main

AND:
root

Click SAVE.

=========================================================

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🚦 Traffic Command Center</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:#87ceeb;
}

#gameArea{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:linear-gradient(to bottom,#64b5f6,#e3f2fd);
}

/* LOGO */

#logoScreen{
position:absolute;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

#logoScreen img{
width:260px;
max-width:80%;
}

#logoText{
margin-top:20px;
font-size:32px;
font-weight:bold;
color:#333;
}

/* START + END */

#startScreen,
#endScreen{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
color:white;
z-index:5000;
}

.mainBtn{
padding:16px 34px;
font-size:22px;
border:none;
border-radius:18px;
background:#ff9800;
color:white;
cursor:pointer;
margin-top:25px;
transition:0.3s;
}

.mainBtn:hover{
transform:scale(1.05);
}

/* TITLE */

#titleBox{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
width:92%;
background:white;
padding:15px;
border-radius:20px;
font-size:28px;
font-weight:bold;
text-align:center;
color:#0d47a1;
border:6px solid #ffca28;
z-index:100;
}

/* SCORE */

#scoreBoard{
position:absolute;
top:100px;
left:20px;
background:white;
padding:12px 18px;
border-radius:15px;
font-size:18px;
font-weight:bold;
z-index:200;
line-height:1.7;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

/* VOLUME */

#volumeBox{
position:absolute;
top:100px;
right:20px;
background:white;
padding:12px;
border-radius:15px;
z-index:200;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

/* CITY */

#cityArea{
position:absolute;
top:180px;
left:50%;
transform:translateX(-50%);
width:94%;
height:55%;
background:#b3e5fc;
border-radius:25px;
border:8px solid #1976d2;
overflow:hidden;
}

/* ROADS */

.roadH{
position:absolute;
top:50%;
left:0;
width:100%;
height:120px;
background:#424242;
transform:translateY(-50%);
}

.roadV{
position:absolute;
left:50%;
top:0;
width:120px;
height:100%;
background:#424242;
transform:translateX(-50%);
}

/* ROAD LINES */

.lineH{
position:absolute;
top:50%;
left:0;
width:100%;
height:8px;
background:repeating-linear-gradient(
to right,
white 0px,
white 30px,
transparent 30px,
transparent 60px
);
transform:translateY(-50%);
}

.lineV{
position:absolute;
left:50%;
top:0;
width:8px;
height:100%;
background:repeating-linear-gradient(
to bottom,
white 0px,
white 30px,
transparent 30px,
transparent 60px
);
transform:translateX(-50%);
}

/* TRAFFIC LIGHT */

#trafficLight{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:80px;
height:220px;
background:#212121;
border-radius:20px;
display:flex;
flex-direction:column;
justify-content:space-around;
align-items:center;
padding:10px;
z-index:100;
}

.light{
width:45px;
height:45px;
border-radius:50%;
background:#555;
}

.redActive{
background:red;
box-shadow:0 0 20px red;
}

.greenActive{
background:lime;
box-shadow:0 0 20px lime;
}

/* VEHICLES */

.vehicle{
position:absolute;
font-size:55px;
transition:3s linear;
z-index:50;
}

#car1{
top:46%;
left:-100px;
}

#car2{
left:47%;
top:-100px;
}

/* QUESTION */

#questionBox{
position:absolute;
bottom:15px;
left:50%;
transform:translateX(-50%);
width:94%;
max-width:850px;
background:#fff8e1;
padding:20px;
border-radius:25px;
z-index:1000;
box-shadow:0 0 20px rgba(0,0,0,0.4);
}

#questionText{
font-size:22px;
line-height:1.6;
margin-bottom:18px;
color:#333;
text-align:center;
}

.optionContainer{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.optionBtn{
padding:15px;
border:none;
border-radius:15px;
background:#4caf50;
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

.optionBtn:hover{
background:#388e3c;
transform:scale(1.03);
}

/* FEEDBACK */

#feedbackPopup{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:30px;
border-radius:25px;
width:90%;
max-width:650px;
display:none;
z-index:9999;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,0.5);
animation:popup 0.4s;
}

#feedbackTitle{
font-size:36px;
margin-bottom:15px;
font-weight:bold;
}

#feedbackText{
font-size:22px;
line-height:1.6;
color:#333;
}

/* CONFETTI */

.confetti{
position:absolute;
width:12px;
height:12px;
animation:fall 3s linear forwards;
}

@keyframes fall{
from{
transform:translateY(-100px) rotate(0deg);
}
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

@keyframes popup{
from{
transform:translate(-50%,-50%) scale(0.5);
opacity:0;
}
to{
transform:translate(-50%,-50%) scale(1);
opacity:1;
}
}

/* MOBILE */

@media(max-width:768px){

#titleBox{
font-size:18px;
}

#questionText{
font-size:17px;
}

.optionBtn{
font-size:15px;
padding:12px;
}

.vehicle{
font-size:40px;
}

#trafficLight{
width:60px;
height:180px;
}

.light{
width:35px;
height:35px;
}

#feedbackTitle{
font-size:28px;
}

#feedbackText{
font-size:18px;
}

}

</style>
</head>

<body>

<div id="gameArea">

<!-- LOGO -->

<div id="logoScreen">

<img src="assets/innovine-logo.png">

<div id="logoText">
Innovine Learning Adventures
</div>

</div>

<!-- START -->

<div id="startScreen" style="display:none;">

<h1 style="font-size:52px;">
🚦 Traffic Command Center
</h1>

<p style="margin-top:20px;font-size:24px;max-width:700px;">
Control city traffic by solving Position & Sequence of Adverbs challenges!
</p>

<button class="mainBtn"
onclick="startGame()">
Start Game
</button>

</div>

<!-- END -->

<div id="endScreen" style="display:none;">

<h1>🏆 City Traffic Restored! 🏆</h1>

<h2 id="finalText"
style="margin-top:20px; line-height:1.8;"></h2>

<button class="mainBtn"
onclick="restartGame()">
Play Again
</button>

</div>

<!-- TITLE -->

<div id="titleBox">
🚗 Answer Correctly To Keep Traffic Moving Safely!
</div>

<!-- SCORE -->

<div id="scoreBoard">
✅ Correct: <span id="correctScore">0</span><br>
❌ Wrong: <span id="wrongScore">0</span><br>
📘 Question: <span id="questionNumber">0</span>/10
</div>

<!-- VOLUME -->

<div id="volumeBox">
Volume
<input type="range"
id="volumeSlider"
min="0"
max="1"
step="0.1"
value="1">
</div>

<!-- CITY -->

<div id="cityArea">

<div class="roadH"></div>
<div class="roadV"></div>

<div class="lineH"></div>
<div class="lineV"></div>

<!-- TRAFFIC LIGHT -->

<div id="trafficLight">

<div id="redLight"
class="light"></div>

<div class="light"
style="background:#555;"></div>

<div id="greenLight"
class="light greenActive"></div>

</div>

<!-- VEHICLES -->

<div id="car1"
class="vehicle">
🚗
</div>

<div id="car2"
class="vehicle">
🚌
</div>

</div>

<!-- QUESTION -->

<div id="questionBox">

<div id="questionText"></div>

<div class="optionContainer"
id="options"></div>

</div>

<!-- FEEDBACK -->

<div id="feedbackPopup">

<div id="feedbackTitle"></div>

<div id="feedbackText"></div>

</div>

</div>

<script>

/* LOGO */

setTimeout(()=>{

document.getElementById("logoScreen")
.style.display="none";

document.getElementById("startScreen")
.style.display="flex";

},5000);

/* AUDIO */

const correctSound =
new Audio("assets/correct.mp3");

const wrongSound =
new Audio("assets/wrong.mp3");

const volumeSlider =
document.getElementById("volumeSlider");

function updateVolume(){

correctSound.volume =
volumeSlider.value;

wrongSound.volume =
volumeSlider.value;

}

volumeSlider.addEventListener(
"input",
updateVolume
);

updateVolume();

/* QUESTIONS */

const questions = [

{
q:`🚑 The ambulance reached the traffic signal. The cars moved aside. The ambulance crossed safely.<br><br>
Which sequence sounds BEST?`,
o:[
"First the ambulance crossed safely, then the cars moved aside.",
"First the cars moved aside, then the ambulance crossed safely.",
"Finally the ambulance reached the signal, then the cars moved aside.",
"The ambulance crossed first because finally the signal changed."
],
a:1,
e:"The cars must move aside before the ambulance can cross safely."
},

{
q:`🚗 Choose the BEST sentence.`,
o:[
"The car carefully turned the corner.",
"The car turned carefully the corner.",
"Carefully the corner turned the car.",
"The carefully car turned the corner."
],
a:0,
e:"The adverb 'carefully' is placed correctly before the verb phrase."
},

{
q:`🚌 Arrange the traffic events in the BEST order:<br><br>
1. The doors opened.<br>
2. The passengers entered.<br>
3. The bus arrived.`,
o:[
"2 → 1 → 3",
"3 → 1 → 2",
"1 → 2 → 3",
"3 → 2 → 1"
],
a:1,
e:"The bus arrives first, then doors open, then passengers enter."
},

{
q:`🚦 Which sentence has the WORST adverb placement?`,
o:[
"The traffic lights suddenly turned red.",
"Suddenly, the traffic lights turned red.",
"The traffic suddenly lights turned red.",
"The traffic lights turned red suddenly."
],
a:2,
e:"The adverb 'suddenly' is incorrectly placed inside the noun phrase."
},

{
q:`🚕 The taxi driver picked up the tourists. He loaded their bags. He drove to the airport.<br><br>
Which word BEST completes the sentence?<br><br>
“First the driver picked up the tourists. ______, he loaded their bags.”`,
o:[
"Loudly",
"Next",
"Yesterday",
"Carefully"
],
a:1,
e:"'Next' correctly shows the sequence of actions."
},

{
q:`🏍️ Which sentence sounds MOST natural?`,
o:[
"The biker quickly avoided the pothole.",
"The biker avoided quickly the pothole.",
"Quickly the pothole avoided the biker.",
"The quickly biker avoided the pothole."
],
a:0,
e:"The adverb is correctly placed before the verb phrase."
},

{
q:`🚚 Choose the BEST order for repairing the road.<br><br>
1. Traffic started moving again<br>
2. Workers placed warning signs<br>
3. Workers repaired the road`,
o:[
"1 → 2 → 3",
"2 → 3 → 1",
"3 → 1 → 2",
"2 → 1 → 3"
],
a:1,
e:"Warning signs come first, then repairs, then traffic resumes."
},

{
q:`🚓 Which sentence uses the adverb BEST?`,
o:[
"The police officer calmly guided traffic.",
"The police officer guided calmly traffic.",
"Calmly traffic guided the officer.",
"The calmly officer guided traffic."
],
a:0,
e:"The adverb 'calmly' is correctly placed before the verb phrase."
},

{
q:`🚦 First the bridge opened. Then traffic moved. Finally the traffic jam disappeared.<br><br>
What happened LAST?`,
o:[
"The bridge opened",
"Traffic moved",
"The traffic jam disappeared",
"Vehicles stopped"
],
a:2,
e:"The traffic jam disappearing was the final event."
},

{
q:`🚑 Choose the sentence with BOTH correct order and adverb placement.`,
o:[
"First the ambulance carefully crossed the busy road.",
"Carefully first crossed the ambulance the road.",
"The ambulance crossed carefully first the road.",
"First carefully the busy road crossed the ambulance."
],
a:0,
e:"Both the sequence word and adverb are placed correctly."
}

];

/* GAME VARIABLES */

let currentQuestion = 0;
let correct = 0;
let wrong = 0;

/* START */

function startGame(){

document.getElementById("startScreen")
.style.display="none";

loadQuestion();

animateTraffic();

}

/* LOAD QUESTION */

function loadQuestion(){

const q = questions[currentQuestion];

document.getElementById("questionText")
.innerHTML = q.q;

const options =
document.getElementById("options");

options.innerHTML = "";

q.o.forEach((option,index)=>{

const btn =
document.createElement("button");

btn.classList.add("optionBtn");

btn.innerHTML = option;

btn.onclick = ()=>checkAnswer(index);

options.appendChild(btn);

});

}

/* CHECK ANSWER */

function checkAnswer(selected){

const q = questions[currentQuestion];

const popup =
document.getElementById("feedbackPopup");

popup.style.display = "block";

if(selected === q.a){

correct++;

document.getElementById("correctScore")
.innerHTML = correct;

correctSound.play();

createConfetti();

document.getElementById("feedbackTitle")
.innerHTML = "✅ Correct!";

document.getElementById("feedbackTitle")
.style.color = "green";

document.getElementById("feedbackText")
.innerHTML = q.e;

document.getElementById("greenLight")
.classList.add("greenActive");

document.getElementById("redLight")
.classList.remove("redActive");

}else{

wrong++;

document.getElementById("wrongScore")
.innerHTML = wrong;

wrongSound.play();

document.getElementById("feedbackTitle")
.innerHTML = "❌ Traffic Jam!";

document.getElementById("feedbackTitle")
.style.color = "red";

document.getElementById("feedbackText")
.innerHTML =
`
Correct Answer:<br><br>
<b>${q.o[q.a]}</b><br><br>
${q.e}
`;

document.getElementById("redLight")
.classList.add("redActive");

document.getElementById("greenLight")
.classList.remove("greenActive");

}

document.getElementById("questionNumber")
.innerHTML = currentQuestion + 1;

setTimeout(()=>{

popup.style.display = "none";

currentQuestion++;

if(currentQuestion >= 10){

endGame();

}else{

loadQuestion();

}

},2500);

}

/* TRAFFIC */

function animateTraffic(){

setInterval(()=>{

const car1 =
document.getElementById("car1");

const car2 =
document.getElementById("car2");

car1.style.transition = "none";
car2.style.transition = "none";

car1.style.left = "-100px";
car2.style.top = "-100px";

setTimeout(()=>{

car1.style.transition = "3s linear";
car2.style.transition = "3s linear";

car1.style.left = "110%";
car2.style.top = "110%";

},100);

},3500);

}

/* CONFETTI */

function createConfetti(){

for(let i=0;i<40;i++){

const conf =
document.createElement("div");

conf.classList.add("confetti");

conf.style.left =
Math.random()*100 + "%";

conf.style.background =
`hsl(${Math.random()*360},100%,50%)`;

conf.style.animationDuration =
(2 + Math.random()*2)+"s";

document.body.appendChild(conf);

setTimeout(()=>{
conf.remove();
},4000);

}

}

/* END GAME */

function endGame(){

document.getElementById("endScreen")
.style.display = "flex";

let percentage =
Math.round((correct / 10) * 100);

let message = "";

if(correct === 10){

message =
"🌟 PERFECT! You controlled the city flawlessly!";

}else if(correct >= 8){

message =
"🚦 Amazing Traffic Controller Skills!";

}else if(correct >= 6){

message =
"🚗 Great Job Keeping The Roads Safe!";

}else{

message =
"🎉 Nice Effort! The city traffic is moving again!";
}

document.getElementById("finalText")
.innerHTML =
`
🏆 Correct Answers: ${correct}/10<br><br>

❌ Wrong Answers: ${wrong}<br><br>

⭐ Score Percentage: ${percentage}%<br><br>

${message}
`;

}

/* RESTART */

function restartGame(){

location.reload();

}

</script>

</body>
</html>
