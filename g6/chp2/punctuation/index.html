<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punctuation Pop NEW</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:linear-gradient(#b3e5ff,#e6f7ff);
}

/* ================= LOGO ================= */
#logoScreen{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
#logoScreen img{
width:220px;
}

/* ================= TITLE ================= */
#titleScreen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(#4fc3f7,#e1f5fe);
z-index:9998;
text-align:center;
}

#titleScreen h1{
font-size:50px;
color:#0d47a1;
animation:bounce 1.2s infinite;
}

@keyframes bounce{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

/* ================= START ================= */
#startScreen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:#e3f2fd;
z-index:9997;
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:10px;
background:#ffca28;
font-weight:bold;
cursor:pointer;
}

/* ================= GAME ================= */
#game{
display:none;
width:100%;
height:100vh;
position:relative;
overflow:hidden;
}

#question{
position:absolute;
top:80px;
width:100%;
text-align:center;
font-size:28px;
font-weight:bold;
color:#0d47a1;
padding:10px;
}

#score{
position:absolute;
top:10px;
left:10px;
font-size:20px;
font-weight:bold;
color:#0d47a1;
}

/* ================= BALLOON ================= */
.balloon{
position:absolute;
width:60px;
height:75px;
border-radius:50% 50% 45% 45%;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
font-weight:bold;
color:white;
cursor:pointer;
animation:floatUp 7s linear forwards;
}

@keyframes floatUp{
0%{transform:translateY(100vh);}
100%{transform:translateY(-120vh);}
}

.red{background:#ff5252;}
.blue{background:#42a5f5;}
.green{background:#66bb6a;}

</style>
</head>

<body>

<!-- ================= LOGO ================= -->
<div id="logoScreen">
<img src="G7/chp3/punctuation/assets/innovine-logo.png">
</div>

<!-- ================= TITLE ================= -->
<div id="titleScreen">
<h1>Punctuation Pop 🎈</h1>
<p>Tap the correct punctuation!</p>
</div>

<!-- ================= START ================= -->
<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<!-- ================= GAME ================= -->
<div id="game">
<div id="score">Score: 0</div>
<div id="question">Loading...</div>
</div>

<script>

/* ================= FLOW ================= */
setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("titleScreen").style.display="flex";
},5000);

setTimeout(()=>{
document.getElementById("titleScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";
},8000);

/* ================= QUESTIONS ================= */
const questions=[
{q:"I can’t believe it ___", a:["!","?","."], c:"!"},
{q:"Where are you going ___", a:[".","!","?"], c:"?"},
{q:"Wow this is amazing ___", a:[".","!","?"], c:"!"},
{q:"Are you coming ___", a:[".","!","?"], c:"?"},
{q:"The sun is bright ___", a:[".","!","?"], c:"."},
{q:"Please sit down ___", a:[".",":","!"], c:":"},
{q:"Stop right there ___", a:[".","!","?"], c:"!"},
{q:"Let’s go to the park ___", a:[".",",","!"], c:"."}
];

let i=0;
let score=0;
let currentAnswer="";

/* ================= START ================= */
function startGame(){
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";

i=0;
score=0;

loadQuestion();
spawnLoop();
}

/* ================= LOAD QUESTION ================= */
function loadQuestion(){

if(i>=questions.length){
document.getElementById("question").innerText=
"🎉 Game Over! Score: " + score;
return;
}

currentAnswer=questions[i].c;
document.getElementById("question").innerText=questions[i].q;
document.getElementById("score").innerText="Score: "+score;
}

/* ================= BALLOONS ================= */
const colors=["red","blue","green"];

function spawnBalloon(){

let q = questions[i];
if(!q) return;

let option = q.a[Math.floor(Math.random()*q.a.length)];

let b=document.createElement("div");
b.className="balloon "+colors[Math.floor(Math.random()*colors.length)];
b.innerText=option;

b.style.left=Math.random()*85+"vw";

b.onclick=()=>{

if(option===currentAnswer){
score+=10;
i++;
loadQuestion();
}

b.remove();
};

document.body.appendChild(b);

setTimeout(()=>b.remove(),6000);
}

/* ================= LOOP ================= */
function spawnLoop(){
setInterval(spawnBalloon,1400);
}

</script>

</body>
</html>
