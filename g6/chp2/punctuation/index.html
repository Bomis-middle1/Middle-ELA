<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punctuation Power Game FIXED</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#ffecd2,#fcb69f,#a1c4fd,#c2e9fb);
  overflow: hidden;
}

/* SPLASH */
#splash, #topicScreen, #startScreen {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: white;
  z-index: 9999;
  text-align: center;
}

#topicScreen { display: none; font-size: 28px; font-weight: bold; }
#startScreen { display: none; }

/* GAME */
#game {
  display: none;
  padding: 10px;
}

.header {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  font-weight: bold;
}

.container {
  display: flex;
  gap: 10px;
}

.left {
  width: 55%;
  background: rgba(255,255,255,0.6);
  border-radius: 12px;
  padding: 10px;
}

.sentence {
  background: #ffd166;
  padding: 10px;
  margin: 8px;
  border-radius: 10px;
  cursor: grab;
}

.right {
  width: 45%;
}

.bucket {
  background: rgba(255,255,255,0.6);
  border: 2px dashed #333;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 10px;
  min-height: 60px;
}

/* END */
#endScreen {
  display: none;
  position: fixed;
  inset: 0;
  background: white;
  z-index: 9999;
  text-align: center;
  padding: 20px;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  margin: 10px;
  cursor: pointer;
}

/* CONFETTI */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: 0;
  animation: fall 2s linear forwards;
}

@keyframes fall {
  to { transform: translateY(100vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- SPLASH (FIXED LOGO PATH) -->
<div id="splash">
  <img src="71824359-f243-48be-bf6f-db272e2d66a2.png" width="200">
</div>

<!-- TOPIC -->
<div id="topicScreen">
  🎉 PUNCTUATION POWER CHALLENGE 🎉
</div>

<!-- START -->
<div id="startScreen">
  <h2>Ready to Play?</h2>
  <button onclick="startGame()">START GAME</button>
</div>

<!-- GAME -->
<div id="game">

<div class="header">
  <div id="progress">0 / 15</div>
  <div>
    🔊 <input type="range" id="vol" min="0" max="1" step="0.1" value="1">
  </div>
</div>

<div class="container">

  <div class="left" id="list"></div>

  <div class="right">
    <div class="bucket" data="?" >?</div>
    <div class="bucket" data="!">!</div>
    <div class="bucket" data=".">.</div>
    <div class="bucket" data=",">,</div>
  </div>

</div>
</div>

<!-- END SCREEN -->
<div id="endScreen">
  <h1>🏆 Trophy Unlocked!</h1>
  <h2 id="scoreText"></h2>
  <p id="remark"></p>
  <button onclick="location.reload()">RESTART</button>
</div>

<!-- AUDIO (FIXED PATHS) -->
<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>
<audio id="clap" src="assets/clapping.mp3"></audio>

<script>

/* FIXED GRADE 6 SET */
const data = [
{t:"Where are you going",type:"?"},
{t:"What a beautiful day it is",type:"!"},
{t:"The students completed the assignment on time",type:"."},
{t:"After finishing homework he went out to play",type:","},

{t:"Why is the teacher absent today",type:"?"},
{t:"How amazing this performance was",type:"!"},
{t:"She is reading a novel in the library",type:"."},
{t:"Although it was late they continued studying",type:","},

{t:"Can you solve this puzzle",type:"?"},
{t:"What an incredible achievement",type:"!"},
{t:"The sun rises in the east",type:"."},
{t:"If you work hard you will succeed",type:","},

{t:"Did you complete your project",type:"?"},
{t:"That is absolutely fantastic",type:"!"},
{t:"He went to school early this morning",type:"."}
];

let correct=0;

function shuffle(){
  let box=document.getElementById("list");
  box.innerHTML="";

  data.forEach(d=>{
    let div=document.createElement("div");
    div.className="sentence";
    div.draggable=true;
    div.innerText=d.t;

    div.ondragstart=(e)=>{
      e.dataTransfer.setData("text",JSON.stringify(d));
    };

    box.appendChild(div);
  });
}

document.querySelectorAll(".bucket").forEach(b=>{
  b.ondragover=e=>e.preventDefault();

  b.ondrop=e=>{
    let d=JSON.parse(e.dataTransfer.getData("text"));

    let vol=document.getElementById("vol").value;

    correctSound.volume=vol;
    wrongSound.volume=vol;
    clapSound.volume=vol;

    if(d.type==b.dataset){
      correct++;
      correctSound.play();
      confetti();
    } else {
      wrongSound.play();
    }

    document.getElementById("progress").innerText=correct+"/15";

    data.splice(data.findIndex(x=>x.t===d.t),1);
    shuffle();

    if(correct===15){
      endGame();
    }
  };
});

/* SPLASH FLOW FIXED */
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
  document.getElementById("topicScreen").style.display="flex";

  setTimeout(()=>{
    document.getElementById("topicScreen").style.display="none";
    document.getElementById("startScreen").style.display="flex";
  },3000);

},5000);

/* START GAME */
function startGame(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("game").style.display="block";
  shuffle();
}

/* CONFETTI FIXED */
function confetti(){
  for(let i=0;i<25;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["red","blue","yellow","green"][Math.random()*4|0];
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}

/* END SCREEN WITH TROPHY */
function endGame(){
  document.getElementById("game").style.display="none";
  document.getElementById("endScreen").style.display="block";

  let percent=100;

  document.getElementById("scoreText").innerText=
    "Score: "+correct+"/15";

  document.getElementById("remark").innerText=
    "Excellent Performance 🎉 You reached the Trophy Zone!";
}

</script>

</body>
</html>
