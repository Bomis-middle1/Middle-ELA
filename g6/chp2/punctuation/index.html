<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Punctuation Power Game</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Fredoka', cursive, sans-serif;
}

body {
  background: #2b1055;
  background-image: radial-gradient(#451e7a 15%, transparent 16%), radial-gradient(#331263 15%, transparent 16%);
  background-size: 30px 30px;
  height: 100dvh;
  width: 100vw;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* OVERLAY SCREENS */
#splash, #topicScreen, #startScreen, #endScreen {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: #1e0b36;
  color: white;
  z-index: 9999;
  text-align: center;
  padding: 16px;
}

#topicScreen { display: none; font-size: 26px; font-weight: bold; color: #ffe600; text-shadow: 0 4px #ff5252; }
#startScreen { display: none; }
#endScreen { display: none; }

.game-title {
  font-size: 26px;
  color: #ff007f;
  text-shadow: 3px 3px 0px #00ffff, 5px 5px 0px #000;
  margin-bottom: 12px;
}

.instruction-card {
  background: rgba(255, 255, 255, 0.1);
  border: 3px solid #00ffff;
  box-shadow: 0 0 15px #00ffff;
  border-radius: 16px;
  padding: 16px;
  width: 100%;
  max-width: 380px;
  margin-bottom: 20px;
}

.instruction-card h3 {
  color: #ffe600;
  font-size: 18px;
  margin-bottom: 8px;
}

.instruction-card p {
  font-size: 14px;
  line-height: 1.4;
  color: #e0e0e0;
}

/* GAMEPLAY DASHBOARD */
#game {
  display: none;
  height: 100dvh;
  width: 100vw;
  padding: 8px;
  flex-direction: column;
  max-width: 600px;
  margin: 0 auto;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 14px;
  background: #391475;
  border: 3px solid #ff007f;
  border-radius: 12px;
  color: #ffe600;
  font-weight: bold;
  font-size: 14px;
  box-shadow: 0 4px 0 #1e0b36;
  flex-shrink: 0;
}

.container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
  margin-top: 8px;
  min-height: 0;
}

/* CARD PLAY AREA */
.left {
  height: 30%;
  min-height: 90px;
  background: rgba(0, 0, 0, 0.3);
  border: 3px dashed #00ffff;
  border-radius: 16px;
  padding: 10px;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

.sentence {
  background: linear-gradient(180deg, #ffe600, #ffb703);
  color: #2b1055;
  border: 3px solid #ffffff;
  padding: 14px;
  border-radius: 14px;
  cursor: grab;
  font-weight: bold;
  font-size: 16px;
  text-align: center;
  width: 100%;
  box-shadow: 0 6px 0 #b38000, 0 10px 15px rgba(0,0,0,0.5);
  animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.sentence.selected {
  border-color: #00ffff;
  box-shadow: 0 0 15px #00ffff, 0 6px 0 #b38000;
  transform: translateY(-2px);
}

/* TARGET BUCKETS GRID */
.right {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 10px;
}

.bucket {
  background: #391475;
  border: 3px solid #a100ff;
  border-radius: 14px;
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #ffffff;
  cursor: pointer;
  box-shadow: 0 5px 0 #1e0b36;
  transition: transform 0.1s, background 0.2s, border-color 0.2s;
  text-align: center;
}

.bucket span:first-child {
  font-size: 13px;
  color: #00ffff;
  text-transform: uppercase;
}

.bucket span:last-child {
  font-size: 26px;
  color: #ffe600;
  text-shadow: 2px 2px 0 #000;
}

.bucket:active, .bucket-hover {
  background: #531ca8;
  border-color: #00ffff;
  transform: scale(0.98);
}

/* BUTTONS & ANIMATIONS */
.btn-play {
  padding: 12px 32px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(180deg, #ff007f, #b30059);
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 0 #660033, 0 10px 20px rgba(0,0,0,0.4);
}

.btn-play:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #660033;
}

/* FLOATING SCORE POPUP */
.floating-text {
  position: absolute;
  font-size: 20px;
  font-weight: bold;
  animation: floatUp 0.8s forwards;
  pointer-events: none;
  z-index: 100;
}

@keyframes popIn {
  from { transform: scale(0.5); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}

.shake { animation: shake 0.3s; }
</style>
</head>

<body>

<!-- SPLASH LOGO -->
<div id="splash">
  <img src="assets/innovine-logo.png" width="160" alt="Innovine Logo" onerror="this.style.display='none'">
</div>

<!-- TOPIC SCREEN -->
<div id="topicScreen">
  ⚡ PUNCTUATION DASH ⚡
</div>

<!-- START SCREEN -->
<div id="startScreen">
  <h1 class="game-title">PUNCTUATION POWER</h1>
  
  <div class="instruction-card">
    <h3>🎮 MISSION INSTRUCTIONS</h3>
    <p><strong>Drag</strong> the sentence card or <strong>tap to select</strong> it, then drop it into its matching <strong>Punctuation Portal</strong>!</p>
  </div>

  <button class="btn-play" onclick="startGame()">START GAME</button>
</div>

<!-- GAME BOARD -->
<div id="game">
  <div class="header">
    <div id="progress">STAGE: 1 / 15</div>
    <div id="scoreDisplay">SCORE: 0</div>
  </div>

  <div class="container">
    <div class="left" id="list"></div>

    <div class="right">
      <div class="bucket" data-type="?" onclick="handleBucketClick('?')"><span>Question</span><span>?</span></div>
      <div class="bucket" data-type="!" onclick="handleBucketClick('!')"><span>Exclamation</span><span>!</span></div>
      <div class="bucket" data-type="." onclick="handleBucketClick('.')"><span>Full Stop</span><span>.</span></div>
      <div class="bucket" data-type="," onclick="handleBucketClick(',')"><span>Comma Clause</span><span>,</span></div>
    </div>
  </div>
</div>

<!-- END GAME SCREEN -->
<div id="endScreen">
  <h1 style="color: #ffe600; text-shadow: 3px 3px #ff007f;">🏆 MISSION COMPLETE!</h1>
  <h2 id="scoreText" style="margin: 14px 0; color: #00ffff;"></h2>
  <p id="remark" style="margin-bottom: 24px; color: #ddd;"></p>
  <button class="btn-play" onclick="location.reload()">PLAY AGAIN</button>
</div>

<script>
const data = [
  {t: "Where are you going", type: "?"},
  {t: "What a beautiful day it is", type: "!"},
  {t: "The students completed the assignment on time", type: "."},
  {t: "After finishing homework he went out to play", type: ","},
  {t: "Why is the teacher absent today", type: "?"},
  {t: "How amazing this performance was", type: "!"},
  {t: "She is reading a novel in the library", type: "."},
  {t: "Although it was late they continued studying", type: ","},
  {t: "Can you solve this puzzle", type: "?"},
  {t: "What an incredible achievement", type: "!"},
  {t: "The sun rises in the east", type: "."},
  {t: "If you work hard you will succeed", type: ","},
  {t: "Did you complete your project", type: "?"},
  {t: "That is absolutely fantastic", type: "!"},
  {t: "When the bell rang the students left", type: ","}
];

let score = 0;
let streak = 0;
let currentStage = 0;
let totalQuestions = data.length;
let selectedItem = null;

// SYNTHESIZED GAME AUDIO (No heavy files to load)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playAudioFX(type) {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'correct') {
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } else {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }
}

// SPLASH TIMERS
setTimeout(() => {
  document.getElementById("splash").style.display = "none";
  document.getElementById("topicScreen").style.display = "flex";

  setTimeout(() => {
    document.getElementById("topicScreen").style.display = "none";
    document.getElementById("startScreen").style.display = "flex";
  }, 1200);
}, 3000);

function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function startGame() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("game").style.display = "flex";
  shuffleArray(data);
  renderQuestion();
}

function renderQuestion() {
  let box = document.getElementById("list");
  box.innerHTML = "";
  selectedItem = null;

  if (data.length === 0) return;

  currentStage++;
  document.getElementById("progress").innerText = `STAGE: ${currentStage} / ${totalQuestions}`;

  let item = data[0];
  let div = document.createElement("div");
  div.className = "sentence";
  div.draggable = true;
  div.innerText = item.t;

  div.onclick = () => {
    div.classList.toggle("selected");
    selectedItem = div.classList.contains("selected") ? item : null;
  };

  div.ondragstart = (e) => {
    e.dataTransfer.setData("text/plain", JSON.stringify(item));
  };

  box.appendChild(div);
}

// BUCKET DRAG / DROP LISTENERS
document.querySelectorAll(".bucket").forEach(bucket => {
  bucket.ondragover = (e) => {
    e.preventDefault();
    bucket.classList.add("bucket-hover");
  };

  bucket.ondragleave = () => bucket.classList.remove("bucket-hover");

  bucket.ondrop = (e) => {
    e.preventDefault();
    bucket.classList.remove("bucket-hover");
    try {
      let droppedData = JSON.parse(e.dataTransfer.getData("text/plain"));
      let targetType = bucket.getAttribute("data-type");
      processAnswer(droppedData, targetType, bucket);
    } catch(err) {}
  };
});

function handleBucketClick(targetType) {
  if (selectedItem) {
    const bucketEl = document.querySelector(`.bucket[data-type="${targetType}"]`);
    processAnswer(selectedItem, targetType, bucketEl);
  }
}

function processAnswer(itemData, targetType, bucketEl) {
  if (itemData.type === targetType) {
    streak++;
    let addedPoints = 100 * streak;
    score += addedPoints;
    playAudioFX('correct');
    showFloatingText(`+${addedPoints}!`, "#00ffff", bucketEl);
  } else {
    streak = 0;
    playAudioFX('wrong');
    showFloatingText("MISS!", "#ff0055", bucketEl);
    document.getElementById("game").classList.add("shake");
    setTimeout(() => document.getElementById("game").classList.remove("shake"), 300);
  }

  document.getElementById("scoreDisplay").innerText = `SCORE: ${score}`;
  data.shift();

  if (data.length === 0) {
    endGame();
  } else {
    renderQuestion();
  }
}

function showFloatingText(txt, color, target) {
  const el = document.createElement("div");
  el.className = "floating-text";
  el.innerText = txt;
  el.style.color = color;
  const rect = target.getBoundingClientRect();
  el.style.left = `${rect.left + rect.width / 4}px`;
  el.style.top = `${rect.top}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function endGame() {
  document.getElementById("game").style.display = "none";
  document.getElementById("endScreen").style.display = "flex";

  document.getElementById("scoreText").innerText = `FINAL SCORE: ${score}`;
  document.getElementById("remark").innerText = score >= 1000 ? "🌟 LEGENDARY PUNCTUATION MASTER!" : "👍 GREAT JOB! KEEP PRACTICING!";
}
</script>

</body>
</html>
