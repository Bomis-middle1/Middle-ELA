<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Space Sentence Rescue</title>

<!-- PRELOAD AUDIO -->
<link rel="preload" href="assets/correct.mp3" as="audio">
<link rel="preload" href="assets/wrong.mp3" as="audio">
<link rel="preload" href="assets/clapping.mp3" as="audio">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(to bottom,#021B79,#0575E6);
    min-height:100vh;
    overflow-x:hidden;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

/* SPLASH SCREEN */

.splash-screen{
    position:fixed;
    inset:0;
    background:linear-gradient(to bottom,#021B79,#0575E6);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:99999;
}

.splash-logo{
    width:240px;
    animation:floatLogo 2s infinite alternate;
}

@keyframes floatLogo{
    from{
        transform:translateY(0px);
    }
    to{
        transform:translateY(-10px);
    }
}

.splash-text{
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
    color:#FFD54F;
}

/* START SCREEN */

.start-screen{
    position:fixed;
    inset:0;
    background:linear-gradient(to bottom,#021B79,#0575E6);
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:9999;
    padding:20px;
}

.start-screen h1{
    font-size:38px;
    margin-bottom:20px;
    color:#FFD54F;
}

.start-text{
    max-width:500px;
    font-size:20px;
    margin-bottom:30px;
    line-height:1.5;
}

.start-btn{
    padding:18px 35px;
    border:none;
    border-radius:18px;
    background:#FF9800;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 6px 15px rgba(0,0,0,0.3);
}

.start-btn:active{
    transform:scale(0.95);
}

/* GAME CONTAINER */

.game-container{
    width:100%;
    max-width:700px;
    background:rgba(255,255,255,0.1);
    border-radius:20px;
    padding:20px;
    backdrop-filter:blur(8px);
    display:none;
}

/* TOP BAR */

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

.score-board{
    font-size:22px;
    font-weight:bold;
}

/* STARS */

.stars-container{
    width:100%;
    font-size:28px;
    letter-spacing:4px;
    color:#aaa;
    margin-top:10px;
}

.star-filled{
    color:gold;
}

/* SENTENCE BOX */

.sentence-box{
    background:white;
    color:#333;
    padding:30px;
    border-radius:20px;
    margin-top:20px;
    text-align:center;
    min-height:180px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.question-text{
    font-size:32px;
    margin-bottom:20px;
    font-weight:bold;
    line-height:1.5;
    transition:0.3s;
}

/* OPTIONS */

.options-container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:20px;
}

.option-btn{
    padding:18px;
    border:none;
    border-radius:15px;
    background:#29B6F6;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.option-btn:hover{
    transform:scale(1.05);
}

.option-btn:active{
    transform:scale(0.95);
}

/* FEEDBACK */

.feedback{
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
    min-height:40px;
}

.correct{
    color:#4CAF50;
    animation:bounce 0.5s infinite alternate;
}

.wrong{
    color:#F44336;
}

@keyframes bounce{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.1);
    }
}

/* FINAL SCREEN */

.game-over{
    display:none;
    margin-top:30px;
    text-align:center;
}

.game-over h2{
    color:#FFD54F;
    font-size:38px;
    margin-bottom:15px;
}

.game-over p{
    font-size:24px;
    margin-top:10px;
}

.restart-btn{
    margin-top:25px;
    padding:18px 35px;
    border:none;
    border-radius:18px;
    background:#FF5722;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

/* VOLUME */

.volume-control{
    margin-top:20px;
    text-align:center;
    font-size:18px;
}

/* MOBILE */

@media(max-width:600px){

    .question-text{
        font-size:24px;
    }

    .option-btn{
        font-size:20px;
        padding:15px;
    }

    .options-container{
        grid-template-columns:1fr;
    }

    .start-screen h1{
        font-size:30px;
    }

    .start-text{
        font-size:18px;
    }

    .stars-container{
        font-size:22px;
    }

    .splash-logo{
        width:180px;
    }

}

</style>
</head>

<body>

<!-- SPLASH SCREEN -->

<div class="splash-screen" id="splashScreen">

    <img src="assets/innovine-logo.png"
    class="splash-logo">

    <div class="splash-text">
        Loading Space Sentence Rescue...
    </div>

</div>

<!-- START SCREEN -->

<div class="start-screen" id="startScreen">

    <h1>🚀 Space Sentence Rescue</h1>

    <p class="start-text">
        Repair broken sentences using correct
        punctuation and capitalisation!
    </p>

    <button class="start-btn" id="startBtn">
        ▶ TAP TO START
    </button>

</div>

<!-- GAME -->

<div class="game-container" id="gameContainer">

    <div class="top-bar">

        <div class="score-board">
            ⭐ Score:
            <span id="score">0</span>
        </div>

        <div class="score-board">
            📘 Question:
            <span id="questionNumber">1</span>/10
        </div>

    </div>

    <!-- STARS -->

    <div class="stars-container"
    id="starsContainer">

        ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐ ⭐

    </div>

    <!-- SENTENCE -->

    <div class="sentence-box"
    id="sentenceBox">

        <div class="question-text"
        id="questionText">

            Loading...

        </div>

        <div class="options-container"
        id="optionsContainer"></div>

        <div class="feedback"
        id="feedback"></div>

    </div>

    <!-- VOLUME -->

    <div class="volume-control">

        🔊 Volume:

        <input type="range"
        id="volumeSlider"
        min="0"
        max="1"
        step="0.1"
        value="1">

    </div>

    <!-- FINAL -->

    <div class="game-over"
    id="gameOver">

        <h2>🏆 Sentence Master!</h2>

        <p>
            You repaired all the sentences!
        </p>

        <p>
            Final Score:
            <span id="finalScore"></span>
        </p>

        <button class="restart-btn"
        onclick="restartGame()">

            Restart Game

        </button>

    </div>

</div>

<script>

/* SPLASH SCREEN */

setTimeout(()=>{

    document.getElementById("splashScreen")
    .style.display = "none";

    document.getElementById("startScreen")
    .style.display = "flex";

},5000);

/* START BUTTON */

const startBtn =
document.getElementById("startBtn");

startBtn.addEventListener("click",()=>{

    document.getElementById("startScreen")
    .style.display = "none";

    document.getElementById("gameContainer")
    .style.display = "block";

    loadQuestion();

});

/* ELEMENTS */

const questionText =
document.getElementById("questionText");

const optionsContainer =
document.getElementById("optionsContainer");

const feedback =
document.getElementById("feedback");

const scoreDisplay =
document.getElementById("score");

const questionNumber =
document.getElementById("questionNumber");

const finalScore =
document.getElementById("finalScore");

const gameOver =
document.getElementById("gameOver");

const starsContainer =
document.getElementById("starsContainer");

const volumeSlider =
document.getElementById("volumeSlider");

const sentenceBox =
document.getElementById("sentenceBox");

/* AUDIO */

const correctSound =
new Audio("assets/correct.mp3");

const wrongSound =
new Audio("assets/wrong.mp3");

const clapSound =
new Audio("assets/clapping.mp3");

/* VOLUME */

function updateVolume(){

    correctSound.volume =
    volumeSlider.value;

    wrongSound.volume =
    volumeSlider.value;

    clapSound.volume =
    volumeSlider.value;

}

volumeSlider.addEventListener(
"input",
updateVolume
);

updateVolume();

/* QUESTIONS */

let questions = [

{
question:"where are you going",
options:[".","?","!",","],
answer:"?",
fixed:"Where are you going?"
},

{
question:"wow that was amazing",
options:["!","?",".",":"],
answer:"!",
fixed:"Wow! That was amazing!"
},

{
question:"i live in india",
options:[
"Capitalize I and India",
"Add comma",
"Add apostrophe",
"Add quotation marks"
],
answer:"Capitalize I and India",
fixed:"I live in India."
},

{
question:"hello said ravi",
options:[
"Quotation marks",
"Semicolon",
"Hyphen",
"Colon"
],
answer:"Quotation marks",
fixed:'"Hello," said Ravi.'
},

{
question:"the dogs bone was missing",
options:[
"Apostrophe",
"Hyphen",
"Semicolon",
"Colon"
],
answer:"Apostrophe",
fixed:"The dog's bone was missing."
},

{
question:"we bought apples oranges and bananas",
options:[
"Comma",
"Question mark",
"Colon",
"Hyphen"
],
answer:"Comma",
fixed:"We bought apples, oranges, and bananas."
},

{
question:"there was only one choice run",
options:[
"Colon",
"Question mark",
"Comma",
"Hyphen"
],
answer:"Colon",
fixed:"There was only one choice: run."
},

{
question:"she was tired however she continued",
options:[
"Semicolon",
"Apostrophe",
"Question mark",
"Quotation marks"
],
answer:"Semicolon",
fixed:"She was tired; however, she continued."
},

{
question:"this is a well known story",
options:[
"Hyphen",
"Colon",
"Comma",
"Question mark"
],
answer:"Hyphen",
fixed:"This is a well-known story."
},

{
question:"can you help me",
options:["?",".","!",":"],
answer:"?",
fixed:"Can you help me?"
}

];

/* RANDOMIZE */

questions =
questions.sort(() =>
Math.random() - 0.5
);

/* VARIABLES */

let currentQuestion = 0;

let score = 0;

/* LOAD QUESTION */

function loadQuestion(){

    if(currentQuestion >= questions.length){

        endGame();

        return;

    }

    const q =
    questions[currentQuestion];

    questionText.textContent =
    q.question;

    optionsContainer.innerHTML = "";

    feedback.innerHTML = "";

    questionNumber.textContent =
    currentQuestion + 1;

    q.options.forEach(option=>{

        const btn =
        document.createElement("button");

        btn.classList.add("option-btn");

        btn.textContent = option;

        btn.onclick =
        ()=>checkAnswer(option);

        optionsContainer.appendChild(btn);

    });

}

/* CHECK ANSWER */

function checkAnswer(selected){

    const q =
    questions[currentQuestion];

    if(selected === q.answer){

        feedback.innerHTML =
        "✅ Correct! Sentence Repaired!";

        feedback.className =
        "feedback correct";

        score += 10;

        /* PLAY CORRECT + CLAP */

        correctSound.currentTime = 0;
        clapSound.currentTime = 0;

        correctSound.play();
        clapSound.play();

        /* SHOW FIXED SENTENCE */

        questionText.textContent =
        q.fixed;

        launchConfetti();

    } else {

        feedback.innerHTML =
        "❌ Oops! Try the next one!";

        feedback.className =
        "feedback wrong";

        /* PLAY WRONG SOUND */

        wrongSound.currentTime = 0;

        wrongSound.play();

    }

    scoreDisplay.textContent = score;

    currentQuestion++;

    updateStars();

    setTimeout(()=>{

        loadQuestion();

    },1800);

}

/* UPDATE STARS */

function updateStars(){

    let starsHTML = "";

    for(let i=0;i<10;i++){

        if(i < currentQuestion){

            starsHTML +=
            `<span class="star-filled">
            ⭐
            </span>`;

        } else {

            starsHTML += "⭐";

        }

    }

    starsContainer.innerHTML =
    starsHTML;

}

/* CONFETTI */

function launchConfetti(){

    for(let i=0;i<80;i++){

        const confetti =
        document.createElement("div");

        confetti.style.position =
        "fixed";

        confetti.style.width = "10px";

        confetti.style.height = "10px";

        confetti.style.backgroundColor =
        `hsl(${Math.random()*360},
        100%,50%)`;

        confetti.style.left =
        Math.random()*window.innerWidth
        + "px";

        confetti.style.top = "-20px";

        confetti.style.zIndex = "9999";

        confetti.style.borderRadius =
        "50%";

        confetti.style.pointerEvents =
        "none";

        document.body.appendChild(
        confetti
        );

        let fall =
        Math.random()*5 + 5;

        let drift =
        (Math.random()-0.5)*4;

        let position = -20;

        const interval =
        setInterval(()=>{

            position += fall;

            confetti.style.top =
            position + "px";

            confetti.style.left =
            parseFloat(
            confetti.style.left
            ) + drift + "px";

            if(position >
               window.innerHeight){

                clearInterval(interval);

                confetti.remove();

            }

        },20);

    }

}

/* END GAME */

function endGame(){

    sentenceBox.style.display =
    "none";

    gameOver.style.display =
    "block";

    finalScore.textContent =
    score;

    /* PLAY CLAPPING */

    clapSound.currentTime = 0;

    clapSound.play();

    launchConfetti();

}

/* RESTART */

function restartGame(){

    location.reload();

}

</script>

</body>
</html>
