<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punctuation Power Dashboard - Grade 6</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top left, #a1c4fd, #c2e9fb, #fbc2eb, #fad0c4);
  animation: bg 12s ease infinite;
  overflow: hidden;
}

@keyframes bg {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

#splash {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.header {
  text-align: center;
  padding: 10px;
  font-weight: bold;
}

#game {
  display: none;
  padding: 10px;
}

.container {
  display: flex;
  gap: 10px;
}

.left {
  width: 55%;
  background: rgba(255,255,255,0.5);
  border-radius: 12px;
  padding: 10px;
}

.sentence {
  background: #ffd166;
  padding: 10px;
  margin: 8px;
  border-radius: 10px;
  cursor: grab;
  font-size: 15px;
}

.right {
  width: 45%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.kpi {
  background: white;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

.bucket {
  min-height: 70px;
  background: rgba(255,255,255,0.6);
  border: 2px dashed #333;
  border-radius: 10px;
  padding: 10px;
  font-weight: bold;
}

#feedback {
  background: white;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="assets/logo.png" width="200">
</div>

<!-- GAME -->
<div id="game">

  <div class="header">
    Punctuation & Capitalisation Mastery <br>
    <small>Grade 6 Grammar Challenge</small><br>
    <b id="progress">Progress: 0 / 15</b>
  </div>

  <div class="container">

    <div class="left" id="sentences"></div>

    <div class="right">

      <div class="kpi" id="kpi">Accuracy: 0%</div>

      <div class="bucket" data-type="?">Question Mark (?)</div>
      <div class="bucket" data-type="!">Exclamation (!)</div>
      <div class="bucket" data-type=".">Full Stop (.)</div>
      <div class="bucket" data-type=",">Comma (,)</div>

      <div id="feedback">Drag sentences into correct punctuation buckets</div>

    </div>
  </div>
</div>

<script>

/* ===================== GRADE 6 QUESTIONS ===================== */
/* Includes punctuation + CAPITALISATION logic */

const data = [
{t:"what time does the train arrive in delhi", type:"?"},
{t:"how incredibly talented that young musician is", type:"!"},
{t:"the principal announced the results during assembly", type:"."},
{t:"if you finish your homework early you can watch tv", type:","},

{t:"where did anita and rohan go after school", type:"?"},
{t:"what a breathtaking view of the mountains", type:"!"},
{t:"the students submitted their projects on time", type:"."},
{t:"although it was raining heavily the match continued", type:","},

{t:"why is mr sharma absent today", type:"?"},
{t:"that was the most exciting performance ever", type:"!"},
{t:"the teacher explained the lesson clearly to everyone", type:"."},
{t:"since we were late we missed the beginning of the movie", type:","},

{t:"can you believe how fast time flies", type:"?"},
{t:"what an amazing achievement by the school team", type:"!"},
{t:"the scientists discovered a new species in the amazon forest", type:"."}
];

let correct = 0;

const box = document.getElementById("sentences");
const progress = document.getElementById("progress");
const kpi = document.getElementById("kpi");
const feedback = document.getElementById("feedback");

/* LOAD */
function load(){
  box.innerHTML = "";

  data.forEach(d=>{
    let div = document.createElement("div");
    div.className = "sentence";
    div.draggable = true;
    div.innerText = d.t;
    div.dataset.type = d.type;

    div.ondragstart = e=>{
      e.dataTransfer.setData("text", JSON.stringify(d));
    };

    box.appendChild(div);
  });
}

/* BUCKETS */
document.querySelectorAll(".bucket").forEach(b=>{
  b.ondragover = e=>e.preventDefault();

  b.ondrop = e=>{
    let d = JSON.parse(e.dataTransfer.getData("text"));

    if(d.type === b.dataset.type){
      correct++;
      feedback.innerText = "Correct ✔ Excellent punctuation + grammar!";
    } else {
      feedback.innerText = "Try again ✖ Think about sentence meaning & structure";
    }

    progress.innerText = `Progress: ${correct} / 15`;
    kpi.innerText = `Accuracy: ${Math.round((correct/15)*100)}%`;

    data.splice(data.findIndex(x=>x.t===d.t),1);
    load();
  };
});

/* SPLASH */
window.onload = ()=>{
  setTimeout(()=>{
    document.getElementById("splash").style.display="none";
    document.getElementById("game").style.display="block";
    load();
  },3000);
};

</script>

</body>
</html>
