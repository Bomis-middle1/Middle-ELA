<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Punctuation Power Game</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#ffecd2,#fcb69f,#a1c4fd,#c2e9fb);
  height: 100dvh; /* Dynamic viewport height prevents browser bar cutoffs */
  width: 100vw;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}

/* SPLASH & OVERLAY SCREENS */
#splash, #topicScreen, #startScreen, #endScreen {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: white;
  z-index: 9999;
  text-align: center;
  padding: 16px;
}

#topicScreen { display: none; font-size: 22px; font-weight: bold; }
#startScreen { display: none; }
#endScreen { display: none; }

.instruction-card {
  background: #f0f7ff;
  border: 2px dashed #1976d2;
  border-radius: 12px;
  padding: 14px;
  width: 100%;
  max-width: 400px;
  margin: 10px 0 16px 0;
  box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.instruction-card h3 {
  margin-bottom: 6px;
  color: #1976d2;
  font-size: 16px;
}

.instruction-card p {
  font-size: 13px;
  line-height: 1.4;
  color: #333;
}

/* GAME CONTAINER */
#game {
  display: none;
  height: 100dvh;
  width: 100vw;
  padding: 8px;
  flex-direction: column;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 12px;
  background: rgba(255,255,255,0.85);
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  height: 36px;
  flex-shrink: 0;
}

.container {
  display: flex;
  gap: 8px;
  flex: 1;
  margin-top: 6px;
  min-height: 0; /* Prevents flex children overflow */
}

/* LEFT SIDE: QUESTION CARD */
.left {
  flex: 1;
  background: rgba(255,255,255,0.7);
  border-radius: 10px;
  padding: 8px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.sentence {
  background: #ffd166;
  padding: 12px 10px;
  border-radius: 8px;
  cursor: grab;
  font-weight: bold;
  font-size: 14px;
  text-align: center;
  width: 100%;
  box-shadow: 0 3px 5px rgba(0,0,0,0.1);
  transition: transform 0.2s, background 0.2s;
}

.sentence.selected {
  background: #ffb703;
  transform: scale(1.02);
  border: 2px solid #fb8500;
}

/* RIGHT SIDE: ANSWER BUCKETS */
.right {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  justify-content: space-between;
}

.bucket {
  background: rgba(255,255,255,0.85);
  border: 2px dashed #1976d2;
  border-radius: 8px;
  padding: 6px 10px;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  font-weight: bold;
  color: #1976d2;
  cursor: pointer;
  transition: background 0.2s;
}

.bucket span:last-child {
  font-size: 18px;
}

.bucket-hover {
  background: #e3f2fd;
  border-style: solid;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #1976d2;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1565c0;
}

/* CONFETTI */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  top: 0;
  z-index: 10000;
  animation: fall 1.5s linear forwards;
}

@keyframes fall {
  to { transform: translateY(100dvh) rotate(360deg); opacity: 0; }
}

/* MOBILE SCREEN RESPONSIVE LAYOUT */
@media (max-width: 600px) {
  .container {
    flex-direction: column;
  }
  .left {
    flex: none;
    height: 28%;
    min-height: 70px;
  }
  .right {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr; /* Arrange in 2x2 grid to guarantee fit */
    grid-template-rows: 1fr 1fr;
    gap: 6px;
  }
  .bucket {
    flex: none;
    height: 100%;
    padding: 6px 8px;
    font-size: 12px;
  }
  .bucket span:last-child {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<!-- SPLASH (SHOWS FOR 5 SECONDS) -->
<div id="splash">
  <img src="assets/innovine-logo.png" width="160" alt="Innovine Logo" onerror="this.style.display='none'">
</div>

<!-- TOPIC -->
<div id="topicScreen">
  🎉 PUNCTUATION POWER CHALLENGE 🎉
</div>

<!-- START & INSTRUCTIONS SCREEN -->
<div id="startScreen">
  <h2 style="font-size: 18px;">Welcome Students!</h2>
  
  <div class="instruction-card">
    <h3>📌 How to Play</h3>
    <p><strong>Drag the sentence</strong> or <strong>tap it to select</strong>, then place it inside the correct punctuation box!</p>
  </div>

  <button onclick="startGame()">START GAME</button>
</div>

<!-- GAME CONTAINER -->
<div id="game">
  <div class="header">
    <div id="progress">Progress: 0 / 15</div>
    <div style="font-size: 12px;">
      🔊 Volume <input type="range" id="vol" min="0" max="1" step="0.1" value="1" style="vertical-align: middle; width: 50px;">
    </div>
  </div>

  <div class="container">
    <div class="left" id="list"></div>

    <div class="right">
      <div class="bucket" data-type="?" onclick="handleBucketClick('?')"><span>Question Mark</span><span>?</span></div>
      <div class="bucket" data-type="!" onclick="handleBucketClick('!')"><span>Exclamation Mark</span><span>!</span></div>
      <div class="bucket" data-type="." onclick="handleBucketClick('.')"><span>Full Stop</span><span>.</span></div>
      <div class="bucket" data-type="," onclick="handleBucketClick(',')"><span>Comma Clause</span><span>,</span></div>
    </div>
  </div>
</div>

<!-- END SCREEN -->
<div id="endScreen">
  <h1>🏆 Trophy Unlocked!</h1>
  <h2 id="scoreText" style="margin: 8px 0;"></h2>
  <p id="remark" style="margin-bottom: 16px;"></p>
  <button onclick="location.reload()">RESTART</button>
</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3" preload="none"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="none"></audio>
<audio id="clapSound" src="assets/clapping.mp3" preload="none"></audio>

<script>
const data = [
  {t: "Where are you going", type: "?"},
  {t: "What a beautiful day it is", type: "!"},
  {t: "The students completed the assignment on time", type: "."},
  {t: "After finishing homework he went out to play", type: ","},
  {t: "Why is the teacher absent today", type: "?"},
  {t: "How amazing this performance was", type: "!"},
  {t: "She is reading a novel in the library", type: "."},
  {t: "Although it was late they continued studying", type: ","},
  {t: "Can you solve this puzzle", type: "?"},
  {t: "What an incredible achievement", type: "!"},
  {t: "The sun rises in the east", type: "."},
  {t: "If you work hard you will succeed", type: ","},
  {t: "Did you complete your project", type: "?"},
  {t: "That is absolutely fantastic", type: "!"},
  {t: "When the bell rang the students left", type: ","}
];

let correctCount = 0;
let totalQuestions = data.length;
let selectedItem = null;

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");
const clapSound = document.getElementById("clapSound");

// 5-SECOND SPLASH LOGO TRANSITION
setTimeout(() => {
  document.getElementById("splash").style.display = "none";
  document.getElementById("topicScreen").style.display = "flex";

  setTimeout(() => {
    document.getElementById("topicScreen").style.display = "none";
    document.getElementById("startScreen").style.display = "flex";
  }, 1500);
}, 5000);

// Fisher-Yates Array Shuffle Algorithm
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

function startGame() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("game").style.display = "flex";
  shuffleArray(data);
  renderQuestion();
}

function renderQuestion() {
  let box = document.getElementById("list");
  box.innerHTML = "";
  selectedItem = null;

  if (data.length === 0) return;

  let item = data[0];
  let div = document.createElement("div");
  div.className = "sentence";
  div.draggable = true;
  div.innerText = item.t;

  div.onclick = () => {
    div.classList.toggle("selected");
    selectedItem = div.classList.contains("selected") ? item : null;
  };

  div.ondragstart = (e) => {
    e.dataTransfer.setData("text/plain", JSON.stringify(item));
  };

  box.appendChild(div);
}

document.querySelectorAll(".bucket").forEach(bucket => {
  bucket.ondragover = (e) => {
    e.preventDefault();
    bucket.classList.add("bucket-hover");
  };

  bucket.ondragleave = () => {
    bucket.classList.remove("bucket-hover");
  };

  bucket.ondrop = (e) => {
    e.preventDefault();
    bucket.classList.remove("bucket-hover");
    try {
      let droppedData = JSON.parse(e.dataTransfer.getData("text/plain"));
      let targetType = bucket.getAttribute("data-type");
      processAnswer(droppedData, targetType);
    } catch(err) {}
  };
});

function handleBucketClick(targetType) {
  if (selectedItem) {
    processAnswer(selectedItem, targetType);
  }
}

function processAnswer(itemData, targetType) {
  let volumeVal = document.getElementById("vol").value;
  correctSound.volume = volumeVal;
  wrongSound.volume = volumeVal;
  clapSound.volume = volumeVal;

  if (itemData.type === targetType) {
    correctCount++;
    playSound(correctSound);
    confetti();
  } else {
    playSound(wrongSound);
  }

  document.getElementById("progress").innerText = `Progress: ${correctCount} / ${totalQuestions}`;
  data.shift();

  if (data.length === 0) {
    endGame();
  } else {
    renderQuestion();
  }
}

function playSound(audioEl) {
  try {
    audioEl.currentTime = 0;
    audioEl.play().catch(e => {});
  } catch(e) {}
}

function confetti() {
  for (let i = 0; i < 15; i++) {
    let c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = ["#ff5252", "#ff4081", "#e040fb", "#7c4dff", "#53d2dc"][Math.floor(Math.random() * 5)];
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1500);
  }
}

function endGame() {
  document.getElementById("game").style.display = "none";
  document.getElementById("endScreen").style.display = "flex";
  playSound(clapSound);

  document.getElementById("scoreText").innerText = `Score: ${correctCount} / ${totalQuestions}`;
  document.getElementById("remark").innerText = "Excellent Performance! 🎉 You reached the Trophy Zone!";
}
</script>

</body>
</html>
