
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drag and Drop Phrasal Verbs - Grade 6</title>
<style>
body { margin:0; font-family: Arial; background: #87ceeb; display:flex; justify-content:center; align-items:center; height:100vh; }
#gameContainer { background: #fff; width: 90%; max-width: 500px; padding:20px; border-radius:10px; box-shadow:0 0 10px #aaa; text-align:center; }
#question { font-weight:bold; font-size:18px; margin-bottom:15px; }
.options { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
.option { background:#ffeb3b; padding:10px 15px; border-radius:5px; cursor:pointer; user-select:none; font-size:16px; min-width:80px; text-align:center; }
.option.wiggle { animation: wiggle 0.5s; }
@keyframes wiggle { 0%{transform:rotate(0deg);} 25%{transform:rotate(-10deg);} 50%{transform:rotate(10deg);} 75%{transform:rotate(-10deg);} 100%{transform:rotate(0deg);} }
#feedback { margin-top:15px; font-weight:bold; height:24px; }
#tick { display:none; font-size:30px; color:green; margin-top:10px; }
#restartBtn { display:none; margin-top:20px; padding:10px 20px; font-size:18px; cursor:pointer; background:#4caf50; color:white; border:none; border-radius:5px; }
.confetti-piece { position:absolute; width:8px; height:8px; background:linear-gradient(to right,#ff0,#f0f); top:0; animation: fall 2s linear forwards;}
@keyframes fall {0%{transform:translateY(0);} 100%{transform:translateY(400px); opacity:0;}}
</style>
</head>
<body>

<div id="gameContainer">
<div id="question"></div>
<div class="options" id="optionsContainer"></div>
<div id="feedback"></div>
<div id="tick">✔</div>
<button id="restartBtn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>
const questions = [
  {q:"He couldn’t ___ the heavy box by himself.", correct:"pick up", wrong:["break down","turn on"]},
  {q:"She wants to ___ her old clothes to charity.", correct:"give away", wrong:["put off","look after"]},
  {q:"We need to ___ the meeting to next week.", correct:"put off", wrong:["pick up","break up"]},
  {q:"The children will ___ the playground at noon.", correct:"leave", wrong:["run into","break down"]},
  {q:"Can you ___ the music for a moment?", correct:"turn off", wrong:["turn down","pick up"]},
  {q:"I accidentally ___ my keys in the car.", correct:"locked up", wrong:["ran into","look after"]},
  {q:"The car suddenly ___ in the middle of the road.", correct:"broke down", wrong:["look up","pick up"]},
  {q:"He tried to ___ the conversation with a joke.", correct:"lighten up", wrong:["break up","give away"]},
  {q:"Please ___ the lights when you leave the room.", correct:"turn off", wrong:["put off","pick up"]},
  {q:"We need to ___ the project before the deadline.", correct:"finish up", wrong:["look after","give away"]}
];

let currentQ=0, wrongAttempts=0;
const questionEl = document.getElementById("question");
const optionsContainer = document.getElementById("optionsContainer");
const feedback = document.getElementById("feedback");
const tick = document.getElementById("tick");
const restartBtn = document.getElementById("restartBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

function showQuestion(){
  tick.style.display="none";
  wrongAttempts=0;
  const q = questions[currentQ];
  questionEl.textContent = q.q;
  optionsContainer.innerHTML="";
  const options = [q.correct,...q.wrong].sort(()=>Math.random()-0.5);
  options.forEach(opt=>{
    const btn = document.createElement("div");
    btn.className="option";
    btn.textContent=opt;
    btn.onclick = ()=>checkAnswer(btn,opt,q.correct);
    optionsContainer.appendChild(btn);
  });
  feedback.textContent="";
}

function checkAnswer(btn,opt,correct){
  if(opt===correct){
    feedback.textContent="Good Job! 🎉";
    feedback.style.color="green";
    tick.style.display="block";
    correctSound.currentTime=0; correctSound.play();
    setTimeout(nextQuestion,800);
  } else {
    wrongAttempts++;
    wrongSound.currentTime=0; wrongSound.play();
    btn.classList.add("wiggle");
    setTimeout(()=>btn.classList.remove("wiggle"),500);
  }
}

function nextQuestion(){
  currentQ++;
  if(currentQ>=questions.length){
    showConfetti();
    feedback.textContent="🎉 You completed all questions!";
    clapSound.currentTime=0; clapSound.play();
    restartBtn.style.display="block";
  } else showQuestion();
}

function showConfetti(){
  for(let i=0;i<50;i++){
    const c = document.createElement("div");
    c.className="confetti-piece";
    c.style.left=Math.random()*window.innerWidth+"px";
    c.style.background=`hsl(${Math.random()*360},100%,50%)`;
    document.body.appendChild(c);
    setTimeout(()=>document.body.removeChild(c),2000);
  }
}

restartBtn.onclick=()=>location.reload();

// start the first question
showQuestion();
</script>

</body>
</html>
