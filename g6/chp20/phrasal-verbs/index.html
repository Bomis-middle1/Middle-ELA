


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrasal Verb Snake Quiz</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #87ceeb;
  overflow: hidden;
}

/* LOGO SCREEN */
#logoScreen {
  position: fixed;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  z-index: 1000;
}

/* GAME AREA */
#gameContainer {
  display: none;
  width: 100%;
  height: 100vh;
  position: relative;
}

#snakeCanvas {
  display: block;
  margin: auto;
  background: #87ceeb;
}

/* QUESTION BOX */
#questionBox {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 320px;
  background: white;
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  z-index: 10;
}

#questionText {
  font-weight: bold;
  margin-bottom: 10px;
}

button.optionBtn {
  display: block;
  width: 85%;
  margin: 6px auto;
  padding: 8px;
  border: none;
  border-radius: 6px;
  background: #eee;
  cursor: pointer;
}

button.optionBtn:hover {
  background: #ddd;
}

#feedback {
  margin-top: 8px;
  font-weight: bold;
}

/* RESTART BUTTON FIXED */
#restartBtn {
  display: none;
  margin: 20px auto;
  padding: 12px 18px;
  font-size: 16px;
  background: #4caf50;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

/* PARTICLES */
.particle {
  position: absolute;
  width: 6px;
  height: 6px;
  background: linear-gradient(to right, #ff0, #f0f);
  border-radius: 50%;
  pointer-events: none;
  animation: float 1s linear forwards;
}

@keyframes float {
  0% { opacity: 1; transform: translate(0,0); }
  100% { opacity: 0; transform: translate(calc(-40px + 80px*var(--r)), -60px); }
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
  <img src="assets/innovine-logo.png" width="200">
</div>

<!-- GAME -->
<div id="gameContainer">
  <canvas id="snakeCanvas" width="400" height="400"></canvas>

  <div id="questionBox">
    <div id="questionText"></div>
    <div id="optionsContainer"></div>
    <div id="feedback"></div>
  </div>

  <button id="restartBtn">Play Again</button>

  <audio id="correctSound" src="assets/correct.mp3"></audio>
  <audio id="wrongSound" src="assets/wrong.mp3"></audio>
  <audio id="clapSound" src="assets/clapping.mp3"></audio>
</div>

<script>

// ---------------- QUESTIONS ----------------
const questions = [
  {sentence:"He couldn’t ___ the heavy box by himself.", options:["pick up","break down","turn on"], answer:"pick up"},
  {sentence:"She wants to ___ her old clothes to charity.", options:["give away","put off","look after"], answer:"give away"},
  {sentence:"We need to ___ the meeting to next week.", options:["put off","pick up","break up"], answer:"put off"},
  {sentence:"The children will ___ the playground at noon.", options:["run into","leave","break down"], answer:"leave"},
  {sentence:"Can you ___ the music for a moment?", options:["turn off","turn down","pick up"], answer:"turn off"},
  {sentence:"I accidentally ___ my keys in the car.", options:["locked up","ran into","look after"], answer:"locked up"},
  {sentence:"The car suddenly ___ in the middle of the road.", options:["broke down","look up","pick up"], answer:"broke down"},
  {sentence:"He tried to ___ the conversation with a joke.", options:["break up","lighten up","give away"], answer:"lighten up"},
  {sentence:"Please ___ the lights when you leave the room.", options:["turn off","put off","pick up"], answer:"turn off"},
  {sentence:"We need to ___ the project before the deadline.", options:["finish up","look after","give away"], answer:"finish up"}
];

// ---------------- STATE ----------------
let currentQuestion = 0;
let direction = "RIGHT";
const box = 20;

let snake = [{x:200, y:200}];

let canvas = document.getElementById("snakeCanvas");
let ctx = canvas.getContext("2d");

let correctSound = document.getElementById("correctSound");
let wrongSound = document.getElementById("wrongSound");
let clapSound = document.getElementById("clapSound");

let restartBtn = document.getElementById("restartBtn");

// ---------------- AUDIO UNLOCK FIX ----------------
document.addEventListener("click", () => {
  [correctSound, wrongSound, clapSound].forEach(a => {
    a.play().then(()=>a.pause()).catch(()=>{});
  });
}, { once:true });

// ---------------- CONTROLS ----------------
document.addEventListener("keydown", (e) => {
  if(e.key==="ArrowLeft" && direction!=="RIGHT") direction="LEFT";
  if(e.key==="ArrowRight" && direction!=="LEFT") direction="RIGHT";
  if(e.key==="ArrowUp" && direction!=="DOWN") direction="UP";
  if(e.key==="ArrowDown" && direction!=="UP") direction="DOWN";
});

// ---------------- PARTICLES ----------------
function particles(x,y){
  for(let i=0;i<10;i++){
    let p=document.createElement("div");
    p.className="particle";
    p.style.left=x+"px";
    p.style.top=y+"px";
    p.style.setProperty("--r", Math.random());
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1000);
  }
}

// ---------------- QUESTION UI ----------------
function showQuestion(){
  let q = questions[currentQuestion];
  document.getElementById("questionText").textContent = q.sentence;

  let container = document.getElementById("optionsContainer");
  container.innerHTML = "";

  q.options.sort(()=>Math.random()-0.5).forEach(opt=>{
    let btn=document.createElement("button");
    btn.className="optionBtn";
    btn.textContent=opt;
    btn.onclick=()=>checkAnswer(opt);
    container.appendChild(btn);
  });

  document.getElementById("feedback").textContent="";
}

// ---------------- ANSWER ----------------
function checkAnswer(opt){
  let q = questions[currentQuestion];

  if(opt === q.answer){
    document.getElementById("feedback").textContent="Correct 🎉";
    document.getElementById("feedback").style.color="green";

    correctSound.play();
    snake.push({...snake[snake.length-1]});
    particles(200,200);

  } else {
    document.getElementById("feedback").textContent="Wrong ❌";
    document.getElementById("feedback").style.color="red";
    wrongSound.play();
  }

  currentQuestion++;

  if(currentQuestion >= questions.length){
    clapSound.play();
    document.getElementById("feedback").textContent="🎉 Finished!";
    restartBtn.style.display="block";
  } else {
    setTimeout(showQuestion, 600);
  }
}

// ---------------- DRAW SNAKE ----------------
function draw(){
  ctx.fillStyle="#87ceeb";
  ctx.fillRect(0,0,400,400);

  for(let i=0;i<snake.length;i++){
    ctx.fillStyle = i===0 ? "#ff4136" : "#ff7979";
    ctx.fillRect(snake[i].x, snake[i].y, box, box);
  }

  let head = {...snake[0]};

  if(direction==="LEFT") head.x -= box;
  if(direction==="RIGHT") head.x += box;
  if(direction==="UP") head.y -= box;
  if(direction==="DOWN") head.y += box;

  if(head.x<0 || head.y<0 || head.x>=400 || head.y>=400){
    alert("Game Over!");
    restartBtn.style.display="block";
    clearInterval(loop);
    return;
  }

  snake.pop();
  snake.unshift(head);
}

// ---------------- START ----------------
let loop;

setTimeout(()=>{
  document.getElementById("logoScreen").style.display="none";
  document.getElementById("gameContainer").style.display="block";

  showQuestion();
  loop = setInterval(draw, 140);
}, 5000);

// ---------------- RESTART ----------------
restartBtn.onclick = () => location.reload();

</script>
</body>
</html>
