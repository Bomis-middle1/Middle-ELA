
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrasal Verb Snake Game</title>
<style>
body { margin:0; background:#f0f8ff; font-family:Arial; }
#logoScreen { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:white; z-index:100;}
#gameContainer { display:none; position:relative; width:100%; height:100vh; overflow:hidden; background:#87ceeb; }
#snakeCanvas { background:#87ceeb; display:block; margin:auto; }
#questionBox { position:absolute; top:20px; left:50%; transform:translateX(-50%); background:white; padding:15px; border-radius:10px; text-align:center; width:300px; z-index:50; }
#questionText { font-weight:bold; margin-bottom:10px; }
button.optionBtn { display:block; width:80%; margin:5px auto; padding:8px; border:none; border-radius:5px; background:#eee; cursor:pointer; font-size:14px; }
button.optionBtn:hover { background:#ddd; }
#feedback { text-align:center; font-weight:bold; margin-top:10px; font-size:16px; }
#restartBtn { display:none; margin:20px auto; padding:10px 20px; font-size:18px; cursor:pointer; background:#4caf50; color:white; border:none; border-radius:5px; display:block;}
</style>
</head>
<body>

<!-- Logo -->
<div id="logoScreen">
<img src="assets/innovine-logo.png" alt="Innovine Logo" width="200">
</div>

<div id="gameContainer">
<canvas id="snakeCanvas" width="400" height="400"></canvas>
<div id="questionBox">
<div id="questionText"></div>
<div id="optionsContainer"></div>
<div id="feedback"></div>
</div>
<button id="restartBtn">Play Again</button>
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>
</div>

<script>
// --- Questions ---
const questions = [
  {sentence:"He couldn’t ___ the heavy box by himself.", options:["pick up","break down","turn on"], answer:"pick up"},
  {sentence:"She wants to ___ her old clothes to charity.", options:["give away","put off","look after"], answer:"give away"},
  {sentence:"We need to ___ the meeting to next week.", options:["put off","pick up","break up"], answer:"put off"},
  {sentence:"The children will ___ the playground at noon.", options:["run into","leave","break down"], answer:"leave"},
  {sentence:"Can you ___ the music for a moment?", options:["turn off","turn down","pick up"], answer:"turn off"},
  {sentence:"I accidentally ___ my keys in the car.", options:["locked up","ran into","look after"], answer:"locked up"},
  {sentence:"The car suddenly ___ in the middle of the road.", options:["broke down","look up","pick up"], answer:"broke down"},
  {sentence:"He tried to ___ the conversation with a joke.", options:["break up","lighten up","give away"], answer:"lighten up"},
  {sentence:"Please ___ the lights when you leave the room.", options:["turn off","put off","pick up"], answer:"turn off"},
  {sentence:"We need to ___ the project before the deadline.", options:["finish up","look after","give away"], answer:"finish up"}
];

let currentQuestion = 0;
const canvas = document.getElementById("snakeCanvas");
const ctx = canvas.getContext("2d");
const box = 20;
let snake = [];
snake[0]={x:10*box, y:10*box};
let food = {};
let direction;
let game;
let questionAnswered = false;

const questionText = document.getElementById("questionText");
const optionsContainer = document.getElementById("optionsContainer");
const feedback = document.getElementById("feedback");
const restartBtn = document.getElementById("restartBtn");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");
const clapSound = document.getElementById("clapSound");

// --- Show first question ---
function showQuestion(){
    questionAnswered=false;
    const q = questions[currentQuestion];
    questionText.textContent = q.sentence;
    optionsContainer.innerHTML="";
    q.options.sort(()=>Math.random()-0.5).forEach(opt=>{
        const btn = document.createElement("button");
        btn.textContent=opt;
        btn.className="optionBtn";
        btn.onclick = ()=>checkAnswer(opt);
        optionsContainer.appendChild(btn);
    });
    feedback.textContent="";
}

// --- Check answer ---
function checkAnswer(selected){
    const correct = questions[currentQuestion].answer;
    if(selected===correct){
        feedback.textContent="Correct! 🎉";
        feedback.style.color="green";
        correctSound.currentTime=0; correctSound.play();
        questionAnswered=true;
        // grow snake by adding a new segment
        snake.push({x:snake[snake.length-1].x, y:snake[snake.length-1].y});
    }else{
        feedback.textContent="Wrong! ❌";
        feedback.style.color="red";
        wrongSound.currentTime=0; wrongSound.play();
        questionAnswered=false;
    }
}

// --- Control snake ---
document.addEventListener("keydown",function(event){
    if(event.key==="ArrowLeft" && direction!="RIGHT") direction="LEFT";
    else if(event.key==="ArrowUp" && direction!="DOWN") direction="UP";
    else if(event.key==="ArrowRight" && direction!="LEFT") direction="RIGHT";
    else if(event.key==="ArrowDown" && direction!="UP") direction="DOWN";
});

// --- Spawn food ---
function spawnFood(){
    food.x = Math.floor(Math.random()*20)*box;
    food.y = Math.floor(Math.random()*20)*box;
}

// --- Draw function ---
function draw(){
    ctx.fillStyle="#87ceeb";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    for(let i=0;i<snake.length;i++){
        ctx.fillStyle = (i===0)?"#ff4136":"#ff7979";
        ctx.fillRect(snake[i].x,snake[i].y,box,box);
    }

    ctx.fillStyle="yellow";
    ctx.fillRect(food.x,food.y,box,box);

    // old head position
    let snakeX = snake[0].x;
    let snakeY = snake[0].y;

    if(direction=="LEFT") snakeX -= box;
    if(direction=="RIGHT") snakeX += box;
    if(direction=="UP") snakeY -= box;
    if(direction=="DOWN") snakeY += box;

    // Collision
    if(snakeX<0 || snakeY<0 || snakeX>=canvas.width || snakeY>=canvas.height || collision(snakeX,snakeY,snake)){
        clearInterval(game);
        alert("Game Over!");
        restartBtn.style.display="block";
        return;
    }

    // Eating food
    if(snakeX==food.x && snakeY==food.y){
        if(questionAnswered){
            spawnFood();
            currentQuestion++;
            if(currentQuestion>=questions.length){
                clearInterval(game);
                clapSound.currentTime=0; clapSound.play();
                alert("Congratulations! You finished all questions!");
                restartBtn.style.display="block";
                return;
            }else showQuestion();
        }else{
            // if food eaten without answering correctly, do not grow
            spawnFood();
        }
    }else{
        snake.pop();
    }

    let newHead={x:snakeX,y:snakeY};
    snake.unshift(newHead);
}

// --- Collision with self ---
function collision(x,y,array){
    for(let i=0;i<array.length;i++){
        if(array[i].x==x && array[i].y==y) return true;
    }
    return false;
}

// --- Start game ---
setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("gameContainer").style.display="block";
    spawnFood();
    showQuestion();
    game=setInterval(draw,150);
},5000);

restartBtn.onclick=()=>location.reload();
</script>

</body>
</html>
