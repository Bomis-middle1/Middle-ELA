
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrasal Verb Popcorn Catch</title>
<style>
body { margin:0; font-family: Arial; background:#87ceeb; overflow:hidden; }
#gameContainer { position:relative; width:100%; height:100vh; overflow:hidden; }
#player { position:absolute; bottom:10px; left:50%; width:60px; height:60px; background:#ff4136; border-radius:5px; transform:translateX(-50%);}
.kernel { position:absolute; width:150px; height:40px; background:#ffeb3b; border-radius:5px; text-align:center; line-height:40px; font-weight:bold; cursor:pointer; }
#feedback { position:absolute; top:60px; left:50%; transform:translateX(-50%); font-weight:bold; font-size:20px; z-index:50; }
#questionText { position:absolute; top:10px; left:50%; transform:translateX(-50%); font-size:20px; font-weight:bold; text-align:center; width:90%; }
#treasure { position:absolute; top:50px; left:50%; transform:translateX(-50%); width:60px; height:60px; display:none; background:gold; border-radius:50%; text-align:center; line-height:60px; font-weight:bold;}
#restartBtn { position:absolute; display:none; left:50%; top:80%; transform:translateX(-50%); padding:10px 20px; font-size:18px; cursor:pointer;}
.particle { position:absolute; width:6px; height:6px; background:linear-gradient(to right,#ff0,#f0f); border-radius:50%; pointer-events:none; animation: floatParticle 1s linear forwards;}
@keyframes floatParticle {0%{opacity:1; transform:translate(0,0);} 100%{opacity:0; transform:translate(calc(-50px + 100px*var(--randX)),-50px);}}
</style>
</head>
<body>

<div id="gameContainer">
<div id="questionText"></div>
<div id="feedback"></div>
<div id="player"></div>
<div id="treasure">🏆</div>
<button id="restartBtn">Play Again</button>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>
</div>

<script>
// 10 situational Phrasal Verb questions
const questions = [
  {sentence:"He couldn’t ___ the heavy box by himself.", correct:"pick up", wrong:["break down","turn on"]},
  {sentence:"She wants to ___ her old clothes to charity.", correct:"give away", wrong:["put off","look after"]},
  {sentence:"We need to ___ the meeting to next week.", correct:"put off", wrong:["pick up","break up"]},
  {sentence:"The children will ___ the playground at noon.", correct:"leave", wrong:["run into","break down"]},
  {sentence:"Can you ___ the music for a moment?", correct:"turn off", wrong:["turn down","pick up"]},
  {sentence:"I accidentally ___ my keys in the car.", correct:"locked up", wrong:["ran into","look after"]},
  {sentence:"The car suddenly ___ in the middle of the road.", correct:"broke down", wrong:["look up","pick up"]},
  {sentence:"He tried to ___ the conversation with a joke.", correct:"lighten up", wrong:["break up","give away"]},
  {sentence:"Please ___ the lights when you leave the room.", correct:"turn off", wrong:["put off","pick up"]},
  {sentence:"We need to ___ the project before the deadline.", correct:"finish up", wrong:["look after","give away"]}
];

let currentQuestion = 0;
const player = document.getElementById('player');
const feedback = document.getElementById('feedback');
const questionText = document.getElementById('questionText');
const treasure = document.getElementById('treasure');
const restartBtn = document.getElementById('restartBtn');
const gameContainer = document.getElementById('gameContainer');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');

let playerLeft = window.innerWidth/2 - 30;
player.style.left = playerLeft + 'px';

// Player movement
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'){ playerLeft -= 20; if(playerLeft<0) playerLeft=0; player.style.left=playerLeft+'px'; }
  if(e.key==='ArrowRight'){ playerLeft += 20; if(playerLeft>window.innerWidth-60) playerLeft=window.innerWidth-60; player.style.left=playerLeft+'px'; }
});

// Particle effect
function createParticles(x,y){
  for(let i=0;i<10;i++){
    const p = document.createElement('div');
    p.className='particle';
    p.style.left = x+'px';
    p.style.top = y+'px';
    p.style.setProperty('--randX', Math.random());
    gameContainer.appendChild(p);
    setTimeout(()=>gameContainer.removeChild(p),1000);
  }
}

// Spawn kernels one question at a time
function spawnKernel(){
  if(currentQuestion >= questions.length){
    questionText.textContent="🎉 You finished all questions!";
    treasure.style.display='block';
    clapSound.currentTime=0; clapSound.play();
    restartBtn.style.display='block';
    return;
  }

  const q = questions[currentQuestion];
  questionText.textContent = q.sentence;
  feedback.textContent="";

  const options = [q.correct, ...q.wrong].sort(()=>Math.random()-0.5);

  options.forEach((opt,i)=>{
    const kernel = document.createElement('div');
    kernel.className='kernel';
    kernel.textContent = opt;
    kernel.style.left = 50 + i*170 + 'px';
    kernel.style.top = '-50px';
    gameContainer.appendChild(kernel);

    const fallInterval = setInterval(()=>{
      let top = parseInt(kernel.style.top);
      if(top>window.innerHeight-100){ kernel.remove(); clearInterval(fallInterval); }
      else { kernel.style.top = top + 2 + 'px'; }

      let kernelRect = kernel.getBoundingClientRect();
      let playerRect = player.getBoundingClientRect();
      if(!(playerRect.right<kernelRect.left || playerRect.left>kernelRect.right || playerRect.bottom<kernelRect.top || playerRect.top>kernelRect.bottom)){
        if(kernel.textContent===q.correct){
          feedback.textContent="Correct! 🎉"; feedback.style.color="green";
          correctSound.currentTime=0; correctSound.play();
          createParticles(kernelRect.left+75,kernelRect.top+20);
        } else {
          feedback.textContent="Wrong! ❌"; feedback.style.color="red";
          wrongSound.currentTime=0; wrongSound.play();
        }
        kernel.remove(); clearInterval(fallInterval);
        // move to next question immediately after first kernel collision
        if(i===0){ currentQuestion++; setTimeout(spawnKernel,500); }
      }
    },20);
  });
}

spawnKernel();

// Restart
restartBtn.onclick = ()=>{ location.reload(); }
</script>
</body>
</html>
