TOPIC: SUBJECT VERB AGREEMENT

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crazy Restaurant Rush</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:#111;
touch-action:none;
}

#gameArea{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:linear-gradient(to bottom,#ff7043,#bf360c);
}

/* LOGO */

#logoScreen{
position:absolute;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

#logoScreen img{
width:260px;
max-width:80%;
}

#logoText{
margin-top:20px;
font-size:34px;
font-weight:bold;
color:#333;
}

/* START + END */

#startScreen,
#endScreen{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
z-index:5000;
text-align:center;
padding:20px;
}

.mainBtn{
padding:16px 35px;
font-size:24px;
border:none;
border-radius:20px;
background:#ffeb3b;
cursor:pointer;
font-weight:bold;
margin-top:25px;
}

/* HUD */

#scoreBoard{
position:absolute;
top:10px;
left:10px;
background:#212121;
color:white;
padding:12px 18px;
border-radius:15px;
font-size:18px;
z-index:1000;
line-height:1.6;
border:3px solid yellow;
}

#volumeBox{
position:absolute;
top:10px;
right:10px;
background:#212121;
color:white;
padding:10px;
border-radius:15px;
z-index:1000;
border:3px solid yellow;
}

/* GAME */

#kitchen{
position:absolute;
bottom:0;
width:100%;
height:160px;
background:#3e2723;
}

#chef{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
font-size:80px;
transition:0.08s linear;
z-index:200;
}

.food{
position:absolute;
font-size:55px;
user-select:none;
}

/* QUESTION */

#questionBox{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:92%;
max-width:850px;
background:#fff8e1;
padding:25px;
border-radius:25px;
display:none;
z-index:7000;
box-shadow:0 0 30px rgba(0,0,0,0.5);
}

#questionText{
font-size:24px;
margin-bottom:20px;
line-height:1.6;
text-align:center;
}

.optionContainer{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.optionBtn{
padding:15px;
border:none;
border-radius:15px;
background:#ff5722;
color:white;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

.optionBtn:hover{
background:#d84315;
}

/* FEEDBACK */

#feedback{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:30px;
border-radius:25px;
display:none;
z-index:9000;
width:90%;
max-width:600px;
text-align:center;
}

#feedbackTitle{
font-size:34px;
font-weight:bold;
margin-bottom:15px;
}

#feedbackText{
font-size:22px;
line-height:1.6;
}

/* CONFETTI */

.confetti{
position:absolute;
width:12px;
height:12px;
animation:fall 3s linear forwards;
}

@keyframes fall{
from{
transform:translateY(-100px) rotate(0deg);
}
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

/* MOBILE */

@media(max-width:768px){

#chef{
font-size:60px;
}

.food{
font-size:40px;
}

#questionText{
font-size:18px;
}

.optionBtn{
font-size:15px;
padding:12px;
}

}

</style>

</head>

<body>

<div id="gameArea">

<!-- LOGO -->

<div id="logoScreen">

<img src="assets/innovine-logo.png">

<div id="logoText">
Innovine Learning Adventures
</div>

</div>

<!-- START -->

<div id="startScreen" style="display:none;">

<h1 style="font-size:50px;">
🍔 Crazy Restaurant Rush
</h1>

<p style="font-size:24px; margin-top:20px; max-width:700px;">
Catch food orders, avoid burnt food, and answer grammar questions to save the restaurant!
</p>

<button class="mainBtn"
onclick="startGame()">
START GAME
</button>

</div>

<!-- END -->

<div id="endScreen" style="display:none;">

<h1>🏆 RESTAURANT SAVED!</h1>

<h2 id="finalText"
style="margin-top:20px; line-height:1.8;"></h2>

<button class="mainBtn"
onclick="location.reload()">
PLAY AGAIN
</button>

</div>

<!-- SCORE -->

<div id="scoreBoard">

🍔 Score:
<span id="score">0</span>

<br>

✅ Correct:
<span id="correct">0</span>

<br>

❌ Wrong:
<span id="wrong">0</span>

</div>

<!-- VOLUME -->

<div id="volumeBox">

🔊 Volume

<input type="range"
id="volumeSlider"
min="0"
max="1"
step="0.1"
value="1">

</div>

<!-- CHEF -->

<div id="chef">
👨‍🍳
</div>

<!-- KITCHEN -->

<div id="kitchen"></div>

<!-- QUESTION -->

<div id="questionBox">

<div id="questionText"></div>

<div class="optionContainer"
id="options"></div>

</div>

<!-- FEEDBACK -->

<div id="feedback">

<div id="feedbackTitle"></div>

<div id="feedbackText"></div>

</div>

</div>

<script>

/* LOGO */

setTimeout(()=>{

document.getElementById("logoScreen")
.style.display="none";

document.getElementById("startScreen")
.style.display="flex";

},5000);

/* AUDIO */

const correctSound =
new Audio("assets/correct.mp3");

const wrongSound =
new Audio("assets/wrong.mp3");

correctSound.preload="auto";
wrongSound.preload="auto";

function playCorrect(){

correctSound.pause();
correctSound.currentTime=0;
correctSound.play();

}

function playWrong(){

wrongSound.pause();
wrongSound.currentTime=0;
wrongSound.play();

}

const volumeSlider =
document.getElementById("volumeSlider");

function updateVolume(){

correctSound.volume =
volumeSlider.value;

wrongSound.volume =
volumeSlider.value;

}

volumeSlider.addEventListener(
"input",
updateVolume
);

updateVolume();

/* GAME */

let chef =
document.getElementById("chef");

let score = 0;
let correct = 0;
let wrong = 0;

let gameRunning = false;

let chefX = window.innerWidth / 2;

const foods = [
"🍔","🍕","🍟","🥤","🌭","🧁"
];

const badFoods = [
"🔥","💣","🗑️"
];

let catches = 0;

/* QUESTIONS */

const questions = [

{
q:"The burgers on Table 4 ___ frozen.",
o:["is","are","am","be"],
a:1,
e:"'Burgers' is plural."
},

{
q:"The milkshake with extra pickles ___ disgusting!",
o:["taste","tastes","are","have"],
a:1,
e:"'Milkshake' is singular."
},

{
q:"The noodles in the giant pot ___ exploding!",
o:["is","are","was","be"],
a:1,
e:"'Noodles' is plural."
},

{
q:"The chicken near the customers ___ stealing fries!",
o:["is","are","were","have"],
a:0,
e:"'Chicken' is singular."
},

{
q:"The cookies ___ ready!",
o:["is","are","am","be"],
a:1,
e:"'Cookies' is plural."
}

];

let currentQuestion = 0;

/* START */

function startGame(){

document.getElementById("startScreen")
.style.display="none";

gameRunning = true;

spawnFood();

}

/* MOVE CHEF */

document.addEventListener("mousemove",(e)=>{

chefX = e.clientX;

moveChef();

});

document.addEventListener("touchmove",(e)=>{

chefX = e.touches[0].clientX;

moveChef();

});

function moveChef(){

chef.style.left =
chefX + "px";

}

/* FOOD */

function spawnFood(){

if(!gameRunning) return;

const food =
document.createElement("div");

food.classList.add("food");

const isBad =
Math.random() < 0.25;

food.innerHTML =
isBad
? badFoods[Math.floor(Math.random()*badFoods.length)]
: foods[Math.floor(Math.random()*foods.length)];

food.dataset.bad = isBad;

food.style.left =
Math.random() * (window.innerWidth - 60) + "px";

food.style.top = "-60px";

document.getElementById("gameArea")
.appendChild(food);

let speed =
3 + Math.random()*2;

const fall = setInterval(()=>{

food.style.top =
(food.offsetTop + speed) + "px";

const foodRect =
food.getBoundingClientRect();

const chefRect =
chef.getBoundingClientRect();

if(

foodRect.bottom >= chefRect.top &&
foodRect.left < chefRect.right &&
foodRect.right > chefRect.left

){

if(food.dataset.bad === "true"){

score -= 10;

playWrong();

flashRed();

}else{

score += 10;

catches++;

playCorrect();

createConfetti();

}

updateScore();

food.remove();

clearInterval(fall);

if(catches >= 5){

gameRunning = false;

setTimeout(()=>{

showQuestion();

},500);

}

}

if(food.offsetTop > window.innerHeight){

food.remove();
clearInterval(fall);

}

},20);

setTimeout(spawnFood,900);

}

/* SCORE */

function updateScore(){

document.getElementById("score")
.innerHTML = score;

}

/* FLASH */

function flashRed(){

document.body.style.background =
"darkred";

setTimeout(()=>{

document.body.style.background =
"#111";

},300);

}

/* QUESTIONS */

function showQuestion(){

document.getElementById("questionBox")
.style.display="block";

const q = questions[currentQuestion];

document.getElementById("questionText")
.innerHTML = q.q;

const options =
document.getElementById("options");

options.innerHTML = "";

q.o.forEach((option,index)=>{

const btn =
document.createElement("button");

btn.classList.add("optionBtn");

btn.innerHTML = option;

btn.onclick = ()=>checkAnswer(index);

options.appendChild(btn);

});

}

function checkAnswer(selected){

document.getElementById("questionBox")
.style.display="none";

const q = questions[currentQuestion];

document.getElementById("feedback")
.style.display="block";

if(selected === q.a){

correct++;

score += 50;

playCorrect();

createConfetti();

document.getElementById("feedbackTitle")
.innerHTML = "✅ BONUS EARNED!";

document.getElementById("feedbackTitle")
.style.color = "green";

document.getElementById("feedbackText")
.innerHTML = q.e;

}else{

wrong++;

playWrong();

document.getElementById("feedbackTitle")
.innerHTML = "❌ WRONG ORDER!";

document.getElementById("feedbackTitle")
.style.color = "red";

document.getElementById("feedbackText")
.innerHTML =
`
Correct Answer:
<b>${q.o[q.a]}</b>
<br><br>
${q.e}
`;

}

document.getElementById("correct")
.innerHTML = correct;

document.getElementById("wrong")
.innerHTML = wrong;

updateScore();

currentQuestion++;

setTimeout(()=>{

document.getElementById("feedback")
.style.display="none";

catches = 0;

if(currentQuestion >= questions.length){

endGame();

}else{

gameRunning = true;

spawnFood();

}

},2500);

}

/* END */

function endGame(){

document.getElementById("endScreen")
.style.display="flex";

let percent =
Math.round((correct/questions.length)*100);

document.getElementById("finalText")
.innerHTML =
`
⭐ Final Score: ${score}
<br><br>

✅ Correct Answers: ${correct}
<br><br>

❌ Wrong Answers: ${wrong}
<br><br>

🏆 Accuracy: ${percent}%
`;

}

/* CONFETTI */

function createConfetti(){

for(let i=0;i<20;i++){

const conf =
document.createElement("div");

conf.classList.add("confetti");

conf.style.left =
Math.random()*100 + "%";

conf.style.background =
`hsl(${Math.random()*360},100%,50%)`;

document.body.appendChild(conf);

setTimeout(()=>{
conf.remove();
},3000);

}

}

</script>

</body>
</html>
