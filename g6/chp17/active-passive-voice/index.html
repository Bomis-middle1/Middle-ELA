
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Island Grammar Quest</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(120deg,#0077be,#00c6ff,#ffd166);
background-size:300% 300%;
animation:bg 8s infinite alternate;
overflow-x:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
100%{background-position:100% 50%;}
}

/* SPLASH */
#splash{
position:fixed;
inset:0;
background:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:9999;
}

#splash img{width:180px;}

/* MAIN CARD */
.container{
max-width:850px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
margin-top:20px;
}

/* BUTTONS */
button{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
transition:0.3s;
background:#e8f6ff;
}

button:hover{
background:#cdefff;
transform:scale(1.02);
}

.correct{
background:#b7f7c1 !important;
animation:pop 0.4s;
}

.wrong{
background:#ffb3b3 !important;
animation:shake 0.3s;
}

@keyframes pop{50%{transform:scale(1.1);}}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-5px);}
50%{transform:translateX(5px);}
75%{transform:translateX(-5px);}
100%{transform:translateX(0);}
}

/* PROGRESS BAR */
#bar{
height:12px;
background:#eee;
border-radius:20px;
overflow:hidden;
margin:10px 0;
}

#fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#ffd166,#ff9f1c);
transition:0.4s;
}

/* COINS */
.coin{
position:fixed;
font-size:24px;
animation:float 2.8s linear forwards;
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-220px);opacity:0;}
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
<img src="assets/innovine-logo.png">
<h2>Treasure Island Quest</h2>
<p>Active & Passive Voice</p>
</div>

<div class="container">

<div class="card">

<h2>🏝️ Grammar Quest</h2>

<label>Volume:
<input type="range" id="vol" min="0" max="1" step="0.1" value="1">
</label>

<p>Score: <span id="score">0</span>/10</p>

<div id="bar"><div id="fill"></div></div>

<h3 id="q"></h3>
<div id="options"></div>

</div>

<div id="end" class="card" style="display:none">
<h2>🎉 Treasure Master!</h2>
<p id="result"></p>
<button onclick="location.reload()">Play Again</button>
</div>

</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

setTimeout(()=>{
document.getElementById("splash").style.display="none";
},5000);

/* YOUR EXACT QUESTIONS */
const questions = [
{
q:"During a class presentation, Mia says: 'I created the poster myself.' This sentence is:",
a:"Active voice",
o:["Passive voice","Active voice","Future tense","Question"]
},
{
q:"The school newsletter says: 'The science fair was organized by the Grade 6 students.' This is:",
a:"Passive voice",
o:["Active voice","Passive voice","Present tense","Command"]
},
{
q:"Which focuses more on who performed the action?",
a:"The students decorated the classroom.",
o:["The classroom was decorated by the students.","The students decorated the classroom.","The classroom was being decorated.","The classroom had been decorated."]
},
{
q:"The homework was completed by Arjun. Choose active voice:",
a:"Arjun completed the homework.",
o:["Arjun completed the homework.","Homework completed Arjun.","Arjun was completed.","Homework is Arjun."]
},
{
q:"The chef cooked the meal. Choose passive voice:",
a:"The meal was cooked by the chef.",
o:["Chef cooked meal.","The meal was cooked by the chef.","Chef is cooking meal.","Meal cooks chef."]
},
{
q:"I washed the dishes. This is:",
a:"Active voice",
o:["Passive voice","Active voice","Question","Command"]
},
{
q:"Which focuses more on the action?",
a:"The picture was painted by Emma.",
o:["Emma painted the picture.","The picture was painted by Emma.","Emma paints.","Emma will paint."]
},
{
q:"All windows were cleaned yesterday. This is:",
a:"Passive voice",
o:["Active voice","Passive voice","Question","Statement"]
},
{
q:"The teacher checked the homework. This is:",
a:"Active voice",
o:["Homework was checked by teacher.","The teacher checked the homework.","Homework checked teacher.","Homework is checked."]
},
{
q:"Why use passive voice?",
a:"To focus on action/result",
o:["Hide meaning","Focus on action/result","Make confusion","Shorten words"]
}
];

let i=0, score=0;

function load(){
let q = questions[i];
document.getElementById("q").innerText = q.q;

let box = document.getElementById("options");
box.innerHTML="";

q.o.sort(()=>Math.random()-0.5).forEach(opt=>{
let b=document.createElement("button");
b.innerText=opt;

b.onclick=()=>{
check(opt,q.a,b);
};

box.appendChild(b);
});
}

function check(sel, correct, btn){

let vol=document.getElementById("vol").value;
correctSound.volume=vol;
wrongSound.volume=vol;

if(sel===correct){
btn.classList.add("correct");
correctSound.play();
score++;
document.getElementById("score").innerText=score;
coin();
}
else{
btn.classList.add("wrong");
wrongSound.play();
}

i++;
updateBar();

setTimeout(()=>{
if(i<questions.length){
load();
}else{
end();
}
},900);
}

function updateBar(){
document.getElementById("fill").style.width=(i/questions.length*100)+"%";
}

function coin(){
let c=document.createElement("div");
c.className="coin";
c.innerHTML="🪙";
c.style.left=Math.random()*80+"%";
document.body.appendChild(c);
setTimeout(()=>c.remove(),2800);
}

function end(){
clapSound.play();
document.getElementById("end").style.display="block";
document.getElementById("result").innerText="Score: "+score+"/10";
}

setTimeout(load,5000);

</script>

</body>
</html>
