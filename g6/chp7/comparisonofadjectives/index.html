<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏁 Robot Racing Championship</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{overflow:hidden;background:black;}

#gameArea{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:linear-gradient(to bottom,#0f2027,#203a43,#2c5364);
}

/* LIGHTS */
.light{
position:absolute;
width:350px;
height:350px;
background:rgba(255,255,255,0.05);
border-radius:50%;
filter:blur(60px);
animation:moveLight 12s infinite alternate;
}
.light2{animation-duration:18s;}

@keyframes moveLight{
from{transform:translate(-120px,-60px);}
to{transform:translate(250px,150px);}
}

/* LOGO */
#logoScreen{
position:absolute;width:100%;height:100%;
background:white;display:flex;
justify-content:center;align-items:center;
flex-direction:column;z-index:9999;
}
#logoScreen img{width:260px;max-width:80%;}

/* START */
#startScreen{
position:absolute;width:100%;height:100%;
background:rgba(0,0,0,0.85);
display:none;justify-content:center;align-items:center;
flex-direction:column;color:white;z-index:5000;
}

.mainBtn{
padding:16px 34px;font-size:22px;
border:none;border-radius:18px;
background:#ff9800;color:white;
cursor:pointer;
}

/* TITLE */
#arenaTitle{
position:absolute;top:15px;left:50%;
transform:translateX(-50%);
width:88%;
background:white;border:8px solid #00e5ff;
border-radius:20px;
text-align:center;
font-size:28px;font-weight:bold;
padding:15px;
z-index:50;
}

/* CHALLENGE */
#challengeBox{
position:absolute;top:135px;left:50%;
transform:translateX(-50%);
background:#fff9c4;
padding:18px 30px;
border-radius:18px;
font-size:26px;
font-weight:bold;
z-index:200;
}

/* TRACK */
#track{
position:absolute;
top:290px;left:50%;
transform:translateX(-50%);
width:90%;height:300px;
background:#424242;
border-radius:25px;
border:8px solid #212121;
}

.robot{
position:absolute;
font-size:70px;
left:20px;
transition:left 0.15s linear;
}

#robot1{top:20px;}
#robot2{top:110px;}
#robot3{top:205px;}

/* CHOICES */
#robotChoices{
position:absolute;
bottom:45px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:25px;
}

.choiceBtn{
width:110px;height:110px;
border:none;border-radius:22px;
font-size:60px;
}

/* QUESTION */
#questionBox{
position:absolute;
top:50%;left:50%;
transform:translate(-50%,-50%);
width:92%;
background:#fff8e1;
padding:28px;
border-radius:25px;
display:none;
z-index:4500;
}

.optionBtnQuestion{
width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:15px;
background:#4caf50;
color:white;
font-size:18px;
}

#feedback{
text-align:center;
font-size:28px;
font-weight:bold;
margin-top:10px;
}

.correct{color:green;}
.wrong{color:red;}
</style>
</head>

<body>

<div id="gameArea">

<div id="logoScreen">
<img src="assets/innovine-logo.png">
</div>

<div id="startScreen">
<h1>🏁 Robot Racing Championship</h1>
<button class="mainBtn" onclick="startGame()">Start</button>
</div>

<div id="arenaTitle">🤖 Choose the Best Robot!</div>
<div id="challengeBox">Choose the FASTEST robot!</div>

<div id="track">
<div class="robot" id="robot1">🤖</div>
<div class="robot" id="robot2">🦾</div>
<div class="robot" id="robot3">⚙️</div>
</div>

<div id="robotChoices">
<button class="choiceBtn" onclick="startRace(1)">🤖</button>
<button class="choiceBtn" onclick="startRace(2)">🦾</button>
<button class="choiceBtn" onclick="startRace(3)">⚙️</button>
</div>

<div id="questionBox">
<div id="questionText"></div>
<div id="options"></div>
<div id="feedback"></div>
</div>

</div>

<script>

/* STATE */
let raceDone = false;
let qIndex = 0;

/* LOGO */
setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";
},5000);

function startGame(){
document.getElementById("startScreen").style.display="none";
}

/* QUESTIONS */
const questions=[
{q:"Fastest robot?",o:["A","B","C","D"],a:2},
{q:"Second question?",o:["A","B","C","D"],a:1},
{q:"Third question?",o:["A","B","C","D"],a:0}
];

/* RACE (ONLY ONCE) */
function startRace(choice){

if(raceDone){
showQuestion();
return;
}

let robots=[robot1,robot2,robot3];
robots.forEach(r=>r.style.left="20px");

let pos=[20,20,20];
let speed=[2,2,2];
speed[choice-1]+=2;

let race=setInterval(()=>{

for(let i=0;i<3;i++){
pos[i]+=speed[i];
robots[i].style.left=pos[i]+"px";

if(pos[i]>window.innerWidth*0.7){
clearInterval(race);
raceDone=true;
showQuestion();
return;
}
}
},40);
}

/* QUESTIONS ONLY FLOW */
function showQuestion(){
document.getElementById("questionBox").style.display="block";
let q=questions[qIndex];
document.getElementById("questionText").innerHTML=q.q;

let optDiv=document.getElementById("options");
optDiv.innerHTML="";

q.o.forEach((op,i)=>{
let b=document.createElement("button");
b.className="optionBtnQuestion";
b.innerHTML=op;
b.onclick=()=>check(i,q.a);
optDiv.appendChild(b);
});
}

function check(sel,ans){

let fb=document.getElementById("feedback");

if(sel===ans){
fb.innerHTML="Correct!";
fb.className="correct";
}else{
fb.innerHTML="Wrong!";
fb.className="wrong";
}

qIndex++;

setTimeout(()=>{
document.getElementById("questionBox").style.display="none";

if(qIndex<questions.length){
showQuestion();
}else{
alert("Game Over!");
}
},1200);
}

</script>

</body>
</html>
