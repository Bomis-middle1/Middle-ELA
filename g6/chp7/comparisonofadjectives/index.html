<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏁 Robot Race + Adjective Learning Game</title>

<style>
body{
margin:0;
font-family:Arial;
overflow:hidden;
background:linear-gradient(to bottom,#0f2027,#203a43,#2c5364);
}

/* SCREENS */
.screen{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:white;
z-index:9999;
}

/* GAME */
#game{
display:none;
width:100vw;
height:100vh;
position:relative;
}

/* SCORE */
#scoreBoard{
position:absolute;
top:10px;
left:10px;
background:white;
padding:10px 14px;
border-radius:10px;
font-weight:bold;
}

/* TITLE */
#title{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
background:white;
padding:10px 14px;
border-radius:10px;
font-weight:bold;
width:80%;
text-align:center;
}

/* INTRO RACE */
#track{
position:absolute;
top:35%;
left:50%;
transform:translate(-50%,-50%);
width:90%;
height:220px;
background:#222;
border-radius:20px;
overflow:hidden;
}

.lane{
position:absolute;
width:100%;
height:33%;
border-bottom:2px dashed white;
}

.robot{
position:absolute;
font-size:60px;
left:0;
}

#r1{top:20px;}
#r2{top:80px;}
#r3{top:140px;}

/* BUTTONS */
.robotBtns{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:20px;
}

.btn{
padding:15px;
font-size:40px;
border:none;
border-radius:12px;
cursor:pointer;
background:white;
}

/* QUESTION */
#questionBox{
display:none;
position:absolute;
inset:0;
background:rgba(0,0,0,0.92);
color:white;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.option{
width:80%;
padding:12px;
margin:8px;
border:none;
border-radius:10px;
background:#4caf50;
color:white;
}

/* END */
#end{
display:none;
position:fixed;
inset:0;
background:white;
justify-content:center;
align-items:center;
flex-direction:column;
}

</style>
</head>

<body>

<!-- INTRO SCREEN -->
<div id="intro" class="screen">
<h1>🏁 Choose the Fastest Robot!</h1>

<div id="track">
<div class="lane"></div>
<div class="lane" style="top:33%"></div>
<div class="lane" style="top:66%"></div>

<div class="robot" id="r1">🤖</div>
<div class="robot" id="r2">🦾</div>
<div class="robot" id="r3">⚙️</div>
</div>

<div class="robotBtns">
<button class="btn" onclick="pick(1)">🤖</button>
<button class="btn" onclick="pick(2)">🦾</button>
<button class="btn" onclick="pick(3)">⚙️</button>
</div>

<h3 id="introMsg"></h3>
<button id="startBtn" style="display:none;padding:10px;margin-top:10px;" onclick="startGame()">Start Game</button>
</div>

<!-- GAME -->
<div id="game">

<div id="scoreBoard">
Score: <span id="score">0</span> | Q: <span id="qno">0</span>/10
</div>

<div id="title">📚 Adjective Learning Game</div>

<div id="questionBox">
<h2 id="qText"></h2>
<div id="opts"></div>
<div id="fb"></div>
</div>

</div>

<!-- END -->
<div id="end">
<h1>🎉 Completed</h1>
<h2 id="final"></h2>
<button onclick="location.reload()">Restart</button>
</div>

<script>

/* INTRO RACE ENGINE */
let chosen=-1;
let correct=2;

let pos=[0,0,0];
let speeds=[2,2,2];

function animate(){
pos[0]+=speeds[0];
pos[1]+=speeds[1];
pos[2]+=speeds[2];

document.getElementById("r1").style.left=pos[0]+"px";
document.getElementById("r2").style.left=pos[1]+"px";
document.getElementById("r3").style.left=pos[2]+"px";

let boost=correct-1;
speeds[boost]=4;

if(pos[boost]>600){
return;
}

requestAnimationFrame(animate);
}

animate();

/* PICK ROBOT */
function pick(id){
chosen=id;

if(id===correct){
document.getElementById("introMsg").innerText="🎉 Correct Robot Wins!";
}else{
document.getElementById("introMsg").innerText="❌ Good Try!";
}

document.getElementById("startBtn").style.display="block";
}

/* START GAME */
function startGame(){
document.getElementById("intro").style.display="none";
document.getElementById("game").style.display="block";
loadQ();
}

/* QUESTIONS */
let qIndex=0;
let score=0;
let attempt=0;

let qs=[
{q:"Which is adjective of quality?",o:["beautiful","run","apple"],a:0},
{q:"Which is adjective of number?",o:["many","run","blue"],a:0},
{q:"Which is demonstrative?",o:["this","eat","jump"],a:0}
];

qs.sort(()=>Math.random()-0.5);

function loadQ(){
if(qIndex>=qs.length){
end();
return;
}

let q=qs[qIndex];
document.getElementById("questionBox").style.display="flex";
document.getElementById("qText").innerText=q.q;

let box=document.getElementById("opts");
box.innerHTML="";
document.getElementById("fb").innerText="";

q.o.forEach((x,i)=>{
let b=document.createElement("button");
b.className="option";
b.innerText=x;
b.onclick=()=>check(i,q.a);
box.appendChild(b);
});
}

function check(sel,ans){
let fb=document.getElementById("fb");

if(sel===ans){
score++;
document.getElementById("score").innerText=score;
fb.innerText="Correct!";
qIndex++;
attempt=0;
setTimeout(loadQ,1000);
}else{
attempt++;
fb.innerText=attempt<2?"Try again":"Answer revealed";
if(attempt>=2){
qIndex++;
attempt=0;
setTimeout(loadQ,1000);
}
}
}

function end(){
document.getElementById("game").style.display="none";
document.getElementById("end").style.display="flex";
document.getElementById("final").innerText="Score: "+score;
}

</script>

</body>
</html>
