<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏁 Robot Racing Championship</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:black;
}

#gameArea{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:
linear-gradient(to bottom,#0f2027,#203a43,#2c5364);
}

/* LIGHTS */

.light{
position:absolute;
width:350px;
height:350px;
background:rgba(255,255,255,0.05);
border-radius:50%;
filter:blur(60px);
animation:moveLight 12s infinite alternate;
}

.light2{
animation-duration:18s;
}

@keyframes moveLight{
from{
transform:translate(-120px,-60px);
}
to{
transform:translate(250px,150px);
}
}

/* LOGO */

#logoScreen{
position:absolute;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

#logoScreen img{
width:260px;
max-width:80%;
}

#logoText{
margin-top:20px;
font-size:32px;
font-weight:bold;
color:#333;
}

/* START + END */

#startScreen,
#endScreen{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
color:white;
z-index:5000;
}

.mainBtn{
padding:16px 34px;
font-size:22px;
border:none;
border-radius:18px;
background:#ff9800;
color:white;
cursor:pointer;
margin-top:25px;
transition:0.3s;
}

.mainBtn:hover{
transform:scale(1.05);
background:#f57c00;
}

/* TITLE */

#arenaTitle{
position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
width:82%;
height:95px;
background:white;
border:8px solid #00e5ff;
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
font-weight:bold;
color:#006064;
box-shadow:0 0 25px rgba(255,255,255,0.6);
z-index:50;
padding:10px;
text-align:center;
}

/* TRACK */

#track{
position:absolute;
top:230px;
left:50%;
transform:translateX(-50%);
width:90%;
height:320px;
background:#424242;
border-radius:25px;
overflow:hidden;
border:8px solid #212121;
}

.lane{
position:absolute;
width:100%;
height:33.33%;
border-bottom:4px dashed white;
}

#finishLine{
position:absolute;
right:40px;
top:0;
width:20px;
height:100%;
background:
repeating-linear-gradient(
white 0px,
white 20px,
black 20px,
black 40px
);
}

/* ROBOTS */

.robot{
position:absolute;
font-size:70px;
left:20px;
transition:left 0.15s linear;
filter:drop-shadow(0 0 12px cyan);
}

#robot1{top:25px;}
#robot2{top:125px;}
#robot3{top:225px;}

/* CHALLENGE */

#challengeBox{
position:absolute;
bottom:210px;
left:50%;
transform:translateX(-50%);
background:#fff9c4;
padding:18px 30px;
border-radius:18px;
font-size:28px;
font-weight:bold;
color:#e65100;
z-index:200;
text-align:center;
box-shadow:0 0 20px rgba(0,0,0,0.3);
max-width:90%;
}

/* CHOICES */

#robotChoices{
position:absolute;
bottom:45px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:25px;
z-index:300;
flex-wrap:wrap;
justify-content:center;
}

.choiceBtn{
width:110px;
height:110px;
border:none;
border-radius:22px;
font-size:60px;
cursor:pointer;
background:white;
transition:0.3s;
box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.choiceBtn:hover{
transform:scale(1.12);
background:#b2ebf2;
}

/* SCORE */

#scoreBoard{
position:absolute;
top:15px;
left:15px;
background:white;
padding:12px 18px;
border-radius:15px;
font-size:20px;
font-weight:bold;
z-index:300;
}

/* VOLUME */

#volumeBox{
position:absolute;
top:15px;
right:15px;
background:white;
padding:12px;
border-radius:15px;
z-index:300;
}

/* WIN */

#winMessage{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:58px;
font-weight:bold;
color:#ffee58;
text-shadow:0 0 20px gold;
display:none;
z-index:4000;
animation:pop 0.8s;
}

/* QUESTIONS */

#questionBox{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:92%;
max-width:680px;
background:#fff8e1;
padding:28px;
border-radius:25px;
display:none;
z-index:4500;
box-shadow:0 0 25px rgba(0,0,0,0.5);
animation:popup 0.5s;
}

#questionTitle{
font-size:30px;
color:#e65100;
margin-bottom:18px;
text-align:center;
}

#questionText{
font-size:23px;
line-height:1.6;
margin-bottom:20px;
color:#333;
}

.optionBtn{
width:100%;
padding:16px;
margin:10px 0;
border:none;
border-radius:15px;
background:#4caf50;
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

.optionBtn:hover{
background:#388e3c;
transform:scale(1.03);
}

/* FEEDBACK */

#feedback{
text-align:center;
font-size:30px;
font-weight:bold;
margin-top:15px;
}

.correct{
color:green;
}

.wrong{
color:red;
}

/* CONFETTI */

.confetti{
position:absolute;
width:12px;
height:12px;
animation:fall 3s linear forwards;
}

@keyframes fall{
from{
transform:translateY(-100px) rotate(0deg);
}
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

@keyframes pop{
0%{
transform:translate(-50%,-50%) scale(0.5);
}
100%{
transform:translate(-50%,-50%) scale(1.15);
}
}

@keyframes popup{
from{
transform:translate(-50%,-50%) scale(0.5);
opacity:0;
}
to{
transform:translate(-50%,-50%) scale(1);
opacity:1;
}
}

/* MOBILE */

@media(max-width:768px){

.robot{
font-size:48px;
}

.choiceBtn{
width:80px;
height:80px;
font-size:42px;
}

#challengeBox{
font-size:18px;
width:90%;
bottom:190px;
}

#questionText{
font-size:18px;
}

.optionBtn{
font-size:16px;
}

#arenaTitle{
font-size:20px;
height:80px;
}

#winMessage{
font-size:34px;
}

#track{
height:260px;
top:220px;
}

#robot1{top:18px;}
#robot2{top:95px;}
#robot3{top:175px;}

}

</style>
</head>

<body>

<div id="gameArea">

<div class="light"></div>
<div class="light light2"></div>

<!-- LOGO -->

<div id="logoScreen">
<img src="assets/innovine-logo.png">
<div id="logoText">Innovine Learning Adventures</div>
</div>

<!-- START -->

<div id="startScreen" style="display:none;">

<h1 style="font-size:52px;">🏁 Robot Racing Championship</h1>

<p style="margin-top:20px;font-size:24px;max-width:700px;">
Win robot races and master adjective comparisons!
</p>

<button class="mainBtn" onclick="startGame()">
Start Racing
</button>

</div>

<!-- END -->

<div id="endScreen" style="display:none;">

<h1>🏆 Championship Complete! 🏆</h1>

<h2 id="finalText" style="margin-top:20px;"></h2>

<button class="mainBtn" onclick="restartGame()">
Race Again
</button>

</div>

<!-- TITLE -->

<div id="arenaTitle">
🤖 Choose the Best Robot and Win the Race!
</div>

<!-- SCORE -->

<div id="scoreBoard">
Wins: <span id="raceCount">0</span> |
Questions: <span id="questionCount">0</span>/10
</div>

<!-- VOLUME -->

<div id="volumeBox">
Volume
<input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
</div>

<!-- TRACK -->

<div id="track">

<div class="lane" style="top:0;"></div>
<div class="lane" style="top:33%;"></div>

<div id="finishLine"></div>

<div class="robot" id="robot1">🤖</div>
<div class="robot" id="robot2">🦾</div>
<div class="robot" id="robot3">⚙️</div>

</div>

<!-- CHALLENGE -->

<div id="challengeBox">
Choose the FASTEST robot!
</div>

<!-- CHOICES -->

<div id="robotChoices">

<button class="choiceBtn" onclick="startRace(1)">🤖</button>
<button class="choiceBtn" onclick="startRace(2)">🦾</button>
<button class="choiceBtn" onclick="startRace(3)">⚙️</button>

</div>

<!-- WIN -->

<div id="winMessage">
🏆 RACE WON!
</div>

<!-- QUESTIONS -->

<div id="questionBox">

<div id="questionTitle">
📚 Race Challenge
</div>

<div id="questionText"></div>

<div id="options"></div>

<div id="feedback"></div>

</div>

</div>

<script>

setTimeout(()=>{

document.getElementById("logoScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";

},5000);

/* AUDIO */

const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/clapping.mp3");

const volumeSlider = document.getElementById("volumeSlider");

function updateVolume(){

correctSound.volume = volumeSlider.value;
wrongSound.volume = volumeSlider.value;
clapSound.volume = volumeSlider.value;

}

volumeSlider.addEventListener("input",updateVolume);

updateVolume();

let racesWon = 0;
let currentQuestion = 0;

/* STORY QUESTIONS */

const questions = [

{
q:`🏁 During the semifinal race, Robo-X moved faster than Bolt-7, but Turbo Max moved the fastest of all.<br><br>
Which robot was the fastest?`,
o:["Robo-X","Bolt-7","Turbo Max","all tied"],
a:2
},

{
q:`🤖 Mia built a strong robot for the competition.<br><br>
Her brother upgraded his robot to make it even ___.`,
o:["strongest","stronger","strong","more strongest"],
a:1
},

{
q:`🎤 The announcer shouted:<br><br>
"This is the most exciting race our city has ever seen!"<br><br>
What kind of comparison is "most exciting"?`,
o:["positive","comparative","superlative","none"],
a:2
},

{
q:`⚡ Three racing robots crossed the river obstacle.<br><br>
The blue robot was fast.<br>
The red robot was faster.<br>
The silver robot was the fastest.<br><br>
Which robot came second in speed?`,
o:["blue","red","silver","none"],
a:1
},

{
q:`🏆 Coach Lina told her team:<br><br>
"We need the safest robot for the night race."<br><br>
Which word shows the highest level of comparison?`,
o:["need","robot","safest","night"],
a:2
},

{
q:`🚀 Aryan tested two rocket engines after school.<br><br>
The first engine was powerful, but the second one was more powerful.<br><br>
What does "more powerful" compare?`,
o:["one engine","two engines","all engines","none"],
a:1
},

{
q:`🤖 Zoya's robot was smaller than Ethan's robot, but it was quicker during turns.<br><br>
Which robot was bigger?`,
o:["Zoya's","Ethan's","same size","unknown"],
a:1
},

{
q:`🏁 The crowd became louder as the final race began.<br><br>
Later, during the championship round, the crowd became the loudest it had been all day.<br><br>
Which sentence uses a superlative adjective?`,
o:[
"louder as the race began",
"crowd became the loudest",
"final race began",
"all day"
],
a:1
},

{
q:`🛠️ Three students designed robots for science class.<br><br>
Leo's robot was smart.<br>
Noah's robot was smarter.<br>
Ava's robot was the smartest.<br><br>
Who built the best robot?`,
o:["Leo","Noah","Ava","all equal"],
a:2
},

{
q:`🎮 During practice, Team Falcon's robot moved quickly through the maze.<br><br>
In the final match, it moved even ___.`,
o:["quickest","quickly","quicker","more quickly"],
a:3
}

];

questions.sort(()=>Math.random()-0.5);

function startGame(){

document.getElementById("startScreen").style.display="none";

}

function startRace(choice){

const robots = [
document.getElementById("robot1"),
document.getElementById("robot2"),
document.getElementById("robot3")
];

robots.forEach(robot=>{

robot.style.left = "20px";

});

let speeds = [
2 + Math.random()*2,
2 + Math.random()*2,
2 + Math.random()*2
];

speeds[choice-1] += 2;

let positions = [20,20,20];

let race = setInterval(()=>{

for(let i=0;i<3;i++){

positions[i] += speeds[i];

robots[i].style.left = positions[i]+"px";

if(positions[i] >= window.innerWidth*0.72){

clearInterval(race);

if(i === choice-1){

raceWon();

}else{

wrongSound.play();

}

}

}

},40);

}

function raceWon(){

racesWon++;

document.getElementById("raceCount").innerText =
racesWon;

document.getElementById("winMessage").style.display =
"block";

clapSound.play();

createConfetti();

setTimeout(()=>{

document.getElementById("winMessage").style.display =
"none";

showQuestion();

},1500);

}

function showQuestion(){

document.getElementById("questionBox").style.display =
"block";

const q = questions[currentQuestion];

document.getElementById("questionText").innerHTML = q.q;

const optionsDiv = document.getElementById("options");

optionsDiv.innerHTML = "";

document.getElementById("feedback").innerHTML = "";

q.o.forEach((option,index)=>{

const btn = document.createElement("button");

btn.classList.add("optionBtn");

btn.innerHTML = option;

btn.onclick = ()=>checkAnswer(index,q.a);

optionsDiv.appendChild(btn);

});

}

function checkAnswer(selected,correct){

const feedback = document.getElementById("feedback");

if(selected === correct){

feedback.innerHTML = "🎉 Correct!";
feedback.className = "correct";

correctSound.play();

createConfetti();

}else{

feedback.innerHTML = "❌ Wrong!";
feedback.className = "wrong";

wrongSound.play();

}

currentQuestion++;

document.getElementById("questionCount").innerText =
currentQuestion;

setTimeout(()=>{

document.getElementById("questionBox").style.display =
"none";

if(currentQuestion >= 10){

endGame();

}

},1800);

}

function createConfetti(){

for(let i=0;i<45;i++){

const conf = document.createElement("div");

conf.classList.add("confetti");

conf.style.left = Math.random()*100 + "%";

conf.style.background =
`hsl(${Math.random()*360},100%,50%)`;

conf.style.animationDuration =
(2 + Math.random()*2) + "s";

document.body.appendChild(conf);

setTimeout(()=>{

conf.remove();

},4000);

}

}

function endGame(){

document.getElementById("endScreen").style.display =
"flex";

document.getElementById("finalText").innerHTML =
"You won <b>" + racesWon +
"</b> robot races and completed all comparison challenges!";

}

function restartGame(){

location.reload();

}

</script>

</body>
</html>
