<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏁 Robot Racing Championship</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:linear-gradient(to bottom,#0f2027,#203a43,#2c5364);
}

/* LOGO */
#logoScreen{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

#logoScreen img{
width:260px;
max-width:80%;
}

/* START / END */
#startScreen,#endScreen{
position:absolute;
inset:0;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
text-align:center;
padding:20px;
z-index:5000;
}

.mainBtn{
padding:16px 30px;
font-size:20px;
border:none;
border-radius:15px;
background:#ff9800;
color:white;
margin-top:20px;
cursor:pointer;
}

/* SCORE */
#scoreBoard{
position:absolute;
top:15px;
left:15px;
background:white;
padding:10px 14px;
border-radius:12px;
font-weight:bold;
z-index:200;
}

/* TITLE */
#arenaTitle{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
background:white;
padding:12px 18px;
border-radius:15px;
font-weight:bold;
color:#006064;
width:85%;
text-align:center;
}

/* CHALLENGE */
#challengeBox{
position:absolute;
top:90px;
left:50%;
transform:translateX(-50%);
background:#fff9c4;
padding:14px 18px;
border-radius:14px;
font-weight:bold;
color:#e65100;
text-align:center;
width:85%;
}

/* TRACK */
#track{
position:absolute;
top:200px;
left:50%;
transform:translateX(-50%);
width:90%;
height:300px;
background:#333;
border-radius:20px;
border:6px solid #222;
overflow:hidden;
}

.robot{
position:absolute;
font-size:60px;
left:10px;
transition:left 0.1s linear;
}

#robot1{top:20px;}
#robot2{top:110px;}
#robot3{top:200px;}

/* BUTTONS */
#robotChoices{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:15px;
}

.choiceBtn{
width:90px;
height:90px;
font-size:40px;
border:none;
border-radius:15px;
background:white;
cursor:pointer;
}

/* QUESTION */
#questionBox{
position:absolute;
inset:0;
background:rgba(0,0,0,0.9);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
padding:20px;
text-align:center;
z-index:6000;
}

.optionBtn{
width:90%;
padding:14px;
margin:8px;
border:none;
border-radius:10px;
font-size:16px;
background:#4caf50;
color:white;
}

/* FEEDBACK */
#feedback{
margin-top:10px;
font-size:20px;
font-weight:bold;
}

.correct{color:#00e676;}
.wrong{color:#ff5252;}

</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
<img src="assets/innovine-logo.png">
</div>

<!-- START -->
<div id="startScreen" style="display:none;">
<h1>🏁 Robot Racing Championship</h1>
<button class="mainBtn" onclick="startGame()">Start Race</button>
</div>

<!-- END -->
<div id="endScreen" style="display:none;">
<h1>🏆 Game Complete</h1>
<h2 id="finalText"></h2>
<button class="mainBtn" onclick="restartGame()">Play Again</button>
</div>

<!-- SCORE -->
<div id="scoreBoard">
Score: <span id="score">0</span> | Q: <span id="qcount">0</span>/10
</div>

<!-- TITLE -->
<div id="arenaTitle">🤖 Choose Correct Robot Based on Logic</div>

<!-- CHALLENGE -->
<div id="challengeBox"></div>

<!-- TRACK -->
<div id="track">
<div class="robot" id="robot1">🤖</div>
<div class="robot" id="robot2">🦾</div>
<div class="robot" id="robot3">⚙️</div>
</div>

<!-- CHOICES -->
<div id="robotChoices">
<button class="choiceBtn" onclick="choose(1)">🤖</button>
<button class="choiceBtn" onclick="choose(2)">🦾</button>
<button class="choiceBtn" onclick="choose(3)">⚙️</button>
</div>

<!-- QUESTION -->
<div id="questionBox">
<h2 id="questionText"></h2>
<div id="options"></div>
<div id="feedback"></div>
</div>

<script>

/* LOGO */
setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";
},5000);

/* SOUND */
const clap=new Audio("assets/clapping.mp3");
const wrong=new Audio("assets/wrong.mp3");

/* DATA */
let score=0;
let qIndex=0;
let selectedRobot=null;
let attempt=0;

const questions=[
{
q:"Which robot is fastest?",
correct:3,
explain:"Turbo Bot has highest speed (SUPERLATIVE)"
},
{
q:"Which robot is stronger?",
correct:2,
explain:"Bolt-X has more power (COMPARATIVE)"
},
{
q:"Which is safest robot?",
correct:1,
explain:"Robo-A has best safety rating (SUPERLATIVE)"
}
];

function startGame(){
document.getElementById("startScreen").style.display="none";
loadQuestion();
}

function loadQuestion(){

if(qIndex>=questions.length){
endGame();
return;
}

selectedRobot=null;
attempt=0;

let q=questions[qIndex];
document.getElementById("challengeBox").innerHTML=q.q;

resetRobots();
}

function resetRobots(){
for(let i=1;i<=3;i++){
document.getElementById("robot"+i).style.left="10px";
}
}

function choose(id){
selectedRobot=id;
showQuestion();
}

function showQuestion(){

let q=questions[qIndex];

document.getElementById("questionBox").style.display="flex";
document.getElementById("questionText").innerText=q.explain;

let opt=document.getElementById("options");
opt.innerHTML="";

for(let i=1;i<=3;i++){
let b=document.createElement("button");
b.className="optionBtn";
b.innerText="Select Robot "+i;
b.onclick=()=>runRace(i,q.correct);
opt.appendChild(b);
}
}

function runRace(choice,correct){

let robots=[
document.getElementById("robot1"),
document.getElementById("robot2"),
document.getElementById("robot3")
];

let pos=[10,10,10];
let speed=[2,2,2];

speed[correct-1]+=3;

let race=setInterval(()=>{

for(let i=0;i<3;i++){
pos[i]+=speed[i];
robots[i].style.left=pos[i]+"px";

if(pos[i]>600){
clearInterval(race);

if(choice===correct){
score++;
clap.play();
document.getElementById("score").innerText=score;
}
else{
wrong.play();
}

nextQ();
}
}

},30);
}

function nextQ(){
document.getElementById("questionBox").style.display="none";
qIndex++;
document.getElementById("qcount").innerText=qIndex;
loadQuestion();
}

function endGame(){
document.getElementById("endScreen").style.display="flex";
document.getElementById("finalText").innerText=
"Score: "+score+" / "+questions.length;
}

function restartGame(){
location.reload();
}

</script>

</body>
</html>
