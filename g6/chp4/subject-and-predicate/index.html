<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Temple Treasure - Jungle Hunter Edition</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    background:linear-gradient(to bottom,#b3e5fc,#81c784);
}

#gameArea{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* TREES */
.tree{
    position:absolute;
    bottom:120px;
    font-size:100px;
    opacity:0.7;
    z-index:1;
    pointer-events:none;
}

.t1{ left:8%; font-size:90px; }
.t2{ left:25%; font-size:120px; }
.t3{ left:55%; font-size:95px; }
.t4{ left:78%; font-size:130px; }

/* GROUND */
#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:linear-gradient(to top,#5d4037,#8d6e63);
    border-top:6px solid #2e7d32;
    z-index:5;
}

/* PLAYER */
#player{
    position:absolute;
    width:70px;
    height:70px;
    left:80px;
    bottom:120px;
    font-size:55px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:20;
    transition: transform 0.1s linear;
}

#player.right{ transform:scaleX(1); }
#player.left{ transform:scaleX(-1); }

/* jump feel */
.jump{
    transform: translateY(-12px);
}

/* COIN */
.coin{
    position:absolute;
    width:40px;
    height:40px;
    border-radius:50%;
    background:gold;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:10;
}

/* OBSTACLE */
.obstacle{
    position:absolute;
    width:50px;
    height:50px;
    background:#6d4c41;
    bottom:120px;
    border-radius:10px;
    z-index:10;
}

/* SCORE */
#scoreBoard{
    position:absolute;
    top:10px;
    left:10px;
    background:white;
    padding:10px 15px;
    border-radius:10px;
    z-index:50;
}

/* QUESTION */
#questionBox{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:20px;
    width:80%;
    display:none;
    z-index:100;
    border-radius:15px;
}

.optionBtn{
    display:block;
    width:100%;
    margin:10px 0;
    padding:10px;
}

</style>
</head>

<body>

<div id="gameArea">

<!-- TREES -->
<div class="tree t1">🌳</div>
<div class="tree t2">🌴</div>
<div class="tree t3">🌳</div>
<div class="tree t4">🌴</div>

<div id="ground"></div>

<div id="player" class="right">🧑‍🌾</div>

<div id="scoreBoard">
Coins: <span id="coinCount">0</span>
</div>

<div id="questionBox">
<div id="qText"></div>
<div id="options"></div>
</div>

</div>

<script>

let gameRunning = true;

let coins = 0;

let playerY = 120;
let velocity = 0;
let gravity = 0.6;
let jumping = false;

let direction = 1;

const player = document.getElementById("player");
const coinCount = document.getElementById("coinCount");
const gameArea = document.getElementById("gameArea");

let lastTime = 0;

/* GAME LOOP */
function gameLoop(time){

if(!gameRunning) return;

let delta = time - lastTime;
lastTime = time;

velocity += gravity * (delta/16);
playerY -= velocity * (delta/16);

if(playerY <= 120){
    playerY = 120;
    velocity = 0;
    jumping = false;
    player.classList.remove("jump");
}

player.style.bottom = playerY + "px";

requestAnimationFrame(gameLoop);
}

/* JUMP */
function jump(){
if(!jumping){
    velocity = -14;
    jumping = true;
    player.classList.add("jump");
}
}

/* DIRECTION */
document.addEventListener("keydown",(e)=>{

if(e.code==="Space" || e.code==="ArrowUp"){
    jump();
}

if(e.code==="ArrowLeft"){
    direction = -1;
    player.classList.remove("right");
    player.classList.add("left");
}

if(e.code==="ArrowRight"){
    direction = 1;
    player.classList.remove("left");
    player.classList.add("right");
}

});

/* TOUCH */
document.addEventListener("touchstart",()=>{
jump();
});

/* COIN */
function spawnCoin(){

const coin = document.createElement("div");
coin.className = "coin";
coin.innerHTML = "💎";

coin.style.left = window.innerWidth + "px";
coin.style.bottom = (160 + Math.random()*100) + "px";

gameArea.appendChild(coin);

let move = setInterval(()=>{

let left = parseFloat(coin.style.left);
left -= 2.5;

coin.style.left = left + "px";

const c = coin.getBoundingClientRect();
const p = player.getBoundingClientRect();

if(c.left < p.right && c.right > p.left && c.top < p.bottom && c.bottom > p.top){

coins++;
coinCount.innerText = coins;

coin.remove();
clearInterval(move);

}

if(left < -50){
coin.remove();
clearInterval(move);
}

},16);

setTimeout(spawnCoin,2200);
}

/* OBSTACLE */
function spawnObstacle(){

const obs = document.createElement("div");
obs.className = "obstacle";
obs.innerHTML = "🪵";

obs.style.left = window.innerWidth + "px";

gameArea.appendChild(obs);

let move = setInterval(()=>{

let left = parseFloat(obs.style.left);
left -= 3;

obs.style.left = left + "px";

const o = obs.getBoundingClientRect();
const p = player.getBoundingClientRect();

if(o.left < p.right && o.right > p.left && o.top < p.bottom && o.bottom > p.top){
coins = Math.max(0,coins-1);
coinCount.innerText = coins;
obs.remove();
clearInterval(move);
}

if(left < -50){
obs.remove();
clearInterval(move);
}

},16);

setTimeout(spawnObstacle,2800);
}

/* START */
spawnCoin();
spawnObstacle();
requestAnimationFrame(gameLoop);

</script>

</body>
</html>
