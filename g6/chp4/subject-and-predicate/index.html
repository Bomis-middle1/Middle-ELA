<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Temple Treasure - Smooth Edition</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    background:#cfefff;
}

#gameArea{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(to bottom,#87CEEB,#dfffb0);
}

/* PLAYER */
#player{
    position:absolute;
    width:70px;
    height:70px;
    left:80px;
    bottom:120px;
    font-size:55px;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:transform 0.08s linear;
}

/* COIN */
.coin{
    position:absolute;
    width:40px;
    height:40px;
    border-radius:50%;
    background:gold;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* OBSTACLE */
.obstacle{
    position:absolute;
    width:50px;
    height:50px;
    background:#6d4c41;
    bottom:120px;
    border-radius:10px;
}

/* UI */
#scoreBoard{
    position:absolute;
    top:10px;
    left:10px;
    background:white;
    padding:10px;
    border-radius:10px;
    z-index:10;
}

#questionBox{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:20px;
    width:80%;
    display:none;
    z-index:100;
}
.optionBtn{
    display:block;
    width:100%;
    margin:10px 0;
    padding:10px;
}
</style>
</head>

<body>

<div id="gameArea">
<div id="player">🏃</div>

<div id="scoreBoard">
Coins: <span id="coinCount">0</span>
</div>

<div id="questionBox">
<div id="qText"></div>
<div id="options"></div>
</div>
</div>

<script>

/* ===== CORE SETUP ===== */

let gameRunning = true;
let coins = 0;

let playerY = 120;
let velocity = 0;
let gravity = 0.6;
let jumping = false;

let speed = 2.5;
let lastTime = 0;

/* PLAYER */
const player = document.getElementById("player");

/* ===== SMOOTH GAME LOOP ===== */

function gameLoop(time){

if(!gameRunning) return;

let delta = time - lastTime;
lastTime = time;

/* smooth gravity */
velocity += gravity * (delta/16);
playerY -= velocity * (delta/16);

if(playerY <= 120){
    playerY = 120;
    velocity = 0;
    jumping = false;
}

player.style.bottom = playerY + "px";

/* jump animation feel */
player.style.transform = jumping ? "translateY(-8px)" : "translateY(0)";

requestAnimationFrame(gameLoop);
}

/* ===== JUMP ===== */

function jump(){
if(!jumping && gameRunning){
    velocity = -14;
    jumping = true;
}
}

document.addEventListener("keydown",(e)=>{
if(e.code==="Space") jump();
});

document.addEventListener("touchstart",()=>{
jump();
});

/* ===== SPAWN COIN ===== */

function spawnCoin(){

if(!gameRunning) return;

const coin = document.createElement("div");
coin.className = "coin";
coin.innerHTML = "💰";

coin.style.left = window.innerWidth + "px";
coin.style.bottom = (160 + Math.random()*120) + "px";

document.getElementById("gameArea").appendChild(coin);

let move = setInterval(()=>{

if(!gameRunning){
    clearInterval(move);
    coin.remove();
    return;
}

let left = parseFloat(coin.style.left);
left -= speed;

coin.style.left = left + "px";

const c = coin.getBoundingClientRect();
const p = player.getBoundingClientRect();

if(c.left < p.right && c.right > p.left && c.top < p.bottom && c.bottom > p.top){
    coins++;
    document.getElementById("coinCount").innerText = coins;
    coin.remove();
    clearInterval(move);
}

if(left < -50){
    coin.remove();
    clearInterval(move);
}

},16);

setTimeout(spawnCoin,2000);
}

/* ===== SPAWN OBSTACLE ===== */

function spawnObstacle(){

if(!gameRunning) return;

const obs = document.createElement("div");
obs.className = "obstacle";
obs.innerHTML = "🪵";

obs.style.left = window.innerWidth + "px";

document.getElementById("gameArea").appendChild(obs);

let move = setInterval(()=>{

if(!gameRunning){
    clearInterval(move);
    obs.remove();
    return;
}

let left = parseFloat(obs.style.left);
left -= speed + 0.5;

obs.style.left = left + "px";

const o = obs.getBoundingClientRect();
const p = player.getBoundingClientRect();

if(o.left < p.right && o.right > p.left && o.top < p.bottom && o.bottom > p.top){
    coins = Math.max(0, coins - 1);
    document.getElementById("coinCount").innerText = coins;
    obs.remove();
    clearInterval(move);
}

if(left < -50){
    obs.remove();
    clearInterval(move);
}

},16);

setTimeout(spawnObstacle,2800);
}

/* ===== START GAME ===== */

spawnCoin();
spawnObstacle();
requestAnimationFrame(gameLoop);

</script>

</body>
</html>
