<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temple Treasure Grammar Adventure</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#87CEEB;
}

#gameArea{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(to bottom,#87ceeb,#dfffb0);
}

/* 🌳 TREES */
.tree{
    position:absolute;
    bottom:120px;
    font-size:80px;
    z-index:1;
    opacity:0.9;
}
.tree1{left:10%;}
.tree2{left:75%;}

/* LOGO SCREEN */
#logoScreen{
    position:absolute;
    width:100%;
    height:100%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
    flex-direction:column;
}

#logoScreen img{width:250px;}

#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:#8B5A2B;
    border-top:8px solid #4caf50;
}

/* 🏹 PLAYER CHANGED */
#player{
    position:absolute;
    width:70px;
    height:70px;
    left:80px;
    bottom:120px;
    font-size:55px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:20;
}

.coin{
    position:absolute;
    width:40px;
    height:40px;
    background:gold;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

.obstacle{
    position:absolute;
    width:45px;
    height:70px;
    background:#5d4037;
    border-radius:10px;
    bottom:120px;
}

#scoreBoard{
    position:absolute;
    top:10px;
    left:10px;
    background:white;
    padding:12px;
    border-radius:15px;
    font-size:18px;
    font-weight:bold;
    z-index:50;
}

#volumeBox{
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    padding:12px;
    border-radius:15px;
    z-index:50;
}

/* QUESTION BOX */
#questionBox{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:92%;
    max-width:550px;
    background:white;
    border-radius:25px;
    padding:25px;
    display:none;
    z-index:200;
    text-align:center;
}

#questionText{font-size:22px;margin-bottom:20px;}

.optionBtn{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:none;
    border-radius:15px;
    background:#42a5f5;
    color:white;
    font-size:18px;
}

#confetti{position:absolute;width:100%;height:100%;pointer-events:none;}

.confettiPiece{
    position:absolute;
    width:12px;height:12px;
    animation:fall 2s linear forwards;
}

@keyframes fall{
    from{transform:translateY(-100px);}
    to{transform:translateY(100vh) rotate(720deg);}
}

/* SCREENS */
#startScreen,#endScreen{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:500;
}

.mainBtn{
    padding:16px 30px;
    border:none;
    border-radius:18px;
    background:#ff9800;
    color:white;
    font-size:22px;
    margin-top:20px;
    cursor:pointer;
}

</style>
</head>

<body>

<div id="gameArea">

<!-- 🌳 TREES -->
<div class="tree tree1">🌳</div>
<div class="tree tree2">🌳</div>

<div id="logoScreen">
<img src="assets/innovine-logo.png">
</div>

<div id="ground"></div>

<!-- 🏹 HUNTER -->
<div id="player">🏹</div>

<div id="scoreBoard">
Coins: <span id="coinCount">0</span> |
Q: <span id="questionCount">0</span>/10
</div>

<div id="volumeBox">
Volume <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
</div>

<div id="questionBox">
<div id="questionText"></div>
<div id="options"></div>
</div>

<div id="confetti"></div>

<div id="startScreen" style="display:none;">
<h1>Temple Treasure Adventure</h1>
<button class="mainBtn" onclick="startGame()">Start</button>
</div>

<div id="endScreen" style="display:none;">
<h1>Game Over</h1>
<h2 id="finalMessage"></h2>
<button class="mainBtn" onclick="restartGame()">Restart</button>
</div>

</div>

<script>

/* 🔊 SOUNDS */
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/clapping.mp3");
const bgSound = new Audio("assets/bg.mp3"); // NEW BACKGROUND SOUND
bgSound.loop = true;

let volumeSlider = document.getElementById("volumeSlider");

function updateVolume(){
    correctSound.volume = volumeSlider.value;
    wrongSound.volume = volumeSlider.value;
    clapSound.volume = volumeSlider.value;
    bgSound.volume = volumeSlider.value;
}
volumeSlider.oninput = updateVolume;
updateVolume();

/* GAME STATE */
let gameRunning=false;
let jumping=false;
let velocity=0;
let gravity=0.8;
let playerY=120;

let coins=0;
let currentQuestion=0;

const player=document.getElementById("player");
const coinCount=document.getElementById("coinCount");
const questionCount=document.getElementById("questionCount");

/* ▶ START GAME */
function startGame(){

    document.getElementById("startScreen").style.display="none";

    gameRunning=true;

    bgSound.play(); // 🔊 PLAY ON START

    spawnCoin();
    spawnObstacle();
    loop();
}

/* 🦘 JUMP */
function jump(){
    if(!jumping){
        velocity=-18;
        jumping=true;
    }
}

document.addEventListener("keydown",(e)=>{
    if(e.code==="Space"||e.code==="ArrowUp") jump();
});

document.addEventListener("touchstart",jump);

/* LOOP */
function loop(){
    if(!gameRunning) return;

    velocity+=gravity;
    playerY-=velocity;

    if(playerY<=120){
        playerY=120;
        velocity=0;
        jumping=false;
    }

    player.style.bottom=playerY+"px";

    requestAnimationFrame(loop);
}

/* 💰 COIN */
function spawnCoin(){

    const coin=document.createElement("div");
    coin.className="coin";
    coin.innerHTML="💰";
    coin.style.left="100%";
    coin.style.top=(200+Math.random()*200)+"px";

    document.getElementById("gameArea").appendChild(coin);

    let move=setInterval(()=>{

        let left=parseInt(coin.style.left||100);
        left-=3;
        coin.style.left=left+"px";

        const c=coin.getBoundingClientRect();
        const p=player.getBoundingClientRect();

        // ✅ ONLY COLLECT WHEN JUMPING
        if(
            jumping &&
            c.left<p.right &&
            c.right>p.left &&
            c.top<p.bottom &&
            c.bottom>p.top
        ){
            coins++;
            coinCount.innerText=coins;
            coin.remove();
            clearInterval(move);
        }

        if(left<-50){
            coin.remove();
            clearInterval(move);
        }

    },20);

    setTimeout(spawnCoin,2500);
}

/* OBSTACLE */
function spawnObstacle(){

    const obs=document.createElement("div");
    obs.className="obstacle";
    obs.style.left="100%";

    document.getElementById("gameArea").appendChild(obs);

    let move=setInterval(()=>{

        let left=parseInt(obs.style.left||100);
        left-=4;
        obs.style.left=left+"px";

        const o=obs.getBoundingClientRect();
        const p=player.getBoundingClientRect();

        if(o.left<p.right&&o.right>p.left){
            coins=Math.max(0,coins-1);
            coinCount.innerText=coins;
            obs.remove();
            clearInterval(move);
        }

        if(left<-50){
            obs.remove();
            clearInterval(move);
        }

    },20);

    setTimeout(spawnObstacle,3500);
}

function restartGame(){
    location.reload();
}

setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("startScreen").style.display="flex";
},5000);

</script>

</body>
</html>
