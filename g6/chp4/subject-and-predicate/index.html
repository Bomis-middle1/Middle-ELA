<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Temple Treasure Adventure</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Arial,sans-serif;
    overflow:hidden;
    background:#87ceeb;
}

/* GAME AREA */
#gameArea{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:linear-gradient(to bottom,#87ceeb,#dfffb0);
}

/* 🌳 BACKGROUND */
.tree{
    position:absolute;
    bottom:120px;
    font-size:80px;
    opacity:0.9;
    z-index:1;
}
.tree1{left:8%;}
.tree2{left:78%;}

/* GROUND */
#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:#8B5A2B;
    border-top:6px solid #3cb371;
}

/* PLAYER */
#player{
    position:absolute;
    left:80px;
    bottom:120px;
    font-size:55px;
    z-index:10;
}

/* COIN */
.coin{
    position:absolute;
    font-size:30px;
    z-index:5;
}

/* SCOREBOARD */
#scoreBoard{
    position:absolute;
    top:10px;
    left:10px;
    background:white;
    padding:10px 14px;
    border-radius:12px;
    font-weight:bold;
    z-index:50;
}

/* SCREENS */
#logoScreen{
    position:absolute;
    inset:0;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:1000;
}

#logoScreen img{
    width:240px;
    max-width:80%;
}

#instructionScreen,
#startScreen,
#endScreen{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.75);
    color:white;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    z-index:900;
}

.btn{
    margin-top:20px;
    padding:14px 26px;
    font-size:18px;
    border:none;
    border-radius:14px;
    background:#ff9800;
    color:white;
}

/* QUESTION BOX */
#questionBox{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:90%;
    max-width:520px;
    background:white;
    border-radius:18px;
    padding:20px;
    display:none;
    z-index:999;
    text-align:center;
}

.optionBtn{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2196f3;
    color:white;
    font-size:16px;
}

/* SMALL TEXT */
small{opacity:0.9;}
</style>
</head>

<body>

<div id="gameArea">

<!-- 🌳 TREES -->
<div class="tree tree1">🌳</div>
<div class="tree tree2">🌳</div>

<div id="ground"></div>

<!-- PLAYER -->
<div id="player">👨‍🌾</div>

<!-- SCORE -->
<div id="scoreBoard">
Coins: <span id="coinCount">0</span> |
Score: <span id="score">0</span>
</div>

<!-- LOGO -->
<div id="logoScreen">
    <img src="assets/innovine-logo.png" />
</div>

<!-- INSTRUCTIONS -->
<div id="instructionScreen">
    <h2>Temple Treasure Adventure</h2>
    <p style="margin-top:10px;">
        Jump and collect gold coins.<br>
        Every 3 coins → answer a grammar question!
    </p>
    <button class="btn" onclick="startGame()">Start Game</button>
</div>

<!-- QUESTION -->
<div id="questionBox">
    <h3 id="qText"></h3>
    <div id="options"></div>
    <p id="hint" style="margin-top:10px;color:#333;"></p>
</div>

<!-- END -->
<div id="endScreen">
    <h1>🎉 Game Complete 🎉</h1>
    <h2 id="finalText"></h2>
    <button class="btn" onclick="restartGame()">Play Again</button>
</div>

</div>

<script>

/* ---------------- AUDIO ---------------- */
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/clapping.mp3");

function safePlay(audio){
    try{ audio.currentTime=0; audio.play(); }catch(e){}
}

/* ---------------- STATE ---------------- */
let coins = 0;
let score = 0;

let playerY = 120;
let velocity = 0;
let gravity = 0.8;
let jumping = false;

let gameRunning = false;

let questionsPool = [
{
q:"The cat sat on the mat. What is the subject?",
o:["cat","sat","mat","on"],
a:0
},
{
q:"The boy is running fast. What is the predicate?",
o:["boy","is running fast","fast","run"],
a:1
},
{
q:"Riya wrote a letter. Identify subject.",
o:["wrote","letter","Riya","a"],
a:2
},
{
q:"The birds are flying. Predicate?",
o:["birds","are flying","flying","the"],
a:1
}
];

let questions = shuffle([...questionsPool]);
let qIndex = 0;
let attempts = 2;

/* ---------------- ELEMENTS ---------------- */
const player = document.getElementById("player");
const coinCount = document.getElementById("coinCount");
const scoreBoard = document.getElementById("score");
const qBox = document.getElementById("questionBox");
const qText = document.getElementById("qText");
const optionsDiv = document.getElementById("options");
const hint = document.getElementById("hint");

/* ---------------- INIT FLOW ---------------- */
setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("instructionScreen").style.display="flex";
},5000);

/* ---------------- START ---------------- */
function startGame(){
    document.getElementById("instructionScreen").style.display="none";
    gameRunning=true;
    loop();
    spawnCoin();
}

/* ---------------- JUMP ---------------- */
document.addEventListener("keydown",(e)=>{
    if(e.code==="Space") jump();
});

document.addEventListener("touchstart",jump);

function jump(){
    if(!jumping){
        velocity = -16;
        jumping = true;
    }
}

/* ---------------- LOOP ---------------- */
function loop(){
    if(!gameRunning) return;

    velocity += gravity;
    playerY -= velocity;

    if(playerY <= 120){
        playerY = 120;
        velocity = 0;
        jumping = false;
    }

    player.style.bottom = playerY + "px";

    requestAnimationFrame(loop);
}

/* ---------------- COIN ---------------- */
function spawnCoin(){

    if(!gameRunning) return;

    const coin = document.createElement("div");
    coin.className="coin";
    coin.innerHTML="💰";
    coin.style.left="100%";
    coin.style.top=(180 + Math.random()*200)+"px";
    document.getElementById("gameArea").appendChild(coin);

    let move = setInterval(()=>{

        let left = parseInt(coin.style.left || 100);
        left -= 3;
        coin.style.left = left + "px";

        const c = coin.getBoundingClientRect();
        const p = player.getBoundingClientRect();

        if(
            jumping &&
            c.left < p.right &&
            c.right > p.left &&
            c.top < p.bottom &&
            c.bottom > p.top
        ){
            coins++;
            coinCount.innerText = coins;
            coin.remove();
            clearInterval(move);

            if(coins % 3 === 0){
                showQuestion();
            }
        }

        if(left < -50){
            coin.remove();
            clearInterval(move);
        }

    },20);

    setTimeout(spawnCoin,2200);
}

/* ---------------- QUESTION SYSTEM ---------------- */
function showQuestion(){

    gameRunning = false;
    attempts = 2;

    if(qIndex >= questions.length){
        endGame();
        return;
    }

    const q = questions[qIndex];

    qText.innerText = q.q;
    optionsDiv.innerHTML = "";
    hint.innerText = "";

    q.o.forEach((opt,i)=>{
        const btn = document.createElement("button");
        btn.className="optionBtn";
        btn.innerText=opt;
        btn.onclick=()=>checkAnswer(i);
        optionsDiv.appendChild(btn);
    });

    qBox.style.display="block";
}

/* ---------------- ANSWER ---------------- */
function checkAnswer(selected){

    const q = questions[qIndex];

    if(selected === q.a){

        safePlay(correctSound);
        safePlay(clapSound);

        score += 10;
        scoreBoard.innerText = score;

        nextQuestion();

    } else {

        attempts--;

        safePlay(wrongSound);

        if(attempts <= 0){
            hint.innerText = "Correct Answer: " + q.o[q.a];
            setTimeout(nextQuestion,1200);
        } else {
            hint.innerText = "Try Again! Attempts left: " + attempts;
        }
    }
}

/* ---------------- NEXT ---------------- */
function nextQuestion(){
    qIndex++;
    qBox.style.display="none";
    gameRunning=true;
    loop();
}

/* ---------------- END GAME ---------------- */
function endGame(){

    gameRunning=false;

    document.getElementById("endScreen").style.display="flex";

    document.getElementById("finalText").innerText =
    "Coins Collected: " + coins + " | Score: " + score;
}

/* ---------------- RESTART ---------------- */
function restartGame(){
    location.reload();
}

/* ---------------- SHUFFLE ---------------- */
function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*i);
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
}

</script>

</body>
</html>
