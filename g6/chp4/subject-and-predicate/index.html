<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Temple Treasure Jungle Quiz</title>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
    background:linear-gradient(to bottom,#b3e5fc,#81c784);
}

#gameArea{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}

/* TREES */
.tree{
    position:absolute;
    bottom:120px;
    font-size:100px;
    opacity:0.7;
    z-index:1;
    pointer-events:none;
}
.t1{left:8%;}
.t2{left:25%;font-size:120px;}
.t3{left:55%;}
.t4{left:78%;font-size:130px;}

/* GROUND */
#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:linear-gradient(to top,#5d4037,#8d6e63);
    border-top:6px solid #2e7d32;
    z-index:5;
}

/* PLAYER */
#player{
    position:absolute;
    left:80px;
    bottom:120px;
    font-size:55px;
    z-index:20;
    transition:transform 0.1s linear;
}
#player.right{transform:scaleX(1);}
#player.left{transform:scaleX(-1);}

/* COIN */
.coin{
    position:absolute;
    width:40px;
    height:40px;
    background:gold;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* OBSTACLE */
.obstacle{
    position:absolute;
    width:50px;
    height:50px;
    background:#6d4c41;
    bottom:120px;
}

/* SCORE */
#scoreBoard{
    position:absolute;
    top:10px;
    left:10px;
    background:white;
    padding:10px;
    border-radius:10px;
    z-index:50;
}

/* QUESTION BOX */
#questionBox{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:20px;
    width:80%;
    display:none;
    z-index:100;
}
.optionBtn{
    display:block;
    width:100%;
    margin:10px 0;
    padding:10px;
}
</style>
</head>

<body>

<div id="gameArea">

<!-- TREES -->
<div class="tree t1">🌳</div>
<div class="tree t2">🌴</div>
<div class="tree t3">🌳</div>
<div class="tree t4">🌴</div>

<div id="ground"></div>

<div id="player" class="right">🧑‍🌾</div>

<div id="scoreBoard">
Coins: <span id="coinCount">0</span> |
Questions: <span id="qCount">0</span>/10
</div>

<div id="questionBox">
<div id="qText"></div>
<div id="options"></div>
</div>

</div>

<script>

let gameRunning = true;
let coins = 0;
let qIndex = 0;

let playerY = 120;
let velocity = 0;
let gravity = 0.6;
let jumping = false;

let direction = 1;

const player = document.getElementById("player");
const coinCount = document.getElementById("coinCount");
const qCount = document.getElementById("qCount");

const questionBox = document.getElementById("questionBox");
const qText = document.getElementById("qText");
const options = document.getElementById("options");

/* QUESTIONS (RESTORED) */
const questions = [
{
q:"Which word is correct prefix form of 'write'?",
o:["rewrite","unwrite","miswrite","overwrite"],
a:0
},
{
q:"Meaning of 'inactive'?",
o:["not active","very active","super active","half active"],
a:0
},
{
q:"Opposite of 'happy' using prefix?",
o:["unhappy","rehappy","happyless","inhappy"],
a:0
},
{
q:"Correct word for 'too much packed'?",
o:["overpacked","unpacked","repacked","mispacked"],
a:0
},
{
q:"Meaning of 'fearless'?",
o:["without fear","full fear","some fear","after fear"],
a:0
},
{
q:"Correct prefix for 'possible' → not possible",
o:["impossible","repossible","unpossible","dispossible"],
a:0
},
{
q:"Meaning of 'misunderstood'?",
o:["understood correctly","understood wrongly","not understood at all","fully understood"],
a:1
},
{
q:"Suffix meaning 'full of care'?",
o:["careful","careless","carement","recare"],
a:0
},
{
q:"Meaning of '-less' suffix?",
o:["without","with more","before","after"],
a:0
},
{
q:"Build correct word: not happy",
o:["unhappy","rehappy","happyless","inhappy"],
a:0
}
];

/* GAME LOOP */
function gameLoop(){

if(!gameRunning) return;

velocity += gravity;
playerY -= velocity;

if(playerY <= 120){
playerY = 120;
velocity = 0;
jumping = false;
}

player.style.bottom = playerY + "px";

requestAnimationFrame(gameLoop);
}

/* JUMP */
document.addEventListener("keydown",(e)=>{
if(e.code==="Space" || e.code==="ArrowUp") jump();

if(e.code==="ArrowLeft"){
direction=-1;
player.classList.add("left");
player.classList.remove("right");
}

if(e.code==="ArrowRight"){
direction=1;
player.classList.add("right");
player.classList.remove("left");
}
});

function jump(){
if(!jumping && gameRunning){
velocity = -14;
jumping = true;
}
}

/* COIN */
function spawnCoin(){

const coin = document.createElement("div");
coin.className="coin";
coin.innerHTML="💎";

coin.style.left=window.innerWidth+"px";
coin.style.bottom=(160+Math.random()*100)+"px";

gameArea.appendChild(coin);

let move=setInterval(()=>{

let left=parseFloat(coin.style.left);
left-=2.5;
coin.style.left=left+"px";

const c=coin.getBoundingClientRect();
const p=player.getBoundingClientRect();

if(c.left<p.right && c.right>p.left && c.top<p.bottom && c.bottom>p.top){
coins++;
coinCount.innerText=coins;
coin.remove();
clearInterval(move);

if(coins%3===0){
showQuestion();
}
}

if(left<-50){
coin.remove();
clearInterval(move);
}

},16);

setTimeout(spawnCoin,2000);
}

/* OBSTACLE */
function spawnObstacle(){

const obs=document.createElement("div");
obs.className="obstacle";
obs.innerHTML="🪵";

obs.style.left=window.innerWidth+"px";
gameArea.appendChild(obs);

let move=setInterval(()=>{

let left=parseFloat(obs.style.left);
left-=3;
obs.style.left=left+"px";

const o=obs.getBoundingClientRect();
const p=player.getBoundingClientRect();

if(o.left<p.right && o.right>p.left && o.top<p.bottom && o.bottom>p.top){
coins=Math.max(0,coins-1);
coinCount.innerText=coins;
obs.remove();
clearInterval(move);
}

if(left<-50){
obs.remove();
clearInterval(move);
}

},16);

setTimeout(spawnObstacle,2800);
}

/* QUESTION SYSTEM */
function showQuestion(){

gameRunning=false;

questionBox.style.display="block";

const q=questions[qIndex];

qText.innerHTML=q.q;

options.innerHTML="";

q.o.forEach((opt,i)=>{

const btn=document.createElement("button");
btn.className="optionBtn";
btn.innerText=opt;

btn.onclick=()=>checkAnswer(i,q.a);

options.appendChild(btn);

});

}

function checkAnswer(sel,correct){

qIndex++;
qCount.innerText=qIndex;

setTimeout(()=>{

questionBox.style.display="none";
gameRunning=true;
requestAnimationFrame(gameLoop);

},1200);
}

/* START */
spawnCoin();
spawnObstacle();
requestAnimationFrame(gameLoop);

</script>

</body>
</html>
