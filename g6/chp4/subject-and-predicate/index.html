
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temple Treasure Grammar Adventure</title>

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
}

#gameArea{
    position:relative;
    width:100vw;
    height:100vh;
    background:linear-gradient(to bottom,#87ceeb,#dfffb0);
    overflow:hidden;
}

/* 🌳 BACKGROUND TREES */
.tree{
    position:absolute;
    bottom:120px;
    font-size:80px;
    opacity:0.9;
}
.tree1{left:10%;}
.tree2{left:75%;}

#ground{
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:#8B5A2B;
    border-top:8px solid #4caf50;
}

/* 🏹 HUNTER */
#player{
    position:absolute;
    left:80px;
    bottom:120px;
    font-size:55px;
    z-index:10;
}

/* 💰 COIN */
.coin{
    position:absolute;
    width:40px;
    height:40px;
    font-size:26px;
}

/* SCORE */
#scoreBoard{
    position:absolute;
    top:10px;
    left:10px;
    background:white;
    padding:10px 14px;
    border-radius:12px;
    font-weight:bold;
}

#volumeBox{
    position:absolute;
    top:10px;
    right:10px;
    background:white;
    padding:10px;
    border-radius:12px;
}

/* SCREENS */
#startScreen,#endScreen{
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.mainBtn{
    margin-top:20px;
    padding:14px 26px;
    border:none;
    border-radius:15px;
    background:#ff9800;
    color:white;
    font-size:20px;
}

/* LOGO */
#logoScreen{
    position:absolute;
    width:100%;
    height:100%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:999;
    flex-direction:column;
}

#logoScreen img{
    width:250px;
}

</style>
</head>

<body>

<div id="gameArea">

<!-- 🌳 TREES -->
<div class="tree tree1">🌳</div>
<div class="tree tree2">🌳</div>

<!-- LOGO -->
<div id="logoScreen">
<img src="assets/innovine-logo.png">
</div>

<div id="ground"></div>

<!-- 🏹 PLAYER -->
<div id="player">🏹</div>

<div id="scoreBoard">
Coins: <span id="coinCount">0</span>
</div>

<div id="volumeBox">
Volume <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
</div>

<div id="startScreen" style="display:none;">
<h1>Temple Treasure Adventure</h1>
<button class="mainBtn" onclick="startGame()">Start</button>
</div>

<div id="endScreen" style="display:none;">
<h1>Game Over</h1>
</div>

</div>

<script>

const player=document.getElementById("player");
const coinCount=document.getElementById("coinCount");
const volumeSlider=document.getElementById("volumeSlider");

const bgSound = new Audio("assets/bg.mp3");
bgSound.loop = true;

let coins=0;
let gameRunning=false;

let jumping=false;
let velocity=0;
let gravity=0.8;
let playerY=120;

/* VOLUME */
function updateVolume(){
    bgSound.volume = volumeSlider.value;
}
volumeSlider.oninput=updateVolume;
updateVolume();

/* START */
function startGame(){
    document.getElementById("startScreen").style.display="none";
    gameRunning=true;
    bgSound.play();
    spawnCoin();
    loop();
}

/* JUMP */
function jump(){
    if(!jumping){
        velocity=-18;
        jumping=true;
    }
}

document.addEventListener("keydown",(e)=>{
    if(e.code==="Space") jump();
});

document.addEventListener("touchstart",jump);

/* LOOP */
function loop(){
    if(!gameRunning) return;

    velocity+=gravity;
    playerY-=velocity;

    if(playerY<=120){
        playerY=120;
        velocity=0;
        jumping=false;
    }

    player.style.bottom=playerY+"px";

    requestAnimationFrame(loop);
}

/* COIN */
function spawnCoin(){

    const coin=document.createElement("div");
    coin.className="coin";
    coin.innerHTML="💰";
    coin.style.left="100%";
    coin.style.top=(180+Math.random()*200)+"px";

    document.getElementById("gameArea").appendChild(coin);

    let move=setInterval(()=>{

        let left=parseInt(coin.style.left||100);
        left-=3;
        coin.style.left=left+"px";

        const c=coin.getBoundingClientRect();
        const p=player.getBoundingClientRect();

        if(
            jumping &&
            c.left<p.right &&
            c.right>p.left &&
            c.top<p.bottom &&
            c.bottom>p.top
        ){
            coins++;
            coinCount.innerText=coins;
            coin.remove();
            clearInterval(move);
        }

        if(left<-50){
            coin.remove();
            clearInterval(move);
        }

    },20);

    setTimeout(spawnCoin,2500);
}

/* LOGO SCREEN */
setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("startScreen").style.display="flex";
},5000);

</script>

</body>
</html>
