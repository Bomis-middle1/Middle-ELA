<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🎭 Talent Show Chaos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:black;
}

#gameArea{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:linear-gradient(to bottom,#1a237e,#000);
}

/* LOGO */

#logoScreen{
position:absolute;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:9999;
}

#logoScreen img{
width:260px;
max-width:80%;
}

#logoText{
margin-top:20px;
font-size:34px;
font-weight:bold;
color:#333;
}

/* START + END */

#startScreen,
#endScreen{
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.92);
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
color:white;
z-index:5000;
}

.mainBtn{
padding:16px 34px;
font-size:22px;
border:none;
border-radius:18px;
background:#ff9800;
color:white;
cursor:pointer;
margin-top:25px;
transition:0.3s;
font-weight:bold;
}

.mainBtn:hover{
transform:scale(1.05);
}

/* TITLE */

#titleBox{
position:absolute;
top:10px;
left:50%;
transform:translateX(-50%);
width:92%;
background:#212121;
padding:15px;
border-radius:20px;
font-size:28px;
font-weight:bold;
text-align:center;
color:#ffeb3b;
border:5px solid #ff9800;
z-index:100;
}

/* SCORE */

#scoreBoard{
position:absolute;
top:100px;
left:20px;
background:#212121;
color:white;
padding:12px 18px;
border-radius:15px;
font-size:18px;
font-weight:bold;
z-index:200;
line-height:1.7;
border:3px solid #ff9800;
}

/* VOLUME */

#volumeBox{
position:absolute;
top:100px;
right:20px;
background:#212121;
color:white;
padding:12px;
border-radius:15px;
z-index:200;
border:3px solid #ff9800;
}

/* STAGE */

#stageArea{
position:absolute;
top:170px;
left:50%;
transform:translateX(-50%);
width:95%;
height:50%;
background:linear-gradient(to bottom,#4e342e,#212121);
border-radius:25px;
border:8px solid #ff9800;
overflow:hidden;
}

/* CURTAINS */

.curtain{
position:absolute;
top:0;
width:50%;
height:100%;
background:#b71c1c;
z-index:50;
transition:1.5s;
}

#curtainLeft{
left:0;
border-right:4px solid gold;
}

#curtainRight{
right:0;
border-left:4px solid gold;
}

/* SPOTLIGHTS */

.spotlight{
position:absolute;
width:120px;
height:120px;
background:rgba(255,255,0,0.25);
border-radius:50%;
filter:blur(15px);
animation:pulse 2s infinite;
}

#spot1{
top:20px;
left:15%;
}

#spot2{
top:20px;
right:15%;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}
}

/* PERFORMERS */

.performer{
position:absolute;
font-size:80px;
transition:1s;
}

#singer{
left:12%;
bottom:20px;
animation:bounce 2s infinite;
}

#dancer{
left:42%;
bottom:20px;
animation:dance 1.5s infinite;
}

#drummer{
right:12%;
bottom:20px;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

@keyframes dance{
0%{transform:rotate(-10deg);}
50%{transform:rotate(10deg);}
100%{transform:rotate(-10deg);}
}

/* APPLAUSE */

#applauseContainer{
position:absolute;
top:15px;
left:50%;
transform:translateX(-50%);
width:55%;
height:28px;
background:#333;
border-radius:20px;
overflow:hidden;
border:3px solid gold;
}

#applauseBar{
height:100%;
width:0%;
background:linear-gradient(to right,#4caf50,#ffeb3b);
transition:0.5s;
}

/* SCENE */

#sceneText{
position:absolute;
bottom:120px;
left:50%;
transform:translateX(-50%);
width:90%;
background:rgba(0,0,0,0.85);
color:white;
padding:16px;
border-radius:20px;
font-size:24px;
text-align:center;
z-index:900;
}

/* QUESTION */

#questionBox{
position:absolute;
bottom:10px;
left:50%;
transform:translateX(-50%);
width:94%;
max-width:900px;
background:#fff8e1;
padding:20px;
border-radius:25px;
z-index:1000;
box-shadow:0 0 20px rgba(0,0,0,0.5);
display:none;
}

#questionText{
font-size:22px;
line-height:1.6;
margin-bottom:18px;
color:#333;
text-align:center;
}

.optionContainer{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.optionBtn{
padding:15px;
border:none;
border-radius:15px;
background:#8e24aa;
color:white;
font-size:18px;
cursor:pointer;
transition:0.3s;
font-weight:bold;
}

.optionBtn:hover{
background:#6a1b9a;
transform:scale(1.03);
}

/* FEEDBACK */

#feedbackPopup{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:30px;
border-radius:25px;
width:90%;
max-width:650px;
display:none;
z-index:9999;
text-align:center;
box-shadow:0 0 30px rgba(0,0,0,0.5);
animation:popup 0.4s;
}

#feedbackTitle{
font-size:36px;
margin-bottom:15px;
font-weight:bold;
}

#feedbackText{
font-size:22px;
line-height:1.6;
color:#333;
}

@keyframes popup{
from{
transform:translate(-50%,-50%) scale(0.5);
opacity:0;
}
to{
transform:translate(-50%,-50%) scale(1);
opacity:1;
}
}

/* CONFETTI */

.confetti{
position:absolute;
width:12px;
height:12px;
animation:fall 3s linear forwards;
}

@keyframes fall{
from{
transform:translateY(-100px) rotate(0deg);
}
to{
transform:translateY(100vh) rotate(720deg);
opacity:0;
}
}

/* MOBILE */

@media(max-width:768px){

#titleBox{
font-size:18px;
}

#questionText{
font-size:17px;
}

.optionBtn{
font-size:15px;
padding:12px;
}

.performer{
font-size:55px;
}

#sceneText{
font-size:18px;
bottom:135px;
}

#feedbackTitle{
font-size:28px;
}

#feedbackText{
font-size:18px;
}

}

</style>
</head>

<body>

<div id="gameArea">

<!-- LOGO -->

<div id="logoScreen">

<img src="assets/innovine-logo.png">

<div id="logoText">
Innovine Learning Adventures
</div>

</div>

<!-- START -->

<div id="startScreen"
style="display:none;">

<h1 style="font-size:50px;">
🎭 Talent Show Chaos
</h1>

<p style="margin-top:20px;font-size:24px;max-width:700px;">
Fix the talent show using conjunctions before the audience gets angry!
</p>

<button class="mainBtn"
onclick="startGame()">
Start Show
</button>

</div>

<!-- END -->

<div id="endScreen"
style="display:none;">

<h1>🏆 SHOW SAVED! 🏆</h1>

<h2 id="finalText"
style="margin-top:20px; line-height:1.8;"></h2>

<button class="mainBtn"
onclick="restartGame()">
Play Again
</button>

</div>

<!-- TITLE -->

<div id="titleBox">
🎤 Fix Stage Problems Using Conjunctions!
</div>

<!-- SCORE -->

<div id="scoreBoard">
✅ Correct: <span id="correctScore">0</span><br>
❌ Wrong: <span id="wrongScore">0</span><br>
📘 Question: <span id="questionNumber">0</span>/10
</div>

<!-- VOLUME -->

<div id="volumeBox">
🔊 Volume
<input type="range"
id="volumeSlider"
min="0"
max="1"
step="0.1"
value="1">
</div>

<!-- STAGE -->

<div id="stageArea">

<div class="curtain"
id="curtainLeft"></div>

<div class="curtain"
id="curtainRight"></div>

<div class="spotlight"
id="spot1"></div>

<div class="spotlight"
id="spot2"></div>

<div id="applauseContainer">
<div id="applauseBar"></div>
</div>

<div class="performer"
id="singer">
🎤
</div>

<div class="performer"
id="dancer">
💃
</div>

<div class="performer"
id="drummer">
🥁
</div>

</div>

<!-- SCENE -->

<div id="sceneText">
The crowd is waiting...
</div>

<!-- QUESTION -->

<div id="questionBox">

<div id="questionText"></div>

<div class="optionContainer"
id="options"></div>

</div>

<!-- FEEDBACK -->

<div id="feedbackPopup">

<div id="feedbackTitle"></div>

<div id="feedbackText"></div>

</div>

</div>

<script>

/* LOGO */

setTimeout(()=>{

document.getElementById("logoScreen")
.style.display="none";

document.getElementById("startScreen")
.style.display="flex";

},5000);

/* AUDIO FIX */

const correctSound =
new Audio("assets/correct.mp3");

const wrongSound =
new Audio("assets/wrong.mp3");

correctSound.preload = "auto";
wrongSound.preload = "auto";

function playCorrect(){

correctSound.pause();
correctSound.currentTime = 0;
correctSound.play();

}

function playWrong(){

wrongSound.pause();
wrongSound.currentTime = 0;
wrongSound.play();

}

const volumeSlider =
document.getElementById("volumeSlider");

function updateVolume(){

correctSound.volume =
volumeSlider.value;

wrongSound.volume =
volumeSlider.value;

}

volumeSlider.addEventListener(
"input",
updateVolume
);

updateVolume();

/* QUESTIONS */

const questions = [

{
scene:"🎤 The singer forgot the lyrics. The audience still clapped loudly.",
q:"The singer forgot the lyrics, ___ the audience still clapped loudly.",
o:["but","because","either","unless"],
a:0,
e:"'But' shows contrast."
},

{
scene:"💃 The music started suddenly. The dancers rushed onto the stage.",
q:"___ the music started, the dancers rushed onto the stage.",
o:["When","Nor","But","Both"],
a:0,
e:"'When' connects the action to time."
},

{
scene:"🥁 The drummer was missing. The guitarist was also missing.",
q:"___ the drummer nor the guitarist arrived on time.",
o:["Either","Neither","Although","Because"],
a:1,
e:"'Neither...nor' is correlative."
},

{
scene:"🎸 The band practiced hard. They won the talent trophy.",
q:"The band practiced hard, ___ they won the trophy.",
o:["so","unless","neither","although"],
a:0,
e:"'So' shows result."
},

{
scene:"🎭 The curtains opened. The comedian entered.",
q:"___ the curtains opened, the comedian entered.",
o:["After","Either","But","Nor"],
a:0,
e:"'After' shows sequence."
},

{
scene:"🎤 The singer was nervous. She performed brilliantly.",
q:"The singer was nervous, ___ she performed brilliantly.",
o:["but","because","neither","unless"],
a:0,
e:"'But' joins opposite ideas."
},

{
scene:"💡 The lights failed. The dancers continued performing.",
q:"The lights failed, ___ the dancers continued performing.",
o:["but","before","either","since"],
a:0,
e:"'But' shows contrast."
},

{
scene:"🎸 The guitarist tuned his instrument. The drummer checked speakers.",
q:"___ the guitarist and drummer prepared carefully, the show started smoothly.",
o:["Because","Neither","But","Or"],
a:0,
e:"'Because' explains reason."
},

{
scene:"🎆 The audience cheered loudly. Fireworks exploded.",
q:"The audience cheered loudly, ___ fireworks exploded above the stage.",
o:["and","unless","although","neither"],
a:0,
e:"'And' joins similar ideas."
},

{
scene:"🎭 The magician could perform. The comedian could perform.",
q:"___ the magician or the comedian could host the finale.",
o:["Either","Neither","Although","Because"],
a:0,
e:"'Either...or' offers choices."
}

];

let currentQuestion = 0;
let correct = 0;
let wrong = 0;

/* START */

function startGame(){

document.getElementById("startScreen")
.style.display="none";

openCurtains();

playScene();

}

/* CURTAINS */

function openCurtains(){

document.getElementById("curtainLeft")
.style.transform = "translateX(-100%)";

document.getElementById("curtainRight")
.style.transform = "translateX(100%)";

}

/* PLAY SCENE */

function playScene(){

const q = questions[currentQuestion];

document.getElementById("sceneText")
.innerHTML = q.scene;

animateStage();

setTimeout(()=>{

loadQuestion();

},3000);

}

/* STAGE ANIMATION */

function animateStage(){

const singer =
document.getElementById("singer");

const dancer =
document.getElementById("dancer");

const drummer =
document.getElementById("drummer");

singer.style.transform =
"translateY(-20px)";

dancer.style.transform =
"rotate(15deg)";

drummer.style.transform =
"translateY(-15px)";

setTimeout(()=>{

singer.style.transform =
"translateY(0px)";

dancer.style.transform =
"rotate(-15deg)";

drummer.style.transform =
"translateY(0px)";

},1000);

}

/* LOAD QUESTION */

function loadQuestion(){

document.getElementById("questionBox")
.style.display = "block";

const q = questions[currentQuestion];

document.getElementById("questionText")
.innerHTML = q.q;

const options =
document.getElementById("options");

options.innerHTML = "";

q.o.forEach((option,index)=>{

const btn =
document.createElement("button");

btn.classList.add("optionBtn");

btn.innerHTML = option;

btn.onclick = ()=>checkAnswer(index);

options.appendChild(btn);

});

}

/* CHECK ANSWER */

function checkAnswer(selected){

document.getElementById("questionBox")
.style.display = "none";

const q = questions[currentQuestion];

const popup =
document.getElementById("feedbackPopup");

popup.style.display = "block";

if(selected === q.a){

correct++;

document.getElementById("correctScore")
.innerHTML = correct;

playCorrect();

createConfetti();

document.getElementById("feedbackTitle")
.innerHTML = "✅ Performance Saved!";

document.getElementById("feedbackTitle")
.style.color = "green";

document.getElementById("feedbackText")
.innerHTML = q.e;

updateApplause();

}else{

wrong++;

document.getElementById("wrongScore")
.innerHTML = wrong;

playWrong();

document.getElementById("feedbackTitle")
.innerHTML = "❌ Stage Disaster!";

document.getElementById("feedbackTitle")
.style.color = "red";

document.getElementById("feedbackText")
.innerHTML =
`
Correct Answer:<br><br>
<b>${q.o[q.a]}</b><br><br>
${q.e}
`;

flashStage();

}

document.getElementById("questionNumber")
.innerHTML = currentQuestion + 1;

setTimeout(()=>{

popup.style.display = "none";

currentQuestion++;

if(currentQuestion >= 10){

endGame();

}else{

playScene();

}

},2500);

}

/* APPLAUSE */

function updateApplause(){

document.getElementById("applauseBar")
.style.width =
(correct * 10) + "%";

}

/* WRONG FLASH */

function flashStage(){

const stage =
document.getElementById("stageArea");

stage.style.background = "darkred";

setTimeout(()=>{

stage.style.background =
"linear-gradient(to bottom,#4e342e,#212121)";

},600);

}

/* CONFETTI */

function createConfetti(){

for(let i=0;i<40;i++){

const conf =
document.createElement("div");

conf.classList.add("confetti");

conf.style.left =
Math.random()*100 + "%";

conf.style.background =
`hsl(${Math.random()*360},100%,50%)`;

conf.style.animationDuration =
(2 + Math.random()*2)+"s";

document.body.appendChild(conf);

setTimeout(()=>{
conf.remove();
},4000);

}

}

/* END */

function endGame(){

document.getElementById("endScreen")
.style.display = "flex";

let percentage =
Math.round((correct / 10) * 100);

let message = "";

if(correct === 10){

message =
"🌟 PERFECT SHOW! Standing ovation from the audience!";

}else if(correct >= 8){

message =
"🎭 Amazing Stage Director Skills!";

}else if(correct >= 6){

message =
"👏 Great Job Saving The Talent Show!";

}else{

message =
"🎉 Nice Try! The audience still enjoyed the show!";
}

document.getElementById("finalText")
.innerHTML =
`
🏆 Correct Answers: ${correct}/10<br><br>

❌ Wrong Answers: ${wrong}<br><br>

⭐ Score Percentage: ${percentage}%<br><br>

${message}
`;

}

/* RESTART */

function restartGame(){

location.reload();

}

</script>

</body>
</html>
