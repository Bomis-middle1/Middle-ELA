<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Talent Show Chaos</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

#gameArea{
  position:relative;
  width:100vw;
  height:100dvh;
  overflow:hidden;
  background:linear-gradient(180deg,#1a237e,#311b92,#000);
}

#logoScreen{
  position:absolute;
  inset:0;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#logoScreen img{
  width:min(75vw,360px);
  height:auto;
  object-fit:contain;
}

.screen{
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
  color:white;
  z-index:5000;
  background:linear-gradient(180deg,#311b92,#000);
}

.screen h1{
  font-size:clamp(30px,7vw,56px);
  margin-bottom:16px;
}

.screen p{
  font-size:clamp(18px,4vw,25px);
  max-width:760px;
  line-height:1.5;
}

.mainBtn{
  margin-top:24px;
  padding:15px 32px;
  font-size:clamp(18px,4vw,24px);
  border:none;
  border-radius:18px;
  background:#ff9800;
  color:white;
  font-weight:bold;
  cursor:pointer;
  min-width:170px;
  min-height:56px;
  box-shadow:0 6px 0 #bf6d00;
}

.mainBtn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #bf6d00;
}

#titleBox{
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  width:94%;
  background:#212121;
  padding:10px 12px;
  border-radius:18px;
  font-size:clamp(17px,4vw,28px);
  font-weight:bold;
  text-align:center;
  color:#ffeb3b;
  border:4px solid #ff9800;
  z-index:100;
}

#scoreBoard{
  position:absolute;
  top:82px;
  left:10px;
  background:#212121;
  color:white;
  padding:9px 12px;
  border-radius:14px;
  font-size:clamp(13px,3vw,18px);
  font-weight:bold;
  z-index:200;
  line-height:1.6;
  border:3px solid #ff9800;
}

#volumeBox{
  position:absolute;
  top:82px;
  right:10px;
  background:#212121;
  color:white;
  padding:9px;
  border-radius:14px;
  z-index:200;
  border:3px solid #ff9800;
  font-size:clamp(13px,3vw,16px);
}

#volumeSlider{
  width:95px;
  height:28px;
}

#stageArea{
  position:absolute;
  top:155px;
  left:50%;
  transform:translateX(-50%);
  width:94%;
  height:48%;
  min-height:260px;
  max-height:430px;
  background:linear-gradient(180deg,#5d4037,#212121);
  border-radius:24px;
  border:6px solid #ff9800;
  overflow:hidden;
}

.curtain{
  position:absolute;
  top:0;
  width:50%;
  height:100%;
  background:#b71c1c;
  z-index:50;
  transition:1.2s ease;
}

#curtainLeft{left:0;border-right:4px solid gold;}
#curtainRight{right:0;border-left:4px solid gold;}

.spotlight{
  position:absolute;
  width:110px;
  height:110px;
  background:rgba(255,255,0,0.22);
  border-radius:50%;
  filter:blur(14px);
  animation:pulse 2s infinite;
}

#spot1{top:18px;left:13%;}
#spot2{top:18px;right:13%;}

@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.15);}
}

.performer{
  position:absolute;
  font-size:clamp(48px,12vw,86px);
  bottom:30px;
  transition:0.4s;
}

#singer{left:12%;animation:bounce 2s infinite;}
#dancer{left:42%;animation:dance 1.5s infinite;}
#drummer{right:12%;animation:bounce 2s infinite;}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

@keyframes dance{
  0%,100%{transform:rotate(-8deg);}
  50%{transform:rotate(8deg);}
}

#applauseContainer{
  position:absolute;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  width:58%;
  height:26px;
  background:#333;
  border-radius:20px;
  overflow:hidden;
  border:3px solid gold;
  z-index:80;
}

#applauseBar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#4caf50,#ffeb3b);
  transition:0.4s;
}

#questionBox{
  position:absolute;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:94%;
  max-width:950px;
  max-height:38%;
  background:#fff8e1;
  padding:14px;
  border-radius:22px;
  z-index:1000;
  box-shadow:0 0 18px rgba(0,0,0,0.55);
  display:none;
  overflow-y:auto;
}

#questionText{
  font-size:clamp(16px,3.8vw,22px);
  line-height:1.45;
  margin-bottom:12px;
  color:#2b2b2b;
  text-align:center;
  font-weight:bold;
}

.optionContainer{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.optionBtn{
  padding:13px 8px;
  border:none;
  border-radius:15px;
  background:#8e24aa;
  color:white;
  font-size:clamp(15px,3.5vw,19px);
  cursor:pointer;
  font-weight:bold;
  min-height:52px;
}

.optionBtn:disabled{
  opacity:0.65;
}

.optionBtn.correctGlow{
  background:#2e7d32;
  animation:glow 0.8s infinite alternate;
}

@keyframes glow{
  from{box-shadow:0 0 5px #fff;}
  to{box-shadow:0 0 22px #4caf50;}
}

#feedbackPopup{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:white;
  padding:24px;
  border-radius:24px;
  width:90%;
  max-width:650px;
  display:none;
  z-index:9998;
  text-align:center;
  box-shadow:0 0 30px rgba(0,0,0,0.65);
}

#feedbackTitle{
  font-size:clamp(28px,7vw,40px);
  margin-bottom:12px;
  font-weight:bold;
}

#feedbackText{
  font-size:clamp(17px,4vw,22px);
  line-height:1.55;
  color:#333;
}

.confetti{
  position:fixed;
  top:-20px;
  width:12px;
  height:12px;
  z-index:9997;
  pointer-events:none;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

.hiddenGame{
  visibility:hidden;
}

@media(max-height:650px){
  #stageArea{
    top:135px;
    height:39%;
    min-height:190px;
  }

  #questionBox{
    max-height:42%;
    padding:11px;
  }

  #scoreBoard,#volumeBox{
    top:70px;
  }
}

@media(max-width:520px){
  .optionContainer{
    grid-template-columns:1fr;
  }

  #stageArea{
    height:38%;
  }

  #questionBox{
    max-height:44%;
  }

  #volumeSlider{
    width:78px;
  }
}
</style>
</head>

<body>

<div id="gameArea">

  <div id="logoScreen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
  </div>

  <div id="startScreen" class="screen">
    <h1>🎭 Talent Show Chaos</h1>
    <p>Fix the talent show using the correct conjunctions before the audience gets upset!</p>
    <button class="mainBtn" onclick="startGame()">Start Show</button>
  </div>

  <div id="endScreen" class="screen">
    <h1>🏆 Show Complete! 🏆</h1>
    <p id="finalText"></p>
    <button class="mainBtn" onclick="restartGame()">Play Again</button>
  </div>

  <div id="gameContent" class="hiddenGame">

    <div id="titleBox">🎤 Fix Stage Problems Using Conjunctions!</div>

    <div id="scoreBoard">
      ✅ Correct: <span id="correctScore">0</span><br>
      ❌ Wrong: <span id="wrongScore">0</span><br>
      📘 Question: <span id="questionNumber">0</span>/<span id="totalQuestions">10</span>
    </div>

    <div id="volumeBox">
      🔊 Volume<br>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
    </div>

    <div id="stageArea">
      <div class="curtain" id="curtainLeft"></div>
      <div class="curtain" id="curtainRight"></div>

      <div class="spotlight" id="spot1"></div>
      <div class="spotlight" id="spot2"></div>

      <div id="applauseContainer">
        <div id="applauseBar"></div>
      </div>

      <div class="performer" id="singer">🎤</div>
      <div class="performer" id="dancer">💃</div>
      <div class="performer" id="drummer">🥁</div>
    </div>

    <div id="questionBox">
      <div id="questionText"></div>
      <div class="optionContainer" id="options"></div>
    </div>

  </div>

  <div id="feedbackPopup">
    <div id="feedbackTitle"></div>
    <div id="feedbackText"></div>
  </div>

</div>

<script>
"use strict";

const TOTAL_QUESTIONS = 10;

const allQuestions = [
  {
    q:"The singer forgot the lyrics, ___ the audience still clapped loudly.",
    o:["but","because","either","unless"],
    a:0,
    e:"'But' shows contrast."
  },
  {
    q:"___ the music started, the dancers rushed onto the stage.",
    o:["When","Nor","But","Both"],
    a:0,
    e:"'When' connects the action to time."
  },
  {
    q:"___ the drummer nor the guitarist arrived on time.",
    o:["Either","Neither","Although","Because"],
    a:1,
    e:"'Neither...nor' is used to join two negative choices."
  },
  {
    q:"The band practiced hard, ___ they won the trophy.",
    o:["so","unless","neither","although"],
    a:0,
    e:"'So' shows the result."
  },
  {
    q:"___ the curtains opened, the comedian entered.",
    o:["After","Either","But","Nor"],
    a:0,
    e:"'After' shows sequence."
  },
  {
    q:"The singer was nervous, ___ she performed brilliantly.",
    o:["but","because","neither","unless"],
    a:0,
    e:"'But' joins opposite ideas."
  },
  {
    q:"The lights failed, ___ the dancers continued performing.",
    o:["but","before","either","since"],
    a:0,
    e:"'But' shows contrast."
  },
  {
    q:"___ the guitarist and drummer prepared carefully, the show started smoothly.",
    o:["Because","Neither","But","Or"],
    a:0,
    e:"'Because' explains the reason."
  },
  {
    q:"The audience cheered loudly, ___ fireworks exploded above the stage.",
    o:["and","unless","although","neither"],
    a:0,
    e:"'And' joins similar ideas."
  },
  {
    q:"___ the magician or the comedian could host the finale.",
    o:["Either","Neither","Although","Because"],
    a:0,
    e:"'Either...or' offers choices."
  }
];

let questions = [];
let currentQuestion = 0;
let correct = 0;
let wrong = 0;
let attempts = 0;
let acceptingAnswers = false;
let audioUnlocked = false;

const logoScreen = document.getElementById("logoScreen");
const startScreen = document.getElementById("startScreen");
const endScreen = document.getElementById("endScreen");
const gameContent = document.getElementById("gameContent");
const questionBox = document.getElementById("questionBox");
const questionText = document.getElementById("questionText");
const optionsBox = document.getElementById("options");
const feedbackPopup = document.getElementById("feedbackPopup");
const feedbackTitle = document.getElementById("feedbackTitle");
const feedbackText = document.getElementById("feedbackText");
const volumeSlider = document.getElementById("volumeSlider");

document.getElementById("totalQuestions").textContent = TOTAL_QUESTIONS;

setTimeout(function(){
  logoScreen.style.display = "none";
  startScreen.style.display = "flex";
},5000);

const audioFiles = {
  correct:["assets/correct.mp3","assets/right.mp3"],
  wrong:["assets/wrong.mp3","assets/buzzer.mp3"],
  clap:["assets/clapping.mp3","assets/clap.mp3","assets/freesound_community-claps-44774.mp3"]
};

function createAudioPool(list){
  return list.map(function(src){
    const a = new Audio(src);
    a.preload = "auto";
    a.volume = Number(volumeSlider.value);
    return a;
  });
}

const sounds = {
  correct:createAudioPool(audioFiles.correct),
  wrong:createAudioPool(audioFiles.wrong),
  clap:createAudioPool(audioFiles.clap)
};

function setVolume(){
  const v = Number(volumeSlider.value);
  Object.keys(sounds).forEach(function(key){
    sounds[key].forEach(function(a){
      a.volume = v;
    });
  });
}

volumeSlider.addEventListener("input",setVolume);
setVolume();

let audioCtx = null;

function unlockAudio(){
  if(audioUnlocked) return;
  audioUnlocked = true;

  Object.keys(sounds).forEach(function(key){
    sounds[key].forEach(function(a){
      a.muted = true;
      const p = a.play();
      if(p && typeof p.then === "function"){
        p.then(function(){
          a.pause();
          a.currentTime = 0;
          a.muted = false;
        }).catch(function(){
          a.muted = false;
        });
      }else{
        a.pause();
        a.currentTime = 0;
        a.muted = false;
      }
    });
  });

  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === "suspended") audioCtx.resume();
  }catch(e){}
}

function stopAllSounds(){
  Object.keys(sounds).forEach(function(key){
    sounds[key].forEach(function(a){
      try{
        a.pause();
        a.currentTime = 0;
      }catch(e){}
    });
  });
}

function playFromPool(type, fallbackType){
  const pool = sounds[type];
  let index = 0;

  function tryNext(){
    if(index >= pool.length){
      playFallback(fallbackType);
      return;
    }

    const a = pool[index];
    index++;

    try{
      a.pause();
      a.currentTime = 0;
      a.volume = Number(volumeSlider.value);

      const p = a.play();
      if(p && typeof p.catch === "function"){
        p.catch(function(){ tryNext(); });
      }
    }catch(e){
      tryNext();
    }
  }

  tryNext();
}

function playFallback(type){
  try{
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    if(audioCtx.state === "suspended") audioCtx.resume();

    const volume = Number(volumeSlider.value);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if(type === "correct"){
      osc.frequency.setValueAtTime(660,audioCtx.currentTime);
      osc.frequency.setValueAtTime(880,audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.0001,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.01,volume * 0.18),audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime + 0.35);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.36);
    }else if(type === "wrong"){
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(180,audioCtx.currentTime);
      osc.frequency.setValueAtTime(120,audioCtx.currentTime + 0.18);
      gain.gain.setValueAtTime(0.0001,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.01,volume * 0.16),audioCtx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime + 0.38);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.39);
    }else{
      for(let i=0;i<4;i++){
        const clickOsc = audioCtx.createOscillator();
        const clickGain = audioCtx.createGain();

        clickOsc.connect(clickGain);
        clickGain.connect(audioCtx.destination);

        clickOsc.frequency.value = 900 + (i * 80);
        clickGain.gain.setValueAtTime(0.0001,audioCtx.currentTime + i * 0.12);
        clickGain.gain.exponentialRampToValueAtTime(Math.max(0.01,volume * 0.12),audioCtx.currentTime + i * 0.12 + 0.01);
        clickGain.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime + i * 0.12 + 0.08);

        clickOsc.start(audioCtx.currentTime + i * 0.12);
        clickOsc.stop(audioCtx.currentTime + i * 0.12 + 0.09);
      }
    }
  }catch(e){}
}

function playCorrectSounds(){
  stopAllSounds();
  playFromPool("correct","correct");
  setTimeout(function(){
    playFromPool("clap","clap");
  },450);
}

function playWrongSound(){
  stopAllSounds();
  playFromPool("wrong","wrong");
}

function shuffleArray(arr){
  const copy = arr.slice();
  for(let i=copy.length-1;i>0;i--){
    const j = Math.floor(Math.random() * (i + 1));
    const temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

function prepareQuestions(){
  questions = shuffleArray(allQuestions).slice(0,TOTAL_QUESTIONS);
}

function startGame(){
  unlockAudio();

  startScreen.style.display = "none";
  endScreen.style.display = "none";
  gameContent.classList.remove("hiddenGame");

  prepareQuestions();

  currentQuestion = 0;
  correct = 0;
  wrong = 0;
  attempts = 0;

  updateScore();
  openCurtains();
  loadQuestion();
}

function restartGame(){
  unlockAudio();

  endScreen.style.display = "none";
  gameContent.classList.remove("hiddenGame");

  document.getElementById("curtainLeft").style.transform = "translateX(0)";
  document.getElementById("curtainRight").style.transform = "translateX(0)";
  document.getElementById("applauseBar").style.width = "0%";

  prepareQuestions();

  currentQuestion = 0;
  correct = 0;
  wrong = 0;
  attempts = 0;

  updateScore();

  setTimeout(function(){
    openCurtains();
    loadQuestion();
  },350);
}

function openCurtains(){
  document.getElementById("curtainLeft").style.transform = "translateX(-100%)";
  document.getElementById("curtainRight").style.transform = "translateX(100%)";
}

function updateScore(){
  document.getElementById("correctScore").textContent = correct;
  document.getElementById("wrongScore").textContent = wrong;
  document.getElementById("questionNumber").textContent =
    currentQuestion + 1 <= TOTAL_QUESTIONS ? currentQuestion + 1 : TOTAL_QUESTIONS;

  document.getElementById("applauseBar").style.width =
    ((correct / TOTAL_QUESTIONS) * 100) + "%";
}

function loadQuestion(){
  acceptingAnswers = false;
  attempts = 0;
  questionBox.style.display = "none";
  feedbackPopup.style.display = "none";

  animateStage();

  setTimeout(function(){
    const q = questions[currentQuestion];

    questionBox.style.display = "block";
    questionText.textContent = q.q;
    optionsBox.innerHTML = "";

    q.o.forEach(function(option,index){
      const btn = document.createElement("button");
      btn.className = "optionBtn";
      btn.textContent = option;
      btn.type = "button";

      btn.onclick = function(){
        checkAnswer(index);
      };

      optionsBox.appendChild(btn);
    });

    acceptingAnswers = true;
    updateScore();
  },500);
}

function animateStage(){
  document.getElementById("singer").style.transform = "translateY(-18px)";
  document.getElementById("dancer").style.transform = "rotate(14deg)";
  document.getElementById("drummer").style.transform = "translateY(-14px)";

  setTimeout(function(){
    document.getElementById("singer").style.transform = "translateY(0)";
    document.getElementById("dancer").style.transform = "rotate(-14deg)";
    document.getElementById("drummer").style.transform = "translateY(0)";
  },500);
}

function disableOptions(disabled){
  const buttons = optionsBox.querySelectorAll("button");
  buttons.forEach(function(btn){
    btn.disabled = disabled;
  });
}

function checkAnswer(selected){
  if(!acceptingAnswers) return;

  const q = questions[currentQuestion];
  const buttons = optionsBox.querySelectorAll("button");

  if(selected === q.a){
    acceptingAnswers = false;
    disableOptions(true);

    correct++;
    updateScore();

    playCorrectSounds();
    createConfetti();

    showFeedback("✅ Correct!", "green", q.e);

    setTimeout(function(){
      nextQuestion();
    },2600);

  }else{
    attempts++;
    playWrongSound();

    if(attempts < 2){
      wrong++;
      updateScore();

      showFeedback("❌ Try Again!", "red", "Look carefully and choose once more.");

      setTimeout(function(){
        feedbackPopup.style.display = "none";
      },1300);

    }else{
      acceptingAnswers = false;
      disableOptions(true);

      wrong++;
      updateScore();

      if(buttons[q.a]){
        buttons[q.a].classList.add("correctGlow");
      }

      showFeedback(
        "💡 Correct Answer",
        "#ef6c00",
        "The correct answer is <b>" + q.o[q.a] + "</b>.<br><br>" + q.e
      );

      setTimeout(function(){
        nextQuestion();
      },3000);
    }
  }
}

function showFeedback(title,color,text){
  feedbackTitle.innerHTML = title;
  feedbackTitle.style.color = color;
  feedbackText.innerHTML = text;
  feedbackPopup.style.display = "block";
}

function nextQuestion(){
  feedbackPopup.style.display = "none";
  questionBox.style.display = "none";

  currentQuestion++;

  if(currentQuestion >= TOTAL_QUESTIONS){
    endGame();
  }else{
    loadQuestion();
  }
}

function endGame(){
  gameContent.classList.add("hiddenGame");
  endScreen.style.display = "flex";

  const percentage = Math.round((correct / TOTAL_QUESTIONS) * 100);
  let remark = "";

  if(percentage >= 80){
    remark = "🌟 Excellent!";
  }else if(percentage >= 60){
    remark = "👏 Good job!";
  }else if(percentage >= 45){
    remark = "😊 Well tried!";
  }else{
    remark = "📘 Let us revise and come back!";
  }

  document.getElementById("finalText").innerHTML =
    "You answered <b>" + correct + " out of " + TOTAL_QUESTIONS + "</b> correctly.<br><br>" +
    "Score: <b>" + percentage + "%</b><br><br>" +
    remark;

  createConfetti();
}

function createConfetti(){
  const colors = ["#ffeb3b","#ff9800","#4caf50","#03a9f4","#e91e63","#ffffff"];

  for(let i=0;i<50;i++){
    const conf = document.createElement("div");
    conf.className = "confetti";
    conf.style.left = Math.random() * 100 + "vw";
    conf.style.background = colors[Math.floor(Math.random() * colors.length)];
    conf.style.animationDuration = (2 + Math.random() * 1.8) + "s";
    conf.style.transform = "rotate(" + (Math.random() * 360) + "deg)";

    document.body.appendChild(conf);

    setTimeout(function(){
      conf.remove();
    },4200);
  }
}

window.addEventListener("pointerdown",unlockAudio,{once:true});
window.addEventListener("touchstart",unlockAudio,{once:true});
window.addEventListener("keydown",unlockAudio,{once:true});
</script>
