<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Air Balloon Adverbs Game</title>
<style>
  body, html { margin: 0; padding: 0; font-family: Arial, sans-serif; }
  #splash {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    background: #fff; display: flex;
    justify-content: center; align-items: center;
    z-index: 1000;
  }
  #splash img { width: 300px; }
  #game { display: none; text-align: center; padding-top: 20px; }
  #question { font-size: 24px; margin: 20px; }
  #options button {
    background-color: orange;
    border: none; color: white;
    padding: 15px 30px;
    margin: 10px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 8px;
  }
  #track-container {
    position: relative;
    width: 600px; height: 400px;
    margin: 20px auto;
    background: #d0f0f7;
    border-radius: 20px;
    overflow: hidden;
  }
  #track {
    position: absolute; bottom: 50px; left: 0;
    width: 100%; height: 200px;
    background: #777; border-radius: 10px;
    display: flex; justify-content: flex-start; align-items: center;
    padding-left: 20px;
  }
  #track img { height: 100px; transition: left 0.5s; position: relative; left: 0; }
  #score { font-size: 20px; margin: 10px; }
</style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <img src="assets/logo.png" alt="Innovine Logo">
</div>

<!-- Game Interface -->
<div id="game">
  <div id="score">Score: 0</div>
  <div id="question">Select the correct adverb to make the balloon rise!</div>
  <div id="track-container">
    <div id="track">
      <img id="balloon" src="assets/balloon.png" alt="Balloon">
    </div>
  </div>
  <div id="options">
    <button onclick="checkAnswer(this)">Option 1</button>
    <button onclick="checkAnswer(this)">Option 2</button>
    <button onclick="checkAnswer(this)">Option 3</button>
    <button onclick="checkAnswer(this)">Option 4</button>
  </div>
</div>

<audio id="correct-sound" src="assets/correct.mp3"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3"></audio>

<script>
const questions = [
  {q:"We will meet ___ at the park.", options:["quickly","red","book","slow"], answer:0},
  {q:"She runs ___ than her sister.", options:["happily","softly","loud","better"], answer:3},
  {q:"The dog barked ___ at the stranger.", options:["loudly","red","big","small"], answer:0},
  {q:"He finished his work ___ than before.", options:["faster","book","nice","hard"], answer:0},
  {q:"I will call you ___ tomorrow.", options:["later","ball","small","here"], answer:0}
];

let current = 0;
let score = 0;
const balloon = document.getElementById("balloon");
const scoreEl = document.getElementById("score");
const questionEl = document.getElementById("question");
const buttons = document.querySelectorAll("#options button");

function showQuestion() {
  if(current >= questions.length){
    alert("Game Over! Score: "+score);
    current = 0;
    score = 0;
    balloon.style.left = "0px";
  }
  let q = questions[current];
  questionEl.textContent = q.q;
  buttons.forEach((b,i)=> b.textContent = q.options[i]);
}

function checkAnswer(btn){
  const q = questions[current];
  if(btn.textContent === q.options[q.answer]){
    document.getElementById("correct-sound").play();
    score++;
    balloon.style.left = (score*100)+"px"; // Move balloon forward
  } else {
    document.getElementById("wrong-sound").play();
  }
  scoreEl.textContent = "Score: "+score;
  current++;
  showQuestion();
}

// Splash timeout
setTimeout(()=>{
  document.getElementById("splash").style.display = "none";
  document.getElementById("game").style.display = "block";
  showQuestion();
}, 5000);
</script>

</body>
</html>
