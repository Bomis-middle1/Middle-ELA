<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prepositions Game</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom, #fddde6, #cceeff);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        height: 100vh;
    }

    .scoreboard {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 2rem;
        font-weight: bold;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0px 3px 6px rgba(0,0,0,0.2);
    }

    .question {
        margin: 30px 0;
        font-size: 2rem;
        text-align: center;
        font-weight: bold;
        max-width: 90%;
    }

    .options {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 20px;
    }

    .option-btn {
        padding: 15px 25px;
        font-size: 1.5rem;
        border: none;
        border-radius: 12px;
        background-color: orange;
        color: white;
        cursor: pointer;
        transition: transform 0.2s, background-color 0.2s;
    }

    .option-btn:hover {
        transform: scale(1.1);
        background-color: #ff8c00;
    }

    .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }
</style>
</head>
<body>

<div class="scoreboard" id="scoreboard">Score: 0</div>

<div class="question" id="question">The dog ran ___ the garden.</div>

<div class="options">
    <button class="option-btn" onclick="checkAnswer('through')">through</button>
    <button class="option-btn" onclick="checkAnswer('over')">over</button>
    <button class="option-btn" onclick="checkAnswer('on')">on</button>
    <button class="option-btn" onclick="checkAnswer('in')">in</button>
</div>

<script>
let score = 0;
const correctAnswer = "through";

function checkAnswer(answer) {
    if(answer === correctAnswer) {
        score++;
        alert("Correct!");
    } else {
        alert("Wrong!");
    }
    document.getElementById('scoreboard').innerText = 'Score: ' + score;
}
</script>

</body>
</html>
