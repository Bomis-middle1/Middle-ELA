<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figures of Speech Sorting Lab</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #d1c4e9, #f8bbd0);
  overflow: hidden;
  color: #222;
}

/* SPLASH */
#splash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: white;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#splash img {
  width: 200px;
}

#startBtn {
  margin-top: 20px;
  padding: 12px 25px;
  background: #ff4081;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

/* GAME */
.container {
  display: none;
  text-align: center;
  padding: 20px;
}

h1 {
  color: #4a148c;
}

#score {
  font-size: 18px;
  margin: 10px;
}

.sentence {
  font-size: 22px;
  margin: 25px;
  font-weight: bold;
}

/* OPTIONS */
.buttons button {
  background: #ffb300;
  border: none;
  padding: 12px 18px;
  margin: 10px;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

.buttons button:hover {
  transform: scale(1.05);
}

/* END SCREEN */
#endScreen {
  display: none;
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  color: white;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

#restartBtn {
  margin-top: 20px;
  padding: 12px 25px;
  border: none;
  background: #22c55e;
  color: white;
  border-radius: 10px;
  font-size: 16px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="assets/logo.png">
  <button id="startBtn">Start Game</button>
</div>

<!-- GAME -->
<div class="container" id="game">
  <h1>Figures of Speech Sorting Lab</h1>
  <div id="score">Score: 0</div>

  <div class="sentence" id="sentence"></div>
  <div class="buttons" id="options"></div>
</div>

<!-- END -->
<div id="endScreen">
  <h1>Great Job! 🎉</h1>
  <h2 id="finalScore"></h2>
  <button id="restartBtn" onclick="location.reload()">Play Again</button>
</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

const questions = [
  {sentence:"I could eat a mountain of food!", answer:"Hyperbole"},
  {sentence:"The wind whispered through the trees.", answer:"Personification"},
  {sentence:"Life is a rollercoaster.", answer:"Metaphor"},
  {sentence:"He is as brave as a lion.", answer:"Simile"},
  {sentence:"The stars danced in the sky.", answer:"Personification"},
  {sentence:"I’m so hungry I could eat a horse!", answer:"Hyperbole"},
  {sentence:"Time is a thief.", answer:"Metaphor"},
  {sentence:"Her smile was like sunshine.", answer:"Simile"},
  {sentence:"The leaves waved in the wind.", answer:"Personification"},
  {sentence:"He ran faster than the wind.", answer:"Hyperbole"}
];

let current = 0;
let score = 0;

const splash = document.getElementById("splash");
const game = document.getElementById("game");
const sentenceEl = document.getElementById("sentence");
const optionsEl = document.getElementById("options");
const scoreEl = document.getElementById("score");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");
const clapSound = document.getElementById("clapSound");

document.getElementById("startBtn").onclick = () => {
  splash.style.display = "none";
  game.style.display = "block";
  loadQ();
};

function loadQ() {

  if(current >= questions.length){
    endGame();
    return;
  }

  let q = questions[current];
  sentenceEl.textContent = q.sentence;

  optionsEl.innerHTML = "";

  let opts = ["Hyperbole", "Simile", "Metaphor", "Personification"];
  opts.sort(() => Math.random() - 0.5);

  opts.forEach(opt => {
    let btn = document.createElement("button");
    btn.innerText = opt;
    btn.onclick = () => check(opt);
    optionsEl.appendChild(btn);
  });
}

function check(opt){
  let correct = questions[current].answer;

  if(opt === correct){
    correctSound.play();
    score += 10;
    scoreEl.textContent = "Score: " + score;
    current++;
    loadQ();
  } else {
    wrongSound.play();
  }
}

function endGame(){
  clapSound.play();
  game.style.display = "none";
  document.getElementById("endScreen").style.display = "flex";
  document.getElementById("finalScore").textContent =
    "Your Score: " + score + " / " + questions.length * 10;
}

</script>

</body>
</html>
