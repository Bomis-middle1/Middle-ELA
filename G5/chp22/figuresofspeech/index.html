<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figures of Speech Sorting Lab</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #f3e5f5, #f8bbd0);
  overflow: hidden;
}

/* SPLASH */
#splash {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 99999;
}

#splash img {
  width: 180px;
}

/* GAME */
#game {
  display: none;
  text-align: center;
  padding: 10px;
}

#score {
  font-size: 18px;
  margin: 10px;
}

/* DRAG ITEMS */
#items {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}

.item {
  background: #ffb300;
  padding: 10px 15px;
  border-radius: 10px;
  cursor: grab;
  user-select: none;
  max-width: 220px;
}

/* BUCKETS */
#buckets {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
}

.bucket {
  width: 200px;
  min-height: 150px;
  border: 3px dashed #444;
  border-radius: 12px;
  padding: 10px;
  background: rgba(255,255,255,0.5);
}

.bucket h3 {
  margin: 5px;
}

/* END */
#endScreen {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  color: white;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="assets/logo.png">
</div>

<!-- GAME -->
<div id="game">

  <h2>Figures of Speech Sorting Lab</h2>
  <div id="score">Score: 0</div>

  <div id="items"></div>

  <div id="buckets">

    <div class="bucket" data-type="Simile"><h3>Simile</h3></div>
    <div class="bucket" data-type="Metaphor"><h3>Metaphor</h3></div>
    <div class="bucket" data-type="Personification"><h3>Personification</h3></div>
    <div class="bucket" data-type="Hyperbole"><h3>Hyperbole</h3></div>

  </div>
</div>

<!-- END -->
<div id="endScreen">
  <h1>Great Job 🎉</h1>
  <h2 id="finalScore"></h2>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

const questions = [
{ text:"He is as brave as a lion", type:"Simile" },
{ text:"Her smile is like sunshine", type:"Simile" },
{ text:"Time is a thief", type:"Metaphor" },
{ text:"The classroom was a zoo", type:"Metaphor" },
{ text:"The wind whispered through the trees", type:"Personification" },
{ text:"The stars danced in the sky", type:"Personification" },
{ text:"I’m so hungry I could eat a horse", type:"Hyperbole" },
{ text:"He ran faster than the wind", type:"Hyperbole" }
];

let score = 0;
let remaining = [...questions];

const itemsDiv = document.getElementById("items");
const scoreDiv = document.getElementById("score");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");
const clapSound = document.getElementById("clapSound");

/* SPLASH (5 sec lock) */
window.onload = () => {
  setTimeout(() => {
    document.getElementById("splash").style.display = "none";
    document.getElementById("game").style.display = "block";
    loadItems();
    enableDrop();
  }, 5000);
};

/* LOAD ITEMS */
function loadItems() {
  itemsDiv.innerHTML = "";

  remaining.forEach(q => {
    let div = document.createElement("div");
    div.className = "item";
    div.draggable = true;
    div.innerText = q.text;
    div.dataset.type = q.type;

    div.ondragstart = (e) => {
      e.dataTransfer.setData("text/plain", JSON.stringify(q));
    };

    itemsDiv.appendChild(div);
  });
}

/* DROP SYSTEM (TRUE CALM CHOICE STYLE) */
function enableDrop() {

  document.querySelectorAll(".bucket").forEach(bucket => {

    bucket.ondragover = (e) => {
      e.preventDefault();
    };

    bucket.ondrop = (e) => {
      e.preventDefault();

      let data = JSON.parse(e.dataTransfer.getData("text/plain"));

      if (data.type === bucket.dataset.type) {
        correctSound.play();
        score += 10;
        scoreDiv.innerText = "Score: " + score;

        remaining = remaining.filter(i => i.text !== data.text);

      } else {
        wrongSound.play();
      }

      loadItems();

      if (remaining.length === 0) {
        endGame();
      }
    };

  });
}

/* END GAME */
function endGame() {
  document.getElementById("game").style.display = "none";
  document.getElementById("endScreen").style.display = "flex";

  clapSound.play();
  document.getElementById("finalScore").innerText =
    "Score: " + score + " / " + questions.length * 10;
}

</script>

</body>
</html>
