<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figures of Speech Potion Lab</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Arvo:wght@700&display=swap');
  body, html {
    margin: 0;
    padding: 0;
    font-family: 'Arvo', serif;
    overflow-x: hidden;
  }

  /* Splash screen */
  #splash {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
  }
  #splash img {
    width: 250px;
    height: auto;
  }

  /* Background gradient and bubbles */
  body {
    background: linear-gradient(135deg, #d1c4e9, #f8bbd0);
    position: relative;
    min-height: 100vh;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    opacity: 0.6;
    animation: float 15s linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0.5); }
    100% { transform: translateY(-100vh) scale(1); }
  }

  /* Container */
  .container {
    max-width: 900px;
    margin: auto;
    text-align: center;
    padding: 30px 10px;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 10px;
    color: #4a148c;
  }

  h2 {
    font-size: 1.3rem;
    margin-bottom: 20px;
  }

  h3 {
    font-size: 1.8rem;
    margin-bottom: 25px;
    color: #1a237e;
  }

  .buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 40px;
  }

  .buttons button {
    background: #ffb300;
    color: #fff;
    border: none;
    padding: 15px 25px;
    margin: 10px;
    font-size: 1.2rem;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .buttons button:hover {
    transform: scale(1.05);
  }

  /* Potion container */
  .potion-container {
    position: relative;
    width: 60px;
    height: 250px;
    margin: auto;
    border: 3px solid #4a148c;
    border-radius: 15px;
    overflow: hidden;
    background: #fff;
  }
  .potion-fill {
    width: 100%;
    background: #ff4081;
    height: 0;
    transition: height 0.5s ease;
  }
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <img src="assets/logo.png" alt="Innovine Logo">
</div>

<!-- Bubbles -->
<script>
  for(let i=0;i<30;i++){
    let bubble=document.createElement('div');
    bubble.classList.add('bubble');
    bubble.style.width = `${Math.random()*40+10}px`;
    bubble.style.height = bubble.style.width;
    bubble.style.left = `${Math.random()*100}vw`;
    bubble.style.background = `rgba(255,255,255,${Math.random()})`;
    bubble.style.animationDuration = `${Math.random()*20+10}s`;
    document.body.appendChild(bubble);
  }
</script>

<div class="container" id="game" style="display:none;">
  <h1>Figures of Speech Potion Lab</h1>
  <h2>Click the correct figure of speech to fill the potion!</h2>
  <h3 id="sentence">Sentence goes here</h3>
  <div class="buttons" id="choices"></div>
  <div class="potion-container">
    <div class="potion-fill" id="potion"></div>
  </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const splash = document.getElementById('splash');
const game = document.getElementById('game');
const sentenceEl = document.getElementById('sentence');
const choicesEl = document.getElementById('choices');
const potionEl = document.getElementById('potion');
const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const clapSound = document.getElementById('clapSound');

const questions = [
  {sentence: "I could eat a mountain of food!", answer:"Hyperbole"},
  {sentence: "The wind whispered through the trees.", answer:"Personification"},
  {sentence: "Life is a rollercoaster.", answer:"Metaphor"},
  {sentence: "He is as brave as a lion.", answer:"Simile"},
  {sentence: "The stars danced in the sky.", answer:"Personification"},
  {sentence: "I’m so hungry I could eat a horse!", answer:"Hyperbole"},
  {sentence: "Time is a thief.", answer:"Metaphor"},
  {sentence: "Her smile was like sunshine.", answer:"Simile"},
  {sentence: "The leaves waved in the wind.", answer:"Personification"},
  {sentence: "He ran faster than the wind.", answer:"Hyperbole"},
  {sentence: "The classroom was a zoo.", answer:"Metaphor"},
  {sentence: "She sang like an angel.", answer:"Simile"}
];

let currentQ = 0;
let potionLevel = 0;
let attempts = 0;

function startGame() {
  splash.style.display='none';
  game.style.display='block';
  showQuestion();
}

function showQuestion(){
  if(currentQ>=questions.length){
    clapSound.play();
    setTimeout(()=>{alert("Potion complete! Well done!");},200);
    return;
  }
  attempts=0;
  const q = questions[currentQ];
  sentenceEl.textContent=q.sentence;

  choicesEl.innerHTML="";
  const options = ["Hyperbole","Simile","Metaphor","Personification"];
  options.sort(()=>Math.random()-0.5); // shuffle

  options.forEach(opt=>{
    const btn=document.createElement('button');
    btn.textContent=opt;
    btn.onclick=()=>checkAnswer(opt);
    choicesEl.appendChild(btn);
  });
}

function checkAnswer(selected){
  const correct = questions[currentQ].answer;
  if(selected===correct){
    correctSound.play();
    potionLevel += (100/questions.length);
    potionEl.style.height=potionLevel+'%';
    currentQ++;
    setTimeout(showQuestion,400);
  } else {
    wrongSound.play();
    attempts++;
    if(attempts<2){
      alert("Try again!");
    } else {
      currentQ++;
      setTimeout(showQuestion,300);
    }
  }
}

// Start game after 3s splash
setTimeout(startGame,3000);
</script>
</body>
</html>
