<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figures of Speech Sorting Lab</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #e1bee7, #f8bbd0);
  overflow: hidden;
}

/* ================= SPLASH (PRODUCTION STANDARD) ================= */
#splash {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 99999;
  opacity: 1;
  transition: opacity 0.8s ease;
  pointer-events: all;
}

#splash img {
  width: 180px;
}

/* ================= GAME ================= */
#game {
  display: none;
  padding: 15px;
  text-align: center;
}

h2 {
  margin: 10px;
  color: #4a148c;
}

#score {
  font-size: 18px;
  margin: 10px;
}

/* ITEMS */
#items {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 20px 0;
}

.item {
  background: #ffb300;
  padding: 10px 15px;
  border-radius: 10px;
  cursor: grab;
  user-select: none;
}

/* BUCKETS */
#buckets {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}

.bucket {
  width: 200px;
  min-height: 150px;
  border: 3px dashed #444;
  border-radius: 10px;
  padding: 10px;
  background: rgba(255,255,255,0.4);
}

.bucket h3 {
  margin: 5px;
}

/* END SCREEN */
#endScreen {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  color: white;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
}
</style>
</head>

<body>

<!-- ================= SPLASH ================= -->
<div id="splash">
  <img src="assets/logo.png">
</div>

<!-- ================= GAME ================= -->
<div id="game">

  <h2>Figures of Speech Sorting Lab</h2>
  <div id="score">Score: 0</div>

  <div id="items"></div>

  <div id="buckets">

    <div class="bucket" data-type="Simile"><h3>Simile</h3></div>
    <div class="bucket" data-type="Metaphor"><h3>Metaphor</h3></div>
    <div class="bucket" data-type="Personification"><h3>Personification</h3></div>
    <div class="bucket" data-type="Hyperbole"><h3>Hyperbole</h3></div>

  </div>
</div>

<!-- ================= END ================= -->
<div id="endScreen">
  <h1>Great Job 🎉</h1>
  <h2 id="finalScore"></h2>
</div>

<!-- ================= AUDIO ================= -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

/* ================= DATA ================= */
const questions = [
{ text:"He is as brave as a lion", type:"Simile" },
{ text:"Her smile is like sunshine", type:"Simile" },
{ text:"Time is a thief", type:"Metaphor" },
{ text:"The classroom was a zoo", type:"Metaphor" },
{ text:"The wind whispered through the trees", type:"Personification" },
{ text:"The stars danced in the sky", type:"Personification" },
{ text:"I’m so hungry I could eat a horse", type:"Hyperbole" },
{ text:"He ran faster than the wind", type:"Hyperbole" }
];

let currentItems = [];
let score = 0;

const itemsDiv = document.getElementById("items");
const scoreDiv = document.getElementById("score");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");
const clapSound = document.getElementById("clapSound");

/* ================= SPLASH (PRODUCTION LOGIC) ================= */
window.onload = () => {
  setTimeout(() => {
    const splash = document.getElementById("splash");

    splash.style.opacity = "0";

    setTimeout(() => {
      splash.style.display = "none";
      startGame();
    }, 800);

  }, 5000); // EXACT 5 SECONDS LOCK
};

/* ================= START GAME ================= */
function startGame() {
  document.getElementById("game").style.display = "block";
  loadItems();
  enableDrop();
}

/* ================= LOAD ITEMS ================= */
function loadItems() {
  itemsDiv.innerHTML = "";
  currentItems = [...questions];

  currentItems.forEach(q => {
    let div = document.createElement("div");
    div.className = "item";
    div.draggable = true;
    div.innerText = q.text;
    div.dataset.type = q.type;

    div.ondragstart = (e) => {
      e.dataTransfer.setData("text", JSON.stringify(q));
    };

    itemsDiv.appendChild(div);
  });
}

/* ================= DROP LOGIC ================= */
function enableDrop() {
  document.querySelectorAll(".bucket").forEach(bucket => {

    bucket.ondragover = (e) => e.preventDefault();

    bucket.ondrop = (e) => {
      e.preventDefault();

      let data = JSON.parse(e.dataTransfer.getData("text"));

      if (data.type === bucket.dataset.type) {
        correctSound.play();
        score += 10;
        scoreDiv.innerText = "Score: " + score;
      } else {
        wrongSound.play();
      }

      currentItems = currentItems.filter(i => i.text !== data.text);
      loadItems();

      if (currentItems.length === 0) endGame();
    };

  });
}

/* ================= END ================= */
function endGame() {
  document.getElementById("game").style.display = "none";
  document.getElementById("endScreen").style.display = "flex";

  clapSound.play();
  document.getElementById("finalScore").innerText =
    "Score: " + score;
}

</script>

</body>
</html>
