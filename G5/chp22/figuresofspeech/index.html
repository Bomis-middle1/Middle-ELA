<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figures of Speech Potion Lab</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, #fbb1b1, #c6baff);
  }

  /* Logo Splash */
  #splash {
    position: fixed;
    top:0; left:0;
    width: 100%; height: 100%;
    background: #fff;
    display: flex; align-items:center; justify-content:center;
    z-index: 999;
  }

  #splash img {
    width: 250px;
  }

  /* Container */
  #gameContainer {
    display: none;
    position: relative;
    width: 80%;
    max-width: 900px;
    margin: 40px auto;
    padding: 30px;
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    text-align: center;
    box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
    z-index: 1;
  }

  #instruction {
    font-weight: bold;
    font-size: 20px;
    margin-bottom: 20px;
  }

  #score, #timer {
    font-weight: bold;
    font-size: 18px;
  }

  #question {
    font-weight: bold;
    font-size: 28px;
    margin: 30px 0;
  }

  .optionBtn {
    display: inline-block;
    padding: 15px 25px;
    margin: 10px;
    font-size: 20px;
    font-weight: bold;
    background-color: orange;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .optionBtn:hover {
    transform: scale(1.1);
  }

  /* Potion */
  #potionContainer {
    position: relative;
    width: 60px;
    height: 200px;
    border: 3px solid #6a0dad;
    border-radius: 10px;
    margin: 30px auto;
    background: #fff;
  }

  #potionFill {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 0%;
    background: #ff2e8a;
    border-radius: 8px 8px 0 0;
    transition: height 0.5s ease;
  }

  /* Confetti */
  .confetti {
    position: absolute;
    width: 10px;
    height: 10px;
    background-color: #ff0;
    opacity: 0.8;
    animation: fall linear infinite;
    z-index: 2;
  }

  @keyframes fall {
    0% {transform: translateY(-10px) rotate(0deg);}
    100% {transform: translateY(700px) rotate(360deg);}
  }

  /* Floating bubbles */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% {transform: translateY(100vh);}
    100% {transform: translateY(-50px);}
  }

  /* End screen */
  #endScreen {
    display: none;
    font-size: 28px;
    font-weight: bold;
  }

</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <img src="assets/logo.png" alt="Innovine Logo">
</div>

<!-- Game Container -->
<div id="gameContainer">
  <div id="instruction">Click the correct figure of speech to fill the potion!</div>
  <div id="score">Score: 0</div>
  <div id="timer">Time Left: 60s</div>
  <div id="question"></div>
  <div id="options"></div>
  <div id="potionContainer">
    <div id="potionFill"></div>
  </div>
  <div id="endScreen">Potion Completed! Game Over!</div>
</div>

<script>
const questions = [
  {q: "I could eat a mountain of food!", options: ["Hyperbole","Simile","Metaphor","Personification"], ans: "Hyperbole"},
  {q: "The stars danced in the sky.", options: ["Personification","Hyperbole","Simile","Alliteration"], ans: "Personification"},
  {q: "He is as brave as a lion.", options: ["Simile","Hyperbole","Metaphor","Onomatopoeia"], ans: "Simile"},
  {q: "Time is a thief.", options: ["Metaphor","Hyperbole","Simile","Personification"], ans: "Metaphor"},
  {q: "Sally sells sea shells by the sea shore.", options: ["Alliteration","Onomatopoeia","Personification","Metaphor"], ans: "Alliteration"},
  {q: "The bees buzzed angrily.", options: ["Onomatopoeia","Alliteration","Metaphor","Hyperbole"], ans: "Onomatopoeia"},
  {q: "The classroom was a zoo.", options: ["Metaphor","Simile","Personification","Hyperbole"], ans: "Metaphor"},
  {q: "He is stronger than ten men!", options: ["Hyperbole","Simile","Personification","Metaphor"], ans: "Hyperbole"},
  {q: "The wind whispered through the trees.", options: ["Personification","Hyperbole","Onomatopoeia","Alliteration"], ans: "Personification"},
  {q: "Her cheeks were as red as roses.", options: ["Simile","Metaphor","Alliteration","Hyperbole"], ans: "Simile"},
  {q: "The thunder grumbled like an old man.", options: ["Simile","Onomatopoeia","Personification","Metaphor"], ans: "Simile"},
  {q: "He runs faster than the wind.", options: ["Hyperbole","Simile","Metaphor","Personification"], ans: "Hyperbole"}
];

let current = 0;
let score = 0;
let potion = 0;
const totalPotion = 12;

const gameContainer = document.getElementById("gameContainer");
const questionDiv = document.getElementById("question");
const optionsDiv = document.getElementById("options");
const potionFill = document.getElementById("potionFill");
const endScreen = document.getElementById("endScreen");

function showQuestion() {
  questionDiv.textContent = questions[current].q;
  optionsDiv.innerHTML = "";
  questions[current].options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "optionBtn";
    btn.textContent = opt;
    btn.onclick = ()=> checkAnswer(opt);
    optionsDiv.appendChild(btn);
  });
}

function checkAnswer(selected){
  const correct = questions[current].ans;
  if(selected===correct){
    score++;
    potion++;
    potionFill.style.height = (potion/totalPotion*100) + "%";
    current++;
    if(current>=questions.length){
      gameOver();
      return;
    }
    showQuestion();
  } else {
    alert("Try again!");
  }
}

function gameOver(){
  questionDiv.style.display="none";
  optionsDiv.style.display="none";
  endScreen.style.display="block";
}

setTimeout(()=>{
  document.getElementById("splash").style.display="none";
  gameContainer.style.display="block";
  showQuestion();
},3000);

// Create floating bubbles
for(let i=0;i<20;i++){
  const bubble = document.createElement("div");
  bubble.className="bubble";
  bubble.style.width = (10+Math.random()*30)+"px";
  bubble.style.height = bubble.style.width;
  bubble.style.left = Math.random()*100+"%";
  bubble.style.animationDuration = (5+Math.random()*10)+"s";
  document.body.appendChild(bubble);
}
</script>
</body>
</html>
