<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentence Transformation Lab</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1020;
  color:white;
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#splash img{width:380px}

/* MAIN */
#game{
  display:none;
  padding:20px;
  max-width:1100px;
  margin:auto;
}

/* HEADER */
h1{
  text-align:center;
  font-size:32px;
  color:#facc15;
}
.sub{
  text-align:center;
  color:#cbd5e1;
  margin-bottom:10px;
}

/* JOURNEY */
#journey{
  display:flex;
  justify-content:space-between;
  margin:20px 0;
  position:relative;
}

.line{
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:5px;
  background:#334155;
  border-radius:10px;
  z-index:0;
}

.node{
  width:30px;
  height:30px;
  border-radius:50%;
  background:#334155;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  z-index:1;
}

.node.active{
  background:#22c55e;
  box-shadow:0 0 15px #22c55e;
  transform:scale(1.2);
}

/* QUESTION */
.box{
  background:#111827;
  padding:20px;
  border-radius:12px;
}

.q{
  font-size:24px;
  font-weight:bold;
  margin-bottom:10px;
  color:#93c5fd;
}

.inst{
  color:#fbbf24;
  margin-bottom:10px;
  font-size:18px;
}

.option{
  background:#1f2937;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  cursor:pointer;
  font-size:18px;
}
.option:hover{background:#374151}

/* SCORE */
.score{
  margin-top:15px;
  font-size:18px;
}
</style>
</head>

<body>

<div id="splash">
  <img src="assets/logo.png">
</div>

<div id="game">

<h1>Sentence Transformation Lab</h1>
<div class="sub">Grade 5 Grammar • Based on Your Chapter Rules</div>

<div id="journey">
  <div class="line"></div>
</div>

<div class="box">
  <div class="q" id="q"></div>
  <div class="inst" id="inst"></div>
  <div id="options"></div>
</div>

<div class="score">
Score: <span id="score">0</span> | Level: <span id="level">1</span>/15
</div>

</div>

<script>

/* ================= CHAPTER ACCURATE DATA ================= */
const rawData = [
{
q:"She is a good player.",
inst:"Change to Negative using rules",
options:[
"She is not a bad player.",
"She is bad player.",
"She not good player.",
"She no good player."
],
answer:"She is not a bad player."
},
{
q:"He is very strong.",
inst:"Change to Negative",
options:[
"He is not weak.",
"He not strong.",
"He weak is.",
"He no strong."
],
answer:"He is not weak."
},
{
q:"I like tea and coffee.",
inst:"Use BOTH...AND rule",
options:[
"I like both tea and coffee.",
"I like tea or coffee.",
"I like tea only.",
"I like coffee only."
],
answer:"I like both tea and coffee."
},
{
q:"He is very rich.",
inst:"Change using opposite word rule",
options:[
"He is not poor.",
"He is poor.",
"He no rich.",
"He poor is."
],
answer:"He is not poor."
},
{
q:"She will come as soon as possible.",
inst:"Use NO SOONER...THAN rule",
options:[
"No sooner will she come than possible.",
"She will come soon.",
"She came later.",
"She come fast."
],
answer:"No sooner will she come than possible."
},
{
q:"He is only a child.",
inst:"Use NONE BUT rule",
options:[
"He is none but a child.",
"He is child only.",
"He no child.",
"Child he is not."
],
answer:"He is none but a child."
},
{
q:"They are happy.",
inst:"Change to Negative",
options:[
"They are not sad.",
"They no happy.",
"They sad are.",
"They unhappy no."
],
answer:"They are not sad."
},
{
q:"It is a beautiful day.",
inst:"Change to Negative",
options:[
"It is not an ugly day.",
"It no beautiful day.",
"It ugly day.",
"Day not beautiful."
],
answer:"It is not an ugly day."
},
{
q:"She likes apples.",
inst:"Change to Negative",
options:[
"She does not like apples.",
"She no likes apples.",
"She not apple like.",
"Apples she no like."
],
answer:"She does not like apples."
},
{
q:"He is brave.",
inst:"Change to Negative",
options:[
"He is not coward.",
"He no brave.",
"He coward is.",
"He is cowardly not."
],
answer:"He is not coward."
},
{
q:"Both Ram and Shyam are present.",
inst:"Use NOT ONLY...BUT ALSO",
options:[
"Not only Ram but also Shyam are present.",
"Ram and Shyam absent.",
"Only Ram present.",
"Shyam not present."
],
answer:"Not only Ram but also Shyam are present."
},
{
q:"She is fast.",
inst:"Change to Negative",
options:[
"She is not slow.",
"She slow is.",
"She no fast.",
"Fast she not."
],
answer:"She is not slow."
},
{
q:"He is alone.",
inst:"Use NONE BUT rule",
options:[
"He is none but alone.",
"He is not alone.",
"He alone no.",
"None he alone."
],
answer:"He is none but alone."
},
{
q:"The boy is tall.",
inst:"Change to Negative",
options:[
"The boy is not short.",
"Boy no tall.",
"Tall boy not.",
"He short boy."
],
answer:"The boy is not short."
},
{
q:"She is kind.",
inst:"Change to Negative",
options:[
"She is not cruel.",
"She cruel is.",
"She no kind.",
"Kind she not."
],
answer:"She is not cruel."
}
];

/* ================= SHUFFLE ================= */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

/* ================= BUILD ================= */
const data = rawData.map(q=>{
  let opts = shuffle([...q.options]);
  return {
    q:q.q,
    inst:q.inst,
    options:opts,
    answer:q.answer
  };
});

/* ================= JOURNEY ================= */
const journey=document.getElementById("journey");

data.forEach((_,i)=>{
  let d=document.createElement("div");
  d.className="node";
  d.innerText=i+1;
  journey.appendChild(d);
});

let i=0;
let score=0;

const q=document.getElementById("q");
const inst=document.getElementById("inst");
const opt=document.getElementById("options");
const sc=document.getElementById("score");
const lvl=document.getElementById("level");
const nodes=document.querySelectorAll(".node");

/* ================= LOAD ================= */
function load(){

  let d=data[i];

  q.innerText=d.q;
  inst.innerText=d.inst;

  opt.innerHTML="";

  nodes.forEach(n=>n.classList.remove("active"));
  nodes[i].classList.add("active");

  d.options.forEach(o=>{
    let div=document.createElement("div");
    div.className="option";
    div.innerText=o;

    div.onclick=()=>{
      if(o === d.answer) score++;
      next();
    };

    opt.appendChild(div);
  });

  sc.innerText=score;
  lvl.innerText=(i+1);
}

/* ================= NEXT ================= */
function next(){
  i++;
  if(i>=data.length){
    alert("Transformation Lab Completed 🎉");
    location.reload();
    return;
  }
  load();
}

/* ================= START ================= */
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
  document.getElementById("game").style.display="block";
  load();
},3000);

</script>

</body>
</html>
