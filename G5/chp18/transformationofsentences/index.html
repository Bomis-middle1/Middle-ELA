<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Transformation Quest</title>

<style>
/* ===== SAME ENGINE UI (UNCHANGED STRUCTURE) ===== */
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: Arial;
  background: radial-gradient(circle at top, #243b55, #141e30, #000);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:10px;
  color:#fff;
}

/* Splash */
.splash-screen {
  position:fixed;
  inset:0;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  transition:0.5s;
}
.splash-screen img {
  width:420px;
  animation: float 2s infinite ease-in-out;
}
@keyframes float {
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-15px)}
}
.splash-screen.hidden{opacity:0;pointer-events:none;}

/* Container */
.container{
  max-width:1100px;
  width:100%;
  background:#020617;
  border:3px solid gold;
  border-radius:20px;
  overflow:hidden;
  opacity:0;
  transition:0.5s;
}
.container.visible{opacity:1;}

/* Header */
.header{
  text-align:center;
  padding:12px;
  background:linear-gradient(135deg,#ffd700,#ff9f1c);
  color:#111;
}
.header h1{font-size:26px;}
.subtitle{font-weight:bold;font-size:14px;}
.stage{
  margin-top:6px;
  display:inline-block;
  padding:6px 14px;
  background:#111;
  color:gold;
  border-radius:20px;
}

/* Game */
.game-shell{padding:16px;}

.screen{display:none;}
.screen.active{display:block;}

/* Score */
.score-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.card{
  background:#0f172a;
  padding:10px;
  border-radius:12px;
  text-align:center;
}
.label{font-size:12px;color:#aaa;}
.value{font-size:20px;font-weight:bold;}

/* Question */
.question-box{
  margin-top:15px;
  padding:18px;
  border:2px solid #555;
  border-radius:15px;
  background:#0b1220;
}
.question-title{
  color:gold;
  font-size:18px;
  margin-bottom:10px;
}
.question-text{
  font-size:20px;
  margin-bottom:12px;
}

/* Options */
.options button{
  width:100%;
  margin:6px 0;
  padding:12px;
  border-radius:10px;
  border:1px solid #666;
  background:#111827;
  color:#fff;
  cursor:pointer;
}
.options button:hover{
  border-color:gold;
}

/* Journey */
.journey{
  padding:20px;
  text-align:center;
}
.btn{
  margin-top:12px;
  padding:10px 18px;
  border-radius:20px;
  background:gold;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div class="splash-screen" id="splash">
  <img src="assets/logo.png">
</div>

<!-- MAIN -->
<div class="container" id="container">

  <div class="header">
    <h1>📘 Grammar Transformation Quest</h1>
    <div class="subtitle">Grade 5–6 English Grammar</div>
    <div class="stage" id="stage">Level 1 / 10</div>
  </div>

  <div class="game-shell">

    <!-- SCORE -->
    <div class="score-row">
      <div class="card">
        <div class="label">Correct</div>
        <div class="value" id="correct">0</div>
      </div>
      <div class="card">
        <div class="label">Level</div>
        <div class="value" id="level">1/10</div>
      </div>
      <div class="card">
        <div class="label">Score</div>
        <div class="value" id="score">0%</div>
      </div>
    </div>

    <!-- QUESTION -->
    <div class="question-box">
      <div class="question-title" id="task">Task</div>
      <div class="question-text" id="q">Question</div>
      <div class="options" id="options"></div>
    </div>

    <!-- JOURNEY -->
    <div class="journey">
      <div id="feedback"></div>
      <button class="btn" id="next">Next Level</button>
    </div>

  </div>
</div>

<script>

/* ===== GRAMMAR TRANSFORMATION ENGINE ===== */

const TOTAL = 10;

const questions = [
{
task:"Direct → Indirect Speech",
q:'He said, "I am reading a book."',
options:[
"He said that he is reading a book.",
"He said that he was reading a book.",
"He said he read book.",
"He said reading book."
],
ans:1
},
{
task:"Indirect → Direct Speech",
q:"She said that she would come tomorrow.",
options:[
"She said, 'I will come tomorrow.'",
"She said, 'I come tomorrow.'",
"She said I will come.",
"She says I will come."
],
ans:0
},
{
task:"Active → Passive Voice",
q:"The teacher teaches English.",
options:[
"English is taught by the teacher.",
"English taught teacher.",
"Teacher teaching English.",
"English was teach teacher."
],
ans:0
},
{
task:"Tense Change",
q:"He is eating food.",
options:[
"He was eating food.",
"He eats food yesterday.",
"He ate food now.",
"He is eat food."
],
ans:0
},
{
task:"Direct → Indirect",
q:'They said, "We are going to school."',
options:[
"They said that they are going to school.",
"They said that they were going to school.",
"They said we go school.",
"They said going school."
],
ans:1
},
{
task:"Passive → Active",
q:"The cake was eaten by the boy.",
options:[
"The boy eats cake.",
"The boy ate the cake.",
"The boy eat cake.",
"Cake boy eaten."
],
ans:1
},
{
task:"Direct → Indirect",
q:'He said, "I will help you."',
options:[
"He said that he would help me.",
"He said I will help you.",
"He says he help.",
"He will help me said."
],
ans:0
},
{
task:"Tense Change",
q:"She plays football every day.",
options:[
"She played football every day.",
"She is playing football yesterday.",
"She play football.",
"She is play football."
],
ans:0
},
{
task:"Indirect → Direct",
q:"They said that they had finished work.",
options:[
"They said, 'We finished work.'",
"They said, 'We have finished work.'",
"They said work finished.",
"They said finishing work."
],
ans:1
},
{
task:"Mixed Transformation",
q:"The letters are being written by her.",
options:[
"She writes letters.",
"She is writing letters.",
"She wrote letters.",
"Letters writing she."
],
ans:1
}
];

let i=0, correct=0;

const q=document.getElementById("q");
const task=document.getElementById("task");
const options=document.getElementById("options");
const correctBox=document.getElementById("correct");
const levelBox=document.getElementById("level");
const scoreBox=document.getElementById("score");
const feedback=document.getElementById("feedback");
const next=document.getElementById("next");

function load(){
  let data=questions[i];
  task.innerText=data.task;
  q.innerText=data.q;
  options.innerHTML="";
  feedback.innerText="";
  
  data.options.forEach((o,index)=>{
    let btn=document.createElement("button");
    btn.innerText=o;
    btn.onclick=()=>{
      if(index===data.ans){
        correct++;
        feedback.innerText="✅ Correct!";
      }else{
        feedback.innerText="❌ Wrong!";
      }
    }
    options.appendChild(btn);
  });

  correctBox.innerText=correct;
  levelBox.innerText=(i+1)+"/"+TOTAL;
  scoreBox.innerText=Math.round((correct/TOTAL)*100)+"%";
}

next.onclick=()=>{
  i++;
  if(i>=TOTAL){
    alert("Game Complete!");
    location.reload();
    return;
  }
  load();
}

/* SPLASH FIX */
setTimeout(()=>{
  document.getElementById("splash").classList.add("hidden");
  document.getElementById("container").classList.add("visible");
  load();
},3000);

</script>

</body>
</html>
