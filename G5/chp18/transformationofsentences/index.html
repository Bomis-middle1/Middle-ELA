<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Transformation Quest</title>

<style>
/* ================= GLOBAL ================= */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:Arial;
  background: radial-gradient(circle at top,#0f172a,#020617);
  color:white;
  overflow:hidden;
}

/* ================= SPLASH ================= */
.splash{
  position:fixed;
  inset:0;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
.splash img{
  width:420px;
  animation:float 2s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-20px)}
}

/* ================= DASHBOARD ================= */
.container{
  opacity:0;
  transition:0.5s;
  padding:15px;
}
.container.show{opacity:1;}

/* HEADER (FIXED BIG TEXT) */
.header{
  text-align:center;
  padding:12px;
}
.header h1{
  font-size:30px;
  font-weight:800;
  color:#facc15;
}
.header p{
  font-size:18px;
  color:#cbd5e1;
}

/* ================= JOURNEY PATH (NEW FIX) ================= */
.journey{
  margin:10px auto;
  width:95%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:relative;
  padding:10px;
}

.node{
  width:26px;
  height:26px;
  border-radius:50%;
  background:#334155;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:12px;
}

.node.active{
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
  transform:scale(1.2);
}

/* line */
.line{
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  height:4px;
  background:#334155;
  z-index:-1;
}

/* ================= DASHBOARD GRID ================= */
.grid{
  display:flex;
  gap:10px;
}

/* LEFT */
.left{
  width:60%;
  background:#0b1220;
  padding:15px;
  border-radius:15px;
}

.question{
  font-size:22px; /* FIXED BIG TEXT */
  margin-bottom:10px;
  font-weight:bold;
  color:#93c5fd;
}

.instruction{
  font-size:18px;
  margin-bottom:15px;
  color:#fbbf24;
}

.option{
  background:#1e293b;
  margin:8px 0;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  font-size:18px;
}

.option:hover{
  background:#334155;
}

/* RIGHT */
.right{
  width:40%;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* KPI */
.kpi{
  background:#111827;
  padding:12px;
  border-radius:12px;
  text-align:center;
}

/* FEEDBACK */
.feedback{
  background:#1f2937;
  padding:12px;
  border-radius:12px;
  min-height:80px;
  font-size:16px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div class="splash" id="splash">
  <img src="assets/logo.png">
</div>

<!-- MAIN -->
<div class="container" id="container">

  <!-- HEADER -->
  <div class="header">
    <h1>Grammar Transformation Quest</h1>
    <p>Grade 5 English • Direct & Indirect Speech</p>
  </div>

  <!-- JOURNEY (FIXED FULL ENGINE) -->
  <div class="journey" id="journey">
    <div class="line"></div>
  </div>

  <!-- GRID -->
  <div class="grid">

    <!-- LEFT -->
    <div class="left">
      <div class="question" id="q"></div>
      <div class="instruction" id="inst"></div>
      <div id="options"></div>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="kpi" id="score">Score: 0</div>
      <div class="kpi" id="level">Level: 1</div>
      <div class="feedback" id="fb">Choose correct transformation</div>
    </div>

  </div>
</div>

<script>

/* ================= DATA ================= */
const data = [
{
q:'He said that he was reading a book.',
type:'Indirect → Direct',
inst:'Convert to Direct Speech',
options:[
'He said, "I am reading a book."',
'He said I reading book.',
'He say reading book.',
'He said book reading.'
],
ans:0
},
{
q:'She said, "I will come tomorrow."',
type:'Direct → Indirect',
inst:'Convert to Indirect Speech',
options:[
'She said that she would come the next day.',
'She said she will come tomorrow.',
'She say coming tomorrow.',
'She said come tomorrow.'
],
ans:0
},
{
q:'They said that they were going to school.',
type:'Indirect → Direct',
inst:'Convert to Direct Speech',
options:[
'They said, "We are going to school."',
'They said going school.',
'They say school.',
'They going school.'
],
ans:0
},
{
q:'He said, "I have finished my work."',
type:'Direct → Indirect',
inst:'Convert to Indirect Speech',
options:[
'He said that he had finished his work.',
'He said finished work.',
'He say work done.',
'He said work finish.'
],
ans:0
},
{
q:'She said that she could swim.',
type:'Indirect → Direct',
inst:'Convert to Direct Speech',
options:[
'She said, "I can swim."',
'She said swim can.',
'She say I swim.',
'She swimming said.'
],
ans:0
}
];

/* ================= JOURNEY BUILD ================= */
const journey=document.getElementById("journey");
for(let i=0;i<data.length;i++){
  let n=document.createElement("div");
  n.className="node";
  n.innerText=i+1;
  journey.appendChild(n);
}

/* ================= STATE ================= */
let i=0;
let score=0;

/* ================= ELEMENTS ================= */
const q=document.getElementById("q");
const inst=document.getElementById("inst");
const opt=document.getElementById("options");
const fb=document.getElementById("fb");
const sc=document.getElementById("score");
const lvl=document.getElementById("level");
const nodes=document.querySelectorAll(".node");

/* ================= LOAD ================= */
function load(){
  let d=data[i];
  q.innerText=d.q;
  inst.innerText=d.inst;
  opt.innerHTML="";

  nodes[i].classList.add("active");

  d.options.forEach((o,idx)=>{
    let div=document.createElement("div");
    div.className="option";
    div.innerText=o;
    div.onclick=()=>{
      if(idx===d.ans){
        score++;
        fb.innerText="Correct ✔";
      }else{
        fb.innerText="Wrong ✖";
      }
      next();
    };
    opt.appendChild(div);
  });

  sc.innerText="Score: "+score;
  lvl.innerText="Level: "+(i+1);
}

/* ================= NEXT ================= */
function next(){
  i++;
  if(i>=data.length){
    fb.innerText="Journey Completed 🎉";
    return;
  }
  load();
}

/* ================= START ================= */
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
  document.getElementById("container").classList.add("show");
  load();
},3000);

</script>

</body>
</html>
