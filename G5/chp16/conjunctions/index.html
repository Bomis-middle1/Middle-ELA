<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 5 Conjunction Builder</title>
<style>
  * {box-sizing:border-box; margin:0; padding:0; font-family: Arial, sans-serif;}
  body, html {height:100%; width:100%; background:#f0f8ff; display:flex; justify-content:center; align-items:center; flex-direction:column;}

  #splash {position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; justify-content:center; align-items:center; z-index:100;}
  #splash img {width:300px; max-width:40%;}

  #game {display:none; text-align:center; width:90%; max-width:900px;}
  #score {font-size:1.5rem; margin-bottom:20px;}
  #question {font-size:2rem; margin-bottom:30px;}
  #options {display:flex; justify-content:center; flex-wrap: wrap; gap:20px;}
  .option {background:orange; border:none; padding:20px 30px; font-size:1.5rem; border-radius:15px; cursor:pointer;}
  .option:hover {transform: scale(1.05);}

  #character-container {display:flex; flex-direction:column; align-items:center; margin-top:30px;}
  #character {width:100px; height:100px;}
  #callout {margin-top:10px; padding:5px 10px; background:#fff; border-radius:10px; font-size:1.5rem; min-width:140px; text-align:center; visibility:hidden;}
</style>
</head>
<body>

<div id="splash">
  <img src="assets/logo.png" alt="Innovine Logo">
</div>

<div id="game">
  <div id="score">Score: 0</div>
  <div id="question">Question</div>
  <div id="options"></div>
  <div id="character-container">
    <img id="character" src="assets/teacher.png" alt="Teacher Mascot">
    <div id="callout"></div>
  </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="applause" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const splash = document.getElementById('splash');
const game = document.getElementById('game');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const callout = document.getElementById('callout');
const scoreEl = document.getElementById('score');

const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const applause = document.getElementById('applause');

let score = 0;
let currentQ = 0;

const questions = [
  {q:"I wanted to play football ___ it was raining.", options:["and","because","but","or"], answer:"but"},
  {q:"She studied hard ___ she passed the test.", options:["so","and","but","or"], answer:"so"},
  {q:"We can go to the park ___ we can stay home.", options:["and","or","because","so"], answer:"or"},
  {q:"He was late ___ he missed the bus.", options:["because","and","or","but"], answer:"because"},
  {q:"I like tea ___ coffee.", options:["and","or","but","because"], answer:"and"},
  {q:"It was sunny ___ we went to the beach.", options:["so","and","but","or"], answer:"so"},
  {q:"I wanted to buy the book ___ I had no money.", options:["but","and","or","so"], answer:"but"},
  {q:"You can have an apple ___ a banana.", options:["and","or","but","so"], answer:"or"},
  {q:"She left early ___ she was tired.", options:["because","so","and","or"], answer:"because"},
  {q:"I will call you ___ I arrive.", options:["when","and","or","but"], answer:"when"},
  {q:"He studied hard ___ he wanted to get good grades.", options:["because","so","but","and"], answer:"because"},
  {q:"We can watch a movie ___ play a game.", options:["or","and","but","so"], answer:"or"}
];

function showQuestion(){
  if(currentQ >= questions.length) return;
  const q = questions[currentQ];
  questionEl.textContent = q.q;
  optionsEl.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.className = 'option';
    btn.onclick = () => checkAnswer(opt);
    optionsEl.appendChild(btn);
  });
}

function checkAnswer(selected){
  const q = questions[currentQ];
  if(selected === q.answer){
    correctSound.play();
    score++;
    scoreEl.textContent = "Score: " + score;
    callout.textContent = "Right Answer!";
    callout.style.background = "#a0ffa0";
  } else {
    wrongSound.play();
    callout.textContent = "Try Again!";
    callout.style.background = "#ffa0a0";
  }
  callout.style.visibility = "visible";
  setTimeout(()=>{
    callout.style.visibility="hidden";
    currentQ++;
    showQuestion();
  },1000);
}

setTimeout(()=>{
  splash.style.display='none';
  game.style.display='block';
  score = 0;
  currentQ = 0;
  showQuestion();
},5000);
</script>
</body>
</html>
