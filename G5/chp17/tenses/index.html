<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tense Time Machine</title>
<style>
  body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(to right, #a8e063, #56ab2f); /* lively green gradient */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  /* Splash */
  #splash {
    position: fixed; top:0; left:0; width:100%; height:100%;
    background:#fff; display:flex; justify-content:center; align-items:center; z-index:100;
  }
  #splash img { width:300px; max-width:40%; }

  /* Game container */
  #game {
    display:none;
    width:700px; max-width:90%;
    text-align:center;
    background: rgba(255,255,255,0.95);
    border-radius:20px;
    padding:30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  }

  #score, #timer { 
    font-size: 1.6rem; 
    margin: 10px 0;
    font-weight:bold;
    color: #2b5d34;
  }

  #sentence {
    font-size: 2rem;
    margin: 25px 0;
    color: #1b3a20;
  }

  #options {
    display:flex; flex-wrap: wrap; justify-content:center; gap:15px;
  }

  .option {
    background: #f39c12;
    color:#fff;
    border:none;
    padding:20px 35px;
    font-size:1.5rem;
    border-radius:15px;
    cursor:pointer;
    transition: 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .option:hover { transform: scale(1.05); }

</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <img src="assets/logo.png" alt="Innovine Logo">
</div>

<!-- Game -->
<div id="game">
  <div id="score">Score: 0</div>
  <div id="timer">Time Left: 30s</div>
  <div id="sentence">Sentence will appear here</div>
  <div id="options"></div>
</div>

<!-- Audio -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="applause" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const splash = document.getElementById('splash');
const game = document.getElementById('game');
const sentenceEl = document.getElementById('sentence');
const optionsEl = document.getElementById('options');
const scoreEl = document.getElementById('score');
const timerEl = document.getElementById('timer');

const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const applause = document.getElementById('applause');

let current = 0;
let score = 0;
let timer = 30;
let timerInterval;

const sentences = [
  {text: "She (walk) to school yesterday.", options:["walked","walk","will walk"], answer:"walked"},
  {text: "I (eat) breakfast every morning.", options:["eat","ate","will eat"], answer:"eat"},
  {text: "They (play) soccer tomorrow.", options:["play","played","will play"], answer:"will play"},
  {text: "He (go) to the market last week.", options:["go","went","will go"], answer:"went"},
  {text: "We (study) English now.", options:["study","studied","will study"], answer:"study"},
  {text: "I (call) you later.", options:["call","called","will call"], answer:"will call"},
  {text: "She (write) a letter yesterday.", options:["write","wrote","will write"], answer:"wrote"},
  {text: "He (read) a book every day.", options:["reads","read","will read"], answer:"read"},
  {text: "They (travel) next week.", options:["travel","traveled","will travel"], answer:"will travel"},
  {text: "I (see) a movie last night.", options:["see","saw","will see"], answer:"saw"}
];

function startTimer() {
  timer = 30;
  timerEl.textContent = `Time Left: ${timer}s`;
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timer--;
    timerEl.textContent = `Time Left: ${timer}s`;
    if(timer <= 0){
      nextSentence();
    }
  }, 1000);
}

function showSentence() {
  if(current >= sentences.length) {
    clearInterval(timerInterval);
    sentenceEl.textContent = "Game Completed!";
    optionsEl.innerHTML = "";
    applause.play();
    return;
  }
  const s = sentences[current];
  sentenceEl.textContent = s.text;
  optionsEl.innerHTML = "";
  s.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt;
    btn.className = 'option';
    btn.onclick = () => checkAnswer(opt);
    optionsEl.appendChild(btn);
  });
  startTimer();
}

function checkAnswer(selected) {
  const s = sentences[current];
  if(selected === s.answer){
    correctSound.play();
    score++;
    scoreEl.textContent = `Score: ${score}`;
  } else {
    wrongSound.play();
  }
  nextSentence();
}

function nextSentence() {
  clearInterval(timerInterval);
  current++;
  showSentence();
}

function startGame(){
  splash.style.display='none';
  game.style.display='block';
  current=0;
  score=0;
  scoreEl.textContent = `Score: ${score}`;
  showSentence();
}

// Splash for 5 seconds
setTimeout(()=>{
  startGame();
}, 5000);
</script>

</body>
</html>
