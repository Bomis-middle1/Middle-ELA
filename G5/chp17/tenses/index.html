<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivation Maze Runner - Grade 8 Soul Science</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-screen img {
            max-width: 500px;
            width: 90%;
            height: auto;
            animation: logoFloat 2s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        .container.visible {
            opacity: 1;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin-top: 10px;
        }

        .score-item {
            text-align: center;
        }

        .score-item span {
            display: block;
            font-size: 24px;
            font-weight: bold;
            margin-top: 5px;
        }

        .game-container {
            padding: 20px;
            position: relative;
        }

        #gameCanvas {
            width: 100%;
            max-width: 600px;
            height: 400px;
            border: 3px solid #667eea;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
            background: #f0f4ff;
            touch-action: none;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
        }

        .control-grid .control-btn:nth-child(1) {
            grid-column: 2;
        }

        .control-grid .control-btn:nth-child(2) {
            grid-column: 1;
            grid-row: 2;
        }

        .control-grid .control-btn:nth-child(3) {
            grid-column: 3;
            grid-row: 2;
        }

        .control-grid .control-btn:nth-child(4) {
            grid-column: 2;
            grid-row: 2;
        }

        .question-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .question-box {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .question-box h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .question-text {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.6;
            color: #333;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            padding: 15px 20px;
            border: 2px solid #667eea;
            border-radius: 10px;
            background: white;
            color: #333;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .option-btn:hover {
            background: #f0f4ff;
            transform: translateX(5px);
        }

        .option-btn.correct {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
            animation: correctPulse 0.5s;
        }

        .option-btn.wrong {
            background: #f44336;
            color: white;
            border-color: #f44336;
            animation: shake 0.5s;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
        }

        .feedback.correct {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .feedback.wrong {
            background: #ffcdd2;
            color: #c62828;
        }

        .restart-btn {
            display: none;
            margin: 30px auto;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
        }

    </style>
</head>

<body>

<div class="splash-screen" id="splashScreen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div class="container" id="mainContainer">

    <div class="header">
        <h1>🌟 Motivation Maze Runner 🌟</h1>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

</div>

<div class="question-modal" id="questionModal">
    <div class="question-box">
        <h2 id="questionNumber"></h2>
        <div class="question-text" id="questionText"></div>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
    </div>
</div>

<script>

/* =========================

    {
        question: "She said that she ____ for the exam the previous night.",
        options: ["is preparing", "was preparing", "has prepared", "prepares"],
        correct: 1
    },
    {
        question: "Convert to INDIRECT SPEECH: He said, “I will finish the project tomorrow.”",

    {

    },
    {
        question: "Identify the tense: “She has been reading for two hours.”",

    },
    {
        question: "Which sentence is PAST CONTINUOUS tense?",
        options: [

        ],
        correct: 3
    }

</script>

</body>
</html>
