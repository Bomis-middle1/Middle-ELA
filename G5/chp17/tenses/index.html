<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tense Time Maze Adventure</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1020;
  color:white;
  overflow:hidden;
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#splash img{width:350px}

/* GAME AREA */
#game{
  display:none;
  padding:10px;
}

/* HEADER */
h1{
  text-align:center;
  color:#facc15;
  margin:10px;
}

/* STATS */
#stats{
  display:flex;
  justify-content:space-around;
  margin-bottom:10px;
}

/* MAZE */
#maze{
  position:relative;
  width:100%;
  height:450px;
  background:#111827;
  border:2px solid #334155;
  overflow:hidden;
}

/* PLAYER */
#player{
  width:20px;
  height:20px;
  border-radius:50%;
  background:gold;
  position:absolute;
  top:50%;
  left:50%;
}

/* STAR */
.star{
  width:12px;
  height:12px;
  background:#22c55e;
  border-radius:50%;
  position:absolute;
}

/* QUESTION BOX */
#qbox{
  position:fixed;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  background:#1f2937;
  padding:15px;
  border-radius:10px;
  display:none;
  width:80%;
}

.option{
  background:#374151;
  padding:10px;
  margin:5px 0;
  cursor:pointer;
  border-radius:5px;
}
.option:hover{background:#4b5563}
</style>
</head>

<body>

<div id="splash">
  <img src="assets/logo.png">
</div>

<div id="game">

<h1>⏳ Tense Time Maze Adventure</h1>

<div id="stats">
  <div>Score: <span id="score">0</span></div>
  <div>Stars: <span id="stars">0</span>/3</div>
  <div>Zone: <span id="zone">Present</span></div>
</div>

<div id="maze">
  <div id="player"></div>
</div>

<div id="qbox">
  <div id="q"></div>
  <div id="opts"></div>
</div>

</div>

<script>

/* ================= GAME STATE ================= */
let score=0;
let stars=0;
let zoneIndex=0;

const zones=["Present","Past","Future"];

/* ================= QUESTIONS ================= */
const questions=[
{
q:"She ___ to school every day.",
opts:["go","goes","going","gone"],
ans:1
},
{
q:"He ___ football yesterday.",
opts:["play","played","plays","playing"],
ans:1
},
{
q:"They ___ visit tomorrow.",
opts:["will","go","went","going"],
ans:0
},
{
q:"She is ___ now.",
opts:["eat","eating","ate","eats"],
ans:1
},
{
q:"He ___ when I called him.",
opts:["sleep","was sleeping","slept","sleeps"],
ans:1
}
];

let qIndex=0;

/* ================= ELEMENTS ================= */
const player=document.getElementById("player");
const maze=document.getElementById("maze");
const qbox=document.getElementById("qbox");
const q=document.getElementById("q");
const opts=document.getElementById("opts");

/* ================= MOVE PLAYER ================= */
document.addEventListener("keydown",(e)=>{
  let x=player.offsetLeft;
  let y=player.offsetTop;

  if(e.key==="ArrowRight") player.style.left=(x+10)+"px";
  if(e.key==="ArrowLeft") player.style.left=(x-10)+"px";
  if(e.key==="ArrowUp") player.style.top=(y-10)+"px";
  if(e.key==="ArrowDown") player.style.top=(y+10)+"px";

  checkStar();
});

/* ================= STARS ================= */
function spawnStar(){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*90+"%";
  s.style.top=Math.random()*90+"%";
  maze.appendChild(s);
}

for(let i=0;i<5;i++) spawnStar();

/* ================= CHECK STAR ================= */
function checkStar(){
  let starsEl=document.querySelectorAll(".star");

  starsEl.forEach(s=>{
    let rect1=player.getBoundingClientRect();
    let rect2=s.getBoundingClientRect();

    if(!(rect1.right<rect2.left ||
         rect1.left>rect2.right ||
         rect1.bottom<rect2.top ||
         rect1.top>rect2.bottom)){
      s.remove();
      stars++;
      document.getElementById("stars").innerText=stars;

      if(stars>=3){
        showQuestion();
      }
    }
  });
}

/* ================= QUESTION ================= */
function showQuestion(){
  qbox.style.display="block";

  let qdata=questions[qIndex];

  q.innerText=qdata.q;
  opts.innerHTML="";

  qdata.opts.forEach((o,i)=>{
    let div=document.createElement("div");
    div.className="option";
    div.innerText=o;

    div.onclick=()=>{
      if(i===qdata.ans){
        score++;
      }

      nextLevel();
    };

    opts.appendChild(div);
  });
}

/* ================= NEXT LEVEL ================= */
function nextLevel(){
  qbox.style.display="none";
  stars=0;
  document.getElementById("stars").innerText=0;

  qIndex++;
  if(qIndex>=questions.length){
    alert("Game Complete!");
    location.reload();
    return;
  }

  zoneIndex=(zoneIndex+1)%zones.length;
  document.getElementById("zone").innerText=zones[zoneIndex];

  for(let i=0;i<3;i++) spawnStar();
}

/* ================= START ================= */
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
  document.getElementById("game").style.display="block";
},3000);

</script>

</body>
</html>
