<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tense Time Maze Adventure</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#070b1a;
  color:white;
  overflow:hidden;
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  background:white;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}
#splash img{width:320px}

/* HEADER */
#topBar{
  text-align:center;
  padding:10px;
}

h1{
  color:#facc15;
  margin:5px;
}

/* JOURNEY */
#journey{
  display:flex;
  justify-content:center;
  gap:8px;
  margin:10px;
  flex-wrap:wrap;
}

.node{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#334155;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:10px;
}

.active{
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
}

/* GAME AREA */
#gameArea{
  display:flex;
  justify-content:center;
  align-items:center;
  height:65vh;
}

/* MAZE */
#maze{
  width:90%;
  height:420px;
  border:2px solid #334155;
  position:relative;
  overflow:hidden;
}

#player{
  width:18px;
  height:18px;
  border-radius:50%;
  background:gold;
  position:absolute;
  top:50%;
  left:50%;
}

/* STAR */
.star{
  width:12px;
  height:12px;
  background:#38bdf8;
  border-radius:50%;
  position:absolute;
}

/* QUESTION BOX */
#qbox{
  position:fixed;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  background:#111827;
  padding:15px;
  border-radius:10px;
  width:80%;
  display:none;
}

.option{
  background:#1f2937;
  padding:10px;
  margin:6px 0;
  border-radius:6px;
  cursor:pointer;
}
.option:hover{background:#374151}
</style>
</head>

<body>

<div id="splash">
  <img src="assets/logo.png">
</div>

<div id="topBar">
  <h1>⏳ Tense Time Maze Adventure</h1>
  <div>Score: <span id="score">0</span> | Zone: <span id="zone">Present</span></div>
</div>

<div id="journey"></div>

<div id="gameArea">
  <div id="maze">
    <div id="player"></div>
  </div>
</div>

<div id="qbox">
  <div id="q"></div>
  <div id="opts"></div>
</div>

<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>

<script>

/* ================= JOURNEY ================= */
const journey=document.getElementById("journey");
for(let i=1;i<=15;i++){
  let d=document.createElement("div");
  d.className="node";
  d.innerText=i;
  journey.appendChild(d);
}

let currentNode=0;

/* ================= STATE ================= */
let score=0;
let starCount=0;
let qIndex=0;

const zones=["Present","Past","Future"];

/* ================= HOTS TENSE QUESTIONS ================= */
const questions=[
{
q:"If she ___ harder, she would have passed the exam.",
opts:["studies","had studied","studied","has studied"],
ans:1
},
{
q:"By next year, they ___ the project.",
opts:["complete","will complete","will have completed","completed"],
ans:2
},
{
q:"He said that he ___ waiting for hours.",
opts:["is","was","has been","will be"],
ans:1
},
{
q:"If I were you, I ___ that decision.",
opts:["won't make","wouldn't make","didn't make","don't make"],
ans:1
},
{
q:"The train ___ before we reached the station.",
opts:["left","had left","leaves","will leave"],
ans:1
},
{
q:"She ___ her homework every day.",
opts:["do","does","done","did"],
ans:1
},
{
q:"They ___ dinner when I called them.",
opts:["are having","were having","have","had"],
ans:1
},
{
q:"If it rains, we ___ the match.",
opts:["cancel","will cancel","cancelled","cancels"],
ans:1
},
{
q:"He said he ___ come early.",
opts:["will","would","shall","can"],
ans:1
},
{
q:"By 2050, humans ___ Mars.",
opts:["colonise","will colonise","will have colonised","colonised"],
ans:2
},
{
q:"She ___ since morning.",
opts:["works","has been working","worked","is working"],
ans:1
},
{
q:"If they had left earlier, they ___ the bus.",
opts:["catch","would catch","would have caught","caught"],
ans:2
},
{
q:"He ___ when I entered the room.",
opts:["sleeps","was sleeping","slept","has slept"],
ans:1
},
{
q:"They ___ football every evening.",
opts:["play","plays","playing","played"],
ans:0
},
{
q:"The movie ___ by the time we arrived.",
opts:["starts","had started","start","will start"],
ans:1
}
];

/* ================= ELEMENTS ================= */
const player=document.getElementById("player");
const maze=document.getElementById("maze");
const qbox=document.getElementById("qbox");
const q=document.getElementById("q");
const opts=document.getElementById("opts");

/* ================= MOVE ================= */
document.addEventListener("keydown",(e)=>{
  let x=player.offsetLeft;
  let y=player.offsetTop;

  if(e.key==="ArrowRight") player.style.left=(x+12)+"px";
  if(e.key==="ArrowLeft") player.style.left=(x-12)+"px";
  if(e.key==="ArrowUp") player.style.top=(y-12)+"px";
  if(e.key==="ArrowDown") player.style.top=(y+12)+"px";

  checkStar();
});

/* ================= STARS ================= */
function spawnStar(){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*90+"%";
  s.style.top=Math.random()*90+"%";
  maze.appendChild(s);
}
for(let i=0;i<5;i++) spawnStar();

/* ================= COLLISION ================= */
function checkStar(){
  document.querySelectorAll(".star").forEach(s=>{
    let r1=player.getBoundingClientRect();
    let r2=s.getBoundingClientRect();

    if(!(r1.right<r2.left||r1.left>r2.right||r1.bottom<r2.top||r1.top>r2.bottom)){
      s.remove();
      starCount++;

      if(starCount>=3){
        showQ();
      }
    }
  });
}

/* ================= QUESTION ================= */
function showQ(){
  qbox.style.display="block";

  let data=questions[qIndex];

  q.innerText=data.q;
  opts.innerHTML="";

  let shuffled=[...data.opts.map((o,i)=>({o,i}))].sort(()=>Math.random()-0.5);

  shuffled.forEach(item=>{
    let div=document.createElement("div");
    div.className="option";
    div.innerText=item.o;

    div.onclick=()=>{
      if(item.i===data.ans){
        score++;
        document.getElementById("correct").play();
        currentNode++;
        document.querySelectorAll(".node")[currentNode-1].classList.add("active");
        document.getElementById("score").innerText=score;
      } else {
        document.getElementById("wrong").play();
      }

      next();
    };

    opts.appendChild(div);
  });
}

/* ================= NEXT ================= */
function next(){
  qbox.style.display="none";
  starCount=0;
  qIndex++;

  if(qIndex>=questions.length){
    alert("🎉 Tense Master Completed!");
    location.reload();
    return;
  }

  spawnStar();
  spawnStar();
  spawnStar();

  document.getElementById("zone").innerText=
    zones[qIndex%3];
}

/* ================= START ================= */
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
},3000);

</script>

</body>
</html>
