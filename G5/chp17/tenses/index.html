<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivation Maze Runner - Grade 8 Soul Science</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-screen img {
            max-width: 500px;
            width: 90%;
            height: auto;
            animation: logoFloat 2s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        .container.visible { opacity: 1; }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 { font-size: 28px; margin-bottom: 10px; }

        .score-board {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            margin-top: 10px;
        }

        .score-item { text-align: center; }
        .score-item span { font-size: 24px; font-weight: bold; }

        .game-container { padding: 20px; position: relative; }

        #gameCanvas {
            width: 100%;
            max-width: 600px;
            height: 400px;
            border: 3px solid #667eea;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
            background: #f0f4ff;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .question-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .question-box {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        .question-text { font-size: 18px; margin-bottom: 20px; }

        .option-btn {
            padding: 15px;
            border: 2px solid #667eea;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
        }

        .option-btn.correct { background: #4CAF50; color: white; }
        .option-btn.wrong { background: #f44336; color: white; }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .feedback.correct { background: #c8e6c9; }
        .feedback.wrong { background: #ffcdd2; }

        .restart-btn {
            display: none;
            margin: 30px auto;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="splash-screen" id="splashScreen">
    <img src="assets/innovine-logo.png">
</div>

<div class="container" id="mainContainer">

    <div class="header">
        <h1>Motivation Maze Runner</h1>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas"></canvas>

        <button class="restart-btn" id="restartBtn">Play Again</button>
    </div>
</div>

<div class="question-modal" id="questionModal">
    <div class="question-box">
        <div id="questionText"></div>
        <div id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
    </div>
</div>

<script>
const questions = [
    {
        question: "She said that she ____ for the exam the previous night.",
        options: ["is preparing", "was preparing", "has prepared", "prepares"],
        correct: 1
    },
    {
        question: "Convert to INDIRECT SPEECH: He said, “I will finish the project tomorrow.”",
        options: [
            "He said that he would finish the project the next day",
            "He said that I will finish the project tomorrow",
            "He says he will finish the project tomorrow",
            "He said he finished the project tomorrow"
        ],
        correct: 0
    },
    {
        question: "Identify the tense: “They had already left before we arrived.”",
        options: ["Simple Past", "Past Perfect", "Present Perfect", "Past Continuous"],
        correct: 1
    },
    {
        question: "Which sentence is in FUTURE CONTINUOUS tense?",
        options: [
            "I will go to school tomorrow",
            "I will be going to school tomorrow",
            "I am going to school tomorrow",
            "I went to school tomorrow"
        ],
        correct: 1
    },
    {
        question: "Convert to past continuous: “She is writing a letter.”",
        options: [
            "She writes a letter",
            "She wrote a letter",
            "She has written a letter",
            "She was writing a letter"
        ],
        correct: 3
    },
    {
        question: "Which sentence is in PRESENT PERFECT tense?",
        options: [
            "She has completed her homework",
            "She completed her homework yesterday",
            "She is completing her homework",
            "She will complete her homework"
        ],
        correct: 0
    },
    {
        question: "Convert to INDIRECT SPEECH: They said, “We are playing football.”",
        options: [
            "They said they played football",
            "They said that we are playing football",
            "They said that they were playing football",
            "They say they are playing football"
        ],
        correct: 2
    },
    {
        question: "Which sentence is SIMPLE FUTURE tense?",
        options: [
            "I went tomorrow",
            "I am going yesterday",
            "I will go to market tomorrow",
            "I will going tomorrow"
        ],
        correct: 2
    },
    {
        question: "Identify the tense: “She has been reading for two hours.”",
        options: [
            "Present Perfect",
            "Present Perfect Continuous",
            "Past Continuous",
            "Future Continuous"
        ],
        correct: 1
    },
    {
        question: "Which sentence is PAST CONTINUOUS tense?",
        options: [
            "They will watch TV when I called",
            "They watch TV when I called",
            "They have watched TV when I called",
            "They were watching TV when I called"
        ],
        correct: 3
    }
];

let currentQuestionIndex = 0;

function showQuestion(){
    const q = questions[currentQuestionIndex];
    document.getElementById("questionText").innerText = q.question;

    const container = document.getElementById("optionsContainer");
    container.innerHTML = "";

    q.options.forEach((opt, i) => {
        const btn = document.createElement("div");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => {
            if(i === q.correct){
                btn.classList.add("correct");
            } else {
                btn.classList.add("wrong");
            }
        };
        container.appendChild(btn);
    });

    document.getElementById("questionModal").style.display = "flex";
}

setTimeout(() => {
    document.getElementById("splashScreen").style.display = "none";
    document.getElementById("mainContainer").classList.add("visible");
    showQuestion();
}, 3000);

</script>

</body>
</html>
