<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Motivation Maze Runner - Grade 8 Soul Science</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-screen img {
            max-width: 500px;
            width: 90%;
            height: auto;
            animation: logoFloat 2s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }

        .container.visible { opacity: 1; }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        #gameCanvas {
            width: 100%;
            height: 400px;
            background: #f0f4ff;
            border: 3px solid #667eea;
            border-radius: 10px;
        }

        .question-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
        }

        .question-box {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 600px;
        }

        .option-btn {
            display: block;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #667eea;
            border-radius: 10px;
            cursor: pointer;
        }

        .option-btn.correct { background: #4CAF50; color: white; }
        .option-btn.wrong { background: #f44336; color: white; }

    </style>
</head>

<body>

<div class="splash-screen" id="splashScreen">
    <img src="assets/innovine-logo.png">
</div>

<div class="container" id="mainContainer">
    <div class="header">
        <h1>Motivation Maze Runner</h1>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<div class="question-modal" id="questionModal">
    <div class="question-box">
        <div id="questionText"></div>
        <div id="optionsContainer"></div>
    </div>
</div>

<script>

/* =======================
   ONLY QUESTIONS CHANGED
======================= */

const questions = [
    {
        question: "She said that she ____ for the exam the previous night.",
        options: ["is preparing", "was preparing", "has prepared", "prepares"],
        correct: 1
    },
    {
        question: "Convert to INDIRECT SPEECH: He said, “I will finish the project tomorrow.”",
        options: [
            "He said that he would finish the project the next day",
            "He said that I will finish the project tomorrow",
            "He says he will finish the project tomorrow",
            "He said he finished the project tomorrow"
        ],
        correct: 0
    },
    {
        question: "Identify the tense: “They had already left before we arrived.”",
        options: ["Simple Past", "Past Perfect", "Present Perfect", "Past Continuous"],
        correct: 1
    },
    {
        question: "Which sentence is FUTURE CONTINUOUS?",
        options: [
            "I will go tomorrow",
            "I will be going tomorrow",
            "I go tomorrow",
            "I went tomorrow"
        ],
        correct: 1
    },
    {
        question: "Convert: She is writing a letter →",
        options: [
            "She writes a letter",
            "She wrote a letter",
            "She has written a letter",
            "She was writing a letter"
        ],
        correct: 3
    },
    {
        question: "Which is PRESENT PERFECT?",
        options: [
            "She has completed homework",
            "She completed homework yesterday",
            "She is completing homework",
            "She will complete homework"
        ],
        correct: 0
    },
    {
        question: "Indirect speech: They said, “We are playing football.”",
        options: [
            "They said they played football",
            "They said we are playing football",
            "They said they were playing football",
            "They say they play football"
        ],
        correct: 2
    },
    {
        question: "Simple Future tense sentence:",
        options: [
            "I went tomorrow",
            "I am going yesterday",
            "I will go tomorrow",
            "I will going tomorrow"
        ],
        correct: 2
    },
    {
        question: "Identify tense: She has been reading for two hours",
        options: [
            "Present Perfect",
            "Present Perfect Continuous",
            "Past Continuous",
            "Future Continuous"
        ],
        correct: 1
    },
    {
        question: "Past Continuous sentence:",
        options: [
            "They will watch TV when I called",
            "They watch TV when I called",
            "They have watched TV when I called",
            "They were watching TV when I called"
        ],
        correct: 3
    }
];

</script>

</body>
</html>
