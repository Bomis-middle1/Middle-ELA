<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tense Time Maze Adventure</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1020;
color:white;
}

.header{
text-align:center;
padding:12px;
font-size:20px;
font-weight:bold;
background:linear-gradient(90deg,#ff6b6b,#ffa94d);
}

.stats{
display:flex;
justify-content:space-around;
padding:8px;
font-size:14px;
}

.info{
background:#fff3cd;
color:#000;
margin:10px;
padding:10px;
border-radius:10px;
font-size:13px;
}

#maze{
width:92%;
height:450px;
margin:auto;
border:2px solid white;
position:relative;
background:#111827;
overflow:hidden;
}

#player{
width:18px;
height:18px;
background:yellow;
border-radius:50%;
position:absolute;
left:30px;
top:30px;
}

.star{
width:12px;
height:12px;
background:#38bdf8;
border-radius:50%;
position:absolute;
}

.controls{
text-align:center;
margin:10px;
}

button{
padding:8px;
margin:3px;
}
</style>
</head>

<body>

<div class="header">⏳ TENSE TIME MAZE ADVENTURE</div>

<div class="stats">
<div>Stars: <span id="stars">0</span></div>
<div>Questions: <span id="qcount">0/15</span></div>
<div>Score: <span id="score">0</span></div>
</div>

<div class="info">
Move → Collect 3 stars → Unlock tense challenge → Progress forward
</div>

<div id="maze">
<div id="player"></div>
</div>

<div class="controls">
<button onclick="move(0,-15)">↑</button>
<button onclick="move(-15,0)">←</button>
<button onclick="move(15,0)">→</button>
<button onclick="move(0,15)">↓</button>
</div>

<script>

let player={x:30,y:30};
let stars=[];
let collected=0;
let qIndex=0;
let score=0;

/* FIXED STAR SYSTEM (CONSISTENT SPAWN INSIDE GRID) */
function spawnStars(){
document.querySelectorAll(".star").forEach(s=>s.remove());
stars=[];

for(let i=0;i<3;i++){
let s=document.createElement("div");
s.className="star";

/* IMPORTANT FIX: proper bounded area */
let mx=document.getElementById("maze");

s.style.left=Math.random()*(mx.clientWidth-30)+"px";
s.style.top=Math.random()*(mx.clientHeight-30)+"px";

mx.appendChild(s);
stars.push(s);
}
}

/* MOVE PLAYER */
function move(dx,dy){
player.x+=dx;
player.y+=dy;

let maze=document.getElementById("maze");

/* boundary fix */
player.x=Math.max(0,Math.min(maze.clientWidth-20,player.x));
player.y=Math.max(0,Math.min(maze.clientHeight-20,player.y));

document.getElementById("player").style.left=player.x+"px";
document.getElementById("player").style.top=player.y+"px";

checkCollision();
}

/* COLLISION FIX */
function checkCollision(){
let p=document.getElementById("player").getBoundingClientRect();

stars.forEach((s,i)=>{
let r=s.getBoundingClientRect();

if(
p.left < r.right &&
p.right > r.left &&
p.top < r.bottom &&
p.bottom > r.top
){
s.remove();
stars.splice(i,1);

collected++;
document.getElementById("stars").innerText=collected;

if(collected===3){
qIndex++;
document.getElementById("qcount").innerText=qIndex+"/15";
collected=0;
spawnStars();
}
}
});
}

/* INIT */
spawnStars();

</script>

</body>
</html>
