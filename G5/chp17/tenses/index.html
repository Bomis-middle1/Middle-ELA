<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Motivation Maze Runner - Grade 8 Soul Science</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family:'Comic Sans MS', Arial;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

.splash-screen {
    position:fixed;
    width:100%; height:100%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.splash-screen img {
    width:90%;
    max-width:500px;
    animation: float 2s infinite ease-in-out;
}

@keyframes float {
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-20px)}
}

.container {
    width:100%;
    max-width:800px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    opacity:0;
    transition:0.5s;
}

.container.visible { opacity:1; }

.header {
    background:linear-gradient(135deg,#f093fb,#f5576c);
    color:white;
    text-align:center;
    padding:20px;
}

#gameCanvas {
    width:100%;
    height:400px;
    background:#f0f4ff;
    border:3px solid #667eea;
}

.question-modal {
    display:none;
    position:fixed;
    width:100%; height:100%;
    background:rgba(0,0,0,0.8);
    justify-content:center;
    align-items:center;
}

.question-box {
    background:white;
    padding:30px;
    border-radius:20px;
    max-width:600px;
}

.option-btn {
    display:block;
    padding:15px;
    margin:10px 0;
    border:2px solid #667eea;
    cursor:pointer;
}

.option-btn.correct { background:#4CAF50; color:white; }
.option-btn.wrong { background:#f44336; color:white; }

</style>
</head>

<body>

<div class="splash-screen" id="splashScreen">
    <img src="assets/innovine-logo.png">
</div>

<div class="container" id="mainContainer">
    <div class="header">
        <h1>Motivation Maze Runner</h1>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<div class="question-modal" id="questionModal">
    <div class="question-box">
        <div id="questionText"></div>
        <div id="optionsContainer"></div>
    </div>
</div>

<script>

/* =======================
ONLY QUESTIONS REPLACED

    {
        question: "She said that she ____ for the exam the previous night.",
        options: ["is preparing","was preparing","has prepared","prepares"],
        correct: 1
    },
    {
        question: "Convert to INDIRECT SPEECH: He said, “I will finish the project tomorrow.”",
        options: [
            "He said that he would finish the project the next day",

            "He said he finished the project tomorrow"
        ],
        correct: 0
    },
    {
        question: "Identify the tense: They had already left before we arrived.",

        correct: 1
    },
    {
        question: "Which is FUTURE CONTINUOUS?",
        options: [
            "I will go tomorrow",
            "I will be going tomorrow",

            "I went tomorrow"
        ],

    {
        question: "Convert: She is writing a letter →",

            "She writes a letter",
            "She wrote a letter",

            "She was writing a letter"
        ],
        correct: 3
    },
    {
        question: "Which is PRESENT PERFECT?",
        options: [
            "She has completed homework",
            "She completed homework yesterday",

        ],
        correct: 0
    },
    {
        question: "Indirect speech: They said, “We are playing football.”",
        options: [
            "They said they played football",

            "They said they were playing football",

        correct: 2

            "I went tomorrow",

        correct: 2

    {
        question: "Identify tense: She has been reading for two hours",

            "Present Perfect",

        ],
        correct: 1
    },
    {
        question: "Past Continuous sentence:",
        options: [
            "They will watch TV when I called",
            "They watch TV when I called",
            "They have watched TV when I called",
            "They were watching TV when I called"
        ],
        correct: 3
    }
];

</script>

</body>
</html>
