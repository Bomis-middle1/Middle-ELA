<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tense Time Maze Adventure</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#070b1a;
  overflow:hidden;
  color:white;
}

/* SPLASH */
#splash{
  position:fixed;
  inset:0;
  background:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
}
#splash img{width:300px}

/* HEADER */
#header{
  text-align:center;
  padding:10px;
}

h1{
  margin:5px;
  color:#facc15;
}

/* JOURNEY BAR (FIXED STYLE) */
#journey{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:10px auto;
  flex-wrap:wrap;
}

.node{
  width:24px;
  height:24px;
  border-radius:50%;
  background:#334155;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  transition:0.3s;
}

.node.active{
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
}

/* SCORE BAR */
#info{
  text-align:center;
  font-size:14px;
}

/* GAME AREA */
#gameArea{
  display:flex;
  justify-content:center;
  align-items:center;
  height:70vh;
}

#maze{
  width:90%;
  height:450px;
  border:2px solid #334155;
  position:relative;
  overflow:hidden;
}

/* PLAYER */
#player{
  width:18px;
  height:18px;
  background:gold;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
}

/* STAR */
.star{
  width:12px;
  height:12px;
  background:#38bdf8;
  border-radius:50%;
  position:absolute;
}

/* QUESTION BOX */
#qbox{
  position:fixed;
  top:18%;
  left:50%;
  transform:translateX(-50%);
  width:80%;
  background:#111827;
  padding:15px;
  border-radius:10px;
  display:none;
  z-index:10;
}

.option{
  background:#1f2937;
  margin:6px 0;
  padding:10px;
  border-radius:6px;
  cursor:pointer;
}
.option:hover{background:#374151}
</style>
</head>

<body>

<div id="splash">
  <img src="assets/logo.png">
</div>

<div id="header">
  <h1>⏳ Tense Time Maze Adventure</h1>
  <div id="info">
    Score: <span id="score">0</span> | Zone: <span id="zone">Present</span>
  </div>
</div>

<!-- JOURNEY -->
<div id="journey"></div>

<div id="gameArea">
  <div id="maze">
    <div id="player"></div>
  </div>
</div>

<!-- QUESTION -->
<div id="qbox">
  <div id="q"></div>
  <div id="opts"></div>
</div>

<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>

<script>

/* ---------------- JOURNEY ---------------- */
const journey=document.getElementById("journey");

for(let i=1;i<=15;i++){
  let n=document.createElement("div");
  n.className="node";
  n.innerText=i;
  journey.appendChild(n);
}

/* ---------------- STATE ---------------- */
let player=document.getElementById("player");
let maze=document.getElementById("maze");
let qbox=document.getElementById("qbox");
let q=document.getElementById("q");
let opts=document.getElementById("opts");

let score=0;
let stars=0;
let index=0;

/* ---------------- QUESTIONS (HOTS TENSES) ---------------- */
const questions=[
{
q:"If she ___ harder, she would have passed.",
opts:["studies","had studied","studied","has studied"],
ans:1
},
{
q:"By tomorrow, I ___ the work.",
opts:["finish","will finish","will have finished","finished"],
ans:2
},
{
q:"He said that he ___ tired.",
opts:["is","was","has been","will be"],
ans:1
},
{
q:"If I were rich, I ___ a school.",
opts:["build","would build","built","will build"],
ans:1
},
{
q:"They ___ football when it started raining.",
opts:["play","were playing","played","are playing"],
ans:1
},
{
q:"She ___ English every day.",
opts:["study","studies","studied","is studying"],
ans:1
},
{
q:"The train ___ before we arrived.",
opts:["left","had left","leaves","will leave"],
ans:1
},
{
q:"If it rains, we ___ stay home.",
opts:["will","would","did","do"],
ans:0
},
{
q:"He said he ___ come later.",
opts:["will","would","shall","can"],
ans:1
},
{
q:"By 2030, scientists ___ Mars.",
opts:["reach","will reach","will have reached","reached"],
ans:2
},
{
q:"She ___ since morning.",
opts:["works","has been working","worked","is work"],
ans:1
},
{
q:"If they had left early, they ___ the bus.",
opts:["catch","would catch","would have caught","caught"],
ans:2
},
{
q:"He ___ when I entered.",
opts:["sleeps","was sleeping","slept","has slept"],
ans:1
},
{
q:"They ___ games every evening.",
opts:["play","plays","playing","played"],
ans:0
},
{
q:"The movie ___ by the time we reached.",
opts:["starts","had started","start","will start"],
ans:1
}
];

/* ---------------- MOVE ---------------- */
document.addEventListener("keydown",(e)=>{
  let x=player.offsetLeft;
  let y=player.offsetTop;

  if(e.key==="ArrowRight")player.style.left=(x+10)+"px";
  if(e.key==="ArrowLeft")player.style.left=(x-10)+"px";
  if(e.key==="ArrowUp")player.style.top=(y-10)+"px";
  if(e.key==="ArrowDown")player.style.top=(y-10)+"px";

  checkCollision();
});

/* ---------------- STARS ---------------- */
function spawnStar(){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*90+"%";
  s.style.top=Math.random()*90+"%";
  maze.appendChild(s);
}
for(let i=0;i<6;i++)spawnStar();

/* ---------------- COLLISION ---------------- */
function checkCollision(){
  document.querySelectorAll(".star").forEach(st=>{
    let r1=player.getBoundingClientRect();
    let r2=st.getBoundingClientRect();

    if(!(r1.right<r2.left||r1.left>r2.right||r1.bottom<r2.top||r1.top>r2.bottom)){
      st.remove();
      stars++;

      if(stars>=3){
        showQuestion();
      }
    }
  });
}

/* ---------------- QUESTION ---------------- */
function showQuestion(){
  qbox.style.display="block";

  let data=questions[index];

  q.innerText=data.q;
  opts.innerHTML="";

  let shuffled=data.opts
    .map((o,i)=>({o,i}))
    .sort(()=>Math.random()-0.5);

  shuffled.forEach(item=>{
    let div=document.createElement("div");
    div.className="option";
    div.innerText=item.o;

    div.onclick=()=>{
      if(item.i===data.ans){
        score++;
        document.getElementById("correct").play();

        document.querySelectorAll(".node")[index].classList.add("active");
        document.getElementById("score").innerText=score;
      }else{
        document.getElementById("wrong").play();
      }

      next();
    };

    opts.appendChild(div);
  });
}

/* ---------------- NEXT ---------------- */
function next(){
  qbox.style.display="none";
  stars=0;
  index++;

  if(index>=questions.length){
    alert("🎉 Tense Master Complete!");
    location.reload();
    return;
  }

  spawnStar();
  spawnStar();
}

/* ---------------- SPLASH ---------------- */
setTimeout(()=>{
  document.getElementById("splash").style.display="none";
},3000);

</script>

</body>
</html>
