<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Animal Rescue Adverbs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; }
    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(77, 0, 112, 0.95) 0%, rgba(33, 0, 47, 0.96) 55%, rgba(15, 0, 22, 1) 100%),
        url('assets/logo.png');
      background-size: cover;
      background-attachment: fixed;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .overlay {
      min-height: 100vh;
      background: rgba(14, 0, 20, 0.72);
    }
    .screen {
      min-height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .screen.show { display: flex; }
    .card {
      width: min(1000px, 100%);
      background: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.05));
      border: 2px solid rgba(255,255,255,0.16);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 0 34px rgba(255, 105, 180, 0.2);
      backdrop-filter: blur(8px);
    }
    .splash {
      text-align: center;
    }
    .splash img {
      width: min(320px, 72vw);
      height: auto;
      filter: drop-shadow(0 0 18px rgba(255,105,180,0.7));
      animation: logoPulse 3s ease-in-out forwards;
    }
    .splash h1 {
      margin-top: 14px;
      font-size: clamp(22px, 4vw, 40px);
      color: #ffb5ea;
      text-shadow: 0 0 12px rgba(255,102,204,0.6);
    }
    .splash p {
      margin-top: 8px;
      font-size: clamp(16px, 2.6vw, 22px);
      color: #d8ffef;
    }
    @keyframes logoPulse {
      0% { transform: scale(0.8); opacity: 0; }
      15% { transform: scale(1.04); opacity: 1; }
      70% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1); opacity: 0.98; }
    }
    .title {
      text-align: center;
      font-size: clamp(26px, 5vw, 46px);
      color: #ff90e6;
      text-shadow: 0 0 12px rgba(255,102,204,0.7);
      margin-bottom: 10px;
      font-weight: 800;
    }
    .top {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: space-between;
      margin: 8px 0 12px;
    }
    .badge {
      background: rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 10px 14px;
      font-weight: 700;
      flex: 1 1 120px;
      text-align: center;
    }
    .progress {
      width: 100%;
      height: 10px;
      background: rgba(255,255,255,0.12);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff66cc, #7b7bff, #57f3ff);
      transition: width .35s ease;
    }
    .hero {
      text-align: center;
      font-size: clamp(72px, 12vw, 120px);
      margin: 6px 0 2px;
    }
    .rescue {
      text-align: center;
      font-size: clamp(18px, 3.4vw, 28px);
      color: #a8ffe9;
      font-weight: 800;
      margin: 10px 0 12px;
    }
    .question {
      text-align: center;
      font-size: clamp(22px, 4vw, 32px);
      line-height: 1.55;
      margin: 8px auto 18px;
      max-width: 900px;
      padding: 0 8px;
    }
    .options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 10px 0 16px;
    }
    .opt {
      appearance: none;
      border: 2px solid rgba(255,255,255,0.18);
      background: linear-gradient(180deg, #7531ba, #55248c);
      color: #fff;
      border-radius: 18px;
      min-height: 66px;
      padding: 14px 12px;
      font-size: clamp(18px, 3.5vw, 26px);
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    .opt:hover { transform: translateY(-1px) scale(1.01); }
    .opt:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .msg, .explain { min-height: 8px; }
    .next, .restart {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 16px 18px;
      font-size: clamp(18px, 3.6vw, 24px);
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: linear-gradient(180deg, #ff5fbf, #c63d8f);
      box-shadow: 0 10px 24px rgba(255, 95, 191, .25);
    }
    .next:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
    .final { text-align: center; }
    .final h2 {
      font-size: clamp(28px, 5vw, 44px);
      color: #ff96e6;
      margin-bottom: 12px;
    }
    .final p {
      font-size: clamp(20px, 4vw, 28px);
      margin: 10px 0 18px;
      color: #f1ff8a;
    }
    .confetti {
      position: fixed;
      top: -14px;
      width: 10px;
      height: 14px;
      border-radius: 3px;
      animation: fall 2.8s linear forwards;
      z-index: 9999;
    }
    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    .sparkle {
      position: fixed;
      font-size: 28px;
      animation: sparkle 1s ease-out forwards;
      z-index: 9999;
      pointer-events: none;
    }
    @keyframes sparkle {
      0% { transform: scale(.2); opacity: 0; }
      25% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0); opacity: 0; }
    }
    .animal {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 8px 0 4px;
      font-size: clamp(34px, 5vw, 54px);
    }
    @media (max-width: 700px) {
      .options { grid-template-columns: 1fr; }
      .card { padding: 14px; border-radius: 20px; }
      .badge { flex: 1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="screen show" id="splashScreen">
      <div class="card splash">
        <img src="assets/logo.png" alt="Logo">
        <h1>Animal Rescue Adverbs</h1>
        <p>Help rescue the animals by identifying the type of adverb.</p>
      </div>
    </div>

    <div class="screen" id="gameScreen">
      <div class="card">
        <div class="title">🐾 Animal Rescue Adverbs 🐾</div>
        <div class="top">
          <div class="badge" id="scoreText">Score: 0</div>
          <div class="badge" id="trickText">Question 1 / 15</div>
          <div class="badge" id="attemptText">Attempt 1 / 2</div>
        </div>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="animal" id="animal">🐶</div>
        <div class="rescue" id="rescueText">Rescue Mission 1</div>
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
        <div class="msg" id="message"></div>
        <div class="explain" id="explain"></div>
        <button class="next" id="nextBtn" disabled>Save & Next 🛟</button>
      </div>
    </div>

    <div class="screen" id="finalScreen">
      <div class="card final">
        <h2>🎉 All Animals Rescued! 🎉</h2>
        <div class="hero">🐾🏆🐾</div>
        <p id="finalScore"></p>
        <p id="finalMsg"></p>
        <button class="restart" id="restartBtn">Play Again 🛟</button>
      </div>
    </div>
  </div>

  <script>
    const tricks = [
      {
        question: "While cleaning the classroom after the picnic, the teacher noticed that the children had arranged the books neatly on the shelf.",
        options: ["manner", "place", "frequency", "time"],
        correct: "manner",
        explain: "‘Neatly’ tells how the books were arranged."
      },
      {
        question: "At the end of every week, the gardener usually waters the plants beside the school gate.",
        options: ["time", "reason", "frequency", "degree"],
        correct: "frequency",
        explain: "‘Usually’ tells how often the gardener waters the plants."
      },
      {
        question: "The kitten hid under the bed when the visitors entered the house.",
        options: ["place", "manner", "time", "reason"],
        correct: "place",
        explain: "‘Under the bed’ tells where the kitten hid."
      },
      {
        question: "The old bridge was very narrow, so the bus driver slowed down carefully before crossing it.",
        options: ["frequency", "reason", "degree", "manner"],
        correct: "degree",
        explain: "‘Very’ tells the degree of narrowness."
      },
      {
        question: "The children stayed indoors because it started raining heavily before lunch.",
        options: ["reason", "time", "place", "manner"],
        correct: "reason",
        explain: "‘Because’ gives the reason."
      },
      {
        question: "We will leave for the museum tomorrow after our morning assembly ends.",
        options: ["degree", "time", "frequency", "place"],
        correct: "time",
        explain: "‘Tomorrow’ tells when the action will happen."
      },
      {
        question: "The farmer worked quietly in the field so that the sleeping baby would not wake up.",
        options: ["manner", "reason", "place", "time"],
        correct: "manner",
        explain: "‘Quietly’ tells how the farmer worked."
      },
      {
        question: "My father often checks the bicycle tyres before we go on a long ride.",
        options: ["time", "frequency", "degree", "place"],
        correct: "frequency",
        explain: "‘Often’ tells how often he checks the tyres."
      },
      {
        question: "The lost puppy was waiting outside the bakery when we found it.",
        options: ["manner", "place", "reason", "time"],
        correct: "place",
        explain: "‘Outside the bakery’ tells where the puppy was waiting."
      },
      {
        question: "The magician’s trick was quite interesting, and all the children watched with wide eyes.",
        options: ["degree", "reason", "frequency", "time"],
        correct: "degree",
        explain: "‘Quite’ tells the degree of interest."
      },
      {
        question: "Riya finished her homework early so that she could join the cricket practice.",
        options: ["time", "reason", "place", "manner"],
        correct: "reason",
        explain: "‘So that’ gives the reason."
      },
      {
        question: "The train arrived late at the station after the heavy fog cleared.",
        options: ["place", "time", "frequency", "degree"],
        correct: "time",
        explain: "‘Late’ tells when the train arrived."
      },
      {
        question: "The baby bird chirped softly in its nest while the mother bird searched for food.",
        options: ["manner", "place", "reason", "frequency"],
        correct: "manner",
        explain: "‘Softly’ tells how the bird chirped."
      },
      {
        question: "We sometimes visit our grandparents during the winter holidays.",
        options: ["degree", "time", "frequency", "place"],
        correct: "frequency",
        explain: "‘Sometimes’ tells how often we visit."
      },
      {
        question: "The treasure chest was hidden inside the old cave near the river bank.",
        options: ["place", "reason", "time", "manner"],
        correct: "place",
        explain: "‘Inside the old cave’ tells where the chest was hidden."
      }
    ];

    let current = 0;
    let attempts = 0;
    let score = 0;
    let locked = false;
    let audioReady = false;

    const splashScreen = document.getElementById("splashScreen");
    const gameScreen = document.getElementById("gameScreen");
    const finalScreen = document.getElementById("finalScreen");
    const scoreText = document.getElementById("scoreText");
    const trickText = document.getElementById("trickText");
    const attemptText = document.getElementById("attemptText");
    const bar = document.getElementById("bar");
    const animal = document.getElementById("animal");
    const rescueText = document.getElementById("rescueText");
    const question = document.getElementById("question");
    const optionsBox = document.getElementById("options");
    const message = document.getElementById("message");
    const explain = document.getElementById("explain");
    const nextBtn = document.getElementById("nextBtn");
    const finalScore = document.getElementById("finalScore");
    const finalMsg = document.getElementById("finalMsg");
    const restartBtn = document.getElementById("restartBtn");

    const animals = ["🐶", "🐱", "🐻", "🦊", "🐰", "🐼", "🐸", "🦁", "🐯", "🐵", "🐦", "🐘", "🦄", "🐥", "🐴"];

    const correctAudio = new Audio("assets/correct.mp3");
    const wrongAudio = new Audio("assets/wrong.mp3");
    const clapAudio = new Audio("assets/freesound_community-claps-44774.mp3");

    function prepareAudio() {
      if (audioReady) return;
      [correctAudio, wrongAudio, clapAudio].forEach(a => {
        a.preload = "auto";
        a.volume = 1;
      });
      audioReady = true;
    }

    function playSound(aud) {
      try {
        aud.currentTime = 0;
        aud.play().catch(() => {});
      } catch (e) {}
    }

    function showConfetti() {
      const colors = ["#ff66cc", "#ffe066", "#66ffcc", "#8a7dff", "#ff7f50"];
      for (let i = 0; i < 34; i++) {
        const d = document.createElement("div");
        d.className = "confetti";
        d.style.left = Math.random() * 100 + "vw";
        d.style.background = colors[Math.floor(Math.random() * colors.length)];
        d.style.animationDelay = (Math.random() * 0.4) + "s";
        d.style.transform = `rotate(${Math.random() * 180}deg)`;
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 3200);
      }
    }

    function showSparkles() {
      const items = ["✨", "⭐", "💫"];
      for (let i = 0; i < 16; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        s.textContent = items[Math.floor(Math.random() * items.length)];
        s.style.left = Math.random() * 100 + "vw";
        s.style.top = Math.random() * 100 + "vh";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1200);
      }
    }

    function render() {
      if (current >= tricks.length) return showFinal();
      const t = tricks[current];
      trickText.textContent = `Question ${current + 1} / ${tricks.length}`;
      attemptText.textContent = `Attempt ${attempts + 1} / 2`;
      scoreText.textContent = `Score: ${score}`;
      bar.style.width = `${(current / tricks.length) * 100}%`;
      animal.textContent = animals[current % animals.length];
      rescueText.textContent = `Rescue Mission ${current + 1}`;
      question.textContent = t.question;
      message.textContent = "";
      explain.textContent = "";
      nextBtn.disabled = true;
      locked = false;
      optionsBox.innerHTML = "";
      t.options.forEach(opt => {
        const b = document.createElement("button");
        b.className = "opt";
        b.textContent = opt;
        b.onclick = () => answer(opt, b);
        optionsBox.appendChild(b);
      });
    }

    function disableOptions() {
      optionsBox.querySelectorAll("button").forEach(b => b.disabled = true);
    }

    function answer(opt, btn) {
      if (locked) return;
      const t = tricks[current];
      if (opt === t.correct) {
        locked = true;
        score += 10;
        animal.textContent = "🛟" + animal.textContent;
        playSound(correctAudio);
        setTimeout(() => playSound(clapAudio), 900);
        showConfetti();
        showSparkles();
        disableOptions();
        nextBtn.disabled = false;
        scoreText.textContent = `Score: ${score}`;
      } else {
        playSound(wrongAudio);
        attempts += 1;
        animal.textContent = "❌" + animal.textContent;
        btn.disabled = true;
        btn.style.opacity = "0.4";
        if (attempts < 2) {
          attemptText.textContent = `Attempt ${attempts + 1} / 2`;
        } else {
          locked = true;
          disableOptions();
          nextBtn.disabled = false;
        }
      }
    }

    function next() {
      current += 1;
      attempts = 0;
      animal.textContent = animals[current % animals.length];
      if (current >= tricks.length) showFinal();
      else render();
    }

    function showFinal() {
      gameScreen.classList.remove("show");
      finalScreen.classList.add("show");
      finalScore.textContent = `Your Final Score: ${score} / ${tricks.length * 10}`;
      finalMsg.textContent =
        score === 150 ? "✨ Perfect! You rescued every animal and mastered adverbs!" :
        score >= 120 ? "🎉 Amazing! You are a strong adverb rescuer!" :
        score >= 90 ? "😊 Good job! Keep practicing your grammar rescue skills!" :
        "🛟 Keep trying and you’ll become a rescue champion!";
      playSound(clapAudio);
      bar.style.width = "100%";
    }

    function restartGame() {
      current = 0;
      attempts = 0;
      score = 0;
      locked = false;
      finalScreen.classList.remove("show");
      gameScreen.classList.add("show");
      render();
    }

    nextBtn.addEventListener("click", next);
    restartBtn.addEventListener("click", restartGame);

    setTimeout(() => {
      splashScreen.classList.remove("show");
      gameScreen.classList.add("show");
      prepareAudio();
      render();
    }, 3000);

    document.addEventListener("click", prepareAudio, { once: true });
    document.addEventListener("touchstart", prepareAudio, { once: true });
  </script>
</body>
</html>
