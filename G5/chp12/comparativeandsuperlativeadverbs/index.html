<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Air Balloon Adverbs Game</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #ffe0f0, #cce0ff);
    overflow-x: hidden;
}

#logo-container {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: none;
}

#score {
    position: absolute;
    top: 10px;
    left: 10px;
    background: white;
    padding: 8px 12px;
    border-radius: 10px;
    font-weight: bold;
}

#question-container {
    text-align: center;
    margin-top: 80px;
    font-size: 24px;
    font-weight: bold;
}

#game-container {
    position: relative;
    width: 100%;
    height: 80vh;
    overflow: hidden;
    margin-top: 20px;
}

#balloon {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    transition: bottom 0.6s;
    z-index: 2;
}

#options {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 10px;
    flex-wrap: wrap;
}

.option-btn {
    padding: 12px 18px;
    background-color: orange;
    border: none;
    border-radius: 10px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.option-btn:hover {
    background-color: darkorange;
}
</style>
</head>
<body>

<!-- Innovine Logo -->
<div id="logo-container">
    <img src="assets/logo.png" alt="Innovine Logo" width="300">
</div>

<div id="score">Score: 0</div>

<div id="question-container"></div>

<div id="game-container">
    <img id="balloon" src="assets/balloon.png" alt="Balloon">
</div>

<div id="options"></div>

<audio id="correct-sound" src="assets/correct.mp3"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3"></audio>
<audio id="applause-sound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const questions = [
    {q: "We will meet ___ at the park.", options: ["quickly", "slowly", "happy", "red"], answer: "quickly"},
    {q: "She ran ___ to catch the bus.", options: ["fast", "big", "loud", "green"], answer: "fast"},
    {q: "He speaks ___ than his brother.", options: ["more clearly", "tall", "yellow", "careful"], answer: "more clearly"},
    {q: "They worked ___ to finish the project.", options: ["harder", "small", "funny", "blue"], answer: "harder"},
    {q: "I will visit ___ next month.", options: ["soon", "happy", "green", "big"], answer: "soon"},
    {q: "The bird sings ___ in the morning.", options: ["louder", "fast", "red", "blue"], answer: "louder"},
    {q: "She swims ___ than her friend.", options: ["better", "small", "careful", "soft"], answer: "better"},
    {q: "He answered the questions ___.", options: ["quickly", "yellow", "round", "tall"], answer: "quickly"},
    {q: "The baby slept ___ in the afternoon.", options: ["quietly", "happy", "orange", "strong"], answer: "quietly"},
    {q: "They completed the game ___ than before.", options: ["faster", "slow", "red", "big"], answer: "faster"},
];

let score = 0;
let current = 0;

const balloon = document.getElementById('balloon');
const questionContainer = document.getElementById('question-container');
const optionsDiv = document.getElementById('options');
const scoreDiv = document.getElementById('score');
const logo = document.getElementById('logo-container');

function startGame() {
    // Show logo for 5 seconds
    logo.style.display = 'block';
    setTimeout(() => {
        logo.style.display = 'none';
        showQuestion();
    }, 5000);
}

function showQuestion() {
    if(current >= questions.length) {
        questionContainer.innerHTML = "🎉 Well done! You finished the game!";
        optionsDiv.innerHTML = '';
        document.getElementById('applause-sound').play();
        return;
    }

    const q = questions[current];
    questionContainer.textContent = q.q;

    optionsDiv.innerHTML = '';
    q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.classList.add('option-btn');
        btn.onclick = () => checkAnswer(opt);
        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(selected) {
    const correct = questions[current].answer;
    if(selected === correct) {
        score++;
        scoreDiv.textContent = "Score: " + score;
        document.getElementById('correct-sound').play();
        // Move balloon upward
        let currentBottom = parseInt(window.getComputedStyle(balloon).bottom);
        balloon.style.bottom = (currentBottom + 60) + "px";
    } else {
        document.getElementById('wrong-sound').play();
    }
    current++;
    setTimeout(showQuestion, 600);
}

startGame();
</script>

</body>
</html>
