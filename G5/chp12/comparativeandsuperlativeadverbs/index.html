<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Air Balloon Adverbs Game</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    height: 100%;
    background: linear-gradient(to top, #c0e0ff, #f9d6f0);
    overflow: hidden;
    text-align: center;
  }

  #logoScreen {
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction: column;
    z-index: 1000;
  }

  #logoScreen img {
    width: 200px;
    margin-bottom: 20px;
  }

  #gameContainer {
    display: none;
    width: 100%;
    height: 100%;
    position: relative;
  }

  #score {
    position: absolute;
    top: 10px;
    left: 10px;
    background: white;
    padding: 10px 15px;
    border-radius: 10px;
    font-weight: bold;
    z-index: 100;
  }

  #question {
    margin-top: 50px;
    font-size: 24px;
    font-weight: bold;
  }

  #balloon {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    transition: bottom 0.5s linear;
  }

  #options {
    position: absolute;
    bottom: 10px;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .optionBtn {
    background: orange;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .optionBtn:hover {
    transform: scale(1.1);
  }
</style>
</head>
<body>

<div id="logoScreen">
  <img src="assets/logo.png" alt="Innovine Logo">
  <h2>Innovine Learning Adventures</h2>
</div>

<div id="gameContainer">
  <div id="score">Score: 0</div>
  <div id="question">Question goes here</div>
  <img id="balloon" src="assets/balloon.png" alt="Hot Air Balloon">
  <div id="options">
    <button class="optionBtn" id="opt1">Option 1</button>
    <button class="optionBtn" id="opt2">Option 2</button>
    <button class="optionBtn" id="opt3">Option 3</button>
    <button class="optionBtn" id="opt4">Option 4</button>
  </div>
</div>

<audio id="correctAudio" src="assets/correct.mp3"></audio>
<audio id="wrongAudio" src="assets/wrong.mp3"></audio>

<script>
const logoScreen = document.getElementById("logoScreen");
const gameContainer = document.getElementById("gameContainer");
const scoreEl = document.getElementById("score");
const questionEl = document.getElementById("question");
const balloon = document.getElementById("balloon");
const options = Array.from(document.getElementsByClassName("optionBtn"));
const correctAudio = document.getElementById("correctAudio");
const wrongAudio = document.getElementById("wrongAudio");

let score = 0;
let balloonBottom = 20;
let questionIndex = 0;

const questions = [
  { q: "We will meet ___ at the park.", opts: ["quickly","softly","slow","here"], ans: "quickly" },
  { q: "He ran ___ to catch the bus.", opts: ["quickly","hard","late","small"], ans: "quickly" },
  { q: "She answered the question ___", opts: ["clearly","often","loud","red"], ans: "clearly" },
  { q: "They completed their homework ___", opts: ["carefully","far","slow","red"], ans: "carefully" },
  { q: "The dog barked ___ all night.", opts: ["loudly","quickly","small","red"], ans: "loudly" },
  { q: "I slept ___ last night.", opts: ["peacefully","early","soft","here"], ans: "peacefully" },
  { q: "The baby cried ___", opts: ["loudly","carefully","fast","red"], ans: "loudly" },
  { q: "She spoke ___ during the presentation.", opts: ["confidently","far","soft","here"], ans: "confidently" },
  { q: "He walked ___ through the park.", opts: ["slowly","quickly","here","red"], ans: "slowly" },
  { q: "The teacher explained the lesson ___", opts: ["clearly","soft","fast","here"], ans: "clearly" }
];

function startGame() {
  logoScreen.style.display = "none";
  gameContainer.style.display = "block";
  showQuestion();
}

function showQuestion() {
  if(questionIndex >= questions.length) {
    alert("Well done! Your final score is: " + score);
    questionIndex = 0;
    score = 0;
    balloonBottom = 20;
    balloon.style.bottom = balloonBottom + "px";
  }
  const q = questions[questionIndex];
  questionEl.textContent = q.q;
  options.forEach((btn,i)=>{
    btn.textContent = q.opts[i];
    btn.onclick = () => checkAnswer(q.opts[i]);
  });
}

function checkAnswer(selected) {
  const q = questions[questionIndex];
  if(selected === q.ans) {
    correctAudio.play();
    score += 1;
    balloonBottom += 50;
    balloon.style.bottom = balloonBottom + "px";
  } else {
    wrongAudio.play();
  }
  scoreEl.textContent = "Score: " + score;
  questionIndex++;
  setTimeout(showQuestion, 500);
}

setTimeout(startGame, 5000);
</script>

</body>
</html>
