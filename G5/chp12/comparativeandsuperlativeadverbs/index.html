<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Air Balloon Adverbs Game</title>
<style>
body, html {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: linear-gradient(to top, #a1c4fd, #c2e9fb);
    text-align: center;
}

/* Splash screen */
#splash {
    position: fixed; top:0; left:0;
    width:100%; height:100%;
    display:flex; justify-content:center; align-items:center;
    background:white; z-index:1000;
}
#splash img { width:300px; }

/* Game container */
#game { display:none; padding:20px; }
#score { font-size:20px; margin:10px; background:white; display:inline-block; padding:5px 10px; border-radius:10px; }
#question { font-size:24px; margin:20px; font-weight:bold; }
#options { margin-top:10px; }
button.option-btn {
    padding:12px 20px;
    margin:10px;
    font-size:18px;
    background:orange;
    border:none;
    color:white;
    border-radius:8px;
    cursor:pointer;
    transition:0.2s;
}
button.option-btn:hover { transform:scale(1.05); background:darkorange; }

/* Track and balloon */
#track-container {
    position: relative;
    width: 200px;
    height: 500px;
    margin: 20px auto;
    background: #d0f0f7;
    border-radius:20px;
    overflow: hidden;
    border: 3px solid #888;
}
#balloon {
    position: absolute;
    bottom: 20px;
    left:50%;
    transform: translateX(-50%);
    width:80px;
    transition: bottom 0.5s ease;
}
#finishMessage {
    font-size:28px;
    color:#ff4500;
    font-weight:bold;
    display:none;
    margin-top:20px;
}
</style>
</head>
<body>

<!-- Splash screen -->
<div id="splash">
    <img src="assets/logo.png" alt="Innovine Logo">
</div>

<!-- Game -->
<div id="game">
    <div id="score">Score: 0</div>
    <div id="question">Select the correct adverb to make the balloon rise!</div>
    <div id="track-container">
        <img id="balloon" src="assets/balloon.png" alt="Balloon">
    </div>
    <div id="options">
        <button class="option-btn"></button>
        <button class="option-btn"></button>
        <button class="option-btn"></button>
        <button class="option-btn"></button>
    </div>
    <div id="finishMessage">🎉 You’ve reached the top! 🎉</div>
</div>

<audio id="correctAudio" src="assets/correct.mp3"></audio>
<audio id="wrongAudio" src="assets/wrong.mp3"></audio>
<audio id="clapAudio" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
// Questions array
const questions = [
{q:"We will meet ___ at the park.", options:["quickly","red","book","slow"], answer:"quickly"},
{q:"She runs ___ than her sister.", options:["happily","softly","loud","better"], answer:"better"},
{q:"The dog barked ___ at the stranger.", options:["loudly","softly","fast","high"], answer:"loudly"},
{q:"He finished his work ___ than before.", options:["faster","hard","slow","early"], answer:"faster"},
{q:"I will call you ___ tomorrow.", options:["later","small","here","soon"], answer:"later"},
{q:"She sang ___ in the choir.", options:["beautifully","red","green","quickly"], answer:"beautifully"},
{q:"The baby slept ___ during the night.", options:["peacefully","hard","well","early"], answer:"peacefully"},
{q:"He ran ___ to win the race.", options:["quickly","slowly","fast","happy"], answer:"quickly"},
{q:"They arrived ___ at the party.", options:["early","late","soft","bright"], answer:"early"},
{q:"The rabbit hopped ___ across the garden.", options:["quickly","slowly","high","low"], answer:"slowly"},
{q:"She finished her homework ___ than yesterday.", options:["faster","slow","hard","quick"], answer:"faster"},
{q:"The wind blew ___ during the storm.", options:["strongly","soft","high","fast"], answer:"strongly"},
{q:"He whispered ___ to avoid being heard.", options:["softly","loudly","quickly","hard"], answer:"softly"},
{q:"She danced ___ across the stage.", options:["gracefully","fast","quick","slow"], answer:"gracefully"},
{q:"The train moved ___ along the tracks.", options:["smoothly","fast","high","slow"], answer:"smoothly"}
];

let current = 0;
let score = 0;
const balloon = document.getElementById("balloon");
const questionEl = document.getElementById("question");
const optionBtns = document.querySelectorAll(".option-btn");
const scoreEl = document.getElementById("score");
const finishMessage = document.getElementById("finishMessage");
const correctAudio = document.getElementById("correctAudio");
const wrongAudio = document.getElementById("wrongAudio");
const clapAudio = document.getElementById("clapAudio");

function showQuestion() {
    if(current >= questions.length){
        finishMessage.style.display = "block";
        clapAudio.play();
        return;
    }
    const q = questions[current];
    questionEl.textContent = q.q;
    optionBtns.forEach((btn,i)=>{
        btn.textContent = q.options[i];
        btn.onclick = () => checkAnswer(q.options[i]);
    });
}

function checkAnswer(selected){
    if(selected === questions[current].answer){
        score++;
        scoreEl.textContent = `Score: ${score}`;
        correctAudio.play();
        balloon.style.bottom = (20 + score*30) + "px"; // balloon moves upward
    } else { wrongAudio.play(); }
    current++;
    setTimeout(showQuestion, 500);
}

// Show splash screen for 5 seconds
setTimeout(()=>{
    document.getElementById("splash").style.display = "none";
    document.getElementById("game").style.display = "block";
    showQuestion();
}, 5000);
</script>

</body>
</html>
