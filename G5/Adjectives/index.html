<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Adjective Sorter Adventure</title>
<style>
* {margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif;}
body {overflow:hidden; background:linear-gradient(to bottom,#0d1b2a,#1b263b,#415a77);}
#gameArea {position:relative; width:100vw; height:100vh; overflow:hidden;}
#logoScreen{
position:absolute; width:100%; height:100%; background:white;
display:flex; justify-content:center; align-items:center; flex-direction:column; z-index:9999;
}
#logoScreen img{width:260px; max-width:80%;}
#logoText{margin-top:20px; font-size:32px; font-weight:bold; color:#333;}
#bins{
position:absolute; bottom:40px; width:100%; display:flex; justify-content:space-around; z-index:100;
}
.bin{
width:45%; height:150px; background:#fff8e1; border:4px dashed #e65100; border-radius:20px;
display:flex; justify-content:center; align-items:center; font-size:30px; font-weight:bold;
color:#e65100; user-select:none;
}
.word{position:absolute; padding:12px 20px; background:#4caf50; color:white;
border-radius:12px; font-size:22px; cursor:pointer; user-select:none; transition:0.2s;}
#scoreBoard{
position:absolute; top:15px; left:15px; background:white; padding:12px 18px; border-radius:15px;
font-size:20px; font-weight:bold; z-index:200;
}
.confetti{position:absolute; width:12px; height:12px; animation:fall 3s linear forwards;}
@keyframes fall{
from{transform:translateY(-100px) rotate(0deg);}
to{transform:translateY(100vh) rotate(720deg); opacity:0;}
}
#feedback{
position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
font-size:40px; font-weight:bold; color:white; text-shadow:2px 2px 5px black;
display:none; z-index:3000;
}
#endScreen{
position:absolute; width:100%; height:100%; background:rgba(0,0,0,0.85);
display:flex; justify-content:center; align-items:center; flex-direction:column;
text-align:center; color:white; padding:20px; z-index:5000; display:none;
}
@media(max-width:768px){
.word{font-size:18px; padding:10px 15px;}
.bin{font-size:24px; height:120px;}
}
</style>
</head>
<body>
<div id="gameArea">

<div id="logoScreen">
<img src="assets/logo.png" alt="Innovine Logo">
<div id="logoText">Innovine Learning Adventures</div>
</div>

<div id="endScreen">
<h1>🏆 Sorting Complete! 🏆</h1>
<h2 id="finalText" style="margin-top:20px;"></h2>
<button class="mainBtn" onclick="restartGame()">Play Again</button>
</div>

<div id="scoreBoard">Correct: <span id="score">0</span>/10</div>

<div id="bins">
<div class="bin" id="adjBin">Adjective</div>
<div class="bin" id="notAdjBin">Not Adjective</div>
</div>

<div id="feedback"></div>
</div>

<script>
// Audio
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/freesound_community-claps-44774.mp3");

// Words
let words = [
{word:"happy", type:"adj"}, {word:"run", type:"not"}, {word:"tall", type:"adj"},
{word:"dog", type:"not"}, {word:"beautiful", type:"adj"}, {word:"quickly", type:"not"},
{word:"red", type:"adj"}, {word:"jump", type:"not"}, {word:"blue", type:"adj"},
{word:"eat", type:"not"}, {word:"angry", type:"adj"}, {word:"school", type:"not"},
{word:"delicious", type:"adj"}, {word:"write", type:"not"}, {word:"soft", type:"adj"},
{word:"tree", type:"not"}, {word:"bright", type:"adj"}, {word:"play", type:"not"}
];

let score = 0;
let placedWords = 0;
const maxWords = 10;

const gameArea = document.getElementById("gameArea");
const adjBin = document.getElementById("adjBin");
const notAdjBin = document.getElementById("notAdjBin");
const feedback = document.getElementById("feedback");

function shuffleArray(array){ return array.sort(()=>Math.random()-0.5); }

// Start Game
function startGame(){
document.getElementById("logoScreen").style.display="none";
loadWord();
}

// Load Word
function loadWord(){
if(placedWords>=maxWords){ endGame(); return; }
shuffleArray(words);
const w = words[placedWords];
const wordDiv = document.createElement("div");
wordDiv.classList.add("word");
wordDiv.innerText = w.word;
wordDiv.style.top = "100px";
wordDiv.style.left = Math.random()*(window.innerWidth-150)+"px";
wordDiv.draggable=true;
gameArea.appendChild(wordDiv);

wordDiv.addEventListener("dragstart",(e)=>{
e.dataTransfer.setData("text/plain", placedWords);
});

adjBin.addEventListener("dragover",(e)=>e.preventDefault());
notAdjBin.addEventListener("dragover",(e)=>e.preventDefault());

adjBin.addEventListener("drop",(e)=>dropWord(e,"adj"));
notAdjBin.addEventListener("drop",(e)=>dropWord(e,"not"));
}

// Drop Word
function dropWord(e,binType){
e.preventDefault();
const index = e.dataTransfer.getData("text/plain");
const w = words[index];
const wordDivs = document.getElementsByClassName("word");
const wordDiv = wordDivs[index];
if(w.type===binType){
score++;
try{ correctSound.play(); clapSound.play(); } catch(e){}
createConfetti();
feedback.innerText="🎉 Correct!";
feedback.style.display="block";
setTimeout(()=>{feedback.style.display="none";},1000);
}else{
try{ wrongSound.play(); } catch(e){}
feedback.innerText="❌ Wrong!";
feedback.style.display="block";
setTimeout(()=>{feedback.style.display="none";},1000);
}
wordDiv.remove();
placedWords++;
document.getElementById("score").innerText = score;
setTimeout(loadWord,500);
}

// Confetti
function createConfetti(){
for(let i=0;i<20;i++){
const conf = document.createElement("div");
conf.classList.add("confetti");
conf.style.left=Math.random()*100+"%";
conf.style.background=`hsl(${Math.random()*360},100%,50%)`;
conf.style.animationDuration=(2+Math.random()*2)+"s";
document.body.appendChild(conf);
setTimeout(()=>{conf.remove();},4000);
}
}

// End Game
function endGame(){
document.getElementById("endScreen").style.display="flex";
document.getElementById("finalText").innerHTML=`You sorted <b>${score}</b> adjectives correctly!`;
}

function restartGame(){ location.reload(); }

// Automatically start game after 5 seconds
setTimeout(startGame, 5000);
</script>
</body>
</html>
