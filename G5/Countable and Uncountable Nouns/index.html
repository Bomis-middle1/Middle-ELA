<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countable & Uncountable Nouns - Prick the Balloon</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fef6e4, #dff6ff, #fce1ff);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow-x: hidden;
}

/* Splash Logo */
#splash {
  position: fixed;
  inset: 0;
  background: #fff9f0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: fadeOut 1s ease 4s forwards;
}
#splash img { width: 220px; max-width: 80%; }
@keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

h1 { margin-top: 20px; color: #2b4eff; text-align: center; }

/* Instructions */
#instructions-screen {
  width: 90%;
  max-width: 600px;
  background: #ffffffcc;
  padding: 20px;
  border-radius: 15px;
  margin-top: 20px;
  text-align: center;
}
#instructions-screen h2 { color: #2b4eff; margin-bottom: 10px; }
#instructions-screen p { font-size: 18px; color: #333; margin-bottom: 15px; }
#start-btn {
  padding: 10px 20px;
  font-size: 16px;
  background-color: #4caf50;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
#start-btn:hover { background-color: #45a049; }

/* Game Area */
#game-area {
  position: relative;
  width: 90%;
  max-width: 800px;
  height: 500px;
  margin-top: 20px;
  border: 3px dashed #c3c3ff;
  border-radius: 15px;
  background: #ffffffaa;
  overflow: hidden;
  display:none; /* hidden until start */
}

/* Balloon CSS-only */
.balloon {
  position: absolute;
  width: 100px;
  height: 130px;
  cursor: pointer;
  border-radius: 50% 50% 50% 50%;
  background: linear-gradient(145deg, #ff9999, #ff4d4d);
  box-shadow: 2px 2px 8px rgba(0,0,0,0.3);
  display: flex;
  justify-content: center;
  align-items: flex-end;
  font-weight: bold;
  color: #fff;
  text-shadow: 1px 1px 2px #000;
  transition: transform 0.2s;
  padding-bottom: 10px;
}
.balloon:hover { transform: scale(1.1); }

#score { margin-top: 15px; font-size: 20px; color:#333; }
#result { margin-top:10px; font-size:18px; color:#2b4eff; min-height:24px; }

@keyframes floatUp {
  0% { bottom: -150px; }
  100% { bottom: 500px; }
}
</style>
</head>
<body>

<!-- Splash Logo -->
<div id="splash">
  <img src="assets/logo.png" alt="Innovine Logo">
</div>

<h1>Countable & Uncountable Nouns</h1>

<!-- Instructions -->
<div id="instructions-screen">
  <h2>How to Play</h2>
  <p>Click on the balloons that have <strong>Countable nouns</strong> written on them.</p>
  <p>Avoid the balloons with <strong>Uncountable nouns</strong>!</p>
  <p>You get <strong>2 attempts</strong> per balloon. Wrong clicks remove the balloon after 2 tries.</p>
  <button id="start-btn">Start Game</button>
</div>

<!-- Game Area -->
<div id="game-area"></div>

<div id="result"></div>
<div id="score">Score: 0</div>

<audio id="correct-sound" src="assets/correct.mp3"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3"></audio>

<script>
// Nouns Data
const nouns = [
  {word:"Apple", type:"Countable"},
  {word:"Water", type:"Uncountable"},
  {word:"Book", type:"Countable"},
  {word:"Milk", type:"Uncountable"},
  {word:"Pencil", type:"Countable"},
  {word:"Rice", type:"Uncountable"},
  {word:"Chair", type:"Countable"},
  {word:"Sugar", type:"Uncountable"},
  {word:"Orange", type:"Countable"},
  {word:"Juice", type:"Uncountable"}
];

let score = 0;
let attempts = {};
let balloonInterval;

const gameArea = document.getElementById('game-area');
const startBtn = document.getElementById('start-btn');
const instructionsScreen = document.getElementById('instructions-screen');

// Spawn Balloon
function spawnBalloon(noun) {
  const balloon = document.createElement('div');
  balloon.className = 'balloon';
  balloon.style.left = Math.random() * (gameArea.offsetWidth - 100) + 'px';
  balloon.style.bottom = '-150px';
  balloon.style.animation = `floatUp ${5 + Math.random()*3}s linear forwards`;
  balloon.dataset.word = noun.word;
  balloon.dataset.type = noun.type;
  balloon.innerText = noun.word; // CSS-only label

  balloon.addEventListener('click', () => checkBalloon(balloon));

  gameArea.appendChild(balloon);

  balloon.addEventListener('animationend', () => {
    if(gameArea.contains(balloon)) gameArea.removeChild(balloon);
  });
}

// Check Balloon
function checkBalloon(balloon) {
  const word = balloon.dataset.word;
  const type = balloon.dataset.type;

  attempts[word] = attempts[word] ? attempts[word] + 1 : 1;

  if(type === "Countable") {
    document.getElementById('result').innerText = "Correct!";
    document.getElementById('correct-sound').play();
    score++;
    balloon.remove();
  } else {
    document.getElementById('result').innerText = attempts[word] >= 2 
      ? `Wrong! '${word}' is Uncountable.` 
      : "Try again!";
    document.getElementById('wrong-sound').play();
    if(attempts[word] >= 2) balloon.remove();
  }
  document.getElementById('score').innerText = "Score: " + score;
}

// Start Game
startBtn.addEventListener('click', () => {
  instructionsScreen.style.display = 'none';
  gameArea.style.display = 'block';
  balloonInterval = setInterval(() => {
    const noun = nouns[Math.floor(Math.random() * nouns.length)];
    spawnBalloon(noun);
  }, 1500);
});
</script>
</body>
</html>
