<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🚀 Verb Rocket Space Mission</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Arial', sans-serif;
}

body {
  background: linear-gradient(180deg, #0f0c29, #302b63, #24243e);
  min-height: 100vh;
  overflow: hidden;
  position: relative;
}

#splash {
  position: fixed;
  inset: 0;
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 1s ease;
}

#splash img {
  max-width: 320px;
  width: 80%;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
}

#stars {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  animation: moveStar 3s linear infinite;
}

@keyframes moveStar {
  from { transform: translateY(-100px); }
  to { transform: translateY(100vh); }
}

#intro {
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, #0f0c29, #302b63);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 5000;
  flex-direction: column;
  text-align: center;
  color: white;
  padding: 20px;
}

#intro h1 {
  font-size: 42px;
  margin-bottom: 15px;
  color: #00d4ff;
  text-shadow: 0 0 20px #00d4ff;
}

#intro p {
  font-size: 20px;
  max-width: 700px;
  margin-bottom: 10px;
  line-height: 1.5;
}

.startBtn {
  padding: 16px 40px;
  font-size: 22px;
  background: linear-gradient(135deg, #00d4ff, #0099ff);
  color: white;
  border: none;
  border-radius: 15px;
  cursor: pointer;
  margin-top: 20px;
  font-weight: bold;
  box-shadow: 0 4px 20px rgba(0, 212, 255, 0.5);
  transition: 0.3s;
}

.startBtn:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 30px rgba(0, 212, 255, 0.7);
}

#gameArea {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  z-index: 1;
}

#rocket {
  position: absolute;
  bottom: 150px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 100px;
  filter: drop-shadow(0 0 30px #00d4ff);
  transition: left 0.1s ease, transform 0.2s;
  z-index: 100;
}

#rocket.boost {
  filter: drop-shadow(0 0 50px #00ff88);
  transform: translateX(-50%) scale(1.1);
}

#rocket.crash {
  filter: drop-shadow(0 0 50px #ff4444);
  animation: crashAnim 0.5s;
}

@keyframes crashAnim {
  0%, 100% { transform: translateX(-50%) rotate(0deg); }
  25% { transform: translateX(-50%) rotate(-20deg); }
  75% { transform: translateX(-50%) rotate(20deg); }
}

.obstacle {
  position: absolute;
  font-size: 50px;
  animation: fall 4s linear infinite;
  z-index: 50;
}

@keyframes fall {
  from { transform: translateY(-100px); }
  to { transform: translateY(100vh); }
}

#questionModal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  padding: 20px;
}

.questionBox {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border-radius: 25px;
  padding: 30px;
  max-width: 750px;
  width: 95%;
  box-shadow: 0 0 50px rgba(0, 212, 255, 0.5);
  border: 2px solid #00d4ff;
}

.questionBox h2 {
  color: #00d4ff;
  font-size: 24px;
  margin-bottom: 15px;
  text-align: center;
}

.questionText {
  font-size: 18px;
  color: #fff;
  line-height: 1.7;
  margin-bottom: 20px;
  background: rgba(0, 212, 255, 0.1);
  padding: 15px;
  border-radius: 12px;
  border-left: 4px solid #00d4ff;
}

.underline {
  text-decoration: underline;
  color: #00ff88;
  font-weight: bold;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.optionBtn {
  padding: 14px 18px;
  font-size: 16px;
  background: linear-gradient(135deg, #0099ff, #0066cc);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
}

.optionBtn:hover {
  transform: scale(1.05);
  background: linear-gradient(135deg, #0066cc, #004499);
}

.optionBtn.correct {
  background: linear-gradient(135deg, #00ff88, #00cc66);
  animation: correctPulse 0.5s;
}

.optionBtn.wrong {
  background: linear-gradient(135deg, #ff4444, #cc0000);
  animation: wrongShake 0.5s;
}

@keyframes correctPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-10px); }
  75% { transform: translateX(10px); }
}

.feedback {
  margin-top: 15px;
  padding: 12px;
  border-radius: 12px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
}

.feedback.good {
  background: rgba(0, 255, 136, 0.2);
  color: #00ff88;
}

.feedback.bad {
  background: rgba(255, 68, 68, 0.2);
  color: #ff4444;
}

#scoreBoard {
  position: fixed;
  top: 15px;
  left: 15px;
  background: rgba(0, 212, 255, 0.2);
  padding: 12px 18px;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  z-index: 200;
  border: 2px solid #00d4ff;
}

#progressBar {
  position: fixed;
  top: 15px;
  right: 15px;
  width: 200px;
  height: 20px;
  background: rgba(0, 0, 0, 0.5);
  border-radius: 10px;
  z-index: 200;
  border: 2px solid #00d4ff;
}

#progressFill {
  height: 100%;
  background: linear-gradient(90deg, #00d4ff, #00ff88);
  width: 0%;
  transition: width 0.5s ease;
  border-radius: 10px;
}

#speedMeter {
  position: fixed;
  bottom: 15px;
  left: 15px;
  background: rgba(0, 212, 255, 0.2);
  padding: 10px 15px;
  border-radius: 12px;
  color: white;
  font-size: 14px;
  font-weight: bold;
  z-index: 200;
  border: 2px solid #00d4ff;
}

#levelCounter {
  position: fixed;
  bottom: 15px;
  right: 15px;
  background: rgba(0, 212, 255, 0.2);
  padding: 10px 15px;
  border-radius: 12px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  z-index: 200;
  border: 2px solid #00d4ff;
}

#result {
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, #0f0c29, #302b63);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 5000;
  flex-direction: column;
  text-align: center;
  color: white;
  padding: 20px;
}

#result h1 {
  font-size: 48px;
  margin-bottom: 15px;
  color: #00ff88;
  text-shadow: 0 0 30px #00ff88;
}

#result h2 {
  font-size: 36px;
  color: #00d4ff;
  margin-bottom: 10px;
}

#result h3 {
  font-size: 52px;
  color: #ffd700;
  margin: 20px 0;
  text-shadow: 0 0 40px #ffd700;
}
