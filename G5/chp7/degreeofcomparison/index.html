<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Degree Dash - Adjectives</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:linear-gradient(to bottom,#0d1b2a,#1b263b,#415a77);overflow:hidden;}
#gameArea{position:relative;width:100vw;height:100vh;}
#logoScreen{position:absolute;width:100%;height:100%;background:white;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:9999;}
#logoScreen img{width:260px;max-width:80%;}
#logoText{margin-top:20px;font-size:32px;font-weight:bold;color:#333;}
#instructions{position:absolute;top:15px;width:100%;text-align:center;font-size:22px;color:white;z-index:500;}
#wordDisplay{position:absolute;top:60px;width:100%;text-align:center;font-size:40px;color:#ffeb3b;z-index:500;}
.buttons{position:absolute;bottom:80px;width:100%;display:flex;justify-content:space-around;z-index:500;}
.button{padding:16px 34px;font-size:22px;border:none;border-radius:18px;background:#ff9800;color:white;cursor:pointer;transition:0.3s;}
.button:hover{transform:scale(1.05);background:#f57c00;}
#scoreBoard{position:absolute;top:15px;left:15px;background:white;padding:12px 18px;border-radius:15px;font-size:20px;font-weight:bold;z-index:500;}
#feedback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:bold;color:white;text-shadow:2px 2px 5px black;display:none;z-index:3000;}
#endScreen{position:absolute;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;color:white;z-index:5000;display:none;}
.confetti{position:absolute;width:12px;height:12px;animation:fall 3s linear forwards;}
@keyframes fall{from{transform:translateY(-100px) rotate(0deg);}to{transform:translateY(100vh) rotate(720deg);opacity:0;}}
@media(max-width:768px){#wordDisplay{font-size:28px;} .button{font-size:18px;padding:12px 20px;}}
</style>
</head>
<body>
<div id="gameArea">

<!-- Logo -->
<div id="logoScreen">
<img src="assets/logo.png" alt="Innovine Logo">
<div id="logoText">Innovine Learning Adventures</div>
</div>

<!-- Instructions -->
<div id="instructions">Read the word and click the correct degree: Positive, Comparative, or Superlative</div>

<!-- Word Display -->
<div id="wordDisplay"></div>

<!-- Buttons -->
<div class="buttons">
<button class="button" id="positiveBtn">Positive</button>
<button class="button" id="comparativeBtn">Comparative</button>
<button class="button" id="superlativeBtn">Superlative</button>
</div>

<!-- Score -->
<div id="scoreBoard">Score: <span id="score">0</span>/15</div>

<!-- Feedback -->
<div id="feedback"></div>

<!-- End Screen -->
<div id="endScreen">
<h1>🏆 Game Complete! 🏆</h1>
<h2 id="finalText" style="margin-top:20px;"></h2>
<button class="button" onclick="restartGame()">Play Again</button>
</div>

</div>

<script>
// Audio
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/freesound_community-claps-44774.mp3");

// Challenging Words
let words = [
{word:"swift", answer:"Positive"}, {word:"swifter", answer:"Comparative"}, {word:"swiftest", answer:"Superlative"},
{word:"magnificent", answer:"Positive"}, {word:"more magnificent", answer:"Comparative"}, {word:"most magnificent", answer:"Superlative"},
{word:"agile", answer:"Positive"}, {word:"more agile", answer:"Comparative"}, {word:"most agile", answer:"Superlative"},
{word:"clever", answer:"Positive"}, {word:"cleverer", answer:"Comparative"}, {word:"cleverest", answer:"Superlative"},
{word:"luminous", answer:"Positive"}, {word:"more luminous", answer:"Comparative"}, {word:"most luminous", answer:"Superlative"},
{word:"splendid", answer:"Positive"}, {word:"more splendid", answer:"Comparative"}, {word:"most splendid", answer:"Superlative"},
{word:"majestic", answer:"Positive"}, {word:"more majestic", answer:"Comparative"}, {word:"most majestic", answer:"Superlative"},
{word:"brilliant", answer:"Positive"}, {word:"more brilliant", answer:"Comparative"}, {word:"most brilliant", answer:"Superlative"}
];

let score = 0;
let usedWords = [];
let currentWord;

// Elements
const wordDisplay = document.getElementById("wordDisplay");
const feedback = document.getElementById("feedback");
const scoreBoard = document.getElementById("score");
const endScreen = document.getElementById("endScreen");
const finalText = document.getElementById("finalText");

// Buttons
document.getElementById("positiveBtn").addEventListener("click",()=>checkAnswer("Positive"));
document.getElementById("comparativeBtn").addEventListener("click",()=>checkAnswer("Comparative"));
document.getElementById("superlativeBtn").addEventListener("click",()=>checkAnswer("Superlative"));

function nextWord(){
    if(usedWords.length >= 15){ endGame(); return; }
    let remaining = words.filter(w=>!usedWords.includes(w));
    currentWord = remaining[Math.floor(Math.random()*remaining.length)];
    usedWords.push(currentWord);
    wordDisplay.textContent = currentWord.word;
}

function checkAnswer(choice){
    if(choice === currentWord.answer){
        score++;
        try{ correctSound.play(); clapSound.play(); }catch(e){}
        createConfetti();
        showFeedback("🎉 Correct!");
    }else{
        try{ wrongSound.play(); }catch(e){}
        showFeedback("❌ Wrong!");
    }
    scoreBoard.textContent = score;
    setTimeout(nextWord,500);
}

function showFeedback(text){
    feedback.textContent = text;
    feedback.style.display="block";
    setTimeout(()=>{feedback.style.display="none";},1000);
}

function createConfetti(){
    for(let i=0;i<20;i++){
        const conf = document.createElement("div");
        conf.classList.add("confetti");
        conf.style.left=Math.random()*100+"%";
        conf.style.background=`hsl(${Math.random()*360},100%,50%)`;
        conf.style.animationDuration=(2+Math.random()*2)+"s";
        document.body.appendChild(conf);
        setTimeout(()=>{conf.remove();},4000);
    }
}

function endGame(){
    endScreen.style.display="flex";
    finalText.innerHTML = `You scored <b>${score}</b> out of 15!`;
}

function restartGame(){ location.reload(); }

// Start game automatically after 5 seconds
setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    nextWord();
},5000);
</script>
</body>
</html>
