<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Idioms Pictionary - Teacher Scoring</title>

<style>
body {
  margin: 0;
  font-family: 'Courier New', monospace;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  background: radial-gradient(circle at top left, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
  background-size: 400% 400%;
  animation: glowBG 10s ease infinite;
  overflow: hidden;
}

@keyframes glowBG {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* SPLASH */
#splash {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* INSTRUCTIONS */
#instructions {
  position: fixed;
  inset: 0;
  background: white;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9998;
}

/* GAME */
#game {
  display: none;
  width: 750px;
  text-align: center;
}

.blackboard {
  height: 300px;
  background: rgba(0,0,0,0.7);
  border-radius: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
}

#idiom {
  color: white;
  font-size: 2.3rem;
}

/* TIMER + SCORE */
#timer, #score {
  color: white;
  font-size: 1.2rem;
  margin: 5px;
}

/* TEACHER PANEL */
#teacherPanel {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: rgba(255,255,255,0.95);
  padding: 15px;
  text-align: center;
  box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
}

#teacherPanel input {
  width: 80px;
  padding: 8px;
  font-size: 16px;
  text-align: center;
}

button {
  padding: 10px 15px;
  margin-left: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #ff4081;
  color: white;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="assets/logo.png" width="200">
</div>

<!-- INSTRUCTIONS -->
<div id="instructions">
  <img src="assets/logo.png" width="150">
  <h2>Idioms Pictionary</h2>
  <p>Draw the idiom and teacher will score it!</p>
  <button onclick="startGame()">Start Game</button>
</div>

<!-- GAME -->
<div id="game">
  <div id="score">Idioms: 0 / 7</div>
  <div id="timer">Time Left: 60s</div>

  <div class="blackboard">
    <div id="idiom"></div>
  </div>
</div>

<!-- TEACHER PANEL -->
<div id="teacherPanel">
  Score ( /10 ):
  <input type="number" id="scoreInput" min="0" max="10">
  <button onclick="nextIdiom()">Next</button>
</div>

<!-- AUDIO -->
<audio id="clap" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

const idioms = [
"Break the ice",
"Hit the hay",
"Spill the beans",
"Piece of cake",
"Let the cat out of the bag",
"Bite the bullet",
"Under the weather"
];

let current = 0;
let timer = 60;
let interval;
let gameStarted = false;
let totalScores = [];

const idiomEl = document.getElementById("idiom");
const timerEl = document.getElementById("timer");
const scoreEl = document.getElementById("score");
const teacherPanel = document.getElementById("teacherPanel");
const clap = document.getElementById("clap");

/* FIXED START (NO SPLASH REPEAT EVER) */
function startGame(){

  if(gameStarted) return;
  gameStarted = true;

  document.getElementById("splash").style.display = "none";
  document.getElementById("instructions").style.display = "none";
  document.getElementById("game").style.display = "block";

  current = 0;
  showIdiom();
  startTimer();
}

/* SHOW IDIOM */
function showIdiom(){
  idiomEl.textContent = idioms[current];
}

/* TIMER RESET EVERY ROUND */
function startTimer(){
  clearInterval(interval);
  timer = 60;

  interval = setInterval(()=>{
    timer--;
    timerEl.textContent = `Time Left: ${timer}s`;

    if(timer <= 0){
      openTeacherPanel();
    }
  },1000);
}

/* TEACHER PANEL */
function openTeacherPanel(){
  clearInterval(interval);
  document.getElementById("scoreInput").value = "";
  teacherPanel.style.display = "block";
}

/* NEXT IDIOM AFTER TEACHER SCORE */
function nextIdiom(){

  let score = Number(document.getElementById("scoreInput").value || 0);
  totalScores.push(score);

  teacherPanel.style.display = "none";

  current++;

  scoreEl.textContent = `Idioms: ${current} / ${idioms.length}`;

  if(current >= idioms.length){
    clap.play();
    idiomEl.textContent = "Game Completed 🎉";
    timerEl.textContent = "";

    console.log("Total Scores:", totalScores);
    return;
  }

  showIdiom();
  startTimer();
}

/* SPLASH FLOW (SAFE ONCE ONLY) */
window.onload = () => {
  setTimeout(() => {
    document.getElementById("splash").style.display = "none";
    document.getElementById("instructions").style.display = "flex";
  }, 5000);
};

</script>

</body>
</html>
