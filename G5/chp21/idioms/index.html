<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idioms Pictionary</title>

<style>
body {
  margin: 0;
  font-family: 'Courier New', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;

  /* Glow background */
  background: radial-gradient(circle at top left, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
  background-size: 400% 400%;
  animation: glowBG 10s ease infinite;
  overflow: hidden;
}

@keyframes glowBG {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* Splash */
#splash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9999;
}

/* Instructions */
#instructions {
  position: fixed;
  width: 100%;
  height: 100%;
  background: white;
  display: none;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  z-index: 9998;
}

/* Game */
#game {
  display: none;
  width: 700px;
  max-width: 90%;
  text-align: center;
}

.blackboard {
  width: 100%;
  height: 300px;
  background: rgba(0,0,0,0.7);
  border-radius: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.chalk-text {
  color: white;
  font-size: 2.5rem;
  text-shadow: 0 0 10px #fff;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #ff4081;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="assets/logo.png" width="200">
</div>

<!-- INSTRUCTIONS -->
<div id="instructions">
  <img src="assets/logo.png" width="160">
  <h1>Idioms Pictionary</h1>
  <p>Draw the idioms in your notebook!</p>
  <button onclick="startGame()">Start Game</button>
</div>

<!-- GAME -->
<div id="game">
  <h2 id="score">Idioms Completed: 0 / 7</h2>
  <h3 id="timer">Time Left: 60s</h3>

  <div class="blackboard">
    <div id="idiom" class="chalk-text"></div>
  </div>
</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="applause" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

const idioms = [
  "Break the ice",
  "Hit the hay",
  "Spill the beans",
  "Piece of cake",
  "Let the cat out of the bag",
  "Bite the bullet",
  "Under the weather"
];

let current = 0;
let timer = 60;
let interval;
let gameStarted = false;

const idiomEl = document.getElementById("idiom");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");

const correctSound = document.getElementById("correctSound");
const applause = document.getElementById("applause");

/* SAFE START (ONLY ONE ENTRY POINT) */
function startGame(){

  if(gameStarted) return;   // 🔒 prevents re-trigger bug
  gameStarted = true;

  document.getElementById("splash").style.display = "none";
  document.getElementById("instructions").style.display = "none";
  document.getElementById("game").style.display = "block";

  current = 0;
  showIdiom();
  startTimer();
}

/* SHOW IDIOM */
function showIdiom(){
  idiomEl.textContent = idioms[current];
}

/* TIMER */
function startTimer(){
  clearInterval(interval);
  timer = 60;

  interval = setInterval(()=>{
    timer--;
    timerEl.textContent = `Time Left: ${timer}s`;

    if(timer <= 0){
      nextIdiom();
    }
  },1000);
}

/* NEXT */
function nextIdiom(){
  correctSound.play();
  current++;

  scoreEl.textContent = `Idioms Completed: ${current} / ${idioms.length}`;

  if(current >= idioms.length){
    clearInterval(interval);
    applause.play();
    idiomEl.textContent = "Game Completed! Great Job!";
    timerEl.textContent = "";
    return;
  }

  showIdiom();
  startTimer();
}

</script>

</body>
</html>
