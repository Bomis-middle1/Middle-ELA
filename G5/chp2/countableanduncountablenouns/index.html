<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Balloon Bomb Defusers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.95), rgba(255,255,255,0.2) 22%, transparent 40%),
        radial-gradient(circle at 80% 10%, rgba(255, 240, 180, 0.95), rgba(255, 240, 180, 0.18) 18%, transparent 38%),
        radial-gradient(circle at 50% 80%, rgba(180, 240, 255, 0.9), rgba(180, 240, 255, 0.18) 20%, transparent 40%),
        linear-gradient(135deg, #fff7d6 0%, #dff6ff 45%, #ffe0f0 100%);
      color: #17324d;
    }

    .splash {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #fffef7, #eefbff);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity .5s ease;
    }
    .splash.hidden { opacity: 0; pointer-events: none; }
    .splash img {
      width: min(480px, 88vw);
      max-height: 80vh;
      object-fit: contain;
      filter: drop-shadow(0 12px 30px rgba(0,0,0,.15));
      animation: floaty 2.5s ease-in-out infinite;
    }

    @keyframes floaty {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-16px); }
    }

    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      opacity: 0;
      transition: opacity .5s ease;
    }
    .app.visible { opacity: 1; }

    .topbar {
      position: relative;
      z-index: 5;
      padding: 16px 16px 12px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.35));
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,.6);
      box-shadow: 0 8px 30px rgba(255, 206, 125, .18);
    }
    .topbar h1 {
      font-size: clamp(24px, 3vw, 40px);
      color: #ff5f8d;
      text-shadow: 0 2px 0 rgba(255,255,255,.8);
      letter-spacing: .5px;
    }
    .subtitle {
      margin-top: 6px;
      font-size: 15px;
      color: #4b6b86;
      font-weight: 700;
    }

    .hud {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .pill {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.8);
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 6px 16px rgba(0,0,0,.08);
      font-weight: 700;
      color: #35506b;
      min-width: 120px;
    }

    .game {
      position: relative;
      width: 100%;
      height: calc(100vh - 118px);
      overflow: hidden;
    }

    .mission {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      width: min(860px, 92vw);
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(255,255,255,.95);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 0 10px 28px rgba(0,0,0,.08);
    }
    .mission .label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ff6d8f;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .mission .text {
      font-size: clamp(15px, 1.7vw, 20px);
      line-height: 1.45;
      color: #24415b;
      font-weight: 700;
    }

    .balloons {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .balloon {
      position: absolute;
      width: clamp(140px, 18vw, 220px);
      min-height: 92px;
      padding: 18px 16px 18px;
      border-radius: 50% 50% 48% 48%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #1d1d1d;
      font-weight: 700;
      line-height: 1.35;
      cursor: pointer;
      user-select: none;
      box-shadow:
        inset 0 -16px 22px rgba(0,0,0,.12),
        0 14px 28px rgba(0,0,0,.14);
      border: 3px solid rgba(255,255,255,.88);
      transition: transform .18s ease, filter .18s ease, opacity .2s ease;
      animation: drift 5s ease-in-out infinite;
    }
    .balloon::before {
      content: "";
      position: absolute;
      width: 12px;
      height: 22px;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      background: #e3d8b7;
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      opacity: .8;
    }
    .balloon::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 80px;
      bottom: -96px;
      left: 50%;
      background: rgba(100,100,100,.35);
      transform: translateX(-50%);
    }

    .balloon:hover {
      transform: scale(1.05);
      filter: brightness(1.03);
    }

    @keyframes drift {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    .balloon.correct {
      outline: 4px solid rgba(64, 193, 104, 0.55);
      box-shadow:
        inset 0 -16px 22px rgba(0,0,0,.12),
        0 0 0 6px rgba(66, 220, 120, .18),
        0 14px 28px rgba(0,0,0,.14);
    }
    .balloon.wrong {
      outline: 4px solid rgba(255, 91, 91, 0.45);
    }

    .balloon.pop {
      animation: pop .18s ease forwards;
    }
    @keyframes pop {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.2); opacity: 0; }
    }

    .feedback {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      z-index: 5;
      width: min(880px, 92vw);
      text-align: center;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      background: rgba(255,255,255,.84);
      color: #24415b;
      border: 1px solid rgba(255,255,255,.95);
      box-shadow: 0 10px 28px rgba(0,0,0,.1);
      display: none;
    }

    .next-btn {
      position: absolute;
      right: 18px;
      bottom: 18px;
      z-index: 5;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #ff86aa, #ffb36b);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(255, 130, 150, .32);
      cursor: pointer;
      display: none;
    }

    .end-screen {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(255,255,255,.62);
      backdrop-filter: blur(10px);
    }
    .end-card {
      width: min(680px, 90vw);
      background: rgba(255,255,255,.92);
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 18px 40px rgba(0,0,0,.12);
      border: 1px solid rgba(255,255,255,.95);
    }
    .end-card h2 {
      font-size: clamp(24px, 3vw, 38px);
      color: #ff5f8d;
      margin-bottom: 10px;
    }
    .end-card p {
      font-size: 18px;
      color: #35506b;
      margin: 6px 0;
      font-weight: 700;
    }
    .restart {
      margin-top: 16px;
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      background: linear-gradient(135deg, #5fc7ff, #7fe6c5);
      color: #14415d;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(90, 180, 220, .28);
    }

    .sparkle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      pointer-events: none;
      animation: spark 650ms ease-out forwards;
      z-index: 15;
    }
    @keyframes spark {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    @media (max-width: 700px) {
      .game { height: calc(100vh - 135px); }
      .mission { top: 10px; }
      .balloon { width: 150px; min-height: 84px; padding: 14px 12px; font-size: 13px; }
      .next-btn { right: 12px; bottom: 12px; }
      .feedback { bottom: 70px; }
    }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <img src="Middle-ELA/G5/chp2/countableanduncountablenouns/assets/logo.png" alt="Logo" onerror="this.style.display='none'">
  </div>

  <div class="app" id="app">
    <div class="topbar">
      <h1>🎈 Balloon Bomb Defusers</h1>
      <div class="subtitle">Grade 5 Countable and Uncountable Nouns</div>
      <div class="hud">
        <div class="pill" id="scorePill">Score: 0</div>
        <div class="pill" id="stepPill">Question 1 / 12</div>
        <div class="pill" id="timerPill">Mission: Active</div>
      </div>
    </div>

    <div class="game" id="game">
      <div class="mission">
        <div class="label">Defuse Mission</div>
        <div class="text" id="missionText"></div>
      </div>

      <div class="balloons" id="balloons"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">Next Balloon →</button>

      <div class="end-screen" id="endScreen">
        <div class="end-card">
          <h2 id="finalTitle">Mission Complete</h2>
          <p id="finalScore"></p>
          <p id="finalMsg"></p>
          <button class="restart" id="restartBtn">Play Again</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="correctAudio" src="Middle-ELA/G5/chp2/countableanduncountablenouns/assets/correct.mp3"></audio>
  <audio id="wrongAudio" src="Middle-ELA/G5/chp2/countableanduncountablenouns/assets/wrong.mp3"></audio>
  <audio id="clapAudio" src="Middle-ELA/G5/chp2/countableanduncountablenouns/assets/freesound_community-claps-44774.mp3"></audio>

  <script>
    const questions = [
      {
        prompt: "Choose the correct sentence:",
        options: [
          "There is many information about projects explained to visitors",
          "There are much information about projects explained to visitors",
          "There is much information about projects explained to visitors",
          "There are many informations about project explained to visitor"
        ],
        correct: 2,
        explain: "Information is uncountable, so we use much."
      },
      {
        prompt: "Choose the correct sentence:",
        options: [
          "She bought many apples and bananas from the supermarket",
          "She bought much apples and bananas from supermarket",
          "She bought many apple and banana from supermarket",
          "She bought much apple and bananas from supermarket"
        ],
        correct: 0,
        explain: "Apples and bananas are countable, so we use many."
      },
      {
        prompt: "Choose the correct sentence:",
        options: [
          "There is many food served in cafeteria during lunch break",
          "There are much food served in cafeteria during lunch break",
          "There is much food served in the cafeteria during lunch break",
          "There are many foods served in cafeteria during lunch break"
        ],
        correct: 2,
        explain: "Food is usually uncountable here, so we use much."
      },
      {
        prompt: "Choose the correct sentence:",
        options: [
          "There are many water entering classroom during rain",
          "There is much water entering classroom during rain",
          "There is many water entering classroom during rains",
          "There are much waters entering classroom during rain"
        ],
        correct: 1,
        explain: "Water is uncountable, so we use much."
      },
      {
        prompt: "Choose the correct sentence:",
        options: [
          "There are many books arranged neatly on shelves",
          "There is many books arranged neatly on shelves",
          "There are much book arranged neatly on shelves",
          "There is much books arranged neatly on shelves"
        ],
        correct: 0,
        explain: "Books are countable and plural, so we use many."
      },
      {
        prompt: "Choose the correct sentence:",
        options: [
          "There are many equipment used during sports practice",
          "There is much equipment used during sports practice",
          "There are much equipments used during sports practice",
          "There is many equipments used during sports practice"
        ],
        correct: 1,
        explain: "Equipment is uncountable, so we use much."
      },
      {
        prompt: "Choose the correct sentence:",
        options: [
          "There is many juice served at picnic",
          "There are much juice served at picnic",
          "There is much juice served at the picnic",
          "There are many juices served at picnic"
        ],
        correct: 2,
        explain: "Juice is uncountable here, so we use much."
      },
      {
        prompt: "Choose the correct sentence:",
        options: [
          "There are many animals seen in zoo habitats",
          "There is many animal seen in zoo habitats",
          "There are much animals seen in zoo habitats",
          "There is much animal seen in zoo habitats"
        ],
        correct: 0,
        explain: "Animals are countable and plural, so we use many."
      },
      {
        prompt: "Choose the correct sentence:",
        options: [
          "There is many paint used in art class",
          "There are much paint used in art class",
          "There is much paint used in art class",
          "There are many paints used in art class"
        ],
        correct: 2,
        explain: "Paint is uncountable in this context, so we use much."
      },
      {
        prompt: "Choose the correct sentence:",
        options: [
          "There are many food stalls at village fair",
          "There is many food stalls at village fair",
          "There are much food stalls at village fair",
          "There is much food stalls at village fair"
        ],
        correct: 0,
        explain: "Food stalls are countable and plural, so we use many."
      },
      {
        prompt: "Choose the correct sentence:",
        options: [
          "There is many stationery used by students",
          "There are much stationery used by students",
          "There is much stationery used by students",
          "There are many stationeries used by students"
        ],
        correct: 2,
        explain: "Stationery is uncountable, so we use much."
      },
      {
        prompt: "Choose the correct sentence:",
        options: [
          "There are many information shared in assembly",
          "There is much information shared in assembly",
          "There are much information shared in assembly",
          "There is many informations shared in assembly"
        ],
        correct: 1,
        explain: "Information is uncountable, so we use much."
      }
    ];

    const game = document.getElementById("game");
    const balloonsEl = document.getElementById("balloons");
    const missionText = document.getElementById("missionText");
    const feedback = document.getElementById("feedback");
    const nextBtn = document.getElementById("nextBtn");
    const endScreen = document.getElementById("endScreen");
    const scorePill = document.getElementById("scorePill");
    const stepPill = document.getElementById("stepPill");
    const correctAudio = document.getElementById("correctAudio");
    const wrongAudio = document.getElementById("wrongAudio");
    const clapAudio = document.getElementById("clapAudio");

    let index = 0;
    let score = 0;
    let locked = false;

    function play(a) {
      try { a.currentTime = 0; a.play(); } catch(e) {}
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createSparkles(x, y, count = 12) {
      for (let i = 0; i < count; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        s.style.left = x + "px";
        s.style.top = y + "px";
        s.style.setProperty("--dx", `${rand(-80, 80)}px`);
        s.style.setProperty("--dy", `${rand(-100, 40)}px`);
        s.style.background = ["#fff","#ffe08a","#c9f7ff","#ffd0e8"][Math.floor(Math.random()*4)];
        game.appendChild(s);
        setTimeout(() => s.remove(), 700);
      }
    }

    function renderQuestion() {
      locked = false;
      balloonsEl.innerHTML = "";
      feedback.style.display = "none";
      nextBtn.style.display = "none";
      endScreen.style.display = "none";

      const q = questions[index];
      missionText.textContent = q.prompt;
      stepPill.textContent = `Question ${index + 1} / ${questions.length}`;
      scorePill.textContent = `Score: ${score}`;

      const colors = ["#ff8acb", "#7ed7ff", "#ffcf6b", "#a3f7bf"];
      const positions = [
        { left: "12%", top: "30%" },
        { left: "35%", top: "18%" },
        { left: "58%", top: "34%" },
        { left: "76%", top: "20%" }
      ];

      q.options.forEach((text, i) => {
        const b = document.createElement("div");
        b.className = "balloon";
        b.textContent = text;
        b.style.background = `radial-gradient(circle at 30% 20%, rgba(255,255,255,.65), transparent 22%), linear-gradient(180deg, ${colors[i]}, ${colors[(i+1)%colors.length]})`;
        b.style.left = positions[i].left;
        b.style.top = positions[i].top;
        b.style.animationDelay = `${i * 0.2}s`;
        b.addEventListener("click", (e) => chooseAnswer(i, b, e));
        balloonsEl.appendChild(b);
      });
    }

    function chooseAnswer(i, balloon, e) {
      if (locked) return;
      locked = true;

      const q = questions[index];
      const all = [...balloonsEl.children];

      if (i === q.correct) {
        balloon.classList.add("correct", "pop");
        score++;
        scorePill.textContent = `Score: ${score}`;
        feedback.style.display = "block";
        feedback.textContent = `✅ Correct! ${q.explain}`;
        play(correctAudio);
        play(clapAudio);
        createSparkles(e.clientX, e.clientY, 14);
      } else {
        balloon.classList.add("wrong");
        feedback.style.display = "block";
        feedback.textContent = `❌ Not quite. ${q.explain}`;
        play(wrongAudio);
        all[q.correct].classList.add("correct");
      }

      all.forEach((el, idx) => {
        el.style.pointerEvents = "none";
        if (idx !== i && idx !== q.correct) el.style.opacity = ".88";
      });

      nextBtn.style.display = "inline-block";
      nextBtn.textContent = index < questions.length - 1 ? "Next Balloon →" : "See Result →";
    }

    nextBtn.addEventListener("click", () => {
      if (index < questions.length - 1) {
        index++;
        renderQuestion();
      } else {
        showResult();
      }
    });

    function showResult() {
      balloonsEl.innerHTML = "";
      missionText.textContent = "Mission completed!";
      feedback.style.display = "none";
      nextBtn.style.display = "none";
      endScreen.style.display = "flex";

      const percent = Math.round((score / questions.length) * 100);
      document.getElementById("finalScore").textContent = `You scored ${score} out of ${questions.length} (${percent}%).`;
      document.getElementById("finalMsg").textContent =
        percent >= 90 ? "Amazing! You defused almost every grammar bomb."
        : percent >= 70 ? "Great work! You have strong grammar skills."
        : percent >= 50 ? "Nice! A little more practice will make you even stronger."
        : "Keep going! You can beat the bombs next time.";

      document.getElementById("finalTitle").textContent =
        percent >= 90 ? "Mission Accomplished!"
        : percent >= 70 ? "Mission Successful!"
        : "Mission Complete!";
    }

    document.getElementById("restartBtn").addEventListener("click", () => location.reload());

    setTimeout(() => {
      document.getElementById("splash").classList.add("hidden");
      document.getElementById("app").classList.add("visible");
      renderQuestion();
    }, 2500);
  </script>
</body>
</html>
