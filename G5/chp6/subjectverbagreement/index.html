<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subject-Verb Agreement Quest</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #243b55 0%, #141e30 45%, #000 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      color: #fff;
    }
    .splash-screen {
      position: fixed; inset: 0;
      background: #fff;
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; transition: opacity 0.5s ease-out;
    }
    .splash-screen.hidden { opacity: 0; pointer-events: none; }
    .splash-screen img {
      max-width: 480px; width: 90%; height: auto;
      animation: logoFloat 2s ease-in-out infinite;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-18px); }
    }

    .container {
      max-width: 1100px; width: 100%;
      background: #0b1020;
      border-radius: 20px;
      border: 3px solid #ffd700;
      box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
      overflow: hidden;
      opacity: 0; transition: opacity 0.6s ease-in;
    }
    .container.visible { opacity: 1; }

    .header {
      position: relative;
      padding: 25px 20px 30px;
      text-align: center;
      background: linear-gradient(135deg, #ffd700 0%, #ff9f1c 100%);
      color: #1a1a2e;
      box-shadow: 0 5px 20px rgba(255, 215, 0, 0.5);
    }
    .header::before {
      content: '';
      position: absolute; inset: -60%;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 12px,
        rgba(255, 255, 255, 0.15) 12px,
        rgba(255, 255, 255, 0.15) 24px
      );
      opacity: 0.5;
      animation: shimmer 18s linear infinite;
    }
    @keyframes shimmer {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }
    .header-content { position: relative; z-index: 1; }
    .header h1 {
      font-size: 32px;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      margin-bottom: 6px;
    }
    .subtitle { font-size: 16px; font-weight: bold; }
    .stage-indicator {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 20px;
      border-radius: 20px;
      background: rgba(26, 26, 46, 0.9);
      border: 2px solid #ffd700;
      color: #ffd700;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.7);
    }

    .board-wrapper {
      display: flex;
      flex-wrap: wrap;
      padding: 20px;
      gap: 20px;
      background: radial-gradient(circle at top, #1f2937 0%, #020617 60%);
    }

    .board-area {
      flex: 1.2;
      min-width: 320px;
      background: radial-gradient(circle at center, #1e293b 0%, #020617 70%);
      border-radius: 18px;
      border: 2px solid rgba(148, 163, 184, 0.6);
      padding: 20px 18px 16px;
      position: relative;
      overflow: hidden;
    }
    .board-title {
      text-align: center;
      font-size: 18px;
      margin-bottom: 8px;
      color: #e5e7eb;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .board-path {
      position: relative;
      margin-top: 10px;
      padding: 18px 10px 10px;
    }
    .path-line {
      position: absolute;
      inset: 40px 22px 30px;
      border-radius: 30px;
      border: 3px dashed rgba(251, 191, 36, 0.7);
      opacity: 0.7;
    }

    .cells {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: 60px;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    .cell {
      position: relative;
      border-radius: 14px;
      border: 2px solid rgba(148, 163, 184, 0.9);
      background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.4), rgba(15, 23, 42, 0.9));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      text-align: center;
      padding: 4px;
      color: #e5e7eb;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.9);
    }
    .cell.start {
      background: radial-gradient(circle at top, rgba(34, 197, 94, 0.6), rgba(15, 23, 42, 0.9));
      border-color: #22c55e;
      font-weight: bold;
    }
    .cell.finish {
      background: radial-gradient(circle at top, rgba(251, 191, 36, 0.8), rgba(15, 23, 42, 0.95));
      border-color: #facc15;
      font-weight: bold;
    }
    .cell span.step-number {
      position: absolute;
      top: 4px; left: 6px;
      font-size: 11px;
      opacity: 0.8;
    }

    .token {
      position: absolute;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at top, #f97316 0%, #b91c1c 70%);
      border: 2px solid #fed7aa;
      box-shadow: 0 0 14px rgba(248, 250, 252, 0.9);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transform: translate(-50%, -60%);
      transition: all 0.6s ease-out;
      z-index: 3;
    }

    .info-panel {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      color: #9ca3af;
    }

    .score-panel {
      flex: 0.9;
      min-width: 260px;
      background: radial-gradient(circle at top, #020617 0%, #020617 60%);
      border-radius: 18px;
      border: 2px solid rgba(148, 163, 184, 0.6);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .score-card {
      flex: 1;
      text-align: center;
      padding: 10px 8px;
      border-radius: 12px;
      background: radial-gradient(circle, rgba(15, 23, 42, 0.9), rgba(2, 6, 23, 1));
      border: 1px solid rgba(148, 163, 184, 0.7);
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.8);
    }
    .score-label {
      font-size: 12px;
      letter-spacing: 0.5px;
      color: #9ca3af;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .score-value {
      font-size: 22px;
      font-weight: bold;
      color: #e5e7eb;
    }

    .question-panel {
      margin-top: 4px;
      background: radial-gradient(circle at top, #1f2937 0%, #020617 100%);
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      padding: 14px 14px 12px;
      box-shadow: inset 0 0 15px rgba(15, 23, 42, 0.9);
    }
    .question-title {
      font-size: 14px;
      font-weight: bold;
      color: #facc15;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .question-text {
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }
    .option-btn {
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.8);
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.7));
      color: #e5e7eb;
      padding: 8px 10px;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .option-btn:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      transform: translateY(-1px);
    }
    .option-btn.correct {
      background: linear-gradient(135deg, #15803d, #16a34a);
      border-color: #4ade80;
      color: #ecfdf5;
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.9);
    }
    .option-btn.wrong {
      background: linear-gradient(135deg, #b91c1c, #7f1d1d);
      border-color: #f87171;
      color: #fee2e2;
      box-shadow: 0 0 18px rgba(248, 113, 113, 0.9);
    }
    .option-btn.disabled { pointer-events: none; opacity: 0.9; }

    .feedback {
      margin-top: 6px;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 10px;
      padding: 8px 10px;
      display: none;
    }
    .feedback.correct {
      background: rgba(22, 163, 74, 0.2);
      border: 1px solid #4ade80;
      color: #bbf7d0;
    }
    .feedback.wrong {
      background: rgba(185, 28, 28, 0.2);
      border: 1px solid #fca5a5;
      color: #fecaca;
    }

    .controls {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #9ca3af;
    }
    .btn-primary {
      padding: 9px 20px;
      border-radius: 20px;
      border: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, #facc15, #ea580c);
      color: #111827;
      box-shadow: 0 4px 12px rgba(251, 191, 36, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: none;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(251, 191, 36, 0.8);
    }

    .volume-control {
      margin-top: 6px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #9ca3af;
    }
    .volume-control input {
      flex: 1;
    }

    .final-screen {
      padding: 30px 20px 26px;
      text-align: center;
    }
    .final-title {
      font-size: 26px;
      margin-bottom: 12px;
      color: #facc15;
    }
    .final-badge {
      font-size: 60px;
      margin: 12px 0;
    }
    .final-rank {
      font-size: 22px;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .final-score {
      font-size: 24px;
      margin: 8px 0;
    }
    .final-text {
      font-size: 15px;
      color: #e5e7eb;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .header h1 { font-size: 24px; }
      .cells { grid-template-columns: repeat(4, 1fr); }
      .board-wrapper { flex-direction: column; }
      .board-area, .score-panel { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splashScreen">
    <img src="assets/logo.png" alt="Innovine Logo" onerror="this.style.display='none'" />
  </div>

  <div class="container" id="mainContainer">
    <div class="header">
      <div class="header-content">
        <h1>🔎 Subject-Verb Agreement Quest</h1>
        <div class="subtitle">Grade 5 Subject-Verb Agreement</div>
        <div class="stage-indicator" id="stageIndicator">Step 1 of 10</div>
      </div>
    </div>

    <div class="board-wrapper" id="gameWrapper">
      <div class="board-area">
        <div class="board-title">Detective Case Trail</div>
        <div class="board-path">
          <div class="path-line"></div>
          <div class="cells" id="cellsContainer"></div>
          <div class="token" id="token">🕵️</div>
        </div>
        <div class="info-panel">
          <div>Start: Grammar Clue One</div>
          <div>Finish: Case Solved</div>
        </div>
      </div>

      <div class="score-panel">
        <div class="score-row">
          <div class="score-card">
            <div class="score-label">Correct Answers</div>
            <div class="score-value" id="correctCount">0</div>
          </div>
          <div class="score-card">
            <div class="score-label">Current Step</div>
            <div class="score-value" id="currentStep">1 / 10</div>
          </div>
        </div>
        <div class="score-row">
          <div class="score-card">
            <div class="score-label">Case Score</div>
            <div class="score-value" id="totalScore">0%</div>
          </div>
        </div>

        <div class="question-panel" id="questionPanel">
          <div class="question-title">Question</div>
          <div class="question-text" id="questionText"></div>
          <div class="options" id="optionsContainer"></div>
          <div class="feedback" id="feedback"></div>
          <div class="controls">
            <div id="progressText">Answer to move along the path.</div>
            <button class="btn-primary" id="nextBtn">Next Step →</button>
          </div>
          <div class="volume-control">
            <span>🔊 Volume</span>
            <input type="range" id="volumeSlider" min="0" max="100" value="80" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    setTimeout(() => {
      document.getElementById('splashScreen').classList.add('hidden');
      document.getElementById('mainContainer').classList.add('visible');
      initGame();
    }, 5000);

    const correctSound = new Audio('assets/correct.mp3');
    const wrongSound = new Audio('assets/wrong.mp3');
    const celebrationSound = new Audio('assets/freesound_community-claps-44774.mp3');
    let volume = 0.8;
    correctSound.volume = volume;
    wrongSound.volume = volume;
    celebrationSound.volume = volume;
    function playCorrectSound(){ correctSound.currentTime = 0; correctSound.play().catch(()=>{}); }
    function playWrongSound(){ wrongSound.currentTime = 0; wrongSound.play().catch(()=>{}); }
    function playCelebrationSound(){ celebrationSound.currentTime = 0; celebrationSound.play().catch(()=>{}); }
    document.getElementById('volumeSlider').addEventListener('input', e => {
      volume = e.target.value / 100;
      correctSound.volume = volume;
      wrongSound.volume = volume;
      celebrationSound.volume = volume;
    });

    const questionBank = [
      {
        question: 'During the morning assembly, the principal informed everyone that a group of selected students ___ going to represent the school at the national science fair after weeks of preparation and interviews.',
        options: ['are', 'is', 'were', 'have'],
        correctIndex: 1,
        explanation: '“Group” is singular, so the correct answer is “is”.'
      },
      {
        question: 'Each of the students in Grade 5 ___ expected to complete their project work on time even if they are working in pairs or groups.',
        options: ['are', 'is', 'were', 'have'],
        correctIndex: 1,
        explanation: '“Each” takes a singular verb, so the correct answer is “is”.'
      },
      {
        question: 'The players of the school football team ___ training hard every evening for the upcoming inter-school championship match.',
        options: ['is', 'were', 'have', 'are'],
        correctIndex: 3,
        explanation: '“Players” is plural, so the correct answer is “are”.'
      },
      {
        question: 'The news coming from multiple cities ___ indicating that heavy rainfall has disrupted transport and school schedules.',
        options: ['are', 'is', 'were', 'have'],
        correctIndex: 1,
        explanation: '“News” is singular, so the correct answer is “is”.'
      },
      {
        question: 'The committee of senior teachers and coordinators ___ unable to reach a final decision even after several long meetings and discussions.',
        options: ['is', 'are', 'were', 'have'],
        correctIndex: 0,
        explanation: '“Committee” is singular here, so the correct answer is “is”.'
      },
      {
        question: 'A number of scientific experiments conducted in the laboratory ___ showing unexpected results that surprised even the senior researchers.',
        options: ['is', 'have', 'was', 'has'],
        correctIndex: 1,
        explanation: '“Experiments” is plural, so the correct answer is “have”.'
      },
      {
        question: 'The collection of ancient manuscripts preserved in the school library ___ carefully maintained despite their fragile and aged condition.',
        options: ['is', 'are', 'were', 'have'],
        correctIndex: 0,
        explanation: '“Collection” is singular, so the correct answer is “is”.'
      },
      {
        question: 'The students who visited the river ecosystem ___ returning with detailed reports and observations for their environmental studies project.',
        options: ['was', 'is', 'are', 'has'],
        correctIndex: 2,
        explanation: '“Students” is plural, so the correct answer is “are”.'
      },
      {
        question: 'Either the principal or the teachers ___ responsible for approving the final schedule of the annual cultural event.',
        options: ['are', 'is', 'were', 'have'],
        correctIndex: 0,
        explanation: 'The verb agrees with the nearest subject, “teachers”, so the correct answer is “are”.'
      },
      {
        question: 'The group of scientists working on climate change research ___ presenting their findings to the international panel after years of continuous study.',
        options: ['are', 'is', 'were', 'have'],
        correctIndex: 1,
        explanation: '“Group” is singular, so the correct answer is “is”.'
      }
    ];

    const TOTAL_STEPS = 10;

    let currentQuestions = [];
    let currentIndex = 0;
    let correctCount = 0;

    const cellsContainer = document.getElementById('cellsContainer');
    const token = document.getElementById('token');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('nextBtn');
    const correctCountEl = document.getElementById('correctCount');
    const currentStepEl = document.getElementById('currentStep');
    const totalScoreEl = document.getElementById('totalScore');
    const stageIndicator = document.getElementById('stageIndicator');
    const gameWrapper = document.getElementById('gameWrapper');

    let cellPositions = [];

    function initBoard() {
      cellsContainer.innerHTML = '';
      cellPositions = [];
      const totalCells = TOTAL_STEPS + 2;

      for (let i = 0; i < totalCells; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        if (i === 0) {
          cell.classList.add('start');
          cell.innerHTML = '<span class="step-number">Start</span><span>Clue 1</span>';
        } else if (i === totalCells - 1) {
          cell.classList.add('finish');
          cell.innerHTML = '<span class="step-number">Finish</span><span>Solved</span>';
        } else {
          cell.innerHTML = `<span class="step-number">${i}</span><span>Case ${i}</span>`;
        }
        cellsContainer.appendChild(cell);
      }

      const cellElems = Array.from(cellsContainer.children);
      cellElems.forEach(cell => {
        const rect = cell.getBoundingClientRect();
        const parentRect = cellsContainer.getBoundingClientRect();
        const x = rect.left - parentRect.left + rect.width / 2;
        const y = rect.top - parentRect.top + rect.height / 2;
        cellPositions.push({ x, y });
      });

      moveTokenTo(0);
    }

    function moveTokenTo(stepIndex) {
      const pos = cellPositions[stepIndex];
      if (!pos) return;
      const containerRect = cellsContainer.getBoundingClientRect();
      const offsetX = (pos.x / containerRect.width) * 100;
      const offsetY = (pos.y / containerRect.height) * 100;
      token.style.left = offsetX + '%';
      token.style.top = offsetY + '%';
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function initGame() {
      const shuffled = shuffle([...questionBank]);
      currentQuestions = shuffled.slice(0, TOTAL_STEPS);
      currentIndex = 0;
      correctCount = 0;
      correctCountEl.textContent = '0';
      currentStepEl.textContent = `1 / ${TOTAL_STEPS}`;
      totalScoreEl.textContent = '0%';
      stageIndicator.textContent = `Step 1 of ${TOTAL_STEPS}`;
      setTimeout(initBoard, 50);
      loadQuestion();
    }

    function loadQuestion() {
      const q = currentQuestions[currentIndex];
      if (!q) return;

      questionText.textContent = q.question;
      optionsContainer.innerHTML = '';
      feedback.style.display = 'none';
      feedback.textContent = '';
      document.getElementById('progressText').textContent = 'Answer to move along the path.';
      nextBtn.style.display = 'none';

      q.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.addEventListener('click', () => handleAnswer(index));
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedIndex) {
      const q = currentQuestions[currentIndex];
      const optionButtons = optionsContainer.querySelectorAll('.option-btn');

      optionButtons.forEach((btn, idx) => {
        btn.classList.add('disabled');
        if (idx === q.correctIndex) {
          btn.classList.add('correct');
        }
      });

      if (selectedIndex === q.correctIndex) {
        feedback.className = 'feedback correct';
        feedback.textContent = q.explanation;
        correctCount++;
        playCorrectSound();
      } else {
        optionButtons[selectedIndex].classList.add('wrong');
        feedback.className = 'feedback wrong';
        feedback.textContent = q.explanation;
        playWrongSound();
      }

      feedback.style.display = 'block';

      const tokenTargetIndex = Math.min(currentIndex + 1, TOTAL_STEPS);
      moveTokenTo(tokenTargetIndex);

      correctCountEl.textContent = String(correctCount);
      const percent = Math.round((correctCount / TOTAL_STEPS) * 100);
      totalScoreEl.textContent = percent + '%';

      nextBtn.style.display = 'inline-block';
      nextBtn.textContent = currentIndex < TOTAL_STEPS - 1 ? 'Next Step →' : 'View Subject-Verb Agreement Result →';
    }

    nextBtn.addEventListener('click', () => {
      if (currentIndex < TOTAL_STEPS - 1) {
        currentIndex++;
        currentStepEl.textContent = `${currentIndex + 1} / ${TOTAL_STEPS}`;
        stageIndicator.textContent = `Step ${currentIndex + 1} of ${TOTAL_STEPS}`;
        loadQuestion();
      } else {
        showFinalScreen();
      }
    });

    function showFinalScreen() {
      moveTokenTo(TOTAL_STEPS + 1);
      const percent = Math.round((correctCount / TOTAL_STEPS) * 100);
      let rank, badge, text;

      if (percent >= 90) {
        rank = 'Grammar Master';
        badge = '🌟';
        text = 'You have a strong understanding of subject-verb agreement.';
      } else if (percent >= 70) {
        rank = 'Careful Reader';
        badge = '✨';
        text = 'You understand the grammar rules well. Keep practicing.';
      } else if (percent >= 50) {
        rank = 'Grammar Explorer';
        badge = '🔍';
        text = 'You are on the right path. Try the game again to improve.';
      } else {
        rank = 'New Learner';
        badge = '🌱';
        text = 'This is the beginning. Review the rules and try again.';
      }

      const finalHtml = `
        <div class="final-screen">
          <div class="final-title">Subject-Verb Agreement Quest Complete</div>
          <div class="final-badge">${badge}</div>
          <div class="final-rank">${rank}</div>
          <div class="final-score">Score: ${correctCount} / ${TOTAL_STEPS} (${percent}%)</div>
          <div class="final-text">${text}</div>
          <button class="btn-primary" id="playAgainBtn">Play Again</button>
        </div>
      `;
      const panel = document.getElementById('gameWrapper');
      panel.innerHTML = finalHtml;

      document.getElementById('playAgainBtn').addEventListener('click', () => {
        location.reload();
      });
    }
  </script>
</body>
</html>
