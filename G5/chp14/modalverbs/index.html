<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal Verbs Maze</title>
<style>
    * {box-sizing: border-box; margin:0; padding:0; font-family: Arial, sans-serif;}
    body, html {height: 100%; width: 100%;}
    #splash {position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; display:flex; justify-content:center; align-items:center; z-index:100;}
    #splash img {width: 40%; max-width: 300px;}
    #game {display:none; width:100%; height:100%; padding:20px; background: linear-gradient(to bottom, #f0c0f0, #c0dfff);}
    #score {position: absolute; top:10px; left:10px; background:#fff; padding:5px 15px; border-radius:8px; font-size:1.2rem;}
    #question {text-align:center; font-size:1.5rem; margin-top:40px; font-weight:bold;}
    #options {display:flex; justify-content:center; gap:15px; flex-wrap: wrap; margin-top:20px;}
    .option {background:orange; border:none; padding:15px 25px; font-size:1.2rem; border-radius:10px; cursor:pointer; transition:0.2s;}
    .option:hover {transform: scale(1.1);}
    #maze {display:grid; grid-template-rows: repeat(5, 80px); grid-template-columns: repeat(4, 80px); gap:10px; justify-content:center; margin-top:40px; position:relative;}
    .cell {background:#c0c0c0; border-radius:5px; display:flex; justify-content:center; align-items:center;}
    #character {position:absolute; width:60px; height:60px; transition: all 0.5s;}
    #treasure {width:60px; height:60px;}
    #endScreen {display:none; position:absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content:center; align-items:center; color:#fff; font-size:2rem; flex-direction:column;}
    #endScreen button {margin-top:20px; padding:10px 20px; font-size:1.2rem; cursor:pointer; border-radius:8px;}
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
    <img src="assets/logo.png" alt="Innovine Logo">
</div>

<!-- Game -->
<div id="game">
    <div id="score">Score: 0</div>
    <div id="question">Question will appear here</div>
    <div id="options"></div>

    <div id="maze">
        <div class="cell" id="cell-0-0"></div>
        <div class="cell" id="cell-0-1"></div>
        <div class="cell" id="cell-0-2"></div>
        <div class="cell" id="cell-0-3"></div>

        <div class="cell" id="cell-1-0"></div>
        <div class="cell" id="cell-1-1"></div>
        <div class="cell" id="cell-1-2"></div>
        <div class="cell" id="cell-1-3"></div>

        <div class="cell" id="cell-2-0"></div>
        <div class="cell" id="cell-2-1"></div>
        <div class="cell" id="cell-2-2"></div>
        <div class="cell" id="cell-2-3"></div>

        <div class="cell" id="cell-3-0"></div>
        <div class="cell" id="cell-3-1"></div>
        <div class="cell" id="cell-3-2"></div>
        <div class="cell" id="cell-3-3"></div>

        <div class="cell" id="cell-4-0"></div>
        <div class="cell" id="cell-4-1"></div>
        <div class="cell" id="cell-4-2"></div>
        <div class="cell" id="cell-4-3"></div>

        <img src="assets/character.png" id="character">
        <img src="assets/tresurechest.png" id="treasure" style="display:none;">
    </div>
</div>

<!-- End Screen -->
<div id="endScreen">
    <div>🎉 Congratulations! You reached the treasure! 🎉</div>
    <button onclick="location.reload()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="applause" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const splash = document.getElementById('splash');
const game = document.getElementById('game');
const endScreen = document.getElementById('endScreen');
const scoreBoard = document.getElementById('score');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const character = document.getElementById('character');
const treasure = document.getElementById('treasure');

const correctSound = document.getElementById('correctSound');
const wrongSound = document.getElementById('wrongSound');
const applause = document.getElementById('applause');

// Questions Array (12)
const questions = [
    {q:"You ___ finish your homework before playing.", options:["can","should","might","will"], answer:"should"},
    {q:"I ___ swim when I was 5.", options:["could","may","shall","must"], answer:"could"},
    {q:"You ___ not park here.", options:["can","must","will","should"], answer:"must"},
    {q:"She ___ visit her grandma tomorrow.", options:["might","shall","could","will"], answer:"will"},
    {q:"He ___ lift this heavy box.", options:["should","can","may","might"], answer:"can"},
    {q:"I ___ go to the party if I finish work.", options:["will","may","can","must"], answer:"may"},
    {q:"They ___ be very tired after the game.", options:["should","might","can","will"], answer:"might"},
    {q:"You ___ take this medicine three times a day.", options:["must","may","can","shall"], answer:"must"},
    {q:"We ___ not enter this room.", options:["should","might","can","must"], answer:"must"},
    {q:"He ___ always tell the truth.", options:["can","should","might","will"], answer:"should"},
    {q:"I ___ call my friend tonight.", options:["may","can","must","will"], answer:"will"},
    {q:"They ___ help you if you ask.", options:["can","must","might","should"], answer:"can"}
];

let currentQ = 0;
let score = 0;
let position = {row:4,col:0};

function showQuestion(){
    const q = questions[currentQ];
    questionEl.textContent = q.q;
    optionsEl.innerHTML = "";
    q.options.forEach(opt=>{
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.className = 'option';
        btn.onclick = ()=>checkAnswer(opt);
        optionsEl.appendChild(btn);
    });
}

function checkAnswer(selected){
    const q = questions[currentQ];
    if(selected === q.answer){
        correctSound.play();
        score++; scoreBoard.textContent = "Score: "+score;
        moveCharacter();
    } else {
        wrongSound.play();
        character.style.transform = "translate("+position.col*90+"px,"+position.row*-90+"px) rotate(-10deg)";
        setTimeout(()=>{character.style.transform = "translate("+position.col*90+"px,"+position.row*-90+"px) rotate(0deg)";},200);
    }
    currentQ++;
    if(currentQ < questions.length) showQuestion();
}

function moveCharacter(){
    // Simple Maze Path (move up first, then right)
    if(position.row>0){position.row--;}
    else if(position.col<3){position.col++;}
    character.style.transform = "translate("+position.col*90+"px,"+position.row*-90+"px)";
    if(position.row===0 && position.col===3){
        treasure.style.display="block";
        applause.play();
        endScreen.style.display="flex";
    }
}

// Splash to Game
setTimeout(()=>{
    splash.style.display="none";
    game.style.display="block";
    showQuestion();
},5000);
</script>

</body>
</html>
