<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal Maze Game</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom, #fddde6, #d3f0ff);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    #splash {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 10;
    }
    #splash img {
        width: 300px;
    }
    #game {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 90%;
        max-width: 600px;
    }
    #score {
        background: white;
        padding: 10px 15px;
        border-radius: 10px;
        margin-bottom: 10px;
        font-size: 1.2em;
        font-weight: bold;
    }
    #question {
        text-align: center;
        font-size: 1.5em;
        margin-bottom: 15px;
    }
    #maze {
        display: grid;
        grid-template-columns: repeat(5, 60px);
        grid-template-rows: repeat(5, 60px);
        gap: 5px;
        margin-bottom: 15px;
    }
    .cell {
        width: 60px;
        height: 60px;
        background: #eee;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 5px;
        position: relative;
    }
    #player {
        width: 50px;
        height: 50px;
        position: absolute;
        top: 0;
        left: 0;
        transition: all 0.3s;
        z-index: 5;
    }
    #finish {
        width: 50px;
        height: 50px;
    }
    #options {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        width: 100%;
        max-width: 500px;
    }
    .option-btn {
        background: orange;
        color: white;
        border: none;
        padding: 10px 15px;
        margin: 5px;
        border-radius: 10px;
        cursor: pointer;
        flex: 1 1 45%;
        font-size: 1em;
    }
    .option-btn:hover {
        background: darkorange;
    }
</style>
</head>
<body>

<!-- Splash screen -->
<div id="splash">
    <img src="assets/logo.png" alt="Innovine Logo">
</div>

<div id="game">
    <div id="score">Score: 0</div>
    <div id="question"></div>
    <div id="maze">
        <!-- 5x5 maze grid -->
        <div class="cell" id="cell-0-0"></div>
        <div class="cell" id="cell-0-1"></div>
        <div class="cell" id="cell-0-2"></div>
        <div class="cell" id="cell-0-3"></div>
        <div class="cell" id="cell-0-4"></div>
        <div class="cell" id="cell-1-0"></div>
        <div class="cell" id="cell-1-1"></div>
        <div class="cell" id="cell-1-2"></div>
        <div class="cell" id="cell-1-3"></div>
        <div class="cell" id="cell-1-4"></div>
        <div class="cell" id="cell-2-0"></div>
        <div class="cell" id="cell-2-1"></div>
        <div class="cell" id="cell-2-2"></div>
        <div class="cell" id="cell-2-3"></div>
        <div class="cell" id="cell-2-4"></div>
        <div class="cell" id="cell-3-0"></div>
        <div class="cell" id="cell-3-1"></div>
        <div class="cell" id="cell-3-2"></div>
        <div class="cell" id="cell-3-3"></div>
        <div class="cell" id="cell-3-4"></div>
        <div class="cell" id="cell-4-0"></div>
        <div class="cell" id="cell-4-1"></div>
        <div class="cell" id="cell-4-2"></div>
        <div class="cell" id="cell-4-3"></div>
        <div class="cell" id="cell-4-4">
            <img id="finish" src="assets/tresurechest.png" alt="Finish">
        </div>
    </div>
    <img id="player" src="assets/character.png" alt="Player">
    <div id="options"></div>
</div>

<script>
const splash = document.getElementById('splash');
const game = document.getElementById('game');
const questionDiv = document.getElementById('question');
const optionsDiv = document.getElementById('options');
const scoreDiv = document.getElementById('score');
const player = document.getElementById('player');

let score = 0;
let playerPos = {row: 0, col: 0};

// Sample modal verb questions (12)
const questions = [
    {q: "I ___ go to the party tonight.", options:["can","may","must","should"], answer:"can"},
    {q: "You ___ finish your homework before playing.", options:["must","can","might","should"], answer:"must"},
    {q: "He ___ be at home now.", options:["may","can","must","should"], answer:"may"},
    {q: "We ___ take an umbrella.", options:["might","should","must","can"], answer:"should"},
    {q: "I ___ speak three languages.", options:["can","must","may","should"], answer:"can"},
    {q: "You ___ not park here.", options:["must","may","can","should"], answer:"must"},
    {q: "She ___ be tired after the trip.", options:["might","must","can","should"], answer:"might"},
    {q: "They ___ finish early if they work fast.", options:["can","must","may","should"], answer:"can"},
    {q: "We ___ leave now to catch the train.", options:["must","may","can","should"], answer:"must"},
    {q: "You ___ ask for help if needed.", options:["should","may","can","must"], answer:"should"},
    {q: "He ___ not speak loudly in the library.", options:["must","can","may","should"], answer:"must"},
    {q: "I ___ visit my grandparents this weekend.", options:["may","can","must","should"], answer:"may"}
];

let currentQ = 0;

function loadQuestion() {
    const q = questions[currentQ];
    questionDiv.textContent = q.q;
    optionsDiv.innerHTML = '';
    q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(opt);
        optionsDiv.appendChild(btn);
    });
}
function checkAnswer(selected) {
    const q = questions[currentQ];
    const audio = new Audio(selected === q.answer ? 'assets/correct.mp3' : 'assets/wrong.mp3');
    audio.play();
    if(selected === q.answer){
        score++;
        scoreDiv.textContent = `Score: ${score}`;
        movePlayer();
    }
    currentQ++;
    if(currentQ < questions.length) loadQuestion();
    else alert("Game over! Final score: " + score);
}

function movePlayer(){
    if(playerPos.col < 4){
        playerPos.col++;
    } else if(playerPos.row < 4){
        playerPos.col = 0;
        playerPos.row++;
    }
    const cell = document.getElementById(`cell-${playerPos.row}-${playerPos.col}`);
    player.style.top = cell.offsetTop + "px";
    player.style.left = cell.offsetLeft + "px";
}

// Splash screen 5s
setTimeout(()=> {
    splash.style.display = 'none';
    game.style.display = 'flex';
    loadQuestion();
}, 5000);
</script>
</body>
</html>
