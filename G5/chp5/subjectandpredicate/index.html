<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subject and Predicate - Drag and Drop</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; }
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fef6e4, #dff6ff, #fce1ff);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

#splash {
  position: fixed;
  inset: 0;
  background: #fff9f0;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  animation: fadeOut 1s ease 4s forwards;
}
#splash img { width: 200px; }
@keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

h1 { 
  color: #2b4eff; 
  font-size: 24px; 
  margin-bottom: 10px;
}

#instructions-screen {
  background: white;
  padding: 20px;
  border-radius: 16px;
  text-align: center;
  margin-bottom: 10px;
}
#instructions-screen h2 { color: #2b4eff; margin-bottom: 8px; }
#instructions-screen p { font-size: 14px; margin: 5px 0; }
#start-btn {
  padding: 10px 25px;
  font-size: 16px;
  background: #4caf50;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

#game-area {
  display: none;
  width: 90%;
  height: 75vh;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 15px;
  background: rgba(255,255,255,0.7);
  border-radius: 16px;
}

.subject {
  width: 130px;
  padding: 10px;
  background: linear-gradient(135deg, #ffcc66, #ff9966);
  color: white;
  font-weight: bold;
  border-radius: 10px;
  text-align: center;
  font-size: 13px;
  cursor: pointer;
  box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
  transition: 0.2s;
}
.subject:hover { transform: scale(1.05); }
.subject.selected { outline: 3px solid #4caf50; }
.subject.matched { opacity: 0.2; pointer-events: none; }

.predicate {
  width: 170px;
  padding: 10px;
  background: linear-gradient(135deg, #66ccff, #3399ff);
  color: white;
  font-weight: bold;
  border-radius: 10px;
  text-align: center;
  font-size: 12px;
  box-shadow: 3px 3px 8px rgba(0,0,0,0.2);
  transition: 0.2s;
}
.predicate:hover { transform: scale(1.05); }
.predicate.correct { background: linear-gradient(135deg, #66ff99, #33cc66); }

#result { font-size: 18px; color: #2b4eff; margin: 5px 0; font-weight: bold; }
#score { font-size: 16px; font-weight: bold; color: #2b4eff; padding: 5px 15px; background: white; border-radius: 8px; }
#restart-btn { display: none; padding: 10px 25px; background: #ff6b6b; color: white; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; }

.confetti {
  position: fixed;
  font-size: 20px;
  animation: fall 2s linear forwards;
  z-index: 10000;
}
@keyframes fall {
  to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>

<div id="splash">
  <img src="assets/logo.png" alt="Logo">
</div>

<h1>🎯 Subject + Predicate Match</h1>

<div id="instructions-screen">
  <h2>How to Play</h2>
  <p>1. Click a 🟡 <strong>subject</strong> (orange)</p>
  <p>2. Click a 🔵 <strong>predicate</strong> (blue) to match</p>
  <p>✅ Correct: Sound + Card disappears</p>
  <p>🏆 Match all 15!</p>
  <button id="start-btn">Start Game</button>
</div>

<div id="game-area"></div>

<div id="result"></div>
<div id="score">Score: 0 / 15</div>
<button id="restart-btn">Play Again</button>

<audio id="correct-sound" src="assets/correct.mp3"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3"></audio>
<audio id="clap-sound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const gameArea = document.getElementById('game-area');
const instructions = document.getElementById('instructions-screen');
const result = document.getElementById('result');
const scoreEl = document.getElementById('score');
const restartBtn = document.getElementById('restart-btn');

const pairs = [
  {subject:'The curious cat',predicate:'climbed the tall tree quietly'},
  {subject:'Our class monitor',predicate:'organized the classroom efficiently'},
  {subject:'The team of players',predicate:'scored the winning goal'},
  {subject:'My favorite author',predicate:'wrote an inspiring story'},
  {subject:'The young scientist',predicate:'conducted an experiment'},
  {subject:'The children in park',predicate:'are flying kites'},
  {subject:'Our school principal',predicate:'welcomed new students'},
  {subject:'The old gardener',predicate:'watered the plants'},
  {subject:'The birds in sky',predicate:'are chirping melodiously'},
  {subject:'My best friend',predicate:'is helping with homework'},
  {subject:'The hardworking farmer',predicate:'harvested the crops'},
  {subject:'The famous singer',predicate:'performed on stage'},
  {subject:'The tiny baby',predicate:'is laughing softly'},
  {subject:'Students of class 5B',predicate:'completed science project'},
  {subject:'The cheerful neighbor',predicate:'baked delicious cookies'}
];

let selectedSubject = null;
let score = 0;
let matched = 0;

function shuffle(arr) {
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function createCards() {
  gameArea.innerHTML = '';
  const subjects = shuffle(pairs.map(p => ({...p, type:'subject'}})));
  const predicates = shuffle(pairs.map(p => ({...p, type:'predicate'}})));
  
  subjects.forEach(s => {
    const div = document.createElement('div');
    div.className = 'subject';
    div.textContent = s.subject;
    div.dataset.subject = s.subject;
    div.dataset.predicate = s.predicate;
    div.onclick = () => selectSubject(div);
    gameArea.appendChild(div);
  });
  
  predicates.forEach(p => {
    const div = document.createElement('div');
    div.className = 'predicate';
    div.textContent = p.predicate;
    div.dataset.subject = p.subject;
    div.dataset.predicate = p.predicate;
    div.onclick = () => checkMatch(div);
    gameArea.appendChild(div);
  });
}

function selectSubject(el) {
  if(el.classList.contains('matched')) return;
  document.querySelectorAll('.subject').forEach(s => s.classList.remove('selected'));
  selectedSubject = el;
  el.classList.add('selected');
  result.textContent = `Selected: ${el.textContent}`;
}

function checkMatch(el) {
  if(!selectedSubject || el.classList.contains('correct')) {
    result.textContent = 'Click a subject first!';
    return;
  }
  
  if(el.dataset.subject === selectedSubject.dataset.subject) {
    // Correct!
    el.textContent = `${selectedSubject.dataset.subject} ${selectedSubject.dataset.predicate}`;
    el.classList.add('correct');
    selectedSubject.classList.add('matched');
    selectedSubject.classList.remove('selected');
    selectedSubject = null;
    
    result.textContent = '🎉 Correct!';
    result.style.color = '#4caf50';
    document.getElementById('correct-sound').play();
    document.getElementById('clap-sound').play();
    confetti();
    
    score++;
    matched++;
    scoreEl.textContent = `Score: ${score} / 15`;
    
    if(matched === 15) {
      result.textContent = '🏆 PERFECT! All 15 matched!';
      restartBtn.style.display = 'inline-block';
    }
  } else {
    // Wrong
    result.textContent = '❌ Try again!';
    result.style.color = '#e76f51';
    document.getElementById('wrong-sound').play();
  }
}

function confetti() {
  for(let i=0;i<30;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.textContent=['⭐','🎉','✨'][Math.floor(Math.random()*3)];
    c.style.left=Math.random()*100+'vw';
    c.style.top='-10px';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}

document.getElementById('start-btn').onclick = () => {
  instructions.style.display='none';
  gameArea.style.display='flex';
  createCards();
  result.textContent='';
  scoreEl.textContent='Score: 0 / 15';
  restartBtn.style.display='none';
  score=0;
  matched=0;
  selectedSubject=null;
};

restartBtn.onclick = () => {
  instructions.style.display='block';
  gameArea.style.display='none';
};
</script>

</body>
</html>
