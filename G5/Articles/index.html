<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunt for Articles</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin:0;
  padding:0;
  background: linear-gradient(135deg,#fff6d1,#ffd1e0,#d1f0ff);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* Splash Logo */
#splash {
  position:fixed;
  inset:0;
  background:#fff9f0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
  animation:fadeOut 1s ease 4s forwards;
}
#splash img { width:220px; max-width:80%; }
@keyframes fadeOut{ to {opacity:0; visibility:hidden;} }

h1 { margin:20px; color:#2b4eff; text-align:center; }

/* Instructions */
#instructions-screen{
  width:90%; max-width:700px;
  background:#ffffffcc; padding:20px;
  border-radius:12px; margin-bottom:20px;
  text-align:center;
  font-size:18px;
}
#start-btn {
  padding:10px 20px; font-size:16px;
  background:linear-gradient(145deg,#66ff99,#33ccff);
  color:white; border:none; border-radius:10px; cursor:pointer;
}
#start-btn:hover { background:linear-gradient(145deg,#33ccff,#66ff99); }

/* Game area */
#game-area {
  width:90%; max-width:900px;
  min-height:500px; background:#ffffffaa;
  border-radius:15px; padding:20px; display:none;
  position:relative; overflow:hidden;
}

/* Path */
#path {
  position:relative;
  width:100%;
  height:300px;
  background: linear-gradient(180deg,#a6f0c6,#f0f7a6);
  border-radius:10px;
  margin-bottom:20px;
}

/* Character */
.character {
  width:50px; height:50px;
  background: radial-gradient(circle,#ffcc66,#ff6699);
  border-radius:50%;
  position:absolute; bottom:10px; left:0px;
  display:flex; justify-content:center; align-items:center;
  font-weight:bold; color:white; font-size:24px;
  animation:bounce 0.5s infinite alternate;
}
@keyframes bounce{
  0%{transform:translateY(0);}
  100%{transform:translateY(-10px);}
}

/* Treasure chest */
.treasure {
  width:180px; height:60px;
  background: linear-gradient(145deg,#ff9966,#ffcc66);
  border-radius:8px;
  text-align:center;
  line-height:60px;
  font-weight:bold; color:white;
  position:absolute; bottom:10px;
  cursor:pointer;
}

/* Sentence and choices */
#sentence { font-size:18px; margin-bottom:10px; }
#choices button {
  padding:10px 20px; margin:5px;
  font-size:16px; font-weight:bold;
  border-radius:8px; border:none;
  cursor:pointer;
  background:linear-gradient(145deg,#66ccff,#3399ff);
  color:white;
  transition: transform 0.2s;
}
#choices button:hover { transform:scale(1.05); background:linear-gradient(145deg,#3399ff,#66ccff); }

#result{ margin-top:10px; font-size:18px; color:#2b4eff; min-height:24px; }
#score{ margin-top:10px; font-size:20px; color:#333; }
</style>
</head>
<body>

<div id="splash">
  <img src="assets/logo.png" alt="Innovine Logo">
</div>

<h1>Treasure Hunt for Articles</h1>

<div id="instructions-screen">
<h2>Instructions</h2>
<p>Click the correct article (a, an, the) to collect the treasure!</p>
<button id="start-btn">Start Game</button>
</div>

<div id="game-area">
  <div id="path">
    <div class="character" id="char">🚀</div>
  </div>
  <div id="sentence"></div>
  <div id="choices"></div>
  <div id="result"></div>
  <div id="score">Score: 0 / 15</div>
</div>

<audio id="correct-sound" src="assets/correct.mp3"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3"></audio>

<script>
// Sentences with missing articles
const questions = [
  {sentence:"I saw ___ elephant in the zoo.", answer:"an"},
  {sentence:"She wants to buy ___ apple.", answer:"an"},
  {sentence:"He has ___ pen on his desk.", answer:"a"},
  {sentence:"___ sun is shining brightly.", answer:"The"},
  {sentence:"We need ___ umbrella.", answer:"an"},
  {sentence:"She gave me ___ book.", answer:"a"},
  {sentence:"___ stars are twinkling.", answer:"The"},
  {sentence:"I met ___ interesting boy.", answer:"an"},
  {sentence:"He bought ___ car yesterday.", answer:"a"},
  {sentence:"___ moon looks beautiful tonight.", answer:"The"},
  {sentence:"We saw ___ owl in the tree.", answer:"an"},
  {sentence:"He found ___ coin.", answer:"a"},
  {sentence:"___ river flows gently.", answer:"The"},
  {sentence:"She drew ___ amazing picture.", answer:"an"},
  {sentence:"He wore ___ hat.", answer:"a"}
];

let current = 0;
let score = 0;

const startBtn = document.getElementById('start-btn');
const instructionsScreen = document.getElementById('instructions-screen');
const gameArea = document.getElementById('game-area');
const sentenceEl = document.getElementById('sentence');
const choicesEl = document.getElementById('choices');
const resultEl = document.getElementById('result');
const scoreEl = document.getElementById('score');
const correctSound = document.getElementById('correct-sound');
const wrongSound = document.getElementById('wrong-sound');
const char = document.getElementById('char');

function shuffle(array){return array.sort(()=>Math.random()-0.5);}

// Load a question and show choices
function loadQuestion(){
  if(current>=questions.length){
    sentenceEl.innerText="Treasure Hunt Completed!";
    choicesEl.innerHTML="";
    return;
  }
  const q = questions[current];
  sentenceEl.innerText = q.sentence;
  choicesEl.innerHTML="";
  let options = shuffle(["a","an","The"]);
  options.forEach(opt=>{
    const btn=document.createElement('button');
    btn.innerText=opt;
    btn.onclick=()=>checkAnswer(opt,q.answer);
    choicesEl.appendChild(btn);
  });
  resultEl.innerText="";
}

// Check answer
function checkAnswer(selected, correct){
  if(selected===correct){
    resultEl.innerText="Correct!";
    correctSound.play();
    score++;
  } else {
    resultEl.innerText="Wrong!";
    wrongSound.play();
  }
  scoreEl.innerText = `Score: ${score} / ${questions.length}`;
  current++;
  setTimeout(loadQuestion,800);
}

// Animate character along path
function animateCharacter(){
  let pos = 0;
  const interval = setInterval(()=>{
    if(pos>800 || current>=questions.length){
      clearInterval(interval);
      return;
    }
    char.style.left = pos+"px";
    pos+=5;
  },50);
}

// Start game
startBtn.onclick = ()=>{
  instructionsScreen.style.display="none";
  gameArea.style.display="block";
  shuffle(questions);
  loadQuestion();
  animateCharacter();
};
</script>
</body>
</html>
