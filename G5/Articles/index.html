<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunt for Articles</title>
<style>
/* Keep all your previous CSS exactly the same */
body {
  font-family: Arial, sans-serif;
  margin:0;
  padding:0;
  background: linear-gradient(135deg,#fff6d1,#d1f0ff);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
}
#splash {
  position:fixed; inset:0; background:#fff9f0; display:flex; justify-content:center; align-items:center; z-index:9999;
  animation:fadeOut 1s ease 4s forwards;
}
#splash img { width:220px; max-width:80%; }
@keyframes fadeOut{ to {opacity:0; visibility:hidden;} }

h1 { margin:20px; color:#2b4eff; text-align:center; }
#instructions-screen{
  width:90%; max-width:700px; background:#ffffffcc; padding:20px; border-radius:12px; margin-bottom:20px; text-align:center; font-size:18px;
}
#start-btn{
  padding:10px 20px; font-size:16px; background:linear-gradient(145deg,#66ff99,#33ccff); color:white; border:none; border-radius:10px; cursor:pointer;
}
#start-btn:hover { background:linear-gradient(145deg,#33ccff,#66ff99); }

#game-area {
  width:90%; max-width:900px; min-height:500px; background:#ffffffaa; border-radius:15px; padding:20px; display:none; position:relative; overflow:hidden;
}

#path { position:relative; width:100%; height:300px; background: linear-gradient(180deg,#a6f0c6,#f0f7a6); border-radius:10px; margin-bottom:20px; }
.character { width:50px; height:50px; background: radial-gradient(circle,#ffcc66,#ff6699); border-radius:50%; position:absolute; bottom:10px; left:0px; display:flex; justify-content:center; align-items:center; font-weight:bold; color:white; font-size:24px; animation:bounce 0.5s infinite alternate; }
@keyframes bounce{0%{transform:translateY(0);}100%{transform:translateY(-10px);}}
.item{ position:absolute; font-size:36px; background:linear-gradient(145deg,#ff9966,#ffcc66); border-radius:8px; text-align:center; line-height:50px; font-weight:bold; width:180px; height:50px; cursor:pointer; }

#sentence { font-size:18px; margin-bottom:10px; }
#choices button { padding:10px 20px; margin:5px; font-size:16px; font-weight:bold; border-radius:8px; border:none; cursor:pointer; background:linear-gradient(145deg,#66ccff,#3399ff); color:white; transition: transform 0.2s;}
#choices button:hover{transform:scale(1.05); background:linear-gradient(145deg,#3399ff,#66ccff);}
#result{ margin-top:10px; font-size:18px; color:#2b4eff; min-height:24px; }
#score{ margin-top:10px; font-size:20px; color:#333; }
</style>
</head>
<body>

<div id="splash">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<h1>Treasure Hunt for Articles</h1>

<div id="instructions-screen">
<h2>Instructions</h2>
<p>Move the bucket to catch falling sentences and select the correct article (a, an, the)!</p>
<button id="start-btn">Start Game</button>
</div>

<div id="game-area">
  <div id="path">
    <div class="character" id="char">🚀</div>
  </div>
  <div id="sentence"></div>
  <div id="choices"></div>
  <div id="result"></div>
  <div id="score">Score: 0 / 15</div>
</div>

<audio id="correct-sound" src="assets/correct.mp3"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3"></audio>
<audio id="clap-sound" src="assets/clapping.mp3"></audio>

<script>
// ONLY changed the questions to Articles
const questions = [
  {sentence:"I saw ___ elephant in the zoo.", answer:"an"},
  {sentence:"She wants to buy ___ apple.", answer:"an"},
  {sentence:"He has ___ pen on his desk.", answer:"a"},
  {sentence:"___ sun is shining brightly.", answer:"The"},
  {sentence:"We need ___ umbrella.", answer:"an"},
  {sentence:"She gave me ___ book.", answer:"a"},
  {sentence:"___ stars are twinkling.", answer:"The"},
  {sentence:"I met ___ interesting boy.", answer:"an"},
  {sentence:"He bought ___ car yesterday.", answer:"a"},
  {sentence:"___ moon looks beautiful tonight.", answer:"The"},
  {sentence:"We saw ___ owl in the tree.", answer:"an"},
  {sentence:"He found ___ coin.", answer:"a"},
  {sentence:"___ river flows gently.", answer:"The"},
  {sentence:"She drew ___ amazing picture.", answer:"an"},
  {sentence:"He wore ___ hat.", answer:"a"}
];

let current=0, score=0, bucketX=window.innerWidth/2, gameRunning=false;
const startBtn = document.getElementById('start-btn');
const instructionsScreen = document.getElementById('instructions-screen');
const gameArea = document.getElementById('game-area');
const char = document.getElementById('char');
const sentenceEl = document.getElementById('sentence');
const choicesEl = document.getElementById('choices');
const resultEl = document.getElementById('result');
const scoreEl = document.getElementById('score');
const correctSound = document.getElementById('correct-sound');
const wrongSound = document.getElementById('wrong-sound');
const clapSound = document.getElementById('clap-sound');

function moveBucket() {
  if(bucketX<50) bucketX=50;
  if(bucketX>window.innerWidth-50) bucketX=window.innerWidth-50;
  char.style.left=bucketX+"px";
}

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowLeft") bucketX-=45;
  if(e.key==="ArrowRight") bucketX+=45;
  moveBucket();
});
document.addEventListener("touchstart", e=>{
  if(e.touches[0].clientX<window.innerWidth/2) bucketX-=55;
  else bucketX+=55;
  moveBucket();
});

function spawnItem(){
  if(!gameRunning) return;
  const item = document.createElement("div");
  item.classList.add("item");
  const q=questions[Math.floor(Math.random()*questions.length)];
  item.innerText=q.sentence.replace("___","___");
  item.dataset.answer=q.answer;
  item.style.left=Math.random()*(window.innerWidth-180)+"px";
  item.style.top="-60px";
  gameArea.appendChild(item);
  let speed=2+Math.random()*2;
  let fall=setInterval(()=>{
    let top=parseFloat(item.style.top);
    top+=speed;
    item.style.top=top+"px";
    const b=char.getBoundingClientRect();
    const i=item.getBoundingClientRect();
    if(i.left<b.right && i.right>b.left && i.top<b.bottom && i.bottom>b.top){
      item.remove();
      clearInterval(fall);
      showChoices(q);
    }
    if(top>window.innerHeight){ item.remove(); clearInterval(fall); }
  },20);
}

function showChoices(q){
  sentenceEl.innerText=q.sentence;
  choicesEl.innerHTML="";
  ["a","an","The"].forEach(opt=>{
    const btn=document.createElement('button');
    btn.innerText=opt;
    btn.onclick=()=>checkAnswer(opt,q.answer);
    choicesEl.appendChild(btn);
  });
}

function checkAnswer(selected, correct){
  if(selected===correct){
    itemCollected = true;
    resultEl.innerText="Correct!";
    correctSound.play();
    clapSound.play();
    score++;
  } else {
    resultEl.innerText="Wrong!";
    wrongSound.play();
  }
  scoreEl.innerText=`Score: ${score} / ${questions.length}`;
  current++;
  setTimeout(spawnItem,800);
}

startBtn.onclick=()=>{
  instructionsScreen.style.display="none";
  gameArea.style.display="block";
  gameRunning=true;
  spawnItem();
};
</script>
</body>
</html>
