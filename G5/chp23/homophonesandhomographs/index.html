<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homophones & Homographs Game - Level 3</title>
<style>
  body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(to bottom, #001f4d, #0055aa);
    overflow: hidden;
    color: #fff;
  }

  /* Splash logo */
  #splash {
    position: fixed;
    top:0; left:0; right:0; bottom:0;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }
  #splash img {
    width: 300px;
    height: auto;
  }

  /* Game container */
  #game-container {
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    text-align: center;
  }

  h1 {
    font-size: 2em;
    margin-bottom: 0.5em;
  }
  h2 {
    font-size: 1.5em;
  }

  .question {
    font-size: 2em;
    margin: 20px 0;
  }

  .options {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
  }

  .option-btn {
    background-color: #ffaa00;
    border: none;
    color: #fff;
    font-size: 1.5em;
    margin: 10px;
    padding: 15px 25px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .option-btn:hover { transform: scale(1.1); }

  .potion-container {
    width: 50px;
    height: 200px;
    border: 3px solid #fff;
    border-radius: 15px;
    margin-top: 30px;
    position: relative;
  }
  .potion-fill {
    background: linear-gradient(to top, #ff0066, #ff66aa);
    width: 100%;
    position: absolute;
    bottom: 0;
    height: 0%;
    border-radius: 12px;
    transition: height 0.5s;
  }

  .stats {
    font-size: 1.2em;
    margin: 10px;
  }

  /* Bubbles */
  .bubble {
    position: absolute;
    border-radius: 50%;
    opacity: 0.5;
    animation: float 10s linear infinite;
    background-color: rgba(255,255,0,0.3);
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0.5);}
    100% { transform: translateY(-100px) scale(1);}
  }

</style>
</head>
<body>

<!-- Splash Logo -->
<div id="splash"><img src="assets/logo.png" alt="Innovine Logo"></div>

<!-- Game Container -->
<div id="game-container">
  <h1>Level <span id="level-number">3</span> - Homophones & Homographs</h1>
  <div class="stats">Score: <span id="score">0</span> | Time Left: <span id="timer">20</span>s</div>
  <div class="question" id="question-text"></div>
  <div class="options" id="options-container"></div>
  <div class="potion-container"><div class="potion-fill" id="potion-fill"></div></div>
</div>

<audio id="correct-sound" src="assets/correct.mp3"></audio>
<audio id="wrong-sound" src="assets/wrong.mp3"></audio>
<audio id="clap-sound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
const splash = document.getElementById('splash');
const game = document.getElementById('game-container');
const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const scoreSpan = document.getElementById('score');
const timerSpan = document.getElementById('timer');
const potionFill = document.getElementById('potion-fill');

const correctSound = document.getElementById('correct-sound');
const wrongSound = document.getElementById('wrong-sound');
const clapSound = document.getElementById('clap-sound');

let level = 3;
let score = 0;
let currentQ = 0;
let potion = 0;

const questions = [
  {q:"The wind ___ the trees.", options:["blew","blue","blow"], answer:"blew"},
  {q:"She cannot ___ the answer.", options:["here","hear"], answer:"hear"},
  {q:"The knight wore ___ armor.", options:["metal","mettle"], answer:"mettle"},
  {q:"Please ___ the book on the table.", options:["lay","lie"], answer:"lay"},
  {q:"He read about the ___ of the city.", options:["history","story"], answer:"history"},
  {q:"The sun ___ brightly today.", options:["shone","shown"], answer:"shone"},
  {q:"He could not ___ the noise.", options:["bear","bare"], answer:"bear"},
  {q:"She tied a ___ knot.", options:["bow","bough"], answer:"bow"},
  {q:"The river will ___ soon.", options:["flood","flawed"], answer:"flood"},
  {q:"He had a strong ___ of character.", options:["sense","cents"], answer:"sense"},
  {q:"He cannot ___ a lie.", options:["accept","except"], answer:"accept"},
  {q:"The cake is too ___ to eat.", options:["sweet","suite"], answer:"sweet"}
];

function showQuestion(){
  if(currentQ>=questions.length){
    alert("Level Complete! Well Done!");
    return;
  }
  const q = questions[currentQ];
  questionText.textContent = q.q;
  optionsContainer.innerHTML = "";
  q.options.forEach(opt=>{
    const btn = document.createElement("button");
    btn.textContent = opt;
    btn.className="option-btn";
    btn.onclick=()=>checkAnswer(opt,q.answer);
    optionsContainer.appendChild(btn);
  });
}

function checkAnswer(selected, answer){
  if(selected===answer){
    score+=10;
    potion+=10;
    scoreSpan.textContent = score;
    potionFill.style.height = potion+"%";
    correctSound.play();
    clapSound.play();
    currentQ++;
    setTimeout(showQuestion,500);
  } else {
    wrongSound.play();
    setTimeout(()=>{},300);
  }
}

function startGame(){
  splash.style.display="none";
  game.style.display="flex";
  showQuestion();
}

// Splash for 3 sec
setTimeout(startGame,3000);

// Bubbles generation
for(let i=0;i<20;i++){
  const bubble = document.createElement("div");
  bubble.className="bubble";
  bubble.style.width = bubble.style.height = (10+Math.random()*30)+"px";
  bubble.style.left = Math.random()*100+"%";
  bubble.style.animationDuration = 5+Math.random()*10+"s";
  document.body.appendChild(bubble);
}
</script>

</body>
</html>
