<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Homophones & Homographs Adventure</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #1a237e, #3f51b5);
  color: white;
  overflow: hidden;
}

#splash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#splash img {
  width: 40%;
}

.container {
  max-width: 800px;
  margin: auto;
  text-align: center;
  padding-top: 40px;
}

h1 {
  font-size: 2em;
}

.question {
  font-size: 1.6em;
  margin: 20px;
}

.options {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

.btn {
  padding: 12px 20px;
  background: orange;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 1.1em;
  cursor: pointer;
}

#potionContainer {
  width: 50px;
  height: 200px;
  border: 3px solid #fff;
  border-radius: 10px;
  margin: 20px auto;
  position: relative;
  background: rgba(255,255,255,0.1);
  overflow: hidden;
}

#potionFill {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 0%;
  background: linear-gradient(to top, #ff4081, #f06292);
  transition: height 0.4s;
}

#endScreen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#restartBtn {
  margin-top: 20px;
  padding: 12px 25px;
  font-size: 1.2em;
  border: none;
  background: #ff9800;
  color: white;
  border-radius: 10px;
}
</style>
</head>

<body>

<div id="splash">
  <img src="assets/logo.png" alt="Logo">
</div>

<div class="container">
  <h1 id="levelTitle"></h1>
  <div id="scoreBoard">Score: 0</div>

  <div class="question" id="question"></div>
  <div class="options" id="options"></div>

  <div id="potionContainer">
    <div id="potionFill"></div>
  </div>
</div>

<div id="endScreen">
  <h2 id="finalScore"></h2>
  <button id="restartBtn" onclick="location.reload()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
const levels = [
  {
    title: "Level 1 - Homophones",
    questions: [
      { q: "The cake is too ___ to eat.", options: ["sweet", "suite"], answer: "sweet" },
      { q: "I need to ___ my new shoes.", options: ["buy", "by"], answer: "buy" },
      { q: "He went to the ___ to meet his friend.", options: ["sea", "see"], answer: "see" },
      { q: "The wind will ___ the leaves away.", options: ["blow", "below"], answer: "blow" },
      { q: "She used a ___ to tie her hair.", options: ["band", "banned"], answer: "band" },
      { q: "I can't ___ what he said.", options: ["hear", "here"], answer: "hear" }
    ]
  },

  {
    title: "Level 2 - Homographs",
    questions: [
      { q: "I will ___ the book on the table.", options: ["lead - guide", "lead - metal"], answer: "lead - guide" },
      { q: "Please ___ the children to the hall.", options: ["lead - guide", "lead - metal"], answer: "lead - guide" },
      { q: "A ___ rolled down her cheek.", options: ["tear - drop", "tear - rip"], answer: "tear - drop" },
      { q: "Please do not ___ the paper.", options: ["tear - rip", "tear - drop"], answer: "tear - rip" },
      { q: "The wind began to ___ hard.", options: ["blow - move air", "blow - a kiss"], answer: "blow - move air" }
    ]
  },

  {
    title: "Level 3 - Mixed",
    questions: [
      { q: "I will ___ the window before leaving.", options: ["close - shut", "close - near"], answer: "close - shut" },
      { q: "I need to ___ my homework.", options: ["do", "due"], answer: "do" },
      { q: "The ___ is shining bright.", options: ["sun", "son"], answer: "sun" },
      { q: "The show will ___ at 7 PM.", options: ["start", "star"], answer: "start" },
      { q: "The farmer used a ___ to carry water.", options: ["pail", "pale"], answer: "pail" }
    ]
  }
];

let currentLevel = 0;
let currentQuestion = 0;
let score = 0;

const qEl = document.getElementById("question");
const optEl = document.getElementById("options");
const levelTitle = document.getElementById("levelTitle");
const scoreBoard = document.getElementById("scoreBoard");
const potionFill = document.getElementById("potionFill");
const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

function resetBottle() {
  potionFill.style.height = "0%";
}

function updateBottle() {
  const total = levels[currentLevel].questions.length;
  const progress = (currentQuestion / total) * 100;
  potionFill.style.height = progress + "%";
}

function validateLevels() {
  levels.forEach((level, levelIndex) => {
    level.questions.forEach((q, questionIndex) => {
      if (!q.options.includes(q.answer)) {
        console.warn(`Answer mismatch at Level ${levelIndex + 1}, Question ${questionIndex + 1}:`, q);
      }
    });
  });
}

function loadQuestion() {
  if (currentQuestion >= levels[currentLevel].questions.length) {
    currentLevel++;
    currentQuestion = 0;

    if (currentLevel >= levels.length) {
      endGame();
      return;
    }

    resetBottle();
  }

  const q = levels[currentLevel].questions[currentQuestion];
  levelTitle.innerText = levels[currentLevel].title;
  qEl.innerText = q.q;
  optEl.innerHTML = "";

  updateBottle();

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "btn";
    btn.innerText = opt;
    btn.onclick = () => checkAnswer(opt);
    optEl.appendChild(btn);
  });
}

function checkAnswer(opt) {
  const q = levels[currentLevel].questions[currentQuestion];

  if (!q.options.includes(opt)) {
    alert("Invalid choice.");
    return;
  }

  if (opt === q.answer) {
    score += 20;
    scoreBoard.innerText = "Score: " + score;
    if (correctSound) correctSound.play();
    currentQuestion++;
    loadQuestion();
  } else {
    if (wrongSound) wrongSound.play();
    alert("Wrong!");
  }
}

function endGame() {
  document.querySelector(".container").style.display = "none";
  document.getElementById("endScreen").style.display = "flex";

  const totalQuestions = levels.reduce((sum, level) => sum + level.questions.length, 0);
  document.getElementById("finalScore").innerText =
    "Final Score: " + score + " / " + (totalQuestions * 20);
}

setTimeout(() => {
  document.getElementById("splash").style.display = "none";
  validateLevels();
  loadQuestion();
}, 3000);
</script>

</body>
</html>
