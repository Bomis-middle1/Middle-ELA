<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Homophones & Homographs Adventure</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #1a237e, #3f51b5);
  color: white;
  overflow: hidden;
}

/* SPLASH SCREEN */
#splash {
  position: fixed;
  width: 100%;
  height: 100%;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#splash img {
  width: 40%;
}

/* GAME CONTAINER */
.container {
  max-width: 800px;
  margin: auto;
  text-align: center;
  padding-top: 40px;
}

h1 {
  font-size: 2em;
}

.question {
  font-size: 1.6em;
  margin: 20px;
}

.options {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

.btn {
  padding: 12px 20px;
  background: orange;
  border: none;
  border-radius: 8px;
  color: white;
  font-size: 1.1em;
  cursor: pointer;
}

/* END SCREEN */
#endScreen {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#endScreen h2 {
  font-size: 2.2em;
}

#restartBtn {
  margin-top: 20px;
  padding: 12px 25px;
  font-size: 1.2em;
  border: none;
  background: #ff9800;
  color: white;
  border-radius: 10px;
}
</style>

</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="assets/logo.png">
</div>

<!-- GAME -->
<div class="container">
  <h1 id="levelTitle"></h1>
  <div id="scoreBoard">Score: 0</div>

  <div class="question" id="question"></div>
  <div class="options" id="options"></div>
</div>

<!-- END SCREEN -->
<div id="endScreen">
  <h2 id="finalScore"></h2>
  <button id="restartBtn" onclick="location.reload()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>

/* LEVELS (UNCHANGED CONTENT AS REQUESTED) */
const levels = [
{
title:"Level 1 - Homophones",
questions:[
{q:"The cake is too ___ to eat.",options:["sweet","suite"],answer:"sweet"},
{q:"I need to ___ my new shoes.",options:["buy","by"],answer:"buy"},
{q:"He went to the ___ to meet his friend.",options:["sea","see"],answer:"see"},
{q:"The wind will ___ the leaves away.",options:["blow","below"],answer:"blow"},
{q:"She used a ___ to tie her hair.",options:["band","banned"],answer:"band"},
{q:"I can't ___ what he said.",options:["hear","here"],answer:"hear"}
]
},
{
title:"Level 2 - Homographs",
questions:[
{q:"I will ___ the book on the table.",options:["lead","lead"],answer:"lead"},
{q:"He used a ___ to paint the walls.",options:["bow","bowe"],answer:"bowe"},
{q:"I cannot ___ the problem.",options:["read","reed"],answer:"read"},
{q:"The soldier took a ___ to the enemy.",options:["tear","tear"],answer:"tear"},
{q:"She decided to ___ the letter.",options:["wind","winde"],answer:"wind"},
{q:"The dove will ___ peacefully.",options:["lead","lead"],answer:"lead"}
]
},
{
title:"Level 3 - Mixed",
questions:[
{q:"I will ___ the window before leaving.",options:["close","close"],answer:"close"},
{q:"I need to ___ my homework.",options:["do","due"],answer:"do"},
{q:"The ___ is shining bright.",options:["sun","son"],answer:"sun"},
{q:"The show will ___ at 7 PM.",options:["start","start"],answer:"start"},
{q:"They used a ___ to lift the box.",options:["lead","lead"],answer:"lead"}
]
}
];

let currentLevel = 0;
let currentQuestion = 0;
let score = 0;

const qEl = document.getElementById("question");
const optEl = document.getElementById("options");
const levelTitle = document.getElementById("levelTitle");
const scoreBoard = document.getElementById("scoreBoard");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");

/* LOAD QUESTION */
function loadQuestion(){

  if(currentQuestion >= levels[currentLevel].questions.length){
    currentLevel++;
    currentQuestion = 0;

    if(currentLevel >= levels.length){
      endGame();
      return;
    }
  }

  let q = levels[currentLevel].questions[currentQuestion];

  levelTitle.innerText = levels[currentLevel].title;
  qEl.innerText = q.q;

  optEl.innerHTML = "";

  q.options.forEach(opt=>{
    let btn = document.createElement("button");
    btn.className = "btn";
    btn.innerText = opt;

    btn.onclick = ()=>checkAnswer(opt);

    optEl.appendChild(btn);
  });
}

/* CHECK ANSWER */
function checkAnswer(opt){
  let q = levels[currentLevel].questions[currentQuestion];

  if(opt === q.answer){
    correctSound.play();
    score += 20;
    scoreBoard.innerText = "Score: " + score;

    currentQuestion++;
    loadQuestion();
  } else {
    wrongSound.play();
    alert("Wrong answer! Try again.");
  }
}

/* END GAME */
function endGame(){
  document.querySelector(".container").style.display = "none";
  document.getElementById("endScreen").style.display = "flex";

  document.getElementById("finalScore").innerText =
    "Final Score: " + score +
    " / " + (levels.flatMap(l=>l.questions).length * 20);
}

/* SPLASH SCREEN CONTROL */
setTimeout(()=>{
  document.getElementById("splash").style.display = "none";
  loadQuestion();
},3000);

</script>

</body>
</html>
