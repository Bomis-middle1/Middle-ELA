<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verb Detective Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:linear-gradient(to bottom,#0d1b2a,#1b263b,#415a77);overflow:hidden;}
#gameArea{position:relative;width:100vw;height:100vh;}
/* Logo Screen */
#logoScreen{position:absolute;width:100%;height:100%;background:white;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:9999;}
#logoScreen img{width:260px;max-width:80%;}
#logoText{margin-top:20px;font-size:32px;font-weight:bold;color:#333;}
/* Instructions */
#instructions{position:absolute;top:15px;width:100%;text-align:center;font-size:22px;color:white;z-index:500;}
/* Sentence */
#sentence{position:absolute;top:60px;width:100%;text-align:center;font-size:28px;color:#ffeb3b;z-index:500; margin-left:120px; margin-right:20px;}
/* Buttons */
.options{position:absolute;bottom:80px;width:100%;display:flex;justify-content:space-around;z-index:500;margin-left:120px;margin-right:20px;}
.optionBtn{padding:16px 34px;font-size:22px;border:none;border-radius:18px;background:#ff9800;color:white;cursor:pointer;transition:0.3s;}
.optionBtn:hover{transform:scale(1.05);background:#f57c00;}
/* Scoreboard */
#scoreBoard{position:absolute;top:15px;left:15px;background:white;padding:12px 18px;border-radius:15px;font-size:20px;font-weight:bold;z-index:500;}
/* Feedback */
#feedback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:bold;color:white;text-shadow:2px 2px 5px black;display:none;z-index:3000;}
/* End Screen */
#endScreen{position:absolute;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;color:white;z-index:5000;display:none;}
/* CSS Detective */
#detective{position:absolute;bottom:20px;left:20px;width:100px;height:160px;z-index:400;}
.hat{width:70px;height:20px;background:brown;border-radius:10px 10px 0 0;position:absolute;top:0;left:15px;}
.head{width:50px;height:50px;background:#f9c9b6;border-radius:50%;position:absolute;top:20px;left:25px;}
.body{width:60px;height:70px;background:#555;position:absolute;top:70px;left:20px;border-radius:10px;}
.arm{width:15px;height:50px;background:#555;position:absolute;top:70px;border-radius:10px;}
.arm.left{left:-5px;transform:rotate(-20deg);}
.arm.right{left:70px;transform:rotate(20deg);}
.magnifier{width:20px;height:20px;border:4px solid black;border-radius:50%;position:absolute;top:90px;left:70px;}
.magnifier::after{content:'';width:15px;height:4px;background:black;position:absolute;top:15px;left:18px;}
/* Confetti */
.confetti{position:absolute;width:12px;height:12px;animation:fall 3s linear forwards;}
@keyframes fall{from{transform:translateY(-100px) rotate(0deg);}to{transform:translateY(100vh) rotate(720deg);opacity:0;}}
@media(max-width:768px){#sentence{font-size:24px;margin-left:100px;} .optionBtn{font-size:18px;padding:12px 20px;}}
</style>
</head>
<body>
<div id="gameArea">

<!-- Logo -->
<div id="logoScreen">
<img src="assets/logo.png" alt="Innovine Logo">
<div id="logoText">Innovine Learning Adventures</div>
</div>

<!-- CSS Detective -->
<div id="detective">
  <div class="hat"></div>
  <div class="head"></div>
  <div class="body"></div>
  <div class="arm left"></div>
  <div class="arm right"></div>
  <div class="magnifier"></div>
</div>

<!-- Instructions -->
<div id="instructions">Read the sentence and click the verb that does not agree with the subject.</div>

<!-- Sentence -->
<div id="sentence"></div>

<!-- Option Buttons -->
<div class="options">
<button class="optionBtn" id="btn1"></button>
<button class="optionBtn" id="btn2"></button>
<button class="optionBtn" id="btn3"></button>
</div>

<!-- Score -->
<div id="scoreBoard">Score: <span id="score">0</span>/20</div>

<!-- Feedback -->
<div id="feedback"></div>

<!-- End Screen -->
<div id="endScreen">
<h1>🏆 Game Complete! 🏆</h1>
<h2 id="finalText" style="margin-top:20px;"></h2>
<button class="optionBtn" onclick="restartGame()">Play Again</button>
</div>

</div>

<script>
// Audio
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/freesound_community-claps-44774.mp3");

// 20 challenging sentences (Main/Auxiliary)
let sentences = [
{sentence:"She ___ decided to join the competition.", options:["has","run","do"], answer:"has"},
{sentence:"They ___ finished the project before the deadline.", options:["have","work","eat"], answer:"have"},
{sentence:"He ___ been waiting for hours.", options:["is","eat","run"], answer:"is"},
{sentence:"I ___ written a story about the forest.", options:["have","run","will"], answer:"have"},
{sentence:"We ___ going to celebrate her birthday.", options:["are","jump","play"], answer:"are"},
{sentence:"The team ___ practicing every evening.", options:["has","are","eat"], answer:"are"},
{sentence:"She ___ spoken to the principal.", options:["have","has","run"], answer:"has"},
{sentence:"They ___ completed the task perfectly.", options:["have","jump","is"], answer:"have"},
{sentence:"He ___ been feeling tired since morning.", options:["is","do","have"], answer:"has"},
{sentence:"I ___ never seen such a beautiful painting.", options:["have","run","will"], answer:"have"},
{sentence:"The children ___ playing in the garden.", options:["are","is","was"], answer:"are"},
{sentence:"My brother ___ already eaten his lunch.", options:["has","have","do"], answer:"has"},
{sentence:"The team ___ preparing for the final match.", options:["is","are","was"], answer:"is"},
{sentence:"She ___ never forgotten her teacher's advice.", options:["has","have","do"], answer:"has"},
{sentence:"They ___ working hard on the project.", options:["are","is","was"], answer:"are"},
{sentence:"The cat ___ hiding under the sofa.", options:["is","are","was"], answer:"is"},
{sentence:"We ___ been to the museum twice this month.", options:["have","has","do"], answer:"have"},
{sentence:"He ___ learning French for two years.", options:["has","have","do"], answer:"has"},
{sentence:"The students ___ reading their textbooks quietly.", options:["are","is","was"], answer:"are"},
{sentence:"She ___ making a delicious cake for the party.", options:["is","are","was"], answer:"is"}
];

let score = 0;
let usedSentences = [];
let currentSentence;

// Elements
const sentenceDiv = document.getElementById("sentence");
const feedback = document.getElementById("feedback");
const scoreBoard = document.getElementById("score");
const endScreen = document.getElementById("endScreen");
const finalText = document.getElementById("finalText");
const btns = [document.getElementById("btn1"), document.getElementById("btn2"), document.getElementById("btn3")];

// Button events
btns.forEach((btn,i)=>btn.addEventListener("click",()=>checkAnswer(btn.textContent)));

function nextSentence(){
    if(usedSentences.length >= sentences.length){ endGame(); return; }
    let remaining = sentences.filter(s=>!usedSentences.includes(s));
    currentSentence = remaining[Math.floor(Math.random()*remaining.length)];
    usedSentences.push(currentSentence);

    sentenceDiv.textContent = currentSentence.sentence;

    // Randomize options
    let opts = [...currentSentence.options].sort(()=>Math.random()-0.5);
    for(let i=0;i<3;i++){ btns[i].textContent = opts[i]; }
}

function checkAnswer(choice){
    if(choice === currentSentence.answer){
        score++;
        try{ correctSound.play(); clapSound.play(); }catch(e){}
        createConfetti();
        showFeedback("🎉 Correct!");
    }else{
        try{ wrongSound.play(); }catch(e){}
        showFeedback("❌ Wrong!");
    }
    scoreBoard.textContent = score;
    setTimeout(nextSentence,500);
}

function showFeedback(text){
    feedback.textContent = text;
    feedback.style.display="block";
    setTimeout(()=>{feedback.style.display="none";},1000);
}

function createConfetti(){
    for(let i=0;i<20;i++){
        const conf = document.createElement("div");
        conf.classList.add("confetti");
        conf.style.left=Math.random()*100+"%";
        conf.style.background=`hsl(${Math.random()*360},100%,50%)`;
        conf.style.animationDuration=(2+Math.random()*2)+"s";
        document.body.appendChild(conf);
        setTimeout(()=>{conf.remove();},4000);
    }
}

function endGame(){
    endScreen.style.display="flex";
    finalText.innerHTML = `You scored <b>${score}</b> out of 20!`;
}

function restartGame(){ location.reload(); }

// Automatically start game after 5 seconds
setTimeout(()=>{
    document.getElementById("logoScreen").style.display="none";
    nextSentence();
},5000);
</script>
</body>
</html>
