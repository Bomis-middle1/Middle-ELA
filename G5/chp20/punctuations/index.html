<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punctuation Power Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top left, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
  background-size: 400% 400%;
  animation: glow 10s ease infinite;
  overflow: hidden;
}

@keyframes glow {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* SPLASH */
#splash {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* GAME LAYOUT */
#game {
  display: none;
  padding: 10px;
  text-align: center;
}

.header {
  font-size: 22px;
  font-weight: bold;
  margin: 5px;
}

.subheader {
  font-size: 16px;
  margin-bottom: 10px;
}

.progress {
  font-size: 14px;
  margin-bottom: 10px;
}

/* LAYOUT */
.container {
  display: flex;
  gap: 10px;
  justify-content: center;
}

/* LEFT SENTENCES */
#sentences {
  width: 45%;
  min-height: 400px;
  background: rgba(255,255,255,0.4);
  border-radius: 12px;
  padding: 10px;
}

.sentence {
  background: #ffb300;
  margin: 8px;
  padding: 10px;
  border-radius: 10px;
  cursor: grab;
  font-size: 14px;
}

/* RIGHT BUCKETS */
#buckets {
  width: 45%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bucket {
  min-height: 80px;
  background: rgba(255,255,255,0.5);
  border: 2px dashed #333;
  border-radius: 10px;
  padding: 10px;
}

.bucket h3 {
  margin: 0;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="assets/logo.png" width="200">
</div>

<!-- GAME -->
<div id="game">

  <div class="header">Punctuation Power Dashboard</div>
  <div class="subheader">Grade 5 Grammar – Punctuation Mastery</div>
  <div class="progress" id="progress">Progress: 0 / 15 Sentences</div>

  <div class="container">

    <!-- SENTENCES -->
    <div id="sentences"></div>

    <!-- BUCKETS -->
    <div id="buckets">

      <div class="bucket" data-type="?">
        <h3>Question Mark (?)</h3>
      </div>

      <div class="bucket" data-type="!">
        <h3>Exclamation Mark (!)</h3>
      </div>

      <div class="bucket" data-type=".">
        <h3>Full Stop (.)</h3>
      </div>

      <div class="bucket" data-type=",">
        <h3>Comma (,)</h3>
      </div>

    </div>

  </div>
</div>

<script>

const sentences = [
{ text:"What time does the train arrive", type:"?" },
{ text:"How beautiful the sunset is", type:"!" },
{ text:"I went to the market with my mother", type:"." },
{ text:"Although it was raining the match continued", type:"," },

{ text:"Did you complete your homework", type:"?" },
{ text:"Wow that performance was incredible", type:"!" },
{ text:"She enjoys reading books in the evening", type:"." },
{ text:"While walking to school I met my friend", type:"," },

{ text:"Where did you place the science notebook", type:"?" },
{ text:"This is the best day ever", type:"!" },
{ text:"The teacher explained the concept clearly", type:"." },
{ text:"Because he was late he missed the bus", type:"," },

{ text:"Why are you so quiet today", type:"?" },
{ text:"What a fantastic achievement", type:"!" },
{ text:"We are learning punctuation in grammar class", type:"." }
];

let progress = 0;

const sentenceBox = document.getElementById("sentences");
const progressBox = document.getElementById("progress");

/* LOAD SENTENCES */
function load(){
  sentenceBox.innerHTML = "";

  sentences.forEach((s,i)=>{
    const div = document.createElement("div");
    div.className = "sentence";
    div.draggable = true;
    div.textContent = s.text;
    div.dataset.type = s.type;

    div.ondragstart = e=>{
      e.dataTransfer.setData("text", JSON.stringify(s));
    };

    sentenceBox.appendChild(div);
  });
}

/* BUCKET LOGIC */
document.querySelectorAll(".bucket").forEach(bucket=>{
  bucket.ondragover = e=>e.preventDefault();

  bucket.ondrop = e=>{
    e.preventDefault();
    const data = JSON.parse(e.dataTransfer.getData("text"));

    if(data.type === bucket.dataset.type){
      progress++;
      progressBox.textContent = `Progress: ${progress} / 15 Sentences`;
      sentences.splice(sentences.findIndex(s=>s.text===data.text),1);
      load();
    }
  };
});

/* SPLASH CONTROL (FIXED - NO REPEAT BUG) */
window.onload = ()=>{
  setTimeout(()=>{
    document.getElementById("splash").style.display="none";
    document.getElementById("game").style.display="block";
    load();
  },3000);
};

</script>

</body>
</html>
