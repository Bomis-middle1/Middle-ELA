<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adverb Racing Dash</title>
<style>
body, html { margin:0; padding:0; font-family: Arial, sans-serif; overflow:hidden; }
#gameArea { position:relative; width:100vw; height:100vh; background:linear-gradient(120deg,#ffe0f0,#e0f7fa); }

#logoScreen {
    position:absolute; width:100%; height:100%; background:white; display:flex;
    justify-content:center; align-items:center; flex-direction:column; z-index:9999;
}
#logoScreen img { width:260px; max-width:80%; }
#logoText { margin-top:20px; font-size:32px; font-weight:bold; color:#333; }

#instructions { position:absolute; top:15px; width:100%; text-align:center; font-size:22px; color:black; z-index:500; }

#track {
    position:absolute; bottom:100px; left:10%; width:80%; height:200px; background:url('assets/track.png') no-repeat center/cover; border-radius:25px;
}

#kart {
    position:absolute; bottom:120px; left:50px; width:80px; height:80px; z-index:400;
}

#sentence {
    position:absolute; top:60px; width:80%; text-align:center; font-size:28px; color:#000; left:50%; transform:translateX(-50%);
}

.options { position:absolute; bottom:30px; width:100%; display:flex; justify-content:space-around; z-index:500; }
.optionBtn { padding:16px 30px; font-size:20px; border:none; border-radius:18px; background:#ff9800; color:white; cursor:pointer; transition:0.3s; }
.optionBtn:hover{ transform:scale(1.05); background:#f57c00; }

#scoreBoard {
    position:absolute; top:15px; left:15px; background:white; padding:12px 18px;
    border-radius:15px; font-size:20px; font-weight:bold; z-index:500;
}

#feedback {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:40px; font-weight:bold; color:white; text-shadow:2px 2px 5px black; display:none; z-index:3000;
}

.confetti { position:absolute; width:12px; height:12px; animation:fall 3s linear forwards; }
@keyframes fall {
    from{transform:translateY(-100px) rotate(0deg);}
    to{transform:translateY(100vh) rotate(720deg); opacity:0;}
}

#endScreen {
    position:absolute; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex;
    justify-content:center; align-items:center; flex-direction:column; text-align:center; color:white; z-index:5000; display:none;
}

@media(max-width:768px){
    #sentence{font-size:24px;}
    .optionBtn{font-size:18px; padding:12px 18px;}
    #kart{width:60px;height:60px;}
}
</style>
</head>
<body>
<div id="gameArea">

<div id="logoScreen">
<img src="assets/logo.png" alt="Innovine Logo">
<div id="logoText">Innovine Learning Adventures</div>
</div>

<div id="instructions">Select the correct adverb to dash forward!</div>

<div id="track"></div>

<img src="assets/boy1.png" id="kart" alt="Racing Boy">

<div id="sentence"></div>

<div class="options">
<button class="optionBtn" id="btn1"></button>
<button class="optionBtn" id="btn2"></button>
<button class="optionBtn" id="btn3"></button>
<button class="optionBtn" id="btn4"></button>
</div>

<div id="scoreBoard">Score: <span id="score">0</span>/15</div>

<div id="feedback"></div>

<div id="endScreen">
<h1>🏁 Finish Line! 🏁</h1>
<h2 id="finalText" style="margin-top:20px;"></h2>
</div>
</div>

<script>
const sentences = [
  {text:"We will meet ___ at the park.", correct:"there", options:["here","there","soon","red"]},
  {text:"She sings ___ in the choir.", correct:"beautifully", options:["beautifully","quickly","loud","green"]},
  {text:"They arrived ___ to the party.", correct:"early", options:["fast","early","slow","happy"]},
  {text:"He finished the work ___ than expected.", correct:"faster", options:["faster","softly","hard","near"]},
  {text:"I will call you ___ tomorrow.", correct:"later", options:["soon","later","red","quickly"]},
  {text:"The dog barked ___ at the stranger.", correct:"loudly", options:["loudly","softly","here","blue"]},
  {text:"She danced ___ on stage.", correct:"gracefully", options:["gracefully","well","bright","fast"]},
  {text:"They worked ___ to complete the project.", correct:"diligently", options:["diligently","hardly","near","soft"]},
  {text:"He runs ___ than anyone else.", correct:"faster", options:["faster","slow","quick","green"]},
  {text:"The kids played ___ in the garden.", correct:"happily", options:["sadly","happily","blue","soon"]},
  {text:"I will arrive ___ than you.", correct:"earlier", options:["earlier","later","soft","hard"]},
  {text:"She answered ___ to the question.", correct:"correctly", options:["correctly","wrongly","red","blue"]},
  {text:"The wind blows ___ in winter.", correct:"strongly", options:["strongly","softly","green","here"]},
  {text:"He spoke ___ to the audience.", correct:"loudly", options:["loudly","quietly","soon","happy"]},
  {text:"They finished the game ___ than expected.", correct:"quickly", options:["quickly","slowly","here","there"]}
];

let current=0;
let score=0;
const kart = document.getElementById('kart');
const sentenceDiv = document.getElementById('sentence');
const buttons = [...document.querySelectorAll('.optionBtn')];
const scoreBoard = document.getElementById('score');
const feedback = document.getElementById('feedback');
const endScreen = document.getElementById('endScreen');
const finalText = document.getElementById('finalText');
const correctAudio = new Audio('assets/correct.mp3');
const wrongAudio = new Audio('assets/wrong.mp3');

function loadSentence(){
    const s = sentences[current];
    sentenceDiv.textContent = s.text;
    buttons.forEach((b,i)=> b.textContent=s.options[i]);
}

buttons.forEach(b=>{
    b.addEventListener('click',()=>{
        const s = sentences[current];
        if(b.textContent===s.correct){
            score++; scoreBoard.textContent=score;
            correctAudio.play();
            moveKart();
        }else{ wrongAudio.play(); }
        current++;
        if(current>=sentences.length){ endGame(); }
        else{ loadSentence(); }
    });
});

function moveKart(){
    const step = (window.innerWidth*0.7)/sentences.length;
    const left = parseInt(kart.style.left || 50);
    kart.style.left = (left+step) + 'px';
}

function endGame(){
    endScreen.style.display='flex';
    finalText.textContent="You finished the race! Score: "+score+"/"+sentences.length;
}

window.onload = () => {
    setTimeout(()=>{ document.getElementById('logoScreen').style.display='none'; loadSentence(); },5000);
};
</script>
</body>
</html>
