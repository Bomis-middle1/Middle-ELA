<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adverb Adventure Dash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body {
  background: linear-gradient(135deg,#FFC0CB 0%,#ADD8E6 50%,#E6E6FA 75%,#FFFACD 100%);
  overflow:hidden;
}
#gameArea{position:relative;width:100vw;height:100vh;}

/* Logo Screen */
#logoScreen{
position:absolute;width:100%;height:100%;background:white;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:9999;
}
#logoScreen img{width:260px;max-width:80%;}
#logoText{margin-top:20px;font-size:32px;font-weight:bold;color:#333;}

/* Instructions */
#instructions{position:absolute;top:15px;width:100%;text-align:center;font-size:22px;color:white;z-index:500;}

/* CSS Character Runner */
#runner{
position:absolute;bottom:150px;left:20px;width:50px;height:80px;z-index:400;}
#head{width:30px;height:30px;background:#f9c9b6;border-radius:50%;margin:auto;}
#body{width:20px;height:50px;background:#555;margin:auto;position:relative;top:-5px;}
.arm, .leg{width:5px;height:30px;background:#555;position:absolute;top:5px;}
.arm.left{left:-10px;transform:rotate(-30deg);}
.arm.right{right:-10px;transform:rotate(30deg);}
.leg.left{left:0;bottom:-10px;transform:rotate(20deg);}
.leg.right{right:0;bottom:-10px;transform:rotate(-20deg);}
@keyframes run{0%{transform:translateX(0);}100%{transform:translateX(80vw);}}

/* Sentence */
#sentence{position:absolute;top:60px;width:80%;text-align:center;font-size:28px;color:#1a1a1a;z-index:500;left:50%;transform:translateX(-50%);}

/* Options */
.options{position:absolute;bottom:80px;width:100%;display:flex;justify-content:space-around;z-index:500;}
.optionBtn{padding:16px 34px;font-size:22px;border:none;border-radius:18px;background:#ff9800;color:white;cursor:pointer;transition:0.3s;}
.optionBtn:hover{transform:scale(1.05);background:#f57c00;}

/* Scoreboard */
#scoreBoard{position:absolute;top:15px;left:15px;background:white;padding:12px 18px;border-radius:15px;font-size:20px;font-weight:bold;z-index:500;}

/* Feedback */
#feedback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:bold;color:white;text-shadow:2px 2px 5px black;display:none;z-index:3000;}

/* Confetti */
.confetti{position:absolute;width:12px;height:12px;animation:fall 3s linear forwards;}
@keyframes fall{from{transform:translateY(-100px) rotate(0deg);}to{transform:translateY(100vh) rotate(720deg);opacity:0;}}

/* End Screen */
#endScreen{position:absolute;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;color:white;z-index:5000;display:none;}

@media(max-width:768px){
#sentence{font-size:24px;}
.optionBtn{font-size:18px;padding:12px 20px;}
#runner{width:40px;height:70px;}
#head{width:25px;height:25px;}
#body{width:15px;height:45px;}
}
</style>
</head>
<body>
<div id="gameArea">

<!-- Logo -->
<div id="logoScreen">
<img src="assets/logo.png" alt="Innovine Logo">
<div id="logoText">Innovine Learning Adventures</div>
</div>

<!-- Instructions -->
<div id="instructions">Select the correct adverb to dash forward!</div>

<!-- CSS Runner -->
<div id="runner">
  <div id="head"></div>
  <div id="body"></div>
  <div class="arm left"></div>
  <div class="arm right"></div>
  <div class="leg left"></div>
  <div class="leg right"></div>
</div>

<!-- Sentence -->
<div id="sentence"></div>

<!-- Option Buttons -->
<div class="options">
<button class="optionBtn" id="btn1"></button>
<button class="optionBtn" id="btn2"></button>
<button class="optionBtn" id="btn3"></button>
</div>

<!-- Score -->
<div id="scoreBoard">Score: <span id="score">0</span>/20</div>

<!-- Feedback -->
<div id="feedback"></div>

<!-- End Screen -->
<div id="endScreen">
<h1>🏆 Adventure Complete! 🏆</h1>
<h2 id="finalText" style="margin-top:20px;"></h2>
<button class="optionBtn" onclick="restartGame()">Play Again</button>
</div>

</div>

<script>
// Audio
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/freesound_community-claps-44774.mp3");

// Adverb Sentences
let sentences=[
{sentence:"She ran ___ to catch the bus.", options:["quickly","quiet","blue"], answer:"quickly"},
{sentence:"He speaks ___ in the class.", options:["loudly","happy","cat"], answer:"loudly"},
{sentence:"They finished the project ___ before the deadline.", options:["successfully","fast","dog"], answer:"successfully"},
{sentence:"I will call you ___ tomorrow.", options:["later","soft","book"], answer:"later"},
{sentence:"The cat slept ___ on the sofa.", options:["peacefully","green","walk"], answer:"peacefully"},
{sentence:"We will meet ___ at the park.", options:["there","small","red"], answer:"there"},
{sentence:"She smiled ___ when she saw the gift.", options:["happily","slow","tree"], answer:"happily"},
{sentence:"He answered the question ___ in class.", options:["correctly","blue","round"], answer:"correctly"},
{sentence:"They completed the task ___ without mistakes.", options:["perfectly","fast","moon"], answer:"perfectly"},
{sentence:"I did my homework ___ last night.", options:["carefully","soft","star"], answer:"carefully"},
{sentence:"The children played ___ in the playground.", options:["loudly","green","fast"], answer:"loudly"},
{sentence:"She waited ___ for the bus to arrive.", options:["patiently","yellow","quick"], answer:"patiently"},
{sentence:"He ran ___ to win the race.", options:["quickly","slow","dog"], answer:"quickly"},
{sentence:"The baby slept ___ during the night.", options:["peacefully","red","happy"], answer:"peacefully"},
{sentence:"I will explain the lesson ___ tomorrow.", options:["clearly","round","soft"], answer:"clearly"},
{sentence:"She listened ___ to the teacher.", options:["carefully","green","blue"], answer:"carefully"},
{sentence:"They worked ___ to finish the project.", options:["hard","yellow","tree"], answer:"hard"},
{sentence:"He danced ___ at the party.", options:["gracefully","soft","fast"], answer:"gracefully"},
{sentence:"We will travel ___ to the city.", options:["quickly","green","book"], answer:"quickly"},
{sentence:"She finished the book ___ in one day.", options:["easily","blue","moon"], answer:"easily"}
];

let score=0;
let usedSentences=[];
let currentSentence;

// Elements
const sentenceDiv=document.getElementById("sentence");
const feedback=document.getElementById("feedback");
const scoreBoard=document.getElementById("score");
const endScreen=document.getElementById("endScreen");
const finalText=document.getElementById("finalText");
const btns=[document.getElementById("btn1"),document.getElementById("btn2"),document.getElementById("btn3")];
const runner=document.getElementById("runner");

// Button events
btns.forEach((btn)=>btn.addEventListener("click",()=>checkAnswer(btn.textContent)));

function nextSentence(){
if(usedSentences.length>=sentences.length){endGame();return;}
let remaining=sentences.filter(s=>!usedSentences.includes(s));
currentSentence=remaining[Math.floor(Math.random()*remaining.length)];
usedSentences.push(currentSentence);
sentenceDiv.textContent=currentSentence.sentence;
let opts=[...currentSentence.options].sort(()=>Math.random()-0.5);
for(let i=0;i<3;i++){btns[i].textContent=opts[i];}
}

function checkAnswer(choice){
if(choice===currentSentence.answer){
score++;
try{correctSound.play();clapSound.play();}catch(e){}
showFeedback("🎉 Correct!");
moveRunner();
}else{
try{wrongSound.play();}catch(e){}
showFeedback("❌ Wrong!");
}
scoreBoard.textContent=score;
setTimeout(nextSentence,500);
}

function showFeedback(text){
feedback.textContent=text;
feedback.style.display="block";
setTimeout(()=>{feedback.style.display="none";},1000);
}

function moveRunner(){
runner.style.transition="transform 0.5s linear";
runner.style.transform=`translateX(${score*35}px)`;
createConfetti();
}

function createConfetti(){
for(let i=0;i<20;i++){
const conf=document.createElement("div");
conf.classList.add("confetti");
conf.style.left=Math.random()*100+"%";
conf.style.background=`hsl(${Math.random()*360},100%,50%)`;
conf.style.animationDuration=(2+Math.random()*2)+"s";
document.body.appendChild(conf);
setTimeout(()=>{conf.remove();},4000);
}
}

function endGame(){
endScreen.style.display="flex";
finalText.innerHTML=`You scored <b>${score}</b> out of 20!`;
}

function restartGame(){location.reload();}

// Start game after 5-second logo
setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
nextSentence();
},5000);
</script>
</body>
</html>
