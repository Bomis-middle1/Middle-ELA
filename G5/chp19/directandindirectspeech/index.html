<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Direct & Indirect Speech Challenge</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background: linear-gradient(to right, #a1c4fd, #c2e9fb);
}

/* Splash */
#splash {
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:100;
}

/* Game box */
#game {
    display:none;
    width:90%;
    max-width:900px;
    text-align:center;
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

#instruction {
    font-size:1.5rem;
    font-weight:bold;
    color:#6a1b9a;
}

#sentence {
    font-size:2rem;
    font-weight:bold;
    margin:20px 0;
    color:#0d47a1;
}

#input {
    width:90%;
    padding:15px;
    font-size:1.2rem;
    border-radius:10px;
    border:2px solid #6a1b9a;
}

button {
    margin-top:15px;
    padding:12px 25px;
    font-size:1.2rem;
    border:none;
    border-radius:10px;
    background:#fbc02d;
    cursor:pointer;
}

#score, #timer {
    font-size:1.3rem;
    font-weight:bold;
    margin:10px;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
    <img src="assets/logo.png" width="250">
</div>

<!-- GAME -->
<div id="game">

    <div id="score">Score: 0 / 15</div>
    <div id="timer">Time Left: 60s</div>

    <div id="instruction">Instruction</div>
    <div id="sentence">Sentence</div>

    <input type="text" id="input" placeholder="Type answer here...">
    <br>
    <button onclick="check()">Submit</button>

</div>

<!-- AUDIO -->
<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>
<audio id="clap" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

let current = 0;
let score = 0;
let time = 60;
let timer;

const instruction = document.getElementById("instruction");
const sentence = document.getElementById("sentence");
const input = document.getElementById("input");
const scoreBox = document.getElementById("score");
const timerBox = document.getElementById("timer");

const correct = document.getElementById("correct");
const wrong = document.getElementById("wrong");
const clap = document.getElementById("clap");

/* 15 MIXED QUESTIONS */
const questions = [
{
type:"Indirect → Direct",
q:"He said that he was reading a book.",
a:"He said, 'I am reading a book.'"
},
{
type:"Direct → Indirect",
q:"She said, 'I will complete my homework.'",
a:"She said that she would complete her homework."
},
{
type:"Indirect → Direct",
q:"They said that they were going to the park.",
a:"They said, 'We are going to the park.'"
},
{
type:"Direct → Indirect",
q:"The teacher said, 'The Earth revolves around the Sun.'",
a:"The teacher said that the Earth revolves around the Sun."
},
{
type:"Indirect → Direct",
q:"Riya said that she could solve the problem.",
a:"Riya said, 'I can solve the problem.'"
},
{
type:"Direct → Indirect",
q:"He said, 'I am playing football.'",
a:"He said that he was playing football."
},
{
type:"Indirect → Direct",
q:"They said that they would attend the meeting.",
a:"They said, 'We will attend the meeting.'"
},
{
type:"Direct → Indirect",
q:"She said, 'I have finished my project.'",
a:"She said that she had finished her project."
},
{
type:"Indirect → Direct",
q:"Rahul said that he did not like that movie.",
a:"Rahul said, 'I do not like this movie.'"
},
{
type:"Direct → Indirect",
q:"The boy said, 'I am going to school.'",
a:"The boy said that he was going to school."
},
{
type:"Indirect → Direct",
q:"Maya said that she would call me tomorrow.",
a:"Maya said, 'I will call you tomorrow.'"
},
{
type:"Direct → Indirect",
q:"He said, 'I was sleeping when you called.'",
a:"He said that he had been sleeping when I called."
},
{
type:"Indirect → Direct",
q:"They said that they were happy that day.",
a:"They said, 'We are happy today.'"
},
{
type:"Direct → Indirect",
q:"She said, 'I can swim very fast.'",
a:"She said that she could swim very fast."
},
{
type:"Indirect → Direct",
q:"The teacher said that the test would be conducted the next day.",
a:"The teacher said, 'The test will be conducted tomorrow.'"
}
];

function load(){
    sentence.innerText = questions[current].q;
    instruction.innerText = questions[current].type;
    input.value = "";
}

/* TIMER */
function startTimer(){
    clearInterval(timer);
    time = 60;
    timerBox.innerText = "Time Left: " + time;

    timer = setInterval(()=>{
        time--;
        timerBox.innerText = "Time Left: " + time;
        if(time<=0){
            next();
        }
    },1000);
}

/* CHECK ANSWER */
function check(){
    let user = input.value.trim().toLowerCase();
    let correctAns = questions[current].a.toLowerCase();

    if(user === correctAns){
        score++;
        scoreBox.innerText = "Score: " + score + " / 15";
        correct.play();
    } else {
        wrong.play();
    }

    next();
}

/* NEXT */
function next(){
    current++;
    if(current>=questions.length){
        clearInterval(timer);
        clap.play();
        sentence.innerText = "Game Completed!";
        instruction.innerText = "Well Done!";
        input.style.display = "none";
        return;
    }
    load();
    startTimer();
}

/* START GAME */
function startGame(){
    splash.style.display="none";
    game.style.display="block";
    load();
    startTimer();
}

/* splash control */
setTimeout(startGame,5000);

</script>

</body>
</html>
