<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punctuation Power Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top left, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
  background-size: 400% 400%;
  animation: bg 10s ease infinite;
  overflow: hidden;
}

@keyframes bg {
  0% {background-position:0% 50%;}
  50% {background-position:100% 50%;}
  100% {background-position:0% 50%;}
}

/* SPLASH */
#splash {
  position: fixed;
  inset: 0;
  background: white;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* HEADER */
.header {
  text-align: center;
  padding: 10px;
  font-weight: bold;
}

/* DASHBOARD */
#game {
  display: none;
  padding: 10px;
}

.container {
  display: flex;
  gap: 10px;
}

/* LEFT */
.left {
  width: 55%;
  background: rgba(255,255,255,0.4);
  border-radius: 12px;
  padding: 10px;
}

.sentence {
  background: #ffb300;
  padding: 10px;
  margin: 8px;
  border-radius: 10px;
  cursor: grab;
}

/* RIGHT */
.right {
  width: 45%;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* KPI */
.kpi {
  background: white;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}

/* BUCKETS */
.bucket {
  min-height: 70px;
  background: rgba(255,255,255,0.5);
  border: 2px dashed #333;
  border-radius: 10px;
  padding: 10px;
}

/* FEEDBACK */
#feedback {
  background: white;
  padding: 10px;
  border-radius: 10px;
  text-align: center;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash">
  <img src="assets/logo.png" width="200">
</div>

<!-- GAME -->
<div id="game">

  <div class="header">
    Punctuation Power Dashboard <br>
    <small>Grade 5 Grammar – Punctuation Mastery</small><br>
    <b id="progress">Progress: 0 / 15</b>
  </div>

  <div class="container">

    <!-- LEFT -->
    <div class="left" id="sentences"></div>

    <!-- RIGHT -->
    <div class="right">

      <div class="kpi" id="kpi">Accuracy: 0%</div>

      <div class="bucket" data-type="?">Question Mark (?)</div>
      <div class="bucket" data-type="!">Exclamation (!)</div>
      <div class="bucket" data-type=".">Full Stop (.)</div>
      <div class="bucket" data-type=",">Comma (,)</div>

      <div id="feedback">Drag sentences into correct punctuation buckets</div>

    </div>
  </div>
</div>

<script>

const data = [
{t:"What is your name", type:"?"},
{t:"How beautiful this place is", type:"!"},
{t:"I went to school today", type:"."},
{t:"Although he was tired he kept working", type:","},

{t:"Where are you going", type:"?"},
{t:"What a wonderful surprise", type:"!"},
{t:"She is reading a book", type:"."},
{t:"Because it was late he left early", type:","},

{t:"Did you complete the task", type:"?"},
{t:"That is unbelievable", type:"!"},
{t:"We are learning grammar", type:"."},
{t:"While walking home I saw him", type:","},

{t:"Why are you crying", type:"?"},
{t:"This is amazing", type:"!"},
{t:"They are playing outside", type:"."}
];

let correct = 0;

const box = document.getElementById("sentences");
const progress = document.getElementById("progress");
const kpi = document.getElementById("kpi");
const feedback = document.getElementById("feedback");

/* LOAD */
function load(){
  box.innerHTML = "";

  data.forEach(d=>{
    let div = document.createElement("div");
    div.className = "sentence";
    div.draggable = true;
    div.innerText = d.t;
    div.dataset.type = d.type;

    div.ondragstart = e=>{
      e.dataTransfer.setData("text", JSON.stringify(d));
    };

    box.appendChild(div);
  });
}

/* BUCKETS */
document.querySelectorAll(".bucket").forEach(b=>{
  b.ondragover = e=>e.preventDefault();

  b.ondrop = e=>{
    let d = JSON.parse(e.dataTransfer.getData("text"));

    if(d.type === b.dataset.type){
      correct++;
      feedback.innerText = "Correct ✔";
    } else {
      feedback.innerText = "Try again";
    }

    progress.innerText = `Progress: ${correct} / 15`;
    kpi.innerText = `Accuracy: ${Math.round((correct/15)*100)}%`;

    data.splice(data.findIndex(x=>x.t===d.t),1);
    load();
  };
});

/* SPLASH FIXED */
window.onload = ()=>{
  setTimeout(()=>{
    document.getElementById("splash").style.display="none";
    document.getElementById("game").style.display="block";
    load();
  },3000);
};

</script>

</body>
</html>
