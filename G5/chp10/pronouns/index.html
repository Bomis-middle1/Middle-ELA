<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronoun Quiz Tower</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body {
  background: linear-gradient(135deg,#FFC0CB 0%,#ADD8E6 50%,#E6E6FA 75%,#FFFACD 100%);
  overflow:hidden;
}
#gameArea{position:relative;width:100vw;height:100vh;}
/* Logo Screen */
#logoScreen{
position:absolute;width:100%;height:100%;background:white;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:9999;
}
#logoScreen img{width:260px;max-width:80%;}
#logoText{margin-top:20px;font-size:32px;font-weight:bold;color:#333;}
/* Instructions */
#instructions{position:absolute;top:15px;width:100%;text-align:center;font-size:22px;color:white;z-index:500;}
/* Sentence */
#sentence{position:absolute;top:60px;width:100%;text-align:center;font-size:28px;color:#1a1a1a;z-index:500;max-width:70%;left:50%;transform:translateX(-50%);}
/* Buttons */
.options{position:absolute;bottom:80px;width:100%;display:flex;justify-content:space-around;z-index:500;}
.optionBtn{padding:16px 34px;font-size:22px;border:none;border-radius:18px;background:#ff9800;color:white;cursor:pointer;transition:0.3s;}
.optionBtn:hover{transform:scale(1.05);background:#f57c00;}
/* Scoreboard */
#scoreBoard{position:absolute;top:15px;left:15px;background:white;padding:12px 18px;border-radius:15px;font-size:20px;font-weight:bold;z-index:500;}
/* Tower */
#towerArea{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);width:150px;height:400px;background:rgba(255,255,255,0.3);border:2px solid #fff;border-radius:10px;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;overflow:hidden;z-index:200;}
.block{width:120px;height:40px;background:#ff9800;margin:4px 0;border-radius:6px;color:white;display:flex;justify-content:center;align-items:center;font-weight:bold;font-size:18px;transition:all 0.3s;}
/* Feedback */
#feedback{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:bold;color:white;text-shadow:2px 2px 5px black;display:none;z-index:3000;}
/* End Screen */
#endScreen{position:absolute;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;flex-direction:column;text-align:center;color:white;z-index:5000;display:none;}
/* Confetti */
.confetti{position:absolute;width:12px;height:12px;animation:fall 3s linear forwards;}
@keyframes fall{from{transform:translateY(-100px) rotate(0deg);}to{transform:translateY(100vh) rotate(720deg);opacity:0;}}
@media(max-width:768px){#sentence{font-size:24px;max-width:80%;} .optionBtn{font-size:18px;padding:12px 20px;} #towerArea{width:120px;height:300px;} .block{width:90px;height:35px;font-size:16px;}}
</style>
</head>
<body>
<div id="gameArea">

<!-- Logo -->
<div id="logoScreen">
<img src="assets/logo.png" alt="Innovine Logo">
<div id="logoText">Innovine Learning Adventures</div>
</div>

<!-- Instructions -->
<div id="instructions">Select the correct pronoun to build the tower!</div>

<!-- Sentence -->
<div id="sentence"></div>

<!-- Option Buttons -->
<div class="options">
<button class="optionBtn" id="btn1"></button>
<button class="optionBtn" id="btn2"></button>
<button class="optionBtn" id="btn3"></button>
</div>

<!-- Score -->
<div id="scoreBoard">Score: <span id="score">0</span>/20</div>

<!-- Tower Area -->
<div id="towerArea"></div>

<!-- Feedback -->
<div id="feedback"></div>

<!-- End Screen -->
<div id="endScreen">
<h1>🏆 Tower Complete! 🏆</h1>
<h2 id="finalText" style="margin-top:20px;"></h2>
<button class="optionBtn" onclick="restartGame()">Play Again</button>
</div>

</div>

<script>
// Audio
const correctSound = new Audio("assets/correct.mp3");
const wrongSound = new Audio("assets/wrong.mp3");
const clapSound = new Audio("assets/freesound_community-claps-44774.mp3");

// 20 Pronoun sentences
let sentences=[
{sentence:"___ went to the park.", options:["He","They","Her"], answer:"He"},
{sentence:"This is ___ book.", options:["my","I","Me"], answer:"my"},
{sentence:"Please give the bag to ___ .", options:["him","he","they"], answer:"him"},
{sentence:"___ are going to the library.", options:["We","Us","Me"], answer:"We"},
{sentence:"She made this cake by ___ .", options:["herself","she","her"], answer:"herself"},
{sentence:"___ is your favorite color?", options:["Which","Who","Whom"], answer:"Which"},
{sentence:"___ will help us tomorrow.", options:["They","Them","Their"], answer:"They"},
{sentence:"Is this pen ___ ?", options:["yours","your","you"], answer:"yours"},
{sentence:"___ cleaned the classroom.", options:["I","Me","My"], answer:"I"},
{sentence:"The teacher gave ___ a reward.", options:["us","we","our"], answer:"us"},
{sentence:"___ are responsible for this project.", options:["We","Us","Our"], answer:"We"},
{sentence:"He solved the problem by ___ .", options:["himself","he","his"], answer:"himself"},
{sentence:"Is this homework ___ ?", options:["theirs","their","they"], answer:"theirs"},
{sentence:"Can you help ___ with this task?", options:["me","I","my"], answer:"me"},
{sentence:"___ is waiting at the door.", options:["She","Her","Hers"], answer:"She"},
{sentence:"The prize belongs to ___ .", options:["them","they","their"], answer:"them"},
{sentence:"I have never met ___ before.", options:["him","he","his"], answer:"him"},
{sentence:"___ loves reading books.", options:["He","Him","His"], answer:"He"},
{sentence:"This gift is for ___ .", options:["you","your","yours"], answer:"you"},
{sentence:"We enjoyed the trip by ourselves and not by ___ .", options:["them","they","their"], answer:"them"}
];

let score=0;
let usedSentences=[];
let currentSentence;

// Elements
const sentenceDiv=document.getElementById("sentence");
const feedback=document.getElementById("feedback");
const scoreBoard=document.getElementById("score");
const endScreen=document.getElementById("endScreen");
const finalText=document.getElementById("finalText");
const btns=[document.getElementById("btn1"),document.getElementById("btn2"),document.getElementById("btn3")];
const towerArea=document.getElementById("towerArea");

// Button events
btns.forEach((btn)=>btn.addEventListener("click",()=>checkAnswer(btn.textContent)));

function nextSentence(){
if(usedSentences.length>=sentences.length){endGame();return;}
let remaining=sentences.filter(s=>!usedSentences.includes(s));
currentSentence=remaining[Math.floor(Math.random()*remaining.length)];
usedSentences.push(currentSentence);
sentenceDiv.textContent=currentSentence.sentence;
let opts=[...currentSentence.options].sort(()=>Math.random()-0.5);
for(let i=0;i<3;i++){btns[i].textContent=opts[i];}
}

function checkAnswer(choice){
if(choice===currentSentence.answer){
score++;
try{correctSound.play();clapSound.play();}catch(e){}
showFeedback("🎉 Correct!");
addBlock(currentSentence.answer);
}else{
try{wrongSound.play();}catch(e){}
showFeedback("❌ Wrong!");
}
scoreBoard.textContent=score;
setTimeout(nextSentence,500);
}

function showFeedback(text){feedback.textContent=text;feedback.style.display="block";setTimeout(()=>{feedback.style.display="none";},1000);}

function addBlock(text){
let block=document.createElement("div");
block.classList.add("block");
block.textContent=text;
towerArea.appendChild(block);
}

function createConfetti(){
for(let i=0;i<20;i++){
const conf=document.createElement("div");
conf.classList.add("confetti");
conf.style.left=Math.random()*100+"%";
conf.style.background=`hsl(${Math.random()*360},100%,50%)`;
conf.style.animationDuration=(2+Math.random()*2)+"s";
document.body.appendChild(conf);
setTimeout(()=>{conf.remove();},4000);
}
}

function endGame(){
endScreen.style.display="flex";
finalText.innerHTML=`You scored <b>${score}</b> out of 20!`;
}

function restartGame(){location.reload();}

// Start game after 5 seconds
setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
nextSentence();
},5000);
</script>
</body>
</html>
