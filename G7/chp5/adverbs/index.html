<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adverb Parkour Runner</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{overflow:hidden;background:linear-gradient(135deg,#1f1c5c,#342070,#ffb347);color:#fff;}

.screen{
  display:none;
  width:100vw;
  height:100vh;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}

.active{display:flex;}

.logo{width:60%;max-width:280px;animation:pulse 1.5s infinite alternate;}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}

.card{
  width:95%;
  max-width:950px;
  background:#ffffffee;
  color:#2d2340;
  border-radius:25px;
  padding:20px;
  box-shadow:0 10px 25px #00000055;
}

h1{font-size:38px;color:#5a189a;}
h2{font-size:24px;color:#3c096c;}

button{
  border:none;
  border-radius:18px;
  padding:14px 25px;
  font-size:18px;
  font-weight:bold;
  background:#ffb703;
  cursor:pointer;
}

.topbar{
  display:flex;
  justify-content:space-between;
}

.badge{
  background:#edf6f9;
  color:#2d2340;
  padding:8px 12px;
  border-radius:15px;
  font-weight:bold;
}

.progressOuter{
  width:100%;
  height:18px;
  background:#ddd;
  border-radius:30px;
}

.progressInner{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#80ed99,#38b000);
}

.gameArea{
  position:relative;
  width:100%;
  height:250px;
  background:linear-gradient(180deg,#8ecae6,#219ebc);
  border-radius:20px;
  overflow:hidden;
}

.ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:50px;
  background:#023047;
}

/* ✅ FIXED PLAYER START POSITION (RIGHT SIDE) */
.player{
  position:absolute;
  bottom:50px;
  left:90%;
  font-size:50px;
  transition:left 0.6s,bottom 0.4s;
}

.option{
  padding:12px;
  background:#d8f3dc;
  border-radius:10px;
  cursor:pointer;
  margin:5px;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
}

.correct{background:#b7efc5;}
.wrong{background:#ffccd5;}

</style>
</head>

<body>

<div id="splash" class="screen active">
  <img src="assets/innovine-logo.png" class="logo">
</div>

<div id="startScreen" class="screen">
  <div class="card">
    <h1>Adverb Parkour Runner</h1>
    <button onclick="startGame()">Start</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="card">

    <div class="topbar">
      <div class="badge" id="levelText">Level 1</div>
      <div class="badge" id="scoreText">Score: 0</div>
      <div class="badge" id="attemptText">Chances: 2</div>
    </div>

    <div class="progressOuter">
      <div class="progressInner" id="progressBar"></div>
    </div>

    <div class="gameArea">
      <div class="ground"></div>
      <div class="player" id="player">🏃</div>
    </div>

    <h3 id="questionText"></h3>
    <div class="options" id="optionsBox"></div>

    <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next</button>

  </div>
</div>

<script>
const questions=[
 {q:"swiftly",options:["athlete","ran","swiftly","the"],answer:"swiftly"},
 {q:"tomorrow",options:["train","arrive","tomorrow","will"],answer:"tomorrow"},
 {q:"upstairs",options:["cat","hiding","upstairs","is"],answer:"upstairs"}
];

let current=0,score=0,chances=2,locked=false;

setTimeout(()=>{
  document.getElementById("splash").classList.remove("active");
  document.getElementById("startScreen").classList.add("active");
},2000);

function startGame(){
  document.getElementById("startScreen").classList.remove("active");
  document.getElementById("gameScreen").classList.add("active");
  loadQ();
}

function loadQ(){
  const q=questions[current];
  chances=2;
  locked=false;

  document.getElementById("questionText").innerText="Choose: "+q.q;
  document.getElementById("optionsBox").innerHTML="";

  q.options.forEach(o=>{
    const div=document.createElement("div");
    div.className="option";
    div.innerText=o;
    div.onclick=()=>check(div,o);
    document.getElementById("optionsBox").appendChild(div);
  });

  updateUI();
}

function check(el,val){
  const q=questions[current];

  if(locked) return;

  if(val===q.answer){
    el.classList.add("correct");
    score++;
    locked=true;
    movePlayer();
    document.getElementById("nextBtn").style.display="block";
  }else{
    chances--;
    el.classList.add("wrong");

    if(chances<=0){
      locked=true;
      document.getElementById("nextBtn").style.display="block";
    }
  }

  updateUI();
}

function updateUI(){
  document.getElementById("scoreText").innerText="Score: "+score;
  document.getElementById("attemptText").innerText="Chances: "+chances;
  document.getElementById("levelText").innerText="Level "+(current+1);

  document.getElementById("progressBar").style.width=
    ((current/questions.length)*100)+"%";
}

/* ✅ FIXED RIGHT → LEFT MOVEMENT */
function movePlayer(){
  const p=document.getElementById("player");

  p.style.bottom="110px";
  setTimeout(()=>p.style.bottom="50px",400);

  // RIGHT → LEFT movement fix
  const movePercent = 90 - (current/(questions.length-1))*80;
  p.style.left = movePercent + "%";
}

function nextQuestion(){
  current++;
  if(current>=questions.length){
    alert("Game Over!");
    return;
  }
  document.getElementById("nextBtn").style.display="none";
  loadQ();
}
</script>

</body>
</html>
