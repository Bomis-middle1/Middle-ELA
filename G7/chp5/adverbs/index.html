<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adverb Parkour Runner</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{overflow:hidden;background:linear-gradient(135deg,#1f1c5c,#342070,#ffb347);color:#fff;}

.screen{
display:none;
width:100vw;height:100vh;
align-items:center;justify-content:center;
flex-direction:column;
text-align:center;
padding:20px;
position:relative;
}
.active{display:flex;}

.logo{width:60%;max-width:280px;animation:pulse 1.5s infinite alternate;}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}

.card{
width:95%;max-width:950px;
background:#ffffffee;
color:#2d2340;
border-radius:25px;
padding:20px;
box-shadow:0 10px 25px #00000055;
}

h1{font-size:38px;color:#5a189a;}
h2{font-size:24px;color:#3c096c;}
p{font-size:18px;line-height:1.4;}

button{
border:none;border-radius:18px;
padding:14px 25px;
font-size:18px;
font-weight:bold;
background:#ffb703;
cursor:pointer;
box-shadow:0 5px 0 #d88900;
}
button:active{transform:translateY(3px);}

.topbar{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;}
.badge{background:#edf6f9;color:#2d2340;padding:8px 12px;border-radius:15px;font-weight:bold;}

.progressOuter{width:100%;height:16px;background:#ddd;border-radius:20px;overflow:hidden;}
.progressInner{height:100%;width:0%;background:linear-gradient(90deg,#80ed99,#38b000);}

.gameArea{
position:relative;
width:100%;
height:260px;
background:linear-gradient(180deg,#8ecae6,#219ebc);
border-radius:20px;
overflow:hidden;
}

.ground{position:absolute;bottom:0;width:100%;height:50px;background:#023047;}

/* 🏃 REAL RUNNER STYLE */
.player{
position:absolute;
bottom:50px;
left:10%;
font-size:52px;
transform:scaleX(1);
transition:transform 0.2s;
}

/* running animation */
.player.run{
animation:runAnim 0.4s infinite alternate;
}

@keyframes runAnim{
0%{transform:translateY(0) scaleX(1) rotate(0deg);}
100%{transform:translateY(-3px) scaleX(1) rotate(-3deg);}
}

.questionBox{
background:#fff4d6;
border:3px dashed #ffb703;
border-radius:18px;
padding:12px;
margin-top:10px;
}

.question{font-size:20px;font-weight:bold;}

.options{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:10px;
}

.option{
background:#d8f3dc;
border:3px solid #52b788;
border-radius:12px;
padding:12px;
font-weight:bold;
cursor:pointer;
}

.correct{background:#b7efc5!important;}
.wrong{background:#ffccd5!important;}

.feedback{min-height:25px;font-size:18px;font-weight:bold;margin-top:8px;}

.trophy{font-size:80px;}
</style>
</head>

<body>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<!-- SPLASH -->
<div id="splash" class="screen active">
  <img src="assets/innovine-logo.png" class="logo">
</div>

<!-- START -->
<div id="startScreen" class="screen">
  <div class="card">
    <h1>Adverb Parkour Runner</h1>
    <p>Run forward, choose correct adverbs and beat the track!</p>
    <button onclick="startGame()">Start</button>
  </div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge" id="levelText">Level 1</div>
      <div class="badge" id="scoreText">Score: 0</div>
      <div class="badge" id="attemptText">Chances: 2</div>
    </div>

    <div class="progressOuter">
      <div class="progressInner" id="progressBar"></div>
    </div>

    <div class="gameArea">
      <div class="ground"></div>
      <div class="player" id="player">🏃</div>
    </div>

    <div class="questionBox">
      <div class="question" id="questionText"></div>
    </div>

    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>

    <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next</button>
  </div>
</div>

<!-- END -->
<div id="endScreen" class="screen">
  <div class="card">
    <div class="trophy">🏆</div>
    <h1>Completed!</h1>
    <p id="finalScore"></p>
    <button onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
const questions=[
{q:"The athlete ran swiftly.",a:"swiftly",o:["athlete","ran","swiftly","the"]},
{q:"The train arrives tomorrow.",a:"tomorrow",o:["train","arrives","tomorrow","will"]},
{q:"The cat is upstairs.",a:"upstairs",o:["cat","is","upstairs","hiding"]},
{q:"She always comes early.",a:"always",o:["she","always","comes","late"]},
{q:"It is extremely hot.",a:"extremely",o:["it","hot","extremely","today"]}
];

let i=0,score=0,chances=2,locked=false;

setTimeout(()=>{
document.getElementById("splash").classList.remove("active");
document.getElementById("startScreen").classList.add("active");
},2000);

function startGame(){
document.getElementById("startScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");
loadQ();
}

function loadQ(){
locked=false;
chances=2;

let q=questions[i];

document.getElementById("questionText").innerText=q.q;
document.getElementById("levelText").innerText="Level "+(i+1);
document.getElementById("scoreText").innerText="Score "+score;
document.getElementById("attemptText").innerText="Chances "+chances;
document.getElementById("progressBar").style.width=(i/questions.length)*100+"%";

let box=document.getElementById("optionsBox");
box.innerHTML="";

q.o.forEach(opt=>{
let d=document.createElement("div");
d.className="option";
d.innerText=opt;
d.onclick=()=>check(opt,d);
box.appendChild(d);
});
}

function check(opt,el){
if(locked)return;

let q=questions[i];

if(opt===q.a){
locked=true;
score++;
document.getElementById("feedback").innerText="Correct! RUN!";
el.classList.add("correct");

document.getElementById("correctSound").play();

runForward();
document.getElementById("nextBtn").style.display="inline-block";
}
else{
chances--;
el.classList.add("wrong");
document.getElementById("wrongSound").play();

document.getElementById("attemptText").innerText="Chances "+chances;

if(chances<=0){
locked=true;
document.getElementById("feedback").innerText="Answer: "+q.a;
document.getElementById("nextBtn").style.display="inline-block";
}
}
}

function runForward(){
let p=document.getElementById("player");

p.classList.add("run");

let percent=10+(i/(questions.length-1))*80;

/* smooth real runner movement */
p.style.left=percent+"%";

/* stop run animation after burst */
setTimeout(()=>p.classList.remove("run"),600);
}

function nextQuestion(){
i++;
if(i<questions.length){
loadQ();
}else{
end();
}
}

function end(){
document.getElementById("gameScreen").classList.remove("active");
document.getElementById("endScreen").classList.add("active");
document.getElementById("finalScore").innerText=score+" / "+questions.length;
document.getElementById("clapSound").play();
}

function restartGame(){
location.reload();
}
</script>

</body>
</html>
