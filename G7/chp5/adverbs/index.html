<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adverb Parkour Runner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{overflow:hidden;background:linear-gradient(135deg,#1f1c5c,#342070,#ffb347);color:#fff;}
.screen{display:none;width:100vw;height:100vh;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;position:relative;}
.active{display:flex;}
.logo{width:60%;max-width:280px;animation:pulse 1.5s infinite alternate;}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
.card{width:95%;max-width:950px;background:#ffffffee;color:#2d2340;border-radius:25px;padding:20px;box-shadow:0 10px 25px #00000055;position:relative;z-index:2;}
h1{font-size:38px;color:#5a189a;margin:10px 0;}
h2{font-size:24px;color:#3c096c;margin:10px 0;}
p{font-size:18px;line-height:1.4;}
button{border:none;border-radius:18px;padding:14px 25px;margin:10px;font-size:18px;font-weight:bold;background:#ffb703;color:#2d2340;cursor:pointer;box-shadow:0 5px 0 #d88900;}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #d88900;}
.topbar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.badge{background:#edf6f9;color:#2d2340;padding:9px 14px;border-radius:18px;font-weight:bold;font-size:15px;}
.progressOuter{width:100%;height:18px;background:#ddd;border-radius:30px;overflow:hidden;margin:10px 0;}
.progressInner{height:100%;width:0%;background:linear-gradient(90deg,#80ed99,#38b000);}
.gameArea{position:relative;width:100%;height:250px;background:linear-gradient(180deg,#8ecae6,#219ebc);border-radius:20px;overflow:hidden;margin:10px 0;}
.ground{position:absolute;bottom:0;width:100%;height:50px;background:#023047;}
.player{position:absolute;bottom:50px;left:50px;font-size:50px;transition:left 0.6s,bottom 0.4s;}
.obstacle{position:absolute;bottom:50px;width:60px;height:60px;background:#ff595e;border-radius:12px;font-size:40px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px #00000044;}
.questionBox{background:#fff4d6;border:3px dashed #ffb703;border-radius:18px;padding:12px;margin:10px 0;}
.question{font-size:20px;font-weight:bold;}
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px;}
.option{background:#d8f3dc;border:3px solid #52b788;border-radius:12px;padding:12px;font-size:16px;font-weight:bold;cursor:pointer;transition:.2s;}
.option:hover{transform:scale(1.03);}
.correct{background:#b7efc5!important;border-color:#2d6a4f!important;}
.wrong{background:#ffccd5!important;border-color:#d90429!important;animation:shake .3s;}
.glow{animation:glow 1s infinite alternate;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes glow{from{box-shadow:0 0 6px #2d6a4f}to{box-shadow:0 0 20px #2d6a4f}}
.feedback{min-height:25px;font-size:18px;font-weight:bold;margin-top:8px;}
.trophy{font-size:80px;animation:trophyBounce 1s infinite alternate;}
@keyframes trophyBounce{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-12px) rotate(3deg)}}
.sparkle,.confetti{position:fixed;z-index:2;pointer-events:none;}
.sparkle{font-size:28px;animation:spark 1s ease-out forwards;}
@keyframes spark{from{transform:scale(.5) translateY(0);opacity:1}to{transform:scale(2) translateY(-60px);opacity:0}}
.confetti{width:10px;height:10px;top:-20px;animation:fall 3.2s linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
.levelFlash{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#ffb703;color:#2d2340;font-size:20px;font-weight:bold;padding:12px 20px;border-radius:25px;z-index:10;animation:flash 1.2s forwards;}
@keyframes flash{0%{opacity:0;transform:translateX(-50%) scale(.8)}30%{opacity:1;transform:translateX(-50%) scale(1.05)}100%{opacity:0;transform:translateX(-50%) scale(1)}}
@media(max-width:650px){h1{font-size:28px}h2{font-size:20px}.player{font-size:38px}.question{font-size:18px}.option{font-size:15px;padding:10px}.card{padding:16px}}
</style>
</head>
<body>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<div id="splash" class="screen active">
  <img src="assets/innovine-logo.png" class="logo" alt="Innovine Logo">
</div>

<div id="startScreen" class="screen">
  <div class="card">
    <h1>Adverb Parkour Runner</h1>
    <p>Run forward by selecting the correct adverbs!</p>
    <p>2 chances per question. Complete all 12 levels to win!</p>
    <button onclick="startGame()">Start Run</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge" id="levelText">Level 1</div>
      <div class="badge" id="scoreText">Score: 0</div>
      <div class="badge" id="attemptText">Chances: 2</div>
    </div>
    <div class="progressOuter"><div class="progressInner" id="progressBar"></div></div>

    <div class="gameArea" id="gameArea">
      <div class="ground"></div>
      <div class="player" id="player">🏃</div>
    </div>

    <div class="questionBox">
      <div class="question" id="questionText"></div>
    </div>

    <div class="options" id="optionsBox"></div>
    <div class="feedback" id="feedback"></div>
    <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next Obstacle</button>
  </div>
</div>

<div id="endScreen" class="screen">
  <div class="card">
    <div class="trophy">🏆</div>
    <h1>Congratulations!</h1>
    <h2>You completed the Adverb Parkour!</h2>
    <p id="finalScore"></p>
    <button onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
const questions = [
  {type:"Manner",question:"Choose the adverb of manner: The athlete ran swiftly.",options:["athlete","ran","swiftly","the"],answer:"swiftly"},
  {type:"Time",question:"Choose adverb of time: The train will arrive tomorrow.",options:["train","arrive","tomorrow","will"],answer:"tomorrow"},
  {type:"Place",question:"Choose adverb of place: The cat is hiding upstairs.",options:["cat","hiding","upstairs","is"],answer:"upstairs"},
  {type:"Frequency",question:"Choose adverb of frequency: She always arrives early.",options:["she","arrives","always","early"],answer:"always"},
  {type:"Degree",question:"Choose adverb of degree: It is extremely hot today.",options:["extremely","hot","today","it"],answer:"extremely"},
  {type:"Duration",question:"Choose adverb of duration: They waited briefly.",options:["they","waited","briefly","none"],answer:"briefly"},
  {type:"Interrogative",question:"Which is interrogative adverb? Why did he leave?",options:["why","he","leave","did"],answer:"why"},
  {type:"Relative",question:"Which is relative adverb? This is the place where we met.",options:["place","where","we","met"],answer:"where"},
  {type:"Exclamatory",question:"Which is exclamatory adverb? How beautifully she sings!",options:["how","beautifully","she","sings"],answer:"how"},
  {type:"Affirmation",question:"Which adverb affirms? She will certainly finish on time.",options:["certainly","finish","she","on"],answer:"certainly"},
  {type:"Negation",question:"Which adverb negates? He never lies.",options:["never","he","lies","none"],answer:"never"},
  {type:"Comparative/Superlative",question:"Superlative form of fast: Among all runners, she ran ______.",options:["fast","faster","fastest","more fast"],answer:"fastest"}
];

let current=0,score=0,chances=2,locked=false;
const splash=document.getElementById("splash");
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const endScreen=document.getElementById("endScreen");

setTimeout(()=>{splash.classList.remove("active");startScreen.classList.add("active");},2000);

function playSound(id){const s=document.getElementById(id);if(s){s.currentTime=0;s.play().catch(()=>{});}}
function startGame(){startScreen.classList.remove("active");gameScreen.classList.add("active");loadQuestion();}
function loadQuestion(){locked=false;chances=2;const q=questions[current];document.getElementById("levelText").innerText="Level "+(current+1)+" / "+questions.length;document.getElementById("scoreText").innerText="Score: "+score;document.getElementById("attemptText").innerText="Chances: "+chances;document.getElementById("questionText").innerText=q.question;document.getElementById("feedback").innerText="";document.getElementById("nextBtn").style.display="none";document.getElementById("progressBar").style.width=(current/questions.length*100)+"%";createOptions(q);}
function createOptions(q){const optionsBox=document.getElementById("optionsBox");optionsBox.innerHTML="";q.options.forEach(option=>{const div=document.createElement("div");div.className="option";div.innerText=option;div.onclick=()=>checkAnswer(div,option);optionsBox.appendChild(div);});}
function checkAnswer(element,selected){if(locked)return;const q=questions[current];if(selected===q.answer){locked=true;score++;element.classList.add("correct");document.getElementById("feedback").innerText="Correct! Jump forward!";document.getElementById("scoreText").innerText="Score: "+score;playSound("correctSound");playerJumpAndMove();sparkleBurst();document.getElementById("nextBtn").style.display="inline-block";}else{chances--;element.classList.add("wrong");playSound("wrongSound");document.getElementById("attemptText").innerText="Chances: "+chances;if(chances>0){document.getElementById("feedback").innerText="Try again!";}else{locked=true;document.getElementById("feedback").innerText="Correct: "+q.answer;const allOptions=document.querySelectorAll(".option");allOptions.forEach(opt=>{if(opt.innerText===q.answer){opt.classList.add("correct");opt.classList.add("glow");}});document.getElementById("nextBtn").style.display="inline-block";}}}
function nextQuestion(){current++;if(current<questions.length){loadQuestion();}else{endGame();}}
function endGame(){gameScreen.classList.remove("active");endScreen.classList.add("active");document.getElementById("finalScore").innerText="Your Score: "+score+" / "+questions.length;playSound("clapSound");launchConfetti();}
function restartGame(){current=0;score=0;endScreen.classList.remove("active");gameScreen.classList.add("active");loadQuestion();}
function playerJumpAndMove(){const p=document.getElementById("player");p.style.bottom="110px";setTimeout(()=>p.style.bottom="50px",400);const movePercent=50+(current/(questions.length-1))*40;p.style.left=movePercent+"%";}
function sparkleBurst(){for(let i=0;i<12;i++){const s=document.createElement("div");s.className="sparkle";s.innerText="✨";s.style.left=(10+Math.random()*80)+"vw";s.style.top=(30+Math.random()*60)+"px";document.body.appendChild(s);setTimeout(()=>s.remove(),1000);}}
function launchConfetti(){for(let i=0;i<60;i++){const c=document.createElement("div");c.className="confetti";c.style.left=Math.random()*100+"vw";c.style.background=randomColor();c.style.animationDelay=Math.random()*1.5+"s";document.body.appendChild(c);setTimeout(()=>c.remove(),4000);}}
function randomColor(){const colors=["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff99c8","#00bbf9"];return colors[Math.floor(Math.random()*colors.length)];}
</script>
</body>
</html>
