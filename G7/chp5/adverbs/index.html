<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Adverb Parkour Runner</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{overflow:hidden;background:#000;color:#fff;}

/* SCREENS */
.screen{
  display:none;
  width:100vw;height:100vh;
  align-items:center;justify-content:center;
  flex-direction:column;
  text-align:center;
}
.active{display:flex;}

/* SPLASH */
.logo{width:60%;max-width:280px;}

/* CARD */
.card{
  width:95%;
  max-width:900px;
  background:#ffffffee;
  color:#2b2b2b;
  border-radius:18px;
  padding:18px;
}

/* BUTTON */
button{
  padding:14px 22px;
  border:none;
  border-radius:14px;
  background:#ffb703;
  font-weight:bold;
  font-size:16px;
}

/* GAME WORLD */
#gameWorld{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:linear-gradient(#87ceeb,#dff6ff);
}

/* scrolling ground */
.ground{
  position:absolute;
  bottom:0;
  width:200%;
  height:120px;
  background:#4caf50;
  animation:scroll 6s linear infinite;
}
@keyframes scroll{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* PLAYER FIXED VISIBILITY */
.player{
  position:absolute;
  bottom:120px;
  left:80px;
  font-size:74px;
  transform:scaleX(1);
  transition:bottom 0.25s ease, left 0.6s ease;
  z-index:10;

  /* STRONG VISIBILITY */
  text-shadow:
    2px 2px 0 #000,
    -2px 2px 0 #000,
    2px -2px 0 #000,
    -2px -2px 0 #000;

  filter: drop-shadow(0px 6px 6px rgba(0,0,0,0.45));
  animation:bounce 0.4s infinite;
}

@keyframes bounce{
  0%{transform:translateY(0) scaleX(1);}
  50%{transform:translateY(-6px) scaleX(1);}
  100%{transform:translateY(0) scaleX(1);}
}

/* OBSTACLE */
.obstacle{
  position:absolute;
  bottom:120px;
  right:-80px;
  font-size:52px;
}

/* HUD */
.hud{
  position:absolute;
  top:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
  font-weight:bold;
  font-size:14px;
}
.hud div{
  background:#00000055;
  padding:6px 10px;
  border-radius:10px;
}

/* QUESTION */
.questionBox{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:92%;
  background:#fff;
  color:#000;
  padding:12px;
  border-radius:12px;
}
.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}
.option{
  background:#e8f5e9;
  padding:10px;
  border-radius:10px;
  font-weight:bold;
  text-align:center;
}

/* JUMP */
.jump{
  bottom:200px !important;
}

/* COINS */
.coin{
  position:absolute;
  font-size:20px;
  animation:fly 0.8s ease-out forwards;
}
@keyframes fly{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-90px);opacity:0;}
}

/* END */
.trophy{font-size:80px;}
</style>
</head>

<body>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<!-- SPLASH -->
<div id="splash" class="screen active">
  <img src="assets/innovine-logo.png" class="logo"/>
</div>

<!-- INSTRUCTIONS -->
<div id="instructions" class="screen">
  <div class="card">
    <h2>🏃 Adverb Parkour Runner</h2>
    <p>Answer correctly to jump obstacles.</p>
    <p>2 chances per question.</p>
    <button onclick="startGame()">Start Run</button>
  </div>
</div>

<!-- GAME -->
<div id="gameWorld" class="screen">

  <div class="hud">
    <div id="progress">Obstacle 1/12</div>
    <div id="score">⭐ 0</div>
    <div id="lives">❤️ 2</div>
    <div id="coins">🪙 0</div>
  </div>

  <div class="ground"></div>
  <div class="player" id="player">🏃‍♂️</div>

  <div class="questionBox">
    <div id="qText"></div>
    <div class="options" id="options"></div>
  </div>

</div>

<!-- END -->
<div id="end" class="screen">
  <div class="card">
    <div class="trophy">🏆</div>
    <h2>Parkour Champion!</h2>
    <p id="final"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>
</div>

<script>

const questions = [
  {question:"Choose the adverb of manner: The athlete ran swiftly.",options:["athlete","ran","swiftly","the"],answer:"swiftly"},
  {question:"Choose adverb of time: The train will arrive tomorrow.",options:["train","arrive","tomorrow","will"],answer:"tomorrow"},
  {question:"Choose adverb of place: The cat is hiding upstairs.",options:["cat","hiding","upstairs","is"],answer:"upstairs"},
  {question:"Choose adverb of frequency: She always arrives early.",options:["she","arrives","always","early"],answer:"always"},
  {question:"Choose adverb of degree: It is extremely hot today.",options:["extremely","hot","today","it"],answer:"extremely"},
  {question:"Choose adverb of duration: They waited briefly.",options:["they","waited","briefly","none"],answer:"briefly"},
  {question:"Which is interrogative adverb? Why did he leave?",options:["why","he","leave","did"],answer:"why"},
  {question:"Which is relative adverb? This is the place where we met.",options:["place","where","we","met"],answer:"where"},
  {question:"Which is exclamatory adverb? How beautifully she sings!",options:["how","beautifully","she","sings"],answer:"how"},
  {question:"Which adverb affirms? She will certainly finish on time.",options:["certainly","finish","she","on"],answer:"certainly"},
  {question:"Which adverb negates? He never lies.",options:["never","he","lies","none"],answer:"never"},
  {question:"Superlative form of fast: she ran ______.",options:["fast","faster","fastest","more fast"],answer:"fastest"}
];

let order=[],i=0,score=0,lives=2,coins=0;

const splash=document.getElementById("splash");
const inst=document.getElementById("instructions");
const game=document.getElementById("gameWorld");
const end=document.getElementById("end");

setTimeout(()=>{
  splash.classList.remove("active");
  inst.classList.add("active");
},5000);

function startGame(){
  inst.classList.remove("active");
  game.classList.add("active");
  order=[...questions].sort(()=>Math.random()-0.5);
  load();
}

function load(){
  lives=2;
  document.getElementById("lives").innerText="❤️ "+lives;
  document.getElementById("progress").innerText=`Obstacle ${i+1}/12`;

  const q=order[i];
  document.getElementById("qText").innerText=q.question;

  const box=document.getElementById("options");
  box.innerHTML="";

  q.options.forEach(o=>{
    let d=document.createElement("div");
    d.className="option";
    d.innerText=o;
    d.onclick=()=>check(o);
    box.appendChild(d);
  });

  spawnObstacle();
}

function spawnObstacle(){
  let o=document.createElement("div");
  o.className="obstacle";
  o.innerText="🪨";
  document.getElementById("gameWorld").appendChild(o);

  let pos=100;
  let m=setInterval(()=>{
    pos-=2;
    o.style.right=pos+"px";
    if(pos<-80) clearInterval(m);
  },30);
}

function check(val){
  const q=order[i];

  if(val===q.answer){
    score++; coins+=10;

    document.getElementById("score").innerText="⭐ "+score;
    document.getElementById("coins").innerText="🪙 "+coins;

    document.getElementById("correctSound").play();

    jump();
    coinsBurst();

    setTimeout(()=>next(),700);

  } else {
    lives--;
    document.getElementById("wrongSound").play();
    document.getElementById("lives").innerText="❤️ "+lives;

    if(lives<=0){
      setTimeout(()=>next(),1000);
    }
  }
}

function jump(){
  let p=document.getElementById("player");
  p.classList.add("jump");
  setTimeout(()=>p.classList.remove("jump"),300);
}

function coinsBurst(){
  for(let k=0;k<5;k++){
    let c=document.createElement("div");
    c.className="coin";
    c.innerText="🪙";
    c.style.left=(80+Math.random()*100)+"px";
    c.style.bottom="160px";
    document.getElementById("gameWorld").appendChild(c);
    setTimeout(()=>c.remove(),800);
  }
}

function next(){
  i++;
  if(i>=order.length){
    endGame();
  } else load();
}

function endGame(){
  game.classList.remove("active");
  end.classList.add("active");
  document.getElementById("final").innerText=`Score: ${score}/12 Coins: ${coins}`;
  document.getElementById("clapSound").play();
}

</script>
</body>
</html>
