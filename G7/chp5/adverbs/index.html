<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adverb Parkour Runner</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;}
body{overflow:hidden;background:linear-gradient(135deg,#1f1c5c,#342070,#ffb347);}

/* SCREENS */
.screen{
  display:none;
  width:100vw;
  height:100vh;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
.active{display:flex;}

/* SPLASH */
.logo{width:220px;max-width:60%;}

/* CARD */
.card{
  width:95%;
  max-width:950px;
  background:#ffffffee;
  padding:20px;
  border-radius:20px;
}

/* TOPBAR */
.topbar{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}
.badge{
  background:#eef2ff;
  padding:8px 12px;
  border-radius:12px;
  font-weight:bold;
}

/* GAME AREA */
.gameArea{
  position:relative;
  width:100%;
  height:250px;
  background:linear-gradient(#87ceeb,#e0f7ff);
  border-radius:16px;
  overflow:hidden;
}

.ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:50px;
  background:#2e7d32;
}

/* PLAYER (ONLY VISUAL FIX KEPT) */
.player{
  position:absolute;
  bottom:50px;
  left:90%;
  font-size:50px;
  transition:left 0.6s,bottom 0.4s;
  transform:scaleX(-1);
}

/* OPTIONS */
.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

.option{
  background:#d8f3dc;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.correct{background:#b7efc5!important;}
.wrong{background:#ffccd5!important;}

.question{
  font-size:18px;
  font-weight:bold;
  margin:10px 0;
}

/* NEXT BUTTON (RESTORED FIX) */
#nextBtn{
  margin-top:10px;
  padding:12px 16px;
  border:none;
  border-radius:10px;
  background:#ffb703;
  font-weight:bold;
  cursor:pointer;
  display:none;
}

button{
  padding:12px 16px;
  border:none;
  border-radius:10px;
  background:#ffb703;
  font-weight:bold;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="screen active">
  <img class="logo" src="assets/innovine-logo.png">
</div>

<!-- START -->
<div id="startScreen" class="screen">
  <div class="card">
    <h1>Adverb Parkour Runner</h1>
    <button onclick="startGame()">Start</button>
  </div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

  <div class="card">

    <div class="topbar">
      <div class="badge" id="levelText">Level 1</div>
      <div class="badge" id="scoreText">Score: 0</div>
    </div>

    <div class="gameArea">
      <div class="ground"></div>
      <div class="player" id="player">🏃</div>
    </div>

    <div class="question" id="questionText"></div>

    <div class="options" id="optionsBox"></div>

    <!-- ✅ RESTORED NEXT BUTTON -->
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

  </div>

</div>

<!-- END -->
<div id="endScreen" class="screen">
  <div class="card">
    <h1>🏆 Completed!</h1>
    <p id="finalScore"></p>
    <button onclick="location.reload()">Play Again</button>
  </div>
</div>

<script>

/* ORIGINAL QUESTIONS (UNCHANGED) */
const questions=[
 {q:"swiftly",options:["athlete","ran","swiftly","the"],answer:"swiftly"},
 {q:"tomorrow",options:["train","arrive","tomorrow","will"],answer:"tomorrow"},
 {q:"upstairs",options:["cat","hiding","upstairs","is"],answer:"upstairs"},
 {q:"always",options:["she","arrives","always","early"],answer:"always"},
 {q:"never",options:["never","sometimes","always","often"],answer:"never"}
];

let current=0;
let score=0;

/* START */
function startGame(){
  document.getElementById("startScreen").classList.remove("active");
  document.getElementById("gameScreen").classList.add("active");
  loadQuestion();
}

/* LOAD */
function loadQuestion(){

  let q=questions[current];

  document.getElementById("questionText").innerText =
    "Choose the correct adverb";

  document.getElementById("scoreText").innerText =
    "Score: "+score;

  let box=document.getElementById("optionsBox");
  box.innerHTML="";

  q.options.forEach(opt=>{
    let d=document.createElement("div");
    d.className="option";
    d.innerText=opt;
    d.onclick=()=>check(opt,d);
    box.appendChild(d);
  });

  document.getElementById("nextBtn").style.display="none";
}

/* CHECK */
function check(val,el){

  let q=questions[current];

  if(val===q.answer){
    el.classList.add("correct");
    score++;
    movePlayer();
  }else{
    el.classList.add("wrong");
  }

  document.getElementById("scoreText").innerText="Score: "+score;

  document.getElementById("nextBtn").style.display="block";
}

/* MOVE (ONLY FIX KEPT) */
function movePlayer(){

  let p=document.getElementById("player");

  p.style.bottom="120px";
  setTimeout(()=>p.style.bottom="50px",300);

  let step=80/(questions.length-1);
  let pos=90-(current*step);

  p.style.left=pos+"%";
}

/* NEXT */
function nextQuestion(){
  current++;

  if(current>=questions.length){
    endGame();
    return;
  }

  loadQuestion();
}

/* END */
function endGame(){
  document.getElementById("gameScreen").classList.remove("active");
  document.getElementById("endScreen").classList.add("active");

  document.getElementById("finalScore").innerText=
    "Score: "+score+" / "+questions.length;
}

</script>

</body>
</html>
