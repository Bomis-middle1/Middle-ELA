<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Tense Conveyor Game - Jumbled</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#1a1a2e;color:#fff;overflow:hidden;}
#logoScreen,#gameScreen,#endScreen{display:none;width:100%;height:100vh;align-items:center;justify-content:center;flex-direction:column;}
#logoScreen img{width:200px;margin-top:50px;}
h1{color:#ffd60a;text-align:center;margin:10px;}
#scoreText{margin:10px;}
#conveyor{position:relative;width:100%;height:300px;overflow:hidden;border-top:2px solid #fff;border-bottom:2px solid #fff;margin:10px 0;}
.sentence{position:absolute;padding:10px 15px;background:#ff6f61;color:#fff;border-radius:12px;cursor:grab;white-space:nowrap;font-weight:bold;}
.binContainer{display:flex;justify-content:space-around;width:100%;margin-top:20px;}
.bin{width:22%;padding:40px;background:#ffb703;color:#2d2340;border-radius:12px;text-align:center;font-weight:bold;min-height:120px;}
.streamer{position:absolute;width:4px;height:40px;background:linear-gradient(to bottom,#ffd700,#ff4500);animation:fall 1s ease-out forwards;}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0deg);}100%{opacity:0;transform:translateY(200px) rotate(720deg);}}
button{padding:10px 16px;margin-top:20px;border-radius:12px;border:none;background:#ff6f61;color:#fff;font-weight:bold;cursor:pointer;font-size:16px;}
#endScreen{text-align:center;}
</style>
</head>
<body>

<div id="logoScreen">
<img src="assets/innovine-logo.png" alt="Logo">
<h2>Loading Time Machine...</h2>
</div>

<div id="gameScreen">
<h1>Past Tense Conveyor Game</h1>
<div id="scoreText">Score: 0</div>
<div id="conveyor"></div>
<div class="binContainer">
  <div class="bin" id="SimpleBin">Past Simple</div>
  <div class="bin" id="ContinuousBin">Past Continuous</div>
  <div class="bin" id="PerfectBin">Past Perfect</div>
  <div class="bin" id="PerfectContinuousBin">Past Perfect Continuous</div>
</div>
</div>

<div id="endScreen">
<h1>Mission Complete!</h1>
<p id="finalScore"></p>
<button onclick="restartGame()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>
// Full 10 sentences
let sentences=[
  {text:"I visited Paris last year.", type:"Simple"},
  {text:"I was visiting Paris when it rained.", type:"Continuous"},
  {text:"I had visited Paris before I went to Rome.", type:"Perfect"},
  {text:"I had been visiting Paris for hours before I left.", type:"PerfectContinuous"},
  {text:"She was reading when I called.", type:"Continuous"},
  {text:"He finished his homework.", type:"Simple"},
  {text:"They had left before the party started.", type:"Perfect"},
  {text:"She had been studying for 3 hours.", type:"PerfectContinuous"},
  {text:"We played football yesterday.", type:"Simple"},
  {text:"He was cooking dinner.", type:"Continuous"}
];

let score=0;
let current=0;
const conveyor=document.getElementById('conveyor');
const scoreText=document.getElementById('scoreText');
const logoScreen=document.getElementById('logoScreen');
const gameScreen=document.getElementById('gameScreen');
const endScreen=document.getElementById('endScreen');
const finalScore=document.getElementById('finalScore');
const correctAudio=document.getElementById('correctSound');
const wrongAudio=document.getElementById('wrongSound');
const clapAudio=document.getElementById('clapSound');

// Shuffle helper
function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
  }
  return array;
}

// Logo 5 sec
logoScreen.style.display='flex';
setTimeout(()=>{
  logoScreen.style.display='none';
  gameScreen.style.display='flex';
  sentences = shuffle(sentences); // shuffle at start
  showNextSentence();
},5000);

function showNextSentence(){
  conveyor.innerHTML='';
  if(current>=sentences.length){ endGame(); return; }
  createSentenceBox(sentences[current],0);
}

function createSentenceBox(s,i){
  const div=document.createElement('div');
  div.className='sentence';
  div.innerText=s.text;
  div.dataset.type=s.type;
  div.style.top = 100 + 'px';
  div.style.left = conveyor.offsetWidth +'px';
  div.draggable = true;
  div.ondragstart = e=>{
    e.dataTransfer.setData("text", s.type);
    e.dataTransfer.setData("id", i);
  }
  conveyor.appendChild(div);
  moveSentence(div);
}

function moveSentence(div){
  let interval=setInterval(()=>{
    let left=parseFloat(div.style.left);
    left-=1; // speed reasonable
    if(left < -div.offsetWidth){ div.remove(); clearInterval(interval);}
    else div.style.left=left+'px';
  },15);
}

['SimpleBin','ContinuousBin','PerfectBin','PerfectContinuousBin'].forEach(id=>{
  const bin=document.getElementById(id);
  bin.ondragover = e=>e.preventDefault();
  bin.ondrop = e=>{
    const type = e.dataTransfer.getData("text");
    const div=document.querySelector('.sentence');
    if(!div) return;
    if((type==='Simple' && id==='SimpleBin')||
       (type==='Continuous' && id==='ContinuousBin')||
       (type==='Perfect' && id==='PerfectBin')||
       (type==='PerfectContinuous' && id==='PerfectContinuousBin')){
      div.remove();
      createStreamer(div);
      score++;
      scoreText.innerText=`Score: ${score}`;
      current++;
      correctAudio.currentTime=0; correctAudio.play();
      setTimeout(showNextSentence,500);
    } else{
      wrongAudio.currentTime=0; wrongAudio.play();
      div.style.background="#ffccd5";
      setTimeout(()=>{div.style.background="#ff6f61"},300);
    }
  }
});

function createStreamer(div){
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.className='streamer';
    s.style.left = div.offsetLeft + Math.random()*50 +'px';
    s.style.top = div.offsetTop + Math.random()*50 +'px';
    document.body.appendChild(s);
    setTimeout(()=>{s.remove()},1000);
  }
}

function endGame(){
  gameScreen.style.display='none';
  endScreen.style.display='flex';
  finalScore.innerText=`Your Score: ${score} / ${sentences.length}`;
  clapAudio.play();
}

function restartGame(){
  current=0;
  score=0;
  endScreen.style.display='none';
  gameScreen.style.display='flex';
  scoreText.innerText=`Score: 0`;
  sentences = shuffle(sentences); // reshuffle
  showNextSentence();
}
</script>
</body>
</html>
