<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articles Spinner Game</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#140f3d,#342070,#ffb347);
display:flex;
align-items:center;
justify-content:center;
height:100vh;
flex-direction:column;
color:#fff;
overflow:hidden;
}

.screen{
display:none;
width:100%;
height:100%;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.active{display:flex;}

.card{
background:#ffffffee;
color:#2d2340;
border-radius:25px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
max-width:500px;
width:95%;
text-align:center;
}

h1{color:#ffd60a;text-shadow:1px 1px 2px #000;}

button{
border:none;
border-radius:18px;
padding:12px 20px;
margin:10px;
font-size:18px;
font-weight:bold;
background:#ffb703;
color:#2d2340;
cursor:pointer;
}

.spinnerContainer{position:relative;width:250px;height:250px;margin:auto;}
.spinner{
width:100%;
height:100%;
border-radius:50%;
border:8px solid #fff;
transition:transform 4s cubic-bezier(0.33,1,0.68,1);
position:relative;
}

.segment{
position:absolute;
width:50%;
height:50%;
top:0;
left:50%;
transform-origin:0% 100%;
font-weight:bold;
color:#fff;
font-size:20px;
}

.segmentA{transform:rotate(0deg);color:#ff595e;}
.segmentAn{transform:rotate(120deg);color:#52b788;}
.segmentThe{transform:rotate(240deg);color:#ffd60a;}

.pointer{
position:absolute;
top:-20px;
left:50%;
transform:translateX(-50%);
border-left:12px solid transparent;
border-right:12px solid transparent;
border-bottom:24px solid #fff;
}

.questionBox{
background:#fff4d6;
border:3px dashed #ffb703;
border-radius:18px;
padding:12px;
margin:15px 0;
}

.question{font-size:20px;font-weight:bold;color:#2d2340;}

.options{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:10px;}

.optionBtn{
background:#d8f3dc;
border:3px solid #52b788;
border-radius:12px;
padding:10px 16px;
font-size:16px;
font-weight:bold;
cursor:pointer;
min-width:80px;
}

.correct{background:#b7efc5!important;}
.wrong{background:#ffccd5!important;}

.feedback{margin-top:10px;font-weight:bold;}

.logo{
width:180px;
margin-bottom:15px;
}

</style>
</head>

<body>

<!-- ✅ LOGO SCREEN (FIXED - NO PLACEHOLDER ISSUE) -->
<div id="logoScreen" class="screen active">
  <div class="card">
    
    <!-- 🔥 IMPORTANT FIX:
         You must replace THIS src with your REAL Innovine logo path -->
    <img src="innovine-logo.png" class="logo" alt="Innovine Logo">

    <h1>Innovine Learning Games</h1>
  </div>
</div>

<!-- INSTRUCTION SCREEN -->
<div id="instructionScreen" class="screen">
  <div class="card">
    <h1>Articles Spinner Game</h1>
    <p>Spin the wheel and choose A / An / The correctly</p>
    <button onclick="startGame()">Start Game</button>
  </div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <div class="card">

    <div class="spinnerContainer">
      <div class="pointer"></div>
      <div class="spinner" id="spinner">
        <div class="segment segmentA">A</div>
        <div class="segment segmentAn">An</div>
        <div class="segment segmentThe">The</div>
      </div>
    </div>

    <button onclick="spinWheel()">Spin Wheel</button>

    <div class="questionBox">
      <div class="question" id="qText"></div>
    </div>

    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>

    <div>Score: <span id="score">0</span></div>
  </div>
</div>

<!-- END -->
<div id="endScreen" class="screen">
  <div class="card">
    <h1>🏆 Well Done!</h1>
    <p id="finalScore"></p>
    <button onclick="restart()">Play Again</button>
  </div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

const questions=[
{sentence:"I saw ___ elephant at the zoo.",answer:"An"},
{sentence:"She wants to buy ___ apple.",answer:"An"},
{sentence:"He is ___ honest person.",answer:"An"},
{sentence:"We went to ___ park yesterday.",answer:"The"},
{sentence:"I need ___ pencil from my bag.",answer:"A"},
{sentence:"___ sun rises in the east.",answer:"The"},
{sentence:"They adopted ___ dog from the shelter.",answer:"A"},
{sentence:"___ moon looks beautiful tonight.",answer:"The"},
{sentence:"Can you give me ___ orange?",answer:"An"},
{sentence:"She wore ___ dress to the party.",answer:"A"}
];

let index=0;
let score=0;
let spinning=false;
let bonus={points:0,hint:false};

document.getElementById("score").innerText=0;

/* ✅ FIXED LOGO TIMING FLOW */
setTimeout(()=>{
document.getElementById("logoScreen").classList.remove("active");
document.getElementById("instructionScreen").classList.add("active");
},5000);

function startGame(){
document.getElementById("instructionScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");
load();
}

function load(){
if(index>=questions.length){
end();
return;
}

let q=questions[index];
document.getElementById("qText").innerText=q.sentence;

let box=document.getElementById("options");
box.innerHTML="";

["A","An","The"].forEach(o=>{
let b=document.createElement("button");
b.innerText=o;
b.onclick=()=>check(o,b);
box.appendChild(b);
});

document.getElementById("feedback").innerText="";
bonus={points:0,hint:false};
}

function spinWheel(){
if(spinning)return;
spinning=true;

let rewards=["⭐ +10","💡 Hint","⏱ Boost"];
let r=rewards[Math.floor(Math.random()*3)];

bonus.points=r.includes("10")?10:0;
bonus.hint=r.includes("Hint");

let deg=1080+Math.random()*360;
document.getElementById("spinner").style.transform=`rotate(${deg}deg)`;

setTimeout(()=>{
spinning=false;
alert("Bonus: "+r);
},3000);
}

function check(ans,btn){
let q=questions[index];

let buttons=document.querySelectorAll("button");
buttons.forEach(b=>b.disabled=true);

if(ans===q.answer){
btn.classList.add("correct");
play("correctSound");

score+=1+bonus.points;
document.getElementById("score").innerText=score;
document.getElementById("feedback").innerText="Correct!";
}else{
btn.classList.add("wrong");
play("wrongSound");
}

index++;
setTimeout(load,1000);
}

function end(){
document.getElementById("gameScreen").classList.remove("active");
document.getElementById("endScreen").classList.add("active");
document.getElementById("finalScore").innerText="Score: "+score;
play("clapSound");
}

function restart(){
location.reload();
}

function play(id){
let a=document.getElementById(id);
if(a){a.currentTime=0;a.play().catch(()=>{});}
}

</script>

</body>
</html>
