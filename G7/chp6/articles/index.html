<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Articles Spinner Game</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#140f3d,#342070,#ffb347);
display:flex;
align-items:center;
justify-content:center;
height:100vh;
flex-direction:column;
color:#fff;
}

.screen{
display:none;
width:100%;
height:100%;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.active{display:flex;}

h1{
font-size:32px;
margin-bottom:15px;
color:#ffd60a;
text-shadow:1px 1px 2px #000;
}

.card{
background:#ffffffee;
color:#2d2340;
border-radius:25px;
padding:20px;
box-shadow:0 10px 25px #00000055;
max-width:500px;
width:95%;
text-align:center;
}

button{
border:none;
border-radius:18px;
padding:12px 20px;
margin:10px;
font-size:18px;
font-weight:bold;
background:#ffb703;
color:#2d2340;
cursor:pointer;
box-shadow:0 5px 0 #d88900;
}

button:active{
transform:translateY(3px);
box-shadow:0 2px 0 #d88900;
}

.spinnerContainer{
position:relative;
width:250px;
height:250px;
margin:20px auto;
}

.spinner{
width:100%;
height:100%;
border-radius:50%;
border:8px solid #fff;
position:relative;
transition:transform 4s cubic-bezier(0.33, 1, 0.68, 1);
}

.segment{
position:absolute;
width:50%;
height:50%;
top:0;
left:50%;
transform-origin:0% 100%;
text-align:center;
font-weight:bold;
color:#fff;
font-size:20px;
}

.segmentA{transform:rotate(0deg);color:#ff595e;}
.segmentAn{transform:rotate(120deg);color:#52b788;}
.segmentThe{transform:rotate(240deg);color:#ffd60a;}

.pointer{
position:absolute;
top:-20px;
left:50%;
transform:translateX(-50%);
width:0;
height:0;
border-left:12px solid transparent;
border-right:12px solid transparent;
border-bottom:24px solid #fff;
}

.questionBox{
background:#fff4d6;
border:3px dashed #ffb703;
border-radius:18px;
padding:12px;
margin:15px 0;
}

.question{
font-size:20px;
font-weight:bold;
color:#2d2340;
}

.options{
display:flex;
justify-content:center;
margin-top:12px;
gap:12px;
}

.optionBtn{
background:#d8f3dc;
border:3px solid #52b788;
border-radius:12px;
padding:10px 16px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

.optionBtn:hover{transform:scale(1.05);}

.correct{
background:#b7efc5!important;
border-color:#2d6a4f!important;
}

.wrong{
background:#ffccd5!important;
border-color:#d90429!important;
animation:shake .3s;
}

@keyframes shake{
0%,100%{transform:translateX(0)}
25%{transform:translateX(-5px)}
75%{transform:translateX(5px)}
}

.trophy{
font-size:80px;
animation:float 1s infinite alternate;
}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(-12px);}
}

/* CONFETTI */
.confetti{
position:fixed;
width:10px;
height:10px;
top:-10px;
z-index:9999;
animation:fall 2s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(360deg);
opacity:0;
}
}

/* SPLASH */
.logoScreen img{
width:260px;
animation:pop 1s ease;
}

@keyframes pop{
from{transform:scale(0.6);opacity:0;}
to{transform:scale(1);opacity:1;}
}

.topicTitle{
font-size:40px;
color:#ffd60a;
text-shadow:2px 2px 4px #000;
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="correctSound" src="Middle-ELA/G7/chp6/articles/assets/correct.mp3"></audio>
<audio id="wrongSound" src="Middle-ELA/G7/chp6/articles/assets/wrong.mp3"></audio>
<audio id="clapSound" src="Middle-ELA/G7/chp6/articles/assets/clapping.mp3"></audio>

<!-- SPLASH 1 -->
<div id="logoScreen" class="screen active">
  <img src="Middle-ELA/G7/chp6/articles/assets/innovine-logo.png">
</div>

<!-- SPLASH 2 -->
<div id="titleScreen" class="screen">
  <div class="topicTitle">
    ✨ Master the Articles: A, An & The Challenge! ✨
  </div>
</div>

<!-- START -->
<div id="startScreen" class="screen">
  <div class="card">
    <h1>Articles Spinner Game</h1>
    <button onclick="startGame()">Start Game</button>
  </div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
  <div class="card">

    <div class="spinnerContainer">
      <div class="pointer"></div>
      <div class="spinner" id="spinner">
        <div class="segment segmentA">A</div>
        <div class="segment segmentAn">An</div>
        <div class="segment segmentThe">The</div>
      </div>
    </div>

    <button onclick="spinWheel()">Spin Wheel</button>

    <div class="questionBox">
      <div class="question" id="sentenceText"></div>
    </div>

    <div class="options" id="optionsBox"></div>

    <div>
      Score: <span id="scoreText">0</span> /
      <span id="totalText">0</span>
    </div>

  </div>
</div>

<!-- END -->
<div id="endScreen" class="screen">
  <div class="card">
    <div class="trophy">🏆</div>
    <h1>Well Done!</h1>
    <p id="finalScore"></p>
    <button onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>

/* SPLASH FLOW */
window.onload = () => {

  setTimeout(() => {
    document.getElementById("logoScreen").classList.remove("active");
    document.getElementById("titleScreen").classList.add("active");
  }, 5000);

  setTimeout(() => {
    document.getElementById("titleScreen").classList.remove("active");
    document.getElementById("startScreen").classList.add("active");
  }, 8000);
};

/* QUESTIONS */
const questions = [
  {sentence:"I saw ___ elephant at the zoo.",answer:"An"},
  {sentence:"She wants to buy ___ apple.",answer:"An"},
  {sentence:"He is ___ honest person.",answer:"An"},
  {sentence:"We went to ___ park yesterday.",answer:"The"},
  {sentence:"I need ___ pencil from my bag.",answer:"A"},
  {sentence:"___ sun rises in the east.",answer:"The"},
  {sentence:"They adopted ___ dog from the shelter.",answer:"A"},
  {sentence:"___ moon looks beautiful tonight.",answer:"The"},
  {sentence:"Can you give me ___ orange?",answer:"An"},
  {sentence:"She wore ___ dress to the party.",answer:"A"}
];

let current=0;
let score=0;

document.getElementById("totalText").innerText = questions.length;

/* START */
function startGame(){
  document.getElementById("startScreen").classList.remove("active");
  document.getElementById("gameScreen").classList.add("active");
  loadQuestion();
}

/* LOAD */
function loadQuestion(){
  if(current>=questions.length){
    endGame();
    return;
  }

  const q = questions[current];
  document.getElementById("sentenceText").innerText = q.sentence;

  const optionsBox = document.getElementById("optionsBox");
  optionsBox.innerHTML = "";

  ["A","An","The"].forEach(opt=>{
    const btn = document.createElement("div");
    btn.className="optionBtn";
    btn.innerText = opt;
    btn.onclick = ()=>checkAnswer(opt, btn);
    optionsBox.appendChild(btn);
  });
}

/* SPIN */
function spinWheel(){
  const spinner = document.getElementById("spinner");
  const spins = 3 + Math.floor(Math.random()*3);
  const deg = spins*360 + Math.floor(Math.random()*360);
  spinner.style.transform = `rotate(${deg}deg)`;
}

/* CHECK ANSWER */
function checkAnswer(selected, btn){

  const q = questions[current];
  const buttons = document.querySelectorAll(".optionBtn");

  buttons.forEach(b=>b.onclick=null);

  if(selected === q.answer){
    btn.classList.add("correct");
    score++;
    document.getElementById("correctSound").play().catch(()=>{});
    launchConfetti();   // 🎉 ADDED
  }
  else{
    btn.classList.add("wrong");
    document.getElementById("wrongSound").play().catch(()=>{});
    buttons.forEach(b=>{
      if(b.innerText===q.answer) b.classList.add("correct");
    });
  }

  document.getElementById("scoreText").innerText = score;
  current++;
  setTimeout(loadQuestion,1000);
}

/* CONFETTI */
function launchConfetti(){
  for(let i=0;i<60;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=["#ff0","#0ff","#f0f","#0f0","#ff6600"][Math.floor(Math.random()*5)];
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),2000);
  }
}

/* END */
function endGame(){
  document.getElementById("gameScreen").classList.remove("active");
  document.getElementById("endScreen").classList.add("active");
  document.getElementById("finalScore").innerText =
    "Your Score: "+score+" / "+questions.length;

  document.getElementById("clapSound").play().catch(()=>{});
}

/* RESTART */
function restartGame(){
  location.reload();
}

</script>

</body>
</html>
