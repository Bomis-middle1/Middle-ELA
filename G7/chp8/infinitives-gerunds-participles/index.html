<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinitives, Gerunds & Participles Quiz</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#140f3d;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;height:100vh;}
#logoScreen, #quizScreen, #endScreen{display:none;align-items:center;justify-content:center;flex-direction:column;}
#logoScreen img{width:200px;margin-top:50px;}
h1{color:#ffd60a;text-align:center;}
#questionBox{background:#fff4d6;color:#2d2340;padding:20px;border-radius:12px;max-width:500px;margin-top:20px;text-align:left;}
button{padding:10px 16px;margin:8px;border-radius:12px;border:none;background:#ffb703;color:#2d2340;font-weight:bold;cursor:pointer;width:90%;font-size:16px;}
.correct{background:#b7efc5;}
.wrong{background:#ffccd5;}
#feedback{margin-top:10px;font-weight:bold;}
#endScreen{display:none;text-align:center;margin-top:20px;}
</style>
</head>
<body>

<!-- Logo -->
<div id="logoScreen">
<img src="assets/innovine-logo.png" alt="Logo">
<h2>Loading Game...</h2>
</div>

<!-- Quiz -->
<div id="quizScreen">
<h1>Infinitives, Gerunds & Participles Quiz</h1>
<div id="scoreText">Question 1 of 10</div>
<div id="questionBox">
<div id="questionText"></div>
<div id="optionsBox"></div>
<div id="feedback"></div>
</div>
</div>

<!-- End Screen -->
<div id="endScreen">
<h1>Quiz Completed!</h1>
<p id="finalScore"></p>
<button onclick="restartQuiz()">Play Again</button>
</div>

<!-- Audio -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>
// MCQs exactly as you provided
const mcqs=[
{q:'The infinitive in the sentence is: "Riya wants to learn coding during her summer vacation."',opts:["wants","learn","to learn","coding"],ans:"to learn"},
{q:'Which word is a gerund? "Swimming every morning makes Aryan feel energetic."',opts:["morning","energetic","feel","Swimming"],ans:"Swimming"},
{q:'Find the participle in the sentence: "The excited fans cheered loudly after the goal."',opts:["fans","goal","cheered","excited"],ans:"excited"},
{q:'Which option contains an infinitive?',opts:["Dancing is fun.","To dance is fun.","Danced happily.","Dancing happily."],ans:"To dance is fun."},
{q:'The gerund in the sentence is: "Playing video games can improve problem-solving skills."',opts:["improve","skills","Playing","games"],ans:"Playing"},
{q:'Choose the participle: "The barking dog woke everyone up."',opts:["woke","barking","everyone","dog"],ans:"barking"},
{q:'What is the underlined phrase? "The students gathered early to watch the science show."',opts:["Gerund","Participle","Infinitive Phrase","Noun Phrase"],ans:"Infinitive Phrase"},
{q:'Identify the gerund: "Maya enjoys painting superheroes in her notebook."',opts:["enjoys","superheroes","notebook","painting"],ans:"painting"},
{q:'Find the participle: "The broken skateboard lay beside the ramp."',opts:["lay","beside","broken","ramp"],ans:"broken"},
{q:'Which sentence contains a gerund?',opts:["I want to travel the world.","Running helps me stay fit.","The tired player rested.","She plans to win."],ans:"Running helps me stay fit."}
];

let currentQ=0;
let score=0;

// DOM elements
const logoScreen=document.getElementById('logoScreen');
const quizScreen=document.getElementById('quizScreen');
const questionText=document.getElementById('questionText');
const optionsBox=document.getElementById('optionsBox');
const feedback=document.getElementById('feedback');
const scoreText=document.getElementById('scoreText');
const endScreen=document.getElementById('endScreen');
const finalScore=document.getElementById('finalScore');
const correctAudio=document.getElementById('correctSound');
const wrongAudio=document.getElementById('wrongSound');
const clapAudio=document.getElementById('clapSound');

// Show logo first
logoScreen.style.display='flex';
setTimeout(()=>{
  logoScreen.style.display='none';
  quizScreen.style.display='flex';
  showQuestion();
},5000);

// Show current question
function showQuestion(){
  feedback.innerText="";
  const q=mcqs[currentQ];
  questionText.innerText=q.q;
  optionsBox.innerHTML='';
  q.opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.innerText=opt;
    btn.onclick=()=>checkAnswer(opt,btn);
    optionsBox.appendChild(btn);
  });
  scoreText.innerText=`Question ${currentQ+1} of ${mcqs.length}`;
}

// Check answer
function checkAnswer(selected,btn){
  const q=mcqs[currentQ];
  const buttons=document.querySelectorAll('#optionsBox button');
  buttons.forEach(b=>b.disabled=true);
  if(selected===q.ans){
    btn.classList.add('correct');
    feedback.innerText="Correct!";
    correctAudio.currentTime=0; correctAudio.play();
    score++;
  } else{
    btn.classList.add('wrong');
    feedback.innerText="Wrong! Correct: "+q.ans;
    wrongAudio.currentTime=0; wrongAudio.play();
    buttons.forEach(b=>{if(b.innerText===q.ans) b.classList.add('correct');});
  }
  setTimeout(nextQuestion,1200);
}

// Next question
function nextQuestion(){
  currentQ++;
  if(currentQ>=mcqs.length){
    quizScreen.style.display='none';
    endScreen.style.display='flex';
    finalScore.innerText=`You scored ${score} / ${mcqs.length}`;
    clapAudio.play();
  } else{
    showQuestion();
  }
}

// Restart
function restartQuiz(){
  currentQ=0;
  score=0;
  endScreen.style.display='none';
  quizScreen.style.display='flex';
  showQuestion();
}
</script>
</body>
</html>
