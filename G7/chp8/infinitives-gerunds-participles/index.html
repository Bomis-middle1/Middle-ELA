<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinitives, Gerunds, Participles Balloon Game</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#140f3d;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;height:100vh;}
h1{color:#ffd60a;margin-top:10px;}
#gameArea{position:relative;width:400px;height:500px;background:#342070;border:4px solid #ffb347;border-radius:12px;overflow:hidden;}
.balloon{position:absolute;width:60px;height:80px;background:#ff595e;border-radius:30px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:14px;cursor:pointer;user-select:none;}
#scoreText{margin:10px;}
#mcqBox{background:#fff4d6;color:#2d2340;padding:15px;border-radius:15px;max-width:400px;text-align:center;display:none;margin-top:15px;}
button{padding:8px 12px;margin:5px;border-radius:12px;border:none;background:#ffb703;color:#2d2340;font-weight:bold;cursor:pointer;}
.correct{background:#b7efc5;}
.wrong{background:#ffccd5;}
.feedback{min-height:25px;margin-top:8px;font-weight:bold;}
#endScreen{display:none;text-align:center;margin-top:20px;}
.trophy{font-size:60px;margin-bottom:12px;color:#ffd60a;}
</style>
</head>
<body>

<h1>Infinitives, Gerunds & Participles Balloon Pop</h1>
<div id="scoreText">Balloons popped: 0 | MCQs answered: 0/10</div>
<div id="gameArea"></div>

<div id="mcqBox">
  <div id="questionText"></div>
  <div id="optionsBox"></div>
  <div class="feedback" id="feedback"></div>
  <button onclick="closeMCQ()">Continue</button>
</div>

<div id="endScreen">
  <div class="trophy">🏆</div>
  <h2>Well Done!</h2>
  <p id="finalScore"></p>
  <button onclick="restartGame()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
// Balloon words
const words=[
  {word:"to run",type:"Infinitive"},
  {word:"running",type:"Gerund"},
  {word:"broken",type:"Participle"},
  {word:"to eat",type:"Infinitive"},
  {word:"swimming",type:"Gerund"},
  {word:"painted",type:"Participle"},
  {word:"to write",type:"Infinitive"},
  {word:"singing",type:"Gerund"},
  {word:"fallen",type:"Participle"}
];

// MCQs
const mcqs=[
  {q:"She loves ___ in the park.",opts:["to run","running","broken"],ans:"running"},
  {q:"The vase ___ yesterday.",opts:["to eat","broken","painted"],ans:"broken"},
  {q:"I want ___ a story.",opts:["to write","singing","fallen"],ans:"to write"},
  {q:"He enjoys ___ every morning.",opts:["to run","running","painted"],ans:"running"},
  {q:"The door was ___ by the painter.",opts:["broken","painted","fallen"],ans:"painted"},
  {q:"They decided ___ abroad.",opts:["to eat","to run","to write"],ans:"to run"},
  {q:"___ in the water is fun.",opts:["Swimming","to run","painted"],ans:"Swimming"},
  {q:"The leaves had ___ from the tree.",opts:["fallen","running","to write"],ans:"fallen"},
  {q:"He likes ___ songs.",opts:["singing","to eat","broken"],ans:"singing"},
  {q:"I plan ___ tomorrow.",opts:["to eat","to write","painted"],ans:"to write"}
];

let balloonsPopped=0;
let mcqIndex=0;
let score=0;

// Game area
const gameArea=document.getElementById('gameArea');
const gameWidth=400, gameHeight=500;

// Generate balloons
function spawnBalloon(){
  const b=document.createElement('div');
  b.className='balloon';
  const w=words[Math.floor(Math.random()*words.length)];
  b.dataset.type=w.type;
  b.dataset.word=w.word;
  b.innerText=w.word;
  b.style.left=Math.random()*(gameWidth-60)+'px';
  b.style.top=gameHeight+'px';
  gameArea.appendChild(b);

  // Move balloon
  const interval=setInterval(()=>{
    let y=parseInt(b.style.top);
    y-=2;
    b.style.top=y+'px';
    if(y<-80){
      clearInterval(interval);
      if(b.parentNode) b.parentNode.removeChild(b);
    }
  },30);

  b.onclick=function(){
    clearInterval(interval);
    if(b.parentNode) b.parentNode.removeChild(b);
    balloonsPopped++;
    document.getElementById('scoreText').innerText=`Balloons popped: ${balloonsPopped} | MCQs answered: ${mcqIndex}/10`;
    if(balloonsPopped%3===0 && mcqIndex<10) showMCQ();
  }
}

// Spawn balloons every 1.2s
const balloonInterval=setInterval(spawnBalloon,1200);

// MCQ Functions
function showMCQ(){
  const box=document.getElementById('mcqBox');
  box.style.display='block';
  const q=mcqs[mcqIndex];
  document.getElementById('questionText').innerText=q.q;
  const optionsBox=document.getElementById('optionsBox');
  optionsBox.innerHTML='';
  q.opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.innerText=opt;
    btn.onclick=()=>checkMCQ(opt,btn);
    optionsBox.appendChild(btn);
  });
  document.getElementById('feedback').innerText='';
}

function checkMCQ(selected,btn){
  const q=mcqs[mcqIndex];
  const buttons=document.querySelectorAll('#optionsBox button');
  buttons.forEach(b=>b.disabled=true);
  if(selected===q.ans){
    btn.classList.add('correct');
    document.getElementById('feedback').innerText='Correct!';
    document.getElementById('correctSound').play();
    score++;
  }else{
    btn.classList.add('wrong');
    document.getElementById('feedback').innerText='Wrong! Correct: '+q.ans;
    document.getElementById('wrongSound').play();
    buttons.forEach(b=>{if(b.innerText===q.ans)b.classList.add('correct');});
  }
  mcqIndex++;
}

function closeMCQ(){
  document.getElementById('mcqBox').style.display='none';
  if(mcqIndex>=10){
    clearInterval(balloonInterval);
    document.getElementById('gameArea').style.display='none';
    document.getElementById('endScreen').style.display='block';
    document.getElementById('finalScore').innerText=`Balloons popped: ${balloonsPopped} | MCQs correct: ${score}`;
    document.getElementById('clapSound').play();
  }
}

function restartGame(){
  location.reload();
}
</script>
</body>
</html>
