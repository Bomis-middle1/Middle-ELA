<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
<title>Infinitives, Gerunds & Participles Quiz</title>
<style>
/* ==========================================================================
   GLOBAL GAME ENVIRONMENT
   ========================================================================== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

body {
    background: radial-gradient(circle at center, #2e1065 0%, #0f052d 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: -webkit-fill-available;
    width: 100vw;
    overflow: hidden;
}

/* SCREEN MANAGER */
.screen {
    display: none;
    width: 100vw;
    height: 100vh;
    height: -webkit-fill-available;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
}
.screen.active {
    display: flex;
}

/* STAGE 1: BRAND INTRO LOGO SCREEN */
#logoScreen {
    background: #ffffff;
    z-index: 9999;
}
.logo-container {
    width: 280px;
    max-width: 80%;
}
.logo-container img {
    width: 100%;
    height: auto;
    display: block;
}

/* STAGE 2: ADVENTURE MAIN HUD */
.game-layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 520px;
    height: 90%;
}

.hud-panel {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-weight: bold;
    font-size: 15px;
    letter-spacing: 0.5px;
}

.health-track {
    background: rgba(0, 0, 0, 0.3);
    width: 120px;
    height: 12px;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.2);
}
.health-fill {
    background: linear-gradient(90deg, #ffb703, #fb8500);
    width: 10%;
    height: 100%;
    transition: width 0.4s ease;
}

/* STAGE 3: RUNTIME ENEMY AND DIALOGUE CARD */
.boss-arena {
    font-size: 64px;
    margin: 10px 0;
    animation: floating 3s ease-in-out infinite;
}

.question-card {
    background: rgba(255, 255, 255, 0.95);
    color: #1a153b;
    border-radius: 24px;
    padding: 24px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    border-bottom: 6px solid #cfc7e8;
}

.question-text {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.45;
    margin-bottom: 20px;
}

.options-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* STAGE 4: CONTROL ELEMENTS */
button.game-btn {
    padding: 14px 20px;
    border: none;
    border-radius: 14px;
    background: #f0ecfa;
    color: #2d2340;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    border-bottom: 4px solid #cfc7e8;
    transition: transform 0.1s, background 0.2s;
    text-align: left;
}
button.game-btn:active { transform: scale(0.98); }

button.game-btn.correct {
    background: #b7efc5 !important;
    border-bottom-color: #74c69d !important;
    color: #1b4332;
}
button.game-btn.wrong {
    background: #ffccd5 !important;
    border-bottom-color: #ff85a1 !important;
    color: #5c0d12;
}

.banner-action {
    margin-top: 15px;
    font-weight: bold;
    font-size: 15px;
    min-height: 22px;
}
.banner-action.text-correct { color: #2a9d8f; }
.banner-action.text-wrong { color: #e63946; }

/* SUMMARY CARD OVERLAY */
.summary-box {
    background: rgba(255, 255, 255, 0.96);
    color: #2d2340;
    border-radius: 28px;
    padding: 40px 30px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.action-restart {
    background: linear-gradient(135deg, #ffb703, #fb8500);
    color: #fff;
    border-bottom: 4px solid #b86200;
    width: 100%;
    text-align: center;
}

/* SCREEN RENDERING FX */
canvas#visualFX {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 99999;
}

@keyframes floating {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}
</style>
</head>
<body>

<canvas id="visualFX"></canvas>

<audio id="correctSound" src="assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="assets/clapping.mp3" preload="auto"></audio>

<div id="logoScreen" class="screen active">
    <div class="logo-container">
        <img src="assets/innovine-logo.png" alt="Innovine Logo">
    </div>
</div>

<div id="quizScreen" class="screen">
    <div class="game-layout">
        
        <div class="hud-panel">
            <div id="scoreText">STAGE 1 / 10</div>
            <div class="health-track">
                <div id="healthBar" class="health-fill"></div>
            </div>
        </div>

        <div class="boss-arena">👾</div>

        <div class="question-card">
            <div id="questionText" class="question-text">Loading encounter parameters...</div>
            <div id="optionsBox" class="options-grid"></div>
            <div id="feedback" class="banner-action"></div>
        </div>

    </div>
</div>

<div id="endScreen" class="screen">
    <div class="summary-box">
        <div style="font-size: 64px; margin-bottom: 12px;">🏆</div>
        <h1 style="color: #2d2340; font-size: 28px; margin-bottom: 10px;">Adventure Clear!</h1>
        <p id="finalScore" style="font-size: 18px; margin-bottom: 25px; font-weight: 600; color: #5c5470;"></p>
        <button class="game-btn action-restart" onclick="restartQuiz()">Challenge Again</button>
    </div>
</div>

<script>
// MCQs untouched context values
const mcqs=[
{q:'The infinitive in the sentence is: "Riya wants to learn coding during her summer vacation."',opts:["wants","learn","to learn","coding"],ans:"to learn"},
{q:'Which word is a gerund? "Swimming every morning makes Aryan feel energetic."',opts:["morning","energetic","feel","Swimming"],ans:"Swimming"},
{q:'Find the participle in the sentence: "The excited fans cheered loudly after the goal."',opts:["fans","goal","cheered","excited"],ans:"excited"},
{q:'Which option contains an infinitive?',opts:["Dancing is fun.","To dance is fun.","Danced happily.","Dancing happily."],ans:"To dance is fun."},
{q:'The gerund in the sentence is: "Playing video games can improve problem-solving skills."',opts:["improve","skills","Playing","games"],ans:"Playing"},
{q:'Choose the participle: "The barking dog woke everyone up."',opts:["woke","barking","everyone","dog"],ans:"barking"},
{q:'What is the underlined phrase? "The students gathered early to watch the science show."',opts:["Gerund","Participle","Infinitive Phrase","Noun Phrase"],ans:"Infinitive Phrase"},
{q:'Identify the gerund: "Maya enjoys painting superheroes in her notebook."',opts:["enjoys","superheroes","notebook","painting"],ans:"painting"},
{q:'Find the participle: "The broken skateboard lay beside the ramp."',opts:["lay","beside","broken","ramp"],ans:"broken"},
{q:'Which sentence contains a gerund?',opts:["I want to travel the world.","Running helps me stay fit.","The tired player rested.","She plans to win."],ans:"Running helps me stay fit."}
];

let currentQ = 0;
let score = 0;

const logoScreen = document.getElementById('logoScreen');
const quizScreen = document.getElementById('quizScreen');
const questionText = document.getElementById('questionText');
const optionsBox = document.getElementById('optionsBox');
const feedback = document.getElementById('feedback');
const scoreText = document.getElementById('scoreText');
const healthBar = document.getElementById('healthBar');
const endScreen = document.getElementById('endScreen');
const finalScore = document.getElementById('finalScore');

const correctAudio = document.getElementById('correctSound');
const wrongAudio = document.getElementById('wrongSound');
const clapAudio = document.getElementById('clapSound');

// Audio engine standard initialization wrapper
window.onload = () => {
    setTimeout(() => {
        logoScreen.classList.remove('active');
        quizScreen.classList.add('active');
        showQuestion();
    }, 5000);
};

function showQuestion() {
    feedback.innerText = "";
    feedback.className = "banner-action";
    
    const q = mcqs[currentQ];
    questionText.innerText = q.q;
    optionsBox.innerHTML = '';
    
    // Smoothly scale health map indicator metrics
    healthBar.style.width = `${((currentQ + 1) / mcqs.length) * 100}%`;
    scoreText.innerText = `STAGE ${currentQ + 1} / ${mcqs.length}`;
    
    q.opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "game-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, btn);
        optionsBox.appendChild(btn);
    });
}

function checkAnswer(selected, btn) {
    const q = mcqs[currentQ];
    const buttons = document.querySelectorAll('#optionsBox button');
    buttons.forEach(b => b.disabled = true);
    
    if (selected === q.ans) {
        btn.classList.add('correct');
        feedback.innerText = "✨ Critical Strike! Correct!";
        feedback.classList.add('text-correct');
        try { correctAudio.currentTime = 0; correctAudio.play().catch(()=>{}); } catch(e){}
        score++;
        triggerFXBurst();
    } else {
        btn.classList.add('wrong');
        feedback.innerText = "💥 Deflected! Correct: " + q.ans;
        feedback.classList.add('text-wrong');
        try { wrongAudio.currentTime = 0; wrongAudio.play().catch(()=>{}); } catch(e){}
        buttons.forEach(b => {
            if (b.innerText === q.ans) b.classList.add('correct');
        });
    }
    setTimeout(nextQuestion, 1600);
}

function nextQuestion() {
    currentQ++;
    if (currentQ >= mcqs.length) {
        quizScreen.classList.remove('active');
        endScreen.classList.add('active');
        finalScore.innerText = `You completed the dungeon scoring ${score} out of ${mcqs.length}!`;
        try { clapAudio.currentTime = 0; clapAudio.play().catch(()=>{}); } catch(e){}
    } else {
        showQuestion();
    }
}

function restartQuiz() {
    currentQ = 0;
    score = 0;
    endScreen.classList.remove('active');
    quizScreen.classList.add('active');
    showQuestion();
}

/* ==========================================================================
   PARTICLE RENDER CONTEXT ENGINE
   ========================================================================== */
const canvas = document.getElementById("visualFX");
const ctx = canvas.getContext("2d");
let pieces = [], animationRef = null;

function syncCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", syncCanvas);
syncCanvas();

function triggerFXBurst() {
    pieces = [];
    cancelAnimationFrame(animationRef);
    const colors = ["#ffb703", "#fb8500", "#ffd60a", "#4cc9f0", "#f72585"];
    
    for (let i = 0; i < 50; i++) {
        pieces.push({
            x: canvas.width / 2,
            y: canvas.height * 0.4,
            w: Math.random() * 6 + 6,
            h: Math.random() * 6 + 6,
            vy: Math.random() * -5 - 2,
            vx: Math.random() * 8 - 4,
            rot: Math.random() * 360,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
    
    let ticks = 0;
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot * Math.PI / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
            ctx.restore();
            p.y += p.vy; p.vy += 0.15;
            p.x += p.vx;
            p.rot += 2;
        });
        if (++ticks < 75) animationRef = requestAnimationFrame(loop);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    loop();
}
</script>
</body>
</html>
