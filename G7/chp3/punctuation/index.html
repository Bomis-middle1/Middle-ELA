<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punctuation Balloon Pop Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: linear-gradient(135deg, #6dd5fa, #ff758c);
}

/* ---------- SCREENS ---------- */
.screen {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
}

/* ---------- SPLASH ---------- */
#splash img {
    width: 180px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

/* ---------- TITLE ---------- */
#title {
    font-size: 2rem;
    color: white;
    display: none;
    font-weight: bold;
}

/* ---------- START BUTTON ---------- */
button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #ffdd57;
    cursor: pointer;
    margin-top: 20px;
}

/* ---------- GAME AREA ---------- */
#game {
    display: none;
    flex-direction: column;
    width: 100%;
    height: 100%;
}

#questionBox {
    padding: 20px;
    font-size: 20px;
    color: white;
    font-weight: bold;
}

/* ---------- BALLOONS ---------- */
.balloon {
    position: absolute;
    width: 120px;
    height: 140px;
    background: radial-gradient(circle at 30% 30%, #fff, #ff4d6d);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    cursor: pointer;
    animation: float 6s linear infinite;
    box-shadow: 0 10px 15px rgba(0,0,0,0.2);
}

.balloon::after {
    content: "";
    position: absolute;
    bottom: -20px;
    width: 2px;
    height: 25px;
    background: #333;
}

@keyframes float {
    0% { transform: translateY(100vh); }
    100% { transform: translateY(-20vh); }
}

/* ---------- CONFETTI ---------- */
.confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    background: yellow;
    animation: fall 2s linear forwards;
}

@keyframes fall {
    to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

/* ---------- CONTROLS ---------- */
#controls {
    position: absolute;
    bottom: 10px;
    left: 10px;
    color: white;
}

/* ---------- END SCREEN ---------- */
#endScreen {
    display: none;
    color: white;
    font-size: 24px;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="screen">
    <img src="assets/logo.png" alt="Innovine Logo">
</div>

<!-- TITLE -->
<div id="title" class="screen">
    <div>🎯 Punctuation Power Challenge!</div>
    <button onclick="startGame()">Start</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
    <div id="questionBox"></div>
</div>

<!-- END -->
<div id="endScreen" class="screen">
    <div id="scoreText"></div>
    <button onclick="restart()">Restart</button>
</div>

<!-- SOUND -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<!-- VOLUME -->
<div id="controls">
Volume: <input type="range" min="0" max="1" step="0.1" value="0.7" onchange="setVolume(this.value)">
</div>

<script>

const questions = [
{q:"I can’t believe we finally finished the project ___", a:[".", "!", "?", ","], c:"!"},
{q:"Where are you going ___", a:[".", "!", "?", ","], c:"?"},
{q:"She whispered, “Don’t tell anyone.”", a:["Correct","Wrong","None","Error"], c:"Correct"},
{q:"The teacher said, “Submit your work.”", a:["A","B","C","D"], c:"A"},
{q:"You need ___ notebook pen ruler and eraser", a:[".",":","!","?"], c:":"},
{q:"I love reading books its my hobby", a:["A","B","C","D"], c:"A"},
{q:"Let’s go to the park tomorrow ___", a:[".",",","!", "?"], c:"."},
{q:"Wow this place is incredible ___", a:["!",".","?",","], c:"!"},
{q:"My brother who lives in mumbai is visiting", a:["Mumbai capital","comma error","full stop","none"], c:"Mumbai capital"},
{q:"Are you coming with us ___", a:["!",".","?",","], c:"?"},
{q:"The weather is beautiful let’s go outside", a:["A","B","C","D"], c:"B"},
{q:"He shouted, “Watch out!”", a:["Correct","Wrong","None","Error"], c:"Correct"},
{q:"I visited delhi last year", a:["A","B","C","D"], c:"B"},
{q:"Bring snacks water juice and chips", a:["A","B","C","D"], c:"A"},
{q:"She asked, “Where are you going?”", a:["A","B","C","D"], c:"B"}
];

let current = 0;
let score = 0;
let shuffled = [];

const splash = document.getElementById("splash");
const title = document.getElementById("title");
const game = document.getElementById("game");

setTimeout(()=>{
    splash.style.display="none";
    title.style.display="flex";
},5000);

function startGame(){
    title.style.display="none";
    game.style.display="flex";
    shuffled = questions.sort(()=>Math.random()-0.5);
    current = 0;
    score = 0;
    loadQuestion();
}

function loadQuestion(){
    clearBalloons();
    if(current >= shuffled.length){
        endGame();
        return;
    }

    let q = shuffled[current];
    document.getElementById("questionBox").innerText = q.q;

    q.a.forEach(opt=>{
        createBalloon(opt, q.c);
    });
}

function createBalloon(text, correct){
    let b = document.createElement("div");
    b.className = "balloon";
    b.innerText = text;
    b.style.left = Math.random()*80 + "vw";
    b.style.animationDuration = (4 + Math.random()*3) + "s";

    b.onclick = ()=>{
        if(text === correct){
            score++;
            playCorrect();
            confetti();
        } else {
            playWrong();
        }
        current++;
        setTimeout(loadQuestion, 1000);
    };

    game.appendChild(b);
}

function clearBalloons(){
    document.querySelectorAll(".balloon").forEach(b=>b.remove());
}

function playCorrect(){
    let a = document.getElementById("correctSound");
    a.volume = volume;
    a.play();
}

function playWrong(){
    let a = document.getElementById("wrongSound");
    a.volume = volume;
    a.play();
}

let volume = 0.7;
function setVolume(v){
    volume = v;
}

function confetti(){
    for(let i=0;i<30;i++){
        let c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random()*100 + "vw";
        c.style.background = ["#ff0","#0ff","#f0f","#0f0"][Math.floor(Math.random()*4)];
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),2000);
    }
}

function endGame(){
    game.style.display="none";
    document.getElementById("endScreen").style.display="flex";
    document.getElementById("scoreText").innerText =
        `🎉 You scored ${score} / ${shuffled.length}`;
}

function restart(){
    location.reload();
}

</script>

</body>
</html>
