<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punctuation Balloon Pop</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{overflow:hidden;background:#dff6ff;}

/* ================= LOGO ================= */
#logoScreen{
position:fixed;inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#logoScreen img{
width:220px;
}

/* ================= TITLE ================= */
#titleScreen{
position:fixed;inset:0;
display:none;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(#4fc3f7,#e1f5fe);
z-index:9998;
}

#titleScreen h1{
font-size:48px;
color:#0d47a1;
animation:bounce 1.2s infinite;
}

@keyframes bounce{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

/* ================= START ================= */
#startScreen{
position:fixed;inset:0;
display:none;
justify-content:center;
align-items:center;
background:#e3f2fd;
z-index:9997;
}

#startBtn{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:12px;
background:#ffca28;
font-weight:bold;
cursor:pointer;
}

/* ================= GAME ================= */
#game{
display:none;
width:100%;
height:100vh;
position:relative;
overflow:hidden;
background:linear-gradient(to top,#a8e6ff,#ffffff);
}

#score{
position:absolute;
top:15px;
left:15px;
font-size:22px;
font-weight:bold;
color:#0d47a1;
}

/* ================= BALLOONS ================= */
.balloon{
position:absolute;
width:45px;
height:60px;
border-radius:50% 50% 45% 45%;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
color:white;
font-weight:bold;
cursor:pointer;
animation:floatUp 10s linear forwards;
box-shadow:inset -5px -8px rgba(0,0,0,0.1);
}

.balloon::after{
content:"";
position:absolute;
bottom:-12px;
width:2px;
height:14px;
background:#555;
}

/* slow kid-friendly movement */
@keyframes floatUp{
0%{transform:translateY(100vh);}
50%{transform:translateY(40vh) translateX(20px);}
100%{transform:translateY(-120vh) translateX(-10px);}
}

.red{background:#ff5252;}
.blue{background:#42a5f5;}
.green{background:#66bb6a;}
.yellow{background:#ffca28;}
.purple{background:#ab47bc;}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
<img src="assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen">
<h1>Punctuation Pop 🎈</h1>
<p>Tap the correct punctuation balloon!</p>
</div>

<!-- START -->
<div id="startScreen">
<button id="startBtn">Start Game</button>
</div>

<!-- GAME -->
<div id="game">
<div id="score">Score: 0</div>
</div>

<script>

/* ================= FLOW ================= */

setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("titleScreen").style.display="flex";
},5000);

setTimeout(()=>{
document.getElementById("titleScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";
},8000);

/* ================= AUDIO FIX ================= */
const audioUnlock = () => {
document.body.addEventListener("click",()=>{
console.log("Audio unlocked");
},{once:true});
};
audioUnlock();

/* ================= GAME START ================= */

let score=0;
let gameStarted=false;

document.getElementById("startBtn").onclick=()=>{
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
gameStarted=true;
spawnLoop();
};

/* ================= BALLOONS ================= */

const symbols = [
{symbol:"!",type:"correct"},
{symbol:"?",type:"wrong"},
{symbol:".",type:"wrong"}
];

function spawnBalloon(){

if(!gameStarted) return;

let b=document.createElement("div");

let data=symbols[Math.floor(Math.random()*symbols.length)];
let colors=["red","blue","green","yellow","purple"];

b.className="balloon "+colors[Math.floor(Math.random()*colors.length)];
b.innerText=data.symbol;

b.style.left=Math.random()*90+"vw";

b.onclick=()=>{

if(data.type==="correct"){
score+=10;
document.getElementById("score").innerText="Score: "+score;
b.remove();
}else{
b.style.transform="scale(0.8)";
setTimeout(()=>b.remove(),200);
}

};

document.getElementById("game").appendChild(b);

setTimeout(()=>b.remove(),10000);
}

/* slower spawn */
function spawnLoop(){
setInterval(spawnBalloon,2000);
}

</script>

</body>
</html>
