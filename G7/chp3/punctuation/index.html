<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punctuation Pop – Grade 7</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial;}

#splashScreen,#titleScreen,#game,#trophyScreen{
position:fixed;inset:0;display:none;justify-content:center;align-items:center;
}

/* SPLASH */
#splashScreen{background:white;z-index:9999;}
#splashLogo{width:220px;animation:pulse 2s infinite;}
@keyframes pulse{0%{transform:scale(1);}50%{transform:scale(1.08);}100%{transform:scale(1);}}

/* TITLE */
#titleScreen{
flex-direction:column;
background:linear-gradient(#83d7ff,#dff7ff);
z-index:9000;
}
#titleScreen h1{font-size:50px;color:#004080;}

/* GAME */
#game{display:none;position:relative;width:100%;height:100%;overflow:hidden;}
.sky{position:absolute;inset:0;background:linear-gradient(#5fc7ff,#eefcff);}
.sun{position:absolute;top:40px;right:60px;width:100px;height:100px;background:gold;border-radius:50%;}
.cloud{position:absolute;width:120px;height:40px;background:white;border-radius:50px;opacity:0.9;}
.cloud1{top:80px;left:-200px;animation:move 25s linear infinite;}
.cloud2{top:160px;left:-300px;animation:move 30s linear infinite;}
@keyframes move{from{transform:translateX(0);}to{transform:translateX(1600px);}}

.hill{position:absolute;bottom:0;width:600px;height:200px;background:green;border-radius:50%;}
.leftHill{left:-200px;}
.rightHill{right:-200px;background:#4caf50;}

#topBar{
position:absolute;top:0;width:100%;
display:flex;justify-content:space-between;
padding:10px;background:rgba(255,255,255,0.6);
}

#question{
position:absolute;top:90px;width:100%;
text-align:center;font-size:28px;font-weight:bold;
}

#options{
position:absolute;bottom:80px;width:100%;
display:flex;flex-direction:column;align-items:center;gap:10px;
}

.optionBtn{
padding:12px 20px;width:80%;
font-size:18px;border:none;border-radius:10px;
background:#e3f2fd;cursor:pointer;
}

/* BALLOONS */
#balloonArea{position:absolute;inset:0;overflow:hidden;}
.balloon{
position:absolute;
width:40px;height:40px;border-radius:50%;
display:flex;justify-content:center;align-items:center;
font-size:18px;
animation:floatUp 6s linear forwards;
}
.red{background:red;}
.blue{background:deepskyblue;}
.green{background:limegreen;}
.yellow{background:gold;}
.purple{background:violet;}

@keyframes floatUp{
from{transform:translateY(100vh);}
to{transform:translateY(-120vh);}
}

/* TROPHY */
#trophyScreen{
flex-direction:column;
background:linear-gradient(#1a237e,#4a148c);
color:white;
z-index:10000;
text-align:center;
}
#trophyScreen h1{font-size:40px;margin-top:10px;}
#restartBtn{margin-top:20px;padding:12px 20px;font-size:18px;border:none;border-radius:10px;background:#00e676;cursor:pointer;}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splashScreen">
<img id="splashLogo" src="assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen">
<h1>Punctuation Pop</h1>
<p>Grade 7</p>
</div>

<!-- GAME -->
<div id="game">

<div class="sky"></div>
<div class="sun"></div>
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="hill leftHill"></div>
<div class="hill rightHill"></div>

<div id="topBar">
<div id="score">⭐ Score: 0</div>
<div id="progress"><div id="progressFill" style="width:0;height:100%;background:limegreen;"></div></div>
</div>

<div id="question">Loading...</div>
<div id="options"></div>
<div id="balloonArea"></div>

</div>

<!-- TROPHY SCREEN (FIXED LOCATION) -->
<div id="trophyScreen">
<div style="font-size:80px;">🏆</div>
<h1>Amazing Job!</h1>
<p id="finalScore"></p>
<button id="restartBtn">Play Again</button>
</div>

<script>

/* SCREENS */
const splash=document.getElementById("splashScreen");
const title=document.getElementById("titleScreen");
const game=document.getElementById("game");
const trophy=document.getElementById("trophyScreen");

/* QUESTION BANK */
const questions=[
{q:"I can’t believe it ___",options:[".","!","?"],answer:"!"},
{q:"Where is the library ___",options:[".","?","!"],answer:"?"},
{q:"John said he is coming ___",options:[".","?","!"],answer:"."},
{q:"Wow that was amazing ___",options:[".","!","?"],answer:"!"},
{q:"Are you ready ___",options:[".","?","!"],answer:"?"},
{q:"Please sit down ___ said the teacher",options:[",",":","."],answer:":"},
{q:"I bought apples oranges and bananas ___",options:[",",";","."],answer:"."},
{q:"My favorite colors are red blue and green ___",options:[",",";","."],answer:","
},
{q:"Stop right there ___",options:[".","!","?"],answer:"!"},
{q:"She asked where are you going ___",options:[".","?","!"],answer:"?"}
];

let index=0;
let score=0;

/* SPLASH FLOW */
setTimeout(()=>{splash.style.display="none";title.style.display="flex";},3000);
setTimeout(()=>{title.style.display="none";game.style.display="block";startGame();},6000);

/* GAME START */
function startGame(){
index=0;
score=0;
loadQuestion();
}

/* LOAD QUESTION */
function loadQuestion(){
if(index>=questions.length){endGame();return;}

let q=questions[index];
document.getElementById("question").textContent=q.q;

let optDiv=document.getElementById("options");
optDiv.innerHTML="";

q.options.forEach(o=>{
let btn=document.createElement("button");
btn.className="optionBtn";
btn.textContent=o;
btn.onclick=()=>check(o===q.answer);
optDiv.appendChild(btn);
});

}

/* CHECK ANSWER */
function check(correct){
if(correct){score+=10;}
index++;
document.getElementById("score").textContent="⭐ Score: "+score;
document.getElementById("progressFill").style.width=((index/questions.length)*100)+"%";
loadQuestion();
}

/* END GAME */
function endGame(){
game.style.display="none";
trophy.style.display="flex";
document.getElementById("finalScore").textContent="Final Score: "+score+"/100";
}

/* RESTART */
document.getElementById("restartBtn").onclick=()=>{
trophy.style.display="none";
game.style.display="block";
startGame();
};

/* BALLOONS */
const balloonArea=document.getElementById("balloonArea");

function spawn(){
let b=document.createElement("div");
let colors=["red","blue","green","yellow","purple"];
let symbols=["!","?","."];
b.className="balloon "+colors[Math.floor(Math.random()*colors.length)];
b.textContent=symbols[Math.floor(Math.random()*symbols.length)];
b.style.left=Math.random()*window.innerWidth+"px";
balloonArea.appendChild(b);
setTimeout(()=>b.remove(),6000);
}
setInterval(spawn,1000);

</script>

</body>
</html>
