<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punctuation Pop - Fixed Version</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
overflow:hidden;
background:linear-gradient(#b3e5ff,#e6f7ff);
}

/* ================= LOGO ================= */
#logoScreen{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#logoScreen img{
width:220px;
}

/* ================= TITLE ================= */
#titleScreen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(#4fc3f7,#e1f5fe);
z-index:9998;
text-align:center;
}

#titleScreen h1{
font-size:50px;
color:#0d47a1;
animation:bounce 1.2s infinite;
}

@keyframes bounce{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

/* ================= START ================= */
#startScreen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:#e3f2fd;
z-index:9997;
}

#startBtn{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:12px;
background:#ffca28;
font-weight:bold;
cursor:pointer;
}

/* ================= GAME ================= */
#game{
display:none;
width:100%;
height:100vh;
position:relative;
overflow:hidden;
background:linear-gradient(to top,#9be2ff,#ffffff);
}

/* SCORE */
#score{
position:absolute;
top:15px;
left:15px;
font-size:22px;
font-weight:bold;
color:#0d47a1;
}

/* QUESTION */
#question{
position:absolute;
top:80px;
width:100%;
text-align:center;
font-size:30px;
font-weight:bold;
color:#0d47a1;
}

/* ================= BALLOONS ================= */
.balloon{
position:absolute;
width:48px;
height:62px;
border-radius:50% 50% 45% 45%;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
color:white;
cursor:pointer;
animation:floatUp 9s linear forwards;
box-shadow:inset -4px -6px rgba(0,0,0,0.1);
}

.balloon::after{
content:"";
position:absolute;
bottom:-12px;
width:2px;
height:14px;
background:#555;
}

@keyframes floatUp{
0%{transform:translateY(100vh);}
50%{transform:translateY(40vh) translateX(20px);}
100%{transform:translateY(-120vh) translateX(-10px);}
}

.red{background:#ff5252;}
.blue{background:#42a5f5;}
.green{background:#66bb6a;}
.yellow{background:#ffca28;}
.purple{background:#ab47bc;}

</style>
</head>

<body>

<!-- ================= LOGO ================= -->
<div id="logoScreen">
<img src="G7/chp3/punctuation/assets/innovine-logo.png">
</div>

<!-- ================= TITLE ================= -->
<div id="titleScreen">
<h1>Punctuation Pop 🎈</h1>
<p>Tap the correct punctuation balloon!</p>
</div>

<!-- ================= START ================= -->
<div id="startScreen">
<button id="startBtn">Start Game</button>
</div>

<!-- ================= GAME ================= -->
<div id="game">
<div id="score">Score: 0</div>
<div id="question">Loading...</div>
</div>

<script>

/* ================= FLOW ================= */

setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("titleScreen").style.display="flex";
},5000);

setTimeout(()=>{
document.getElementById("titleScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";
},8000);

/* ================= GAME DATA ================= */

const questions = [
{q:"I can’t believe it ___", answer:"!"},
{q:"Where is the library ___", answer:"?"},
{q:"Wow that was amazing ___", answer:"!"},
{q:"John is coming ___", answer:"."},
{q:"Are you ready ___", answer:"?"}
];

let index = 0;
let score = 0;
let currentAnswer = "";
let gameStarted = false;

/* ================= START GAME ================= */

document.getElementById("startBtn").onclick = () => {
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
gameStarted = true;
loadQuestion();
spawnLoop();
};

/* ================= LOAD QUESTION ================= */

function loadQuestion(){

if(index >= questions.length){
document.getElementById("question").innerText = "🎉 Game Over!";
return;
}

currentAnswer = questions[index].answer;
document.getElementById("question").innerText = questions[index].q;
}

/* ================= BALLOON SPAWN ================= */

function spawnBalloon(){

if(!gameStarted) return;

const symbols = ["!", "?", "."];
const colors = ["red","blue","green","yellow","purple"];

let symbol = symbols[Math.floor(Math.random()*symbols.length)];

let balloon = document.createElement("div");
balloon.className = "balloon " + colors[Math.floor(Math.random()*colors.length)];
balloon.innerText = symbol;
balloon.style.left = Math.random()*90 + "vw";

balloon.onclick = () => {

if(symbol === currentAnswer){
score += 10;
index++;
loadQuestion();
document.getElementById("score").innerText = "Score: " + score;
}

balloon.remove();

};

document.getElementById("game").appendChild(balloon);

setTimeout(()=>balloon.remove(),9000);
}

/* ================= LOOP ================= */

function spawnLoop(){
setInterval(spawnBalloon,1800);
}

</script>

</body>
</html>
