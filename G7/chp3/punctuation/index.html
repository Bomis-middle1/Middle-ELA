<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Punctuation Pop Balloon Game - Grade 7</title> <style> body { margin:0; font-family:Arial; background:#f0f8ff; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; } #logoScreen, #instructionScreen, #gameContainer { width:100%; max-width:600px; text-align:center; padding:20px; position:absolute; top:0; left:0; } #logoScreen { height:100%; display:flex; justify-content:center; align-items:center; background:white; z-index:100; } #instructionScreen { display:none; background:#fff; border-radius:10px; box-shadow:0 0 10px #aaa; z-index:99; } #gameContainer { display:none; background:#fff; border-radius:10px; box-shadow:0 0 10px #aaa; z-index:98; position:relative; height:80vh; } #sentence { font-size:18px; font-weight:bold; margin-bottom:10px; } #feedback { margin-top:10px; font-weight:bold; height:24px; } #restartBtn { display:none; margin-top:20px; padding:10px 20px; font-size:18px; cursor:pointer; background:#4caf50; color:white; border:none; border-radius:5px; } /* Balloon Styles */ .balloon { position:absolute; width:60px; height:80px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background: radial-gradient(circle at 30% 30%, #ffeb3b 0%, #f9c600 70%); display:flex; justify-content:center; align-items:center; cursor:pointer; font-weight:bold; font-size:20px; user-select:none; color:#000; } /* Balloon Knot */ .balloon::after { content:''; position:absolute; bottom:-8px; left:50%; transform:translateX(-50%); width:6px; height:6px; background:#ffeb3b; border-radius:50%; } /* Balloon String */ .balloon::before { content:''; position:absolute; bottom:-60px; left:50%; transform:translateX(-50%); width:2px; height:60px; background:#888; } .balloon.wiggle { animation: wiggle 0.5s; } @keyframes wiggle {0%{transform:rotate(0deg);}25%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}75%{transform:rotate(-10deg);}100%{transform:rotate(0deg);}} .confetti-piece { position:absolute; width:8px; height:8px; border-radius:50%; top:0; animation: fall 2s linear forwards;} @keyframes fall {0%{transform:translateY(0);}100%{transform:translateY(400px); opacity:0;}} </style> </head> <body> <div id="logoScreen"> <img src="assets/innovine-logo.png" alt="Innovine Logo" width="200"> </div> <div id="instructionScreen"> <h2>Punctuation Pop!</h2> <p>Click on the correct punctuation mark floating up the screen.</p> <p>Correct answers pop the balloon ✔, wrong answers wiggle ❌.</p> <p>Complete all 10 sentences to finish the game!</p> </div> <div id="gameContainer"> <div id="sentence"></div> <div id="feedback"></div> <button id="restartBtn">Play Again</button> </div> <audio id="correctSound" src="assets/correct.mp3"></audio> <audio id="wrongSound" src="assets/wrong.mp3"></audio> <audio id="clapSound" src="assets/clapping.mp3"></audio> <script> // --- Grade 7 punctuation questions --- const questions = [ {q:"I can’t believe it ___", options:[".","!","?"], answer:"!"}, {q:"Where is the library ___", options:[".","?","!"], answer:"?"}, {q:"John’s book is on the table ___", options:[".","'","!"], answer:"."}, {q:"“Please sit down,” said the teacher ___", options:[".","!","\""], answer:"\""}, {q:"She bought apples ___ oranges ___ and bananas ___", options:[",",".",";"], answer:","}, {q:"Remember: always check your work ___", options:[".","!",";"], answer:":"}, {q:"Did you finish your homework ___", options:["?","!","."], answer:"?"}, {q:"Wow ___ that was an amazing performance ___", options:["!","?","."], answer:"!"}, {q:"I visited Paris last summer ___ it was wonderful ___", options:[".",";",","], answer:"."}, {q:"Sarah said ___ “I will be late today” ___", options:[".","\"","'"], answer:"\""} ]; let current=0; const container = document.getElementById("gameContainer"); const sentenceEl = document.getElementById("sentence"); const feedback = document.getElementById("feedback"); const restartBtn = document.getElementById("restartBtn"); const correctSound = document.getElementById("correctSound"); const wrongSound = document.getElementById("wrongSound"); const clapSound = document.getElementById("clapSound"); function showQuestion(){ feedback.textContent=""; const q = questions[current]; sentenceEl.textContent = q.q; // Remove old balloons document.querySelectorAll(".balloon").forEach(b=>b.remove()); // Create floating balloons q.options.sort(()=>Math.random()-0.5).forEach((opt,i)=>{ const balloon = document.createElement("div"); balloon.className="balloon"; balloon.textContent=opt; balloon.style.left = (i*100 + 50) + "px"; balloon.style.bottom = "0px"; container.appendChild(balloon); balloon.onclick = ()=>checkAnswer(opt,q.answer,balloon); floatBalloon(balloon); }); } function floatBalloon(balloon){ let pos = 0; const interval = setInterval(()=>{ pos += 1; // speed balloon.style.bottom = pos + "px"; if(pos > container.offsetHeight) { clearInterval(interval); balloon.remove(); } }, 30); } function checkAnswer(selected, correct, balloon){ if(selected===correct){ feedback.textContent="Good Job! ✔"; feedback.style.color="green"; correctSound.currentTime=0; correctSound.play(); balloon.remove(); createConfetti(); setTimeout(nextQuestion,800); } else { feedback.textContent="Try Again! ❌"; feedback.style.color="red"; balloon.classList.add("wiggle"); wrongSound.currentTime=0; wrongSound.play(); setTimeout(()=>balloon.classList.remove("wiggle"),500); } } function nextQuestion(){ current++; if(current>=questions.length){ feedback.textContent="🎉 You completed all questions!"; clapSound.currentTime=0; clapSound.play(); restartBtn.style.display="block"; } else showQuestion(); } restartBtn.onclick = ()=>location.reload(); function createConfetti(){ for(let i=0;i<20;i++){ const c = document.createElement("div"); c.className="confetti-piece"; c.style.left = Math.random()*window.innerWidth+"px"; c.style.background = hsl(${Math.random()*360},100%,50%); document.body.appendChild(c); setTimeout(()=>c.remove(),1500); } } // --- Logo + Instructions --- setTimeout(()=>{ document.getElementById("logoScreen").style.display="none"; document.getElementById("instructionScreen").style.display="block"; setTimeout(()=>{ document.getElementById("instructionScreen").style.display="none"; container.style.display="block"; showQuestion(); },5000); },5000); </script> </body> </html>
