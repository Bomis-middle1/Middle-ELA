<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punctuation Pop Balloon Game - Grade 7</title>
  <style>
    :root{
      --bg-dark:#0f172a;
      --bg-mid:#1e293b;
      --text:#f8fafc;
      --card-bg:#ffffff;
      --success:#22c55e;
      --error:#ef4444;
      --accent:#60a5fa;
    }

    * { box-sizing: border-box; }

    body {
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 10% 10%, #2563eb 0%, transparent 60%),
        radial-gradient(1000px 700px at 90% 20%, #7c3aed 0%, transparent 60%),
        radial-gradient(900px 600px at 30% 80%, #0891b2 0%, transparent 60%),
        linear-gradient(180deg, var(--bg-dark), var(--bg-mid));
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      overflow:hidden;
      position:relative;
    }

    /* Animated subtle geometrics */
    body::before, body::after {
      content:'';
      position:absolute;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #93c5fd 70%);
      opacity: 0.08;
      filter: blur(10px);
      animation: float 18s ease-in-out infinite;
      z-index: 0;
      pointer-events:none;
    }
    body::before { top: 12%; left: 14%; }
    body::after  { bottom: 10%; right: 12%; animation-delay: -9s; }

    @keyframes float {
      0%,100% { transform: translateY(0) translateX(0) scale(1); }
      50%     { transform: translateY(-20px) translateX(10px) scale(1.05); }
    }

    #logoScreen, #instructionScreen, #gameContainer {
      position:absolute;
      width:100%;
      max-width:620px;
      text-align:center;
      padding:24px;
      left:0; right:0; margin:0 auto;
    }

    #logoScreen {
      height:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      background: transparent;
      z-index:100;
      pointer-events:none;
    }

    #instructionScreen {
      display:none;
      background: rgba(255,255,255,0.96);
      color: #111827;
      border-radius:16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.06);
      z-index:99;
      padding:28px 24px;
    }
    #instructionScreen h2 { margin: 0 0 12px 0; font-size: 28px; }
    #instructionScreen p { margin: 8px 0; font-size: 16px; }

    #gameContainer {
      display:none;
      background: var(--card-bg);
      color: #111827;
      border-radius:16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(0,0,0,0.06);
      z-index:98;
      position:relative;
      height:82vh;
      padding: 16px 18px 12px;
      overflow: hidden;
    }

    #gameHeader {
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom: 6px;
      font-size: 14px;
      color: #6b7280;
    }
    #gameHeader .progress { font-weight: bold; color: #374151; }

    #sentence {
      font-size: 20px;
      font-weight:bold;
      margin: 4px 0 8px;
      line-height: 1.35;
      min-height: 28px;
    }

    #feedback {
      margin-top:6px;
      font-weight:bold;
      height:24px;
      font-size: 16px;
    }

    #restartBtn {
      display:none;
      margin: 16px auto 8px;
      padding:12px 24px;
      font-size:18px;
      cursor:pointer;
      background:#22c55e;
      color:white;
      border:none;
      border-radius:10px;
      box-shadow: 0 6px 14px rgba(34,197,94,0.35);
    }
    #restartBtn:hover { background:#16a34a; }

    /* Balloon Styles */
    .balloon {
      position:absolute;
      width:64px; height:84px;
      border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
      background: radial-gradient(circle at 30% 30%, #fde047 0%, #f59e0b 70%);
      display:flex;
      justify-content:center;
      align-items:center;
      cursor:pointer;
      font-weight:bold;
      font-size:22px;
      user-select:none;
      color:#0b0f19;
      box-shadow: 0 8px 18px rgba(245,158,11,0.35), 0 0 0 1px rgba(0,0,0,0.08);
      transition: transform 0.08s ease;
      z-index: 1;
    }
    .balloon:hover { transform: translateY(-2px) scale(1.03); }

    .balloon::after {
      content:'';
      position:absolute;
      bottom:-8px; left:50%; transform:translateX(-50%);
      width:7px; height:7px;
      background:#fde047;
      border-radius:50%;
    }
    .balloon::before {
      content:'';
      position:absolute;
      bottom:-60px; left:50%; transform:translateX(-50%);
      width:2px; height:60px;
      background:#9ca3af;
    }

    .balloon.wiggle { animation: wiggle 0.5s; }
    @keyframes wiggle {
      0%{ transform:rotate(0deg); }
      25%{ transform:rotate(-10deg); }
      50%{ transform:rotate(10deg); }
      75%{ transform:rotate(-10deg); }
      100%{ transform:rotate(0deg); }
    }

    .confetti-piece {
      position:absolute;
      width:9px; height:9px;
      border-radius:50%;
      top:0;
      animation: fall 2s linear forwards;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      z-index: 2;
    }
    @keyframes fall {
      0% { transform: translateY(0) translateX(0); opacity:1; }
      100% { transform: translateY(420px) translateX(10px); opacity:0; }
    }

    @media (max-width: 420px) {
      #sentence { font-size: 18px; min-height: 24px; }
      .balloon { width: 58px; height: 78px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <div id="logoScreen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo" width="200">
  </div>

  <div id="instructionScreen">
    <h2>Punctuation Pop!</h2>
    <p>Click on the correct punctuation mark floating up the screen.</p>
    <p>Correct answers pop the balloon ✔, wrong answers wiggle ❌.</p>
    <p>Complete all 10 sentences to finish the game!</p>
  </div>

  <div id="gameContainer">
    <div id="gameHeader">
      <div>Punctuation Pop!</div>
      <div class="progress" id="progressText">Question 1 of 10</div>
    </div>
    <div id="sentence"></div>
    <div id="feedback"></div>
    <button id="restartBtn">Play Again</button>
  </div>

  <audio id="correctSound" src="assets/correct.mp3"></audio>
  <audio id="wrongSound" src="assets/wrong.mp3"></audio>
  <audio id="clapSound" src="assets/clapping.mp3"></audio>

  <script>
    // --- Grade 7 punctuation questions (UNCHANGED) ---
    const questions = [
      {q:"I can’t believe it ___", options:[".","!","?"], answer:"!"},
      {q:"Where is the library ___", options:[".","?","!"], answer:"?"},
      {q:"John’s book is on the table ___", options:[".","'","!"], answer:"."},
      {q:"\"Please sit down,\" said the teacher ___", options:[".","!","\""], answer:"\""},
      {q:"She bought apples ___ oranges ___ and bananas ___", options:[",",".",";"], answer:","},
      {q:"Remember: always check your work ___", options:[".","!",";"], answer:":"},
      {q:"Did you finish your homework ___", options:["?","!","."], answer:"?"},
      {q:"Wow ___ that was an amazing performance ___", options:["!","?","."], answer:"!"},
      {q:"I visited Paris last summer ___ it was wonderful ___", options:[".",";",","], answer:"."},
      {q:"Sarah said ___ \"I will be late today\" ___", options:[".","\"","'"], answer:"\""}
    ];

    let current=0;
    const container = document.getElementById("gameContainer");
    const sentenceEl = document.getElementById("sentence");
    const feedback = document.getElementById("feedback");
    const progressText = document.getElementById("progressText");
    const restartBtn = document.getElementById("restartBtn");
    const correctSound = document.getElementById("correctSound");
    const wrongSound = document.getElementById("wrongSound");
    const clapSound = document.getElementById("clapSound");

    function showQuestion(){
      feedback.textContent="";
      const q = questions[current];
      sentenceEl.textContent = q.q;
      progressText.textContent = `Question ${current+1} of ${questions.length}`;

      document.querySelectorAll(".balloon").forEach(b=>b.remove());

      const containerWidth = container.clientWidth;
      const balloonWidth = 64;
      const padding = 20;
      const available = containerWidth - padding*2 - balloonWidth;
      const step = available / q.options.length;

      q.options.sort(()=>Math.random()-0.5).forEach((opt,i)=>{
        const balloon = document.createElement("div");
        balloon.className = "balloon";
        balloon.textContent = opt;

        const leftPos = padding + step*i + (step/2) - (balloonWidth/2);

        balloon.style.left = leftPos + "px";
        balloon.style.bottom = "0px";
        container.appendChild(balloon);
        balloon.onclick = ()=>checkAnswer(opt,q.answer,balloon);
        floatBalloon(balloon);
      });
    }

    function floatBalloon(balloon){
      let pos = 0;
      const speed = 1.2;
      const interval = setInterval(()=>{
        pos += speed;
        balloon.style.bottom = pos + "px";
        if(pos > container.clientHeight) {
          clearInterval(interval);
          balloon.remove();
        }
      }, 30);
    }

    function checkAnswer(selected, correct, balloon){
      if(selected===correct){
        feedback.textContent="Good Job! ✔";
        feedback.style.color="var(--success)";
        correctSound.currentTime=0;
        correctSound.play();
        balloon.remove();
        createConfetti();
        setTimeout(nextQuestion,800);
      } else {
        feedback.textContent="Try Again! ❌";
        feedback.style.color="var(--error)";
        balloon.classList.add("wiggle");
        wrongSound.currentTime=0;
        wrongSound.play();
        setTimeout(()=>balloon.classList.remove("wiggle"),500);
      }
    }

    function nextQuestion(){
      current++;
      if(current>=questions.length){
        feedback.textContent="🎉 You completed all questions!";
        clapSound.currentTime=0;
        clapSound.play();
        restartBtn.style.display="block";
      } else showQuestion();
    }

    restartBtn.onclick = ()=>location.reload();

    function createConfetti(){
      for(let i=0;i<20;i++){
        const c = document.createElement("div");
        c.className="confetti-piece";
        c.style.left = Math.random()*container.clientWidth + "px";
        c.style.bottom = container.clientHeight + "px";
        c.style.background = `hsl(${Math.random()*360},100%,55%)`;
        container.appendChild(c);
        setTimeout(()=>c.remove(),1500);
      }
    }

    // --- Logo + Instructions (UNCHANGED timing & flow) ---
    setTimeout(()=>{
      document.getElementById("logoScreen").style.display="none";
      document.getElementById("instructionScreen").style.display="block";
      setTimeout(()=>{
        document.getElementById("instructionScreen").style.display="none";
        container.style.display="block";
        showQuestion();
      },5000);
    },5000);
  </script>
</body>
</html>
