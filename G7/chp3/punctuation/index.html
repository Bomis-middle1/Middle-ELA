<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punctuation Balloon Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial;
    overflow: hidden;
    background: linear-gradient(135deg, #6dd5fa, #ff758c);
}

/* ---------- SCREENS ---------- */
.screen {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

/* ---------- SPLASH ---------- */
#splash img {
    width: 180px;
}

/* ---------- TITLE ---------- */
#title {
    display: none;
    color: white;
    font-size: 2rem;
    font-weight: bold;
}

/* ---------- GAME WRAPPER (IMPORTANT FIX) ---------- */
#game {
    display: none;
    position: absolute;
    width: 100%;
    height: 100%;
}

/* ---------- TOP UI LAYER (QUESTION ALWAYS SAFE) ---------- */
#uiLayer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 1000;
    padding: 10px;
    box-sizing: border-box;
}

/* QUESTION BOX FIXED */
#questionBox {
    background: rgba(0,0,0,0.5);
    color: white;
    font-size: 20px;
    font-weight: bold;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
}

/* ---------- PLAY AREA (BALLOONS ONLY HERE) ---------- */
#playArea {
    position: absolute;
    top: 80px;
    bottom: 0;
    left: 0;
    right: 0;
    overflow: hidden;
}

/* ---------- BALLOONS ---------- */
.balloon {
    position: absolute;
    width: 110px;
    height: 130px;
    background: radial-gradient(circle at 30% 30%, #fff, #ff4d6d);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-weight: bold;
    cursor: pointer;
    animation: float 6s linear forwards;
    z-index: 2;
}

.balloon::after {
    content: "";
    position: absolute;
    bottom: -20px;
    width: 2px;
    height: 25px;
    background: #333;
}

@keyframes float {
    0% { transform: translateY(100%); }
    100% { transform: translateY(-120%); }
}

/* ---------- CONFETTI ---------- */
.confetti {
    position: absolute;
    width: 8px;
    height: 8px;
    background: yellow;
    animation: fall 2s linear forwards;
    z-index: 9999;
}

@keyframes fall {
    to { transform: translateY(100vh); opacity: 0; }
}

/* ---------- BUTTON ---------- */
button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #ffdd57;
}

/* ---------- END SCREEN ---------- */
#endScreen {
    display: none;
    color: white;
    font-size: 24px;
}

/* ---------- VOLUME ---------- */
#controls {
    position: absolute;
    bottom: 10px;
    left: 10px;
    color: white;
    z-index: 2000;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash" class="screen">
    <img src="assets/logo.png">
</div>

<!-- TITLE -->
<div id="title" class="screen">
    <div>🎯 Punctuation Power Challenge</div>
    <button onclick="startGame()">Start</button>
</div>

<!-- GAME -->
<div id="game">
    <div id="uiLayer">
        <div id="questionBox"></div>
    </div>
    <div id="playArea"></div>
</div>

<!-- END -->
<div id="endScreen" class="screen">
    <div id="scoreText"></div>
    <button onclick="restart()">Restart</button>
</div>

<!-- SOUND -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<!-- VOLUME -->
<div id="controls">
Volume <input type="range" min="0" max="1" step="0.1" value="0.7" oninput="setVolume(this.value)">
</div>

<script>

/* ---------- INTRO ---------- */
setTimeout(()=>{
    document.getElementById("splash").style.display="none";
    document.getElementById("title").style.display="flex";
},5000);

/* ---------- QUESTIONS ---------- */
const questions = [
{q:"I can’t believe we finally finished the project ___", a:[".", "!", "?", ","], c:"!"},
{q:"Where are you going ___", a:[".", "!", "?", ","], c:"?"},
{q:"She whispered, “Don’t tell anyone.”", a:["Correct","Wrong","None","Error"], c:"Correct"},
{q:"The teacher said, “Submit your work.”", a:["A","B","C","D"], c:"A"},
{q:"You need ___ notebook pen ruler and eraser", a:[".",":","!","?"], c:":"},
{q:"Let’s go to the park tomorrow ___", a:[".",",","!", "?"], c:"."},
{q:"Wow this place is incredible ___", a:["!",".","?",","], c:"!"},
{q:"Are you coming with us ___", a:["!",".","?",","], c:"?"},
{q:"I visited Delhi last year", a:["A","B","C","D"], c:"B"},
{q:"She asked, “Where are you going?”", a:["A","B","C","D"], c:"B"}
];

let shuffled=[], current=0, score=0, volume=0.7;

/* ---------- START ---------- */
function startGame(){
    document.getElementById("title").style.display="none";
    document.getElementById("game").style.display="block";

    shuffled = questions.sort(()=>Math.random()-0.5);
    current=0; score=0;

    loadQ();
}

/* ---------- LOAD QUESTION ---------- */
function loadQ(){
    clearBalls();

    if(current >= shuffled.length){
        end();
        return;
    }

    let q = shuffled[current];
    document.getElementById("questionBox").innerText = q.q;

    q.a.forEach(opt=>{
        createBall(opt, q.c);
    });
}

/* ---------- BALLOON ---------- */
function createBall(text, correct){
    let b = document.createElement("div");
    b.className="balloon";
    b.innerText=text;

    b.style.left=Math.random()*80+"vw";
    b.style.top="100%";

    b.onclick=()=>{
        if(text===correct){
            score++;
            playCorrect();
            confetti();
        } else {
            playWrong();
        }
        current++;
        setTimeout(loadQ,800);
    };

    document.getElementById("playArea").appendChild(b);
}

/* ---------- CLEAN ---------- */
function clearBalls(){
    document.getElementById("playArea").innerHTML="";
}

/* ---------- SOUND ---------- */
function playCorrect(){
    let s=document.getElementById("correctSound");
    s.volume=volume;
    s.play();
}

function playWrong(){
    let s=document.getElementById("wrongSound");
    s.volume=volume;
    s.play();
}

function setVolume(v){ volume=v; }

/* ---------- CONFETTI ---------- */
function confetti(){
    for(let i=0;i<25;i++){
        let c=document.createElement("div");
        c.className="confetti";
        c.style.left=Math.random()*100+"vw";
        c.style.background=["#ff0","#0ff","#f0f","#0f0"][Math.floor(Math.random()*4)];
        document.body.appendChild(c);
        setTimeout(()=>c.remove(),2000);
    }
}

/* ---------- END ---------- */
function end(){
    document.getElementById("game").style.display="none";
    document.getElementById("endScreen").style.display="flex";
    document.getElementById("scoreText").innerText=
        `🎉 Score: ${score}/${shuffled.length}`;
}

/* ---------- RESTART ---------- */
function restart(){ location.reload(); }

</script>

</body>
</html>
