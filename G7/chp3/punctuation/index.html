<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Innovine Punctuation Balloon Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:linear-gradient(#b3e5ff,#e6f7ff);
}

/* ================= LOGO ================= */
#logoScreen{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#logoScreen img{
width:220px;
animation:pulse 1.5s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

/* ================= TITLE ================= */
#titleScreen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(#4fc3f7,#e1f5fe);
z-index:9998;
text-align:center;
}

#titleScreen h1{
font-size:48px;
color:#0d47a1;
animation:bounce 1.2s infinite;
}

@keyframes bounce{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

/* ================= START ================= */
#startScreen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:#e3f2fd;
z-index:9997;
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:10px;
background:#ffca28;
font-weight:bold;
cursor:pointer;
}

/* ================= GAME ================= */
#game{
display:none;
width:100%;
height:100vh;
position:relative;
overflow:hidden;
}

#question{
position:absolute;
top:80px;
width:100%;
text-align:center;
font-size:28px;
font-weight:bold;
color:#0d47a1;
padding:10px;
}

#score{
position:absolute;
top:10px;
left:10px;
font-size:20px;
font-weight:bold;
color:#0d47a1;
}

/* ================= BALLOONS ================= */
.balloon{
position:absolute;
width:55px;
height:70px;
border-radius:50% 50% 45% 45%;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
font-weight:bold;
color:white;
cursor:pointer;
animation:floatUp 8s linear forwards;
box-shadow:inset -3px -5px rgba(0,0,0,0.2);
}

.balloon::after{
content:"";
position:absolute;
bottom:-12px;
width:2px;
height:14px;
background:#444;
}

@keyframes floatUp{
0%{transform:translateY(100vh);}
50%{transform:translateY(40vh) translateX(20px);}
100%{transform:translateY(-120vh);}
}

.red{background:#ff5252;}
.blue{background:#42a5f5;}
.green{background:#66bb6a;}
.yellow{background:#ffca28;}
.purple{background:#ab47bc;}
</style>
</head>

<body>

<!-- ================= LOGO ================= -->
<div id="logoScreen">
<img src="G7/chp3/punctuation/assets/innovine-logo.png">
</div>

<!-- ================= TITLE ================= -->
<div id="titleScreen">
<h1>Punctuation Balloon Game 🎈</h1>
<p>Tap the correct punctuation balloon!</p>
</div>

<!-- ================= START ================= -->
<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<!-- ================= GAME ================= -->
<div id="game">
<div id="score">Score: 0</div>
<div id="question">Loading...</div>
</div>

<script>

/* ================= FLOW ================= */
setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("titleScreen").style.display="flex";
},5000);

setTimeout(()=>{
document.getElementById("titleScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";
},8000);

/* ================= QUESTIONS (CLEAN CLASSROOM SET) ================= */
const questions=[
{q:"I can’t believe it ___", a:[".","!","?"], c:"!"},
{q:"Where are you going ___", a:[".","!","?"], c:"?"},
{q:"Wow that is amazing ___", a:[".","!","?"], c:"!"},
{q:"John is coming ___", a:[".","!","?"], c:"."},
{q:"Are you ready ___", a:[".","!","?"], c:"?"},
{q:"Please sit down ___", a:[".",":","!"], c:":"},
{q:"I love ice cream ___", a:[".","!","?"], c:"!"},
{q:"Stop right there ___", a:[".","!","?"], c:"!"},
{q:"The sun is bright ___", a:[".","!","?"], c:"."},
{q:"Let’s go to the park ___", a:[".",",","!"], c:"."}
];

let i=0;
let score=0;
let currentAnswer="";

/* ================= START ================= */
function startGame(){
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
loadQ();
spawnLoop();
}

/* ================= LOAD QUESTION ================= */
function loadQ(){

if(i>=questions.length){
document.getElementById("question").innerText="🎉 Game Over! Score: "+score;
return;
}

currentAnswer=questions[i].c;
document.getElementById("question").innerText=questions[i].q;
document.getElementById("score").innerText="Score: "+score;
}

/* ================= BALLOONS ================= */
const symbols=["!","?","."];
const colors=["red","blue","green","yellow","purple"];

function spawnBalloon(){

let b=document.createElement("div");
let symbol=symbols[Math.floor(Math.random()*symbols.length)];

b.className="balloon "+colors[Math.floor(Math.random()*colors.length)];
b.innerText=symbol;
b.style.left=Math.random()*90+"vw";

b.onclick=()=>{

if(symbol===currentAnswer){
score+=10;
i++;
loadQ();
}

b.remove();
};

document.body.appendChild(b);

setTimeout(()=>b.remove(),8000);
}

/* ================= LOOP ================= */
function spawnLoop(){
setInterval(spawnBalloon,1700);
}

</script>

</body>
</html>
