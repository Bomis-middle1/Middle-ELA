<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punctuation Balloon Pop</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
overflow:hidden;
background:linear-gradient(#b3e5ff,#e6f7ff);
}

/* ================= LOGO SCREEN ================= */
#logoScreen{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#logoScreen img{
width:220px;
animation:pulse 1.5s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

/* ================= TITLE SCREEN ================= */
#titleScreen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#4fc3f7,#e1f5fe);
z-index:9998;
text-align:center;
}

#titleScreen h1{
font-size:50px;
color:#0d47a1;
animation:bounce 1.2s infinite;
}

#titleScreen p{
font-size:22px;
margin-top:10px;
color:#1565c0;
}

@keyframes bounce{
0%{transform:translateY(0);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0);}
}

/* ================= START SCREEN ================= */
#startScreen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:#e3f2fd;
z-index:9997;
}

#startBtn{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:12px;
background:#ffca28;
font-weight:bold;
cursor:pointer;
}

/* ================= GAME ================= */
#game{
display:none;
width:100%;
height:100vh;
position:relative;
overflow:hidden;
background:linear-gradient(to top,#9be2ff,#ffffff);
}

#score{
position:absolute;
top:15px;
left:15px;
font-size:22px;
font-weight:bold;
color:#0d47a1;
}

/* ================= BALLOONS ================= */
.balloon{
position:absolute;
width:45px;
height:60px;
border-radius:50% 50% 45% 45%;
display:flex;
justify-content:center;
align-items:center;
font-size:22px;
font-weight:bold;
color:white;
cursor:pointer;
animation:floatUp 9s linear forwards;
box-shadow:inset -5px -8px rgba(0,0,0,0.1);
}

.balloon::after{
content:"";
position:absolute;
bottom:-12px;
width:2px;
height:14px;
background:#555;
}

@keyframes floatUp{
0%{transform:translateY(100vh);}
50%{transform:translateY(40vh) translateX(25px);}
100%{transform:translateY(-120vh) translateX(-15px);}
}

.red{background:#ff5252;}
.blue{background:#42a5f5;}
.green{background:#66bb6a;}
.yellow{background:#ffca28;}
.purple{background:#ab47bc;}

</style>
</head>

<body>

<!-- ================= LOGO ================= -->
<div id="logoScreen">
<img src="assets/innovine-logo.png">
</div>

<!-- ================= TITLE ================= -->
<div id="titleScreen">
<h1>Punctuation Pop 🎈</h1>
<p>Tap the correct punctuation balloon!</p>
</div>

<!-- ================= START ================= -->
<div id="startScreen">
<button id="startBtn">Start Game</button>
</div>

<!-- ================= GAME ================= -->
<div id="game">
<div id="score">Score: 0</div>
</div>

<script>

/* ================= FLOW CONTROL ================= */

setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("titleScreen").style.display="flex";
},5000);

setTimeout(()=>{
document.getElementById("titleScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";
},8000);

/* ================= GAME VARIABLES ================= */

let score = 0;
let gameStarted = false;

/* ================= START GAME ================= */

document.getElementById("startBtn").onclick = () => {
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
gameStarted = true;
startSpawning();
};

/* ================= BALLOON DATA ================= */

const symbols = [
{symbol:"!", type:"correct"},
{symbol:"?", type:"wrong"},
{symbol:".", type:"wrong"}
];

const colors = ["red","blue","green","yellow","purple"];

/* ================= SPAWN BALLOONS ================= */

function spawnBalloon(){

if(!gameStarted) return;

const data = symbols[Math.floor(Math.random()*symbols.length)];

const b = document.createElement("div");
b.className = "balloon " + colors[Math.floor(Math.random()*colors.length)];
b.textContent = data.symbol;
b.style.left = Math.random()*90 + "vw";

b.onclick = () => {

if(data.type === "correct"){
score += 10;
document.getElementById("score").innerText = "Score: " + score;
b.remove();
}else{
b.style.transform = "scale(0.8)";
setTimeout(()=>b.remove(),200);
}

};

document.getElementById("game").appendChild(b);

setTimeout(()=>b.remove(),9000);
}

/* ================= SPAWN LOOP ================= */

function startSpawning(){
setInterval(spawnBalloon, 2000);
}

</script>

</body>
</html>
