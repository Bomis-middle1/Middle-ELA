<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punctuation Pop - Audio Fixed</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
overflow:hidden;
background:linear-gradient(#b3e5ff,#e6f7ff);
}

/* LOGO */
#logoScreen{
position:fixed;inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
#logoScreen img{width:220px;}

/* TITLE */
#titleScreen{
position:fixed;inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(#4fc3f7,#e1f5fe);
z-index:9998;
text-align:center;
}

/* START */
#startScreen{
position:fixed;inset:0;
display:none;
justify-content:center;
align-items:center;
background:#e3f2fd;
z-index:9997;
}

#startBtn{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:12px;
background:#ffca28;
font-weight:bold;
cursor:pointer;
}

/* GAME */
#game{
display:none;
width:100%;
height:100vh;
position:relative;
overflow:hidden;
background:linear-gradient(to top,#9be2ff,#ffffff);
}

#score{
position:absolute;
top:15px;
left:15px;
font-size:22px;
font-weight:bold;
color:#0d47a1;
}

#question{
position:absolute;
top:90px;
width:100%;
text-align:center;
font-size:30px;
font-weight:bold;
color:#0d47a1;
}

/* BALLOON */
.balloon{
position:absolute;
width:50px;
height:65px;
border-radius:50% 50% 45% 45%;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
font-weight:bold;
color:white;
cursor:pointer;
animation:floatUp 9s linear forwards;
}

@keyframes floatUp{
0%{transform:translateY(100vh);}
50%{transform:translateY(40vh) translateX(20px);}
100%{transform:translateY(-120vh) translateX(-10px);}
}

.red{background:#ff5252;}
.blue{background:#42a5f5;}
.green{background:#66bb6a;}
.yellow{background:#ffca28;}
.purple{background:#ab47bc;}

</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
<img src="G7/chp3/punctuation/assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen">
<h1>Punctuation Pop 🎈</h1>
<p>Tap the correct punctuation balloon!</p>
</div>

<!-- START -->
<div id="startScreen">
<button id="startBtn">Start Game</button>
</div>

<!-- GAME -->
<div id="game">
<div id="score">Score: 0</div>
<div id="question">Loading...</div>
</div>

<!-- 🎵 AUDIO FIXED -->
<audio id="correctSound" src="G7/chp3/punctuation/assets/correct.mp3"></audio>
<audio id="wrongSound" src="G7/chp3/punctuation/assets/wrong.mp3"></audio>
<audio id="clapSound" src="G7/chp3/punctuation/assets/clapping.mp3"></audio>

<script>

/* FLOW */
setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("titleScreen").style.display="flex";
},5000);

setTimeout(()=>{
document.getElementById("titleScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";
},8000);

/* GAME STATE */
let index=0;
let score=0;
let currentAnswer="";
let gameStarted=false;

/* QUESTIONS */
const questions=[
{q:"I can’t believe it ___",answer:"!"},
{q:"Where are you going ___",answer:"?"},
{q:"Wow that is amazing ___",answer:"!"},
{q:"John is coming ___",answer:"."},
{q:"Are you ready ___",answer:"?"},
{q:"Please sit down ___ said teacher",answer:":"},
{q:"I love ice cream ___",answer:"!"},
{q:"She asked where is the book ___",answer:"?"},
{q:"Stop right there ___",answer:"!"},
{q:"The sun is bright ___",answer:"."}
];

/* START */
document.getElementById("startBtn").onclick=()=>{
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";

gameStarted=true;
index=0;
score=0;

loadQuestion();
spawnLoop();
};

/* LOAD QUESTION */
function loadQuestion(){

if(index>=questions.length){
document.getElementById("question").innerText="🎉 Game Over! Score: "+score;
document.getElementById("clapSound").play();
return;
}

currentAnswer=questions[index].answer;
document.getElementById("question").innerText=questions[index].q;
}

/* BALLOONS */
const symbols=["!","?","."];
const colors=["red","blue","green","yellow","purple"];

function spawnBalloon(){

if(!gameStarted) return;

let symbol=symbols[Math.floor(Math.random()*symbols.length)];

let b=document.createElement("div");
b.className="balloon "+colors[Math.floor(Math.random()*colors.length)];
b.innerText=symbol;
b.style.left=Math.random()*90+"vw";

b.onclick=()=>{

if(symbol===currentAnswer){
score+=10;
index++;
loadQuestion();
document.getElementById("correctSound").play();
}else{
document.getElementById("wrongSound").play();
}

b.remove();
};

document.body.appendChild(b);

setTimeout(()=>b.remove(),9000);
}

/* LOOP */
function spawnLoop(){
setInterval(spawnBalloon,1800);
}

</script>

</body>
</html>
