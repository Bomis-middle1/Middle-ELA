<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punctuation Pop</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{
overflow:hidden;
background:#eaf6ff;
}

/* ================= LOGO SCREEN ================= */
#logoScreen{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#logoScreen img{
width:220px;
animation:zoom 1.5s ease-in-out infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

/* ================= TITLE SCREEN ================= */
#titleScreen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(135deg,#4fc3f7,#e1f5fe);
z-index:9998;
text-align:center;
}

#titleScreen h1{
font-size:48px;
color:#0d47a1;
animation:bounce 1.2s infinite;
}

#titleScreen p{
font-size:20px;
color:#1565c0;
margin-top:10px;
}

@keyframes bounce{
0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}
}

/* ================= START SCREEN ================= */
#startScreen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:#dff6ff;
z-index:9997;
}

#startBtn{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:12px;
background:#ffca28;
cursor:pointer;
font-weight:bold;
}

/* ================= GAME ================= */
#game{
display:none;
width:100%;
height:100vh;
position:relative;
overflow:hidden;
background:linear-gradient(to top,#a8e6ff,#ffffff);
}

#question{
position:absolute;
top:90px;
width:100%;
text-align:center;
font-size:30px;
font-weight:bold;
color:#0d47a1;
}

#options{
position:absolute;
bottom:60px;
width:100%;
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
}

.option{
padding:12px 20px;
width:80%;
background:#e3f2fd;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

/* ================= BALLOONS FIXED ================= */
.balloon{
position:absolute;
width:40px;
height:55px;
border-radius:50% 50% 45% 45%;
background:red;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-weight:bold;
animation:float 8s linear forwards;
box-shadow:inset -6px -10px rgba(0,0,0,0.1);
}

.balloon::after{
content:"";
position:absolute;
bottom:-10px;
width:2px;
height:12px;
background:#555;
}

@keyframes float{
0%{transform:translateY(100vh) translateX(0);}
50%{transform:translateY(50vh) translateX(30px);}
100%{transform:translateY(-120vh) translateX(-20px);}
}

.red{background:#ff5252;}
.blue{background:#42a5f5;}
.green{background:#66bb6a;}
.yellow{background:#ffca28;}
.purple{background:#ab47bc;}

</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
<img src="assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen">
<h1>Punctuation Pop 🎈</h1>
<p>Let’s Learn Grammar the Fun Way!</p>
</div>

<!-- START -->
<div id="startScreen">
<button id="startBtn">Start Game</button>
</div>

<!-- GAME -->
<div id="game">
<div id="question">Loading...</div>
<div id="options"></div>
</div>

<script>

/* ================= FLOW CONTROL ================= */

setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("titleScreen").style.display="flex";
},5000);

setTimeout(()=>{
document.getElementById("titleScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";
},8000);

/* ================= START GAME ================= */

document.getElementById("startBtn").onclick=function(){
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
startGame();
};

/* ================= QUESTIONS ================= */

const questions=[
{q:"I can’t believe it ___",options:[".","!","?"],a:"!"},
{q:"Where is the library ___",options:[".","?","!"],a:"?"},
{q:"John is coming ___",options:[".","?","!"],a:"."},
{q:"Wow that was amazing ___",options:[".","!","?"],a:"!"}
];

let i=0;
let score=0;

function startGame(){
loadQ();
spawnBalloon();
setInterval(spawnBalloon,1800);
}

function loadQ(){
if(i>=questions.length){
document.getElementById("question").innerText="Game Over!";
document.getElementById("options").innerHTML="";
return;
}

let q=questions[i];
document.getElementById("question").innerText=q.q;

let opt=document.getElementById("options");
opt.innerHTML="";

q.options.forEach(o=>{
let btn=document.createElement("button");
btn.className="option";
btn.innerText=o;
btn.onclick=()=>{
if(o===q.a) score++;
i++;
loadQ();
};
opt.appendChild(btn);
});
}

/* ================= BALLOONS ================= */

function spawnBalloon(){
let b=document.createElement("div");
let colors=["red","blue","green","yellow","purple"];

b.className="balloon "+colors[Math.floor(Math.random()*colors.length)];
b.innerText=["!","?","·"][Math.floor(Math.random()*3)];

b.style.left=Math.random()*90+"vw";

document.body.appendChild(b);

setTimeout(()=>b.remove(),8000);
}

</script>

</body>
</html>
