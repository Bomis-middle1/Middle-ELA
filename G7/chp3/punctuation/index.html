<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punctuation Pop FIXED</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}

body{overflow:hidden;background:#dff6ff;}

/* LOGO */
#logoScreen{
position:fixed;inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}
#logoScreen img{width:220px;}

/* TITLE */
#titleScreen{
position:fixed;inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:linear-gradient(#4fc3f7,#e1f5fe);
z-index:9998;
text-align:center;
}

/* START */
#startScreen{
position:fixed;inset:0;
display:none;
justify-content:center;
align-items:center;
background:#e3f2fd;
z-index:9997;
}

#startBtn{
padding:15px 30px;
font-size:20px;
border:none;
border-radius:12px;
background:#ffca28;
font-weight:bold;
cursor:pointer;
}

/* GAME */
#game{
display:none;
width:100%;
height:100vh;
position:relative;
overflow:hidden;
}

#score{
position:absolute;
top:15px;
left:15px;
font-size:22px;
font-weight:bold;
color:#0d47a1;
z-index:10;
}

/* IMPORTANT FIX */
#question{
position:absolute;
top:90px;
width:100%;
text-align:center;
font-size:32px;
font-weight:bold;
color:#0d47a1;
z-index:10;
}

/* BALLOON */
.balloon{
position:absolute;
width:50px;
height:65px;
border-radius:50% 50% 45% 45%;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
font-weight:bold;
color:white;
cursor:pointer;
animation:floatUp 9s linear forwards;
z-index:5;
}

@keyframes floatUp{
0%{transform:translateY(100vh);}
50%{transform:translateY(40vh);}
100%{transform:translateY(-120vh);}
}

.red{background:#ff5252;}
.blue{background:#42a5f5;}
.green{background:#66bb6a;}
.yellow{background:#ffca28;}
.purple{background:#ab47bc;}

</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
<img src="G7/chp3/punctuation/assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen">
<h1>Punctuation Pop 🎈</h1>
<p>Tap the correct punctuation balloon!</p>
</div>

<!-- START -->
<div id="startScreen">
<button id="startBtn">Start Game</button>
</div>

<!-- GAME -->
<div id="game">
<div id="score">Score: 0</div>
<div id="question">Loading...</div>
</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

/* FLOW */
setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("titleScreen").style.display="flex";
},5000);

setTimeout(()=>{
document.getElementById("titleScreen").style.display="none";
document.getElementById("startScreen").style.display="flex";
},8000);

/* SAFE ELEMENT REFERENCES */
const game = document.getElementById("game");
const questionBox = document.getElementById("question");
const scoreBox = document.getElementById("score");

/* GAME STATE */
let index = 0;
let score = 0;
let currentAnswer = "";
let gameStarted = false;

/* QUESTIONS (10 FIXED) */
const questions = [
{q:"I can’t believe it ___", answer:"!"},
{q:"Where are you going ___", answer:"?"},
{q:"Wow that is amazing ___", answer:"!"},
{q:"John is coming ___", answer:"."},
{q:"Are you ready ___", answer:"?"},
{q:"Please sit down ___", answer:":"},
{q:"I love ice cream ___", answer:"!"},
{q:"She asked where is the book ___", answer:"?"},
{q:"Stop right there ___", answer:"!"},
{q:"The sun is bright ___", answer:"."}
];

/* START */
document.getElementById("startBtn").onclick = () => {
document.getElementById("startScreen").style.display="none";
game.style.display="block";

gameStarted = true;
index = 0;
score = 0;

loadQuestion();
setInterval(spawnBalloon, 1800);
};

/* LOAD QUESTION (SAFE) */
function loadQuestion(){

if(!questionBox) return;

if(index >= questions.length){
questionBox.innerText = "🎉 Game Over! Score: " + score;
return;
}

currentAnswer = questions[index].answer;
questionBox.innerText = questions[index].q;
scoreBox.innerText = "Score: " + score;
}

/* BALLOON SYSTEM */
const symbols = ["!","?","."];
const colors = ["red","blue","green","yellow","purple"];

function spawnBalloon(){

if(!gameStarted) return;

let symbol = symbols[Math.floor(Math.random()*symbols.length)];

let b = document.createElement("div");
b.className = "balloon " + colors[Math.floor(Math.random()*colors.length)];
b.innerText = symbol;
b.style.left = Math.random()*90 + "vw";

b.onclick = () => {

if(symbol === currentAnswer){
score += 10;
index++;
loadQuestion();
}

b.remove();
};

document.body.appendChild(b);

setTimeout(()=>b.remove(),9000);
}

}); // DOM READY END

</script>

</body>
</html>
