<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Factory</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298,#ffb347);
overflow:hidden;
color:white;
}

/* SCREEN SYSTEM */
.screen{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}
.active{display:flex;}

/* LOGO */
#logoScreen{background:#fff;}
#logoScreen img{width:220px;}

/* TITLE */
#titleScreen h1{font-size:30px;}

/* HUD */
#hud{
position:fixed;
top:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
padding:10px;
background:rgba(0,0,0,0.6);
z-index:10;
font-size:13px;
}

/* GAME BOX */
#gameBox{
width:90%;
max-width:650px;
background:#fff;
color:#000;
border-radius:16px;
padding:18px;
margin-top:90px;
}

#sentence{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
}

.options{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

.option{
flex:1 1 45%;
padding:10px;
background:#f2f2f2;
border-radius:10px;
cursor:pointer;
font-weight:bold;
user-select:none;
}

.option:active{transform:scale(0.97);}

.correct{background:#2ecc71;color:#fff;}
.wrong{background:#e74c3c;color:#fff;}

/* POPUP */
#popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#000;
color:#fff;
padding:14px;
border-radius:10px;
display:none;
z-index:999;
}

/* CONVEYOR */
.conveyor{
position:fixed;
bottom:0;
left:0;
right:0;
height:60px;
background:repeating-linear-gradient(90deg,#444,#444 20px,#666 20px,#666 40px);
opacity:0.6;
}

/* BUTTON */
button{
padding:10px 16px;
border:none;
border-radius:10px;
background:orange;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen" class="screen">
<div>
<h1>🏭 Grammar Factory</h1>
<p>Conveyor Belt Challenge</p>
<button onclick="startGame()">Start Factory</button>
</div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div id="hud">
<div>📦 <span id="prog">0</span>/10</div>
<div>⭐ <span id="score">0</span></div>
<div>🪙 <span id="coins">0</span></div>
<div>❤️ <span id="att">2</span></div>
</div>

<div id="gameBox">
<div id="sentence"></div>
<div class="options" id="options"></div>
</div>

<div class="conveyor"></div>

</div>

<!-- END -->
<div id="endScreen" class="screen">
<h2>🏆 MASTER FACTORY ENGINEER</h2>
<div id="result"></div>
<button onclick="location.reload()">Play Again</button>
</div>

<div id="popup"></div>

<script>

/* ================= AUDIO SYSTEM ================= */
const audio = {
correct: new Audio("assets/correct.mp3"),
wrong: new Audio("assets/wrong.mp3"),
clap: new Audio("assets/clapping.mp3")
};

function playSound(type){
let a = audio[type];
if(!a) return;
a.pause();
a.currentTime = 0;
a.play().catch(()=>{});
}

/* ================= LOGIC ================= */
const QUESTIONS = [
{
q:"She goes to school by bus every day.",
a:"Present Simple",
opts:["Present Simple","Present Continuous","Present Perfect","Present Perfect Continuous"],
hint:"Daily routine"
},
{
q:"They are decorating the classroom for the annual day celebration.",
a:"Present Continuous",
opts:["Present Perfect","Present Continuous","Present Simple","Present Perfect Continuous"],
hint:"happening now"
},
{
q:"We have finished our science project.",
a:"Present Perfect",
opts:["Present Continuous","Present Perfect","Present Simple","Present Perfect Continuous"],
hint:"completed"
},
{
q:"My brother has been practising the guitar for two hours.",
a:"Present Perfect Continuous",
opts:["Present Simple","Present Continuous","Present Perfect","Present Perfect Continuous"],
hint:"ongoing action"
},
{
q:"The Earth revolves around the Sun.",
a:"Present Simple",
opts:["Present Continuous","Present Perfect","Present Simple","Present Perfect Continuous"],
hint:"fact"
},
{
q:"Look! The children are flying kites.",
a:"Present Continuous",
opts:["Present Continuous","Present Perfect","Present Simple","Present Perfect Continuous"],
hint:"now"
},
{
q:"Our teacher has checked all notebooks.",
a:"Present Perfect",
opts:["Present Perfect","Present Continuous","Present Perfect Continuous","Present Simple"],
hint:"done"
},
{
q:"Riya has been reading since Monday.",
a:"Present Perfect Continuous",
opts:["Present Continuous","Present Perfect","Present Perfect Continuous","Present Simple"],
hint:"since clue"
},
{
q:"The bus arrives at 7:30 every day.",
a:"Present Simple",
opts:["Present Continuous","Present Perfect","Present Simple","Present Perfect Continuous"],
hint:"schedule"
},
{
q:"I am helping my mother right now.",
a:"Present Continuous",
opts:["Present Perfect","Present Continuous","Present Simple","Present Perfect Continuous"],
hint:"now"
}
];

/* ================= STATE ================= */
let order=[],i=0,score=0,coins=0,att=2,lock=false;

/* shuffle */
function shuffle(a){return [...a].sort(()=>Math.random()-0.5);}

/* ================= START ================= */
setTimeout(()=>{
document.getElementById("logoScreen").classList.remove("active");
document.getElementById("titleScreen").classList.add("active");
},5000);

function startGame(){
order = shuffle(QUESTIONS);
i=0;score=0;coins=0;att=2;

document.getElementById("titleScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");

loadQ();
}

/* ================= LOAD ================= */
function loadQ(){

if(i>=order.length){
endGame();
return;
}

lock=false;
att=2;
updateHUD();

let q = order[i];

document.getElementById("sentence").innerText = q.q;

let opts = shuffle(q.opts);

let box = document.getElementById("options");
box.innerHTML="";

opts.forEach(o=>{
let d=document.createElement("div");
d.className="option";
d.innerText=o;
d.onclick=()=>check(o,d);
box.appendChild(d);
});
}

/* ================= HUD ================= */
function updateHUD(){
document.getElementById("prog").innerText=i;
document.getElementById("score").innerText=score;
document.getElementById("coins").innerText=coins;
document.getElementById("att").innerText=att;
}

/* ================= CHECK ================= */
function check(ans,el){

if(lock) return;
lock=true;

let q = order[i];

if(ans===q.a){

score++;
coins+=10;

el.classList.add("correct");
playSound("correct");
playSound("clap");

setTimeout(()=>{
i++;
loadQ();
},900);

}else{

att--;
updateHUD();

el.classList.add("wrong");
playSound("wrong");

if(att>0){
lock=false;
}else{
setTimeout(()=>{
i++;
loadQ();
},1200);
}
}
}

/* ================= END ================= */
function endGame(){

document.getElementById("gameScreen").classList.remove("active");
document.getElementById("endScreen").classList.add("active");

let acc = Math.round((score/order.length)*100);

document.getElementById("result").innerHTML=`
⭐ Score: ${score}/${order.length}<br>
🪙 Coins: ${coins}<br>
🎯 Accuracy: ${acc}%
`;

playSound("clap");
}

</script>

<div class="conveyor"></div>

</body>
</html>
