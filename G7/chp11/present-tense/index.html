<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Grammar Factory – Conveyor Belt Challenge</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298,#ffb347);
overflow:hidden;
color:#fff;
}

/* SCREEN SYSTEM */
.screen{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.active{display:flex;}

/* LOGO */
#logoScreen{
background:white;
}
#logoScreen img{
width:220px;
animation:pop 1s ease;
}
@keyframes pop{
from{transform:scale(0.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* TITLE */
#titleScreen h1{
font-size:28px;
}

/* GAME LAYOUT */
#hud{
position:fixed;
top:10px;
left:10px;
right:10px;
display:flex;
justify-content:space-between;
font-size:14px;
z-index:5;
}

.bar{
position:fixed;
bottom:10px;
left:10px;
right:10px;
height:10px;
background:#222;
border-radius:20px;
overflow:hidden;
}
.bar-fill{
height:100%;
width:0%;
background:limegreen;
transition:0.4s;
}

/* CONVEYOR */
#factory{
position:relative;
width:100%;
height:100vh;
overflow:hidden;
}

.conveyor{
position:absolute;
bottom:120px;
width:200%;
height:60px;
background:repeating-linear-gradient(
90deg,
#444 0px,
#444 20px,
#666 20px,
#666 40px
);
animation:move 1s linear infinite;
}

@keyframes move{
from{transform:translateX(0);}
to{transform:translateX(-50%);}
}

.package{
position:absolute;
bottom:160px;
left:50%;
transform:translateX(-50%);
background:#fff;
color:#000;
padding:10px;
border-radius:10px;
width:80%;
max-width:500px;
font-weight:bold;
}

.machine{
position:absolute;
bottom:230px;
left:50%;
transform:translateX(-50%);
font-size:40px;
}

.options{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin-top:20px;
}

.option{
background:#fff;
color:#000;
padding:10px;
border-radius:10px;
min-width:40%;
cursor:pointer;
font-weight:bold;
}

.option:active{transform:scale(0.95);}

.correct{background:#2ecc71 !important;color:#fff;}
.wrong{background:#e74c3c !important;color:#fff;}

/* LIGHTS */
.redFlash{
animation:flash 0.3s 4;
}
@keyframes flash{
50%{background:red;}
}

/* SLIDER */
#volume{
position:fixed;
top:10px;
right:10px;
z-index:10;
}

/* BUTTON */
button{
padding:10px 16px;
border:none;
border-radius:10px;
background:orange;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png"/>
</div>

<!-- TITLE -->
<div id="titleScreen" class="screen">
<div>
<h1>🏭 Grammar Factory</h1>
<p>Conveyor Belt Challenge</p>
<button onclick="startGame()">Start Factory</button>
</div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
<div id="volume">
🔊 <input type="range" min="0" max="1" step="0.1" value="0.8" id="vol">
</div>

<div id="hud">
<div id="progress">📦 0/10</div>
<div id="score">⭐ 0</div>
<div id="coins">🪙 0</div>
<div id="attempts">❤️ 2</div>
</div>

<div id="factory">

<div class="conveyor"></div>

<div class="machine">🏭</div>

<div id="package" class="package"></div>

<div class="bar"><div class="bar-fill" id="bar"></div></div>

</div>
</div>

<!-- END SCREEN -->
<div id="endScreen" class="screen">
<h2>🏆 MASTER FACTORY ENGINEER</h2>
<div id="finalStats"></div>
<button onclick="location.reload()">Play Again</button>
</div>

<script>

/* ================= SOUND ================= */
function playSound(id){
let v=document.getElementById("vol").value;
let a=new Audio("assets/"+id+".mp3");
a.volume=v;
a.play();
}

/* ================= QUESTIONS (UNCHANGED) ================= */
const QUESTIONS=[
{
sentence:"She goes to school by bus every day.",
options:["Present Simple","Present Continuous","Present Perfect","Present Perfect Continuous"],
answer:"Present Simple",
hint:"This sentence describes a daily routine or habit.",
explanation:"Present Simple is used for habits and regular actions."
},
{
sentence:"They are decorating the classroom for the annual day celebration.",
options:["Present Perfect","Present Continuous","Present Simple","Present Perfect Continuous"],
answer:"Present Continuous",
hint:"The action is happening right now.",
explanation:"Present Continuous describes an action in progress."
},
{
sentence:"We have finished our science project.",
options:["Present Continuous","Present Perfect","Present Simple","Present Perfect Continuous"],
answer:"Present Perfect",
hint:"The work is already completed, and the result is important now.",
explanation:"Present Perfect connects a completed action with the present."
},
{
sentence:"My brother has been practising the guitar for two hours.",
options:["Present Simple","Present Continuous","Present Perfect","Present Perfect Continuous"],
answer:"Present Perfect Continuous",
hint:"The action started earlier and is still continuing.",
explanation:"Present Perfect Continuous shows ongoing action."
},
{
sentence:"The Earth revolves around the Sun.",
options:["Present Continuous","Present Perfect","Present Simple","Present Perfect Continuous"],
answer:"Present Simple",
hint:"This is a universal truth.",
explanation:"Used for scientific facts."
},
{
sentence:"Look! The children are flying colourful kites in the park.",
options:["Present Continuous","Present Perfect","Present Simple","Present Perfect Continuous"],
answer:"Present Continuous",
hint:"Look! is clue",
explanation:"Action happening now."
},
{
sentence:"Our teacher has checked all the notebooks.",
options:["Present Perfect","Present Continuous","Present Perfect Continuous","Present Simple"],
answer:"Present Perfect",
hint:"Completed action",
explanation:"Shows completion with present relevance."
},
{
sentence:"Riya has been reading the same novel since Monday.",
options:["Present Continuous","Present Perfect","Present Perfect Continuous","Present Simple"],
answer:"Present Perfect Continuous",
hint:"since is clue",
explanation:"Ongoing from past."
},
{
sentence:"The school bus arrives at 7:30 every morning.",
options:["Present Continuous","Present Perfect","Present Simple","Present Perfect Continuous"],
answer:"Present Simple",
hint:"routine",
explanation:"Schedule/routine."
},
{
sentence:"I am helping my mother prepare dinner right now.",
options:["Present Perfect","Present Continuous","Present Simple","Present Perfect Continuous"],
answer:"Present Continuous",
hint:"right now",
explanation:"happening now."
}
];

/* ================= STATE ================= */
let order=[],index=0,score=0,coins=0,attempts=2,locked=false;

/* shuffle */
function shuffle(a){return a.sort(()=>Math.random()-0.5);}

/* ================= START ================= */
setTimeout(()=>{
document.getElementById("logoScreen").classList.remove("active");
document.getElementById("titleScreen").classList.add("active");
},5000);

function startGame(){
document.getElementById("titleScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");

order=shuffle([...QUESTIONS]);
index=0;score=0;coins=0;
load();
}

/* ================= LOAD ================= */
function load(){
if(index>=order.length) return end();

locked=false;
attempts=2;

document.getElementById("progress").innerText=`📦 ${index}/10`;
document.getElementById("score").innerText=`⭐ ${score}`;
document.getElementById("coins").innerText=`🪙 ${coins}`;
document.getElementById("attempts").innerText=`❤️ ${attempts}`;

let q=order[index];
document.getElementById("package").innerHTML=
`📦 ${q.sentence}<br><br><b>Choose Tense</b>`;

let opts=[...q.options];
opts=shuffle(opts);

let box=document.createElement("div");
box.className="options";
box.innerHTML="";

opts.forEach(o=>{
let d=document.createElement("div");
d.className="option";
d.innerText=o;
d.onclick=()=>check(o,d);
box.appendChild(d);
});

let p=document.getElementById("package");
p.appendChild(box);

document.getElementById("bar").style.width=(index/10*100)+"%";
}

/* ================= CHECK ================= */
function check(ans,el){
if(locked) return;
locked=true;

let q=order[index];

if(ans===q.answer){

score++;coins+=10;
el.classList.add("correct");
playSound("correct");
playSound("clapping");

setTimeout(()=>{
index++;
load();
},800);

}else{

attempts--;
document.getElementById("attempts").innerText=`❤️ ${attempts}`;
el.classList.add("wrong");
playSound("wrong");

if(attempts===1){
alert("Hint: "+q.hint);
locked=false;
}else{
setTimeout(()=>{
index++;
load();
},1000);
}
}
}

/* ================= END ================= */
function end(){

document.getElementById("gameScreen").classList.remove("active");
document.getElementById("endScreen").classList.add("active");

let acc=Math.round((score/10)*100);

document.getElementById("finalStats").innerHTML=
`
⭐ Score: ${score}/10<br>
🪙 Coins: ${coins}<br>
🎯 Accuracy: ${acc}%<br>
🏭 Efficiency: 100%
`;

playSound("clapping");
}

</script>

</body>
</html>
