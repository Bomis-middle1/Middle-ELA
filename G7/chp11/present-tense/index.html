<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Factory - Learning Engine</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1d2671,#c33764,#3a7bd5);
color:white;
overflow:hidden;
}

/* SCREENS */
.screen{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}
.hidden{display:none;}

/* LOGO */
#logoScreen img{width:220px;}

/* TITLE */
#titleScreen h1{
font-size:40px;
animation:pulse 1.2s infinite;
}
@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* GAME */
#gameScreen{
flex-direction:column;
padding-top:70px;
}

#score{
position:fixed;
top:10px;
left:10px;
font-size:18px;
font-weight:bold;
}

#instruction{
margin:10px;
font-size:18px;
opacity:0.9;
}

#sentence{
font-size:22px;
font-weight:bold;
margin:10px;
}

.option{
background:white;
color:black;
padding:12px;
margin:8px;
border-radius:10px;
cursor:pointer;
width:250px;
font-weight:bold;
}

.correct{background:#2ecc71 !important;color:white;}
.wrong{background:#e74c3c !important;color:white;}

/* POPUP */
#popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
padding:20px;
border-radius:12px;
font-size:22px;
display:none;
z-index:9999;
}

/* CONFETTI */
.confetti{
position:fixed;
width:8px;
height:8px;
animation:fall 2s linear forwards;
}
@keyframes fall{
to{transform:translateY(100vh);opacity:0;}
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#ffca28;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen">
<img src="assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen" class="screen hidden">
<h1>🏭 Grammar Factory</h1>
<p>Present Tense Learning Engine</p>
<button onclick="startGame()">Start</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen hidden">

<div id="score">Score: 0</div>

<div id="instruction">
👉 Identify the tense used in the sentence
</div>

<div id="sentence"></div>

<div id="options"></div>

</div>

<!-- POPUP -->
<div id="popup"></div>

<script>

/* ================= QUESTIONS ================= */
const questions=[
{q:"She goes to school by bus every day.",a:"Present Simple",hint:"Habit / routine action",exp:"Used for regular habits"},
{q:"He has been studying for three hours.",a:"Present Perfect Continuous",hint:"Action continuing over time",exp:"Ongoing action with duration"},
{q:"They are playing football now.",a:"Present Continuous",hint:"Happening right now",exp:"Action in progress"},
{q:"We have visited Jaipur twice.",a:"Present Perfect",hint:"Past experience",exp:"Past action with present relevance"},
{q:"The Earth moves around the Sun.",a:"Present Simple",hint:"Universal truth",exp:"Scientific fact"}
];

let i=0;
let score=0;
let attempts=2;

/* ================= START ================= */
function startGame(){
document.getElementById("logoScreen").classList.add("hidden");
document.getElementById("titleScreen").classList.add("hidden");
document.getElementById("gameScreen").classList.remove("hidden");

loadQ();
}

/* ================= LOAD QUESTION ================= */
function loadQ(){

if(i>=questions.length){
endGame();
return;
}

attempts=2;

document.getElementById("sentence").innerText=questions[i].q;
document.getElementById("score").innerText="Score: "+score;

let box=document.getElementById("options");
box.innerHTML="";

let opts=[
"Present Simple",
"Present Continuous",
"Present Perfect",
"Present Perfect Continuous"
];

opts.forEach(o=>{
let div=document.createElement("div");
div.className="option";
div.innerText=o;

div.onclick=()=>check(o,div);

box.appendChild(div);
});
}

/* ================= CHECK LOGIC (2 ATTEMPTS SYSTEM) ================= */
function check(ans,el){

let correct=questions[i].a;

if(ans===correct){

score++;
showPopup("Correct 🎉","green");
el.classList.add("correct");

confetti();

setTimeout(()=>{i++;loadQ();},1200);

}else{

attempts--;

el.classList.add("wrong");

if(attempts===1){

// 🔹 FIRST WRONG → HINT
showPopup("Hint: "+questions[i].hint,"orange");

}else if(attempts<=0){

// 🔴 SECOND WRONG → SHOW ANSWER + EXPLANATION
showPopup("Correct: "+correct+" | "+questions[i].exp,"red");

setTimeout(()=>{
i++;
loadQ();
},1800);
}
}
}

/* ================= POPUP ================= */
function showPopup(text,color){

let p=document.getElementById("popup");
p.innerText=text;
p.style.background=color;
p.style.display="block";

setTimeout(()=>p.style.display="none",1200);
}

/* ================= CONFETTI ================= */
function confetti(){
for(let i=0;i<20;i++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=["#ff0","#0ff","#f0f","#0f0","#f60"][Math.floor(Math.random()*5)];
document.body.appendChild(c);
setTimeout(()=>c.remove(),2000);
}
}

/* ================= END SCREEN ================= */
function endGame(){

document.getElementById("gameScreen").innerHTML=`
<h2>🎉 Game Completed</h2>
<h3>Score: ${score}/${questions.length}</h3>
<button onclick="location.reload()">Restart</button>
`;

}

</script>

</body>
</html>
