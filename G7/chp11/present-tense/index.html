

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Present Tense Game</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#140f3d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:100vh;}
#logoScreen,#gameScreen,#endScreen{display:none;align-items:center;justify-content:center;flex-direction:column;width:100%;height:100vh;}
#logoScreen img{width:200px;margin-top:50px;}
h1{color:#ffd60a;text-align:center;margin:20px;}
#instruction{font-size:20px;margin:10px;text-align:center;}
#scoreText{margin:10px;}
.box{padding:15px 20px;background:#ffb703;color:#2d2340;border-radius:12px;margin:10px;cursor:pointer;font-weight:bold;width:70%;text-align:center;}
.box.correct{background:#b7efc5;}
.box.wrong{background:#ffccd5;}
button{padding:10px 16px;margin-top:20px;border-radius:12px;border:none;background:#ffb703;color:#2d2340;font-weight:bold;cursor:pointer;font-size:16px;}
#endScreen{display:none;text-align:center;margin-top:20px;}
</style>
</head>
<body>

<!-- Logo -->
<div id="logoScreen">
<img src="assets/innovine-logo.png" alt="Logo">
<h2>Loading Game...</h2>
</div>

<!-- Game Screen -->
<div id="gameScreen">
<h1>Present Tense Classification</h1>
<div id="instruction"></div>
<div id="scoreText">Score: 0</div>
<div id="boxesContainer"></div>
</div>

<!-- End Screen -->
<div id="endScreen">
<h1>Game Completed!</h1>
<p id="finalScore"></p>
<button onclick="restartGame()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<script>
// Sample sentences for the game
const rounds=[
  {instruction:"Click all Present Simple sentences.",sentences:[
    {text:"I eat breakfast every day.",type:"Simple"},
    {text:"I am eating breakfast now.",type:"Continuous"},
    {text:"I have eaten breakfast.",type:"Perfect"},
    {text:"She has been eating breakfast for 2 hours.",type:"PerfectContinuous"},
  ]},
  {instruction:"Click all Present Continuous sentences.",sentences:[
    {text:"She is reading a book now.",type:"Continuous"},
    {text:"They play football on Sundays.",type:"Simple"},
    {text:"They have played football.",type:"Perfect"},
    {text:"He has been playing football for 3 hours.",type:"PerfectContinuous"},
  ]},
  {instruction:"Click all Present Perfect sentences.",sentences:[
    {text:"They have visited Delhi.",type:"Perfect"},
    {text:"We are watching a movie.",type:"Continuous"},
    {text:"He drinks coffee every morning.",type:"Simple"},
    {text:"I have been working here for 2 hours.",type:"PerfectContinuous"},
  ]},
  {instruction:"Click all Present Perfect Continuous sentences.",sentences:[
    {text:"He has been working here for 2 hours.",type:"PerfectContinuous"},
    {text:"I am cooking dinner.",type:"Continuous"},
    {text:"She has finished her homework.",type:"Perfect"},
    {text:"We play football on Sundays.",type:"Simple"},
  ]}
];

let currentRound=0;
let score=0;

const logoScreen=document.getElementById('logoScreen');
const gameScreen=document.getElementById('gameScreen');
const instruction=document.getElementById('instruction');
const scoreText=document.getElementById('scoreText');
const boxesContainer=document.getElementById('boxesContainer');
const endScreen=document.getElementById('endScreen');
const finalScore=document.getElementById('finalScore');
const correctAudio=document.getElementById('correctSound');
const wrongAudio=document.getElementById('wrongSound');

// Show logo first
logoScreen.style.display='flex';
setTimeout(()=>{
  logoScreen.style.display='none';
  gameScreen.style.display='flex';
  startRound();
},3000);

function startRound(){
  instruction.innerText = rounds[currentRound].instruction;
  boxesContainer.innerHTML = '';
  // Shuffle sentences
  const shuffled = rounds[currentRound].sentences.sort(()=>Math.random()-0.5);
  shuffled.forEach(s=>{
    const div=document.createElement('div');
    div.className='box';
    div.innerText=s.text;
    div.dataset.type=s.type;
    div.onclick=()=>checkBox(div);
    boxesContainer.appendChild(div);
  });
}

function checkBox(box){
  const targetType = instruction.innerText.includes("Simple") ? "Simple":
                     instruction.innerText.includes("Continuous") ? "Continuous":
                     instruction.innerText.includes("Perfect Continuous") ? "PerfectContinuous":
                     "Perfect";
  if(box.dataset.type===targetType){
    box.classList.add('correct');
    correctAudio.currentTime=0;
    correctAudio.play();
    score++;
    scoreText.innerText = `Score: ${score}`;
    box.style.pointerEvents="none";
    // check if all correct boxes are clicked
    const remaining=document.querySelectorAll(`.box[data-type='${targetType}']`).length;
    const clicked=document.querySelectorAll(`.box.correct[data-type='${targetType}']`).length;
    if(clicked===remaining){
      currentRound++;
      if(currentRound>=rounds.length){
        endGame();
      } else setTimeout(startRound,1000);
    }
  } else{
    box.classList.add('wrong');
    wrongAudio.currentTime=0;
    wrongAudio.play();
    setTimeout(()=>{box.classList.remove('wrong')},300);
  }
}

function endGame(){
  gameScreen.style.display='none';
  endScreen.style.display='flex';
  finalScore.innerText=`Your Score: ${score}`;
}

function restartGame(){
  currentRound=0;
  score=0;
  endScreen.style.display='none';
  gameScreen.style.display='flex';
  scoreText.innerText = `Score: 0`;
  startRound();
}
</script>
</body>
</html>
