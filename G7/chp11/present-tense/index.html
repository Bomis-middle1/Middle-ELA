<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Factory - Present Tenses</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1d2671,#c33764,#3a7bd5);
color:white;
overflow:hidden;
}

/* SCREEN */
.screen{
display:none;
height:100vh;
width:100%;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}
.active{display:flex;}

/* LOGO */
#logoScreen img{width:220px;}

/* TITLE */
.title{
font-size:28px;
font-weight:bold;
animation:pulse 1s infinite;
}
@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* GAME */
#instruction{
font-size:18px;
margin-bottom:10px;
padding:10px;
opacity:0.95;
}

#sentence{
font-size:22px;
font-weight:bold;
margin:15px;
}

.option{
background:white;
color:black;
padding:12px;
margin:8px;
border-radius:10px;
cursor:pointer;
width:250px;
font-weight:bold;
}

.option.correct{background:#2ecc71;color:white;}
.option.wrong{background:#e74c3c;color:white;}

/* SCORE */
#score{
margin-top:10px;
}

/* POPUP */
#popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
padding:25px 40px;
border-radius:15px;
font-size:26px;
font-weight:bold;
display:none;
z-index:9999;
color:white;
}

#popup.correct{background:#2ecc71;}
#popup.wrong{background:#e74c3c;}

/* BUTTON */
button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#ff9800;
color:white;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen" class="screen">
<div class="title">🏭 Grammar Factory – Present Tenses</div>
<p>Identify the tense used in the following sentence.</p>
<button onclick="startGame()">Start Machine</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div id="instruction">👉 Identify the tense used in the following sentence.</div>

<div id="sentence"></div>

<div id="options"></div>

<div id="score">Score: 0</div>

</div>

<!-- POPUP -->
<div id="popup"></div>

<script>

/* QUESTIONS */
const questions=[
{q:"She goes to school by bus every day.",a:"Present Simple"},
{q:"He has been studying for three hours.",a:"Present Perfect Continuous"},
{q:"They are playing football now.",a:"Present Continuous"},
{q:"We have visited Jaipur twice.",a:"Present Perfect"},
{q:"Look! The baby is sleeping.",a:"Present Continuous"},
{q:"The Earth moves around the Sun.",a:"Present Simple"},
{q:"My sister has written three letters today.",a:"Present Perfect"},
{q:"It has been raining since morning.",a:"Present Perfect Continuous"},
{q:"My father works in a bank.",a:"Present Simple"},
{q:"I have finished my homework.",a:"Present Perfect"}
];

let qBank = questions.sort(()=>Math.random()-0.5);
let i=0;
let score=0;

const options=[
"Present Simple",
"Present Continuous",
"Present Perfect",
"Present Perfect Continuous"
];

/* START */
function startGame(){
document.getElementById("titleScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");
loadQ();
}

/* LOAD */
function loadQ(){

if(i>=qBank.length){
end();
return;
}

document.getElementById("sentence").innerText=qBank[i].q;

let box=document.getElementById("options");
box.innerHTML="";

options.forEach(opt=>{
let div=document.createElement("div");
div.className="option";
div.innerText=opt;

div.onclick=()=>check(opt,div);

box.appendChild(div);
});
}

/* CHECK */
function check(ans,el){

let correct=qBank[i].a;

if(ans===correct){
score++;
showPopup("Correct 🎉","correct");
el.classList.add("correct");
}else{
showPopup("Wrong ❌","wrong");
el.classList.add("wrong");
}

/* next */
setTimeout(()=>{
i++;
loadQ();
},1200);
}

/* POPUP */
function showPopup(text,type){

let p=document.getElementById("popup");
p.innerText=text;
p.className=type;
p.style.display="block";

setTimeout(()=>{
p.style.display="none";
},1000);
}

/* END */
function end(){
document.getElementById("gameScreen").innerHTML=
`<h2>🎉 Game Over</h2><h3>Score: ${score}/${qBank.length}</h3>
<button onclick="location.reload()">Restart</button>`;
}

</script>

</body>
</html>
