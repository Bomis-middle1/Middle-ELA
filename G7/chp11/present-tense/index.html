<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Factory - Present Tenses</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1d2671,#c33764,#3a7bd5);
color:white;
overflow:hidden;
}

/* SCREENS */
.screen{
display:none;
height:100vh;
width:100%;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}
.active{display:flex;}

/* LOGO */
#logoScreen img{
width:220px;
}

/* TITLE */
.title{
font-size:28px;
font-weight:bold;
animation:pulse 1s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.05);}
}

/* GAME BOX */
#gameScreen{
flex-direction:column;
}

#instruction{
font-size:18px;
margin-bottom:10px;
opacity:0.9;
}

#sentence{
font-size:22px;
font-weight:bold;
margin:15px;
}

/* OPTIONS */
.option{
background:white;
color:black;
padding:12px;
margin:8px;
border-radius:10px;
cursor:pointer;
width:220px;
font-weight:bold;
}

.option.correct{background:#2ecc71;color:white;}
.option.wrong{background:#e74c3c;color:white;}

/* SCORE */
#score{
margin-top:10px;
font-size:18px;
}

/* BUTTON */
button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#ff9800;
color:white;
font-weight:bold;
cursor:pointer;
}

/* END */
#endScreen{
text-align:center;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen" class="screen">
<div class="title">🏭 Grammar Factory – Present Tenses</div>
<button onclick="startGame()">Start Machine</button>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div id="instruction">👉 Identify the correct Present Tense used in the sentence</div>

<div id="sentence"></div>

<div id="options"></div>

<div id="score">Score: 0</div>

</div>

<!-- END -->
<div id="endScreen" class="screen">
<h2>🎉 Game Over</h2>
<div id="finalScore"></div>
<button onclick="location.reload()">Restart</button>
</div>

<script>

/* ================= LOGIC ================= */

const questions = [
{q:"She goes to school by bus every day.",a:"Present Simple"},
{q:"He has been studying for three hours.",a:"Present Perfect Continuous"},
{q:"They are playing football in the playground now.",a:"Present Continuous"},
{q:"We have visited Jaipur twice.",a:"Present Perfect"},
{q:"Look! The baby is sleeping.",a:"Present Continuous"},
{q:"The Earth moves around the Sun.",a:"Present Simple"},
{q:"My sister has written three letters today.",a:"Present Perfect"},
{q:"It has been raining since morning.",a:"Present Perfect Continuous"},
{q:"My father works in a bank.",a:"Present Simple"},
{q:"I have finished my homework.",a:"Present Perfect"},
{q:"She is preparing for her English test this week.",a:"Present Continuous"},
{q:"They have been practising for the competition since Monday.",a:"Present Perfect Continuous"}
];

let qBank = questions.sort(()=>Math.random()-0.5).slice(0,10);

let i=0;
let score=0;

/* OPTIONS */
const options=[
"Present Simple",
"Present Continuous",
"Present Perfect",
"Present Perfect Continuous"
];

/* START */
function startGame(){
document.getElementById("titleScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");
loadQ();
}

/* LOAD QUESTION */
function loadQ(){

if(i>=qBank.length){
end();
return;
}

document.getElementById("sentence").innerText=qBank[i].q;

let box=document.getElementById("options");
box.innerHTML="";

options.forEach(opt=>{
let div=document.createElement("div");
div.className="option";
div.innerText=opt;

div.onclick=()=>check(opt,div);

box.appendChild(div);
});
}

/* CHECK */
function check(ans,el){

let correct=qBank[i].a;

if(ans===correct){
score++;
document.getElementById("score").innerText="Score: "+score;
el.classList.add("correct");
}else{
el.classList.add("wrong");
}

/* move next */
setTimeout(()=>{
i++;
loadQ();
},800);
}

/* END */
function end(){
document.getElementById("gameScreen").classList.remove("active");
document.getElementById("endScreen").classList.add("active");

document.getElementById("finalScore").innerText=
`You scored ${score} / ${qBank.length}`;
}

</script>

</body>
</html>
