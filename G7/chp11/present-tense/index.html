<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Factory - FIXED</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1d2671,#c33764,#3a7bd5);
overflow:hidden;
color:white;
}

/* SCREEN SYSTEM (FIXED) */
.screen{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

/* LOGO */
#logoScreen{
background:white;
display:flex;
}
#logoScreen img{
width:220px;
animation:pop 1s ease;
}

@keyframes pop{
from{transform:scale(0.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* TITLE */
#titleScreen{
background:linear-gradient(#4fc3f7,#e1f5fe);
color:#0d47a1;
}

/* GAME */
#gameScreen{
flex-direction:column;
}

/* TEXT */
#instruction{
font-size:18px;
margin-bottom:10px;
}

#sentence{
font-size:22px;
font-weight:bold;
margin:10px;
}

/* OPTIONS */
.option{
background:white;
color:black;
padding:12px;
margin:8px;
border-radius:10px;
cursor:pointer;
width:260px;
font-weight:bold;
}

/* SCORE */
#score{
position:fixed;
top:10px;
left:10px;
font-size:18px;
font-weight:bold;
}

/* POPUP */
#popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
padding:18px 25px;
border-radius:10px;
font-size:22px;
display:none;
z-index:9999;
color:white;
}

/* BUTTON */
button{
padding:12px 18px;
border:none;
border-radius:10px;
background:#ffca28;
font-weight:bold;
cursor:pointer;
color:black;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen">
<img src="assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen" class="screen">
<div>
<h1>🏭 Grammar Factory</h1>
<p>Present Tense Challenge</p>
<button onclick="startGame()">Start</button>
</div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div id="score">Score: 0</div>

<div id="instruction">
👉 Identify the tense used in the sentence
</div>

<div id="sentence"></div>

<div id="options"></div>

</div>

<!-- POPUP -->
<div id="popup"></div>

<script>

/* ================= CLEAN SCREEN CONTROL ================= */
const screens = {
logo: document.getElementById("logoScreen"),
title: document.getElementById("titleScreen"),
game: document.getElementById("gameScreen")
};

/* FLOW */
setTimeout(()=>{
screens.logo.style.display="none";
screens.title.style.display="flex";
},5000);

/* ================= QUESTIONS ================= */
const questions=[
{q:"She goes to school by bus every day.",a:"Present Simple",hint:"Habit / routine",exp:"Used for regular actions"},
{q:"He has been studying for three hours.",a:"Present Perfect Continuous",hint:"Ongoing duration",exp:"Action continuing over time"},
{q:"They are playing football now.",a:"Present Continuous",hint:"happening now",exp:"Action in progress"},
{q:"We have visited Jaipur twice.",a:"Present Perfect",hint:"past experience",exp:"Past action with present relevance"},
{q:"The Earth moves around the Sun.",a:"Present Simple",hint:"universal truth",exp:"Scientific fact"}
];

let i=0;
let score=0;
let attempts=2;

/* START */
function startGame(){
screens.title.style.display="none";
screens.game.style.display="flex";
load();
}

/* LOAD */
function load(){

if(i>=questions.length){
end();
return;
}

attempts=2;

document.getElementById("score").innerText="Score: "+score;
document.getElementById("sentence").innerText=questions[i].q;

let box=document.getElementById("options");
box.innerHTML="";

["Present Simple","Present Continuous","Present Perfect","Present Perfect Continuous"]
.forEach(opt=>{

let div=document.createElement("div");
div.className="option";
div.innerText=opt;

div.onclick=()=>check(opt);

box.appendChild(div);
});
}

/* CHECK */
function check(ans){

let correct=questions[i].a;

if(ans===correct){
score++;
show("Correct 🎉","green");
i++;
setTimeout(load,900);
}
else{
attempts--;

if(attempts===1){
show("Hint: "+questions[i].hint,"orange");
}
else{
show("Answer: "+correct+" | "+questions[i].exp,"red");
i++;
setTimeout(load,1500);
}
}
}

/* POPUP */
function show(text,color){
let p=document.getElementById("popup");
p.innerText=text;
p.style.background=color;
p.style.display="block";

setTimeout(()=>p.style.display="none",1200);
}

/* END */
function end(){
document.getElementById("gameScreen").innerHTML=
`<h2>🎉 Game Completed</h2>
<h3>Score: ${score}/${questions.length}</h3>
<button onclick="location.reload()">Restart</button>`;
}

</script>

</body>
</html>
