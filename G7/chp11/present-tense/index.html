<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Punctuation Balloon Challenge</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#6dd5fa,#ff758c,#4facfe);
overflow:hidden;
}

/* ================= LOADING / LOGO ================= */
.screen{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

#logoScreen{
background:white;
z-index:9999;
}

#logoScreen img{
width:220px;
}

/* ================= TITLE ================= */
#titleScreen{
display:none;
background:linear-gradient(#4fc3f7,#e1f5fe);
z-index:9998;
color:#0d47a1;
}

#titleScreen h1{
font-size:42px;
animation:pulse 1.2s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* ================= GAME ================= */
#gameScreen{
display:none;
flex-direction:column;
}

#topBar{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
padding:10px;
color:white;
font-weight:bold;
z-index:10;
}

#questionBox{
margin-top:80px;
padding:15px;
font-size:22px;
color:white;
text-align:center;
}

#options{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
padding:10px;
}

.option{
background:white;
padding:12px 16px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
min-width:120px;
text-align:center;
}

.option:active{
transform:scale(0.95);
}

/* ================= TIMER ================= */
#timer{
font-size:18px;
}

/* ================= HINT ================= */
#hintBox{
color:#fff;
text-align:center;
margin-top:10px;
}

/* ================= RESULT ================= */
#resultScreen{
display:none;
background:rgba(0,0,0,0.8);
color:white;
z-index:9999;
}

#restartBtn{
padding:12px 20px;
margin-top:20px;
border:none;
border-radius:10px;
background:#ffca28;
font-weight:bold;
}

/* ================= CONFETTI ================= */
.confetti{
position:absolute;
width:8px;
height:8px;
background:yellow;
animation:fall 2s linear forwards;
}

@keyframes fall{
to{transform:translateY(100vh);opacity:0;}
}
</style>
</head>

<body>

<!-- ================= LOGO ================= -->
<div id="logoScreen" class="screen">
<img src="assets/innovine-logo.png">
</div>

<!-- ================= TITLE ================= -->
<div id="titleScreen" class="screen">
<h1>🎈 Punctuation Balloon Challenge</h1>
<button onclick="startGame()">Start</button>
</div>

<!-- ================= GAME ================= -->
<div id="gameScreen" class="screen">

<div id="topBar">
<div id="score">Score: 0</div>
<div id="timer">Time: 45</div>
</div>

<div id="questionBox"></div>
<div id="options"></div>
<div id="hintBox"></div>

</div>

<!-- ================= RESULT ================= -->
<div id="resultScreen" class="screen">
<h1 id="finalText"></h1>
<button id="restartBtn" onclick="location.reload()">Restart</button>
</div>

<!-- ================= AUDIO ================= -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

/* ================= FLOW ================= */
setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("titleScreen").style.display="flex";
},5000);

/* ================= QUESTIONS ================= */
const allQuestions = [
{q:"I can’t believe we finally finished the project ___",a:[".","!","?"],c:"!"},
{q:"Where are you going after school ___",a:[".","!","?"],c:"?"},
{q:"Wow this is amazing ___",a:[".","!","?"],c:"!"},
{q:"Are you coming with us ___",a:[".","!","?"],c:"?"},
{q:"The sun is shining brightly ___",a:[".","!","?"],c:"."},
{q:"Please sit down ___",a:[".",":","!"],c:":"},
{q:"Stop right there ___",a:[".","!","?"],c:"!"},
{q:"Let’s go to the park ___",a:[".",",","!"],c:"."},
{q:"She has been working all day ___",a:[".","!","?"],c:"."},
{q:"What a beautiful day ___",a:[".","!","?"],c:"!"}
];

let qBank = shuffle(allQuestions).slice(0,10);

let index=0;
let score=0;
let attempts=2;
let timer=45;
let interval;

/* ================= START ================= */
function startGame(){
document.getElementById("titleScreen").style.display="none";
document.getElementById("gameScreen").style.display="flex";

loadQ();
startTimer();
}

/* ================= LOAD QUESTION ================= */
function loadQ(){

if(index>=qBank.length){
endGame();
return;
}

attempts=2;
document.getElementById("hintBox").innerText="";
document.getElementById("questionBox").innerText=qBank[index].q;

let optDiv=document.getElementById("options");
optDiv.innerHTML="";

qBank[index].a.forEach(opt=>{
let btn=document.createElement("div");
btn.className="option";
btn.innerText=opt;

btn.onclick=()=>check(opt,btn);

optDiv.appendChild(btn);
});
}

/* ================= CHECK ================= */
function check(ans,el){

let correct=qBank[index].c;

if(ans===correct){
score++;
document.getElementById("score").innerText="Score: "+score;
play("correct");
confetti();
nextQ();
}else{

play("wrong");
attempts--;

if(attempts===1){
document.getElementById("hintBox").innerText="💡 Hint: Think about sentence tone or punctuation.";
}

if(attempts<=0){
document.getElementById("hintBox").innerText="✔ Correct Answer: "+correct;
nextQ();
}
}
}

/* ================= NEXT ================= */
function nextQ(){
setTimeout(()=>{
index++;
loadQ();
},900);
}

/* ================= TIMER ================= */
function startTimer(){
interval=setInterval(()=>{
timer--;
document.getElementById("timer").innerText="Time: "+timer;

if(timer<=0){
clearInterval(interval);
endGame();
}
},1000);
}

/* ================= AUDIO ================= */
function play(id){
let a=document.getElementById(id+"Sound");
a.volume=1;
a.play().catch(()=>{});
}

/* ================= CONFETTI ================= */
function confetti(){
for(let i=0;i<25;i++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=["#ff0","#0ff","#f0f","#0f0","#f60"][Math.floor(Math.random()*5)];
document.body.appendChild(c);
setTimeout(()=>c.remove(),2000);
}
}

/* ================= END ================= */
function endGame(){

clearInterval(interval);

document.getElementById("gameScreen").style.display="none";
document.getElementById("resultScreen").style.display="flex";

let percent=(score/qBank.length)*100;

let remark="";

if(percent>=80) remark="Excellent 🎉";
else if(percent>=60) remark="Good Job 👍";
else if(percent>=45) remark="Well Tried 🙂";
else remark="Let’s Revise 📘";

document.getElementById("finalText").innerText=
`Score: ${score}/${qBank.length} \n${remark}`;

play("clap");
}

/* ================= SHUFFLE ================= */
function shuffle(arr){
return arr.sort(()=>Math.random()-0.5);
}

</script>

</body>
</html>
