<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Factory</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1e3c72,#2a5298,#ffb347);
overflow:hidden;
color:white;
}

/* SCREEN SYSTEM */
.screen{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.active{display:flex;}

/* LOGO */
#logoScreen{background:white;}
#logoScreen img{width:220px;}

/* TITLE */
#titleScreen h1{font-size:30px;}

/* GAME AREA */
#gameScreen{
background:linear-gradient(135deg,#1e3c72,#2a5298,#ffb347);
}

/* HUD FIX (IMPORTANT) */
#hud{
position:fixed;
top:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
background:rgba(0,0,0,0.5);
padding:10px;
z-index:999;
font-size:14px;
}

/* PACKAGE CARD */
#package{
background:white;
color:black;
padding:20px;
border-radius:15px;
width:80%;
max-width:500px;
margin-top:120px;
font-weight:bold;
}

/* OPTIONS */
.options{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin-top:20px;
}

.option{
background:#fff;
color:#000;
padding:10px;
border-radius:10px;
min-width:40%;
cursor:pointer;
font-weight:bold;
}

.option:active{transform:scale(0.95);}

.correct{background:#2ecc71;color:white;}
.wrong{background:#e74c3c;color:white;}

/* CONVEYOR (visual only, NO interference) */
.conveyor{
position:fixed;
bottom:0;
left:0;
right:0;
height:60px;
background:repeating-linear-gradient(90deg,#444,#444 20px,#666 20px,#666 40px);
opacity:0.6;
}

/* BUTTON */
button{
padding:10px 15px;
border:none;
border-radius:10px;
background:orange;
font-weight:bold;
}

/* POPUP */
#popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#000;
padding:15px;
border-radius:10px;
display:none;
z-index:9999;
}

</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen" class="screen">
<div>
<h1>🏭 Grammar Factory</h1>
<p>Present Tense Challenge</p>
<button onclick="startGame()">Start</button>
</div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div id="hud">
<div>⭐ Score: <span id="score">0</span></div>
<div>🪙 Coins: <span id="coins">0</span></div>
<div>❤️ Attempts: <span id="attempts">2</span></div>
<div>📦 <span id="progress">0</span>/10</div>
</div>

<div id="package"></div>

<div class="conveyor"></div>

</div>

<!-- POPUP -->
<div id="popup"></div>

<script>

const questions = [
{q:"She goes to school by bus every day.",a:"Present Simple",hint:"Habit"},
{q:"They are decorating the classroom for the annual day celebration.",a:"Present Continuous",hint:"Now"},
{q:"We have finished our science project.",a:"Present Perfect",hint:"Completed"},
{q:"My brother has been practising the guitar for two hours.",a:"Present Perfect Continuous",hint:"Ongoing"},
{q:"The Earth revolves around the Sun.",a:"Present Simple",hint:"Fact"},
{q:"Look! The children are flying kites.",a:"Present Continuous",hint:"Look clue"},
{q:"Our teacher has checked all notebooks.",a:"Present Perfect",hint:"Done"},
{q:"Riya has been reading since Monday.",a:"Present Perfect Continuous",hint:"Since"},
{q:"The bus arrives at 7:30 every day.",a:"Present Simple",hint:"Routine"},
{q:"I am helping my mother right now.",a:"Present Continuous",hint:"Now"}
];

let order=[],i=0,score=0,coins=0,attempts=2,lock=false;

/* LOGO */
setTimeout(()=>{
document.getElementById("logoScreen").classList.remove("active");
document.getElementById("titleScreen").classList.add("active");
},5000);

/* START */
function startGame(){
document.getElementById("titleScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");

order=[...questions].sort(()=>Math.random()-0.5);

i=0;score=0;coins=0;
loadQ();
}

/* LOAD QUESTION (SLOWED DOWN) */
function loadQ(){

lock=false;
attempts=2;

updateHUD();

if(i>=order.length){
end();
return;
}

let q=order[i];

document.getElementById("package").innerHTML=`
📦 ${q.q}<br><br>
<b>Choose Tense</b>
<div class="options">
${shuffle(q.options || [
"Present Simple",
"Present Continuous",
"Present Perfect",
"Present Perfect Continuous"
]).map(o=>`<div class='option' onclick="check('${o}',this)">${o}</div>`).join("")}
</div>
`;
}

/* HUD */
function updateHUD(){
document.getElementById("score").innerText=score;
document.getElementById("coins").innerText=coins;
document.getElementById("attempts").innerText=attempts;
document.getElementById("progress").innerText=i;
}

/* CHECK (SLOWED FLOW FIX) */
function check(ans,el){

if(lock) return;
lock=true;

let q=order[i];

if(ans===q.a){

score++;coins+=10;
el.classList.add("correct");
popup("Correct!");

setTimeout(()=>{
i++;
loadQ();
},1200); // 🔴 SLOW CONTROL FIX

}else{

attempts--;
updateHUD();

el.classList.add("wrong");

if(attempts>0){
popup("Hint: "+q.hint);
lock=false;
}
else{
popup("Answer: "+q.a);

setTimeout(()=>{
i++;
loadQ();
},1500);
}
}
}

/* POPUP */
function popup(t){
let p=document.getElementById("popup");
p.innerText=t;
p.style.display="block";

setTimeout(()=>p.style.display="none",1200);
}

/* SHUFFLE */
function shuffle(a){
return [...a].sort(()=>Math.random()-0.5);
}

/* END */
function end(){
document.getElementById("gameScreen").innerHTML=`
<h2>🏆 Completed!</h2>
<h3>Score: ${score}/10</h3>
<h3>Coins: ${coins}</h3>
<button onclick="location.reload()">Play Again</button>
`;
}

</script>

</body>
</html>
