<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Factory - Present Tense</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#1d2671,#c33764,#3a7bd5);
overflow:hidden;
color:white;
}

/* SCREEN SYSTEM FIXED */
.screen{
position:fixed;
inset:0;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
}

.active{
display:flex;
}

/* LOGO */
#logoScreen{
background:white;
}
#logoScreen img{
width:220px;
animation:pop 1s ease;
}

@keyframes pop{
from{transform:scale(0.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* TITLE */
#titleScreen h1{
font-size:40px;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

/* GAME */
#gameScreen{
flex-direction:column;
padding-top:60px;
}

#score{
position:fixed;
top:10px;
left:10px;
font-size:18px;
font-weight:bold;
}

#instruction{
font-size:18px;
margin-bottom:10px;
opacity:0.9;
}

#sentence{
font-size:22px;
font-weight:bold;
margin:10px;
padding:10px;
}

/* OPTIONS */
#options{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin-top:20px;
}

.option{
background:white;
color:black;
padding:12px;
border-radius:10px;
cursor:pointer;
min-width:220px;
font-weight:bold;
transition:0.2s;
}

.option:active{transform:scale(0.95);}

.correct{background:#2ecc71 !important;color:white;}
.wrong{background:#e74c3c !important;color:white;}

/* POPUP */
#popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
padding:20px;
border-radius:10px;
font-size:22px;
display:none;
z-index:9999;
color:white;
}

/* BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#ffca28;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- TITLE -->
<div id="titleScreen" class="screen">
<div>
<h1>🏭 Grammar Factory</h1>
<p>Present Tense Challenge</p>
<button onclick="startGame()">Start</button>
</div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div id="score">Score: 0</div>

<div id="instruction">👉 Identify the tense used in the sentence</div>

<div id="sentence"></div>

<div id="options"></div>

</div>

<!-- POPUP -->
<div id="popup"></div>

<script>

/* ================= SCREEN FLOW ================= */
setTimeout(()=>{
document.getElementById("logoScreen").classList.remove("active");
document.getElementById("titleScreen").classList.add("active");
},5000);

/* ================= QUESTIONS ================= */
const questions = [
{q:"She goes to school by bus every day.",a:"Present Simple",hint:"Habit or routine",exp:"Used for regular actions"},
{q:"He has been studying for three hours.",a:"Present Perfect Continuous",hint:"Ongoing action",exp:"Action continuing over time"},
{q:"They are playing football now.",a:"Present Continuous",hint:"happening now",exp:"Action in progress"},
{q:"We have visited Jaipur twice.",a:"Present Perfect",hint:"past experience",exp:"Past action with present relevance"},
{q:"The Earth moves around the Sun.",a:"Present Simple",hint:"universal truth",exp:"Scientific fact"}
];

let qBank = questions.sort(()=>Math.random()-0.5);
let i=0;
let score=0;
let attempts=2;

/* ================= START ================= */
function startGame(){

document.getElementById("titleScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");

loadQ();
}

/* ================= LOAD QUESTION ================= */
function loadQ(){

if(i>=qBank.length){
endGame();
return;
}

attempts=2;

document.getElementById("score").innerText="Score: "+score;
document.getElementById("sentence").innerText=qBank[i].q;

const box=document.getElementById("options");
box.innerHTML="";

const opts=[
"Present Simple",
"Present Continuous",
"Present Perfect",
"Present Perfect Continuous"
];

opts.forEach(opt=>{
const div=document.createElement("div");
div.className="option";
div.innerText=opt;
div.onclick=()=>check(opt,div);
box.appendChild(div);
});
}

/* ================= CHECK ================= */
function check(ans,el){

let correct=qBank[i].a;

if(ans===correct){

score++;
showPopup("Correct 🎉","green");
el.classList.add("correct");

setTimeout(()=>{
i++;
loadQ();
},900);

}else{

attempts--;

if(attempts===1){
showPopup("Hint: "+qBank[i].hint,"orange");
}
else{
showPopup("Answer: "+correct+" | "+qBank[i].exp,"red");

setTimeout(()=>{
i++;
loadQ();
},1500);
}

el.classList.add("wrong");
}
}

/* ================= POPUP ================= */
function showPopup(text,color){

let p=document.getElementById("popup");
p.innerText=text;
p.style.background=color;
p.style.display="block";

setTimeout(()=>p.style.display="none",1200);
}

/* ================= END ================= */
function endGame(){

document.getElementById("gameScreen").innerHTML=`
<h2>🎉 Game Completed</h2>
<h3>Score: ${score} / ${qBank.length}</h3>
<button onclick="location.reload()">Restart</button>
`;

}
</script>

</body>
</html>
