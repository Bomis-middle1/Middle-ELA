<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Factory - Present Tenses</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#1b1b3a,#2c3e50,#34495e);
color:#fff;
overflow:hidden;
}

.header{
text-align:center;
padding:10px;
font-size:20px;
font-weight:bold;
background:#111;
}

.factory{
display:flex;
justify-content:space-around;
flex-wrap:wrap;
margin-top:20px;
padding:10px;
}

.machine{
width:45%;
min-width:140px;
height:120px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
font-weight:bold;
cursor:pointer;
transition:0.3s;
box-shadow:0 5px 10px rgba(0,0,0,0.3);
}

.machine span{
font-size:14px;
margin-top:5px;
}

.simple{background:#3498db;}
.continuous{background:#2ecc71;}
.perfect{background:#f1c40f;color:#000;}
.perfectC{background:#9b59b6;}

.active-green{
box-shadow:0 0 25px #2ecc71;
transform:scale(1.05);
}

.shake{
animation:shake 0.4s;
}

@keyframes shake{
0%,100%{transform:translateX(0);}
25%{transform:translateX(-6px);}
75%{transform:translateX(6px);}
}

.conveyor{
background:#222;
margin:20px auto;
padding:15px;
width:90%;
border-radius:10px;
text-align:center;
min-height:60px;
}

.sentence{
font-size:18px;
font-weight:bold;
animation:slide 1s ease;
}

@keyframes slide{
from{transform:translateX(-200px);opacity:0;}
to{transform:translateX(0);opacity:1;}
}

.score{
text-align:center;
margin-top:10px;
font-size:18px;
}

.hint{
text-align:center;
margin-top:10px;
color:#f1c40f;
font-weight:bold;
}

button{
padding:10px 16px;
border:none;
border-radius:10px;
margin-top:10px;
background:#ff9800;
color:#fff;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="header">🏭 Grammar Factory – Present Tenses</div>

<div class="score">Score: <span id="score">0</span></div>

<div class="conveyor">
<div id="sentence" class="sentence"></div>
</div>

<div class="factory">

<div class="machine simple" onclick="check('Present Simple', this)">
Present Simple
<span>🟦</span>
</div>

<div class="machine continuous" onclick="check('Present Continuous', this)">
Present Continuous
<span>🟩</span>
</div>

<div class="machine perfect" onclick="check('Present Perfect', this)">
Present Perfect
<span>🟨</span>
</div>

<div class="machine perfectC" onclick="check('Present Perfect Continuous', this)">
Present Perfect Continuous
<span>🟪</span>
</div>

</div>

<div class="hint" id="hint"></div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

/* ================= QUESTION BANK ================= */
const allQ = [
{q:"She goes to school by bus every day.",ans:"Present Simple"},
{q:"They are playing football in the playground now.",ans:"Present Continuous"},
{q:"I have finished my homework.",ans:"Present Perfect"},
{q:"He has been studying for three hours.",ans:"Present Perfect Continuous"},
{q:"My father works in a bank.",ans:"Present Simple"},
{q:"Look! The baby is sleeping.",ans:"Present Continuous"},
{q:"We have visited Jaipur twice.",ans:"Present Perfect"},
{q:"It has been raining since morning.",ans:"Present Perfect Continuous"},
{q:"The Earth moves around the Sun.",ans:"Present Simple"},
{q:"She is preparing for her English test this week.",ans:"Present Continuous"},
{q:"My sister has written three letters today.",ans:"Present Perfect"},
{q:"They have been practising for the competition since Monday.",ans:"Present Perfect Continuous"}
];

/* shuffle questions */
function shuffle(a){
return a.sort(()=>Math.random()-0.5);
}

let qBank = shuffle(allQ).slice(0,10);

let i=0;
let score=0;
let attempts=2;

/* ================= LOAD ================= */
load();

function load(){
if(i>=qBank.length){
endGame();
return;
}

attempts=2;

document.getElementById("sentence").innerText=qBank[i].q;
document.getElementById("hint").innerText="";
}

/* ================= CHECK ================= */
function check(machine, el){

let correct=qBank[i].ans;

if(machine===correct){

score+=10;
document.getElementById("score").innerText=score;

document.getElementById("correctSound").play().catch(()=>{});
document.getElementById("clapSound").play().catch(()=>{});

el.classList.add("active-green");

confetti();

setTimeout(()=>{
el.classList.remove("active-green");
i++;
load();
},1000);

}else{

attempts--;

document.getElementById("wrongSound").play().catch(()=>{});
el.classList.add("shake");

setTimeout(()=>el.classList.remove("shake"),400);

if(attempts<=0){

document.getElementById("hint").innerText =
correctHint(correct);

highlightCorrect(correct);

setTimeout(()=>{
i++;
load();
},2000);

}else{
document.getElementById("hint").innerText="Try again!";
}
}
}

/* ================= HINT ================= */
function correctHint(ans){
if(ans==="Present Perfect"){
return "Remember: Present Perfect uses has/have + past participle.";
}
if(ans==="Present Continuous"){
return "Remember: Present Continuous uses am/is/are + verb-ing.";
}
if(ans==="Present Perfect Continuous"){
return "Remember: has/have been + verb-ing shows duration.";
}
return "Remember: Present Simple shows habits and routines.";
}

/* ================= HIGHLIGHT ================= */
function highlightCorrect(ans){
document.querySelectorAll(".machine").forEach(m=>{
if(m.innerText.includes(ans.split(" ")[1])){
m.classList.add("active-green");
setTimeout(()=>m.classList.remove("active-green"),1500);
}
});
}

/* ================= CONFETTI ================= */
function confetti(){
for(let i=0;i<25;i++){
let c=document.createElement("div");
c.style.position="fixed";
c.style.left=Math.random()*100+"vw";
c.style.top="-10px";
c.style.width="8px";
c.style.height="8px";
c.style.background=["#ff0","#0ff","#f0f","#0f0","#f60"][Math.floor(Math.random()*5)];
c.style.animation="fall 2s linear forwards";
document.body.appendChild(c);
setTimeout(()=>c.remove(),2000);
}
}

/* add animation */
let style=document.createElement("style");
style.innerHTML=`@keyframes fall{to{transform:translateY(100vh);opacity:0;}}`;
document.head.appendChild(style);

/* ================= END ================= */
function endGame(){
document.body.innerHTML=`
<div style="text-align:center;padding:20px;">
<h1>🎉 Factory Complete!</h1>
<h2>You scored ${score} / 100</h2>
<button onclick="location.reload()">Play Again</button>
</div>
`;
}

</script>

</body>
</html>
