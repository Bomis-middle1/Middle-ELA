<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏰 Grammar Castle Adventure</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:linear-gradient(135deg,#0b1020,#111c33,#0f4c81);
color:white;
}

/* FLOATING BACKGROUND */
body::before,body::after{
content:"";
position:fixed;
border-radius:50%;
background:rgba(255,255,255,0.06);
animation:float 10s infinite alternate;
}

body::before{width:280px;height:280px;left:-120px;top:-120px;}
body::after{width:220px;height:220px;right:-90px;bottom:-90px;}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(60px);}
}

/* SCREEN SYSTEM */
.screen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.active{display:flex;}

/* SPLASH */
#splash{
background:white;
z-index:999;
}

#splash img{
width:220px;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

/* TOPIC */
#topic{
background:linear-gradient(135deg,#6d28d9,#2563eb);
}

#topic h1{
font-size:42px;
animation:glow 1s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px white;}
to{text-shadow:0 0 25px gold;}
}

/* CARD */
.card{
background:rgba(255,255,255,0.10);
backdrop-filter:blur(12px);
padding:22px;
border-radius:18px;
width:92%;
max-width:720px;
}

/* BUTTON */
button{
padding:14px 22px;
border:none;
border-radius:14px;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

button:hover{transform:scale(1.05);}

/* GAME WRAPPER (FIXED ALIGNMENT) */
.gameWrapper{
width:100%;
display:flex;
flex-direction:column;
align-items:center;
gap:12px;
}

/* HUD */
#hud{
display:flex;
justify-content:space-between;
width:100%;
max-width:900px;
font-weight:bold;
}

/* PROGRESS */
.barOuter{
width:100%;
max-width:900px;
height:10px;
background:#1f2937;
border-radius:20px;
overflow:hidden;
}

.barInner{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#facc15);
transition:0.4s;
}

/* QUESTION CARD (FIXED VISIBILITY) */
#roomCard{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(10px);
padding:22px;
border-radius:18px;
width:92%;
max-width:720px;
color:white;
}

/* ROOM */
#roomName{
font-size:20px;
color:#facc15;
margin-bottom:8px;
}

/* QUESTION */
#question{
font-size:22px;
margin:14px 0;
line-height:1.4;
}

/* OPTIONS (FIXED VISIBILITY ISSUE) */
#options{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
width:100%;
}

.option{
background:white;
color:black;
padding:14px;
border-radius:12px;
cursor:pointer;
transition:0.2s;
font-weight:bold;
}

.option:hover{transform:scale(1.03);}

.correct{background:#22c55e!important;color:white;}
.wrong{background:#ef4444!important;color:white;}

/* MOBILE */
@media(max-width:768px){
#options{grid-template-columns:1fr;}
#topic h1{font-size:30px;}
}

/* CONFETTI */
canvas{
position:fixed;
inset:0;
pointer-events:none;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<!-- SPLASH -->
<div id="splash" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- TOPIC -->
<div id="topic" class="screen">
<h1>🏰 Grammar Castle Adventure</h1>
<p>Conquer all 10 Grammar Rooms!</p>
</div>

<!-- MISSION -->
<div id="mission" class="screen">
<div class="card">
<h2>📜 Mission</h2>
<p>Welcome Grammar Knight!</p>
<p>Unlock all 10 castle rooms.</p>
<button onclick="startGame()">START ADVENTURE</button>
<br><br>
Volume:
<input id="vol" type="range" min="0" max="1" step="0.1" value="1">
</div>
</div>

<!-- GAME -->
<div id="game" class="screen">

<div class="gameWrapper">

<div id="hud">
<div id="roomText">🏰 Room 1/10</div>
<div id="scoreText">⭐ 0</div>
</div>

<div class="barOuter">
<div class="barInner" id="bar"></div>
</div>

<div id="roomCard">
<div id="roomName"></div>
<div id="question"></div>
<div id="options"></div>
</div>

</div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
<div class="card">
<h1>🏆 Castle Conquered!</h1>
<h2 id="finalScore"></h2>
<button onclick="location.reload()">Play Again</button>
</div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

/* =========================
COMPLETE QUESTIONS (RESTORED - FIXED CRASH)
========================= */
const questions = [
{
question:"Identify the subject in the sentence.<br><b>The students completed the science project on time.</b>",
options:["completed the science project","the science project","The students","on time"],
answer:2
},
{
question:"Identify the predicate in the sentence.<br><b>The little puppy barked loudly all night.</b>",
options:["The little puppy","loudly","barked loudly all night","all night"],
answer:2
},
{
question:"Which words form the direct object?<br><b>Maria baked a delicious cake yesterday.</b>",
options:["Maria","baked","a delicious cake","yesterday"],
answer:2
},
{
question:"Identify the complement.<br><b>The sky became dark before the storm.</b>",
options:["The sky","became","dark","before the storm"],
answer:2
},
{
question:"Predicate of sentence?<br><b>My brother plays basketball every Saturday.</b>",
options:["My brother","plays basketball every Saturday","basketball","every Saturday"],
answer:1
},
{
question:"Identify subject.<br><b>After school, the children visited the library.</b>",
options:["visited","the library","After school","the children"],
answer:3
},
{
question:"Direct object?<br><b>The teacher explained the lesson clearly.</b>",
options:["The teacher","explained","the lesson","clearly"],
answer:2
},
{
question:"Complement?<br><b>Our classroom looks beautiful after decorations.</b>",
options:["Our classroom","looks","beautiful","after decorations"],
answer:2
},
{
question:"Subject?<br><b>Several colorful birds flew across the lake.</b>",
options:["Several colorful birds","flew","across the lake","the lake"],
answer:0
},
{
question:"Predicate?<br><b>The firefighters rescued the family safely.</b>",
options:["The firefighters","rescued the family safely","the family","safely"],
answer:1
}
];

/* =========================
STATE
========================= */
let index=0;
let score=0;
let order=[...Array(questions.length).keys()].sort(()=>Math.random()-0.5);

/* =========================
FLOW
========================= */
setTimeout(()=>{
splash.classList.remove("active");
topic.classList.add("active");
},5000);

setTimeout(()=>{
topic.classList.remove("active");
mission.classList.add("active");
},8000);

/* =========================
START GAME
========================= */
function startGame(){
mission.classList.remove("active");
game.classList.add("active");
index=0;
score=0;
loadQ();
}

/* =========================
LOAD QUESTION
========================= */
function loadQ(){

let q=questions[order[index]];

roomText.innerText=`🏰 Room ${index+1}/10`;
scoreText.innerText=`⭐ ${score}`;
roomName.innerText="🏰 Castle Room";
question.innerHTML=q.question;

options.innerHTML="";

q.options.forEach((o,i)=>{
let b=document.createElement("div");
b.className="option";
b.innerText=o;
b.onclick=()=>check(i,b,q.answer);
options.appendChild(b);
});

bar.style.width=(index/questions.length)*100+"%";
}

/* =========================
CHECK ANSWER
========================= */
function check(i,b,ans){

let all=document.querySelectorAll(".option");
all.forEach(x=>x.style.pointerEvents="none");

let v=vol.value;
correctSound.volume=v;
wrongSound.volume=v;
clapSound.volume=v;

if(i===ans){
b.classList.add("correct");
correctSound.play();
score++;
launch();
}else{
b.classList.add("wrong");
wrongSound.play();
all[ans].classList.add("correct");
}

setTimeout(()=>{
index++;
if(index<questions.length) loadQ();
else endGame();
},1200);
}

/* =========================
CONFETTI
========================= */
function launch(){
let c=document.getElementById("confetti");
let ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

for(let i=0;i<120;i++){
ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
ctx.fillRect(Math.random()*c.width,Math.random()*c.height,6,6);
}
}

/* =========================
END GAME
========================= */
function endGame(){
game.classList.remove("active");
result.classList.add("active");
finalScore.innerText=`⭐ ${score}/${questions.length}`;
clapSound.play();
}

</script>

</body>
</html>
