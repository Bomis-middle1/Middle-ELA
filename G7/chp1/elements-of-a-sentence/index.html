<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Grammar Construction Site</title>

<style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial, sans-serif;}
    body{
        background: linear-gradient(#87CEEB,#dff6ff);
        overflow:hidden;
        height:100vh;
    }

    /* Screens */
    .screen{
        position:absolute;
        width:100%;
        height:100%;
        display:none;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        text-align:center;
    }
    .active{display:flex;}

    /* Logo */
    #logoScreen img{
        width:220px;
        animation: zoomIn 5s ease-in-out;
    }
    @keyframes zoomIn{
        0%{transform:scale(0.7);opacity:0;}
        50%{opacity:1;}
        100%{transform:scale(1.1);opacity:1;}
    }

    /* Instruction */
    #instructionScreen{
        background:linear-gradient(#87CEEB,#fff);
        padding:20px;
    }
    h1{font-size:26px;color:#222;margin-bottom:10px;}
    .card{
        background:white;
        padding:15px;
        border-radius:15px;
        box-shadow:0 5px 15px rgba(0,0,0,0.2);
        max-width:90%;
    }
    button{
        padding:15px 30px;
        margin-top:15px;
        font-size:18px;
        border:none;
        border-radius:10px;
        background:orange;
        color:white;
        cursor:pointer;
    }

    /* Game UI */
    #gameScreen{
        flex-direction:row;
    }

    #world{
        position:absolute;
        width:100%;
        height:100%;
        z-index:0;
        overflow:hidden;
    }

    .cloud{
        position:absolute;
        width:80px;
        height:40px;
        background:white;
        border-radius:50px;
        opacity:0.7;
        animation: moveClouds 20s linear infinite;
    }
    @keyframes moveClouds{
        from{transform:translateX(-200px);}
        to{transform:translateX(120vw);}
    }

    .crane{
        position:absolute;
        bottom:120px;
        left:10%;
        font-size:40px;
        animation: swing 2s infinite alternate;
    }
    @keyframes swing{
        from{transform:rotate(-5deg);}
        to{transform:rotate(5deg);}
    }

    /* Scoreboard */
    #hud{
        position:fixed;
        top:10px;
        left:10px;
        background:white;
        padding:10px;
        border-radius:10px;
        z-index:5;
        font-size:14px;
    }

    /* Question panel */
    #panel{
        position:relative;
        z-index:2;
        background:white;
        padding:15px;
        border-radius:15px;
        width:90%;
        max-width:500px;
    }

    .option{
        padding:10px;
        margin:8px;
        background:#f2f2f2;
        border-radius:8px;
        cursor:pointer;
    }

    .option:hover{background:#ddd;}

    .hint{
        margin-top:10px;
        color:#d35400;
        font-size:14px;
    }

    .building{
        position:absolute;
        bottom:0;
        width:120px;
        height:0;
        background:#c49a6c;
        margin:10px;
        transition:0.5s;
    }

    .complete{
        background:linear-gradient(#ffd700,#ff8c00);
    }

    #finalScreen{
        background:#fff;
    }

</style>
</head>

<body>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
    <img src="assets/innovine-logo.png"/>
</div>

<!-- INSTRUCTIONS -->
<div id="instructionScreen" class="screen">
    <div class="card">
        <h1>🏗 Grammar Construction Site</h1>
        <p>Become the Chief Engineer!</p>
        <p>Build Grammar City by identifying:</p>
        <p><b>Subject • Predicate • Direct Object • Complement</b></p>
        <button onclick="startGame()">START</button>
    </div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">

<div id="world">
    <div class="cloud" style="top:50px;"></div>
    <div class="cloud" style="top:120px;animation-duration:30s;"></div>
    <div class="crane">🏗️</div>
</div>

<div id="hud">
Score: <span id="score">0</span><br>
Building: <span id="bIndex">1</span>/10<br>
Stage: <span id="stage">Subject</span>
</div>

<div id="panel">
    <div id="sentence"></div>
    <h3 id="task"></h3>
    <div id="options"></div>
    <div id="hint" class="hint"></div>
</div>

</div>

<!-- FINAL -->
<div id="finalScreen" class="screen">
    <h1>🎉 Grammar City Complete!</h1>
    <p id="finalStats"></p>
    <button onclick="restart()">Play Again</button>
</div>

<script>

/* DATA */
const levels = [
{
sentence:"The students completed the science project on time.",
subject:"The students",
predicate:"completed the science project on time",
object:"the science project",
complement:null
},
{
sentence:"The little puppy barked loudly all night.",
subject:"The little puppy",
predicate:"barked loudly all night",
object:null,
complement:null
},
{
sentence:"Maria baked a delicious cake yesterday.",
subject:"Maria",
predicate:"baked a delicious cake yesterday",
object:"a delicious cake",
complement:null
},
{
sentence:"The sky became dark before the storm.",
subject:"The sky",
predicate:"became dark before the storm",
object:null,
complement:"dark"
},
{
sentence:"My brother plays basketball every Saturday.",
subject:"My brother",
predicate:"plays basketball every Saturday",
object:"basketball",
complement:null
},
{
sentence:"After school, the children visited the library.",
subject:"the children",
predicate:"visited the library",
object:"the library",
complement:null
},
{
sentence:"The teacher explained the lesson clearly.",
subject:"The teacher",
predicate:"explained the lesson clearly",
object:"the lesson",
complement:null
},
{
sentence:"Our classroom looks beautiful after the decorations.",
subject:"Our classroom",
predicate:"looks beautiful after the decorations",
object:null,
complement:"beautiful"
},
{
sentence:"Several colourful birds flew across the lake.",
subject:"Several colourful birds",
predicate:"flew across the lake",
object:null,
complement:null
},
{
sentence:"The firefighters rescued the family safely.",
subject:"The firefighters",
predicate:"rescued the family safely",
object:"the family",
complement:null
}
];

let order = [];
let i = 0;
let score = 0;
let stageList = ["subject","predicate","object","complement"];
let stageIndex = 0;
let attempts = 0;

/* INIT */
function shuffle(arr){return arr.sort(()=>Math.random()-0.5);}

function startGame(){
    document.getElementById("instructionScreen").classList.remove("active");
    document.getElementById("gameScreen").classList.add("active");

    order = shuffle([...levels]);
    loadLevel();
}

function loadLevel(){
    stageIndex = 0;
    attempts = 0;
    document.getElementById("hint").innerText="";
    showStage();
}

function showStage(){
    let lvl = order[i];
    let stage = stageList[stageIndex];

    if(stage==="object" && !lvl.object){
        stageIndex++;
        return showStage();
    }
    if(stage==="complement" && !lvl.complement){
        nextLevel();
        return;
    }

    document.getElementById("sentence").innerText = lvl.sentence;
    document.getElementById("task").innerText = "Find the " + stage.toUpperCase();

    document.getElementById("stage").innerText = stage;

    let correct = lvl[stage];
    let opts = generateOptions(lvl, stage);

    let html="";
    opts.forEach(o=>{
        html += `<div class='option' onclick="checkAnswer('${o.replace(/'/g,"")}','${correct.replace(/'/g,"")}')">${o}</div>`;
    });

    document.getElementById("options").innerHTML = html;
}

function generateOptions(lvl, stage){
    let correct = lvl[stage];
    let pool = [lvl.subject,lvl.predicate,lvl.object,lvl.complement,"on time","yesterday","clearly","safely"];
    pool = pool.filter(Boolean);
    pool = pool.filter(x=>x!==correct);
    shuffle(pool);
    let opts = [correct,...pool.slice(0,3)];
    return shuffle(opts);
}

function checkAnswer(choice, correct){
    if(choice===correct){
        document.getElementById("correctSound").play();
        score += 10;
        attempts=0;
        stageIndex++;
        document.getElementById("score").innerText=score;
        document.getElementById("bIndex").innerText=i+1;
        document.getElementById("hint").innerText="";
        setTimeout(showStage,500);
    } else {
        document.getElementById("wrongSound").play();
        attempts++;
        if(attempts===1){
            document.getElementById("hint").innerText="❌ Try again!";
        } else {
            document.getElementById("hint").innerText="💡 The " + stageList[stageIndex] + " is a key part of the sentence.";
            setTimeout(()=>{
                stageIndex++;
                attempts=0;
                showStage();
            },1200);
        }
    }
}

function nextLevel(){
    i++;
    if(i>=order.length){
        endGame();
    } else {
        loadLevel();
    }
}

function endGame(){
    document.getElementById("gameScreen").classList.remove("active");
    document.getElementById("finalScreen").classList.add("active");

    let acc = Math.round((score/200)*100);

    document.getElementById("finalStats").innerText =
    `Score: ${score}
Accuracy: ${acc}%`;
}

function restart(){
    location.reload();
}

/* SPLASH TIMER */
setTimeout(()=>{
    document.getElementById("logoScreen").classList.remove("active");
    document.getElementById("instructionScreen").classList.add("active");
},5000);

</script>

</body>
</html>
