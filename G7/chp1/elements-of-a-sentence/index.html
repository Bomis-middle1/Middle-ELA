

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentence Builder Adventure - Grade 7</title>
<style>
body { margin:0; font-family:Arial; background:#e8f5e9; display:flex; justify-content:center; align-items:center; height:100vh; }
#logoScreen { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:white; z-index:100;}
#gameContainer { display:none; width:95%; max-width:600px; text-align:center; padding:20px; background:#fff; border-radius:10px; box-shadow:0 0 10px #aaa; position:relative; }
#sentence { font-size:18px; font-weight:bold; margin-bottom:15px; }
.blank { display:inline-block; width:140px; border-bottom:2px solid #000; margin:0 5px; font-weight:bold; cursor:pointer; }
.options { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:15px; }
.option { background:#ffeb3b; padding:8px 12px; border-radius:5px; cursor:pointer; user-select:none; min-width:80px; text-align:center; }
.option.wiggle { animation: wiggle 0.5s; }
@keyframes wiggle {0%{transform:rotate(0deg);}25%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}75%{transform:rotate(-10deg);}100%{transform:rotate(0deg);}}
#feedback { margin-top:10px; font-weight:bold; height:24px; }
#tick { display:none; font-size:30px; color:green; margin-top:10px; }
#restartBtn { display:none; margin-top:20px; padding:10px 20px; font-size:18px; cursor:pointer; background:#4caf50; color:white; border:none; border-radius:5px; }
.confetti-piece { position:absolute; width:8px; height:8px; border-radius:50%; top:0; animation: fall 2s linear forwards;}
@keyframes fall {0%{transform:translateY(0);}100%{transform:translateY(400px); opacity:0;}}
</style>
</head>
<body>

<!-- Logo -->
<div id="logoScreen">
<img src="assets/innovine-logo.png" alt="Innovine Logo" width="200">
</div>

<div id="gameContainer">
<div id="sentence"></div>
<div class="options" id="optionsContainer"></div>
<div id="feedback"></div>
<div id="tick">✔</div>
<button id="restartBtn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>
// --- Creative sentences for interactive learning ---
const sentences = [
  {text:"___ ___ ___ a giant sandcastle on the beach.", blanks:["subject","predicate","object"], options:["The kids","built","a giant sandcastle","She","painted","a picture","The cat","chased","the mouse"]},
  {text:"___ ___ ___ a delicious smoothie in the kitchen.", blanks:["subject","predicate","object"], options:["Mom","made","a delicious smoothie","Ali","wrote","a letter","The dog","barked","loudly"]},
  {text:"___ ___ ___ across the finish line in record time.", blanks:["subject","predicate","complement"], options:["The athlete","ran","fast","The teacher","explained","clearly","The sun","shines","brightly"]},
  {text:"___ ___ ___ for the surprise birthday party.", blanks:["subject","predicate","object"], options:["Sarah","prepared","a cake","He","solved","the puzzle","The team","won","the match"]},
  {text:"___ ___ ___ to help the lost kitten.", blanks:["subject","predicate","complement"], options:["The volunteers","ran","quickly","The students","studied","hard","The sun","rises","early"]},
  {text:"___ ___ ___ a note on the fridge.", blanks:["subject","predicate","object"], options:["Ali","pinned","a note","The bird","sang","a song","She","watched","TV"]},
  {text:"___ ___ ___ a funny story for the class.", blanks:["subject","predicate","object"], options:["The teacher","told","a funny story","He","ran","quickly","They","built","a house"]},
  {text:"___ ___ ___ very loudly during the play.", blanks:["subject","predicate","complement"], options:["The actor","spoke","clearly","She","painted","beautifully","The kids","jumped","high"]},
  {text:"___ ___ ___ a huge pile of homework.", blanks:["subject","predicate","object"], options:["The students","finished","a huge pile of homework","Mom","cooked","dinner","The dog","chased","the cat"]},
  {text:"___ ___ ___ the new software smoothly.", blanks:["subject","predicate","complement"], options:["The programmer","installed","the software","Ali","wrote","a letter","The team","won","easily"]}
];

let current=0;
const sentenceEl = document.getElementById("sentence");
const optionsContainer = document.getElementById("optionsContainer");
const feedback = document.getElementById("feedback");
const tick = document.getElementById("tick");
const restartBtn = document.getElementById("restartBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

// --- Show current sentence ---
function showSentence(){
  tick.style.display="none";
  feedback.textContent="";
  const s = sentences[current];
  let displayed = s.text;
  s.blanks.forEach(b=> displayed = displayed.replace("___","<span class='blank'>___</span>"));
  sentenceEl.innerHTML = displayed;

  // Show options
  optionsContainer.innerHTML="";
  const opts = s.options.sort(()=>Math.random()-0.5);
  opts.forEach(opt=>{
    const btn = document.createElement("div");
    btn.className="option";
    btn.textContent=opt;
    btn.onclick = ()=>checkAnswer(btn,opt,s);
    optionsContainer.appendChild(btn);
  });
}

// --- Check answer ---
function checkAnswer(btn,opt,sentence){
  const correctWords = sentence.options.slice(0,sentence.blanks.length);
  if(correctWords.includes(opt)){
    feedback.textContent="Good Job! 🎉";
    feedback.style.color="green";
    tick.style.display="block";
    correctSound.currentTime=0; correctSound.play();
    btn.remove();
    sentence.options = sentence.options.filter(w=>w!==opt);
    if(sentence.options.length <= sentence.options.length - sentence.blanks.length){
      setTimeout(nextSentence,800);
    }
  } else {
    feedback.textContent="Try Again! ❌";
    feedback.style.color="red";
    btn.classList.add("wiggle");
    wrongSound.currentTime=0; wrongSound.play();
    setTimeout(()=>btn.classList.remove("wiggle"),500);
  }
}

// --- Next sentence ---
function nextSentence(){
  current++;
  if(current>=sentences.length){
    feedback.textContent="🎉 You completed all sentences!";
    clapSound.currentTime=0; clapSound.play();
    restartBtn.style.display="block";
  } else showSentence();
}

// --- Confetti ---
function createConfetti(){
  for(let i=0;i<20;i++){
    const c=document.createElement("div");
    c.className="confetti-piece";
    c.style.left=Math.random()*window.innerWidth+"px";
    c.style.background=`hsl(${Math.random()*360},100%,50%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),1500);
  }
}

// --- Restart ---
restartBtn.onclick=()=>location.reload();

// --- Logo splash ---
setTimeout(()=>{
  document.getElementById("logoScreen").style.display="none";
  document.getElementById("gameContainer").style.display="block";
  showSentence();
},5000);
</script>

</body>
</html>
