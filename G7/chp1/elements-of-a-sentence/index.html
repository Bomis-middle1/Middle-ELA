
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentence Elements Adventure - Grade 7</title>
<style>
body { margin:0; font-family:Arial; background:#e8f5e9; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
#logoScreen,#instructionScreen,#gameContainer { width:100%; max-width:600px; text-align:center; padding:20px; position:absolute; top:0; left:0; }
#logoScreen { height:100%; display:flex; justify-content:center; align-items:center; background:white; z-index:100;}
#instructionScreen { display:none; background:#fff; border-radius:10px; box-shadow:0 0 10px #aaa; z-index:99;}
#gameContainer { display:none; background:#fff; border-radius:10px; box-shadow:0 0 10px #aaa; z-index:98;}
#sentence { font-size:18px; font-weight:bold; margin-bottom:15px; }
.blank { display:inline-block; width:160px; border-bottom:2px solid #000; margin:0 5px; font-weight:bold; cursor:pointer; min-height:24px; }
.options { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:15px; }
.option { background:#ffeb3b; padding:8px 12px; border-radius:5px; cursor:pointer; user-select:none; min-width:80px; text-align:center; }
.option.wiggle { animation: wiggle 0.5s; }
@keyframes wiggle {0%{transform:rotate(0deg);}25%{transform:rotate(-10deg);}50%{transform:rotate(10deg);}75%{transform:rotate(-10deg);}100%{transform:rotate(0deg);}}
#feedback { margin-top:10px; font-weight:bold; height:24px; }
#tick { display:none; font-size:30px; color:green; margin-top:10px; }
#restartBtn { display:none; margin-top:20px; padding:10px 20px; font-size:18px; cursor:pointer; background:#4caf50; color:white; border:none; border-radius:5px; }
.confetti-piece { position:absolute; width:8px; height:8px; border-radius:50%; top:0; animation: fall 2s linear forwards;}
@keyframes fall {0%{transform:translateY(0);}100%{transform:translateY(400px); opacity:0;}}
</style>
</head>
<body>

<!-- Logo Screen -->
<div id="logoScreen">
<img src="assets/innovine-logo.png" alt="Innovine Logo" width="200">
</div>

<!-- Instruction Screen -->
<div id="instructionScreen">
<h2>Welcome to Sentence Elements Adventure!</h2>
<p>In this game, you will identify parts of a sentence.</p>
<p>Click on the correct word for the blank: <b>subject, predicate, object, or complement</b>.</p>
<p>Correct answers show a green tick ✔, wrong answers wiggle ❌.</p>
<p>Complete all sentences to finish the game!</p>
</div>

<!-- Game Container -->
<div id="gameContainer">
<div id="sentence"></div>
<div class="options" id="optionsContainer"></div>
<div id="feedback"></div>
<div id="tick">✔</div>
<button id="restartBtn">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>
// --- Sentences and interactive questions ---
const sentences = [
  {text:"The little girl ___ happily to school.", ask:"subject", options:["The little girl","skipped happily","to school","Ali","ran fast"]},
  {text:"The dog barked ___ at the stranger.", ask:"predicate", options:["barked loudly","The dog","at the stranger","jumped high"]},
  {text:"Ali finished ___ before dinner.", ask:"object", options:["his homework","Ali","finished","before dinner"]},
  {text:"The sun shines ___ in the sky.", ask:"complement", options:["brightly","The sun","shines","in the sky"]},
  {text:"The students cheered ___ for the winning team.", ask:"subject", options:["The students","cheered","for the winning team","They"]},
  {text:"She painted ___ yesterday.", ask:"predicate", options:["painted a beautiful landscape","She","a beautiful landscape","yesterday"]},
  {text:"My father bought ___ last week.", ask:"object", options:["a new car","My father","bought","last week"]},
  {text:"The chef cooked ___ perfectly.", ask:"complement", options:["the meal","perfectly","The chef","cooked"]},
  {text:"Tom and Jerry ran ___ across the garden.", ask:"subject", options:["Tom and Jerry","ran","across the garden","quickly"]},
  {text:"The wind blew ___ all over the yard.", ask:"predicate", options:["blew the leaves","The wind","the leaves","all over the yard"]}
];

let current=0;
const sentenceEl = document.getElementById("sentence");
const optionsContainer = document.getElementById("optionsContainer");
const feedback = document.getElementById("feedback");
const tick = document.getElementById("tick");
const restartBtn = document.getElementById("restartBtn");
const correctSound=document.getElementById("correctSound");
const wrongSound=document.getElementById("wrongSound");
const clapSound=document.getElementById("clapSound");

// --- Show current sentence ---
function showSentence(){
  tick.style.display="none";
  feedback.textContent="";
  const s = sentences[current];
  // Highlight blank
  let displayed = s.text.replace("___","<span class='blank'>___</span>");
  sentenceEl.innerHTML = displayed;

  // Show options
  optionsContainer.innerHTML="";
  const opts = s.options.sort(()=>Math.random()-0.5);
  opts.forEach(opt=>{
    const btn = document.createElement("div");
    btn.className="option";
    btn.textContent=opt;
    btn.onclick = ()=>checkAnswer(btn,opt,s);
    optionsContainer.appendChild(btn);
  });
}

// --- Check answer ---
function checkAnswer(btn,opt,s){
  let correctWord;
  if(s.ask==="subject") correctWord = s.options[0];
  else if(s.ask==="predicate") correctWord = s.options[1];
  else if(s.ask==="object") correctWord = s.options[2];
  else if(s.ask==="complement") correctWord = s.options[3];

  if(opt===correctWord){
    feedback.textContent="Good Job! 🎉";
    feedback.style.color="green";
    tick.style.display="block";
    correctSound.currentTime=0; correctSound.play();
    setTimeout(nextSentence,800);
  } else {
    feedback.textContent="Try Again! ❌";
    feedback.style.color="red";
    btn.classList.add("wiggle");
    wrongSound.currentTime=0; wrongSound.play();
    setTimeout(()=>btn.classList.remove("wiggle"),500);
  }
}

// --- Next sentence ---
function nextSentence(){
  current++;
  if(current>=sentences.length){
    feedback.textContent="🎉 You completed all questions!";
    clapSound.currentTime=0; clapSound.play();
    restartBtn.style.display="block";
  } else showSentence();
}

// --- Restart ---
restartBtn.onclick=()=>location.reload();

// --- Logo and instruction splash ---
setTimeout(()=>{
  document.getElementById("logoScreen").style.display="none";
  document.getElementById("instructionScreen").style.display="block";

  setTimeout(()=>{
    document.getElementById("instructionScreen").style.display="none";
    document.getElementById("gameContainer").style.display="block";
    showSentence();
  },5000);

},5000);
</script>
</body>
</html>
