<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏰 Grammar Castle Adventure</title>

<style>
body{
margin:0;
font-family:Arial;
overflow:hidden;
background:linear-gradient(135deg,#0f172a,#1e293b,#0ea5e9);
color:white;
}

/* Floating castle background */
body::before, body::after{
content:"";
position:fixed;
border-radius:50%;
background:rgba(255,255,255,0.08);
animation:float 10s infinite alternate;
}

body::before{
width:300px;height:300px;left:-100px;top:-100px;
}
body::after{
width:250px;height:250px;right:-80px;bottom:-80px;
}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(60px);}
}

/* Screens */
.screen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}

.active{display:flex;}

/* Splash */
#splash{
background:white;
z-index:999;
}

#splash img{
width:220px;
animation:pulse 2s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

/* Topic */
#topic{
background:linear-gradient(135deg,#7c3aed,#2563eb);
}

#topic h1{
font-size:48px;
animation:glow 1s infinite alternate;
}

@keyframes glow{
from{text-shadow:0 0 10px white;}
to{text-shadow:0 0 25px yellow;}
}

/* Mission */
.card{
background:rgba(255,255,255,0.1);
backdrop-filter:blur(10px);
padding:30px;
border-radius:20px;
width:90%;
max-width:700px;
}

button{
padding:15px 30px;
border:none;
border-radius:20px;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

button:hover{transform:scale(1.05);}

/* Game */
#hud{
display:flex;
justify-content:space-between;
padding:10px;
font-weight:bold;
}

.progress{
height:10px;
background:#334155;
border-radius:20px;
overflow:hidden;
margin:10px;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#facc15);
transition:0.5s;
}

#roomCard{
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:20px;
width:92%;
max-width:850px;
}

.roomName{
font-size:22px;
margin-bottom:10px;
color:#facc15;
}

.question{
font-size:22px;
margin:20px 0;
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.option{
padding:15px;
background:white;
color:black;
border-radius:15px;
cursor:pointer;
transition:0.3s;
}

.option:hover{
background:#e2e8f0;
}

.correct{background:#22c55e !important;color:white;}
.wrong{background:#ef4444 !important;color:white;}

canvas{
position:fixed;
inset:0;
pointer-events:none;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<!-- SPLASH -->
<div id="splash" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- TOPIC -->
<div id="topic" class="screen">
<h1>🏰 Grammar Castle Adventure</h1>
<h3>Conquer all 10 Grammar Rooms!</h3>
</div>

<!-- MISSION -->
<div id="mission" class="screen">
<div class="card">
<h2>📜 Mission</h2>
<p>Welcome, Grammar Knight!</p>
<p>The Grammar Castle has 10 magical rooms.</p>
<p>Answer correctly to unlock the throne.</p>
<button onclick="startGame()">START ADVENTURE</button>
<br><br>
Volume:
<input type="range" id="vol" min="0" max="1" step="0.1" value="1">
</div>
</div>

<!-- GAME -->
<div id="game" class="screen">

<div id="hud">
<div id="room">🏰 Room 1/10</div>
<div id="score">⭐ 0</div>
</div>

<div class="progress"><div class="bar" id="bar"></div></div>

<div id="roomCard">
<div class="roomName" id="roomName"></div>
<div class="question" id="question"></div>
<div class="options" id="options"></div>
</div>

</div>

<!-- RESULT -->
<div id="result" class="screen">
<div class="card">
<h1>🏆 Castle Conquered!</h1>
<h2 id="final"></h2>
<button onclick="location.reload()">Play Again</button>
</div>
</div>

<audio id="correct" src="assets/correct.mp3"></audio>
<audio id="wrong" src="assets/wrong.mp3"></audio>
<audio id="clap" src="assets/clapping.mp3"></audio>

<script>

/* =========================
ROOM THEMES
========================= */
const rooms=[
"📚 Library",
"🛡 Knight Hall",
"🔥 Dragon Chamber",
"🌲 Enchanted Forest",
"💎 Treasure Vault",
"🕯 Wizard Tower",
"🏹 Archer Hall",
"⚔ Royal Arena",
"👑 King's Chamber",
"🏰 Royal Throne"
];

/* =========================
YOUR QUESTIONS (UNCHANGED LOGIC)
========================= */
let questions = [ /* YOUR EXISTING ARRAY WILL BE PASTED HERE */ ];

/* 🔥 demo safe fallback if empty */
if(questions.length===0){
questions=[
{
question:"Sample Question",
options:["A","B","C","D"],
answer:0
}
];
}

let index=0;
let score=0;

let order=[...Array(questions.length).keys()].sort(()=>Math.random()-0.5);

/* =========================
FLOW
========================= */
setTimeout(()=>{
document.getElementById("splash").classList.remove("active");
document.getElementById("topic").classList.add("active");
},5000);

setTimeout(()=>{
document.getElementById("topic").classList.remove("active");
document.getElementById("mission").classList.add("active");
},8000);

/* =========================
START GAME
========================= */
function startGame(){
document.getElementById("mission").classList.remove("active");
document.getElementById("game").classList.add("active");
loadQ();
}

/* =========================
LOAD QUESTION
========================= */
function loadQ(){

let q=questions[order[index]];

document.getElementById("room").innerText=`🏰 Room ${index+1}/10`;
document.getElementById("score").innerText=`⭐ ${score}`;
document.getElementById("roomName").innerText=rooms[index];
document.getElementById("question").innerHTML=q.question;

let opt=document.getElementById("options");
opt.innerHTML="";

q.options.forEach((o,i)=>{
let b=document.createElement("div");
b.className="option";
b.innerText=o;

b.onclick=()=>check(i,b,q.answer);

opt.appendChild(b);
});
}

/* =========================
CHECK
========================= */
function check(i,b,ans){

let all=document.querySelectorAll(".option");
all.forEach(x=>x.style.pointerEvents="none");

let vol=document.getElementById("vol").value;
correct.volume=vol;
wrong.volume=vol;
clap.volume=vol;

if(i===ans){
b.classList.add("correct");
correct.play();
score++;
launch();
}
else{
b.classList.add("wrong");
all[ans].classList.add("correct");
wrong.play();
}

setTimeout(()=>{
index++;
if(index<questions.length) loadQ();
else endGame();
},1200);
}

/* =========================
CONFETTI
========================= */
function launch(){
let c=document.getElementById("confetti");
let ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

for(let i=0;i<120;i++){
ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
ctx.fillRect(Math.random()*c.width,Math.random()*c.height,6,6);
}
}

/* =========================
END
========================= */
function endGame(){
document.getElementById("game").classList.remove("active");
document.getElementById("result").classList.add("active");

document.getElementById("final").innerText=`⭐ ${score}/${questions.length}`;

clap.play();
}

</script>

</body>
</html>
