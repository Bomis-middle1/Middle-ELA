<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏰 Grammar Castle Adventure</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:linear-gradient(135deg,#0b1220,#1e293b,#0ea5e9);
color:white;
}

/* FLOATING BACKGROUND */
body::before,body::after{
content:"";
position:fixed;
border-radius:50%;
background:rgba(255,255,255,0.06);
animation:float 10s infinite alternate;
}
body::before{width:300px;height:300px;left:-120px;top:-120px;}
body::after{width:240px;height:240px;right:-100px;bottom:-100px;}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(60px);}
}

/* SCREEN SYSTEM */
.screen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}
.active{display:flex;}

/* SPLASH */
#splash{
background:white;
z-index:999;
}
#splash img{
width:220px;
animation:pulse 2s infinite alternate;
}
@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.08);}
}

/* TOPIC */
#topic{
background:linear-gradient(135deg,#6d28d9,#2563eb);
}
#topic h1{
font-size:46px;
animation:glow 1s infinite alternate;
}
@keyframes glow{
from{text-shadow:0 0 10px white;}
to{text-shadow:0 0 25px gold;}
}

/* MISSION */
.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:24px;
border-radius:18px;
width:92%;
max-width:720px;
}

/* BUTTON */
button{
padding:14px 24px;
border:none;
border-radius:14px;
font-size:18px;
cursor:pointer;
transition:0.3s;
}
button:hover{transform:scale(1.05);}

/* GAME WRAPPER FIX (THIS WAS MISSING) */
.gameWrapper{
width:100%;
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
}

/* HUD FIX */
#hud{
display:flex;
justify-content:space-between;
width:100%;
max-width:900px;
font-weight:bold;
padding:0 10px;
}

/* PROGRESS */
.barOuter{
width:100%;
max-width:900px;
height:10px;
background:#334155;
border-radius:20px;
overflow:hidden;
}
.barInner{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#facc15);
transition:0.4s;
}

/* GAME CARD FIX (IMPORTANT) */
#roomCard{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:20px;
border-radius:18px;
width:92%;
max-width:720px;

display:flex;
flex-direction:column;
align-items:center;
}

/* ROOM NAME */
#roomName{
font-size:20px;
color:#facc15;
margin-bottom:8px;
}

/* QUESTION FIX */
#question{
font-size:22px;
margin:14px 0;
line-height:1.4;
}

/* OPTIONS FIX (THIS FIXES YOUR SCREEN ISSUE) */
#options{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
width:100%;
}

.option{
background:white;
color:black;
padding:14px;
border-radius:12px;
cursor:pointer;
transition:0.2s;
text-align:center;
}

.option:hover{transform:scale(1.03);}

.correct{background:#22c55e!important;color:white;}
.wrong{background:#ef4444!important;color:white;}

/* MOBILE FIX */
@media(max-width:768px){
#options{grid-template-columns:1fr;}
}

/* CONFETTI */
canvas{
position:fixed;
inset:0;
pointer-events:none;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<!-- SPLASH -->
<div id="splash" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- TOPIC -->
<div id="topic" class="screen">
<h1>🏰 Grammar Castle Adventure</h1>
<p>Conquer all 10 Grammar Rooms!</p>
</div>

<!-- MISSION -->
<div id="mission" class="screen">
<div class="card">
<h2>📜 Mission</h2>
<p>Welcome, Grammar Knight!</p>
<p>10 enchanted rooms await you.</p>
<p>Answer correctly to unlock the castle.</p>

<br>
<button onclick="startGame()">START ADVENTURE</button>
</div>
</div>

<!-- GAME -->
<div id="game" class="screen">

<div class="gameWrapper">

<div id="hud">
<div id="roomText">🏰 Room 1/10</div>
<div id="scoreText">⭐ 0</div>
</div>

<div class="barOuter">
<div class="barInner" id="bar"></div>
</div>

<div id="roomCard">
<div id="roomName"></div>
<div id="question"></div>
<div id="options"></div>
</div>

</div>

</div>

<!-- RESULT -->
<div id="result" class="screen">
<div class="card">
<h1>🏆 Castle Conquered!</h1>
<h2 id="finalScore"></h2>
<button onclick="location.reload()">Play Again</button>
</div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

/* STATE */
let index=0;
let score=0;
let attempts=0;
let order=[];

/* QUESTIONS PLACEHOLDER (YOU KEEP YOUR ORIGINAL) */
let questions=window.questions||[];

/* SHUFFLE */
function shuffle(a){
return a.sort(()=>Math.random()-0.5);
}

/* FLOW */
setTimeout(()=>{
splash.classList.remove("active");
topic.classList.add("active");
},5000);

setTimeout(()=>{
topic.classList.remove("active");
mission.classList.add("active");
},8000);

/* START */
function startGame(){
mission.classList.remove("active");
game.classList.add("active");

index=0;
score=0;
attempts=0;

order=[...Array(questions.length).keys()];
shuffle(order);

loadQ();
}

/* LOAD */
function loadQ(){

attempts=0;

let q=questions[order[index]];

roomText.innerText=`🏰 Room ${index+1}/10`;
scoreText.innerText=`⭐ ${score}`;
roomName.innerText="🏰 Castle Challenge";
question.innerHTML=q.question;

options.innerHTML="";

q.options.forEach((o,i)=>{
let b=document.createElement("div");
b.className="option";
b.innerText=o;
b.onclick=()=>check(i,b,q.answer);
options.appendChild(b);
});

updateBar();
}

/* CHECK */
function check(i,b,ans){

let all=document.querySelectorAll(".option");
all.forEach(x=>x.style.pointerEvents="none");

correctSound.volume=wrongSound.volume=clapSound.volume=1;

if(i===ans){
b.classList.add("correct");
correctSound.play();
score++;
launch();
setTimeout(next,1200);
}else{
b.classList.add("wrong");
wrongSound.play();
all[ans].classList.add("correct");

attempts++;

if(attempts>=2){
setTimeout(next,1200);
}else{
setTimeout(()=>all.forEach(x=>x.style.pointerEvents="auto"),600);
}
}
scoreText.innerText=`⭐ ${score}`;
}

/* NEXT */
function next(){
index++;
if(index<questions.length) loadQ();
else endGame();
}

/* BAR */
function updateBar(){
bar.style.width=((index/questions.length)*100)+"%";
}

/* CONFETTI */
function launch(){
let c=document.getElementById("confetti");
let ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

for(let i=0;i<120;i++){
ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
ctx.fillRect(Math.random()*c.width,Math.random()*c.height,6,6);
}
}

/* END */
function endGame(){
game.classList.remove("active");
result.classList.add("active");
finalScore.innerText=`⭐ ${score}/${questions.length}`;
clapSound.play();
}

/* ENTER KEY */
document.addEventListener("keydown",e=>{
if(e.key==="Enter" && mission.classList.contains("active")){
startGame();
}
});

</script>

</body>
</html>
