<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modals Card Flip Game</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#140f3d;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;height:100vh;}
h1{color:#ffd60a;}
.card-container{display:grid;grid-template-columns:repeat(4,100px);grid-gap:15px;margin:20px;}
.card{width:100px;height:140px;background:#fff4d6;color:#2d2340;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;cursor:pointer;user-select:none;position:relative;transform-style:preserve-3d;transition:transform 0.5s;}
.card.flipped{transform:rotateY(180deg);}
.card .front,.card .back{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;border-radius:12px;}
.card .front{background:#d8f3dc;}
.card .back{background:#52b788;color:#fff;transform:rotateY(180deg);}
.card.matched{visibility:hidden;}
.card .optionText{padding:5px;text-align:center;}
#mcqBox{background:#fff4d6;color:#2d2340;padding:15px;border-radius:15px;max-width:400px;text-align:center;display:none;margin-top:15px;}
button{padding:8px 12px;margin:5px;border-radius:12px;border:none;background:#ffb703;color:#2d2340;font-weight:bold;cursor:pointer;}
.correct{background:#b7efc5;}
.wrong{background:#ffccd5;}
.feedback{min-height:25px;margin-top:8px;font-weight:bold;}
#endScreen{display:none;text-align:center;margin-top:20px;}
</style>
</head>
<body>

<h1>Modals Card Flip Game</h1>
<div class="card-container" id="cardContainer"></div>

<div id="mcqBox">
  <div id="questionText"></div>
  <div id="optionsBox"></div>
  <div class="feedback" id="feedback"></div>
  <button onclick="closeMCQ()">Continue</button>
</div>

<div id="endScreen">
  <h2>Well Done!</h2>
  <p id="finalScore"></p>
  <button onclick="restartGame()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<script>
// Modals MCQs
const mcqs=[
  {q:"You ___ complete your homework before dinner.",opts:["must","might","may"],ans:"must"},
  {q:"She said she ___ help us with the project tomorrow.",opts:["can","could","shall"],ans:"could"},
  {q:"It ___ rain later, so take an umbrella.",opts:["may","would","must"],ans:"may"},
  {q:"You ___ not enter the lab without safety glasses.",opts:["needn’t","must","could"],ans:"must"},
  {q:"I ___ like to join you for the movie.",opts:["would","can","shall"],ans:"would"},
  {q:"We ___ finish the work on time if we start now.",opts:["shall","will","might"],ans:"will"},
  {q:"He ___ be at the library; I’m not sure.",opts:["might","should","must"],ans:"might"},
  {q:"You ___ practice more to improve your score.",opts:["should","can","would"],ans:"should"},
  {q:"She said I ___ go if I wanted.",opts:["might","needn’t","ought to"],ans:"might"},
  {q:"You ___ eat too much sugar; it’s not healthy.",opts:["must","needn’t","could"],ans:"needn’t"}
];

let currentMCQ=0;
let score=0;

// Card flip game setup
const cardContainer=document.getElementById('cardContainer');
let flippedCards=[];
let totalPairs=10; // one card per MCQ for simplicity

function initCards(){
  cardContainer.innerHTML='';
  for(let i=0;i<totalPairs;i++){
    const card=document.createElement('div');
    card.className='card';
    card.innerHTML=`
      <div class="front">Card ${i+1}</div>
      <div class="back">Tap me</div>
    `;
    card.onclick=()=>flipCard(card,i);
    cardContainer.appendChild(card);
  }
}

function flipCard(card,index){
  if(card.classList.contains('flipped')||card.classList.contains('matched')) return;
  card.classList.add('flipped');
  flippedCards.push(card);
  if(flippedCards.length===1){
    // show MCQ
    showMCQ();
  }
}

function showMCQ(){
  const box=document.getElementById('mcqBox');
  box.style.display='block';
  const q=mcqs[currentMCQ];
  document.getElementById('questionText').innerText=q.q;
  const optionsBox=document.getElementById('optionsBox');
  optionsBox.innerHTML='';
  q.opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.innerText=opt;
    btn.onclick=()=>checkMCQ(opt,btn);
    optionsBox.appendChild(btn);
  });
  document.getElementById('feedback').innerText='';
}

function checkMCQ(selected,btn){
  const q=mcqs[currentMCQ];
  const buttons=document.querySelectorAll('#optionsBox button');
  buttons.forEach(b=>b.disabled=true);
  if(selected===q.ans){
    btn.classList.add('correct');
    document.getElementById('feedback').innerText='Correct!';
    document.getElementById('correctSound').play();
    score++;
    // mark the flipped card as matched
    flippedCards.forEach(c=>c.classList.add('matched'));
  } else{
    btn.classList.add('wrong');
    document.getElementById('feedback').innerText='Wrong! Correct: '+q.ans;
    document.getElementById('wrongSound').play();
    flippedCards.forEach(c=>c.classList.remove('flipped'));
  }
}

function closeMCQ(){
  document.getElementById('mcqBox').style.display='none';
  flippedCards=[];
  currentMCQ++;
  if(currentMCQ>=mcqs.length){
    document.getElementById('cardContainer').style.display='none';
    document.getElementById('endScreen').style.display='block';
    document.getElementById('finalScore').innerText=`Score: ${score} / ${mcqs.length}`;
    document.getElementById('clapSound').play();
  }
}

function restartGame(){
  currentMCQ=0;
  score=0;
  document.getElementById('cardContainer').style.display='grid';
  document.getElementById('endScreen').style.display='none';
  initCards();
}

// initialize game
initCards();
</script>
</body>
</html>
