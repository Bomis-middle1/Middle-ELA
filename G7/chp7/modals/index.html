<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Guardians of Grammar - Modals Challenge</title>

<style>
/* ==========================================================================
   GLOBAL RESET ENGINE & MOBILE SAFEGUARDS
   ========================================================================== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

body {
    margin: 0;
    background: #140f3d;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100svh;
    width: 100vw;
    overflow: hidden;
}

/* SCREEN TOGGLE ENGINE */
.screen {
    display: none;
    width: 100vw;
    height: 100vh;
    height: 100svh;
    position: fixed;
    inset: 0;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}
.screen.active { display: flex; }

/* STAGE 1: LOGO SCREEN (5s SPLASH) */
#logoScreen { 
    background: #ffffff; 
    z-index: 9999; 
    transition: opacity 0.5s ease;
}
.logo-container { width: 320px; max-width: 80%; }
.logo-container img { width: 100%; height: auto; display: block; }
.logo-fallback { font-size: 32px; font-weight: 900; color: #140f3d; letter-spacing: 2px; }

/* STAGE 2: TITLE SCREEN */
#titleScreen {
    background: radial-gradient(circle at center, #2e1065 0%, #0f052d 100%);
    z-index: 9000;
}
.topic {
    font-size: 36px;
    font-weight: 900;
    color: #ffd60a;
    text-shadow: 0 4px 15px rgba(255, 214, 10, 0.4);
    line-height: 1.3;
}

/* STAGE 3 & 5: CARD PANELS */
.card-panel {
    background: rgba(255, 255, 255, 0.96);
    color: #2d2340;
    border-radius: 24px;
    padding: 30px 24px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    max-width: 480px;
    width: 100%;
}

/* STAGE 4: MAIN PLAYGROUND */
.game-layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 600px;
    height: 90%;
    position: relative;
}

.hud-panel {
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 12px 20px;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
}

.card-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    width: 100%;
    margin: auto 0;
}

.game-card {
    aspect-ratio: 2/3;
    background: #fff4d6;
    color: #2d2340;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-weight: 800;
    font-size: 16px;
    border: none;
    border-bottom: 4px solid #e0a912;
    transition: all 0.2s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.game-card.matched {
    opacity: 0.15;
    pointer-events: none;
    border-bottom-color: transparent;
    background: rgba(255,255,255,0.2);
}

/* OVERLAY MCQ MODAL BOX */
#mcqBox {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #ffffff;
    color: #2d2340;
    padding: 24px;
    border-radius: 20px;
    width: 90%;
    max-width: 480px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    display: none;
    z-index: 500;
}

#questionText { 
    font-size: 16px; 
    font-weight: 700; 
    margin-bottom: 15px; 
    line-height: 1.45; 
    text-align: left; 
}

.options-grid { 
    display: flex; 
    flex-direction: column; 
    gap: 10px; 
    margin-bottom: 12px; 
}

button {
    padding: 14px 20px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #ffb703, #fb8500);
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

.option-btn {
    background: #f0ecfa;
    color: #2d2340;
    border-bottom: 3px solid #cfc7e8;
    text-align: left;
}
.option-btn.correct { background: #b7efc5 !important; border-color: #74c69d !important; color: #1b4332; }
.option-btn.wrong { background: #ffccd5 !important; border-color: #ff85a1 !important; color: #5c0d12; }

.hint-banner { font-size: 14px; font-weight: bold; color: #d90429; min-height: 20px; margin-bottom: 10px; }

canvas { position: fixed; inset: 0; pointer-events: none; z-index: 99999; }

@media (max-width: 480px) {
    .card-container { grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .game-card { font-size: 12px; }
}
</style>
</head>

<body>

<canvas id="confettiCanvas"></canvas>

<!-- AUDIO ASSETS FROM REPOSITORY -->
<audio id="correctSound" src="assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="assets/clapping.mp3" preload="auto"></audio>

<!-- STAGE 1: LOGO SPLASH (5 SECONDS) -->
<div id="logoScreen" class="screen active">
    <div class="logo-container">
        <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='block';">
        <div id="logoFallback" class="logo-fallback" style="display:none;">INNOVINE</div>
    </div>
</div>

<!-- STAGE 2: TITLE -->
<div id="titleScreen" class="screen">
    <div class="topic">✨ Guardians of Grammar: Modals ✨</div>
</div>

<!-- STAGE 3: INSTRUCTIONS -->
<div id="startScreen" class="screen">
    <div class="card-panel">
        <h1>Welcome Competitor!</h1>
        <p style="color: #5c5470; margin: 15px 0 20px 0; font-size: 15px; line-height: 1.5;">
            Flip any modal card to reveal exercise challenges directly from Chapter 7. Select the correct modal verb to clear each card!
        </p>
        <button onclick="transitionToGame()">Launch Challenge</button>
    </div>
</div>

<!-- STAGE 4: GAMEPLAY -->
<div id="gameScreen" class="screen">
    <div class="game-layout">
        <div class="hud-panel">
            <div>PROGRESS: <span id="progressHUD">0 / 10</span></div>
            <div>SCORE: <span id="scoreHUD">0</span></div>
        </div>

        <div class="card-container" id="cardContainer"></div>

        <div id="mcqBox">
            <div id="questionText">Loading query...</div>
            <div class="options-grid" id="optionsBox"></div>
            <div class="hint-banner" id="hintBanner"></div>
            <button id="continueBtn" style="width:100%; display:none;" onclick="closeMCQEngine()">Continue</button>
        </div>
    </div>
</div>

<!-- STAGE 5: SUMMARY -->
<div id="endScreen" class="screen">
    <div class="card-panel">
        <div style="font-size: 64px; margin-bottom: 10px;">🏆</div>
        <h2>Chapter Mastery Achieved!</h2>
        <p id="finalScore" style="font-size: 18px; font-weight: 700; margin: 15px 0; color: #2d2340;"></p>
        <button onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
/* QUESTION BANK DIRECTLY MATCHING GRADE 7 TEXTBOOK CHAPTER EXERCISES */
const mcqs = [
    {
        q: "Despite the heavy rain, we ___ still see the stars shining brightly.",
        opts: ["can", "could"],
        ans: "could"
    },
    {
        q: "Last summer, I ___ ride a bike without any help from my parents.",
        opts: ["can", "could"],
        ans: "could"
    },
    {
        q: "She ___ remember the lyrics to her favourite song, no matter how hard she tried.",
        opts: ["can't", "couldn't"],
        ans: "couldn't"
    },
    {
        q: "___ you possibly finish all your homework before dinner time?",
        opts: ["Can", "Could"],
        ans: "Could"
    },
    {
        q: "Because of the fog, we ___ barely make out the shape of the house in the distance.",
        opts: ["can", "could"],
        ans: "could"
    },
    {
        q: "Samantha ___ submit her science project by next Monday, or she will lose significant marks. (Mood: Obligation/Duty)",
        opts: ["may", "should"],
        ans: "should"
    },
    {
        q: "Jack and Emily ___ join us for the field trip if they receive permission from their parents in time. (Mood: Possibility/Uncertainty)",
        opts: ["might", "can"],
        ans: "might"
    },
    {
        q: "Alex ___ have forgotten his notebook at home, which is why he can't find it in his backpack. (Mood: Logical Deduction/Certainty)",
        opts: ["could", "must"],
        ans: "must"
    },
    {
        q: "You ___ read the instructions carefully before starting the experiment to avoid any mistakes. (Mood: Advice/Advisability)",
        opts: ["should", "can"],
        ans: "should"
    },
    {
        q: "Olivia and Ryan ___ complete their assignments quietly during study hall, or they will be given extra homework. (Mood: Compulsion/Strong Obligation)",
        opts: ["must", "might"],
        ans: "must"
    }
];

let gameData = [], selectedIndex = null, score = 0, completedCount = 0, attempts = 0;
let audioUnlocked = false;

const audioChannels = {
    correct: document.getElementById("correctSound"),
    wrong: document.getElementById("wrongSound"),
    clap: document.getElementById("clapSound")
};

// UNLOCK AUDIO CONTEXT ON FIRST USER INTERACTION (BROWSER AUTOPLAY FIX)
function unlockAudio() {
    if (audioUnlocked) return;
    Object.values(audioChannels).forEach(audio => {
        if (audio) {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(() => {});
        }
    });
    audioUnlocked = true;
    window.removeEventListener('pointerdown', unlockAudio);
}
window.addEventListener('pointerdown', unlockAudio);

// SEQUENCE TIMING CONTROL
window.onload = () => {
    // Stage 1: Innovine Logo Splash Screen for exactly 5000ms (5 seconds)
    setTimeout(() => {
        document.getElementById("logoScreen").classList.remove("active");
        document.getElementById("titleScreen").classList.add("active");
        
        // Stage 2: Title Display Screen for 3000ms
        setTimeout(() => {
            document.getElementById("titleScreen").classList.remove("active");
            document.getElementById("startScreen").classList.add("active");
        }, 3000);

    }, 5000);
};

function dispatchAudio(key) {
    const track = audioChannels[key];
    if (track) {
        track.currentTime = 0;
        track.play().catch(() => synthBeep(key === 'correct' || key === 'clap'));
    }
}

// FALLBACK SYNTHESIZER FOR BLOCKED OR MISSING MP3 FILES
function synthBeep(isGood) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = isGood ? 587 : 220;
        gain.gain.value = 0.1;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
    } catch(e) {}
}

function transitionToGame() {
    document.getElementById("startScreen").classList.remove("active");
    document.getElementById("gameScreen").classList.add("active");
    restartGame();
}

function restartGame() {
    document.getElementById("endScreen").classList.remove("active");
    gameData = [...mcqs].sort(() => Math.random() - 0.5).map((q, idx) => ({ ...q, solved: false, id: idx }));
    score = 0;
    completedCount = 0;
    updateHUD();
    buildCardGrid();
}

function buildCardGrid() {
    const container = document.getElementById("cardContainer");
    container.innerHTML = "";
    gameData.forEach((item, index) => {
        let card = document.createElement("button");
        card.className = "game-card" + (item.solved ? " matched" : "");
        card.innerText = item.solved ? "✓" : `Card ${index + 1}`;
        card.onclick = () => openQuestion(index);
        container.appendChild(card);
    });
}

function updateHUD() {
    document.getElementById("progressHUD").innerText = `${completedCount} / ${gameData.length}`;
    document.getElementById("scoreHUD").innerText = score;
}

function openQuestion(index) {
    if (gameData[index].solved) return;
    selectedIndex = index;
    attempts = 0;
    
    const qData = gameData[index];
    document.getElementById("questionText").innerText = qData.q;
    document.getElementById("hintBanner").innerText = "";
    document.getElementById("continueBtn").style.display = "none";
    
    const box = document.getElementById("optionsBox");
    box.innerHTML = "";
    qData.opts.forEach(opt => {
        let btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(opt, btn);
        box.appendChild(btn);
    });
    
    document.getElementById("mcqBox").style.display = "block";
}

function checkAnswer(chosen, btn) {
    const qData = gameData[selectedIndex];
    const allBtns = document.querySelectorAll("#optionsBox .option-btn");
    
    if (chosen === qData.ans) {
        btn.classList.add("correct");
        allBtns.forEach(b => b.disabled = true);
        score++;
        dispatchAudio("correct");
        triggerConfetti();
        document.getElementById("continueBtn").style.display = "block";
    } else {
        attempts++;
        btn.classList.add("wrong");
        btn.disabled = true;
        dispatchAudio("wrong");
        
        if (attempts >= 2) {
            allBtns.forEach(b => {
                b.disabled = true;
                if (b.innerText === qData.ans) b.classList.add("correct");
            });
            document.getElementById("hintBanner").innerText = `Correct answer: ${qData.ans}`;
            document.getElementById("continueBtn").style.display = "block";
        } else {
            document.getElementById("hintBanner").innerText = "❌ Incorrect option. Try again!";
        }
    }
}

function closeMCQEngine() {
    document.getElementById("mcqBox").style.display = "none";
    gameData[selectedIndex].solved = true;
    completedCount++;
    updateHUD();
    buildCardGrid();
    
    if (completedCount >= gameData.length) {
        setTimeout(() => {
            document.getElementById("gameScreen").classList.remove("active");
            document.getElementById("endScreen").classList.add("active");
            document.getElementById("finalScore").innerText = `Final Score: ${score} / ${gameData.length}`;
            dispatchAudio("clap");
        }, 500);
    }
}

/* CONFETTI RENDERING ENGINE */
const canvas = document.getElementById("confettiCanvas");
const ctx = canvas.getContext("2d");
function triggerConfetti() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let pieces = Array.from({length: 40}, () => ({
        x: Math.random() * canvas.width,
        y: -10,
        w: 8, h: 8,
        ys: Math.random() * 4 + 2,
        color: ["#ffb703","#fb8500","#ffd60a","#2196f3"][Math.floor(Math.random()*4)]
    }));
    let frames = 0;
    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
            p.y += p.ys;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.w, p.h);
        });
        if (++frames < 60) requestAnimationFrame(loop);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    loop();
}
</script>

</body>
</html>
