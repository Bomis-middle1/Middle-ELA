<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjective Arena Championship</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#1f1c5c,#4b2c82,#ffb347);
  min-height:100vh;
  overflow:hidden;
  color:#fff;
}
.screen{
  display:none;
  width:100vw;
  height:100vh;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:18px;
  position:relative;
}
.active{display:flex}

.logo{
  width:60%;
  max-width:280px;
  animation:pulse 1.5s infinite alternate;
}
@keyframes pulse{
  from{transform:scale(1)}
  to{transform:scale(1.06)}
}

.card{
  width:95%;
  max-width:950px;
  background:#ffffffee;
  color:#2d2340;
  border-radius:30px;
  padding:22px;
  box-shadow:0 10px 30px #00000055;
  position:relative;
  z-index:2;
}

h1{
  font-size:40px;
  margin:8px 0;
  color:#5a189a;
}
h2{
  font-size:25px;
  margin:8px 0;
  color:#3c096c;
}
p{
  font-size:18px;
  line-height:1.5;
}

button{
  border:none;
  border-radius:18px;
  padding:14px 25px;
  margin:10px;
  font-size:18px;
  font-weight:bold;
  background:#ffb703;
  color:#2d2340;
  cursor:pointer;
  box-shadow:0 5px 0 #d88900;
}
button:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #d88900;
}

.arena{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0 15px;
}
.player,.boss{
  width:120px;
  height:120px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  background:linear-gradient(135deg,#caf0f8,#ffd6ff);
  border:5px solid #fff;
  box-shadow:0 6px 18px #00000033;
}
.player.win{
  animation:jump .5s;
}
.boss.hit{
  animation:hit .4s;
}
@keyframes jump{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-25px)}
}
@keyframes hit{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-12px)}
  75%{transform:translateX(12px)}
}

.vs{
  font-size:35px;
  font-weight:bold;
  color:#e63946;
}

.topbar{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:10px;
}
.badge{
  background:#edf6f9;
  color:#2d2340;
  padding:9px 14px;
  border-radius:18px;
  font-weight:bold;
  font-size:15px;
}

.healthOuter,.progressOuter{
  width:100%;
  height:18px;
  background:#ddd;
  border-radius:30px;
  overflow:hidden;
  margin:10px 0;
}
.healthInner{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#ef233c,#ffb703);
}
.progressInner{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#80ed99,#38b000);
}

.questionBox{
  background:#fff4d6;
  border:3px dashed #ffb703;
  border-radius:22px;
  padding:15px;
  margin:12px 0;
}
.question{
  font-size:23px;
  font-weight:bold;
}
.sentence{
  font-size:21px;
  margin-top:8px;
  color:#4a3b3b;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:16px;
}
.option{
  background:#e0c3fc;
  border:3px solid #9d4edd;
  border-radius:18px;
  padding:15px;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}
.option:hover{
  transform:scale(1.03);
}
.correct{
  background:#b7efc5!important;
  border-color:#2d6a4f!important;
}
.wrong{
  background:#ffccd5!important;
  border-color:#d90429!important;
  animation:shake .3s;
}
.glow{
  animation:glow 1s infinite alternate;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}
@keyframes glow{
  from{box-shadow:0 0 8px #2d6a4f}
  to{box-shadow:0 0 24px #2d6a4f}
}

.feedback{
  min-height:30px;
  font-size:21px;
  font-weight:bold;
  margin-top:10px;
}

.trophy{
  font-size:90px;
  animation:trophyBounce 1s infinite alternate;
}
@keyframes trophyBounce{
  from{transform:translateY(0) rotate(-3deg)}
  to{transform:translateY(-14px) rotate(3deg)}
}

.confetti,.sparkle,.streamer{
  position:fixed;
  z-index:1;
  pointer-events:none;
}
.confetti{
  width:10px;
  height:10px;
  top:-20px;
  animation:fall 3.2s linear forwards;
}
@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}
.sparkle{
  font-size:28px;
  animation:spark 1s ease-out forwards;
}
@keyframes spark{
  from{transform:scale(.5);opacity:1}
  to{transform:scale(2) translateY(-60px);opacity:0}
}
.streamer{
  width:8px;
  height:70px;
  border-radius:20px;
  top:-80px;
  animation:streamFall 4s linear forwards;
}
@keyframes streamFall{
  to{
    transform:translateY(115vh) rotate(360deg);
    opacity:0;
  }
}

.levelFlash{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#ffb703;
  color:#2d2340;
  font-size:22px;
  font-weight:bold;
  padding:14px 25px;
  border-radius:25px;
  z-index:10;
  animation:flash 1.2s forwards;
}
@keyframes flash{
  0%{opacity:0;transform:translateX(-50%) scale(.8)}
  30%{opacity:1;transform:translateX(-50%) scale(1.05)}
  100%{opacity:0;transform:translateX(-50%) scale(1)}
}

@media(max-width:650px){
  h1{font-size:30px}
  h2{font-size:21px}
  .arena{margin:5px 0}
  .player,.boss{
    width:82px;
    height:82px;
    font-size:42px;
  }
  .vs{font-size:26px}
  .question{font-size:19px}
  .sentence{font-size:18px}
  .options{grid-template-columns:1fr}
  .option{font-size:17px;padding:13px}
  .card{padding:16px}
}
</style>
</head>

<body>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<div id="splash" class="screen active">
  <img src="assets/innovine-logo.png" class="logo" alt="Innovine Logo">
</div>

<div id="startScreen" class="screen">
  <div class="card">
    <h1>Adjective Arena Championship</h1>
    <p>Enter the grammar arena and defeat the Adjective Boss!</p>
    <p>Read each sentence carefully. Choose the correct answer. You get <b>2 chances</b> for every challenge.</p>
    <button onclick="startGame()">Enter Arena</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge" id="levelText">Level 1</div>
      <div class="badge" id="scoreText">Score: 0</div>
      <div class="badge" id="attemptText">Chances: 2</div>
    </div>

    <div class="progressOuter">
      <div class="progressInner" id="progressBar"></div>
    </div>

    <div class="arena">
      <div class="player" id="player">🧑‍🎓</div>
      <div class="vs">VS</div>
      <div class="boss" id="boss">👹</div>
    </div>

    <div class="healthOuter">
      <div class="healthInner" id="bossHealth"></div>
    </div>

    <h2 id="typeTitle"></h2>

    <div class="questionBox">
      <div class="question" id="questionText"></div>
      <div class="sentence" id="sentenceText"></div>
    </div>

    <div class="options" id="optionsBox"></div>

    <div class="feedback" id="feedback"></div>
    <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next Challenge</button>
  </div>
</div>

<div id="endScreen" class="screen">
  <div class="card">
    <div class="trophy">🏆</div>
    <h1>Victory!</h1>
    <h2>You are the Grammar Champion!</h2>
    <p id="finalScore"></p>
    <button onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
const questions = [
  {
    type:"Level 1: Quality Adjectives",
    question:"Identify the adjective of quality.",
    sentence:"The ancient temple stood silently beside the river.",
    options:["ancient","temple","silently","river"],
    answer:"ancient"
  },
  {
    type:"Level 2: Quantity Adjectives",
    question:"Which word shows an indefinite quantity?",
    sentence:"Several students submitted their projects before the deadline.",
    options:["students","several","submitted","deadline"],
    answer:"several"
  },
  {
    type:"Level 3: Number Adjectives",
    question:"Which word shows a definite number?",
    sentence:"The committee selected three representatives for the event.",
    options:["committee","selected","three","event"],
    answer:"three"
  },
  {
    type:"Level 4: Demonstrative Adjectives",
    question:"Which word points out a specific noun?",
    sentence:"Those paintings were created by local artists.",
    options:["those","paintings","created","local"],
    answer:"those"
  },
  {
    type:"Level 5: Interrogative Adjectives",
    question:"Which word asks a question about a noun?",
    sentence:"Whose notebook was left in the laboratory?",
    options:["whose","left","laboratory","notebook"],
    answer:"whose"
  },
  {
    type:"Level 6: Possessive Adjectives",
    question:"Which word shows ownership?",
    sentence:"Their performance impressed the entire audience.",
    options:["their","performance","entire","audience"],
    answer:"their"
  },
  {
    type:"Level 7: Proper Adjectives",
    question:"Which adjective is formed from a proper noun?",
    sentence:"The Japanese garden attracted many visitors.",
    options:["garden","Japanese","many","visitors"],
    answer:"Japanese"
  },
  {
    type:"Level 8: Distributive Adjectives",
    question:"Which word refers to members of a group individually?",
    sentence:"Every participant received a certificate after the workshop.",
    options:["participant","certificate","every","workshop"],
    answer:"every"
  },
  {
    type:"Level 9: Emphasising Adjectives",
    question:"Which word gives special emphasis to the noun?",
    sentence:"The principal herself appreciated the students.",
    options:["principal","herself","appreciated","students"],
    answer:"herself"
  },
  {
    type:"Final Level: Mixed Challenge",
    question:"What type of adjective is the word 'Indian'?",
    sentence:"Indian classical music has a rich history.",
    options:["Quality Adjective","Proper Adjective","Possessive Adjective","Distributive Adjective"],
    answer:"Proper Adjective"
  }
];

let current = 0;
let score = 0;
let chances = 2;
let locked = false;

const splash = document.getElementById("splash");
const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const endScreen = document.getElementById("endScreen");

setTimeout(()=>{
  splash.classList.remove("active");
  startScreen.classList.add("active");
},2000);

function playSound(id){
  const sound = document.getElementById(id);
  if(sound){
    sound.currentTime = 0;
    sound.play().catch(()=>{});
  }
}

function startGame(){
  startScreen.classList.remove("active");
  gameScreen.classList.add("active");
  loadQuestion();
}

function loadQuestion(){
  locked = false;
  chances = 2;

  const q = questions[current];

  document.getElementById("levelText").innerText = "Challenge " + (current + 1) + " / " + questions.length;
  document.getElementById("scoreText").innerText = "Score: " + score;
  document.getElementById("attemptText").innerText = "Chances: " + chances;
  document.getElementById("typeTitle").innerText = q.type;
  document.getElementById("questionText").innerText = q.question;
  document.getElementById("sentenceText").innerText = q.sentence;
  document.getElementById("feedback").innerText = "";
  document.getElementById("nextBtn").style.display = "none";

  document.getElementById("progressBar").style.width = (current / questions.length * 100) + "%";
  document.getElementById("bossHealth").style.width = ((questions.length-current) / questions.length * 100) + "%";

  showLevelFlash(q.type);

  const optionsBox = document.getElementById("optionsBox");
  optionsBox.innerHTML = "";

  q.options.forEach(option=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = option;
    div.onclick = () => checkAnswer(div, option);
    optionsBox.appendChild(div);
  });
}

function checkAnswer(element, selected){
  if(locked) return;

  const q = questions[current];

  if(selected === q.answer){
    locked = true;
    score++;

    element.classList.add("correct");
    document.getElementById("feedback").innerText = "Power Hit! Correct answer!";
    document.getElementById("scoreText").innerText = "Score: " + score;

    playSound("correctSound");
    playerCelebrate();
    bossHit();
    sparkleBurst();

    document.getElementById("nextBtn").style.display = "inline-block";
  } else {
    chances--;
    element.classList.add("wrong");
    playSound("wrongSound");

    document.getElementById("attemptText").innerText = "Chances: " + chances;

    if(chances > 0){
      document.getElementById("feedback").innerText = "Careful! One more chance.";
    } else {
      locked = true;
      document.getElementById("feedback").innerText = "Correct answer: " + q.answer;

      const allOptions = document.querySelectorAll(".option");
      allOptions.forEach(opt=>{
        if(opt.innerText === q.answer){
          opt.classList.add("correct");
          opt.classList.add("glow");
        }
      });

      document.getElementById("nextBtn").style.display = "inline-block";
    }
  }
}

function nextQuestion(){
  current++;

  if(current < questions.length){
    loadQuestion();
  } else {
    endGame();
  }
}

function endGame(){
  gameScreen.classList.remove("active");
  endScreen.classList.add("active");
  document.getElementById("finalScore").innerText = "Your Score: " + score + " / " + questions.length;
  playSound("clapSound");
  launchConfetti();
  launchStreamers();
}

function restartGame(){
  current = 0;
  score = 0;
  endScreen.classList.remove("active");
  gameScreen.classList.add("active");
  loadQuestion();
}

function playerCelebrate(){
  const player = document.getElementById("player");
  player.classList.add("win");
  setTimeout(()=>player.classList.remove("win"),500);
}

function bossHit(){
  const boss = document.getElementById("boss");
  boss.classList.add("hit");
  setTimeout(()=>boss.classList.remove("hit"),450);
}

function sparkleBurst(){
  for(let i=0;i<16;i++){
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";
    sparkle.innerText = "✨";
    sparkle.style.left = (45 + Math.random()*20) + "vw";
    sparkle.style.top = (35 + Math.random()*25) + "vh";
    document.body.appendChild(sparkle);

    setTimeout(()=>sparkle.remove(),1000);
  }
}

function showLevelFlash(text){
  const flash = document.createElement("div");
  flash.className = "levelFlash";
  flash.innerText = text;
  document.body.appendChild(flash);

  setTimeout(()=>flash.remove(),1300);
}

function launchConfetti(){
  for(let i=0;i<100;i++){
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random()*100 + "vw";
    confetti.style.background = randomColor();
    confetti.style.animationDelay = Math.random()*1.5 + "s";
    confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
    document.body.appendChild(confetti);

    setTimeout(()=>confetti.remove(),4000);
  }
}

function launchStreamers(){
  for(let i=0;i<35;i++){
    const streamer = document.createElement("div");
    streamer.className = "streamer";
    streamer.style.left = Math.random()*100 + "vw";
    streamer.style.background = randomColor();
    streamer.style.animationDelay = Math.random()*1.8 + "s";
    document.body.appendChild(streamer);

    setTimeout(()=>streamer.remove(),4500);
  }
}

function randomColor(){
  const colors = ["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff99c8","#00bbf9"];
  return colors[Math.floor(Math.random()*colors.length)];
}
</script>

</body>
</html>
