<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adjective Championship</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#fff3c4,#dff6ff,#f5ddff);
  min-height:100vh;
  overflow:hidden;
  color:#3b2f2f;
}
.screen{
  display:none;
  width:100vw;
  height:100vh;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
}
.active{display:flex}

.logo{
  max-width:280px;
  width:60%;
}

.card{
  width:95%;
  max-width:850px;
  background:#ffffffee;
  border-radius:28px;
  padding:24px;
  box-shadow:0 8px 24px #00000022;
}

h1{font-size:38px;margin:10px 0;color:#6a3d9a}
h2{font-size:26px;margin:10px 0}
p{font-size:19px;line-height:1.5}

button{
  border:none;
  border-radius:18px;
  padding:14px 24px;
  margin:10px;
  font-size:18px;
  font-weight:bold;
  background:#ffbf69;
  color:#3b2f2f;
  cursor:pointer;
  box-shadow:0 5px 0 #d88b32;
}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #d88b32}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.badge{
  background:#e8f7ff;
  padding:10px 16px;
  border-radius:20px;
  font-weight:bold;
}
.progressOuter{
  width:100%;
  height:18px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0;
}
.progressInner{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#90be6d,#43aa8b);
}

.questionBox{
  background:#fff6dd;
  border:3px dashed #ffbf69;
  border-radius:22px;
  padding:18px;
  margin:15px 0;
  font-size:24px;
  font-weight:bold;
}
.sentence{
  font-size:23px;
  margin-top:8px;
  color:#4d3b3b;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:20px;
}
.option{
  background:#f3e8ff;
  border:3px solid #b892ff;
  border-radius:20px;
  padding:18px;
  font-size:21px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}
.option:hover{transform:scale(1.03)}
.correct{
  background:#caffbf!important;
  border-color:#48a868!important;
}
.wrong{
  background:#ffccd5!important;
  border-color:#e63946!important;
  animation:shake .3s;
}
.glow{
  animation:glow 1s infinite alternate;
}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-8px)}
  75%{transform:translateX(8px)}
}
@keyframes glow{
  from{box-shadow:0 0 8px #48a868}
  to{box-shadow:0 0 22px #48a868}
}

.feedback{
  min-height:35px;
  font-size:22px;
  font-weight:bold;
  margin-top:12px;
}

.trophy{
  font-size:90px;
  animation:bounce 1s infinite alternate;
}
@keyframes bounce{
  from{transform:translateY(0)}
  to{transform:translateY(-15px)}
}

.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:-20px;
  animation:fall 3s linear forwards;
}
@keyframes fall{
  to{
    transform:translateY(110vh) rotate(720deg);
    opacity:0;
  }
}

@media(max-width:600px){
  h1{font-size:30px}
  .questionBox{font-size:20px}
  .sentence{font-size:19px}
  .options{grid-template-columns:1fr}
  .option{font-size:18px;padding:14px}
  .card{padding:18px}
}
</style>
</head>

<body>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3"></audio>

<div id="splash" class="screen active">
  <img src="assets/innovine-logo.png" class="logo" alt="Innovine Logo">
</div>

<div id="startScreen" class="screen">
  <div class="card">
    <h1>Adjective Championship</h1>
    <p>Play 10 levels and become an Adjective Champion!</p>
    <p>You will get <b>2 chances</b> for each question.</p>
    <button onclick="startGame()">Start Game</button>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="card">
    <div class="topbar">
      <div class="badge" id="levelText">Level 1</div>
      <div class="badge" id="scoreText">Score: 0</div>
      <div class="badge" id="attemptText">Chances: 2</div>
    </div>

    <div class="progressOuter">
      <div class="progressInner" id="progressBar"></div>
    </div>

    <h2 id="typeTitle"></h2>

    <div class="questionBox">
      <div id="questionText"></div>
      <div class="sentence" id="sentenceText"></div>
    </div>

    <div class="options" id="optionsBox"></div>

    <div class="feedback" id="feedback"></div>
    <button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next Level</button>
  </div>
</div>

<div id="endScreen" class="screen">
  <div class="card">
    <div class="trophy">🏆</div>
    <h1>Well Done!</h1>
    <h2>You are an Adjective Champion!</h2>
    <p id="finalScore"></p>
    <button onclick="restartGame()">Play Again</button>
  </div>
</div>

<script>
const questions = [
  {
    type:"Quality Adjective",
    question:"Which word tells the quality of the noun?",
    sentence:"The brave boy helped the old man.",
    options:["brave","boy","helped","man"],
    answer:"brave"
  },
  {
    type:"Quantity Adjective",
    question:"Which word shows quantity?",
    sentence:"There is some milk in the glass.",
    options:["glass","some","milk","there"],
    answer:"some"
  },
  {
    type:"Number Adjective",
    question:"Which word shows number?",
    sentence:"Five birds are sitting on the tree.",
    options:["birds","tree","five","sitting"],
    answer:"five"
  },
  {
    type:"Demonstrative Adjective",
    question:"Which word points to a noun?",
    sentence:"This book belongs to Riya.",
    options:["this","book","belongs","Riya"],
    answer:"this"
  },
  {
    type:"Interrogative Adjective",
    question:"Which word asks a question about a noun?",
    sentence:"Which colour do you like?",
    options:["like","colour","which","you"],
    answer:"which"
  },
  {
    type:"Possessive Adjective",
    question:"Which word shows ownership?",
    sentence:"My bag is on the table.",
    options:["my","bag","table","on"],
    answer:"my"
  },
  {
    type:"Proper Adjective",
    question:"Which adjective is formed from a proper noun?",
    sentence:"We enjoyed Italian food.",
    options:["food","Italian","enjoyed","we"],
    answer:"Italian"
  },
  {
    type:"Distributive Adjective",
    question:"Which word refers to people or things one by one?",
    sentence:"Each child received a gift.",
    options:["gift","child","each","received"],
    answer:"each"
  },
  {
    type:"Emphasising Adjective",
    question:"Which word gives emphasis to the noun?",
    sentence:"I saw the same movie yesterday.",
    options:["same","movie","saw","yesterday"],
    answer:"same"
  },
  {
    type:"Mixed Challenge",
    question:"Identify the adjective type of the word 'our'.",
    sentence:"Our school has a big playground.",
    options:["Quality Adjective","Possessive Adjective","Number Adjective","Proper Adjective"],
    answer:"Possessive Adjective"
  }
];

let current = 0;
let score = 0;
let chances = 2;
let locked = false;

const splash = document.getElementById("splash");
const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const endScreen = document.getElementById("endScreen");

setTimeout(()=>{
  splash.classList.remove("active");
  startScreen.classList.add("active");
},2000);

function playSound(id){
  const sound = document.getElementById(id);
  if(sound){
    sound.currentTime = 0;
    sound.play().catch(()=>{});
  }
}

function startGame(){
  startScreen.classList.remove("active");
  gameScreen.classList.add("active");
  loadQuestion();
}

function loadQuestion(){
  locked = false;
  chances = 2;

  const q = questions[current];

  document.getElementById("levelText").innerText = "Level " + (current + 1) + " / " + questions.length;
  document.getElementById("scoreText").innerText = "Score: " + score;
  document.getElementById("attemptText").innerText = "Chances: " + chances;
  document.getElementById("typeTitle").innerText = q.type;
  document.getElementById("questionText").innerText = q.question;
  document.getElementById("sentenceText").innerText = q.sentence;
  document.getElementById("feedback").innerText = "";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("progressBar").style.width = ((current) / questions.length * 100) + "%";

  const optionsBox = document.getElementById("optionsBox");
  optionsBox.innerHTML = "";

  q.options.forEach(option=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = option;
    div.onclick = () => checkAnswer(div, option);
    optionsBox.appendChild(div);
  });
}

function checkAnswer(element, selected){
  if(locked) return;

  const q = questions[current];

  if(selected === q.answer){
    locked = true;
    score++;
    element.classList.add("correct");
    document.getElementById("feedback").innerText = "Correct! Good job!";
    document.getElementById("scoreText").innerText = "Score: " + score;
    playSound("correctSound");
    document.getElementById("nextBtn").style.display = "inline-block";
  } else {
    chances--;
    element.classList.add("wrong");
    playSound("wrongSound");

    document.getElementById("attemptText").innerText = "Chances: " + chances;

    if(chances > 0){
      document.getElementById("feedback").innerText = "Try again!";
    } else {
      locked = true;
      document.getElementById("feedback").innerText = "Correct answer: " + q.answer;

      const allOptions = document.querySelectorAll(".option");
      allOptions.forEach(opt=>{
        if(opt.innerText === q.answer){
          opt.classList.add("correct");
          opt.classList.add("glow");
        }
      });

      document.getElementById("nextBtn").style.display = "inline-block";
    }
  }
}

function nextQuestion(){
  current++;

  if(current < questions.length){
    loadQuestion();
  } else {
    endGame();
  }
}

function endGame(){
  gameScreen.classList.remove("active");
  endScreen.classList.add("active");
  document.getElementById("finalScore").innerText = "Your Score: " + score + " / " + questions.length;
  document.getElementById("progressBar").style.width = "100%";
  playSound("clapSound");
  launchConfetti();
}

function restartGame(){
  current = 0;
  score = 0;
  endScreen.classList.remove("active");
  gameScreen.classList.add("active");
  loadQuestion();
}

function launchConfetti(){
  for(let i=0;i<80;i++){
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random()*100 + "vw";
    confetti.style.background = randomColor();
    confetti.style.animationDelay = Math.random()*1.5 + "s";
    confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "0";
    document.body.appendChild(confetti);

    setTimeout(()=>{
      confetti.remove();
    },4000);
  }
}

function randomColor(){
  const colors = ["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff99c8"];
  return colors[Math.floor(Math.random()*colors.length)];
}
</script>

</body>
</html>
