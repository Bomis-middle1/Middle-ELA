<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prepositions Drag & Drop Game</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#140f3d;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;height:100vh;}
#logoScreen, #quizScreen, #endScreen{display:none;align-items:center;justify-content:center;flex-direction:column;}
#logoScreen img{width:200px;margin-top:50px;}
h1{color:#ffd60a;text-align:center;}
#questionBox{background:#fff4d6;color:#2d2340;padding:20px;border-radius:12px;max-width:600px;margin-top:20px;text-align:left;}
#optionsBox{display:flex;flex-wrap:wrap;margin-top:15px;}
.option{background:#ffb703;color:#2d2340;padding:10px 15px;margin:5px;border-radius:12px;cursor:pointer;user-select:none;}
.option.correct{background:#b7efc5;}
.option.wrong{background:#ffccd5;}
#feedback{margin-top:10px;font-weight:bold;}
button{padding:10px 16px;margin-top:12px;border-radius:12px;border:none;background:#ffb703;color:#2d2340;font-weight:bold;cursor:pointer;}
#endScreen{display:none;text-align:center;margin-top:20px;}
</style>
</head>
<body>

<!-- Logo -->
<div id="logoScreen">
<img src="assets/innovine-logo.png" alt="Logo">
<h2>Loading Game...</h2>
</div>

<!-- Quiz Screen -->
<div id="quizScreen">
<h1>Prepositions Drag & Drop</h1>
<div id="scoreText">Question 1 of 10</div>
<div id="questionBox">
<div id="questionText"></div>
<div id="optionsBox"></div>
<div id="feedback"></div>
</div>
</div>

<!-- End Screen -->
<div id="endScreen">
<h1>Quiz Completed!</h1>
<p id="finalScore"></p>
<button onclick="restartQuiz()">Play Again</button>
</div>

<!-- Audio -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>
// Prepositions MCQs as provided
const mcqs=[
{q:'Which preposition tells us WHEN something happens?\n"The train arrives at 8:00 a.m."',opts:["under the bridge","at 8:00 a.m.","behind the sofa","through the tunnel"],ans:"at 8:00 a.m."},
{q:'Which sentence contains a place preposition?',opts:["We will meet after lunch.","The keys are on the table.","The show starts at 7 p.m.","The flight leaves in two hours."],ans:"The keys are on the table."},
{q:'Which preposition shows movement or travel?\n"The hikers walked through the forest."',opts:["beside the chair","through the forest","at 9 a.m.","under the bed"],ans:"through the forest"},
{q:'The clue says:\n"The golden key is beneath the statue." The word beneath tells us:',opts:["Time","Place","Travel","Reason"],ans:"Place"},
{q:'Read: "The plane flew across the ocean." What type of preposition is across?',opts:["Time","Place","Travel/Movement","Directionless"],ans:"Travel/Movement"},
{q:'Which sentence contains a time preposition?\n"We will meet before sunset."',opts:["Behind the curtain","Across the sea","We will meet before sunset","Sat on the branch"],ans:"We will meet before sunset"},
{q:'Three prepositions belong to the same group. One does not.',opts:["in","on","under","during"],ans:"during"},
{q:'Which sentence contains BOTH a place preposition and a travel preposition?\n"The dragon flew over the mountain into the valley."',opts:["The dragon slept in the cave.","The dragon flew over the mountain into the valley.","The dragon arrived before dawn.","The dragon waited during the storm."],ans:"The dragon flew over the mountain into the valley."},
{q:'Which category does the preposition during belong to?',opts:["Place","Travel","Time","Direction"],ans:"Time"},
{q:'Read: "At sunrise, the explorers walked through the jungle and across the river." How many types of prepositions appear?',opts:["One","Two","Three","Four"],ans:"Three"}
];

let currentQ=0;
let score=0;

// DOM elements
const logoScreen=document.getElementById('logoScreen');
const quizScreen=document.getElementById('quizScreen');
const questionText=document.getElementById('questionText');
const optionsBox=document.getElementById('optionsBox');
const feedback=document.getElementById('feedback');
const scoreText=document.getElementById('scoreText');
const endScreen=document.getElementById('endScreen');
const finalScore=document.getElementById('finalScore');
const correctAudio=document.getElementById('correctSound');
const wrongAudio=document.getElementById('wrongSound');
const clapAudio=document.getElementById('clapSound');

// Show logo 5 sec
logoScreen.style.display='flex';
setTimeout(()=>{
  logoScreen.style.display='none';
  quizScreen.style.display='flex';
  showQuestion();
},5000);

// Show question
function showQuestion(){
  feedback.innerText="";
  const q=mcqs[currentQ];
  questionText.innerText=q.q;
  optionsBox.innerHTML='';
  q.opts.forEach(opt=>{
    const div=document.createElement('div');
    div.className='option';
    div.innerText=opt;
    div.onclick=()=>checkAnswer(opt,div);
    optionsBox.appendChild(div);
  });
  scoreText.innerText=`Question ${currentQ+1} of ${mcqs.length}`;
}

// Check answer
function checkAnswer(selected,btn){
  const q=mcqs[currentQ];
  const buttons=document.querySelectorAll('.option');
  buttons.forEach(b=>b.style.pointerEvents='none');
  if(selected===q.ans){
    btn.classList.add('correct');
    feedback.innerText='Correct!';
    correctAudio.currentTime=0; correctAudio.play();
    score++;
  } else{
    btn.classList.add('wrong');
    feedback.innerText='Wrong! Correct: '+q.ans;
    wrongAudio.currentTime=0; wrongAudio.play();
    buttons.forEach(b=>{if(b.innerText===q.ans) b.classList.add('correct');});
  }
  setTimeout(nextQuestion,1200);
}

// Next question
function nextQuestion(){
  currentQ++;
  if(currentQ>=mcqs.length){
    quizScreen.style.display='none';
    endScreen.style.display='flex';
    finalScore.innerText=`You scored ${score} / ${mcqs.length}`;
    clapAudio.play();
  } else{
    showQuestion();
  }
}

// Restart
function restartQuiz(){
  currentQ=0;
  score=0;
  endScreen.style.display='none';
  quizScreen.style.display='flex';
  showQuestion();
}
</script>
</body>
</html>
