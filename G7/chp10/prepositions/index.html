<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prepositions Adventure Quest</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffecd2,#fcb69f,#a1c4fd);
display:flex;
align-items:center;
justify-content:center;
height:100vh;
overflow:hidden;
}

.screen{
display:none;
width:100%;
height:100%;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
box-sizing:border-box;
}

.active{display:flex;}

/* LOGO */
#logoScreen img{
width:220px;
animation:pop 1s ease;
}

@keyframes pop{
from{transform:scale(0.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* TITLE */
.title{
font-size:30px;
font-weight:bold;
color:#222;
animation:flash 1s infinite alternate;
}

@keyframes flash{
from{transform:scale(1);opacity:0.7;}
to{transform:scale(1.1);opacity:1;}
}

/* BUTTON */
button{
padding:12px 18px;
border:none;
border-radius:12px;
background:#ff9800;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
}

/* GAME BOX */
.card{
background:#ffffffee;
padding:18px;
border-radius:15px;
width:95%;
max-width:600px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* OPTIONS */
.option{
background:#4caf50;
color:#fff;
padding:12px;
margin:8px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

/* SCORE */
#scoreBoard{
font-weight:bold;
margin-bottom:10px;
font-size:18px;
}

/* FEEDBACK */
#feedback{
min-height:25px;
font-weight:bold;
margin-top:10px;
}

/* CONFETTI */
.confetti{
position:fixed;
width:10px;
height:10px;
top:-10px;
animation:fall 2s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(360deg);
opacity:0;
}
}

/* END SCREEN */
#remark{
font-size:22px;
font-weight:bold;
margin:10px 0;
}
</style>
</head>

<body>

<!-- 🔵 LOGO -->
<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- 🟡 TITLE -->
<div id="titleScreen" class="screen">
<div class="title">✨ Prepositions Adventure Quest ✨</div>
<button onclick="startGame()">Start Game</button>
</div>

<!-- 🟢 GAME -->
<div id="gameScreen" class="screen">
<div class="card">

<div id="scoreBoard">Score: 0 / 10</div>

<h3 id="questionText"></h3>

<div id="optionsBox"></div>

<div id="feedback"></div>

</div>
</div>

<!-- 🏁 END -->
<div id="endScreen" class="screen">
<div class="card">
<h2>🎉 Game Completed!</h2>

<div id="finalScore"></div>
<div id="remark"></div>

<button onclick="restartGame()">Restart</button>
</div>
</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3" volume="1"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" volume="1"></audio>

<script>

/* ================= QUESTIONS ================= */
const mcqs=[
{q:"The train arrives ___ 8:00 a.m.",opts:["at","on","in","under"],ans:"at"},
{q:"The book is ___ the table.",opts:["on","in","at","under"],ans:"on"},
{q:"She sat ___ me.",opts:["beside","on","under","in"],ans:"beside"},
{q:"We met ___ Monday.",opts:["on","at","in","under"],ans:"on"},
{q:"He is ___ school.",opts:["at","on","in","over"],ans:"at"},
{q:"They walked ___ the bridge.",opts:["across","under","in","on"],ans:"across"},
{q:"The cat is ___ the chair.",opts:["under","on","in","at"],ans:"under"},
{q:"The plane flew ___ the ocean.",opts:["over","under","into","at"],ans:"over"},
{q:"The bird flew ___ the river.",opts:["over","in","at","during"],ans:"over"},
{q:"The key is ___ the box.",opts:["in","on","under","beside"],ans:"in"}
];

mcqs.sort(()=>Math.random()-0.5);

let i=0;
let score=0;

/* ================= FLOW ================= */
window.onload=()=>{
setTimeout(()=>{
document.getElementById("logoScreen").classList.remove("active");
document.getElementById("titleScreen").classList.add("active");
},5000);
};

/* START */
function startGame(){
document.getElementById("titleScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");
loadQ();
}

/* LOAD */
function loadQ(){

if(i>=mcqs.length){
endGame();
return;
}

let q=mcqs[i];

document.getElementById("scoreBoard").innerText=
`Score: ${score} / ${mcqs.length}`;

document.getElementById("questionText").innerText=q.q;

let box=document.getElementById("optionsBox");
box.innerHTML="";

document.getElementById("feedback").innerText="";

q.opts.forEach(o=>{
let d=document.createElement("div");
d.className="option";
d.innerText=o;
d.onclick=()=>check(o);
box.appendChild(d);
});
}

/* CHECK */
function check(opt){

let q=mcqs[i];

if(opt===q.ans){
score++;
document.getElementById("correctSound").play().catch(()=>{});
confetti();
document.getElementById("feedback").innerText="✔ Correct!";
}else{
document.getElementById("wrongSound").play().catch(()=>{});
document.getElementById("feedback").innerText="❌ Wrong!";
}

setTimeout(()=>{
i++;
loadQ();
},900);
}

/* CONFETTI */
function confetti(){
for(let j=0;j<30;j++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=["#ff0","#0ff","#f0f","#0f0","#f60"][Math.floor(Math.random()*5)];
document.body.appendChild(c);
setTimeout(()=>c.remove(),2000);
}
}

/* END */
function endGame(){

document.getElementById("gameScreen").classList.remove("active");
document.getElementById("endScreen").classList.add("active");

let percent = (score/mcqs.length)*100;

let remark="";

if(percent>=80) remark="🌟 Excellent!";
else if(percent>=60) remark="👍 Good Job!";
else if(percent>=45) remark="🙂 Well Tried!";
else remark="📘 Let's revise and come back!";

document.getElementById("finalScore").innerText=
`You answered ${score} out of ${mcqs.length} correct`;

document.getElementById("remark").innerText=remark;
}

/* RESTART */
function restartGame(){
location.reload();
}

</script>

</body>
</html>
