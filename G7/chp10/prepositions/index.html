<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Class Trip Adventure</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#a1c4fd,#c2e9fb,#fbc2eb);
display:flex;
align-items:center;
justify-content:center;
height:100vh;
overflow:hidden;
}

.screen{
display:none;
width:100%;
height:100%;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
box-sizing:border-box;
}

.active{display:flex;}

/* LOGO */
#logoScreen img{
width:220px;
animation:pop 1s ease;
}

@keyframes pop{
from{transform:scale(0.5);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* TITLE */
.title{
font-size:28px;
font-weight:bold;
color:#222;
animation:flash 1s infinite alternate;
}

@keyframes flash{
from{transform:scale(1);opacity:0.7;}
to{transform:scale(1.1);opacity:1;}
}

/* CARD */
.card{
background:#ffffffee;
padding:18px;
border-radius:15px;
width:95%;
max-width:650px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

/* OPTIONS */
.option{
background:#ffb703;
padding:12px;
margin:8px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

/* SCORE */
#scoreBoard{
font-weight:bold;
margin-bottom:10px;
font-size:18px;
}

/* FEEDBACK */
#feedback{
min-height:20px;
margin-top:10px;
font-weight:bold;
}

/* BUTTON */
button{
padding:12px;
border:none;
border-radius:12px;
background:#ff9800;
color:#fff;
font-size:16px;
font-weight:bold;
cursor:pointer;
width:100%;
margin-top:10px;
}

/* CONFETTI */
.confetti{
position:fixed;
width:10px;
height:10px;
top:-10px;
animation:fall 2s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(360deg);
opacity:0;
}
}
</style>
</head>

<body>

<!-- 🔵 LOGO -->
<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- 🟡 TITLE -->
<div id="titleScreen" class="screen">
<div class="title">🚌 The Class Trip Adventure</div>
<button onclick="startGame()">Start Game</button>
</div>

<!-- 🟢 GAME -->
<div id="gameScreen" class="screen">
<div class="card">

<div id="scoreBoard">Score: 0 / 10</div>

<h3 id="storyText"></h3>
<h2 id="questionText"></h2>

<div id="optionsBox"></div>

<div id="feedback"></div>

</div>
</div>

<!-- 🏁 END -->
<div id="endScreen" class="screen">
<div class="card">
<h2>🎉 Trip Completed!</h2>

<div id="finalScore"></div>
<div id="remark"></div>

<button onclick="restartGame()">Restart</button>
</div>
</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

/* ================= STRICT STORY FLOW (DO NOT CHANGE ORDER) ================= */
const levels = [
{ story:"It is Monday morning. Everyone is excited for the class trip. Ms. Anita checks the time.", q:"The bus will leave ___ 7:30 a.m.", opts:["at","on","in"], ans:"at" },
{ story:"The teacher reminds everyone about the trip.", q:"Our trip is ___ Friday.", opts:["on","at","in"], ans:"on" },
{ story:"The bus finally arrives.", q:"The students are waiting ___ the bus stop.", opts:["at","on","under"], ans:"at" },
{ story:"Everyone finds a seat.", q:"Rina is sitting ___ her best friend.", opts:["beside","under","between"], ans:"beside" },
{ story:"The bus begins its journey.", q:"We are travelling ___ bus.", opts:["by","on","in"], ans:"by" },
{ story:"The students enter the museum.", q:"The dinosaur skeleton is ___ the entrance.", opts:["near","in","on"], ans:"near" },
{ story:"Students look for clues.", q:"The next clue is hidden ___ the old tree.", opts:["under","between","on"], ans:"under" },
{ story:"Everyone sits together.", q:"Our lunch break starts ___ noon.", opts:["at","on","in"], ans:"at" },
{ story:"The trip ends.", q:"The students got ___ the bus happily.", opts:["on","in","under"], ans:"on" },
{ story:"The teacher smiles.", q:"We arrived home ___ the evening.", opts:["in","at","on"], ans:"in" }
];

let i = 0;
let score = 0;

/* ================= SHUFFLE ONLY OPTIONS ================= */
function shuffle(arr){
return arr.sort(()=>Math.random()-0.5);
}

/* ================= INTRO FLOW ================= */
window.onload = () => {
setTimeout(()=>{
document.getElementById("logoScreen").classList.remove("active");
document.getElementById("titleScreen").classList.add("active");
},5000);
};

function startGame(){
document.getElementById("titleScreen").classList.remove("active");
document.getElementById("gameScreen").classList.add("active");
loadQ();
}

/* ================= LOAD QUESTION ================= */
function loadQ(){

if(i >= levels.length){
endGame();
return;
}

let L = levels[i];

document.getElementById("scoreBoard").innerText =
`Score: ${score} / ${levels.length}`;

document.getElementById("storyText").innerText = L.story;
document.getElementById("questionText").innerText = L.q;

let box = document.getElementById("optionsBox");
box.innerHTML = "";

document.getElementById("feedback").innerText = "";

/* 🔥 ONLY OPTIONS SHUFFLED (FLOW SAFE) */
let options = shuffle([...L.opts]);

options.forEach(o=>{
let d = document.createElement("div");
d.className = "option";
d.innerText = o;

d.onclick = () => check(o);

box.appendChild(d);
});
}

/* ================= CHECK ANSWER ================= */
function check(opt){

let L = levels[i];

if(opt === L.ans){
score++;
document.getElementById("correctSound").play().catch(()=>{});
confetti();
document.getElementById("feedback").innerText = "✔ Correct!";
}else{
document.getElementById("wrongSound").play().catch(()=>{});
document.getElementById("feedback").innerText = "❌ Wrong!";
}

setTimeout(()=>{
i++;
loadQ();
},900);
}

/* ================= END GAME ================= */
function endGame(){

document.getElementById("gameScreen").classList.remove("active");
document.getElementById("endScreen").classList.add("active");

let percent = (score / levels.length) * 100;

let remark =
percent >= 80 ? "🌟 Excellent!"
: percent >= 60 ? "👍 Good Job!"
: percent >= 45 ? "🙂 Well Tried!"
: "📘 Let's Revise and Come Back!";

document.getElementById("finalScore").innerText =
`You answered ${score} out of ${levels.length} correct`;

document.getElementById("remark").innerText = remark;

document.getElementById("clapSound").play().catch(()=>{});
}

/* ================= RESTART ================= */
function restartGame(){
location.reload();
}

/* ================= CONFETTI ================= */
function confetti(){
for(let j = 0; j < 30; j++){
let c = document.createElement("div");
c.className = "confetti";
c.style.left = Math.random() * 100 + "vw";
c.style.background = ["#ff0","#0ff","#f0f","#0f0","#f60"][Math.floor(Math.random()*5)];
document.body.appendChild(c);
setTimeout(()=>c.remove(),2000);
}
}

</script>

</body>
</html>
