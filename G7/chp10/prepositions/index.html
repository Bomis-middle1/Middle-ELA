<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prepositions Drag & Drop</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#140f3d;color:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;height:100vh;}
#logoScreen,#quizScreen,#endScreen{display:none;align-items:center;justify-content:center;flex-direction:column;}
#logoScreen img{width:200px;margin-top:50px;}
h1{color:#ffd60a;text-align:center;}
#questionBox{background:#fff4d6;color:#2d2340;padding:20px;border-radius:12px;max-width:600px;margin-top:20px;text-align:center;}
#blank{display:inline-block;width:120px;border-bottom:2px solid #333;margin:0 5px;padding:2px;}
#optionsBox{display:flex;flex-wrap:wrap;margin-top:20px;justify-content:center;}
.option{background:#ffb703;color:#2d2340;padding:10px 15px;margin:5px;border-radius:12px;cursor:grab;user-select:none;}
.option.correct{background:#b7efc5;}
.option.wrong{background:#ffccd5;}
#feedback{margin-top:10px;font-weight:bold;}
button{padding:10px 16px;margin-top:12px;border-radius:12px;border:none;background:#ffb703;color:#2d2340;font-weight:bold;cursor:pointer;}
#endScreen{display:none;text-align:center;margin-top:20px;}
</style>
</head>
<body>

<div id="logoScreen">
<img src="assets/innovine-logo.png" alt="Logo">
<h2>Loading Game...</h2>
</div>

<div id="quizScreen">
<h1>Prepositions Drag & Drop</h1>
<div id="scoreText">Question 1 of 10</div>
<div id="questionBox">
<span id="questionText"></span>
<span id="blank" ondrop="drop(event)" ondragover="allowDrop(event)"></span>
<div id="optionsBox"></div>
<div id="feedback"></div>
</div>
</div>

<div id="endScreen">
<h1>Quiz Completed!</h1>
<p id="finalScore"></p>
<button onclick="restartQuiz()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>
// 10 Prepositions questions
const mcqs=[
{q:'Which preposition tells us WHEN something happens?\n"The train arrives ___ 8:00 a.m."',opts:["under the bridge","at","behind","through"],ans:"at"},
{q:'Which sentence contains a place preposition?',"opts":["after","on","at","in"],ans:"on"},
{q:'Which preposition shows movement or travel?\n"The hikers walked ___ the forest."',opts:["beside","through","at","under"],ans:"through"},
{q:'The golden key is ___ the statue.',opts:["Time","Place","Travel","Reason"],ans:"Place"},
{q:'The plane flew ___ the ocean.',opts:["Time","Place","Travel","Directionless"],ans:"Travel"},
{q:'Which sentence contains a time preposition?',"opts":["behind","across","before","on"],ans:"before"},
{q:'Three prepositions belong to the same group. One does not.',opts:["in","on","under","during"],ans:"during"},
{q:'Sentence with BOTH a place and travel preposition.',opts:["in","over","before","during"],ans:"over"},
{q:'Which category does the preposition during belong to?',opts:["Place","Travel","Time","Direction"],ans:"Time"},
{q:'Read: "At sunrise, explorers walked ___ the jungle and ___ the river." How many types of prepositions appear?',opts:["One","Two","Three","Four"],ans:"Three"}
];

let currentQ=0;
let score=0;

const logoScreen=document.getElementById('logoScreen');
const quizScreen=document.getElementById('quizScreen');
const questionText=document.getElementById('questionText');
const optionsBox=document.getElementById('optionsBox');
const blank=document.getElementById('blank');
const feedback=document.getElementById('feedback');
const scoreText=document.getElementById('scoreText');
const endScreen=document.getElementById('endScreen');
const finalScore=document.getElementById('finalScore');
const correctAudio=document.getElementById('correctSound');
const wrongAudio=document.getElementById('wrongSound');
const clapAudio=document.getElementById('clapSound');

// Show logo 5 sec
logoScreen.style.display='flex';
setTimeout(()=>{
  logoScreen.style.display='none';
  quizScreen.style.display='flex';
  showQuestion();
},5000);

function allowDrop(ev){ev.preventDefault();}
function drag(ev){ev.dataTransfer.setData("text", ev.target.innerText);}
function drop(ev){
  ev.preventDefault();
  const data=ev.dataTransfer.getData("text");
  if(data===mcqs[currentQ].ans){
    blank.innerText=data;
    blank.style.background="#b7efc5";
    feedback.innerText="Correct!";
    correctAudio.currentTime=0; correctAudio.play();
    score++;
    setTimeout(nextQuestion,1000);
  } else{
    feedback.innerText="Wrong! Try again.";
    blank.style.background="#ffccd5";
    wrongAudio.currentTime=0; wrongAudio.play();
  }
}

// Show current question
function showQuestion(){
  feedback.innerText="";
  const q=mcqs[currentQ];
  questionText.innerText=q.q.replace("___", "_____");
  blank.innerText="";
  blank.style.background="#fff4d6";
  optionsBox.innerHTML='';
  q.opts.forEach(opt=>{
    const div=document.createElement('div');
    div.className='option';
    div.innerText=opt;
    div.draggable=true;
    div.ondragstart=drag;
    optionsBox.appendChild(div);
  });
  scoreText.innerText=`Question ${currentQ+1} of ${mcqs.length}`;
}

// Next question
function nextQuestion(){
  currentQ++;
  if(currentQ>=mcqs.length){
    quizScreen.style.display='none';
    endScreen.style.display='flex';
    finalScore.innerText=`You scored ${score} / ${mcqs.length}`;
    clapAudio.play();
  } else showQuestion();
}

// Restart
function restartQuiz(){
  currentQ=0;
  score=0;
  endScreen.style.display='none';
  quizScreen.style.display='flex';
  showQuestion();
}
</script>
</body>
</html>
