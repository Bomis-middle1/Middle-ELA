<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
<title>Conjunction Detective Arcade</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #060414;
    color: #fff;
}

/* SCREEN MANAGEMENT */
.screen {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.screen.active { display: flex; }

/* LOGO INTRO SCREEN (STRICT 5s) */
#logoScreen { background: #ffffff; z-index: 9999; }
.logo-container { width: 280px; max-width: 80%; }
.logo-container img { width: 100%; height: auto; display: block; }

/* INSTRUCTIONS SCREEN */
#instructionScreen { background: #0c0728; }
.panel-card {
    background: rgba(20, 15, 61, 0.95);
    border: 2px solid #00ffcc;
    border-radius: 24px;
    padding: 35px 24px;
    max-width: 480px;
    width: 90%;
    text-align: center;
    box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
}
.panel-card h1 { color: #ffd60a; margin-bottom: 15px; font-size: 26px; }
.panel-card p { color: #a49fc4; line-height: 1.6; margin-bottom: 25px; }

/* GAME APP ENGINE INTERFACE */
#gameScreen { background: #060414; }
#gameCanvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, #0f0b36 0%, #050312 100%);
}

/* OVERLAY ACTION INTERFACES */
.action-btn {
    padding: 14px 28px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ffb703, #fb8500);
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(251, 133, 0, 0.4);
    transition: transform 0.1s;
}
.action-btn:active { transform: scale(0.95); }

#endScreen { background: rgba(5, 3, 18, 0.95); }
</style>
</head>
<body>

<audio id="correctSound" src="Middle-ELA/G7/chp9/conjunctions/assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="Middle-ELA/G7/chp9/conjunctions/assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="Middle-ELA/G7/chp9/conjunctions/assets/clapping.mp3" preload="auto"></audio>

<div id="logoScreen" class="screen active">
    <div class="logo-container">
        <img src="Middle-ELA/G7/chp9/conjunctions/assets/innovine-logo.png" alt="Logo">
    </div>
</div>

<div id="instructionScreen" class="screen">
    <div class="panel-card">
        <h1>🚀 Conjunction Space Arcade</h1>
        <p>Move your Blue Launcher block Left/Right using your <b>Mouse/Touch Dragging</b> or <b>Arrow Keys (A/D)</b>. Line up under the correct answer target to claim points!</p>
        <button class="action-btn" onclick="startGameArena()">Launch Mission</button>
    </div>
</div>

<div id="gameScreen" class="screen">
    <canvas id="gameCanvas"></canvas>
</div>

<div id="endScreen" class="screen">
    <div class="panel-card">
        <h1 style="font-size: 40px;">🏆</h1>
        <h1>Mission Cleared</h1>
        <p id="finalScoreDisplay" style="font-size: 18px; margin: 15px 0; font-weight: bold;"></p>
        <button class="action-btn" onclick="restartEntireGame()">Play Again</button>
    </div>
</div>

<script>
const mcqs = [
    {q:'A detective finds this clue: "Although it was midnight, the thief escaped." What type of conjunction is although?',opts:["Coordinating","Relative","Concessive","Comparative"],ans:"Concessive"},
    {q:'Which sentence contains a Conditional Conjunction?',opts:["I stayed home because it rained.","If you find the key, open the chest.","The player was tired but won.","The bike is faster than the scooter."],ans:"If you find the key, open the chest."},
    {q:'A robot made a grammar mistake. Which sentence is WRONG?',opts:["The tiger is stronger than the fox.","She studied so that she could pass.","Although he was hungry, he ate lunch.","If it rains, we will stay inside."],ans:"Although he was hungry, he ate lunch."},
    {q:'The door opens only if you choose the sentence with a Purpose Conjunction.',opts:["The knight trained so that he could defeat the dragon.","The knight trained because he was bored.","The knight trained although he was tired.","The knight trained and became stronger."],ans:"The knight trained so that he could defeat the dragon."},
    {q:'What does the conjunction because do?',opts:["Shows comparison","Shows condition","Gives a reason","Gives extra information"],ans:"Gives a reason"},
    {q:'The alien says: "The spaceship that landed here is invisible." What type of conjunction is that?',opts:["Relative","Comparative","Coordinating","Conditional"],ans:"Relative"},
    {q:'Which sentence uses a Coordinating Conjunction?',opts:["The runner trained because she wanted to win.","The runner trained although she was tired.","The runner trained and improved her speed.","The runner trained so that she could compete."],ans:"The runner trained and improved her speed."},
    {q:'Which conjunction belongs to a DIFFERENT category?',opts:["Although","Even though","Though","Because"],ans:"Because"},
    {q:'Which pair belongs to the same conjunction type?',opts:["if, unless","and, although","because, than","that, but"],ans:"if, unless"},
    {q:'Read the sentence: "The wizard carried a map so that he could find the treasure, although the journey was dangerous." How many conjunction types are used?',opts:["One","Two","Three","Four"],ans:"Two"}
];

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let gameActive = false;
let activeQuizList = [];
let currentIndex = 0;
let totalScore = 0;
let lives = 2;
let feedbackMessage = "";
let feedbackTimer = 0;
let showContinuePrompt = false;

// PLAYER SHIP CONFIGURATION
const player = {
    x: 0,
    y: 0,
    width: 70,
    height: 45,
    speed: 12
};

// INPUT CONTROLS REGISTER
const inputs = { Left: false, Right: false };
let targetOptionDiamonds = [];
let backgroundStars = [];

// TIMEOUT TIMER FOR INITIAL LOGO
window.onload = () => {
    buildStarsBackground();
    setTimeout(() => {
        document.getElementById('logoScreen').classList.remove('active');
        document.getElementById('instructionScreen').classList.add('active');
    }, 5000);
};

function buildStarsBackground() {
    backgroundStars = [];
    for(let i=0; i<60; i++) {
        backgroundStars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.5 });
    }
}

function resizeViewports() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    player.y = canvas.height - player.height - 30;
    if(!gameActive && player.x === 0) {
        player.x = canvas.width / 2 - player.width / 2;
    }
}
window.addEventListener("resize", resizeViewports);

/* ==========================================================================
   INPUT EVENT LISTENERS (FIX FOR THE STUCK BLUE BOX)
   ========================================================================== */
window.addEventListener("keydown", (e) => {
    if(e.key === "ArrowLeft" || e.key === "a" || e.key === "A") inputs.Left = true;
    if(e.key === "ArrowRight" || e.key === "d" || e.key === "D") inputs.Right = true;
    if(e.key === "Enter" || e.key === " ") {
        if(showContinuePrompt) nextStageFloor();
    }
});

window.addEventListener("keyup", (e) => {
    if(e.key === "ArrowLeft" || e.key === "a" || e.key === "A") inputs.Left = false;
    if(e.key === "ArrowRight" || e.key === "d" || e.key === "D") inputs.Right = false;
});

// TOUCH & MOUSE DRAGGING CAPABILITY FOR DESKTOP AND SMART DEVICES
function handlePointerMovement(clientX) {
    if(!gameActive || showContinuePrompt) return;
    player.x = clientX - player.width / 2;
    // Bound Constraints
    if(player.x < 0) player.x = 0;
    if(player.x > canvas.width - player.width) player.x = canvas.width - player.width;
}

canvas.addEventListener("mousemove", (e) => handlePointerMovement(e.clientX));
canvas.addEventListener("touchmove", (e) => {
    if(e.touches.length > 0) handlePointerMovement(e.touches[0].clientX);
}, { passive: true });

// Tap screen to progress when matching answers are locked
canvas.addEventListener("click", () => {
    if(showContinuePrompt) nextStageFloor();
});
canvas.addEventListener("touchstart", () => {
    if(showContinuePrompt) nextStageFloor();
});

/* ==========================================================================
   GAME LOGIC LOOP ENGINE
   ========================================================================== */
function startGameArena() {
    document.getElementById('instructionScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');
    
    activeQuizList = [...mcqs].sort(() => Math.random() - 0.5);
    currentIndex = 0;
    totalScore = 0;
    gameActive = true;
    
    resizeViewports();
    player.x = canvas.width / 2 - player.width / 2;
    setupQuestionFloor();
    animateEngineLoop();
}

function setupQuestionFloor() {
    lives = 2;
    showContinuePrompt = false;
    feedbackMessage = "";
    
    const activeData = activeQuizList[currentIndex];
    const optionCount = activeData.opts.length;
    
    targetOptionDiamonds = [];
    const segmentWidth = canvas.width / optionCount;
    const itemColors = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4"];
    
    activeData.opts.forEach((text, idx) => {
        targetOptionDiamonds.push({
            text: text,
            x: (segmentWidth * idx) + (segmentWidth / 2),
            y: canvas.height * 0.45 + (Math.random() * 40 - 20), // Floating placement align
            width: 130,
            height: 70,
            color: itemColors[idx % itemColors.length],
            isCorrect: text === activeData.ans,
            disabled: false
        });
    });
}

function animateEngineLoop() {
    if(!gameActive) return;
    
    updateStateCalculations();
    renderGraphicsWorkspace();
    
    requestAnimationFrame(animateEngineLoop);
}

function updateStateCalculations() {
    // Smooth Keyboard translation physics logic
    if(inputs.Left && player.x > 0) player.x -= player.speed;
    if(inputs.Right && player.x < canvas.width - player.width) player.x += player.speed;
    
    if(showContinuePrompt) return; // Freeze check collision once an answer is chosen
    
    // Check intersection hit bounds
    targetOptionDiamonds.forEach(diamond => {
        if(diamond.disabled) return;
        
        // Accurate bounding range overlap calculations
        const pxCenter = player.x + player.width / 2;
        if(pxCenter >= (diamond.x - diamond.width/2) && pxCenter <= (diamond.x + diamond.width/2)) {
            // Hit recorded!
            evaluateSelection(diamond);
        }
    });
}

function evaluateSelection(diamond) {
    if(diamond.isCorrect) {
        totalScore++;
        feedbackMessage = "✨ OUTSTANDING WORK, DETECTIVE! (Tap to Continue)";
        document.getElementById("correctSound").play().catch(()=>{});
        document.getElementById("clapSound").play().catch(()=>{});
        diamond.color = "#00ffcc";
        showContinuePrompt = true;
    } else {
        lives--;
        diamond.disabled = true;
        diamond.color = "#331122"; // Darken option out
        document.getElementById("wrongSound").play().catch(()=>{});
        
        if(lives <= 0) {
            feedbackMessage = `❌ CASE CLOSED! Solution was: ${activeQuizList[currentIndex].ans} (Tap to Continue)`;
            showContinuePrompt = true;
        } else {
            feedbackMessage = "❌ FALSE LEAD! Try your final life attempt!";
        }
    }
}

function nextStageFloor() {
    currentIndex++;
    if(currentIndex >= activeQuizList.length) {
        gameActive = false;
        document.getElementById("gameScreen").classList.remove("active");
        document.getElementById("endScreen").classList.add("active");
        document.getElementById("finalScoreDisplay").innerText = `Final Score: ${totalScore} / ${activeQuizList.length}`;
    } else {
        setupQuestionFloor();
    }
}

function restartEntireGame() {
    document.getElementById("endScreen").classList.remove("active");
    startGameArena();
}

/* ==========================================================================
   WORKSPACE UI GRAPHICS RENDER ENGINE
   ========================================================================== */
function renderGraphicsWorkspace() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 1. Draw Starfield
    ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
    backgroundStars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI*2);
        ctx.fill();
    });
    
    // 2. Draw HUD Header Layout Bar
    ctx.fillStyle = "rgba(20, 15, 61, 0.8)";
    ctx.fillRect(0, 0, canvas.width, 70);
    ctx.strokeStyle = "#00ffcc";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 70); ctx.lineTo(canvas.width, 70); ctx.stroke();
    
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px sans-serif";
    ctx.fillText(`STAGE: ${currentIndex + 1} / ${activeQuizList.length}`, 25, 42);
    ctx.fillText(`SCORE: ${totalScore}`, canvas.width / 2 - 40, 42);
    
    let hearts = "";
    for(let l=0; l<lives; l++) hearts += "❤️ ";
    ctx.fillText(`SHIELD: ${hearts}`, canvas.width - 150, 42);
    
    // 3. Render Question Display Banner
    const activeData = activeQuizList[currentIndex];
    ctx.fillStyle = "rgba(10, 5, 36, 0.9)";
    ctx.strokeStyle = "#8ac926";
    ctx.lineWidth = 3;
    
    const qw = Math.min(canvas.width * 0.85, 750);
    const qx = canvas.width / 2 - qw / 2;
    ctx.fillRect(qx, 100, qw, 70);
    ctx.strokeRect(qx, 100, qw, 70);
    
    ctx.fillStyle = "#ffffff";
    ctx.font = "16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(activeData.q, canvas.width / 2, 142, qw - 40);
    
    // 4. Render Floating Options (The Diamonds from image_800143)
    targetOptionDiamonds.forEach(diamond => {
        ctx.save();
        ctx.translate(diamond.x, diamond.y);
        
        // Draw glow paths effect
        ctx.shadowBlur = 15;
        ctx.shadowColor = diamond.color;
        
        ctx.fillStyle = diamond.color;
        ctx.beginPath();
        ctx.moveTo(0, -diamond.height / 2);
        ctx.lineTo(diamond.width / 2, 0);
        ctx.lineTo(0, diamond.height / 2);
        ctx.lineTo(-diamond.width / 2, 0);
        ctx.closePath();
        ctx.fill();
        
        ctx.restore();
        
        // Draw option text inside
        ctx.fillStyle = "#000000";
        ctx.font = "bold 15px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(diamond.text, diamond.x, diamond.y + 5, diamond.width - 20);
    });
    
    // 5. Draw Dynamic Action Notification Banners
    if(feedbackMessage !== "") {
        ctx.fillStyle = feedbackMessage.startsWith("✨") ? "#00ffcc" : "#ff595e";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(feedbackMessage, canvas.width / 2, canvas.height - 120);
    }
    
    // 6. Draw Player Asset Avatar (The Interactive Blue Box with white square inside)
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#00ffff";
    
    // Base blue ship container block
    ctx.fillStyle = "#00b4d8";
    ctx.fillRect(player.x, player.y, player.width, player.height);
    
    // Accent white inner display signal light window box
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(player.x + (player.width / 2) - 10, player.y + 8, 20, 15);
    
    ctx.restore();
    ctx.textAlign = "left"; // Reset defaults alignment
}
</script>
</body>
</html>
