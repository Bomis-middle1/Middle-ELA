<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conjunction Detective Quiz (Fixed)</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Segoe UI',sans-serif;
user-select:none;
}

body,html{
width:100%;
height:100%;
overflow:hidden;
background:#060414;
color:#fff;
}

/* SCREENS */
.screen{
display:none;
position:fixed;
inset:0;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
}
.screen.active{display:flex;}

/* LOGO */
#logoScreen{
background:#fff;
z-index:9999;
}
#logoScreen img{
width:220px;
}

/* INSTRUCTION */
#instructionScreen{
background:#0c0728;
}
.card{
background:rgba(20,15,61,0.95);
border:2px solid #00ffcc;
border-radius:20px;
padding:25px;
width:90%;
max-width:500px;
}

/* BUTTON */
button{
padding:14px 22px;
border:none;
border-radius:12px;
background:#ffb703;
font-weight:bold;
cursor:pointer;
}

/* CANVAS */
#gameCanvas{
width:100vw;
height:100vh;
display:block;
background:radial-gradient(circle,#0f0b36,#050312);
}

/* END */
#endScreen{
background:#0b0618;
}

</style>
</head>

<body>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
<img src="assets/innovine-logo.png">
</div>

<!-- INSTRUCTION -->
<div id="instructionScreen" class="screen">
<div class="card">
<h2>Conjunction Detective Quiz</h2>
<p>Tap correct answers. 10 questions. 2 chances per question.</p>
<button onclick="startGame()">START</button>
</div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
<canvas id="gameCanvas"></canvas>
</div>

<!-- END -->
<div id="endScreen" class="screen">
<div class="card">
<h1>🏆 Mission Complete</h1>
<p id="finalScore"></p>
<button onclick="location.reload()">Play Again</button>
</div>
</div>

<script>

/* =========================
QUESTIONS (FIXED SAFE FORMAT)
========================= */
const mcqs = [
{q:"Find the participle: The broken skateboard lay beside the ramp.",opts:["lay","beside","broken","ramp"],ans:2},
{q:"Which sentence contains a Conditional Conjunction?",opts:["I stayed home because it rained.","If you find the key, open the chest.","The player was tired but won.","The bike is faster than the scooter."],ans:1},
{q:"A robot made a grammar mistake. Which sentence is WRONG?",opts:["The tiger is stronger than the fox.","She studied so that she could pass.","Although he was hungry, he ate lunch.","If it rains, we will stay inside."],ans:2},
{q:"Purpose conjunction question",opts:["The knight trained so that he could defeat the dragon.","The knight trained because he was bored.","The knight trained although he was tired.","The knight trained and became stronger."],ans:0},
{q:"What does because do?",opts:["Shows comparison","Shows condition","Gives a reason","Extra info"],ans:2},
{q:"Type of that in sentence",opts:["Relative","Comparative","Coordinating","Conditional"],ans:0},
{q:"Coordinating conjunction",opts:["because she wanted","although she was tired","and improved speed","so that she could"],ans:2},
{q:"Odd one out",opts:["Although","Even though","Though","Because"],ans:3},
{q:"Same type pair",opts:["if, unless","and, although","because, than","that, but"],ans:0},
{q:"How many conjunction types?",opts:["One","Two","Three","Four"],ans:1}
];

/* =========================
CANVAS SETUP
========================= */
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

function resize(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
window.addEventListener("resize",resize);

/* =========================
STATE (FIXED)
========================= */
let index=0;
let score=0;
let lives=2;
let locked=false;
let order=[];

/* shuffle */
function shuffle(a){return a.sort(()=>Math.random()-0.5);}

/* =========================
FLOW
========================= */
setTimeout(()=>{
logoScreen.classList.remove("active");
instructionScreen.classList.add("active");
},5000);

/* =========================
START GAME
========================= */
function startGame(){
instructionScreen.classList.remove("active");
gameScreen.classList.add("active");

resize();

index=0;
score=0;

order=[...Array(mcqs.length).keys()];
shuffle(order);

loadQ();
loop();
}

/* =========================
LOAD QUESTION
========================= */
function loadQ(){
lives=2;
locked=false;
}

/* =========================
CLICK HANDLER (FIXED HITBOX)
========================= */
canvas.addEventListener("click",(e)=>{
if(locked) return;

const rect=canvas.getBoundingClientRect();
const x=e.clientX-rect.left;
const y=e.clientY-rect.top;

const q=mcqs[order[index]];
const w=canvas.width/2;
const h=70;

for(let i=0;i<q.opts.length;i++){
let ox=(i%2)*w + w/2;
let oy=canvas.height/2 + Math.floor(i/2)*120;

if(Math.abs(x-ox)<120 && Math.abs(y-oy)<40){
check(i);
}
}
});

/* =========================
CHECK ANSWER (FIXED LOGIC)
========================= */
function check(i){

if(locked) return;

const q=mcqs[order[index]];

const correct=q.ans;

if(i===correct){
score++;
correctSound.play();
locked=true;
setTimeout(next,900);
}else{
lives--;
wrongSound.play();

if(lives<=0){
locked=true;
setTimeout(next,900);
}
}
}

/* =========================
NEXT
========================= */
function next(){
index++;
if(index>=mcqs.length){
end();
}else{
loadQ();
}
}

/* =========================
RENDER LOOP
========================= */
function loop(){
ctx.clearRect(0,0,canvas.width,canvas.height);

const q=mcqs[order[index]];

/* question */
ctx.fillStyle="#fff";
ctx.font="20px Arial";
ctx.textAlign="center";
ctx.fillText(q.q,canvas.width/2,120);

/* options */
for(let i=0;i<q.opts.length;i++){
let x=(i%2)*(canvas.width/2)+canvas.width/4;
let y=canvas.height/2 + Math.floor(i/2)*120;

ctx.fillStyle="#1f2937";
ctx.fillRect(x-120,y-30,240,60);

ctx.fillStyle="#fff";
ctx.fillText(q.opts[i],x,y);
}

requestAnimationFrame(loop);
}

/* =========================
END
========================= */
function end(){
gameScreen.classList.remove("active");
endScreen.classList.add("active");

finalScore.innerText=`Score: ${score}/${mcqs.length}`;

clapSound.play();
}

</script>

</body>
</html>
