<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>🏰 Grammar Castle Adventure</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:linear-gradient(135deg,#0b1220,#111c2e,#0ea5e9);
color:white;
}

/* BACKGROUND */
body::before,body::after{
content:"";
position:fixed;
border-radius:50%;
background:rgba(255,255,255,0.05);
animation:float 10s infinite alternate;
}
body::before{width:280px;height:280px;left:-120px;top:-120px;}
body::after{width:220px;height:220px;right:-100px;bottom:-100px;}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(60px);}
}

/* SCREEN SYSTEM */
.screen{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}
.active{display:flex;}

/* SPLASH */
#splash{
background:white;
z-index:999;
}
#splash img{
width:220px;
}

/* TOPIC */
#topic{
background:linear-gradient(135deg,#6d28d9,#2563eb);
}
#topic h1{
font-size:42px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
padding:20px;
border-radius:18px;
width:92%;
max-width:700px;
}

/* BUTTON */
button{
padding:14px 20px;
border:none;
border-radius:14px;
background:#fbbf24;
font-weight:bold;
cursor:pointer;
}

/* GAME WRAP */
#hud{
display:flex;
justify-content:space-between;
width:100%;
max-width:900px;
font-weight:bold;
margin-bottom:10px;
}

.barOuter{
width:100%;
max-width:900px;
height:10px;
background:#1f2937;
border-radius:20px;
overflow:hidden;
margin-bottom:10px;
}

.barInner{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#facc15);
transition:0.3s;
}

#roomCard{
width:92%;
max-width:700px;
background:rgba(255,255,255,0.10);
padding:18px;
border-radius:18px;
}

#roomName{
color:#facc15;
margin-bottom:10px;
}

#question{
font-size:20px;
margin-bottom:15px;
line-height:1.4;
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.option{
background:white;
color:black;
padding:12px;
border-radius:12px;
cursor:pointer;
transition:0.2s;
font-weight:bold;
}

.option:hover{transform:scale(1.03);}

.correct{background:#22c55e!important;color:white;}
.wrong{background:#ef4444!important;color:white;}

/* MOBILE */
@media(max-width:768px){
.options{grid-template-columns:1fr;}
#topic h1{font-size:30px;}
}

/* CONFETTI */
canvas{
position:fixed;
inset:0;
pointer-events:none;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>

<!-- SPLASH -->
<div id="splash" class="screen active">
<img src="assets/innovine-logo.png" />
</div>

<!-- TOPIC -->
<div id="topic" class="screen">
<h1>🏰 Grammar Castle Adventure</h1>
</div>

<!-- MISSION -->
<div id="mission" class="screen">
<div class="card">
<h2>📜 Mission</h2>
<p>Answer all grammar challenges</p>
<button onclick="startGame()">START</button>
<br><br>
Volume <input id="vol" type="range" min="0" max="1" step="0.1" value="1">
</div>
</div>

<!-- GAME -->
<div id="game" class="screen">

<div id="hud">
<div id="room">Room 1/10</div>
<div id="score">Score: 0</div>
</div>

<div class="barOuter">
<div class="barInner" id="bar"></div>
</div>

<div id="roomCard">
<div id="roomName"></div>
<div id="question"></div>
<div class="options" id="options"></div>
</div>

</div>

<!-- END -->
<div id="end" class="screen">
<div class="card">
<h1>🏆 Completed!</h1>
<h2 id="final"></h2>
<button onclick="location.reload()">Play Again</button>
</div>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

/* ================= QUESTIONS (UNCHANGED CONTENT) ================= */
const questions=[
{
q:"Find the participle: The broken skateboard lay beside the ramp.",
opts:["lay","beside","broken","ramp"],
ans:2
},
{
q:"Which sentence contains a Conditional Conjunction?",
opts:["I stayed home because it rained.","If you find the key, open the chest.","The player was tired but won.","The bike is faster than the scooter."],
ans:1
},
{
q:"A robot made a grammar mistake. Which sentence is WRONG?",
opts:["The tiger is stronger than the fox.","She studied so that she could pass.","Although he was hungry, he ate lunch.","If it rains, we will stay inside."],
ans:2
},
{
q:"The knight purpose sentence?",
opts:["The knight trained so that he could defeat the dragon.","The knight trained because he was bored.","The knight trained although he was tired.","The knight trained and became stronger."],
ans:0
},
{
q:"What does because do?",
opts:["Shows comparison","Shows condition","Gives a reason","Extra info"],
ans:2
},
{
q:"Type of that in sentence",
opts:["Relative","Comparative","Coordinating","Conditional"],
ans:0
},
{
q:"Coordinating conjunction",
opts:["because she wanted","although she was tired","and improved speed","so that she could"],
ans:2
},
{
q:"Odd one out",
opts:["Although","Even though","Though","Because"],
ans:3
},
{
q:"Same type pair",
opts:["if, unless","and, although","because, than","that, but"],
ans:0
},
{
q:"How many conjunction types?",
opts:["One","Two","Three","Four"],
ans:1
}
];

/* ================= STATE ================= */
let index=0;
let score=0;
let attempts=2;
let order=[...Array(questions.length).keys()].sort(()=>Math.random()-0.5);

/* ================= FLOW ================= */
setTimeout(()=>{
splash.classList.remove("active");
topic.classList.add("active");
},5000);

setTimeout(()=>{
topic.classList.remove("active");
mission.classList.add("active");
},8000);

/* ================= START ================= */
function startGame(){
mission.classList.remove("active");
game.classList.add("active");
index=0;
score=0;
loadQ();
}

/* ================= LOAD ================= */
function loadQ(){
attempts=2;

let q=questions[order[index]];

room.innerText=`Room ${index+1}/10`;
score.innerText=`Score: ${score}`;

roomName.innerText="🏰 Castle Challenge";
question.innerHTML=q.q;

options.innerHTML="";

q.opts.forEach((o,i)=>{
let b=document.createElement("div");
b.className="option";
b.innerText=o;
b.onclick=()=>check(i,b,q.ans);
options.appendChild(b);
});

bar.style.width=(index/questions.length)*100+"%";
}

/* ================= CHECK ================= */
function check(i,b,ans){

let all=document.querySelectorAll(".option");
all.forEach(x=>x.style.pointerEvents="none");

let v=vol.value;
correctSound.volume=v;
wrongSound.volume=v;
clapSound.volume=v;

if(i===ans){
b.classList.add("correct");
correctSound.play();
score++;
launch();
setTimeout(next,1000);
}else{
b.classList.add("wrong");
wrongSound.play();
all[ans].classList.add("correct");

attempts--;

if(attempts<=0){
setTimeout(next,1000);
}else{
setTimeout(()=>all.forEach(x=>x.style.pointerEvents="auto"),500);
}
}

score.innerText=`Score: ${score}`;
}

/* ================= NEXT ================= */
function next(){
index++;
if(index<questions.length){
loadQ();
}else endGame();
}

/* ================= CONFETTI ================= */
function launch(){
let c=document.getElementById("confetti");
let ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

for(let i=0;i<100;i++){
ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
ctx.fillRect(Math.random()*c.width,Math.random()*c.height,6,6);
}
}

/* ================= END ================= */
function endGame(){
game.classList.remove("active");
end.classList.add("active");

final.innerText=`⭐ ${score}/${questions.length}`;
clapSound.play();
}

</script>

</body>
</html>
