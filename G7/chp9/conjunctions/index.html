<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conjunction Detective Case File</title>

<style>
:root {
    --bg-dark: #0f1016;
    --board-bg: #1e1e2f;
    --accent-gold: #ffd166;
    --evidence-card: #2b2b40;
    --text-light: #f4f4f9;
    --correct-green: #06d6a0;
    --wrong-red: #ef476f;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

body {
    margin: 0;
    padding: 0;
    font-family: 'Courier New', Courier, monospace;
    background: var(--bg-dark);
    color: var(--text-light);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
}

.screen {
    display: none;
    width: 100%;
    max-width: 600px;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

.active { display: flex; }

#logoScreen img {
    width: 70%;
    max-width: 220px;
    animation: pulse 1.5s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(0.95); opacity: 0.8; }
    to { transform: scale(1.05); opacity: 1; }
}

.title {
    font-size: 1.8rem;
    color: var(--accent-gold);
    text-transform: uppercase;
    margin-bottom: 15px;
    font-weight: bold;
}

.instructions-box {
    background: var(--board-bg);
    border-radius: 12px;
    padding: 20px;
    margin: 20px 0;
    text-align: left;
}

.game-container {
    background: var(--board-bg);
    border-radius: 16px;
    width: 100%;
    padding: 20px;
}

.options-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.evidence-card {
    background: var(--evidence-card);
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;
}

.correct { background: var(--correct-green) !important; }
.wrong { background: var(--wrong-red) !important; }

.action-btn {
    background: var(--accent-gold);
    padding: 15px 30px;
    border: none;
    border-radius: 30px;
    font-weight: bold;
    margin-top: 15px;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
    <img src="assets/innovine-logo.png">
</div>

<!-- INSTRUCTIONS -->
<div id="titleScreen" class="screen">
    <div class="title">🕵️ Conjunction Detective</div>
    <div class="instructions-box">
        Identify the correct conjunction type. You have 2 attempts per question.
    </div>
    <button class="action-btn" onclick="startGame()">Start</button>
</div>

<!-- GAME -->
<div id="quizScreen" class="screen">
    <div class="game-container">
        <div id="questionText"></div>
        <div class="options-grid" id="optionsBox"></div>
        <div id="statusMsg"></div>
    </div>
</div>

<!-- END -->
<div id="endScreen" class="screen">
    <h2 class="title">Completed</h2>
    <p id="finalScore"></p>
    <button class="action-btn" onclick="restartGame()">Play Again</button>
</div>

<!-- AUDIO (FIXED PATHS ✅) -->
<audio id="correctSound" src="assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="assets/clapping.mp3" preload="auto"></audio>

<script>
const masterMCQs = [
    {q:"Although it was midnight, the thief escaped. Type?",opts:["Coordinating","Relative","Concessive","Comparative"],ans:"Concessive"},
    {q:"Identify conditional sentence",opts:["I stayed because it rained.","If you find the key, open the chest.","He was tired but won.","Bike is faster."],ans:"If you find the key, open the chest."},
    {q:"Which is correct?",opts:["Tiger is stronger.","She studied so that she could pass.","Although hungry, he ate.","If it rains, we stay."],ans:"She studied so that she could pass."}
];

let questions=[],idx=0,score=0,attempts=0;

window.onload=()=>{
 setTimeout(()=>{
   logoScreen.classList.remove("active");
   titleScreen.classList.add("active");
 },5000);
};

function startGame(){
 document.getElementById("titleScreen").classList.remove("active");
 document.getElementById("quizScreen").classList.add("active");
 questions=[...masterMCQs].sort(()=>Math.random()-0.5);
 idx=0;score=0;
 loadQ();
}

function loadQ(){
 attempts=0;
 let q=questions[idx];
 questionText.innerText=q.q;
 optionsBox.innerHTML="";
 q.opts.sort(()=>Math.random()-0.5).forEach(o=>{
   let d=document.createElement("div");
   d.className="evidence-card";
   d.innerText=o;
   d.onclick=()=>check(o,d);
   optionsBox.appendChild(d);
 });
}

function check(opt,el){
 let q=questions[idx];
 if(el.classList.contains("correct")||el.classList.contains("wrong"))return;
 attempts++;

 if(opt===q.ans){
   el.classList.add("correct");
   score++;
   play("correctSound");
   setTimeout(next,1000);
 } else {
   el.classList.add("wrong");
   play("wrongSound");
   if(attempts>=2){
     document.querySelectorAll(".evidence-card").forEach(x=>{
       if(x.innerText===q.ans)x.classList.add("correct");
     });
     setTimeout(next,1500);
   }
 }
}

function next(){
 idx++;
 if(idx>=questions.length){
   endGame();
 } else loadQ();
}

function endGame(){
 quizScreen.classList.remove("active");
 endScreen.classList.add("active");
 finalScore.innerText=`Score: ${score}/${questions.length}`;
 play("clapSound");
}

function restartGame(){location.reload();}

function play(id){
 let a=document.getElementById(id);
 a.currentTime=0;
 a.play().catch(()=>{});
}
</script>

</body>
</html>
