<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Conjunction Detective Case File</title>

<style>
:root {
    --bg-dark: #0f1016;
    --board-bg: #1e1e2f;
    --accent-gold: #ffd166;
    --evidence-card: #2b2b40;
    --text-light: #f4f4f9;
    --correct-green: #06d6a0;
    --wrong-red: #ef476f;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial;
    background: var(--bg-dark);
    color: var(--text-light);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.screen { display: none; width: 100%; max-width: 600px; padding: 20px; }
.active { display: block; text-align: center; }

.title { color: var(--accent-gold); font-size: 22px; font-weight: bold; }

.instructions-box {
    background: var(--board-bg);
    padding: 15px;
    border-radius: 10px;
    margin: 15px 0;
    text-align: left;
}

.game-container {
    background: var(--board-bg);
    padding: 20px;
    border-radius: 12px;
}

.options-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.evidence-card {
    background: var(--evidence-card);
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
}

.correct { background: var(--correct-green) !important; }
.wrong { background: var(--wrong-red) !important; }

button {
    margin-top: 15px;
    padding: 12px 20px;
    border: none;
    border-radius: 25px;
    background: var(--accent-gold);
    font-weight: bold;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
    <img src="assets/innovine-logo.png" style="width:180px;">
</div>

<!-- INSTRUCTIONS -->
<div id="titleScreen" class="screen">
    <div class="title">🕵️ CONJUNCTION DETECTIVE</div>
    <div class="instructions-box">
        Identify the correct conjunction type.<br>
        You have 2 attempts per question.
    </div>
    <button onclick="startGame()">START</button>
</div>

<!-- GAME -->
<div id="quizScreen" class="screen">
    <div class="game-container">
        <div id="questionText"></div>
        <div class="options-grid" id="optionsBox"></div>
        <div id="statusMsg"></div>
    </div>
</div>

<!-- END -->
<div id="endScreen" class="screen">
    <h2 class="title">CASE CLOSED</h2>
    <p id="finalScore"></p>
    <button onclick="restartGame()">PLAY AGAIN</button>
</div>

<!-- AUDIO -->
<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

/* ✅ FINAL AUDITED QUESTION BANK */
const masterMCQs = [
{
q:`"Although it was midnight, the thief escaped." What type of conjunction is although?`,
opts:["Coordinating","Relative","Concessive","Comparative"],
ans:"Concessive"
},
{
q:`Identify the sentence containing a Conditional Conjunction.`,
opts:[
"I stayed home because it rained.",
"If you find the key, open the chest.",
"The player was tired but won.",
"The bike is faster than the scooter."
],
ans:"If you find the key, open the chest."
},
{
q:`A corrupt database script created a grammatical error. Which sentence uses the wrong conjunction?`,
opts:[
"The tiger is stronger than the fox.",
"She studied so that she could pass.",
"Almost he was hungry, he ate lunch.",
"If it rains, we will stay inside."
],
ans:"Almost he was hungry, he ate lunch."
},
{
q:`The high-security vault opens only with a Purpose Conjunction. Which sentence uses one?`,
opts:[
"The knight trained so that he could defeat the dragon.",
"The knight trained because he was bored.",
"The knight trained although he was tired.",
"The knight trained and became stronger."
],
ans:"The knight trained so that he could defeat the dragon."
},
{
q:`What does the conjunction because do?`,
opts:["Shows comparison","Shows condition","Gives a reason","Gives extra information"],
ans:"Gives a reason"
},
{
q:`The spaceship that landed here is invisible. What type of conjunction is that?`,
opts:["Relative","Comparative","Coordinating","Conditional"],
ans:"Relative"
},
{
q:`Which sentence contains a Coordinating Conjunction?`,
opts:[
"The runner trained because she wanted to win.",
"The runner trained although she was tired.",
"The runner trained and improved her speed.",
"The runner trained so that she could compete."
],
ans:"The runner trained and improved her speed."
},
{
q:`Which conjunction belongs to a different category?`,
opts:["Although","Even though","Though","Because"],
ans:"Because"
},
{
q:`Which pair belongs to the same type of conjunction?`,
opts:["if, unless","and, although","because, than","that, but"],
ans:"if, unless"
},
{
q:`How many different conjunction types are used in: "The wizard carried a map so that he could find the treasure, although the journey was dangerous."`,
opts:["One","Two","Three","Four"],
ans:"Two"
}

];

let questions=[],idx=0,score=0,attempts=0;

window.onload=()=>{
 setTimeout(()=>{
   logoScreen.classList.remove("active");
   titleScreen.classList.add("active");
 },5000);
};

function startGame(){
 titleScreen.classList.remove("active");
 quizScreen.classList.add("active");

 questions=[...masterMCQs].sort(()=>Math.random()-0.5);
 idx=0;score=0;
 loadQ();
}

function loadQ(){
 attempts=0;
 let q=questions[idx];

 questionText.innerText=q.q;
 optionsBox.innerHTML="";

 q.opts.sort(()=>Math.random()-0.5).forEach(o=>{
   let div=document.createElement("div");
   div.className="evidence-card";
   div.innerText=o;
   div.onclick=()=>check(o,div);
   optionsBox.appendChild(div);
 });
}

function check(opt,el){
 let q=questions[idx];

 if(el.classList.contains("correct")||el.classList.contains("wrong")) return;

 attempts++;

 if(opt===q.ans){
   el.classList.add("correct");
   score++;
   play("correctSound");
   setTimeout(next,1000);
 } else {
   el.classList.add("wrong");
   play("wrongSound");

   if(attempts>=2){
     document.querySelectorAll(".evidence-card").forEach(x=>{
       if(x.innerText===q.ans) x.classList.add("correct");
     });
     setTimeout(next,1500);
   }
 }
}

function next(){
 idx++;
 if(idx>=questions.length){
   endGame();
 } else loadQ();
}

function endGame(){
 quizScreen.classList.remove("active");
 endScreen.classList.add("active");
 finalScore.innerText = `Score: ${score}/${questions.length}`;
 play("clapSound");
}

function restartGame(){
 location.reload();
}

function play(id){
 let a=document.getElementById(id);
 a.currentTime=0;
 a.play().catch(()=>{});
}

</script>

</body>
</html>
