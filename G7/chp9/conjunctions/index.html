<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Conjunction Space Arcade</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, sans-serif;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050414;
    color:#fff;
}

/* SCREEN SYSTEM */
.screen{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}
.screen.active{display:flex;}

/* LOGO */
#logoScreen{
    background:#fff;
    z-index:9999;
}
#logoScreen img{
    width:260px;
    max-width:80%;
}

/* INSTRUCTIONS */
#instructionScreen{
    background:#0c0728;
}
.card{
    width:90%;
    max-width:520px;
    background:rgba(20,15,61,0.95);
    border:2px solid #00ffcc;
    border-radius:20px;
    padding:24px;
    text-align:center;
}
.card h1{
    color:#ffd60a;
    margin-bottom:10px;
}
.card p{
    color:#cfc7ff;
    margin-bottom:20px;
    line-height:1.5;
}
button{
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#ffb703;
    font-weight:bold;
    cursor:pointer;
}

/* GAME */
#gameScreen{
    background:radial-gradient(circle,#0f0b36,#050312);
}
canvas{
    width:100%;
    height:100%;
    display:block;
}

/* OVERLAY */
#overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
}
.hitbox{
    position:absolute;
    pointer-events:auto;
}

/* END */
#endScreen{
    background:rgba(0,0,0,0.85);
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="correctSound" src="./assets/correct.mp3"></audio>
<audio id="wrongSound" src="./assets/wrong.mp3"></audio>
<audio id="clapSound" src="./assets/clapping.mp3"></audio>

<!-- LOGO -->
<div id="logoScreen" class="screen active">
    <img src="./assets/innovine-logo.png" />
</div>

<!-- INSTRUCTIONS -->
<div id="instructionScreen" class="screen">
    <div class="card">
        <h1>Conjunction Space Arcade</h1>
        <p>Move the ship and choose the correct answer. You get 2 attempts per question.</p>
        <button onclick="startGame()">Start</button>
    </div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen">
    <canvas id="canvas"></canvas>
    <div id="overlay"></div>
</div>

<!-- END -->
<div id="endScreen" class="screen">
    <div class="card">
        <h1>Mission Complete</h1>
        <p id="scoreText"></p>
        <button onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
/* ---------------- DATA ---------------- */
const originalMCQ = [
{q:"Find the participle: The broken skateboard lay beside the ramp.",opts:["lay","beside","broken","ramp"],ans:"broken"},
{q:"Which sentence contains a conditional conjunction?",opts:["I stayed home because it rained.","If you find the key, open the chest.","The player was tired but won.","The bike is faster than the scooter."],ans:"If you find the key, open the chest."},
{q:"A robot made a grammar mistake. Which sentence is WRONG?",opts:["The tiger is stronger than the fox.","She studied so that she could pass.","Although he was hungry, he ate lunch.","If it rains, we will stay inside."],ans:"Although he was hungry, he ate lunch."},
{q:"What does because show?",opts:["comparison","condition","reason","extra info"],ans:"reason"},
{q:"Which is coordinating conjunction?",opts:["and","because","although","if"],ans:"and"},
{q:"Which is different?",opts:["although","but","though","because"],ans:"because"},
{q:"Choose correct sentence",opts:["He run fast","He runs fast","He running fast","He runned fast"],ans:"He runs fast"},
{q:"Identify conjunction",opts:["and","run","blue","fast"],ans:"and"}
];

function shuffle(arr){
    return [...arr].sort(()=>Math.random()-0.5);
}

/* ---------------- STATE ---------------- */
let mcq = [];
let index = 0;
let score = 0;
let attempts = 2;
let gameActive = false;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");

let w,h;

/* ship */
let ship = {x:100,y:100,targetX:100,speed:18};

/* options */
let options = [];

/* ---------------- INIT ---------------- */
window.onload = () => {
    mcq = shuffle(originalMCQ);   // random each play
    resize();

    setTimeout(()=>{
        document.getElementById("logoScreen").classList.remove("active");
        document.getElementById("instructionScreen").classList.add("active");
    },5000);
};

window.addEventListener("resize",resize);

function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    ship.y = h - 80;
}

/* ---------------- START ---------------- */
function startGame(){
    document.getElementById("instructionScreen").classList.remove("active");
    document.getElementById("gameScreen").classList.add("active");
    gameActive = true;
    index = 0;
    score = 0;
    loadQ();
    loop();
}

/* ---------------- LOAD QUESTION ---------------- */
function loadQ(){
    overlay.innerHTML = "";
    attempts = 2;

    if(index >= mcq.length){
        endGame();
        return;
    }

    let q = mcq[index];
    options = shuffle(q.opts);

    let gap = w / options.length;

    options.forEach((t,i)=>{
        let div = document.createElement("div");
        div.className="hitbox";
        div.style.left = (gap*i + gap/2 - 60)+"px";
        div.style.top = (h/2)+"px";
        div.style.width="120px";
        div.style.height="70px";

        div.onclick = () => select(t, q.ans);

        overlay.appendChild(div);
    });
}

/* ---------------- SELECT ---------------- */
function select(choice, answer){
    if(!gameActive) return;

    if(choice === answer){
        score++;
        document.getElementById("correctSound").play().catch(()=>{});
        document.getElementById("clapSound").play().catch(()=>{});
        index++;
        loadQ();
    }else{
        attempts--;
        document.getElementById("wrongSound").play().catch(()=>{});
        if(attempts<=0){
            index++;
            loadQ();
        }
    }
}

/* ---------------- LOOP ---------------- */
function loop(){
    if(!gameActive) return;

    ctx.clearRect(0,0,w,h);

    // ship follow
    ship.x += (ship.targetX - ship.x)*0.1;

    ctx.fillStyle="#00b4d8";
    ctx.fillRect(ship.x, ship.y, 60, 40);

    requestAnimationFrame(loop);
}

/* ---------------- END ---------------- */
function endGame(){
    gameActive=false;
    document.getElementById("gameScreen").classList.remove("active");
    document.getElementById("endScreen").classList.add("active");
    document.getElementById("scoreText").innerText = `Score: ${score} / ${mcq.length}`;
}

/* ---------------- RESTART ---------------- */
function restartGame(){
    document.getElementById("endScreen").classList.remove("active");
    mcq = shuffle(originalMCQ);
    startGame();
}
</script>

</body>
</html>
