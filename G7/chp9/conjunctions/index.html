<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
<title>Conjunction Detective Quiz</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

body, html {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #060414;
    color: #fff;
}

/* SCREEN MANAGEMENT */
.screen {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.screen.active { display: flex; }

/* LOGO INTRO SCREEN (STRICT 5s) */
#logoScreen { background: #ffffff; z-index: 9999; }
.logo-container { width: 280px; max-width: 80%; }
.logo-container img { width: 100%; height: auto; display: block; }

/* INSTRUCTIONS SCREEN */
#instructionScreen { background: #0c0728; }
.panel-card {
    background: rgba(20, 15, 61, 0.95);
    border: 2px solid #00ffcc;
    border-radius: 24px;
    padding: 35px 24px;
    max-width: 480px;
    width: 90%;
    text-align: center;
    box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
}
.panel-card h1 { color: #ffd60a; margin-bottom: 15px; font-size: 26px; }
.panel-card p { color: #a49fc4; line-height: 1.6; margin-bottom: 25px; }

/* GAME PLAYGROUND LAYOUT */
#gameScreen { 
    background: radial-gradient(circle at center, #0f0b36 0%, #050312 100%);
    justify-content: flex-start;
    padding-top: 90px;
}

/* HUD HEADER LAYOUT BAR */
.hud-bar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: rgba(20, 15, 61, 0.85);
    border-bottom: 2px solid #00ffcc;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    font-weight: bold;
    font-size: 15px;
    z-index: 20;
}

/* QUESTION DISPLAY BANNER */
.question-banner {
    background: rgba(10, 5, 36, 0.95);
    border: 3px solid #ffca3a;
    border-radius: 12px;
    width: 90%;
    max-width: 750px;
    padding: 20px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 50px;
    z-index: 20;
}

/* OPTIONS GRID HOUSING */
.options-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    width: 95%;
    max-width: 1000px;
    flex-wrap: wrap;
    margin-top: 20px;
    z-index: 20;
}

/* THE FLOATING DIAMOND NATIVE BUTTONS */
.diamond-option {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s, filter 0.2s;
}

.diamond-shape {
    position: absolute;
    width: 100%;
    height: 100%;
    transform: rotate(45deg);
    border-radius: 8px;
    box-shadow: 0 0 20px var(--glow-color);
    background-color: var(--glow-color);
    z-index: 1;
}

.diamond-text {
    position: relative;
    z-index: 2;
    color: #000000;
    font-weight: bold;
    font-size: 15px;
    text-align: center;
    padding: 10px;
    word-break: break-word;
}

.diamond-option:active {
    transform: scale(0.92);
}

.diamond-option.disabled {
    pointer-events: none;
    filter: grayscale(1) brightness(0.4);
}

/* DYNAMIC FEEDBACK BANNER */
.feedback-banner {
    margin-top: 50px;
    font-size: 18px;
    font-weight: bold;
    text-align: center;
    min-height: 30px;
    z-index: 20;
}

/* OVERLAY ACTION INTERFACES */
.action-btn {
    padding: 14px 28px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ffb703, #fb8500);
    color: #fff;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(251, 133, 0, 0.4);
    transition: transform 0.1s;
}
.action-btn:active { transform: scale(0.95); }

#endScreen { background: rgba(5, 3, 18, 0.95); }
</style>
</head>
<body>

<audio id="correctSound" src="Middle-ELA/G7/chp9/conjunctions/assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="Middle-ELA/G7/chp9/conjunctions/assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="Middle-ELA/G7/chp9/conjunctions/assets/clapping.mp3" preload="auto"></audio>

<div id="logoScreen" class="screen active">
    <div class="logo-container">
        <img src="Middle-ELA/G7/chp9/conjunctions/assets/innovine-logo.png" alt="Logo">
    </div>
</div>

<div id="instructionScreen" class="screen">
    <div class="panel-card">
        <h1>🔍 Conjunction Detective Quiz</h1>
        <p>Read the sentence in the top panel box, then tap or click directly on any matching color diamond choice to record your answer instantly!</p>
        <button class="action-btn" onclick="startGameArena()">Begin Mission</button>
    </div>
</div>

<div id="gameScreen" class="screen" onclick="handleScreenAdvance()">
    <div class="hud-bar">
        <div id="hudStage">STAGE: 1 / 10</div>
        <div id="hudScore">SCORE: 0</div>
        <div id="hudShield">SHIELD: ❤️ ❤️</div>
    </div>
    
    <div id="questionText" class="question-banner">Loading clues...</div>
    
    <div id="optionsContainer" class="options-container">
        </div>
    
    <div id="feedbackMessage" class="feedback-banner"></div>
</div>

<div id="endScreen" class="screen">
    <div class="panel-card">
        <h1 style="font-size: 40px;">🏆</h1>
        <h1>Mission Cleared</h1>
        <p id="finalScoreDisplay" style="font-size: 18px; margin: 15px 0; font-weight: bold;"></p>
        <button class="action-btn" onclick="restartEntireGame()">Play Again</button>
    </div>
</div>

<script>
const mcqs = [
    {q:'Find the participle: "The broken skateboard lay beside the ramp."',opts:["lay","beside","broken","ramp"],ans:"broken"},
    {q:'Which sentence contains a Conditional Conjunction?',opts:["I stayed home because it rained.","If you find the key, open the chest.","The player was tired but won.","The bike is faster than the scooter."],ans:"If you find the key, open the chest."},
    {q:'A robot made a grammar mistake. Which sentence is WRONG?',opts:["The tiger is stronger than the fox.","She studied so that she could pass.","Although he was hungry, he ate lunch.","If it rains, we will stay inside."],ans:"Although he was hungry, he ate lunch."},
    {q:'The door opens only if you choose the sentence with a Purpose Conjunction.',opts:["The knight trained so that he could defeat the dragon.","The knight trained because he was bored.","The knight trained although he was tired.","The knight trained and became stronger."],ans:"The knight trained so that he could defeat the dragon."},
    {q:'What does the conjunction because do?',opts:["Shows comparison","Shows condition","Gives a reason","Gives extra information"],ans:"Gives a reason"},
    {q:'The alien says: "The spaceship that landed here is invisible." What type of conjunction is that?',opts:["Relative","Comparative","Coordinating","Conditional"],ans:"Relative"},
    {q:'Which sentence uses a Coordinating Conjunction?',opts:["The runner trained because she wanted to win.","The runner trained although she was tired.","The runner trained and improved her speed.","The runner trained so that she could compete."],ans:"The runner trained and improved her speed."},
    {q:'Which conjunction belongs to a DIFFERENT category?',opts:["Although","Even though","Though","Because"],ans:"Because"},
    {q:'Which pair belongs to the same conjunction type?',opts:["if, unless","and, although","because, than","that, but"],ans:"if, unless"},
    {q:'Read the sentence: "The wizard carried a map so that he could find the treasure, although the journey was dangerous." How many conjunction types are used?',opts:["One","Two","Three","Four"],ans:"Two"}
];

let activeQuizList = [];
let currentIndex = 0;
let totalScore = 0;
let lives = 2;
let showContinuePrompt = false;

window.onload = () => {
    setTimeout(() => {
        document.getElementById('logoScreen').classList.remove('active');
        document.getElementById('instructionScreen').classList.add('active');
    }, 5000);
};

function startGameArena() {
    document.getElementById('instructionScreen').classList.remove('active');
    document.getElementById('gameScreen').classList.add('active');
    
    activeQuizList = [...mcqs];
    currentIndex = 0;
    totalScore = 0;
    
    setupQuestionFloor();
}

function setupQuestionFloor() {
    lives = 2;
    showContinuePrompt = false;
    
    const activeData = activeQuizList[currentIndex];
    
    // Update HUD display labels
    document.getElementById("hudStage").innerText = `STAGE: ${currentIndex + 1} / ${activeQuizList.length}`;
    document.getElementById("hudScore").innerText = `SCORE: ${totalScore}`;
    document.getElementById("hudShield").innerText = `SHIELD: ${"❤️ ".repeat(lives)}`;
    document.getElementById("questionText").innerText = activeData.q;
    document.getElementById("feedbackMessage").innerText = "";
    
    // Setup and render Native HTML Diamond option buttons
    const container = document.getElementById("optionsContainer");
    container.innerHTML = "";
    
    const itemColors = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4"];
    
    activeData.opts.forEach((text, idx) => {
        const optionColor = itemColors[idx % itemColors.length];
        
        const optElement = document.createElement("div");
        optElement.className = "diamond-option";
        optElement.style.setProperty("--glow-color", optionColor);
        
        optElement.innerHTML = `
            <div class="diamond-shape"></div>
            <div class="diamond-text">${text}</div>
        `;
        
        // Native independent event handler context
        optElement.addEventListener("click", (e) => {
            e.stopPropagation(); // Avoid triggering global screen advance click
            if (!showContinuePrompt) {
                evaluateSelection(text, optElement);
            }
        });
        
        container.appendChild(optElement);
    });
}

function evaluateSelection(selectedText, element) {
    const activeData = activeQuizList[currentIndex];
    const feedbackEl = document.getElementById("feedbackMessage");
    
    if (selectedText === activeData.ans) {
        totalScore++;
        document.getElementById("hudScore").innerText = `SCORE: ${totalScore}`;
        feedbackEl.style.color = "#00ffcc";
        feedbackEl.innerText = "✨ OUTSTANDING WORK! (Tap anywhere to continue)";
        
        document.getElementById("correctSound").play().catch(()=>{});
        document.getElementById("clapSound").play().catch(()=>{});
        
        // Highlight chosen option container green 
        element.style.setProperty("--glow-color", "#00ffcc");
        showContinuePrompt = true;
    } else {
        lives--;
        document.getElementById("hudShield").innerText = `SHIELD: ${"❤️ ".repeat(lives)}`;
        element.classList.add("disabled"); // Disable visual styling
        document.getElementById("wrongSound").play().catch(()=>{});
        
        if (lives <= 0) {
            feedbackEl.style.color = "#ff595e";
            feedbackEl.innerText = `❌ CASE CLOSED! Solution was: ${activeData.ans} (Tap anywhere)`;
            showContinuePrompt = true;
        } else {
            feedbackEl.style.color = "#ffca3a";
            feedbackEl.innerText = "❌ FALSE LEAD! Try your final life attempt!";
        }
    }
}

function handleScreenAdvance() {
    if (!showContinuePrompt) return;
    
    currentIndex++;
    if (currentIndex >= activeQuizList.length) {
        document.getElementById("gameScreen").classList.remove("active");
        document.getElementById("endScreen").classList.add("active");
        document.getElementById("finalScoreDisplay").innerText = `Final Score: ${totalScore} / ${activeQuizList.length}`;
    } else {
        setupQuestionFloor();
    }
}

function restartEntireGame() {
    document.getElementById("endScreen").classList.remove("active");
    startGameArena();
}
</script>
</body>
</html>
