<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conjunction Detective Game</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#140f3d;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
height:100vh;
}

.screen{
display:none;
width:100%;
height:100%;
align-items:center;
justify-content:center;
flex-direction:column;
text-align:center;
padding:15px;
box-sizing:border-box;
}

.active{display:flex;}

/* LOGO */
#logoScreen img{
width:220px;
animation:pop 1s ease;
}

@keyframes pop{
from{transform:scale(0.6);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* TITLE */
.title{
font-size:34px;
color:#ffd60a;
text-shadow:2px 2px 4px #000;
margin:10px 0;
}

/* GAME BOX */
#questionBox{
background:#fff4d6;
color:#2d2340;
padding:15px;
border-radius:12px;
width:95%;
max-width:500px;
text-align:left;
}

button{
padding:12px;
margin:8px 0;
border-radius:12px;
border:none;
background:#ffb703;
font-weight:bold;
cursor:pointer;
width:100%;
font-size:15px;
}

.option{
background:#d8f3dc;
padding:10px;
margin:8px 0;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.correct{background:#b7efc5;}
.wrong{background:#ffccd5;}

#feedback{
margin-top:10px;
font-weight:bold;
min-height:20px;
}

/* SCORE */
#scoreBoard{
margin:10px 0;
font-weight:bold;
}

/* END */
#endScreen{
text-align:center;
}

.trophy{
font-size:70px;
}

/* CONFETTI */
.confetti{
position:fixed;
width:8px;
height:8px;
top:-10px;
animation:fall 2s linear forwards;
}

@keyframes fall{
to{
transform:translateY(100vh) rotate(360deg);
opacity:0;
}
}
</style>
</head>

<body>

<!-- 🔵 LOGO (5 sec) -->
<div id="logoScreen" class="screen active">
  <img src="Middle-ELA/G7/chp9/conjunctions/assets/innovine-logo.png">
</div>

<!-- 🟡 TITLE (3 sec) -->
<div id="titleScreen" class="screen">
  <div class="title">✨ Conjunction Detective Game ✨</div>
</div>

<!-- 🟢 GAME -->
<div id="quizScreen" class="screen">

<div class="title">Conjunction Detective</div>

<div id="scoreBoard">Question 1 of 10 | Score: 0 / 10</div>

<div id="questionBox">
  <div id="questionText"></div>
  <div id="optionsBox"></div>
  <div id="feedback"></div>
</div>

</div>

<!-- 🏆 END -->
<div id="endScreen" class="screen">
  <div class="trophy">🏆</div>
  <h2>Mission Complete!</h2>
  <p id="finalScore"></p>
  <button onclick="restartGame()">Play Again</button>
</div>

<!-- AUDIO (FIXED PATHS) -->
<audio id="correctSound" src="Middle-ELA/G7/chp9/conjunctions/assets/correct.mp3"></audio>
<audio id="wrongSound" src="Middle-ELA/G7/chp9/conjunctions/assets/wrong.mp3"></audio>
<audio id="clapSound" src="Middle-ELA/G7/chp9/conjunctions/assets/clapping.mp3"></audio>

<script>

/* ================= SPLASH FLOW ================= */
window.onload = () => {

setTimeout(() => {
document.getElementById("logoScreen").classList.remove("active");
document.getElementById("titleScreen").classList.add("active");
}, 5000);

setTimeout(() => {
document.getElementById("titleScreen").classList.remove("active");
document.getElementById("quizScreen").classList.add("active");
showQuestion();
}, 8000);

};

/* ================= QUESTIONS (UNCHANGED) ================= */
const mcqs=[
{q:'A detective finds this clue: "Although it was midnight, the thief escaped." What type of conjunction is although?',opts:["Coordinating","Relative","Concessive","Comparative"],ans:"Concessive"},
{q:'Which sentence contains a Conditional Conjunction?',opts:["I stayed home because it rained.","If you find the key, open the chest.","The player was tired but won.","The bike is faster than the scooter."],ans:"If you find the key, open the chest."},
{q:'A robot made a grammar mistake. Which sentence is WRONG?',opts:["The tiger is stronger than the fox.","She studied so that she could pass.","Although he was hungry, he ate lunch.","If it rains, we will stay inside."],ans:"Although he was hungry, he ate lunch."},
{q:'The door opens only if you choose the sentence with a Purpose Conjunction.',opts:["The knight trained so that he could defeat the dragon.","The knight trained because he was bored.","The knight trained although he was tired.","The knight trained and became stronger."],ans:"The knight trained so that he could defeat the dragon."},
{q:'What does the conjunction because do?',opts:["Shows comparison","Shows condition","Gives a reason","Gives extra information"],ans:"Gives a reason"},
{q:'The alien says: "The spaceship that landed here is invisible." What type of conjunction is that?',opts:["Relative","Comparative","Coordinating","Conditional"],ans:"Relative"},
{q:'Which sentence uses a Coordinating Conjunction?',opts:["The runner trained because she wanted to win.","The runner trained although she was tired.","The runner trained and improved her speed.","The runner trained so that she could compete."],ans:"The runner trained and improved her speed."},
{q:'Which conjunction belongs to a DIFFERENT category?',opts:["Although","Even though","Though","Because"],ans:"Because"},
{q:'Which pair belongs to the same conjunction type?',opts:["if, unless","and, although","because, than","that, but"],ans:"if, unless"},
{q:'Read the sentence: "The wizard carried a map so that he could find the treasure, although the journey was dangerous." How many conjunction types are used?',opts:["One","Two","Three","Four"],ans:"Two"}
];

let i=0;
let score=0;

/* ================= SHOW ================= */
function showQuestion(){

let q = mcqs[i];

document.getElementById("questionText").innerText = q.q;

let box = document.getElementById("optionsBox");
box.innerHTML = "";

q.opts.forEach(opt=>{
let div=document.createElement("div");
div.className="option";
div.innerText=opt;
div.onclick=()=>check(opt,div);
box.appendChild(div);
});

document.getElementById("scoreBoard").innerText =
`Question ${i+1} of ${mcqs.length} | Score: ${score} / 10`;

}

/* ================= CHECK ================= */
function check(opt,el){

let q = mcqs[i];
let options=document.querySelectorAll(".option");

options.forEach(o=>o.onclick=null);

if(opt===q.ans){
el.classList.add("correct");
score++;
document.getElementById("correctSound").play().catch(()=>{});
confetti();
}
else{
el.classList.add("wrong");
document.getElementById("wrongSound").play().catch(()=>{});
}

setTimeout(next,1200);
}

/* ================= NEXT ================= */
function next(){
i++;

if(i>=mcqs.length){
endGame();
return;
}

showQuestion();
}

/* ================= END ================= */
function endGame(){

document.getElementById("quizScreen").classList.remove("active");
document.getElementById("endScreen").classList.add("active");

document.getElementById("finalScore").innerText =
`You scored ${score} / ${mcqs.length}`;

document.getElementById("clapSound").play().catch(()=>{});
}

/* ================= RESTART ================= */
function restartGame(){
location.reload();
}

/* ================= CONFETTI ================= */
function confetti(){
for(let j=0;j<40;j++){
let c=document.createElement("div");
c.className="confetti";
c.style.left=Math.random()*100+"vw";
c.style.background=["#ff0","#0ff","#f0f","#0f0","#f60"][Math.floor(Math.random()*5)];
document.body.appendChild(c);
setTimeout(()=>c.remove(),2000);
}
}

</script>

</body>
</html>
