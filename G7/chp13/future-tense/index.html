<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Tense Space Race FIXED</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0b1d51;
color:#fff;
overflow:hidden;
}

#logoScreen,#gameScreen,#endScreen{
display:none;
width:100%;
height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
}

#logoScreen img{
width:200px;
}

/* GAME UI */
h1{text-align:center;color:#ffd60a;margin:10px;}

#scoreText{margin:10px;font-size:20px;}
#questionText{text-align:center;margin:10px;}

#options{
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
margin-top:10px;
}

.option{
background:#ff6f61;
padding:10px 20px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
width:80%;
text-align:center;
}

.option.correct{background:#4caf50;}
.option.wrong{background:#e53935;}

/* TRACK */
#track{
position:relative;
width:90%;
height:150px;
background:#222;
border:2px solid #fff;
margin-top:20px;
overflow:hidden;
}

/* FIXED SPACESHIP */
#spaceship{
position:absolute;
bottom:10px;
left:0px;
width:60px;
transition:left 0.6s ease;
}

/* END */
#endScreen{text-align:center;}

button{
padding:10px 16px;
margin-top:20px;
border-radius:10px;
border:none;
background:#ff6f61;
color:#fff;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
<img src="assets/innovine-logo.png">
<h2>Launching Mission...</h2>
</div>

<!-- GAME -->
<div id="gameScreen">
<h1>Future Tense Space Race</h1>

<div id="scoreText">Score: 0</div>
<div id="questionText"></div>
<div id="options"></div>

<div id="track">
<img id="spaceship" src="assets/spaceship.png"
onerror="this.src='https://img.icons8.com/color/96/rocket.png'">
</div>
</div>

<!-- END -->
<div id="endScreen">
<h1>Mission Complete!</h1>
<p id="finalScore"></p>
<button onclick="restartGame()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

/* ================= DATA ================= */
const sentences=[
{q:"Which sentence is Simple Future?",a:"I will visit Paris next summer.",
options:["I will visit Paris next summer.","She will be reading when I arrive.","They will have finished homework by 8 PM."]},

{q:"Which sentence is Future Continuous?",a:"She will be reading when I arrive.",
options:["She will be reading when I arrive.","I will visit Paris next summer.","We will have completed project by Friday."]},

{q:"Which sentence is Future Perfect?",a:"They will have finished their homework by 8 PM.",
options:["They will have finished their homework by 8 PM.","He will travel tomorrow.","I will be studying at 10 AM."]},

{q:"Which sentence is Simple Future?",a:"He will travel to London tomorrow.",
options:["He will travel to London tomorrow.","I will have sent the email before lunch.","They will be playing football at 5 PM."]}
];

let current=0;
let score=0;

/* IMPORTANT FIX */
let shipPosition = 0;

/* DOM */
const ship=document.getElementById("spaceship");
const track=document.getElementById("track");

/* ================= START ================= */
setTimeout(()=>{
document.getElementById("logoScreen").style.display="none";
document.getElementById("gameScreen").style.display="flex";
loadQ();
},5000);

/* ================= LOAD QUESTION ================= */
function loadQ(){

if(current>=sentences.length){
endGame();
return;
}

let q=sentences[current];

document.getElementById("questionText").innerText=q.q;
document.getElementById("scoreText").innerText="Score: "+score;

let box=document.getElementById("options");
box.innerHTML="";

q.options.forEach(opt=>{
let div=document.createElement("div");
div.className="option";
div.innerText=opt;

div.onclick=()=>check(opt,div,q.a);

box.appendChild(div);
});
}

/* ================= CHECK ================= */
function check(selected,btn,correct){

if(selected===correct){
score++;
btn.classList.add("correct");
document.getElementById("correctSound").play();
moveShip();
}else{
btn.classList.add("wrong");
document.getElementById("wrongSound").play();
}

setTimeout(()=>{
current++;
loadQ();
},700);
}

/* ================= FIXED SHIP MOVEMENT ================= */
function moveShip(){

let max=track.offsetWidth - 70;

/* STEP PER QUESTION */
let step = max / sentences.length;

shipPosition += step;

if(shipPosition > max){
shipPosition = max;
}

ship.style.left = shipPosition + "px";
}

/* ================= END ================= */
function endGame(){

document.getElementById("gameScreen").style.display="none";
document.getElementById("endScreen").style.display="flex";

document.getElementById("clapSound").play();

document.getElementById("finalScore").innerText=
`Score: ${score} / ${sentences.length}`;
}

/* ================= RESTART ================= */
function restartGame(){
current=0;
score=0;
shipPosition=0;

ship.style.left="0px";

document.getElementById("endScreen").style.display="none";
document.getElementById("gameScreen").style.display="flex";

loadQ();
}

</script>

</body>
</html>
