<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Tense Space Race</title>
<style>
body{margin:0;font-family:Arial;background:#0b1d51;color:#fff;overflow:hidden;}
#logoScreen,#gameScreen,#endScreen{display:none;width:100%;height:100vh;align-items:center;justify-content:center;flex-direction:column;}
#logoScreen img{width:200px;margin-top:40px;}
h1{text-align:center;color:#ffd60a;margin:10px;}
#scoreText{font-size:20px;margin:10px;}
#questionText{text-align:center;margin:10px;font-size:18px;}
#options{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:15px;}
.option{background:#ff6f61;padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:bold;width:80%;text-align:center;}
.option.correct{background:#4caf50;}
.option.wrong{background:#e53935;}
#track{position:relative;width:90%;height:100px;background:#222;border:2px solid #fff;margin-top:20px;overflow:hidden;}
#spaceship{position:absolute;bottom:5px;left:0px;width:60px;transition:left 0.6s ease;}
button{padding:10px 16px;margin-top:20px;border-radius:10px;border:none;background:#ff6f61;color:#fff;font-weight:bold;cursor:pointer;}
#endScreen{text-align:center;}
</style>
</head>
<body>

<div id="logoScreen">
<img src="assets/innovine-logo.png">
<h2>Launching Mission...</h2>
</div>

<div id="gameScreen">
<h1>Future Tense Space Race</h1>
<div id="scoreText">Score: 0</div>
<div id="questionText"></div>
<div id="options"></div>
<div id="track">
<img id="spaceship" src="assets/spaceship.png" onerror="this.src='https://img.icons8.com/color/96/rocket.png'">
</div>
</div>

<div id="endScreen">
<h1>Mission Complete!</h1>
<p id="finalScore"></p>
<button onclick="restartGame()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>
// Questions
const sentences=[
{q:"Which sentence is Simple Future?",a:"I will visit Paris next summer.",options:["I will visit Paris next summer.","She will be reading when I arrive.","They will have finished homework by 8 PM."]},
{q:"Which sentence is Future Continuous?",a:"She will be reading when I arrive.",options:["She will be reading when I arrive.","I will visit Paris next summer.","We will have completed project by Friday."]},
{q:"Which sentence is Future Perfect?",a:"They will have finished homework by 8 PM.",options:["They will have finished homework by 8 PM.","He will travel tomorrow.","I will be studying at 10 AM."]},
{q:"Which sentence is Simple Future?",a:"He will travel to London tomorrow.",options:["He will travel to London tomorrow.","I will have sent the email before lunch.","They will be playing football at 5 PM."]},
{q:"Which sentence is Future Continuous?",a:"I will be studying at 10 AM.",options:["I will be studying at 10 AM.","She will attend meeting next week.","He will call after dinner."]},
{q:"Which sentence is Future Perfect?",a:"We will have completed the project by Friday.",options:["We will have completed the project by Friday.","I will visit Paris next summer.","She will be reading when I arrive."]},
{q:"Which sentence is Simple Future?",a:"She will attend the meeting next week.",options:["She will attend the meeting next week.","They will be playing football at 5 PM.","I will have sent the email before lunch."]},
{q:"Which sentence is Future Continuous?",a:"They will be playing football at 5 PM.",options:["They will be playing football at 5 PM.","I will call you after dinner.","We will have completed project by Friday."]},
{q:"Which sentence is Future Perfect?",a:"I will have sent the email before lunch.",options:["I will have sent the email before lunch.","She will attend meeting next week.","He will travel to London tomorrow."]},
{q:"Which sentence is Simple Future?",a:"He will call you after dinner.",options:["He will call you after dinner.","I will be studying at 10 AM.","They will have finished homework by 8 PM."]},
{q:"Which sentence is Future Continuous?",a:"She will be attending the class tomorrow.",options:["She will be attending the class tomorrow.","I will visit Paris next summer.","We will have completed project by Friday."]},
{q:"Which sentence is Future Perfect?",a:"They will have submitted the report by 5 PM.",options:["They will have submitted the report by 5 PM.","He will travel tomorrow.","I will be studying at 10 AM."]}
];

let current=0;
let score=0;
let shipPosition=0;

// DOM
const gameScreen=document.getElementById('gameScreen');
const logoScreen=document.getElementById('logoScreen');
const endScreen=document.getElementById('endScreen');
const questionText=document.getElementById('questionText');
const optionsDiv=document.getElementById('options');
const scoreText=document.getElementById('scoreText');
const spaceship=document.getElementById('spaceship');
const finalScore=document.getElementById('finalScore');
const correctAudio=document.getElementById('correctSound');
const wrongAudio=document.getElementById('wrongSound');
const clapAudio=document.getElementById('clapSound');

// Show logo 5s
logoScreen.style.display='flex';
setTimeout(()=>{
  logoScreen.style.display='none';
  gameScreen.style.display='flex';
  showQuestion();
},5000);

// Show current question
function showQuestion(){
  optionsDiv.innerHTML='';
  if(current>=sentences.length){ endGame(); return;}
  let s=sentences[current];
  questionText.innerText=s.q;
  let shuffled=s.options.sort(()=>Math.random()-0.5);
  shuffled.forEach(opt=>{
    const btn=document.createElement('div');
    btn.className='option';
    btn.innerText=opt;
    btn.onclick=()=>checkAnswer(btn,opt,s.a);
    optionsDiv.appendChild(btn);
  });
}

// Check answer and move ship
function checkAnswer(btn,selected,correct){
  if(selected===correct){
    btn.classList.add('correct');
    correctAudio.currentTime=0; correctAudio.play();
    moveSpaceship();
  }else{
    btn.classList.add('wrong');
    wrongAudio.currentTime=0; wrongAudio.play();
    setTimeout(()=>btn.classList.remove('wrong'),300);
  }
  setTimeout(()=>{
    current++;
    showQuestion();
  },700);
}

// Move spaceship step-by-step
function moveSpaceship(){
  score++;
  scoreText.innerText=`Score: ${score}`;
  let maxWidth=document.getElementById('track').offsetWidth - 60;
  let step=maxWidth/sentences.length;
  shipPosition+=step;
  if(shipPosition>maxWidth) shipPosition=maxWidth;
  spaceship.style.left=shipPosition+'px';
}

// End game
function endGame(){
  gameScreen.style.display='none';
  endScreen.style.display='flex';
  finalScore.innerText=`Score: ${score} / ${sentences.length}`;
  clapAudio.play();
}

// Restart
function restartGame(){
  current=0;
  score=0;
  shipPosition=0;
  spaceship.style.left='0px';
  endScreen.style.display='none';
  gameScreen.style.display='flex';
  scoreText.innerText='Score: 0';
  showQuestion();
}
</script>

</body>
</html>
