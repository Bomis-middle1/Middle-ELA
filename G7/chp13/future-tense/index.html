<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Tense Space Race</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1d51;
color:#fff;
overflow:hidden;
}

#logoScreen,#gameScreen,#endScreen{
display:none;
width:100%;
height:100vh;
align-items:center;
justify-content:center;
flex-direction:column;
}

#logoScreen img{
width:200px;
margin-top:40px;
}

/* GAME UI */
h1{text-align:center;color:#ffd60a;margin:10px;}
#scoreText{font-size:20px;margin:10px;}
#questionText{margin:10px;font-size:18px;text-align:center;}

#options{
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
margin-top:15px;
}

.option{
background:#ff6f61;
padding:10px 20px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
width:80%;
text-align:center;
}

.option.correct{background:#4caf50;}
.option.wrong{background:#e53935;}

/* TRACK */
#track{
position:relative;
width:90%;
height:150px;
background:#222;
border:2px solid #fff;
margin-top:20px;
overflow:hidden;
}

/* SPACESHIP FIXED */
#spaceship{
position:absolute;
bottom:10px;
left:0px;
width:60px;
transition:left 0.6s ease;
}

/* BUTTON */
button{
padding:10px 16px;
margin-top:20px;
border-radius:10px;
border:none;
background:#ff6f61;
color:#fff;
font-weight:bold;
cursor:pointer;
}

/* END */
#endScreen{text-align:center;}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logoScreen">
<img src="assets/innovine-logo.png">
<h2>Launching Mission...</h2>
</div>

<!-- GAME -->
<div id="gameScreen">
<h1>Future Tense Space Race</h1>
<div id="scoreText">Score: 0</div>
<div id="questionText"></div>
<div id="options"></div>

<div id="track">
<img id="spaceship" src="assets/spaceship.png">
</div>
</div>

<!-- END -->
<div id="endScreen">
<h1>Mission Complete!</h1>
<p id="finalScore"></p>
<button onclick="restartGame()">Play Again</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

/* ================= QUESTIONS ================= */
const sentences = [
{q:"Which sentence is Simple Future?", a:"I will visit Paris next summer.",
options:["I will visit Paris next summer.","She will be reading when I arrive.","They will have finished homework by 8 PM."]},

{q:"Which sentence is Future Continuous?", a:"She will be reading when I arrive.",
options:["She will be reading when I arrive.","I will visit Paris next summer.","We will have completed project by Friday."]},

{q:"Which sentence is Future Perfect?", a:"They will have finished their homework by 8 PM.",
options:["They will have finished their homework by 8 PM.","He will travel tomorrow.","I will be studying at 10 AM."]},

{q:"Which sentence is Simple Future?", a:"He will travel to London tomorrow.",
options:["He will travel to London tomorrow.","I will have sent the email before lunch.","They will be playing football at 5 PM."]},

{q:"Which sentence is Future Continuous?", a:"I will be studying at 10 AM.",
options:["I will be studying at 10 AM.","She will attend meeting next week.","He will call after dinner."]}
];

let current=0;
let score=0;

/* IMPORTANT FIX */
let shipPosition = 0;

/* DOM */
const gameScreen=document.getElementById('gameScreen');
const logoScreen=document.getElementById('logoScreen');
const endScreen=document.getElementById('endScreen');
const questionText=document.getElementById('questionText');
const optionsDiv=document.getElementById('options');
const scoreText=document.getElementById('scoreText');
const spaceship=document.getElementById('spaceship');

/* ================= START FLOW ================= */
logoScreen.style.display='flex';

setTimeout(()=>{
logoScreen.style.display='none';
gameScreen.style.display='flex';
loadQuestion();
},5000);

/* ================= LOAD QUESTION ================= */
function loadQuestion(){

if(current>=sentences.length){
endGame();
return;
}

let q=sentences[current];
questionText.innerText=q.q;
optionsDiv.innerHTML="";

q.options.forEach(opt=>{
let div=document.createElement('div');
div.className='option';
div.innerText=opt;

div.onclick=()=>checkAnswer(div,opt,q.a);

optionsDiv.appendChild(div);
});
}

/* ================= ANSWER CHECK ================= */
function checkAnswer(btn,selected,correct){

if(selected===correct){

score++;
scoreText.innerText="Score: "+score;

btn.classList.add("correct");
correctSound.play();

/* 🚀 MOVE SHIP STEP BY STEP */
moveShip();

setTimeout(()=>{
current++;
loadQuestion();
},800);

}else{

btn.classList.add("wrong");
wrongSound.play();
}
}

/* ================= SHIP MOVEMENT (FIXED SYSTEM) ================= */
function moveShip(){

let track=document.getElementById('track');
let maxWidth=track.offsetWidth - 70;

/* STEP SIZE BASED ON TOTAL QUESTIONS */
let step = maxWidth / sentences.length;

/* INCREMENT POSITION */
shipPosition += step;

/* LIMIT */
if(shipPosition > maxWidth){
shipPosition = maxWidth;
}

/* APPLY */
spaceship.style.left = shipPosition + "px";
}

/* ================= END ================= */
function endGame(){

gameScreen.style.display='none';
endScreen.style.display='flex';

clapSound.play();

finalScore.innerText=
`Your Score: ${score} / ${sentences.length}`;
}

/* ================= RESTART ================= */
function restartGame(){
current=0;
score=0;
shipPosition=0;

spaceship.style.left="0px";

endScreen.style.display='none';
gameScreen.style.display='flex';

scoreText.innerText="Score: 0";

loadQuestion();
}

</script>

</body>
</html>
