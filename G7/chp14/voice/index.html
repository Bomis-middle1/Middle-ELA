
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade 7 Active & Passive Voice Treasure Hunt</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#87ceeb,#f7e27a);overflow:hidden}
#splash,#endScreen,#questionModal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20}
#splash{background:#fff;flex-direction:column}
#splash img{max-width:220px}
#game{display:none;padding:10px}
.topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff8;padding:8px;border-radius:10px}
#playArea{position:relative;height:70vh;border-radius:12px;margin-top:10px;background:linear-gradient(#7dd87d,#4ea64e)}
.coin{position:absolute;width:60px;height:60px;border-radius:50%;background:gold;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;box-shadow:0 0 10px #0003;animation:float 3s infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-12px)}}
#questionModal{background:#0008;display:none}
.card{background:white;padding:20px;border-radius:12px;width:min(90%,600px)}
.option{display:block;width:100%;margin:8px 0;padding:10px}
.correctFlash{animation:flash .5s 2}
@keyframes flash{50%{background:#8f8}}
#endScreen{display:none;background:#000a;color:#fff;flex-direction:column}
button{cursor:pointer}
</style>
</head>
<body>

<div id="splash">
<img src="assets/innovine-logo.png" alt="Innovine">
<h2>Active & Passive Voice Treasure Hunt</h2>
<p>Loading...</p>
</div>

<div id="game">
<div class="topbar">
<div>Coins: <span id="coins">0</span>/20</div>
<div>Questions: <span id="qcount">0</span>/10</div>
<div>Score: <span id="score">0</span></div>
<label>Volume <input id="vol" type="range" min="0" max="1" step="0.1" value="1"></label>
</div>
<div id="playArea"></div>
</div>

<div id="questionModal">
<div class="card">
<h3 id="question"></h3>
<div id="options"></div>
</div>
</div>

<div id="endScreen">
<h1>🏆 Treasure Found!</h1>
<h2 id="finalScore"></h2>
<button onclick="restartGame()">Restart Game</button>
</div>

<audio id="correctSound" src="assets/correct.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>
const bank=[
{q:"Which sentence is in Active Voice?",a:"Mia baked the cake.",o:["The cake was baked by Mia.","The homework was completed by Jake.","Mia baked the cake.","The ball was kicked by Tom."]},
{q:"Which sentence is in Passive Voice?",a:"The picture was painted by Sarah.",o:["Sarah painted the picture.","The picture was painted by Sarah.","The dog chased the cat.","The teacher praised the class."]},
{q:"Change to Passive Voice: The chef cooked the meal.",a:"The meal was cooked by the chef.",o:["The meal cooked the chef.","The meal was cooked by the chef.","The chef was cooked by the meal.","The meal is cooking."]},
{q:"Change to Active Voice: The book was read by Maya.",a:"Maya read the book.",o:["Maya reads books.","Maya was reading the book.","Maya read the book.","The book read Maya."]},
{q:"Which sentence emphasizes who performed the action?",a:"Maya won the trophy.",o:["The trophy was awarded to Maya.","Maya received the trophy.","Maya won the trophy.","The trophy was won."]},
{q:"Which sentence is Passive Voice?",a:"The match was won by the players.",o:["The players won the match.","The match was won by the players.","The players celebrate the victory.","The coach praised the players."]},
{q:"Choose the correct Passive form: The teacher explained the lesson.",a:"The lesson was explained by the teacher.",o:["The lesson explained the teacher.","The lesson was explained by the teacher.","The teacher was explained.","The lesson explains."]},
{q:"Choose the correct Active form: The letter was written by Sam.",a:"Sam wrote the letter.",o:["Sam was writing letters.","Sam writes letters.","Sam wrote the letter.","The letter wrote Sam."]},
{q:"Which sentence is Active Voice?",a:"Our team won the game.",o:["The game was won by our team.","Our team won the game.","The game was being won.","The game has been won."]},
{q:"Why might a writer use Passive Voice?",a:"To focus more on the receiver of the action.",o:["To hide the action completely.","To focus more on the receiver of the action.","To make every sentence shorter.","To remove all verbs."]},
{q:"The trophy was awarded to the winner. This is:",a:"Passive",o:["Active","Passive","Neither","Both"]},
{q:"Convert: The scientist discovered a new planet.",a:"A new planet was discovered by the scientist.",o:["A new planet was discovered by the scientist.","The scientist was discovered.","A planet discovered the scientist.","A new planet discovers."]},
{q:"Which voice focuses on the receiver?",a:"Passive Voice",o:["Active Voice","Passive Voice","Both","Neither"]},
{q:"Active voice usually makes writing:",a:"More direct",o:["More confusing","More direct","Always longer","Passive"]},
{q:"The window was broken by the boy. This is:",a:"Passive Voice",o:["Active Voice","Passive Voice","Question","Command"]}
];

let questions=[],coins=0,qIndex=0,score=0;
const playArea=document.getElementById('playArea');

function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}

function createCoin(){
 if(coins>=20)return;
 const c=document.createElement('div');
 c.className='coin';
 c.textContent='🪙';
 c.style.left=Math.random()*85+'%';
 c.style.top=Math.random()*80+'%';
 c.onclick=()=>{
   c.remove();
   coins++;
   document.getElementById('coins').textContent=coins;
   if(coins%2===0 && qIndex<10) showQuestion();
   else setTimeout(createCoin,700);
 };
 playArea.appendChild(c);
}

function showQuestion(){
 const modal=document.getElementById('questionModal');
 modal.style.display='flex';
 const q=questions[qIndex];
 document.getElementById('question').textContent=q.q;
 const opts=document.getElementById('options');
 opts.innerHTML='';
 shuffle(q.o).forEach(op=>{
   const b=document.createElement('button');
   b.className='option';
   b.textContent=op;
   b.onclick=()=>answer(op===q.a,b);
   opts.appendChild(b);
 });
}

function answer(correct,btn){
 const vol=document.getElementById('vol').value;
 correctSound.volume=wrongSound.volume=clapSound.volume=vol;
 if(correct){
   score+=10;
   correctSound.play();
   btn.classList.add('correctFlash');
 } else {
   wrongSound.play();
 }
 document.getElementById('score').textContent=score;
 qIndex++;
 document.getElementById('qcount').textContent=qIndex;
 setTimeout(()=>{
   document.getElementById('questionModal').style.display='none';
   if(qIndex>=10) endGame();
   else createCoin();
 },1000);
}

function endGame(){
 clapSound.play();
 document.getElementById('finalScore').textContent='Final Score: '+score+'/100';
 document.getElementById('endScreen').style.display='flex';
}

function restartGame(){
 coins=0;qIndex=0;score=0;
 document.getElementById('coins').textContent=0;
 document.getElementById('qcount').textContent=0;
 document.getElementById('score').textContent=0;
 playArea.innerHTML='';
 document.getElementById('endScreen').style.display='none';
 questions=shuffle(bank).slice(0,10);
 createCoin();
}

setTimeout(()=>{
 document.getElementById('splash').style.display='none';
 document.getElementById('game').style.display='block';
 restartGame();
},5000);
</script>
</body>
</html>
