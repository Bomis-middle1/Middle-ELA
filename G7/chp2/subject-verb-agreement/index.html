<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
<title>Subject–Verb Fusion Core | Grade 7</title>

<style>
/* ==========================================================================
   THE CYBERPUNK LAB ENGINE ROOM RESET
   ========================================================================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #060913;
    color: #f1f5f9;
    overflow: hidden;
    height: 100vh;
    position: relative;
}

/* NEON ATMOSPHERE RADIANCE generators */
body::before {
    content: "";
    position: absolute;
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 75%);
    border-radius: 50%;
    left: -100px;
    top: -100px;
    pointer-events: none;
}

body::after {
    content: "";
    position: absolute;
    width: 380px;
    height: 380px;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.12) 0%, transparent 75%);
    border-radius: 50%;
    right: -100px;
    bottom: -100px;
    pointer-events: none;
}

.screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 24px;
    text-align: center;
    z-index: 100;
}

/* TIMED INTRO KINETICS */
#logoScreen { 
    background: #ffffff; 
    z-index: 9999; 
    display: flex;
    visibility: visible;
    transition: opacity 0.4s ease, visibility 0.4s ease;
}
#logo { width: 200px; max-width: 80%; animation: pulseCore 2.5s infinite alternate ease-in-out; }
@keyframes pulseCore {
    from { transform: scale(1); filter: drop-shadow(0 0 0px rgba(14,165,233,0)); }
    to { transform: scale(1.05); filter: drop-shadow(0 4px 20px rgba(14,165,233,0.25)); }
}

#topicScreen { background: radial-gradient(circle at center, #0b0f19 0%, #04060d 100%); z-index: 9000; display: none; }
#topicScreen h1 { font-size: 48px; font-weight: 900; color: #0ea5e9; text-shadow: 0 0 25px rgba(14,165,233,0.5); margin-bottom: 16px; letter-spacing: 1px; }
#topicScreen h2 { font-size: 22px; color: #a855f7; font-weight: 600; letter-spacing: 2px; }

/* PLATFORM WORKBENCH INTERFACING MODULES */
.dashboard-card {
    background: rgba(11, 17, 32, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 40px;
    border-radius: 32px;
    box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
    max-width: 680px;
    width: 100%;
}

#startScreen, #resultScreen { display: none; z-index: 8000; }
.dashboard-card h1 { font-size: 40px; font-weight: 800; color: #f97316; margin-bottom: 12px; }
.dashboard-card h2 { font-size: 20px; color: #38bdf8; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1px; }
.dashboard-card p { font-size: 18px; color: #94a3b8; line-height: 1.6; margin-bottom: 16px; }

/* VOLUMETRIC HUD CALIBRATOR */
.volume-rack { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 30px; color: #64748b; font-size: 15px; }
input[type=range] { accent-color: #10b981; cursor: pointer; width: 140px; }

/* THE ACTIVE RUNTIME GAME MATRIX */
#gameScreen { display: none; }
.workbench-layout { width: 100%; max-width: 840px; display: flex; flex-direction: column; gap: 24px; }

/* TRACKING PROGRESS METERS */
.hud-metrics { display: flex; justify-content: space-between; align-items: center; width: 100%; }
#progressBadge { font-size: 14px; font-weight: 700; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(56, 189, 248, 0.2); }
#scoreBadge { font-size: 14px; font-weight: 700; color: #eab308; background: rgba(234, 179, 8, 0.1); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(234, 179, 8, 0.2); }

.quantum-progress-bar { width: 100%; height: 8px; background: #1e293b; border-radius: 10px; overflow: hidden; }
#progressFill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #a855f7); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

/* THE DYNAMIC SENTENCE ROW CONTAINER */
.sentence-processor-card {
    background: #0f172a;
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 40px 30px;
    border-radius: 24px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.4);
    min-height: 160px;
    display: flex;
    justify-content: center;
    align-items: center;
}

#sentenceCanvas {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.7;
    color: #e2e8f0;
    text-align: center;
}

/* THE INLINE GAP MODULE COMPONENT */
.syntax-gap-core {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 120px;
    height: 46px;
    margin: 0 12px;
    padding: 0 16px;
    border-radius: 12px;
    background: rgba(15, 23, 42, 0.6);
    border: 2px dashed #475569;
    color: #38bdf8;
    vertical-align: middle;
    transition: all 0.25s ease;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(56,189,248,0);
}
.syntax-gap-core.occupied {
    border-style: solid;
    border-color: #a855f7;
    background: rgba(168, 85, 247, 0.1);
    color: #e9d5ff;
    text-shadow: 0 0 12px rgba(168,85,247,0.4);
    transform: scale(1.03);
}

/* INTERACTIVE VERB INJECTION GRID */
.verb-pool-container {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.verb-cell-node {
    padding: 16px 36px;
    font-size: 22px;
    font-weight: 700;
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    color: #cbd5e1;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
.verb-cell-node:hover:not(.locked) {
    background: #2563eb;
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    border-color: #3b82f6;
}
.verb-cell
