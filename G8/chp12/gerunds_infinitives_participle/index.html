<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spire of Grammar - Elite Challenge</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --card-bg: #1e293b;
            --accent-gold: #f59e0b;
            --accent-gold-glow: rgba(245, 158, 11, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 5-Second Splash Screen */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0b1120;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #splashScreen img {
            max-width: 220px;
            max-height: 220px;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Game Layout */
        .game-container {
            display: flex;
            flex-direction: row;
            gap: 24px;
            max-width: 960px;
            width: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        /* Tower Sidebar / Elevator Gauge */
        .tower-sidebar {
            width: 180px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            max-height: 520px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
        }

        .tower-floor {
            padding: 10px 14px;
            text-align: left;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid transparent;
        }

        .tower-floor.current {
            background: var(--accent-gold-glow);
            color: var(--accent-gold);
            border-color: var(--accent-gold);
            transform: translateX(4px);
        }

        .tower-floor.cleared {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.2);
        }

        /* Main Game Area */
        .main-game {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .audio-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .audio-control input[type=range] {
            accent-color: var(--accent-gold);
            cursor: pointer;
        }

        .score-box {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .question-box {
            margin: 10px 0;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 24px;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.98rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .btn-option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent-gold);
            transform: translateY(-2px);
        }

        .feedback {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            min-height: 48px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .feedback.correct {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .feedback.incorrect {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Action Buttons */
        .restart-container {
            margin-top: 24px;
            text-align: center;
        }

        .btn-restart {
            background: var(--accent-gold);
            color: #0f172a;
            border: none;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px var(--accent-gold-glow);
        }

        .btn-restart:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .game-container {
                flex-direction: column-reverse;
                padding: 18px;
            }
            .tower-sidebar {
                width: 100%;
                max-height: 70px;
                flex-direction: row;
                overflow-x: auto;
            }
            .tower-floor {
                min-width: 85px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<!-- 1. Splash Screen -->
<div id="splashScreen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
    <h1 id="fallback-logo" style="display:none; color: var(--accent-gold); letter-spacing: 2px;">INNOVINE</h1>
</div>

<!-- Audio Assets -->
<audio id="soundCorrect" src="assets/correct.mp3" preload="auto"></audio>
<audio id="soundWrong" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="soundClapping" src="assets/clapping.mp3" preload="auto"></audio>

<div class="game-container">
    <!-- Tower Gauge -->
    <div class="tower-sidebar" id="towerSidebar"></div>

    <!-- Main Game Panel -->
    <div class="main-game">
        <div class="header">
            <h2>Spire of Grammar</h2>
            <div class="audio-control">
                🔊 <input type="range" id="volumeControl" min="0" max="1" step="0.1" value="1" onchange="adjustVolume(this.value)">
            </div>
            <div class="score-box">Score: <span id="scoreDisplay">0</span></div>
        </div>

        <div id="quizSection">
            <div class="question-box">
                <p id="questionText" class="question-text">Initializing assessment...</p>
                <div id="optionsGrid" class="options-grid"></div>
            </div>
            <div id="feedback" class="feedback" style="visibility: hidden;"></div>
        </div>

        <div id="victorySection" style="display: none; text-align: center; padding: 40px 0;">
            <h1 style="color: var(--accent-gold); font-size: 2rem; margin-bottom: 12px;">Spire Conquered</h1>
            <p style="font-size: 1.05rem; color: var(--text-secondary); margin-bottom: 20px;">You have demonstrated mastery over non-finite verb forms.</p>
            <p style="font-size: 1.2rem; font-weight: 700;">Final Score: <span id="finalScore" style="color: var(--accent-gold);">0</span> / 120</p>
        </div>

        <div class="restart-container" id="restartContainer" style="display: none;">
            <button class="btn-restart" onclick="restartGame()">Re-attempt Spire</button>
        </div>
    </div>
</div>

<script>
    const audioCorrect = document.getElementById('soundCorrect');
    const audioWrong = document.getElementById('soundWrong');
    const audioClapping = document.getElementById('soundClapping');

    function adjustVolume(val) {
        audioCorrect.volume = val;
        audioWrong.volume = val;
        audioClapping.volume = val;
    }

    const baseQuestions = [
        { q: "She enjoys ___________ mystery novels during her free time.", options: ["to read", "reading", "read", "reads"], correct: 1 },
        { q: "His hobby is ___________ landscapes.", options: ["painting", "to paint", "painted", "paint"], correct: 0 },
        { q: "She agreed ___________ her friend with the project after school.", options: ["helping", "help", "to help", "helped"], correct: 2 },
        { q: "The manager offered ___________ additional training for the new employees.", options: ["provide", "to provide", "providing", "provided"], correct: 1 },
        { q: "By definition, what constitutes a gerund?", options: ["A verb form starting with 'to'", "A verb ending in '-ing' functioning as a noun", "A verb used exclusively with modal auxiliaries", "A modifier for adjectives"], correct: 1 },
        { q: "How is a full infinitive correctly structured?", options: ["verb + '-ed'", "verb + '-ing'", "'to' + base verb", "'having' + past participle"], correct: 2 },
        { q: "Identify the infinitive: 'Sarah hopes to become a doctor and help people in need.'", options: ["hopes", "to become", "people", "need"], correct: 1 },
        { q: "Identify the gerund: 'Reading improves your vocabulary.'", options: ["Reading", "improves", "your", "vocabulary"], correct: 0 },
        { q: "Select the correct bare infinitive usage after a modal verb:", options: ["He could to swim across the lake.", "He could swim across the lake effortlessly.", "He could swimming across the lake.", "He could swam across the lake."], correct: 1 },
        { q: "In 'The running water sounded soothing,' what role does 'running' fulfill?", options: ["Infinitive", "Present Participle", "Past Participle", "Bare Infinitive"], correct: 1 },
        { q: "In 'The broken vase lay on the floor,' identify the word type of 'broken':", options: ["Present Participle", "Past Participle", "Gerund", "Infinitive"], correct: 1 },
        { q: "Which structure forms a Perfect Participle?", options: ["Present Participle + Object", "Past Participle alone", "'having' + Past Participle", "Bare Infinitive"], correct: 2 }
    ];

    let questions = [];
    let currentFloor = 0;
    let score = 0;
    let answered = false;

    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    window.onload = () => {
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            splash.style.opacity = '0';
            setTimeout(() => { splash.style.display = 'none'; }, 600);
        }, 5000);

        initGame();
    };

    function initGame() {
        questions = shuffleArray(baseQuestions);
        currentFloor = 0;
        score = 0;
        document.getElementById('scoreDisplay').innerText = score;
        document.getElementById('quizSection').style.display = 'block';
        document.getElementById('victorySection').style.display = 'none';
        document.getElementById('restartContainer').style.display = 'none';
        renderSidebar();
        loadFloor();
    }

    function renderSidebar() {
        const sidebar = document.getElementById('towerSidebar');
        sidebar.innerHTML = '';
        for (let i = 0; i < questions.length; i++) {
            const floorDiv = document.createElement('div');
            floorDiv.className = `tower-floor ${i === currentFloor ? 'current' : ''}`;
            floorDiv.id = `floor-${i}`;
            floorDiv.innerHTML = `<span>Level ${i + 1}</span>`;
            sidebar.appendChild(floorDiv);
        }
    }

    function loadFloor() {
        answered = false;
        const feedback = document.getElementById('feedback');
        feedback.style.visibility = 'hidden';
        feedback.className = 'feedback';

        const qData = questions[currentFloor];
        document.getElementById('questionText').innerText = qData.q;

        const optionsGrid = document.getElementById('optionsGrid');
        optionsGrid.innerHTML = '';

        qData.options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
            btn.onclick = () => selectOption(idx);
            optionsGrid.appendChild(btn);
        });

        updateSidebar();
    }

    function selectOption(index) {
        if (answered) return;
        answered = true;

        const qData = questions[currentFloor];
        const feedback = document.getElementById('feedback');
        const buttons = document.querySelectorAll('.btn-option');

        feedback.style.visibility = 'visible';

        if (index === qData.correct) {
            score += 10;
            document.getElementById('scoreDisplay').innerText = score;
            feedback.innerText = "Correct response.";
            feedback.className = "feedback correct";
            buttons[index].style.borderColor = "var(--success)";
            buttons[index].style.background = "rgba(16, 185, 129, 0.15)";

            audioCorrect.currentTime = 0;
            audioCorrect.play().catch(() => {});

            confetti({ particleCount: 40, spread: 50, origin: { y: 0.7 } });
        } else {
            feedback.innerText = `Incorrect. Correct answer: ${qData.options[qData.correct]}`;
            feedback.className = "feedback incorrect";
            buttons[index].style.borderColor = "var(--danger)";
            buttons[qData.correct].style.borderColor = "var(--success)";

            audioWrong.currentTime = 0;
            audioWrong.play().catch(() => {});
        }

        setTimeout(() => { nextFloor(); }, 2000);
    }

    function nextFloor() {
        const currentFloorDiv = document.getElementById(`floor-${currentFloor}`);
        if (currentFloorDiv) {
            currentFloorDiv.classList.remove('current');
            currentFloorDiv.classList.add('cleared');
        }

        currentFloor++;

        if (currentFloor < questions.length) {
            loadFloor();
        } else {
            showVictory();
        }
    }

    function updateSidebar() {
        const floorDiv = document.getElementById(`floor-${currentFloor}`);
        if (floorDiv) {
            floorDiv.classList.add('current');
        }
    }

    function showVictory() {
        document.getElementById('quizSection').style.display = 'none';
        document.getElementById('victorySection').style.display = 'block';
        document.getElementById('restartContainer').style.display = 'block';
        document.getElementById('finalScore').innerText = score;

        audioClapping.currentTime = 0;
        audioClapping.play().catch(() => {});

        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
    }

    function restartGame() {
        initGame();
    }
</script>
</body>
</html>
