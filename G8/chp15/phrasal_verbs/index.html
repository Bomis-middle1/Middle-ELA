<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dialogue Detective - Phrasal Verbs</title>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka One', cursive, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #a8edf0 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
      color: #2c3e50;
    }

    /* --- Splash Screen (5 Seconds) --- */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    #splash-screen img {
      max-width: 320px;
      width: 75%;
      height: auto;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); }
      50% { transform: scale(1.05); }
      100% { transform: scale(0.95); }
    }

    /* --- Main Game Card --- */
    .game-card {
      background: #ffffff;
      border: 4px solid #ff9f43;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.15);
      max-width: 650px;
      width: 100%;
      padding: 25px;
      text-align: center;
      position: relative;
    }

    .header-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff3e0;
      padding: 8px 14px;
      border-radius: 14px;
      border: 2px solid #ffe0b2;
      font-size: 0.95rem;
      font-weight: bold;
      color: #e67e22;
    }

    .volume-box input[type="range"] {
      width: 90px;
      cursor: pointer;
    }

    .score-badge {
      background: #ff6b6b;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .badge {
      display: inline-block;
      background: #ff9f43;
      color: white;
      padding: 6px 20px;
      border-radius: 15px;
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    /* --- Comic Dialogue Stage --- */
    .comic-stage {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      background: #f1f2f6;
      border: 3px dashed #4ecdc4;
      border-radius: 20px;
      padding: 20px 10px;
      margin-bottom: 20px;
      min-height: 260px;
    }

    .character-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 48%;
      position: relative;
    }

    .avatar {
      font-size: 4.5rem;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .character-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: #7f8c8d;
      margin-top: 5px;
    }

    /* Speech Bubbles */
    .speech-bubble {
      position: relative;
      background: #ffffff;
      border: 3px solid #2c3e50;
      border-radius: 18px;
      padding: 12px 14px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #2c3e50;
      margin-bottom: 15px;
      width: 100%;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #2c3e50;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -13px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 10px 0;
      border-style: solid;
      border-color: #2c3e50 transparent;
      display: block;
      width: 0;
    }

    .blank-target {
      display: inline-block;
      min-width: 85px;
      padding: 2px 8px;
      margin: 0 4px;
      border-bottom: 3px dashed #ff9f43;
      color: #e67e22;
      font-weight: bold;
    }

    /* --- Choice Buttons --- */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-bottom: 10px;
    }

    @media (min-width: 480px) {
      .options-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .btn-opt {
      background: #ffffff;
      border: 3px solid #ced6e0;
      color: #2f3542;
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      word-break: break-word;
      box-shadow: 0 5px 0 #ced6e0;
    }

    .btn-opt:hover:not(:disabled) {
      border-color: #ff9f43;
      color: #ff9f43;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #ff9f43;
    }

    .btn-opt.correct {
      background: #2ed573 !important;
      border-color: #26af5f !important;
      color: white !important;
      box-shadow: 0 5px 0 #26af5f !important;
    }

    .btn-opt.wrong {
      background: #ff4757 !important;
      border-color: #d63031 !important;
      color: white !important;
      box-shadow: 0 5px 0 #d63031 !important;
    }

    .btn-opt:disabled {
      cursor: not-allowed;
    }

    /* --- End Screen --- */
    .end-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 20px 0;
    }

    .end-screen h2 {
      font-size: 2.2rem;
      color: #ff9f43;
    }

    .restart-btn {
      background: #ff9f43;
      border: none;
      color: white;
      padding: 16px 36px;
      border-radius: 22px;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 #e67e22;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .restart-btn:hover {
      background: #ffa801;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #e67e22;
    }

    .restart-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #e67e22;
    }
  </style>
</head>
<body>

  <!-- 5-Second Innovine Splash Screen -->
  <div id="splash-screen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo" />
  </div>

  <!-- Audio Elements -->
  <audio id="sound-correct" src="assets/correct.mp3" preload="auto"></audio>
  <audio id="sound-wrong" src="assets/wrong.mp3" preload="auto"></audio>
  <audio id="sound-clapping" src="assets/clapping.mp3" preload="auto"></audio>

  <!-- Game Container -->
  <div class="game-card">
    <div class="header-controls">
      <div class="volume-box">
        🔊 Sound
        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1" />
      </div>
      <div class="score-badge" id="scoreDisplay">Score: 0</div>
    </div>

    <div id="game-body">
      <div class="badge">🔍 Dialogue Detective</div>

      <!-- Comic Stage -->
      <div class="comic-stage">
        <!-- Speaker A -->
        <div class="character-box">
          <div class="speech-bubble" id="bubbleA">...</div>
          <div class="avatar" id="avatarA">🧐</div>
          <div class="character-name" id="nameA">Detective Alex</div>
        </div>

        <!-- Speaker B -->
        <div class="character-box">
          <div class="speech-bubble" id="bubbleB">...</div>
          <div class="avatar" id="avatarB">🤨</div>
          <div class="character-name" id="nameB">Friend Sam</div>
        </div>
      </div>

      <!-- Option Choices -->
      <div class="options-grid" id="optionsGrid"></div>
    </div>

    <!-- End Screen (Restart Button at Bottom) -->
    <div class="end-screen" id="endScreen">
      <h2>🎉 Case Solved!</h2>
      <p id="finalScoreText" style="font-size: 1.3rem; color: #2c3e50;">Your Final Score: 0 / 0</p>
      <button class="restart-btn" onclick="restartGame()">Play Again 🔄</button>
    </div>
  </div>

  <script>
    // Chapter 15 Phrasal Verbs Question Bank (Dialogue Detective Format)
    const baseCases = [
      {
        speakerA: "Did you fix your car's engine yet?",
        speakerB: "Yes, but I had to ________ it to test where the sound came from.",
        options: ["break down", "hand in", "look into", "run out"],
        answer: 0,
        avatars: { normalA: "🧐", normalB: "🚗", correctA: "💡", correctB: "🛠️", wrongA: "🤦‍♂️", wrongB: "💥" }
      },
      {
        speakerA: "Are you still trying to solve that puzzle?",
        speakerB: "No, it is too hard! I decided to ________ for now.",
        options: ["give up", "set up", "turn on", "look after"],
        answer: 0,
        avatars: { normalA: "🧐", normalB: "🧩", correctA: "😌", correctB: "🏳️", wrongA: "🤨", wrongB: "🤯" }
      },
      {
        speakerA: "Why did you stop at the store on the way home?",
        speakerB: "We had ________ sugar, so I had to buy more.",
        options: ["looked after", "run out of", "taken over", "broken out"],
        answer: 1,
        avatars: { normalA: "🧐", normalB: "🛒", correctA: "🛍️", correctB: "😄", wrongA: "😒", wrongB: "❓" }
      },
      {
        speakerA: "Where did you find this old notebook?",
        speakerB: "I unexpectedly ________ it while cleaning my room.",
        options: ["ran into", "came across", "turned off", "handed in"],
        answer: 1,
        avatars: { normalA: "🧐", normalB: "📦", correctA: "😲", correctB: "📸", wrongA: "🤔", wrongB: "🚫" }
      },
      {
        speakerA: "Did the teacher get your assignment?",
        speakerB: "Yes, I managed to ________ my project before class.",
        options: ["hand in", "break out", "set off", "look after"],
        answer: 0,
        avatars: { normalA: "👩‍🏫", normalB: "🎒", correctA: "✅", correctB: "🥳", wrongA: "😠", wrongB: "😰" }
      },
      {
        speakerA: "Who will take care of your dog during vacation?",
        speakerB: "My parents offered to ________ him while we are away.",
        options: ["look after", "give up", "run out", "break down"],
        answer: 0,
        avatars: { normalA: "🧐", normalB: "🐶", correctA: "🦴", correctB: "😊", wrongA: "🤔", wrongB: "😢" }
      },
      {
        speakerA: "How did the new business start?",
        speakerB: "They decided to ________ a small office downtown.",
        options: ["set up", "hand in", "run out", "look into"],
        answer: 0,
        avatars: { normalA: "🧐", normalB: "🏢", correctA: "🎉", correctB: "💼", wrongA: "❓", wrongB: "😅" }
      }
    ];

    let gameCases = [];
    let currentCaseIndex = 0;
    let score = 0;
    let nextTimeout = null;

    // Elements
    const splashScreen = document.getElementById("splash-screen");
    const gameBody = document.getElementById("game-body");
    const endScreen = document.getElementById("endScreen");
    const scoreDisplay = document.getElementById("scoreDisplay");
    const finalScoreText = document.getElementById("finalScoreText");

    const bubbleA = document.getElementById("bubbleA");
    const bubbleB = document.getElementById("bubbleB");
    const avatarA = document.getElementById("avatarA");
    const avatarB = document.getElementById("avatarB");
    const optionsGrid = document.getElementById("optionsGrid");

    // Audio Elements
    const soundCorrect = document.getElementById("sound-correct");
    const soundWrong = document.getElementById("sound-wrong");
    const soundClapping = document.getElementById("sound-clapping");
    const volumeSlider = document.getElementById("volumeSlider");

    // Volume Adjustment
    volumeSlider.addEventListener("input", (e) => {
      const vol = parseFloat(e.target.value);
      soundCorrect.volume = vol;
      soundWrong.volume = vol;
      soundClapping.volume = vol;
    });

    // Handle 5-Second Splash Screen on Page Load
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(() => {
        splashScreen.style.opacity = "0";
        setTimeout(() => {
          splashScreen.style.visibility = "hidden";
        }, 800);
      }, 5000); // 5 Seconds Splash Duration

      initGame();
    });

    // Helper: Fisher-Yates Array Shuffle
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Initialize or Reset Game State
    function initGame() {
      // Randomize question sequence each time game loads
      gameCases = shuffleArray(baseCases);
      currentCaseIndex = 0;
      score = 0;
      scoreDisplay.innerText = `Score: ${score}`;
      endScreen.style.display = "none";
      gameBody.style.display = "block";
      loadCase();
    }

    // Load Single Dialogue Question
    function loadCase() {
      const cData = gameCases[currentCaseIndex];

      // Speech bubble contents
      bubbleA.innerText = cData.speakerA;
      bubbleB.innerHTML = cData.speakerB.replace("________", `<span class="blank-target">_______</span>`);

      // Reset character avatars
      avatarA.innerText = cData.avatars.normalA;
      avatarB.innerText = cData.avatars.normalB;
      avatarA.style.transform = "scale(1)";
      avatarB.style.transform = "scale(1)";

      // Prepare options grid and shuffle choices per question
      optionsGrid.innerHTML = "";
      const mappedOptions = cData.options.map((opt, idx) => ({
        text: opt,
        isCorrect: idx === cData.answer
      }));

      const shuffledOpts = shuffleArray(mappedOptions);

      shuffledOpts.forEach((optObj) => {
        const btn = document.createElement("button");
        btn.className = "btn-opt";
        btn.innerText = optObj.text;
        btn.onclick = () => handleChoice(optObj, btn, cData);
        optionsGrid.appendChild(btn);
      });
    }

    // Handle User Answer Selection
    function handleChoice(selectedOpt, clickedBtn, caseData) {
      // Disable all option buttons to prevent multiple clicks
      const buttons = optionsGrid.querySelectorAll(".btn-opt");
      buttons.forEach(btn => btn.disabled = true);

      if (selectedOpt.isCorrect) {
        // Correct Answer
        bubbleB.innerHTML = caseData.speakerB.replace("________", `<span class="blank-target" style="color:#2ecc71">${selectedOpt.text}</span>`);
        clickedBtn.classList.add("correct");

        // React Character Avatars
        avatarA.innerText = caseData.avatars.correctA;
        avatarB.innerText = caseData.avatars.correctB;
        avatarA.style.transform = "scale(1.2)";
        avatarB.style.transform = "scale(1.2)";

        score++;
        scoreDisplay.innerText = `Score: ${score}`;
        playSound(soundCorrect);
        triggerConfetti();
      } else {
        // Wrong Answer
        clickedBtn.classList.add("wrong");

        // Highlight correct button
        buttons.forEach(btn => {
          if (btn.innerText === caseData.options[caseData.answer]) {
            btn.classList.add("correct");
          }
        });

        // React Character Avatars
        avatarA.innerText = caseData.avatars.wrongA;
        avatarB.innerText = caseData.avatars.wrongB;
        avatarA.style.transform = "scale(0.9)";
        avatarB.style.transform = "scale(0.9)";

        playSound(soundWrong);
      }

      // Automatically move to the next question after 1.5 seconds
      nextTimeout = setTimeout(() => {
        currentCaseIndex++;
        if (currentCaseIndex < gameCases.length) {
          loadCase();
        } else {
          showEndScreen();
        }
      }, 1500);
    }

    // Sound Player with Autoplay Fail-Safe
    function playSound(audioEl) {
      audioEl.currentTime = 0;
      audioEl.play().catch(() => {
        // Smoothly handle browser autoplay restrictions
      });
    }

    // Canvas Confetti Effect
    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 60,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    // Show Final End Screen
    function showEndScreen() {
      gameBody.style.display = "none";
      endScreen.style.display = "flex";
      finalScoreText.innerText = `Your Final Score: ${score} / ${gameCases.length}`;
      playSound(soundClapping);

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 100,
          origin: { y: 0.5 }
        });
      }
    }

    // Restart Game Logic
    function restartGame() {
      if (nextTimeout) clearTimeout(nextTimeout);
      soundClapping.pause();
      soundClapping.currentTime = 0;
      initGame();
    }
  </script>
</body>
</html>
