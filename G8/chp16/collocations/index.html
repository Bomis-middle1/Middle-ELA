<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Collocation Matchmaker - Grammar Game</title>
  
  <!-- Google Fonts for Child-Friendly Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      --card-bg: #ffffff;
      --primary: #4A90E2;
      --primary-dark: #357ABD;
      --accent-yellow: #FFD166;
      --accent-green: #06D6A0;
      --accent-red: #EF476F;
      --text-color: #2D3142;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Fredoka', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      color: var(--text-color);
      overflow-x: hidden;
    }

    /* ---------------- 5-SECOND SPLASH SCREEN ---------------- */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      animation: fadeIn 0.5s ease-in;
    }

    .splash-logo {
      max-width: 260px;
      width: 70%;
      height: auto;
      object-fit: contain;
      animation: pulse 1.5s infinite ease-in-out;
    }

    .splash-timer {
      font-family: 'Nunito', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
    }

    .splash-progress-bar {
      width: 200px;
      height: 8px;
      background: #E2E8F0;
      border-radius: 10px;
      overflow: hidden;
    }

    .splash-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.1s linear;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* ---------------- MAIN CONTAINER ---------------- */
    .game-container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 24px;
      border: 5px solid #ffffff;
      display: none; /* Shown after splash screen */
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    /* Header & Controls */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 3px dashed #E2E8F0;
      padding-bottom: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo {
      height: 42px;
      width: auto;
      object-fit: contain;
    }

    .title {
      font-family: 'Nunito', sans-serif;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--primary);
    }

    /* Volume Control */
    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F1F5F9;
      padding: 8px 14px;
      border-radius: 20px;
    }

    .volume-slider {
      width: 70px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* HUD Bar */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .progress-bar-bg {
      width: 100%;
      height: 14px;
      background: #E2E8F0;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-green);
      transition: width 0.4s ease;
      border-radius: 10px;
    }

    .score-badge {
      background: var(--accent-yellow);
      padding: 6px 16px;
      border-radius: 20px;
      color: #7A5200;
      box-shadow: 0 3px 0 #E0B034;
    }

    /* ---------------- GAMIFIED PLAYFIELD ---------------- */
    .playfield {
      background: #F8FAFC;
      border: 3px solid #E2E8F0;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .scenario-badge {
      background: #E0F2FE;
      color: #0369A1;
      padding: 6px 16px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .scenario-text {
      font-size: 1.15rem;
      text-align: center;
      line-height: 1.4;
      color: #475569;
    }

    /* Sentence Slot Card */
    .sentence-card {
      background: #FFFFFF;
      border: 3px dashed var(--primary);
      border-radius: 18px;
      padding: 20px;
      width: 100%;
      text-align: center;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.6;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
    }

    .drop-slot {
      display: inline-block;
      min-width: 140px;
      padding: 4px 16px;
      margin: 0 6px;
      border-bottom: 4px solid var(--primary);
      background: #EFF6FF;
      border-radius: 10px;
      color: var(--primary-dark);
      font-weight: 900;
      transition: all 0.2s ease;
    }

    .drop-slot.correct {
      background: #D1FAE5;
      border-color: var(--accent-green);
      color: #065F46;
    }

    .drop-slot.wrong {
      background: #FEE2E2;
      border-color: var(--accent-red);
      color: #991B1B;
    }

    /* Interactive Word Cards Grid */
    .cards-deck {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    @media (max-width: 500px) {
      .cards-deck {
        grid-template-columns: 1fr;
      }
    }

    .word-card {
      background: #FFFFFF;
      border: 3px solid #CBD5E1;
      border-bottom: 6px solid #CBD5E1;
      border-radius: 18px;
      padding: 16px 10px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-color);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.04);
    }

    .word-card:hover:not(:disabled) {
      transform: translateY(-3px);
      border-color: var(--primary);
      background: #F0F7FF;
    }

    .word-card:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 3px;
    }

    .word-card:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .word-card.selected-correct {
      background: var(--accent-green) !important;
      border-color: #059669 !important;
      border-bottom-color: #047857 !important;
      color: white !important;
    }

    .word-card.selected-wrong {
      background: var(--accent-red) !important;
      border-color: #DC2626 !important;
      border-bottom-color: #B91C1C !important;
      color: white !important;
    }

    /* ---------------- END SCREEN ---------------- */
    .end-screen {
      display: none;
      text-align: center;
      padding: 20px 10px;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .end-title {
      font-size: 2.2rem;
      color: var(--primary);
    }

    .final-score-box {
      background: #FFFBEB;
      border: 4px dashed var(--accent-yellow);
      border-radius: 20px;
      padding: 20px 40px;
      margin: 10px 0;
    }

    .score-number {
      font-size: 3rem;
      font-weight: 900;
      color: var(--text-color);
    }

    /* Bottom Restart Button */
    .restart-btn {
      background: var(--accent-green);
      color: white;
      border: none;
      border-bottom: 6px solid #059669;
      border-radius: 20px;
      padding: 16px 36px;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.15s ease;
      box-shadow: 0 6px 15px rgba(6, 214, 160, 0.4);
    }

    .restart-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .restart-btn:active {
      transform: translateY(2px);
      border-bottom-width: 3px;
    }
  </style>
</head>
<body>

  <!-- 1. 5-Second Splash Screen -->
  <div id="splashScreen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo" class="splash-logo" onerror="this.src='https://via.placeholder.com/250x100?text=Innovine+Logo'">
    <div class="splash-timer">Game starting in <span id="splashCountdown">5</span>s...</div>
    <div class="splash-progress-bar">
      <div id="splashProgress" class="splash-progress-fill"></div>
    </div>
  </div>

  <!-- 2. Main Game Area -->
  <div id="gameContainer" class="game-container">
    <!-- Header with Logo & Sound Controls -->
    <div class="header">
      <div class="brand">
        <img src="assets/innovine-logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        <div class="title">Matchmaker</div>
      </div>
      <div class="volume-control">
        <span style="font-size: 1.1rem;">🔊</span>
        <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.1" value="1">
      </div>
    </div>

    <!-- Gameplay Board -->
    <div id="gameBoard">
      <div class="hud">
        <div style="flex-grow: 1; margin-right: 20px;">
          <span id="questionNum">Challenge 1/12</span>
          <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
          </div>
        </div>
        <div class="score-badge">
          ⭐ Score: <span id="currentScore">0</span>
        </div>
      </div>

      <div class="playfield" style="margin-top: 15px;">
        <div id="scenarioBadge" class="scenario-badge">Scenario</div>
        <div id="scenarioText" class="scenario-text">Scenario description goes here...</div>

        <!-- Target Slot Sentence -->
        <div class="sentence-card">
          <span id="sentencePrefix"></span>
          <span id="targetSlot" class="drop-slot">?</span>
          <span id="sentenceSuffix"></span>
        </div>

        <p style="font-size: 0.95rem; font-weight: 700; color: #64748B;">👇 Tap a card to fit the sentence:</p>

        <!-- Matching Cards Deck -->
        <div id="cardsDeck" class="cards-deck"></div>
      </div>
    </div>

    <!-- 3. End Screen -->
    <div id="endScreen" class="end-screen">
      <div class="end-title">🎉 Excellent Job! 🎉</div>
      <p style="font-size: 1.2rem;">You matched all collocations perfectly!</p>
      
      <div class="final-score-box">
        <div>Final Score</div>
        <div id="finalScore" class="score-number">0 / 12</div>
      </div>

      <button id="restartBtn" class="restart-btn" onclick="restartGame()">🔄 Play Again</button>
    </div>
  </div>

  <!-- Audio Resources -->
  <audio id="correctAudio" src="assets/correct.mp3" preload="auto"></audio>
  <audio id="wrongAudio" src="assets/wrong.mp3" preload="auto"></audio>
  <audio id="clappingAudio" src="assets/clapping.mp3" preload="auto"></audio>

  <script>
    // Chapter 16: Collocations Database
    const rawQuestions = [
      {
        category: "Daily Routine",
        scenario: "You woke up late for school and only have 3 minutes to wash up.",
        prefix: "I need to take a",
        suffix: "before leaving.",
        options: ["Fast shower", "Quick shower", "Rapid shower", "Short shower"],
        correctIndex: 1
      },
      {
        category: "Daily Routine",
        scenario: "You are tidying up your bedroom before heading out.",
        prefix: "Don't forget to",
        suffix: "before you go out.",
        options: ["do the bed", "set the bed", "make the bed", "put the bed"],
        correctIndex: 2
      },
      {
        category: "Food & Taste",
        scenario: "You ate the most amazing, high-quality pizza for dinner.",
        prefix: "This pizza tastes",
        suffix: "!",
        options: ["extremely delicious", "utterly delicious", "heavy delicious", "absolutely delicious"],
        correctIndex: 3
      },
      {
        category: "Sleep & Dreams",
        scenario: "You fell asleep at night and experienced a wonderful vision.",
        prefix: "Last night I had a chance to",
        suffix: "about flying.",
        options: ["see a dream", "watch a dream", "have a dream", "catch a dream"],
        correctIndex: 2
      },
      {
        category: "Weather",
        scenario: "It is pouring heavily outside, and you need protective gear.",
        prefix: "Make sure to wear a",
        suffix: "outside.",
        options: ["strong raincoat", "powerful raincoat", "heavy raincoat", "thick raincoat"],
        correctIndex: 2
      },
      {
        category: "Sports & Records",
        scenario: "An athlete ran faster than anyone in history during the Olympics.",
        prefix: "The runner successfully",
        suffix: "yesterday!",
        options: ["cut a record", "broke a record", "made a record", "created a record"],
        correctIndex: 1
      },
      {
        category: "Travel & Traffic",
        scenario: "You are stuck on the highway during rush hour with bumper-to-bumper cars.",
        prefix: "We are stuck in a massive",
        suffix: ".",
        options: ["traffic block", "traffic jam", "traffic stop", "traffic crowd"],
        correctIndex: 1
      },
      {
        category: "Emotions",
        scenario: "Carla received her test results and discovered she won 1st prize!",
        prefix: "Carla was",
        suffix: "with her grade.",
        options: ["bitterly delighted", "absolutely delighted", "deeply delighted", "strictly delighted"],
        correctIndex: 1
      },
      {
        category: "Memory",
        scenario: "You remember the exact date and details of the day you met your best friend.",
        prefix: "I",
        suffix: "the first time we met.",
        options: ["gently remember", "distinctly remember", "closely remember", "firmly remember"],
        correctIndex: 1
      },
      {
        category: "Creativity",
        scenario: "A writer easily invents colorful characters and creative storylines.",
        prefix: "The author has a very",
        suffix: ".",
        options: ["vivid imagination", "bright imagination", "broad imagination", "strong imagination"],
        correctIndex: 0
      },
      {
        category: "Emotions",
        scenario: "After failing her exam, she felt a strong, deep sense of sadness.",
        prefix: "Failing the test was a",
        suffix: "for her.",
        options: ["sour disappointment", "harsh disappointment", "bitter disappointment", "heavy disappointment"],
        correctIndex: 2
      },
      {
        category: "Weather",
        scenario: "Walking outside on a harsh, freezing winter morning with icy winds.",
        prefix: "It was a",
        suffix: "winter morning.",
        options: ["utterly cold", "bitterly cold", "fully cold", "deadly cold"],
        correctIndex: 1
      }
    ];

    let gameQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let globalVolume = 1.0;

    // Elements
    const splashScreen = document.getElementById('splashScreen');
    const splashCountdown = document.getElementById('splashCountdown');
    const splashProgress = document.getElementById('splashProgress');
    const gameContainer = document.getElementById('gameContainer');

    const gameBoard = document.getElementById('gameBoard');
    const endScreen = document.getElementById('endScreen');
    const scenarioBadge = document.getElementById('scenarioBadge');
    const scenarioText = document.getElementById('scenarioText');
    const sentencePrefix = document.getElementById('sentencePrefix');
    const sentenceSuffix = document.getElementById('sentenceSuffix');
    const targetSlot = document.getElementById('targetSlot');
    const cardsDeck = document.getElementById('cardsDeck');

    const questionNumEl = document.getElementById('questionNum');
    const progressBarEl = document.getElementById('progressBar');
    const currentScoreEl = document.getElementById('currentScore');
    const finalScoreEl = document.getElementById('finalScore');
    const volumeSlider = document.getElementById('volumeControl');

    // Audio Elements
    const correctAudio = document.getElementById('correctAudio');
    const wrongAudio = document.getElementById('wrongAudio');
    const clappingAudio = document.getElementById('clappingAudio');

    // 1. Splash Screen Timer (5 Seconds Exact)
    function runSplashScreen() {
      let duration = 5; // seconds
      let elapsed = 0;
      let intervalStep = 100; // ms

      const timer = setInterval(() => {
        elapsed += intervalStep;
        let remainingSeconds = Math.ceil((duration * 1000 - elapsed) / 1000);
        if (remainingSeconds < 0) remainingSeconds = 0;
        
        splashCountdown.textContent = remainingSeconds;
        splashProgress.style.width = `${(elapsed / (duration * 1000)) * 100}%`;

        if (elapsed >= duration * 1000) {
          clearInterval(timer);
          splashScreen.style.display = 'none';
          gameContainer.style.display = 'flex';
          initGame();
        }
      }, intervalStep);
    }

    // Audio Control
    volumeSlider.addEventListener('input', (e) => {
      globalVolume = parseFloat(e.target.value);
    });

    function playSound(audioObject) {
      if (!audioObject) return;
      audioObject.volume = globalVolume;
      audioObject.currentTime = 0;
      audioObject.play().catch(() => {});
    }

    // Utility Shuffle
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Game Core
    function initGame() {
      gameQuestions = shuffleArray(rawQuestions);
      currentIndex = 0;
      score = 0;
      currentScoreEl.textContent = score;

      gameBoard.style.display = 'block';
      endScreen.style.display = 'none';

      loadChallenge();
    }

    function loadChallenge() {
      const q = gameQuestions[currentIndex];

      // Reset slot UI
      targetSlot.textContent = '?';
      targetSlot.className = 'drop-slot';

      // Update HUD
      questionNumEl.textContent = `Challenge ${currentIndex + 1}/${gameQuestions.length}`;
      progressBarEl.style.width = `${((currentIndex) / gameQuestions.length) * 100}%`;

      // Update Playfield
      scenarioBadge.textContent = q.category;
      scenarioText.textContent = q.scenario;
      sentencePrefix.textContent = q.prefix + " ";
      sentenceSuffix.textContent = " " + q.suffix;

      // Render Interactive Deck
      cardsDeck.innerHTML = '';
      q.options.forEach((optText, index) => {
        const card = document.createElement('button');
        card.className = 'word-card';
        card.textContent = optText;
        card.onclick = () => handleCardSelect(index, card, optText);
        cardsDeck.appendChild(card);
      });
    }

    function handleCardSelect(selectedIndex, cardBtn, cardText) {
      // Disable cards
      const allCards = cardsDeck.querySelectorAll('.word-card');
      allCards.forEach(c => c.disabled = true);

      const q = gameQuestions[currentIndex];
      targetSlot.textContent = cardText;

      if (selectedIndex === q.correctIndex) {
        // Correct Choice
        cardBtn.classList.add('selected-correct');
        targetSlot.classList.add('correct');
        score++;
        currentScoreEl.textContent = score;
        playSound(correctAudio);

        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.65 }
        });
      } else {
        // Wrong Choice
        cardBtn.classList.add('selected-wrong');
        targetSlot.classList.add('wrong');
        
        // Reveal correct card
        allCards[q.correctIndex].classList.add('selected-correct');
        playSound(wrongAudio);
      }

      // Auto-move after 1.8s
      setTimeout(() => {
        currentIndex++;
        if (currentIndex < gameQuestions.length) {
          loadChallenge();
        } else {
          showEndScreen();
        }
      }, 1800);
    }

    function showEndScreen() {
      progressBarEl.style.width = '100%';
      gameBoard.style.display = 'none';
      endScreen.style.display = 'flex';
      
      finalScoreEl.textContent = `${score} / ${gameQuestions.length}`;

      playSound(clappingAudio);
      confetti({
        particleCount: 160,
        spread: 100,
        origin: { y: 0.5 }
      });
    }

    function restartGame() {
      initGame();
    }

    // Start App on Load
    window.onload = runSplashScreen;
  </script>
</body>
</html>
