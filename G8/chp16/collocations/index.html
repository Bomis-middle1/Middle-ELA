
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Collocation Matchmaker - Grammar Game</title>
  
  <!-- Google Fonts for Child-Friendly Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      --card-bg: #ffffff;
      --primary: #4A90E2;
      --primary-dark: #357ABD;
      --accent-yellow: #FFD166;
      --accent-green: #06D6A0;
      --accent-red: #EF476F;
      --text-color: #2D3142;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Fredoka', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      color: var(--text-color);
    }

    /* Main Container */
    .game-container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 24px;
      border: 5px solid #ffffff;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Header & Controls */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 3px dashed #E2E8F0;
      padding-bottom: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      height: 48px;
      width: auto;
      object-fit: contain;
    }

    .title {
      font-family: 'Nunito', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--primary);
    }

    /* Volume Control */
    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F1F5F9;
      padding: 8px 14px;
      border-radius: 20px;
    }

    .volume-icon {
      font-size: 1.2rem;
    }

    .volume-slider {
      width: 70px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Progress & Score Bar */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .progress-bar-bg {
      width: 100%;
      height: 14px;
      background: #E2E8F0;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-green);
      transition: width 0.4s ease;
      border-radius: 10px;
    }

    .score-badge {
      background: var(--accent-yellow);
      padding: 6px 16px;
      border-radius: 20px;
      color: #7A5200;
      box-shadow: 0 3px 0 #E0B034;
    }

    /* Question Box */
    .question-card {
      background: #F8FAFC;
      border: 3px solid #E2E8F0;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
    }

    .question-type {
      display: inline-block;
      background: #E0F2FE;
      color: #0369A1;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .question-text {
      font-size: 1.25rem;
      line-height: 1.4;
      font-weight: 600;
      color: var(--text-color);
    }

    /* Answer Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 500px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      background: #FFFFFF;
      border: 3px solid #CBD5E1;
      border-bottom: 6px solid #CBD5E1;
      border-radius: 16px;
      padding: 16px 12px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-color);
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
      word-wrap: break-word;
    }

    .option-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--primary);
      background: #F0F7FF;
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 3px;
    }

    .option-btn.correct {
      background: #D1FAE5 !important;
      border-color: var(--accent-green) !important;
      border-bottom-color: #059669 !important;
      color: #065F46 !important;
    }

    .option-btn.wrong {
      background: #FEE2E2 !important;
      border-color: var(--accent-red) !important;
      border-bottom-color: #DC2626 !important;
      color: #991B1B !important;
    }

    /* End Screen */
    .end-screen {
      display: none;
      text-align: center;
      padding: 20px 10px;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .end-title {
      font-size: 2.2rem;
      color: var(--primary);
    }

    .final-score-box {
      background: #FFFBEB;
      border: 4px dashed var(--accent-yellow);
      border-radius: 20px;
      padding: 20px 40px;
      margin: 10px 0;
    }

    .score-number {
      font-size: 3rem;
      font-weight: 900;
      color: var(--text-color);
    }

    /* Bottom Restart Button */
    .restart-btn {
      background: var(--accent-green);
      color: white;
      border: none;
      border-bottom: 6px solid #059669;
      border-radius: 20px;
      padding: 16px 36px;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.15s ease;
      box-shadow: 0 6px 15px rgba(6, 214, 160, 0.4);
    }

    .restart-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .restart-btn:active {
      transform: translateY(2px);
      border-bottom-width: 3px;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- Header with Logo and Sound Slider -->
    <div class="header">
      <div class="brand">
        <img src="assets/innovine-logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        <div class="title">Collocation Matcher</div>
      </div>
      <div class="volume-control">
        <span class="volume-icon">🔊</span>
        <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.1" value="1">
      </div>
    </div>

    <!-- Gameplay Area -->
    <div id="gameScreen">
      <div class="hud">
        <div style="flex-grow: 1; margin-right: 20px;">
          <span id="questionNum">Question 1/12</span>
          <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
          </div>
        </div>
        <div class="score-badge">
          ⭐ Score: <span id="currentScore">0</span>
        </div>
      </div>

      <div class="question-card" style="margin-top: 15px;">
        <div id="questionCategory" class="question-type">Collocation</div>
        <div id="questionText" class="question-text">Loading question...</div>
      </div>

      <div id="optionsContainer" class="options-grid" style="margin-top: 15px;">
        <!-- Dynamic Option Buttons -->
      </div>
    </div>

    <!-- End Screen (Visible after completing the game) -->
    <div id="endScreen" class="end-screen">
      <div class="end-title">🎉 Great Job! 🎉</div>
      <p style="font-size: 1.2rem;">You completed the Collocation Challenge!</p>
      
      <div class="final-score-box">
        <div>Your Final Score</div>
        <div id="finalScore" class="score-number">0 / 12</div>
      </div>

      <!-- Restart button appears at the bottom -->
      <button id="restartBtn" class="restart-btn" onclick="restartGame()">🔄 Play Again</button>
    </div>
  </div>

  <!-- Audio Elements -->
  <audio id="correctAudio" src="assets/correct.mp3" preload="auto"></audio>
  <audio id="wrongAudio" src="assets/wrong.mp3" preload="auto"></audio>
  <audio id="clappingAudio" src="assets/clapping.mp3" preload="auto"></audio>

  <script>
    // Chapter 16: Collocations Question Bank
    const rawQuestions = [
      {
        category: "Daily Routine",
        question: "You woke up late for school and only have 3 minutes to wash up. Choose the natural word pair:",
        options: ["Fast shower", "Quick shower", "Rapid shower", "Short shower"],
        correct: 1
      },
      {
        category: "Daily Routine",
        question: "You are tidying up your bedroom before heading out to school. What do you do to your bed?",
        options: ["Do the bed", "Set the bed", "Make the bed", "Put the bed"],
        correct: 2
      },
      {
        category: "Food & Taste",
        question: "You ate the most amazing, high-quality pizza for dinner. Which intensifier naturally pairs with 'delicious'?",
        options: ["Extremely delicious", "Utterly delicious", "Heavy delicious", "Absolutely delicious"],
        correct: 3
      },
      {
        category: "Sleep & Dreams",
        question: "You fell asleep at night and experienced a wonderful vision in your sleep. Which expression is natural?",
        options: ["See a dream", "Watch a dream", "Have a dream", "Catch a dream"],
        correct: 2
      },
      {
        category: "Weather",
        question: "It is pouring heavily outside, and you need protective gear. Which pairing describes the right coat?",
        options: ["Strong raincoat", "Powerful raincoat", "Heavy raincoat", "Thick raincoat"],
        correct: 2
      },
      {
        category: "Sports & Records",
        question: "An athlete ran faster than anyone in history during the Olympic long jump. What did the athlete do?",
        options: ["Cut a record", "Broke a record", "Made a record", "Created a record"],
        correct: 1
      },
      {
        category: "Travel & Traffic",
        question: "You are stuck on the highway during rush hour with bumper-to-bumper vehicles. Select the correct pair:",
        options: ["Traffic block", "Traffic jam", "Traffic stop", "Traffic crowd"],
        correct: 1
      },
      {
        category: "Emotions",
        question: "Carla received her test results and discovered she won 1st prize! How does she feel?",
        options: ["Bitterly delighted", "Absolutely delighted", "Deeply delighted", "Strictly delighted"],
        correct: 1
      },
      {
        category: "Memory",
        question: "You remember the exact date and details of the day you met your best friend. Which pair fits best?",
        options: ["Gently remember", "Distinctly remember", "Closely remember", "Firmly remember"],
        correct: 1
      },
      {
        category: "Creativity",
        question: "A writer easily invents colorful characters and creative storylines. The writer possesses a...",
        options: ["Vivid imagination", "Bright imagination", "Broad imagination", "Strong imagination"],
        correct: 0
      },
      {
        category: "Emotions",
        question: "After failing her exam, she felt a strong, deep sense of sadness and regret. Select the natural collocation:",
        options: ["Sour disappointment", "Harsh disappointment", "Bitter disappointment", "Heavy disappointment"],
        correct: 2
      },
      {
        category: "Weather",
        question: "Walking outside on a harsh, freezing winter morning with icy winds: 'It was a ______ morning.'",
        options: ["Utterly cold", "Bitterly cold", "Fully cold", "Deadly cold"],
        correct: 1
      }
    ];

    let gameQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let globalVolume = 1.0;

    // Elements
    const gameScreen = document.getElementById('gameScreen');
    const endScreen = document.getElementById('endScreen');
    const questionCategoryEl = document.getElementById('questionCategory');
    const questionTextEl = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const questionNumEl = document.getElementById('questionNum');
    const progressBarEl = document.getElementById('progressBar');
    const currentScoreEl = document.getElementById('currentScore');
    const finalScoreEl = document.getElementById('finalScore');
    const volumeSlider = document.getElementById('volumeControl');

    // Audio Elements
    const correctAudio = document.getElementById('correctAudio');
    const wrongAudio = document.getElementById('wrongAudio');
    const clappingAudio = document.getElementById('clappingAudio');

    // Initialize Volume Settings
    volumeSlider.addEventListener('input', (e) => {
      globalVolume = parseFloat(e.target.value);
    });

    function playSound(audioObject) {
      if (!audioObject) return;
      audioObject.volume = globalVolume;
      audioObject.currentTime = 0;
      audioObject.play().catch(() => {
        // Handle potential browser autoplay policy restrictions
      });
    }

    // Utility: Shuffle Array
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Start / Restart Game
    function initGame() {
      gameQuestions = shuffleArray(rawQuestions);
      currentIndex = 0;
      score = 0;
      
      currentScoreEl.textContent = score;
      gameScreen.style.display = 'block';
      endScreen.style.display = 'none';

      loadQuestion();
    }

    function loadQuestion() {
      const q = gameQuestions[currentIndex];

      // Update Header HUD
      questionNumEl.textContent = `Question ${currentIndex + 1}/${gameQuestions.length}`;
      progressBarEl.style.width = `${((currentIndex) / gameQuestions.length) * 100}%`;
      
      // Update Question Box
      questionCategoryEl.textContent = q.category;
      questionTextEl.textContent = q.question;

      // Render Options
      optionsContainer.innerHTML = '';
      q.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = optText;
        btn.onclick = () => handleAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });
    }

    function handleAnswer(selectedIndex, selectedBtn) {
      // Disable all buttons to prevent multiple clicks
      const buttons = optionsContainer.querySelectorAll('.option-btn');
      buttons.forEach(btn => btn.disabled = true);

      const q = gameQuestions[currentIndex];

      if (selectedIndex === q.correct) {
        // Correct Answer
        selectedBtn.classList.add('correct');
        score++;
        currentScoreEl.textContent = score;
        playSound(correctAudio);

        // Confetti Burst
        confetti({
          particleCount: 70,
          spread: 60,
          origin: { y: 0.65 }
        });
      } else {
        // Wrong Answer
        selectedBtn.classList.add('wrong');
        buttons[q.correct].classList.add('correct'); // Highlight correct answer
        playSound(wrongAudio);
      }

      // Automatically move to next question after 1.8 seconds
      setTimeout(() => {
        currentIndex++;
        if (currentIndex < gameQuestions.length) {
          loadQuestion();
        } else {
          showEndScreen();
        }
      }, 1800);
    }

    function showEndScreen() {
      progressBarEl.style.width = '100%';
      gameScreen.style.display = 'none';
      endScreen.style.display = 'flex';
      
      finalScoreEl.textContent = `${score} / ${gameQuestions.length}`;
      
      // Play Victory Audio & Confetti
      playSound(clappingAudio);
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.5 }
      });
    }

    function restartGame() {
      initGame();
    }

    // Load game on start
    window.onload = initGame;
  </script>
</body>
</html>
