
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literary Detective: Case File Challenge</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #FFE066 0%, #F72585 50%, #7209B7 100%);
      --card-bg: #FFFFFF;
      --primary: #4361EE;
      --primary-dark: #3A0CA3;
      --accent-yellow: #FFD166;
      --accent-green: #06D6A0;
      --accent-red: #EF476F;
      --badge-bg: #4CC9F0;
      --text-color: #2B2D42;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Fredoka', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
      color: var(--text-color);
      overflow-x: hidden;
    }

    /* ==========================================
       1. SPLASH SCREEN (5 SECONDS)
       ========================================== */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .splash-logo {
      max-width: 280px;
      width: 75%;
      height: auto;
      object-fit: contain;
      animation: pulse 1.5s infinite ease-in-out;
    }

    .splash-timer {
      font-family: 'Nunito', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
    }

    .splash-progress-bar {
      width: 220px;
      height: 12px;
      background: #E2E8F0;
      border-radius: 10px;
      overflow: hidden;
    }

    .splash-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.1s linear;
      border-radius: 10px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* ==========================================
       2. MAIN GAME CONTAINER
       ========================================== */
    .game-container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 24px;
      border: 5px solid #FFFFFF;
      display: none; /* Shown after splash */
      flex-direction: column;
      gap: 18px;
      position: relative;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 3px dashed #E2E8F0;
      padding-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
    }

    .title {
      font-family: 'Nunito', sans-serif;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Volume Control */
    .volume-control {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #F1F5F9;
      padding: 6px 12px;
      border-radius: 20px;
    }

    .volume-slider {
      width: 70px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* HUD Bar */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #E2E8F0;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-green);
      transition: width 0.4s ease;
      border-radius: 10px;
    }

    .score-badge {
      background: var(--accent-yellow);
      padding: 6px 14px;
      border-radius: 20px;
      color: #7A5200;
      box-shadow: 0 3px 0 #E0B034;
      white-space: nowrap;
    }

    /* ==========================================
       3. DETECTIVE PLAYFIELD & CASE FILE
       ========================================== */
    .case-folder {
      background: #FFFBEB;
      border: 3px solid #FCD34D;
      border-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.03);
      position: relative;
    }

    .case-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .case-tag {
      background: #F59E0B;
      color: #FFFFFF;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .case-title {
      font-family: 'Nunito', sans-serif;
      font-size: 1.15rem;
      font-weight: 900;
      color: #B45309;
    }

    .speech-bubble {
      background: #FFFFFF;
      border: 3px solid #CBD5E1;
      border-radius: 18px;
      padding: 16px;
      font-size: 1.05rem;
      line-height: 1.5;
      color: #334155;
      position: relative;
      box-shadow: 0 4px 8px rgba(0,0,0,0.04);
    }

    .instruction-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: #64748B;
      text-align: center;
      margin-top: 4px;
    }

    /* Interactive Evidence Badges (Options) */
    .evidence-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    @media (max-width: 520px) {
      .evidence-grid {
        grid-template-columns: 1fr;
      }
    }

    .evidence-badge {
      background: #FFFFFF;
      border: 3px solid #7209B7;
      border-bottom: 6px solid #5A189A;
      border-radius: 18px;
      padding: 14px 10px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #3A0CA3;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .evidence-badge:hover:not(:disabled) {
      transform: translateY(-3px);
      background: #F3E8FF;
    }

    .evidence-badge:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 3px;
    }

    .evidence-badge:disabled {
      cursor: not-allowed;
      opacity: 0.85;
    }

    .evidence-badge.correct {
      background: var(--accent-green) !important;
      border-color: #059669 !important;
      border-bottom-color: #047857 !important;
      color: white !important;
    }

    .evidence-badge.wrong {
      background: var(--accent-red) !important;
      border-color: #DC2626 !important;
      border-bottom-color: #B91C1C !important;
      color: white !important;
    }

    /* ==========================================
       4. END GAME SCREEN
       ========================================== */
    .end-screen {
      display: none;
      text-align: center;
      padding: 20px 10px;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .end-title {
      font-size: 2.2rem;
      color: var(--primary-dark);
    }

    .final-score-box {
      background: #FFFBEB;
      border: 4px dashed var(--accent-yellow);
      border-radius: 20px;
      padding: 20px 40px;
      margin: 10px 0;
    }

    .score-number {
      font-size: 3rem;
      font-weight: 900;
      color: var(--text-color);
    }

    /* Restart Button */
    .restart-btn {
      background: var(--accent-green);
      color: white;
      border: none;
      border-bottom: 6px solid #059669;
      border-radius: 20px;
      padding: 16px 36px;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 6px 15px rgba(6, 214, 160, 0.4);
    }

    .restart-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .restart-btn:active {
      transform: translateY(2px);
      border-bottom-width: 3px;
    }
  </style>
</head>
<body>

  <!-- 1. Splash Screen -->
  <div id="splashScreen">
    <img src="assets/innovine-logo.png" alt="Innovine Logo" class="splash-logo" onerror="this.src='https://via.placeholder.com/280x100?text=Innovine'">
    <div class="splash-timer">Game starting in <span id="splashCountdown">5</span>s...</div>
    <div class="splash-progress-bar">
      <div id="splashProgress" class="splash-progress-fill"></div>
    </div>
  </div>

  <!-- 2. Main Game Screen -->
  <div id="gameContainer" class="game-container">
    <div class="header">
      <div class="brand">
        <img src="assets/innovine-logo.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
        <div class="title">🕵️ Literary Detective</div>
      </div>
      <div class="volume-control">
        <span style="font-size: 1.1rem;">🔊</span>
        <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.1" value="1">
      </div>
    </div>

    <div id="gameBoard">
      <div class="hud">
        <div style="flex-grow: 1; margin-right: 20px;">
          <span id="caseNum">Case File 1/12</span>
          <div class="progress-bar-bg">
            <div id="progressBar" class="progress-bar-fill"></div>
          </div>
        </div>
        <div class="score-badge">
          🔍 Points: <span id="currentScore">0</span>
        </div>
      </div>

      <div class="case-folder" style="margin-top: 15px;">
        <div class="case-header">
          <span class="case-tag">CLASSIFIED CASE</span>
          <span id="caseCategory" class="case-title">Figure of Speech</span>
        </div>

        <div id="caseScenario" class="speech-bubble">
          Loading suspect report...
        </div>

        <p class="instruction-text">🔍 Click the correct Evidence Badge to classify the literary device:</p>

        <div id="evidenceGrid" class="evidence-grid"></div>
      </div>
    </div>

    <!-- 3. End Game Screen -->
    <div id="endScreen" class="end-screen">
      <div class="end-title">🕵️ Case Closed! 🏆</div>
      <p style="font-size: 1.2rem;">Outstanding work, Master Detective!</p>
      
      <div class="final-score-box">
        <div>Total Detective Score</div>
        <div id="finalScore" class="score-number">0 / 12</div>
      </div>

      <button id="restartBtn" class="restart-btn" onclick="restartGame()">🔄 Re-Open Cases</button>
    </div>
  </div>

  <!-- Audio Elements -->
  <audio id="correctAudio" src="assets/correct 1.mp3" preload="auto"></audio>
  <audio id="wrongAudio" src="assets/wrong 1.mp3" preload="auto"></audio>
  <audio id="clappingAudio" src="assets/clapping 1.mp3" preload="auto"></audio>

  <script>
    // Chapter 17: Figures of Speech Database
    const rawCases = [
      {
        category: "Oxymoron",
        scenario: "A reviewer wrote after a stand-up comedy show: 'The comedian delivered a **seriously funny** performance that had everyone in splits.'",
        options: [
          "Extended Metaphor",
          "Oxymoron",
          "Dramatic Irony",
          "Symbolism"
        ],
        correctIndex: 1
      },
      {
        category: "Irony Type",
        scenario: "An international library, famous for holding millions of books, posts a sign: 'Closed today due to maintenance on reading materials.'",
        options: [
          "Verbal Irony",
          "Dramatic Irony",
          "Situational Irony",
          "Extended Metaphor"
        ],
        correctIndex: 2
      },
      {
        category: "Irony Type",
        scenario: "You step into the classroom dripping wet from a sudden downpour, look at your classmates, grin, and say: 'What a perfect weather day!'",
        options: [
          "Verbal Irony",
          "Situational Irony",
          "Dramatic Irony",
          "Oxymoron"
        ],
        correctIndex: 0
      },
      {
        category: "Irony Type",
        scenario: "In a movie scene, the audience sees a villain put on a disguise. The hero walks in and hands over the key, completely unaware that it is the enemy.",
        options: [
          "Situational Irony",
          "Dramatic Irony",
          "Verbal Irony",
          "Pun"
        ],
        correctIndex: 1
      },
      {
        category: "Wordplay",
        scenario: "The math teacher graded the tests and told her class: 'I called my students average, but that was just **mean**.'",
        options: [
          "Extended Metaphor",
          "Symbolism",
          "Pun",
          "Dramatic Irony"
        ],
        correctIndex: 2
      },
      {
        category: "Wordplay",
        scenario: "A cyclist collapses near the finish line of a race and complains: 'I can't go any further because I am **two-tired**!'",
        options: [
          "Oxymoron",
          "Pun",
          "Symbolism",
          "Situational Irony"
        ],
        correctIndex: 1
      },
      {
        category: "Symbolism",
        scenario: "After a long and harsh battle ends on the field, a white dove glides silently through the sky over the soldiers.",
        options: [
          "Fear and cowardice",
          "Peace and hope",
          "Chaos and storm",
          "Victory in war"
        ],
        correctIndex: 1
      },
      {
        category: "Symbolism",
        scenario: "A character looks at an ancient oak tree that has stood firm through centuries of harsh blizzards and fierce storms.",
        options: [
          "Weakness and decay",
          "Isolation and loneliness",
          "Resilience and strength",
          "Anger and conflict"
        ],
        correctIndex: 2
      },
      {
        category: "Metaphor",
        scenario: "'The classroom was a zoo from the moment the bell rang. Students swung from idea to idea like monkeys, while the teacher acted as the zookeeper.'",
        options: [
          "Oxymoron",
          "Extended Metaphor",
          "Dramatic Irony",
          "Pun"
        ],
        correctIndex: 1
      },
      {
        category: "Metaphor",
        scenario: "'Friendship is a tree. It starts as a small seed needing care, with trust as its roots and laughter as its leaves. If ignored, it will wither.' What is being described?",
        options: [
          "A tree",
          "Friendship",
          "The seed",
          "The leaves"
        ],
        correctIndex: 1
      },
      {
        category: "Irony Type",
        scenario: "An Olympic sprinter who holds world records for speed steps up to the starting line, trips over his own shoelaces, and falls instantly.",
        options: [
          "Situational Irony",
          "Verbal Irony",
          "Dramatic Irony",
          "Extended Metaphor"
        ],
        correctIndex: 0
      },
      {
        category: "Irony Type",
        scenario: "A student looks at a schedule showing five surprise tests scheduled on the exact same day and says: 'Oh, I am absolutely thrilled!'",
        options: [
          "Oxymoron",
          "Verbal Irony",
          "Symbolism",
          "Compound Pun"
        ],
        correctIndex: 1
      }
    ];

    let gameCases = [];
    let currentIndex = 0;
    let score = 0;
    let globalVolume = 1.0;

    // Elements
    const splashScreen = document.getElementById('splashScreen');
    const splashCountdown = document.getElementById('splashCountdown');
    const splashProgress = document.getElementById('splashProgress');
    const gameContainer = document.getElementById('gameContainer');

    const gameBoard = document.getElementById('gameBoard');
    const endScreen = document.getElementById('endScreen');
    const caseCategory = document.getElementById('caseCategory');
    const caseScenario = document.getElementById('caseScenario');
    const evidenceGrid = document.getElementById('evidenceGrid');

    const caseNumEl = document.getElementById('caseNum');
    const progressBarEl = document.getElementById('progressBar');
    const currentScoreEl = document.getElementById('currentScore');
    const finalScoreEl = document.getElementById('finalScore');
    const volumeSlider = document.getElementById('volumeControl');

    // Audio Elements
    const correctAudio = document.getElementById('correctAudio');
    const wrongAudio = document.getElementById('wrongAudio');
    const clappingAudio = document.getElementById('clappingAudio');

    // 1. Splash Screen Timer
    function runSplashScreen() {
      let duration = 5; // 5 seconds
      let elapsed = 0;
      let intervalStep = 100; // ms

      const timer = setInterval(() => {
        elapsed += intervalStep;
        let remainingSeconds = Math.ceil((duration * 1000 - elapsed) / 1000);
        if (remainingSeconds < 0) remainingSeconds = 0;
        
        splashCountdown.textContent = remainingSeconds;
        splashProgress.style.width = `${(elapsed / (duration * 1000)) * 100}%`;

        if (elapsed >= duration * 1000) {
          clearInterval(timer);
          splashScreen.style.display = 'none';
          gameContainer.style.display = 'flex';
          initGame();
        }
      }, intervalStep);
    }

    // Audio Control
    volumeSlider.addEventListener('input', (e) => {
      globalVolume = parseFloat(e.target.value);
    });

    function playSound(audioObject) {
      if (!audioObject) return;
      audioObject.volume = globalVolume;
      audioObject.currentTime = 0;
      audioObject.play().catch(() => {});
    }

    // Utility: Randomize / Shuffle Array
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Game Core
    function initGame() {
      // Randomize questions every time
      gameCases = shuffleArray(rawCases);
      currentIndex = 0;
      score = 0;
      currentScoreEl.textContent = score;

      gameBoard.style.display = 'block';
      endScreen.style.display = 'none';

      loadCase();
    }

    function loadCase() {
      const c = gameCases[currentIndex];

      // Update HUD
      caseNumEl.textContent = `Case File ${currentIndex + 1}/${gameCases.length}`;
      progressBarEl.style.width = `${((currentIndex) / gameCases.length) * 100}%`;

      // Update Case Folder
      caseCategory.textContent = c.category;
      caseScenario.innerHTML = c.scenario;

      // Render Options
      evidenceGrid.innerHTML = '';
      c.options.forEach((optText, index) => {
        const badge = document.createElement('button');
        badge.className = 'evidence-badge';
        badge.innerHTML = `🛡️ ${optText}`;
        badge.onclick = () => handleOptionSelect(index, badge);
        evidenceGrid.appendChild(badge);
      });
    }

    function handleOptionSelect(selectedIndex, badgeBtn) {
      const allBadges = evidenceGrid.querySelectorAll('.evidence-badge');
      allBadges.forEach(b => b.disabled = true);

      const c = gameCases[currentIndex];

      if (selectedIndex === c.correctIndex) {
        // Correct Choice
        badgeBtn.classList.add('correct');
        score++;
        currentScoreEl.textContent = score;
        playSound(correctAudio);

        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.65 }
        });
      } else {
        // Wrong Choice
        badgeBtn.classList.add('wrong');
        
        // Highlight correct option
        allBadges[c.correctIndex].classList.add('correct');
        playSound(wrongAudio);
      }

      // Automatically move to next question after 1.8s
      setTimeout(() => {
        currentIndex++;
        if (currentIndex < gameCases.length) {
          loadCase();
        } else {
          showEndScreen();
        }
      }, 1800);
    }

    function showEndScreen() {
      progressBarEl.style.width = '100%';
      gameBoard.style.display = 'none';
      endScreen.style.display = 'flex';
      
      finalScoreEl.textContent = `${score} / ${gameCases.length}`;

      playSound(clappingAudio);
      confetti({
        particleCount: 160,
        spread: 100,
        origin: { y: 0.5 }
      });
    }

    function restartGame() {
      initGame();
    }

    // Start App on Page Load
    window.onload = runSplashScreen;
  </script>
</body>
</html>
